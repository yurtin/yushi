<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>鱼事</title>
<style>
/* ==========================================================================
   设计令牌 —— 逐条照抄 pidanai.com 首页（assets/pdaim-home/pdaim-styles.css）
   亮色 :root / 暗色 html[data-theme="dark"]
   ========================================================================== */
:root{
  color-scheme:light;
  --bg:#ffffff; --fg:#070707;
  --muted:rgba(7,7,7,.58); --faint:rgba(7,7,7,.38);
  --line:rgba(7,7,7,.08); --line2:rgba(7,7,7,.16);
  --pill:rgba(7,7,7,.045); --pill-hover:rgba(7,7,7,.075);
  --dot:rgba(7,7,7,.34);
  /* 折射色球：原站首页 body::after 的五色 */
  --refraction-opacity:.72;
  --refraction-cyan:rgba(71,169,255,.2);
  --refraction-violet:rgba(153,111,255,.18);
  --refraction-pink:rgba(255,108,174,.17);
  --refraction-mint:rgba(83,221,184,.15);
  --refraction-warm:rgba(255,192,98,.14);
  --glass-hi:rgba(255,255,255,.8);
  --glass-edge:rgba(0,0,0,.18);
  /* 底栏玻璃那层极淡的「亮膜」。玻璃必须几乎无色 —— 它的存在感来自
     背透（模糊/提亮/加饱和）+ 边缘受光 + 底部投影，不来自填充色。
     上一版把 --fg 掺进去做成灰板，是错的（见 .bar-glass 的注释）。 */
  --bar-sheen:rgba(255,255,255,.26);
  /* 跟手拖拽期间用的"更实"配方。用户原话：「这导致能明显看出是外边的框在移动，而不是
     单纯的一个实色物体」—— 拖动时栏体应当读作**一件实心物体**在走，而不是一片还在折射
     背后内容的玻璃框。所以拖拽态把壁面白膜加重、并摘掉折射（见 .capsule.dragging）。 */
  --bar-sheen-solid:rgba(255,255,255,.60);
  /* 边缘光：白高光在中性页面上看不见，所以暗边必须够用，才能在白底上读出轮廓。
     v2.5 加强：用户反馈"跟背景融为一体、太浅了、分不出" —— 玻璃的可见性只能靠
     **边缘的厚度**（亮边 + 暗边 + 下方柔影），不能靠填充色（那会变成灰板）。 */
  --bar-rim-hi:rgba(255,255,255,.92);
  --bar-rim-lo:rgba(0,0,0,.30);
  --bar-cast:rgba(0,0,0,.22);
  --ok:#2f8f5b; --danger:#c8443c; --accent:#2f6fed;
  /* 键盘焦点环。刻意**不用** --accent：那个蓝是整个界面里最鲜艳的一笔，
     拿它描一圈 2px 在米白的卡片上非常跳。焦点环要的是"看得见"而不是"抢戏"，
     所以用中性灰 —— 和全站的描边/文字同一套灰阶，键盘用户一样能找到位置。 */
  --ring:rgba(7,7,7,.42);
  /* 按下反馈的灰罩色（--tap 原先是 WebView tap-highlight 的颜色，
     现在那层直角高亮已经整体关掉，这个色改由 :active 的 background-image 灰罩使用 ——
     浅色下是"压灰"，深色下是"提亮"，都跟这套黑白灰同一套语言）。 */
  --tap:rgba(7,7,7,.07);
  /* 紧急度色阶：灰 → 黄 → 橙 → 红 → 深红（清单页条目前的小点 / 时间轴的节点） */
  --u0:#c4c4c4; --u1:#dfa300; --u2:#e2741c; --u3:#c8443c; --u4:#7a1d1d;
  --font-main:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --font-display:"Arial Black",Impact,"PingFang SC","Microsoft YaHei",Inter,sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"JetBrains Mono","Fira Code",monospace;

  /* ---------- 动效令牌：全站缓动/时长的唯一真源 ----------
     这些值都是从下面各处原样搬上来的，一个数字都没改，所以视觉零差异。
     好处是以后想整体调手感（全站再快一点、再弹一点）只改这一处，
     不用再满文件搜「哪个 .18s 是哪个」。
     只收「被重复写了两遍以上」的值；只出现一次的时长（.34s / .76s / 500ms 之类）
     留在原地，硬塞成一个令牌反而更难读。 */
  --mo-fast:.16s;                       /* 小元素：描边、hover 换色（8 处） */
  --mo-quick:.18s;                      /* 按钮、pill、导航（12 处） */
  --mo-base:.24s;                       /* 吐司进出 */
  --mo-slow:.3s;                        /* 吸顶条投影 */
  --mo-soft:cubic-bezier(.2,.9,.25,1);  /* 本站的"弹出感"：弹层、吐司、吸顶条（3 处） */
  /* 尺寸类过渡（高度塌陷 / 展开）单独一条曲线。
     --mo-soft 前段太陡（约 14% 的时间就走完 61% 的行程），拿它去做小元素很"弹"，
     但一个几百 px 高的块这么走就成了"先跳一下、再慢慢爬"。这条两端匀一些。 */
  --mo-size:cubic-bezier(.4,0,.2,1);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#050505; --fg:#ffffff;
  --muted:rgba(255,255,255,.62); --faint:rgba(255,255,255,.4);
  --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.22);
  --pill:rgba(255,255,255,.08); --pill-hover:rgba(255,255,255,.14);
  --dot:rgba(255,255,255,.34);
  --refraction-opacity:.56;
  --refraction-cyan:rgba(72,178,255,.22);
  --refraction-violet:rgba(158,120,255,.21);
  --refraction-pink:rgba(255,116,184,.19);
  --refraction-mint:rgba(80,224,190,.17);
  --refraction-warm:rgba(255,194,105,.16);
  --glass-hi:rgba(255,255,255,.8);
  --glass-edge:rgba(0,0,0,.42);
  /* 深色下玻璃的亮膜要比浅色更淡（近黑底上一点点白就够读）；边缘则反过来 ——
     暗边在深色底上根本不存在，所以深色全靠亮边勾轮廓。 */
  --bar-sheen:rgba(255,255,255,.075);
  /* 拖拽态"更实"配方（浅色对应 .60）：深色下提到 .22 —— 近黑底上再高就会糊成一块白板，
     .22 刚好让栏体读作"一件东西"而不是"一片还在折射的玻璃"。 */
  --bar-sheen-solid:rgba(255,255,255,.22);
  --bar-rim-hi:rgba(255,255,255,.82);
  --bar-rim-lo:rgba(0,0,0,.38);
  --bar-cast:rgba(0,0,0,.55);
  --ok:#54b57f; --danger:#e2685f; --accent:#5b8ef5;
  --ring:rgba(255,255,255,.55);
  --tap:rgba(255,255,255,.1);
  /* 暗色下深红不能太暗，否则在黑底上直接看不见，取「更沉的红」而不是「更黑的」 */
  --u0:rgba(255,255,255,.32); --u1:#e4c04c; --u2:#f0913c; --u3:#e2685f; --u4:#bb2f26;
}
/* 切换主题时全站平滑过渡（原站 html.theme-changing）
   注意：这里刻意不含 filter / backdrop-filter —— 它们会被应用到每一个元素上，
   列表里上百条时会同时启动几百个模糊过渡，切主题直接卡死几百毫秒。 */
html.theme-changing *,html.theme-changing *::before,html.theme-changing *::after{
  transition:background-color 440ms ease,background 440ms ease,border-color 440ms ease,
             color 440ms ease,box-shadow 440ms ease,fill 440ms ease,opacity 440ms ease !important;
}
/* ★ v3.37 总闸：页面**永远不允许横向滚动**。
   起因是一个具体的 bug（.section-intro::before 往两侧探 22px，而外层只留 18px 的边距 →
   多出 4px，App 里就能把页面往左右拖、还会画出横向滚动条）。只修那一处不够 ——
   任何"往左右探出去一点点"的装饰都可能再犯，而这里一旦能横向滚，整页立刻是"网页"观感。
   写法说明：只关 x、不关 y。按 CSS 规则，根元素 overflow-x:hidden + overflow-y:visible 时
   overflow-y 会按 auto 计算 —— 正是我们要的"竖着照常滚、横着死"。
   不要改成 `overflow:hidden`（那把竖向滚动也一起关了，长清单就滚不动了）。 */
html{overflow-x:hidden}
*,*::before,*::after{box-sizing:border-box}
html{
  min-height:100%;scroll-behavior:smooth;
  /* ★ v3.37（用户："它滑动的时候，侧边明显有那个滑动条，左右滑的时候底下也有那个灰色的
     拖动条…这不就是把一个网页嵌套进来了吗"）：手机上永远不该出现页面级滚动条。
     这里把 html/body 的滚动条整个关掉（原生侧还有 web.setVerticalScrollBarEnabled(false)，
     两道一起堵）。**只作用在 html/body** —— 标签条 .pillstrip 自己那条 6px 细条是有用的
     （提示这一条能横向滚），它的选择器更具体，不会被盖掉。 */
  scrollbar-width:none;
  /* 安卓 WebView 默认的点击高亮是一大块**直角矩形**：不跟 border-radius、超出内边距，
     用户截图里"按下长期分区弹出一整条规整灰矩形、跟圆角边框完全两回事"就是它。
     这里直接关掉（transparent），按下反馈改由下面 :active 的 background-image 灰罩负责 ——
     灰罩画在元素自己的盒子里，圆角、内边距全部自动继承。
     写在 html 上是因为这个属性会被后代继承，一条就覆盖全站。 */
  -webkit-tap-highlight-color:transparent;
  /* 长按不选中文字、也不弹「拷贝 / 查询」那个系统菜单。
     手机截图反馈：长按一条待办会把整行文字拖蓝选中，手感和原生 App 完全不一样。
     和上面 tap-highlight 同一个道理 —— 写在 html 上一继承就覆盖全站，不用逐个元素加。
     输入类元素必须放开，否则输入框里没法选字、没法拖光标，见下面那条。 */
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}
html::-webkit-scrollbar,body::-webkit-scrollbar{width:0;height:0}
/* 滚动条占位只在桌面鼠标环境才需要（弹层锁滚动时防止内容横向位移）。
   触摸设备上 scrollbar-gutter 会白占一条宽度 —— 实测 430 宽的窗口里内容只有 511，
   那 15px 就是它预留的，看起来就是"页面右边少一条"。 */
@media (hover:hover) and (pointer:fine){
  html{scrollbar-gutter:stable}
}
/* 输入类反过来必须能选中文字：user-select:none 会让输入框里没法拖光标、没法选一段改掉。
   contenteditable 连子节点一起放开，免得富文本里选中一半被截断。 */
input,textarea,select,[contenteditable],[contenteditable] *{
  -webkit-user-select:text;user-select:text;-webkit-touch-callout:default;
}
body{
  min-height:100vh;margin:0;
  /* 用 clip 而不是 hidden：hidden 会创建滚动容器，令下面的 position:sticky 失效 */
  overflow-x:clip;
  background-color:var(--bg);color:var(--fg);
  font-family:var(--font-main);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.mono{font-family:var(--font-mono)}

/* ---------- 折射色球场：原站 body::after 的五色模糊球，缓慢漂移 ---------- */
body::after{
  content:"";position:fixed;inset:-18vh -14vw;z-index:0;pointer-events:none;
  opacity:var(--refraction-opacity);
  /* 渐变停止点刻意写宽（色块边缘平滑过渡到透明），等效替代原来的 blur(88px)：
     运行时模糊在软件渲染下是每帧全屏 CPU 重算，是滚动卡顿的最大来源；
     预软化后这层只是一张普通渐变贴图，静止时栅格化一次就不再花钱。 */
  background:
    radial-gradient(circle,var(--refraction-cyan) 0 20%,transparent 50%),
    radial-gradient(circle,var(--refraction-pink) 0 18%,transparent 48%),
    radial-gradient(circle,var(--refraction-violet) 0 20%,transparent 52%),
    radial-gradient(circle,var(--refraction-mint) 0 16%,transparent 46%),
    radial-gradient(circle,var(--refraction-warm) 0 18%,transparent 50%);
  background-size:42vmax 42vmax,38vmax 38vmax,46vmax 46vmax,34vmax 34vmax,50vmax 50vmax;
  background-position:8% 14%,84% 8%,78% 78%,18% 82%,46% 42%;
  background-repeat:no-repeat;
  transform:scale(1.05);
}
html[data-theme="dark"] body::after{
  /* 不叠加 mix-blend-mode: 全屏混合模式会强制每帧额外合成，且对黑色背景收益很小 */
  opacity:calc(var(--refraction-opacity) * 1.15);
}

/* ---------- 玻璃面板：原站 .pdaim-theme.css 的玻璃配方 ----------
   分两级：
   1) 默认「实底玻璃」——保留 inset 高光、::before 渐变、投影这些形状语言，
      但不用 backdrop-filter。原因：backdrop 模糊在软件渲染（内嵌预览 iframe）
      下每帧都要全价读回屏幕内容重采样，哪怕元素再小，一个就能吃掉一半帧率；
      而面板背后只有柔和色球背景，本没有锐利内容可模糊 —— 实底与真模糊
      视觉上几乎不可区分，代价却是零。
   2) 检测到真 GPU（html.gpu-render）时升级为原站完整配方（54% 底 + blur）。
   浮层（悬浮头/吸顶录入条）会盖在列表文字上，实底模式下加浓到 92% 防文字透出。 */
.glass{
  position:relative;overflow:hidden;isolation:isolate;
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  box-shadow:
    inset 1px -1px .75px -1px color-mix(in srgb,var(--glass-hi) 40%,transparent),
    inset -1px 1px .75px -1px color-mix(in srgb,var(--glass-hi) 34%,transparent),
    inset 0 0 1px color-mix(in srgb,var(--glass-edge) 16%,transparent),
    0 14px 46px color-mix(in srgb,var(--glass-edge) 28%,transparent);
}
.glass::before{
  content:"";position:absolute;inset:1px;z-index:0;border-radius:inherit;pointer-events:none;
  background:
    linear-gradient(135deg,color-mix(in srgb,var(--glass-hi) 18%,transparent),transparent 36%,transparent 76%),
    linear-gradient(315deg,color-mix(in srgb,var(--glass-edge) 5%,transparent),transparent 44%);
  opacity:.42;
}
.glass>*{position:relative;z-index:1}
/* ★ 3.5.5（用户："把以下元素的材质都弄成偏玻璃质感的，跟底下导航栏相似：
   ① 粘贴导入 ② 统计页面和清单页面的『布局调整』按钮"）：
   复用 .glass 那套材质数值（半透明底 + backdrop 模糊 + 内高光 + 柔影），但不改圆角/尺寸 ——
   这三颗小控件各有自己的形状（胶囊），只借"材质"。
   ⚠️ backdrop-filter 是全应用最贵的一项，所以：① 只在 gpu-render 下开模糊
   （和 .glass 同一道门：软件渲染时纯靠底色，文字不会糊也不会透）；
   ② 面积只有几十像素，比整条底栏便宜得多。 */
html.gpu-render .glass-chip,html.gpu-render .seg.glass-chip{
  background:color-mix(in srgb,var(--bg) 54%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.16);
  backdrop-filter:blur(14px) saturate(1.16);
}
html.soft-render .glass-chip,html.soft-render .seg.glass-chip{background:color-mix(in srgb,var(--bg) 92%,transparent)}
/* 用 `.seg.glass-chip` 这种复合选择器压过 `.seg` 自己的 pill 底色/描边（权重同为 0,2,0，
   靠写在后面生效）—— 只写 `.glass-chip` 的话会被 `.seg` 的 background 顶掉。 */
.glass-chip,.seg.glass-chip,.btn.ghost.glass-chip{
  background:color-mix(in srgb,var(--bg) 84%,transparent);
  border:1px solid color-mix(in srgb,var(--glass-edge) 42%,transparent);
  box-shadow:
    inset 1px -1px .75px -1px color-mix(in srgb,var(--glass-hi) 40%,transparent),
    inset -1px 1px .75px -1px color-mix(in srgb,var(--glass-hi) 34%,transparent),
    0 8px 22px color-mix(in srgb,var(--glass-edge) 26%,transparent);
}
.capture{background:color-mix(in srgb,var(--bg) 92%,transparent)}
/* 真 GPU：升级为原站完整玻璃（14px 而非原站 18px：一屏内玻璃面十余个，
   模糊半径直接决定每个的采样量，降到视觉无差、代价小四成） */
html.gpu-render .glass{
  background:color-mix(in srgb,var(--bg) 54%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.16);
  backdrop-filter:blur(14px) saturate(1.16);
}
html.gpu-render .capture{
  background:color-mix(in srgb,var(--bg) 54%,transparent);
}

/* ---------- 页签图标：20px 线性图标，stroke 用 currentColor ----------
   底栏的 3 个页签（.tab，见文件末尾「底部导航」一段）沿用这套图标。
   换文字色图标自动跟着变，不用另写 fill/stroke 规则；aria-label 负责读屏语义。 */
.np-ico{
  width:20px;height:20px;display:block;
  fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;
}
/* 主题开关已搬到设置页（见 renderSettings 的「主题」一行），顶栏那颗圆点一并撤掉。
   滑动指示块 .nav-glide 也随顶栏一起移除 —— 底栏 3 个页签等宽，当前页用 .on 高亮即可，
   没有"宽度不等要滑动对齐"的问题。 */
.backup{font-size:12px;color:var(--faint);white-space:nowrap}
/* 「该备份了」不再用红字（用户原话："你不要直接用红字展示。那显得跟其他的很不一样，
   整体风格也不统一"）。改成中性描边小胶囊 + 略亮的次级文字色 —— 用"形态"表达轻重，
   不用颜色；绝不引用 --danger 或任何高饱和色。 */
.backup.due{padding:3px 9px;border:1px solid var(--line2);border-radius:999px;color:var(--muted)}

/* ---------- 页面骨架 ---------- */
.page-shell{position:relative;z-index:2;
  /* 屏底胶囊 + 悬浮圆钮占位：最后一张卡 / 录入提示不能被底栏挡住。
     胶囊约 58px 高、悬浮球向上凸约 28px、再加 10px 外距与安全区，留 130px 才稳妥。 */
  padding-bottom:calc(130px + max(env(safe-area-inset-bottom), var(--sab,0px)));;
  /* v3.3 全面屏适配（用户："我的手机是全面屏的，这应用好像不太适配全面屏"）：
     页面顶部必须吃下状态栏 / 挖孔的安全区，否则第一行会顶到状态栏下面。
     env() 只在 WebView 真的上报安全区时非 0（Android 需 edge-to-edge、iOS 需 viewport-fit=cover），
     所以给一个 12px 的下限：上报了用真值，没上报也有呼吸位，两种机型都不吃亏。 */
  padding-top:max(env(safe-area-inset-top),var(--sat,12px))}
/* 首屏（原站 .hero，按"平衡"压到 ~44vh 而不是满屏） */
.hero{
  position:relative;isolation:isolate;
  /* 顶部图标行（第二批新增）已替首屏承担刘海/灵动岛的安全区，这里只留一点点呼吸位 */
  padding:clamp(18px,3vh,36px) 24px clamp(22px,4vh,44px);
  text-align:center;overflow:hidden;
}
/* 点阵网格（原站 body::before，只在首页出现） */
.hero::before{
  content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(circle at center,var(--dot) 0 1.05px,transparent 1.18px);
  background-size:38px 38px;
  -webkit-mask-image:radial-gradient(circle at 50% 34%,#000 0 22%,rgba(0,0,0,.72) 46%,transparent 78%);
          mask-image:radial-gradient(circle at 50% 34%,#000 0 22%,rgba(0,0,0,.72) 46%,transparent 78%);
  opacity:.9;
}
.hero .eyebrow{
  margin:0 0 clamp(16px,2.4vh,26px);color:var(--muted);
  font-size:12px;font-weight:800;letter-spacing:.34em;text-transform:uppercase;
}
/* 粗细混排大标题（原站 .hero-copy h1 / .title-strong / .title-light） */
.hero h1{
  margin:0;font-size:clamp(38px,6.4vw,104px);line-height:.88;letter-spacing:-.075em;font-weight:400;
}
.title-strong{font-family:var(--font-display);font-weight:900;letter-spacing:-.05em}
.title-comma{display:inline-block;padding:0 .06em;font-family:var(--font-display);font-weight:900}
.title-light{font-style:italic;font-weight:500;letter-spacing:-.07em;color:var(--muted)}
.hero .subtitle{margin:clamp(14px,2.2vh,24px) 0 0;color:var(--muted);font-size:clamp(14px,1.5vw,18px);font-weight:600}

/* ---------- 极速录入（吸顶） ---------- */
/* 录入条吸顶：顶栏撤掉后，贴着视口顶部即可（安全区之上）。只在录入界面出现。 */
.capture-wrap{position:sticky;top:0;z-index:60;padding:0 18px}
.capture-wrap .inner{max-width:1240px;margin:0 auto}
.capture{
  display:flex;align-items:center;gap:10px;
  padding:11px clamp(14px,2vw,22px);border-radius:9999px;
  transition:box-shadow var(--mo-slow) ease,transform var(--mo-slow) var(--mo-soft);
}
.capture.is-stuck{box-shadow:inset 1px -1px .75px -1px color-mix(in srgb,var(--glass-hi) 46%,transparent),
  inset -1px 1px .75px -1px color-mix(in srgb,var(--glass-hi) 38%,transparent),
  0 20px 60px color-mix(in srgb,var(--glass-edge) 40%,transparent)}
/* 输入区：**整条录入条就是输入框本身**，内部不铺任何底色。
   上一版为了让"输入框看得见"，给它加了一块极淡的 --fg 灰面 + 12px 圆角；
   实测出来是「白条里再套一块灰块」——读起来是两个盒子，用户原话：
   "你这个输入框里边就不用加粗了呀，没必要啊，就直接一个白色的就行了"。
   所以把灰面整个去掉：录入条自己是白的，输入区就是它。
   聚焦提示只靠**原生闪烁光标**（caret-color），不画框、不铺面。 */
.capture input{
  flex:1;min-width:0;border:0;outline:0;color:var(--fg);
  font-family:inherit;font-size:16px;padding:7px 2px;
  background:transparent;
  caret-color:var(--fg);
}
.capture input::placeholder{color:var(--faint)}
/* 录入条右侧的确认键：从「一颗 29×26 的 kbd 文字按钮」换成**圆形对号**（用户要求：
   "别设置得这么小"、"别用'存'了换对号"、"不要用宋体，线条和角要圆润，弄成圆形，
   并注意跟搜索框匹配边距"）。所以：SVG 路径描边（不依赖任何字体）+ 圆头圆角 +
   border-radius:50% + 32px 方径，与录入条 11px 内边距配起来上下留白刚好。 */
.go-btn{
  appearance:none;-webkit-appearance:none;border:0;padding:0;cursor:pointer;flex:0 0 auto;
  width:32px;height:32px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--fg);color:var(--bg);
  transition:transform var(--mo-quick) ease,opacity var(--mo-quick) ease;
}
.go-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.3;
  stroke-linecap:round;stroke-linejoin:round}
.go-btn:active{transform:scale(.9)}
.go-btn:disabled{opacity:.4;cursor:default}
@media (hover:hover){
  .go-btn:hover{opacity:.86}
}
/* 录入条下方：标签框 + 提示框，各自独立、居中，不吸顶（随页面滚走） */
.entry-extra{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  margin:10px auto 0;padding:0 18px;
}
.entry-box{
  border:1px solid var(--line2);border-radius:16px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  padding:9px 15px;width:fit-content;max-width:100%;
  /* 框体本身（选中标签后里面多一颗 pill、写法提示展开）的变化也走同一条柔和过渡，
     否则内层柔了、外层硬切，看着更割裂。 */
  transition:border-color var(--mo-base) var(--mo-soft),background var(--mo-base) var(--mo-soft),
             box-shadow var(--mo-base) var(--mo-soft);
}
.entry-tags{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0}
.et-l{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--faint);margin-right:2px;flex:0 0 auto}
/* 录入区「已选 N」的小角标 */
.et-n{
  font-size:10.5px;font-weight:800;color:var(--accent);margin-right:2px;flex:0 0 auto;
  border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:999px;padding:1px 7px;
}
/* 写法提示：可折叠。默认收起 —— 全展开十几个 chip 要占三行，太占地方。
   padding 交给 summary / .hint-chips 各自控制，所以这里归零 */
.hint{padding:0;overflow:hidden}
/* justify-content:center 是必须的：收起时这个盒子是 fit-content（贴着「写法提示」那几个字），
   一展开就被 chips 撑成 700 多 px 宽，summary 默认靠左 → 点开的一瞬间那行字会从中间跳到左边。
   居中之后 summary 的水平中心永远和盒子中心重合，也就是永远停在「展开前」那个位置。 */
.hint>summary{
  cursor:pointer;list-style:none;user-select:none;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:9px 15px;font-size:12px;font-weight:800;color:var(--muted);
  transition:color .2s ease;
}
.hint>summary::-webkit-details-marker{display:none}
.hint>summary:hover{color:var(--fg)}
.hint[open]>summary{color:var(--fg)}
.hb-ico{
  width:0;height:0;flex:0 0 auto;opacity:.75;
  border-left:5px solid currentColor;
  border-top:4px solid transparent;border-bottom:4px solid transparent;
  transition:transform .22s cubic-bezier(.2,.8,.2,1);
}
.hint[open] .hb-ico{transform:rotate(90deg)}
.hb-n{font-size:11px;font-weight:800;color:var(--faint);border:1px solid var(--line2);border-radius:999px;padding:1px 7px}
.hb-open{font-size:11px;font-weight:600;color:var(--faint)}
.hint[open] .hb-open{display:none}
.hint-chips{
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
  font-size:12px;color:var(--faint);padding:0 15px 12px;max-width:720px;
}
.hint-chips span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.hint-chips b{color:var(--muted);font-weight:700}

/* 录入界面（entry）才有大标题 + 录入条 + 标签框 + 提示框；清单/统计/设置都不要
   （body[data-view] 由 refresh 同步）。清单页顶部只留搜索 + 筛选 + 分区。 */
body:not([data-view="entry"]) .hero,
body:not([data-view="entry"]) .capture-wrap,
body:not([data-view="entry"]) .entry-extra{display:none}
/* 录入界面的 #view 留空，不需要它占位置 */
body[data-view="entry"] .pdaim-section{display:none}
/* 统计 / 设置没有 hero，顶部只需一点呼吸位（顶栏已撤，不用再让 96px） */
body[data-view="stat"] .pdaim-section,
body[data-view="settings"] .pdaim-section{padding-top:clamp(18px,3vh,36px)}

/* 「外观 → 页面说明文字」关掉时，各页标题下面那段解释文案整段收起。
   开关状态只写在 body 的一个属性上（applyHelp 同步），不在三个视图里各写一份，
   所以切换时不需要重渲染、页面也不会跳。
   注意这里收的是**说明性文字**：条数 / 逾期这类事实数字不在其中
   （时间轴那行已单独挪到列表上方，见 .tl-meta），各栏的空态提示也不受影响。 */
body[data-help="off"] .intro-note{display:none}

/* ---------- 区块（原站 .pdaim-section / .section-intro / .section-kicker） ---------- */
.pdaim-section{
  position:relative;z-index:2;
  width:min(1240px,calc(100% - 36px));margin:0 auto;
  padding:clamp(64px,9vw,116px) 0 clamp(56px,7vw,90px);
}
.section-intro{margin:0 auto;text-align:center;max-width:1180px}
.section-kicker{margin:0 0 18px;color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.28em;text-transform:uppercase}
.section-intro h2{
  margin:0;font-family:var(--font-display);font-weight:900;
  font-size:clamp(34px,5.6vw,88px);line-height:.9;letter-spacing:-.065em;
}
.section-intro p{max-width:720px;margin:20px auto 0;color:var(--muted);font-size:clamp(14px,1.5vw,18px);line-height:1.8;font-weight:600}

/* 滚动揭示（原站 .reveal-on-scroll，数值照抄）。
   ⚠️ 这里刻意用 animation 而不是 transition —— 是手机上真看出来才改的：
   `.feature-card` 自己声明了 `transition:transform 320ms,box-shadow 320ms`，
   它在本文件里比这条规则更靠后、权重又相同，而 transition 是**简写**，会整体覆盖，
   于是卡片的 opacity/filter 过渡被换掉，入场变成"咔"一下直接出现；
   同一页里没有 transition 的 .section-intro 却老老实实淡入 —— 一个页面两种节奏，
   看起来就是"统计页一进去那个布局条和卡片特别生硬"。
   （实测：切到统计页后逐帧采样，intro 从 0 走到 1 用了 760ms，
   卡片则在 30ms 内从 0 跳到 1。）
   换成 animation 就从这条层叠链里摘出来了：动画不参与 transition 的覆盖，
   组件自己的 hover 过渡不受影响，入场该播还是播。

   fill-mode 用 backwards 而不是 both：延迟期间保持"隐藏起点"，
   动画播完自动失效、元素回落自身样式。用 both 会把终态的 transform 一直挂着，
   卡片 hover 的 translateY(-8px) 就再也抬不起来了。 */
.reveal-on-scroll{opacity:0;will-change:opacity,transform,filter}
.reveal-on-scroll.is-visible{
  opacity:1;
  animation:rvIn .76s cubic-bezier(.16,1,.3,1) backwards;
  animation-delay:var(--delay,0ms);
}
@keyframes rvIn{
  from{opacity:0;transform:translateY(54px) scale(.98);filter:blur(10px)}
  to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}

/* ---------- 工具条 ----------
   两行：第一行＝搜索 + 粘贴导入 + 备份；第二行＝标签条 + 右端的加标签/管理按钮。
   标签条自成一栏，标签再多也只在自己那一行里横向滚，不会把别的元素挤下去。
   注意行 class 不能叫 .row —— 页面里别处（pidanai 那套壳）已经有 .row，
   且 820px 断点把它改成 flex-direction:column，撞上就会在小屏下整行变竖排。 */
/* v3.36（用户："筛选抽屉收起的时候没有动画"）：抽屉的开合不再用 display:none 硬切 ——
   display 不参与过渡，收起必然是"一帧消失"。
   最终方案：**opacity / margin 交给 CSS 过渡，高度由 JS 逐帧补间写 inline max-height**。
   为什么高度不用 CSS 过渡（三条都实测过，全都不成立）：
     ① `max-height` 写死一个大数（如 320px）：可见高度 = min(内容高, max-height)，
        max-height 涨到内容高那一刻就已经满高了（全程约 29% 处），剩下 71% 什么都没发生 ——
        还是"一下弹出来"；
     ② `max-height:var(--x)`（值里带自定义属性）：自定义属性同帧变化时 Chrome 不建过渡
        —— 实测点一下抽屉 `getAnimations()` 只有 opacity，max-height 一帧到位；
     ③ `grid-template-rows:1fr ⇄ 0fr`（理论上最干净、与内容高无关）：在这个 Chrome 里同样
        不建过渡（animsAtStart 只有 opacity）；
     ④ 就算用 inline px：**在真实 click 回调里**写 inline max-height 也不建过渡（实测
        afterComputed 直接是 92px、anims 只有 opacity），而在同一次 Runtime.evaluate 里
        手写同样的三步却会建 —— 这种"依赖调用时机"的行为不能交付。
   所以高度改成自己的 rAF 补间（项目里底栏轮廓本来就是这么做的）：起止值都自己控制，
   不依赖浏览器的过渡创建条件。opacity/margin 仍走 CSS（它们一直正常）。 */
/* ★ 3.5.4（用户："点开筛选之后，里面的标签等内容跟底下要保持一定的距离，至少是现在的两倍"）：
   下外边距 16 → 34（两倍多一点）。展开抽屉时，标签条和它下面的列表就不至于贴在一起。 */
.toolbar{display:block;overflow:hidden;margin:clamp(34px,5vw,58px) 0 34px;
  transition:opacity var(--mo-base) ease,margin var(--mo-base) var(--mo-soft)}
.tb-wrap{display:flex;flex-direction:column;gap:16px}
/* v3.6（用户："清单界面上头是标题、下面搜索、标签导入、还有分区时间轴，感觉怎么这么多"）：
   工具行默认**收进右上角抽屉**，标题行以下直接是列表 —— 顶部从 4 行压到 1 行。
   点 .filter-fab 给 body 挂 .tools-open 展开；只作用于清单页，别的页面不受影响。 */
/* v3.13（用户："宽度和『要做』两个字那么宽，高度是它的一半到 1/3" +
   "『今天要做什么』距上面留一指宽，大概 2cm"）：抽屉开关做成小药丸，放在标题**下面**
   （它现在渲染在列表模板里、紧跟 section-intro，不再是静态 DOM 排在标题前面）。 */
.filter-bar{display:flex;align-items:center;justify-content:center;gap:3px;
  width:52px;height:22px;margin:14px auto 2px;
  appearance:none;-webkit-appearance:none;border:0;cursor:pointer;
  padding:0;border-radius:9999px;
  background:color-mix(in srgb,var(--fg) 5%,transparent);
  color:var(--muted);font:inherit;font-size:11px;font-weight:700;letter-spacing:.02em;
  transition:background var(--mo-quick) ease,color var(--mo-quick) ease}
.filter-bar:hover{color:var(--fg)}
.filter-bar:active{background-color:var(--pill-hover)}
.filter-bar .fb-chev{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
body.tools-open .filter-bar{color:var(--fg)}
body.tools-open .filter-bar .fb-chev{transform:rotate(180deg)}
/* 收起态：高度塌到 0（视觉上是"像抽屉一样收上去"），不是 display:none。
   animation:none 是必须的：渲染时 .toolbar 带着 reveal-on-scroll，若抽屉是关着的，
   入场动画会先把 opacity 拉到 1、跑完又落回 0 —— 正好是用户不许出现的"闪一下再消失"。 */
body[data-view="list"]:not(.tools-open) .toolbar{
  max-height:0;opacity:0;margin-top:0;margin-bottom:0;pointer-events:none;animation:none}
/* 标题与页面顶部之间留出一指宽（≈2cm ≈ 72px）：用户连着两轮说"贴得太近"。 */
body[data-view="list"] .section-intro{margin-top:72px}
/* v3.22（用户："设置、统计界面的上面也太挤了"）：这两个页面顶部同样留出呼吸位 */
body[data-view="stat"] .section-intro,
body[data-view="settings"] .section-intro{margin-top:64px}
/* 抽屉展开时跟上面那一行拉开一点，别糊在一起（上面那条收起态用 margin-top:0 收掉它）。
   ★ 3.5.4：选择器从 `.filter-bar + .toolbar` 改成 `.list-top + .toolbar` ——
   「筛选」现在住在 .list-top 这一行里，不再是 .toolbar 的前一个兄弟节点了。 */
body[data-view="list"].tools-open .list-top + .toolbar{margin-top:16px}
.filter-fab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
body.tools-open .filter-fab{color:var(--accent)}
/* （v3.13 那条重复的 `body[data-view="list"]:not(.tools-open) .toolbar{display:none}` 已删除：
   同一份 HTML 里 .toolbar 只有一个，两条一模一样的收起规则没有意义，留着反而会让人
   漏掉上面那条"改用高度过渡"的改动。） */
/* v3.14（用户："录入页面就不要让它上下移动了，内容本来一页就能完成，居中放好就行"）：
   上一版用的是 clamp(48px,20vh,200px) —— 会**跟着视口高度变**，看起来像"内容在上下浮动"。
   现在改成固定值：位置一旦定下就不再动，任何机型都稳定。 */
body[data-view="entry"] .hero{margin-top:104px}
body[data-view="entry"] .capture-wrap{margin-top:26px}
body[data-view="entry"] .entry-box{margin-top:20px}
/* ★ v3.36（用户："在进入录入界面时，以及第一次打开应用进入页面时，录入界面就没有像
   统计和清单界面那样有动画"）：原因为——录入界面的三块（大标题 .hero、吸顶录入条
   .capture-wrap、标签/提示框 .entry-extra）是**静态 DOM**，不在 #view 里，所以既没有
   reveal-on-scroll，也没人给它们补入场。清单/统计整页都在 #view 内、整块重画，才有动画。
   这里补一段和 rvIn 同族的入场（淡入 + 轻微上移 + 去模糊 + 错峰），由 refresh() 在
   "视图真的换了"时给 body 挂 .view-enter 触发；S.view 默认就是 entry，所以启动首帧也走这条。
   reduced-motion 由文件末尾那条全局 `*{animation:none!important}` 兜住 —— 动画一抽掉，
   元素直接是终态，不会卡在透明起点上（backwards 填充也随之失效）。 */
@keyframes entryIn{from{opacity:0;transform:translateY(26px);filter:blur(9px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes entryFade{from{opacity:0}to{opacity:1}}
body.view-enter .hero{animation:entryIn .62s cubic-bezier(.16,1,.3,1) backwards}
/* 录入条是 position:sticky：只让它淡入，不给它位移/模糊。sticky 元素一旦带上 transform
   或 filter 就会新建包含块，虽然吸顶仍按自身生效，但没必要为一段入场动画去动它的合成状态。 */
body.view-enter .capture-wrap{animation:entryFade .48s ease .06s backwards}
body.view-enter .entry-extra{animation:entryIn .62s cubic-bezier(.16,1,.3,1) .12s backwards}
/* v3.14：页脚那行灰色小字（"单文件 · 零联网 · 数据只存在这台手机里"）只在设置页出现，
   别的页面底部不再有它（用户："除了设置页面，其他每个页面底下就不要有这一行了"）。 */
body:not([data-view="settings"]) .pdaim-footer{display:none}
.tb-wrap>.tb-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
.tb-row.search-row .search{flex:1 1 auto;min-width:130px}
.tb-row.search-row .btn{flex:0 0 auto}
.tb-row.tag-row{gap:10px}
/* ★ 3.5.4（用户逐条指定）：标题下面这一行是三格布局 ——
   左＝粘贴导入、中＝筛选、右＝分区⇄时间轴 图标开关（放到统计页"条状/方块"开关的位置，右上）。
   三列 `1fr auto 1fr`：左右各占一份、中间那格天然居中，所以"筛选保持居中"与"右边贴右"
   同时成立，左边的东西也不会把中间挤歪。
   `align-items:end` 是关键：用户要求「筛选的下边缘跟视图切换按钮的下边缘对齐」——
   底部对齐之后，小小的"筛选"药丸就贴着那组高按钮的下沿。
   粘贴导入用 align-self:stretch 撑满整行高度（＝那组图标按钮的高度），外框做成同一个语言。 */
.list-top{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:end;column-gap:10px;
  /* ★ 3.5.5（用户："这个『筛选』和『视图转化』都跟底下重合了"）：
     收起抽屉时 .toolbar 高 0、上下外边距也是 0，于是这一行的下沿**紧贴**第一张分区卡片的
     上沿（看起来就是压上去了）。这里补 22px 下边距。 */
  margin:16px auto 22px;
}
.list-top .import-btn{
  align-self:stretch;justify-self:start;
  display:inline-flex;align-items:center;padding:0 18px;border-radius:999px;
  /* 材质见 .glass-chip（"跟底下导航栏相似"）；这里只管形状 */
  color:var(--fg);
}
.list-top .filter-bar{margin:0}
.list-top .seg{justify-self:end}
/* 抽屉收起态的过渡目标（见 .toolbar 的注释）。 */
.tb-wrap{display:flex;flex-direction:column;gap:16px}
/* 标签条＝横向滚动容器。
   上下留白是给 pill 右上角那颗删除小叉留的位置（它 top:-6px 探出到 pill 外面），
   不留的话 overflow 会把它裁掉半个。 */
.pillstrip{
  display:flex;align-items:center;gap:6px;flex-wrap:nowrap;
  overflow-x:auto;overflow-y:hidden;
  flex:1 1 auto;min-width:0;
  padding:7px 8px 2px 2px;
  scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
  overscroll-behavior-x:contain;
}
.pillstrip>*{flex:0 0 auto}                    /* 不许缩，撑出去才有得滚 */
.pillstrip::after{content:"";flex:0 0 6px}     /* 滚到底时最后一颗的 × 不贴边被切 */

/* ---------- 标签条的边缘渐隐 ----------
   横向滚动容器默认是在两端"硬切"：滚到一半的 pill 被切成半个，紧贴边界，
   看着很毛（用户圈出来的就是这处）。这里用 mask 在两边缘做一小段渐隐，
   被切住的那颗 pill 是"淡出去"的，而不是"被刀切"的。

   三个刻意的取舍：
   ① 用 mask 而不是盖一层渐变遮罩 —— mask 不占布局、不吃点击，也不用去猜背景色
      （玻璃底、暗色模式、遮罩上的弹窗，背景都不是同一个色，盖色块迟早对不上）。
   ② 只在"真的能滚、且这一侧确实还有内容被切住"时才渐隐。内容没溢出时也渐隐的话，
      第一颗 pill 会被平白无故淡化一块，看着像坏了。所以由 JS 实时挂 .fade-l/.fade-r。
   ③ 渐隐宽度取 22px：比一颗 pill 的圆角(999px)半径大一些，够把切口感化开；
      又小于最短的 pill 宽度，不至于把一整颗标签糊没。 */
.pillstrip{--strip-fade:22px}
.pillstrip.fade-l.fade-r{
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--strip-fade),#000 calc(100% - var(--strip-fade)),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 var(--strip-fade),#000 calc(100% - var(--strip-fade)),transparent 100%);
}
.pillstrip.fade-l:not(.fade-r){
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 var(--strip-fade));
          mask-image:linear-gradient(90deg,transparent 0,#000 var(--strip-fade));
}
.pillstrip.fade-r:not(.fade-l){
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - var(--strip-fade)),transparent 100%);
          mask-image:linear-gradient(90deg,#000 calc(100% - var(--strip-fade)),transparent 100%);
}
/* 细滚动条：给鼠标用户一个能拖的把手（隐藏滚动条只剩手势的话，台式机就没法用了）。
   颜色不能用 --line2，那是描边色、太淡，6px 细条会看不见，得用文字灰阶。 */
/* ★ 3.5.4（用户："标签支持左滑右滑，把底下的指示标识（就是那个非常长的灰色条）去掉，
   不需要了"）：标签条本来就靠手指横滑（overflow-x:auto + touch 惯性滚动），
   下面那条 6px 的滚动条纯属多余 —— 而且它跟上面那排药丸一比显得特别长、特别脏。
   整条隐藏：`scrollbar-width:none`（标准）+ 两个 `::-webkit-scrollbar{0}`（Chromium）。
   滑动本身不受影响。 */
.pillstrip{scrollbar-width:none}
.pillstrip::-webkit-scrollbar{width:0;height:0}
/* 标签条右端固定的那组按钮：＋ 加标签 / ⚙ 管理 */
.tagacts{flex:0 0 auto;display:flex;align-items:center;gap:6px}
/* 自定义标签：pill 右上角带删除小叉 */
.pillwrap{position:relative;display:inline-flex;align-items:center}
.pill-x{
  position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;padding:0;line-height:1;
  border:1px solid var(--line2);background:var(--bg);color:var(--faint);font-size:11px;cursor:pointer;
}
.pill-x:hover{color:var(--danger);border-color:var(--danger)}
.addpill{color:var(--faint);padding:6px 11px}
.addpill:hover{color:var(--fg)}
.newtag-input{
  width:96px;border:1px solid var(--fg);border-radius:999px;background:transparent;color:var(--fg);
  font:inherit;font-size:12.5px;font-weight:700;padding:6px 14px;outline:0;
}
.newtag-input::placeholder{color:var(--faint);font-weight:600}
/* 管理标签弹窗：一行一个标签，输入框改名 + 删除 */
.modal-note{margin:0;font-size:12.5px;line-height:1.75;color:var(--muted);font-weight:600}
.modal .modal-note + .tagrows{margin-top:18px}
.tagrows{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:44vh;overflow:auto}
.tagrow{display:flex;align-items:center;gap:8px}
.tagrow input{
  flex:1;min-width:0;border:1px solid var(--line2);border-radius:12px;background:transparent;
  color:var(--fg);font:inherit;font-size:14px;font-weight:700;padding:9px 13px;outline:0;
  transition:border-color var(--mo-quick) ease;
}
.tagrow input:focus{border-color:var(--fg)}
.tagrow input::placeholder{color:var(--faint);font-weight:600}
.tagrow .btn{flex:0 0 auto;font-size:12.5px;padding:8px 15px}
.tagrow.addrow{margin-top:4px;padding-top:14px;border-top:1px solid var(--line)}
.pill{
  border:1px solid var(--line2);background:transparent;color:var(--muted);
  font:inherit;font-size:12.5px;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer;
  /* 过渡放慢到 .24s 并换成本站那条"柔和"曲线（原来是 .18s ease，从透明底直接跳到实黑，
     看起来就是硬切一下）。transform 仍走 .18s：按下去的反馈要跟手，不能拖。 */
  transition:color var(--mo-base) var(--mo-soft),border-color var(--mo-base) var(--mo-soft),
             background var(--mo-base) var(--mo-soft),box-shadow var(--mo-base) var(--mo-soft),
             transform var(--mo-quick) ease;
}
.pill:hover{color:var(--fg);border-color:var(--fg)}
/* 选中态多一层很淡的投影：一是让"实底"看起来是浮起来的而不是贴上去的，
   二是 box-shadow 可以参与过渡，底色切换就有个"落下来"的中间态，不会那么楞。 */
.pill.on{
  background:var(--fg);color:var(--bg);border-color:var(--fg);
  box-shadow:0 2px 10px color-mix(in srgb,var(--glass-edge) 38%,transparent);
}
/* 筛选栏那条标签是**整块重画**的（#view 每次 refresh 都重建，连 #filters 都是新元素），
   所以 .pill 上那条 transition 永远没机会播 —— 选中态是"啪"一下换过去的。
   这条入场只挂在「刚刚被点中的那一颗」上（由 renderFilters 按 filterPulse 打标记），
   补一个从无底色长到有底色的中间态，视觉上就接上了。
   刻意不做成"所有 .on 一起播"：连着选三颗时整条一起闪，比硬切还难看。 */
@keyframes pillOn{from{background:transparent;color:var(--muted);border-color:var(--line2);box-shadow:none}
                  to{background:var(--fg);color:var(--bg);border-color:var(--fg);
                     box-shadow:0 2px 10px color-mix(in srgb,var(--glass-edge) 38%,transparent)}}
@keyframes pillOff{from{background:var(--fg);color:var(--bg);border-color:var(--fg);
                       box-shadow:0 2px 10px color-mix(in srgb,var(--glass-edge) 38%,transparent)}
                   to{background:transparent;color:var(--muted);border-color:var(--line2);box-shadow:none}}
.pill.pulse{animation:pillOn .3s var(--mo-soft) both}
.pill.pulse-off{animation:pillOff .3s var(--mo-soft) both}
.btn{
  border:1px solid var(--line2);background:transparent;color:var(--fg);font:inherit;font-size:13px;font-weight:700;
  padding:8px 18px;border-radius:9999px;cursor:pointer;transition:all var(--mo-quick) ease;white-space:nowrap;
}
.btn:hover{border-color:var(--fg);transform:translateY(-1px)}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);border-color:var(--line2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}

/* ---------- 三区看板 ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,1.8vw,20px);align-items:start}
/* 屏幕外跳过布局+绘制，滚动只画看得见的部分（长列表时软件渲染的主要省力点）。
   auto 关键字：渲染过一次后记住真实高度，避免滚动条跳动。 */
.zone{
  padding:6px 20px 16px;border-radius:32px;
  content-visibility:auto;contain-intrinsic-size:auto 640px;
}
/* ★ v3.38（用户截图 + 原话："把多画出的阴影边缘线去掉。如果真想要边缘线，就把整个框带上去，
   别单着带一条边缘线呀，边缘线画这儿算什么事儿啊"）：
   那条"多画的线"就是这里原来的 `border-bottom`。它是"标题与条目之间的分隔线"，
   在**展开**态看着还算合理；但分区一收起（截图里四张卡都是收起的），它就变成一条
   悬在灰罩中间、离卡片下沿还有 16px、两头还带圆角弧度的**孤线** —— 既不是卡片边缘，
   也不是任何东西的分界。
   直接去掉：条目的分隔由每个 .item 自己的 border-bottom 承担，标题靠字重/字号就够分开了。 */
.zone header{display:flex;align-items:center;gap:9px;padding:16px 2px 12px}
.zone header .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.zone[data-z="short"] header .dot{background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 55%,transparent)}
.zone[data-z="long"]  header .dot{background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 55%,transparent)}
.zone[data-z="consider"] header .dot{background:var(--ok);box-shadow:0 0 10px color-mix(in srgb,var(--ok) 55%,transparent)}
/* 「考虑」不是待办，只是「还没决定要不要做」的暂存区 —— 排在最后，并铺满整行收尾 */
.zone-wide{grid-column:1/-1}
.zone header h3{margin:0;font-size:13px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--fg)}
.zone header .n{margin-left:auto;font-size:12px;color:var(--faint)}
/* ---------- 分区折叠（长期 / 短期 / 循环 / 考虑）----------
   整条 header 都是热区：比只点右边那个小三角好按得多（手指点 7px 的三角太费劲）。 */
/* ★ v3.38（用户截图 + 原话："我点击时变灰的地方只有这一小块，那显然就是里边这个圆角矩形…
   但是你把 UI 界面设计得更大呀，外面的圆是一个大圆角的条状 UI，是视觉上能看到的范围。
   把实际交付范围扩展到整个…外边这一层更大的圆边矩形上"）：
   原来按住时的灰罩是画在 header 上的，而 header 的盒子比卡片小一圈（`.zone` 自带
   6/20/16 的内边距，header 只往外探 12px）—— 于是"看得见的那张卡片"和"点得到的、
   会变灰的那一小块"对不上，看着就是"一块小灰片套在一张大白卡里"（用户形容的"套了层塑料袋"）。
   改法两步：
     ① 反馈是**整张卡片**一起变灰（header 的 `::before`，见下面）；
     ② 热区扩到整张卡片：header 上挂一层完全透明的 `::after`。
        展开时它只覆盖标题那一条（左右各多出卡片内边距那 20px、上方多出 6px），
        收起时整张卡片只剩标题，所以直接铺满整张卡（bottom:-16px 吃掉卡片的下内边距）——
        "收起状态点哪里都能展开"正是用户要的那个"整个圆边矩形"。
        透明层不能一直铺满整张卡：展开时那样会把底下的条目全部挡住点不到。 */
.zone>header{cursor:pointer;border-radius:16px;position:relative;
  /* v2.5（用户："你这个加粗的范围需要囊括住标题里边的全部元素，跟里边元素和外边元素的
     边距要合适"）：把热区/灰罩向左右各撑出 12px —— 内容位置纹丝不动（-12 的负外边距
     由 14px 内边距补回来：原先是 2px 内边距），但按下时的灰罩能完整包住
     「圆点 + 标题 + 条数 + 小三角」，且离卡片边缘留 8px，不再贴边。 */
  margin:0 -12px;padding:16px 14px 12px}
/* 透明热区（只管"点得到"）。
   数值 = header 盒子到卡片边缘的距离（左/右 8px：卡片内边距 20 − header 外探 12；
   上 6px：卡片上内边距；下 16px：卡片下内边距，只在收起态吃进去）。
   收起态整张卡只剩标题，所以热区铺满整卡 —— "点哪里都能展开"就是用户要的那个"整个圆边矩形"。
   展开态只覆盖标题那一条；**绝不能一直铺满整卡**，那样底下的条目会被这层挡住点不到。
   灰罩不在这儿（那是下面 ::before 的活）：热区形状和灰罩形状不是同一个，必须拆开两层。
   为什么不用 `.zone:active` 上灰：:active 会沿激活链命中祖先 —— 点条目里的勾选框、标签，
   整张卡都会跟着变灰。挂在 header 的伪元素上就没有这个问题。 */
.zone>header::after{
  content:'';position:absolute;left:-8px;right:-8px;top:-6px;bottom:0;
  border-radius:16px;background:transparent;cursor:pointer;
}
.zone.folded>header::after{bottom:-16px;border-radius:32px}
/* ★ v3.38-b（用户："灰罩只盖住标题那一条"）：视觉灰罩和热区分成两层 ——
   `::before` 只做视觉，永远铺满**整张卡片**；`::after` 只管"点得到"，展开态只到标题那一条。
   为什么不能合成一层：展开态热区一旦铺满整卡，底下的条目就点不到了；
   而展开态的灰罩如果只到标题那一条，用户看到的就是"变灰的只有标题那一小条"。
   两层一起用，两个诉求都成立。
   `z-index:-1` 让它画在卡片背景之上、标题文字之下（.glass 有 isolation:isolate，
   所以负层级不会漏到卡片外面去）。 */
.zone>header::before{
  content:'';position:absolute;left:-8px;right:-8px;top:-6px;bottom:-16px;
  border-radius:32px;background:transparent;pointer-events:none;z-index:-1;
  transition:background var(--mo-quick) ease;
}
.zone>header:active::before,.zone.pressing>header::before{background:var(--tap)}
/* ★ v3.38（用户："点击『长期』展开后字体会变蓝……点击哪个哪个才变蓝，而且缩起之后还一直保持变蓝，
   直到我点下一个才改变。这个变蓝没必要"）：
   根因是把颜色挂在 `:hover` 上 —— 触摸设备点一下就命中 `:hover`，而且**手指抬起来不会撤销**，
   要等点到别处才切走。所以表现成了"谁最后被点过谁就一直是蓝的"。
   本文件里 `.feature-card:hover` 早就因为同一个坑被包进了 `@media (hover:hover)`（见那段注释），
   这条当时漏了。改法：
     ① 悬停变蓝只留给真有鼠标的设备；
     ② 触摸设备上的反馈改成 `:active`（**按住时**才蓝，抬手即回）—— 就是用户说的"稍微变蓝一下"；
     ③ 不给"展开态"上颜色：四个分区默认全是展开的，按状态上色会四条一起蓝，反而更花。 */
@media (hover:hover){
  .zone>header:hover h3{color:var(--accent)}
  .zone>header:hover .z-chev{opacity:.8}
}
.zone>header:active h3{color:var(--accent)}
/* 按下：整张卡片压一层灰罩 —— 由 header 的 `::after` 承担（见下面那条）。
   灰罩走 background + 跟卡片一致的圆角，所以四个角不会露白边。
   原来画在 header 自己的盒子上，而 header 比卡片小一圈 ——
   那就是用户截图里"一块小灰片套在一张大白卡里"（他形容的"套了层塑料袋"）。 */

/* 右侧小三角。`.n`（条数）带着 margin-left:auto 占住了右端，所以三角跟在它后面而不是顶到最右。
   margin-right:8px 是给三角的呼吸位 —— 卡片圆角 32px，三角贴死右边缘会顶进圆弧里
   （用户截图：三角几乎压着胶囊右沿）。加上它，三角到卡片边 = 20(卡片) + 2(header) + 8 = 30px。 */
.z-chev{
  width:0;height:0;flex:0 0 auto;margin-left:5px;margin-right:8px;opacity:.45;
  border-left:4px solid currentColor;
  border-top:5px solid transparent;border-bottom:5px solid transparent;
  transform:rotate(90deg);                              /* 展开 → 朝下 */
  transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .2s ease;
}
.zone.folded .z-chev{transform:rotate(0)}               /* 收起 → 朝右 */
/* 收起时只剩下标题栏。用 `:not(header)` 是因为条目和空态提示都是 header 的**兄弟**节点，
   不是它的子节点 —— 写成 `.zone.folded > *` 会把标题也藏掉。 */
.zone.folded>:not(header){display:none}
.empty{color:var(--faint);font-size:13px;padding:16px 2px;text-align:center}

/* ---------- 条目 ---------- */
.item{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line);position:relative}
.item:last-child{border-bottom:0}
/* 行首：紧急度小点 + 勾选框。两个包一层，免得 .item 的 gap 被拆成两份、白吃一截宽度 */
.lead{flex:0 0 auto;display:flex;align-items:flex-start;gap:7px}
.udot{
  flex:0 0 auto;width:8px;height:8px;margin-top:8px;border-radius:50%;
  background:var(--u0);   /* 0 灰＝没日期也不紧要 */
}
.udot.u1{background:var(--u1)}   /* 黄＝这周内 */
.udot.u2{background:var(--u2)}   /* 橙＝三天内 */
.udot.u3{background:var(--u3);box-shadow:0 0 8px color-mix(in srgb,var(--u3) 45%,transparent)}   /* 红＝逾期 / 标了 ! */
.udot.u4{background:var(--u4);box-shadow:0 0 10px color-mix(in srgb,var(--u4) 60%,transparent)}  /* 深红＝标了 !! */
.item.done .udot{opacity:.35}    /* 已完成的不再喊紧急，点留着只为对齐 */
.tick{
  flex:0 0 auto;width:20px;height:20px;margin-top:2px;border-radius:7px;cursor:pointer;padding:0;
  border:1.6px solid var(--line2);background:transparent;color:transparent;font-size:12px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:all var(--mo-fast) ease;
}
.tick:hover{border-color:var(--fg);transform:scale(1.08)}
.item.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.body{flex:1;min-width:0}
.t{font-size:15px;font-weight:600;word-break:break-word;cursor:pointer;transition:color var(--mo-fast) ease}
.t:hover{color:var(--accent)}
.item.done .t{color:var(--faint);font-weight:500;text-decoration:line-through}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.chip{
  font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;
  border:1px solid var(--line2);color:var(--muted);white-space:nowrap;
}
.chip.date{font-family:var(--font-mono);font-size:11px}
.chip.late{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.chip.today{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.chip.hwchip{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.chip.rep{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);font-family:var(--font-mono);font-size:11px}
.chip.old{color:#b07a1e;border-color:color-mix(in srgb,#b07a1e 45%,transparent)}
/* 条目上的标签：只写具体属性不用 all —— all 会把将来任何新加的属性一起拖进过渡，
   而且这里的过渡时长也该和标签条统一（.24s + 柔和曲线），不然同一颗标签在两个地方手感不同。 */
.chip[data-tag]{
  cursor:pointer;
  transition:color var(--mo-base) var(--mo-soft),border-color var(--mo-base) var(--mo-soft),
             background var(--mo-base) var(--mo-soft);
}
.chip[data-tag]:hover{color:var(--fg);border-color:var(--fg)}
/* 搜索框 */
.search{
  flex:0 1 200px;min-width:130px;border:1px solid var(--line2);border-radius:999px;
  background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:7px 16px;outline:0;
  transition:border-color var(--mo-fast) ease;
}
.search:focus{border-color:var(--fg)}
.search::placeholder{color:var(--faint)}
/* 逾期只把标题变红。左侧那几根色条（逾期红条 / 重要黄条 / 紧急红条 / 积压黄条）撤了：
   它们只有两三个档位，和行首那颗五档的点互相打架，同一件事会同时说两遍还不一致。 */
.item.overdue .t{color:var(--danger)}
.chip.prichip.p1{color:#b07a1e;border-color:color-mix(in srgb,#b07a1e 50%,transparent)}
.chip.prichip.p2{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
/* 循环区现在是看板的第三栏，不再是脚下一整条，所以不用 margin-top */
.repeat-zone header .dot{background:var(--accent);box-shadow:0 0 10px color-mix(in srgb,var(--accent) 55%,transparent)}
/* 时间轴现在是清单页的一种展示模式（S.listMode==='timeline'，body[data-view] 仍是 "list"），
   不再有独立的 timeline 视图，下面三组 data-view="timeline" 规则已失效，删掉。 */
.tl-section{width:min(100%,960px);margin:0 auto}   /* 列表读起来窄一点更舒服 */
/* 复合目标：子任务缩进挂在目标卡下，左侧树线随层级渐淡 */
.goal-kids{
  margin:6px 0 2px 2px;padding-left:12px;
  border-left:2px solid color-mix(in srgb,var(--accent) 40%,transparent);
  display:flex;flex-direction:column;gap:2px;
}
.goal-kids .goal-kids{border-left-color:color-mix(in srgb,var(--accent) 18%,transparent)}
/* 折叠态 = 只是 display:none，子任务本身**留在 DOM 里**（见 renderTree 的注释）。
   收起动画要先把当前高度量出来再往 0 压，DOM 里没东西就没得量。 */
.goal-kids.folded{display:none}
/* 折叠/展开的高度过渡：高度由 JS 量出来写成 inline 值（auto 没法参与过渡），
   这里只提供曲线。overflow:hidden 是必需的 —— 高度塌到 0 时内容会溢出来。
   上下的 6px/2px 外边距也要一起过渡，不然高度收完了外边距还在，会留一条 8px 的缝。 */
.goal-kids.folding{
  overflow:hidden;
  transition:height var(--mo-base) var(--mo-size),
             opacity var(--mo-fast) ease,
             margin-top var(--mo-base) var(--mo-size),
             margin-bottom var(--mo-base) var(--mo-size);
}
.item.goal .t{font-weight:800}
.chip.goalchip{cursor:pointer;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);font-family:var(--font-mono);font-size:11px}
.acts{display:flex;gap:2px;opacity:0;transition:opacity var(--mo-fast) ease;flex:0 0 auto}
.item:hover .acts,.item:focus-within .acts{opacity:1}
.mini{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:13px;padding:3px 6px;border-radius:7px;transition:all var(--mo-fast) ease}
.mini:hover{color:var(--fg);background:var(--pill)}
/* ★ v3.19（用户实测："黑夜模式下看不到条目右边的编辑和删除按钮"）两个根因一起修：
   ① 颜色用的是最淡一档 --faint（深色下只有 3.71:1，压在卡片上几乎融掉）→ 换成 --muted；
   ② `.acts` 只在 hover/focus 时才显形，而**手机没有 hover** —— 于是那对按钮在有触摸的
      设备上等于隐藏。这里对无 hover 的设备让它们常显（点得到才叫按钮）。 */
@media (hover:none){ .item .acts{opacity:1} }
/* v3.19 全局可读性收敛：把「可点 / 承载信息」的极淡灰统一提到 --muted（深色 7.79:1）。
   装饰性的（星期字母、field 标签、页脚、卡片表头、占位符）保持 --faint 不动。 */
.mini,.addpill,.hb-open,.hb-n,.et-l,.backup,.empty,.zone header .n,
.set-card > .set-sub,.stat-toolbar .len,.tl-meta{color:var(--muted)}

/* ---------- 时间轴（v3.36 改版：条目与分区同构） ----------
   原来每条是一张自画的 .hwcard 卡片：另一套标题字号、另一套日期 chip、轴向的点还是
   另做的一颗 .tl-node，于是"分区里逾期标红、时间轴里不标红""那颗点切视图时消失又出现"
   这类不一致全是从"两份渲染代码"来的。
   现在一条 <li class="tl-item"> 里装的就是分区的 itemHTML（点 / 勾 / 标题 / 日期 chip / 标签
   全部同源），所以这里只剩两件事：竖轴、以及行间距。
   竖轴：圆的中心 = .item 左内边距 2px + 点半径 4px = 6px，取 left:5.5px（1px 线自身居中），
   线就从每颗点的圆心穿过去 —— "一个点一个点连成一条轴"。 */
.timeline{list-style:none;margin:clamp(34px,5vw,58px) 0 0;padding:0;position:relative}
.timeline::before{
  content:"";position:absolute;left:5.5px;top:34px;bottom:34px;width:1px;
  background:linear-gradient(to bottom,transparent,var(--line2) 12%,var(--line2) 88%,transparent);
  z-index:0;
}
.tl-item{position:relative;padding:0}
/* 时间轴里每一条还挂在轴上：行自身的下边框会和轴相交，把轴压在最后一条的下方
   反而更像"线穿过去"。这里只把轴压到行下面（z-index），不动任何颜色。 */
.tl-item .item{position:relative;z-index:1}
/* `.hwcard` / `.course` / `.tl-node` 这几组样式随 tlCardHTML 一起退休（v3.36）：
   时间轴不再画卡片、不再单画轴向点。作业信息改由 hwStatusHTML 生成的 .hwline 承载，
   样式在下面那组，跟 .item 的正文同一套字号语言。 */
/* 作业补充块：一行灰字（课程 · 渠道 · 命名 · 交于）+ 三个状态按钮 */
.hwline{margin-top:9px}
.hwdetail{margin:0 0 6px;font-size:13px;color:var(--muted);white-space:pre-wrap;line-height:1.7}
.hwmeta{font-size:12px;font-weight:700;color:var(--faint);line-height:1.6}
.hwline .statuses{margin-top:9px}
.statuses{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;align-items:center}
.st{
  border:1px solid var(--line2);background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;
  padding:5px 15px;border-radius:999px;cursor:pointer;transition:all var(--mo-fast) ease;
}
.st:hover{color:var(--fg);border-color:var(--fg)}
.st.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.st.on[data-s="submitted"]{background:var(--ok);border-color:var(--ok);color:#fff}

/* ---------- 统计（原站 .feature-grid / .feature-card） ---------- */
.feature-grid{
  width:min(100%,1180px);margin:clamp(38px,6vw,76px) auto 0;
  /* auto-fit + 190 的下限：1080px 以上时容器最窄也有 1030px，
     (1030-4×17)/5 ≈ 192 > 190，所以四张卡在桌面宽度永远排成整齐一行。
     不用固定列数，是为了卡的数量变了也不会挤成一行空一堆。 */
  display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:clamp(12px,1.6vw,20px);
}
.feature-card{
  position:relative;overflow:hidden;border-radius:32px;
  /* ★ v3.38 横条布局重排（用户逐条口述）：左边一列三行（标题 / 大数字 / 单位），右边竖排细分小药丸。
     他要求**四个距离完全相等**，就是这里的 --stat-g：
       ① 左列内容的左边缘 ↔ 卡片左边框
       ② 「今日完成」上边缘 ↔ 卡片上边框
       ③ 单位（条）下边缘 ↔ 卡片下边框
       ④ 右侧小药丸的右边缘 ↔ 卡片右边框
     padding 四边取同一个值、并且**卡片高度由左列内容自己撑开**（这里不再写 min-height），
     ②③ 就自动成立；①④ 由 padding + 右列右对齐保证。
     方块（tile）布局另有覆盖：`min-height:0 + aspect-ratio:1/1 + flex 居中`，不受这里影响。 */
  --stat-g:clamp(26px,4.6vw,40px);
  padding:var(--stat-g);
  display:grid;grid-template-columns:minmax(0,1fr) auto;
  column-gap:var(--stat-g);align-items:center;
  transition:transform 320ms cubic-bezier(.2,.8,.2,1),box-shadow 320ms ease;
  content-visibility:auto;contain-intrinsic-size:auto 160px;
}
/* 左列：标题 / 大数字 / 单位，三行左对齐、行间留一点空隙 */
.feature-card .pcol{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
/* 右列：细分小药丸竖排、右对齐 */
.vsub-v{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
/* 抬升只在「真有悬停」的设备上做：触屏点一下 :hover 会粘住不回落（用户截图里那张卡片
   一直抬着）。包进 @media (hover:hover) 后，触屏设备根本不会匹配这条，卡片回归静止。
   .st（作业状态按钮）是 :active 真交互，不在这里动它。 */
@media (hover:hover){
.feature-card:hover{transform:translateY(-8px);box-shadow:0 26px 70px color-mix(in srgb,var(--glass-edge) 42%,transparent)}
}
.feature-card .k{color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
.feature-card .v{
  margin:0;font-family:var(--font-mono);font-weight:700;
  font-size:clamp(32px,3.4vw,50px);line-height:.9;letter-spacing:-.04em;
}
.feature-card .s{margin:0;font-size:12.5px;color:var(--faint)}
/* 主指标：用配色和字号强调，不跨列 —— 跨列会让上下两行的列宽对不齐 */
.feature-card.big .v{font-size:clamp(38px,4vw,60px)}

/* 一卡两指标（已逾期 / 作业未交）：沿用同一套「标签 / 大数字 / 单位」三层排版，
   只是从一列变两列 —— 卡片外形、观感和别的 card 完全一致，只是内容一分为二 */
.feature-card.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:clamp(14px,1.6vw,22px)}
.feature-card.pair .pcol{min-width:0}
.feature-card.pair .pcol+.pcol{border-left:1px solid var(--line);padding-left:clamp(14px,1.6vw,22px)}
.feature-card.pair .v{font-size:clamp(28px,3vw,44px)}   /* 半栏宽，比单指标那几张收一号 */
/* 方块模式：两个指标上下叠（方格里横向摆会挤），分隔线也就不要了 */
.feature-grid.tile .feature-card.pair{display:flex;flex-direction:column}
.feature-grid.tile .feature-card.pair .pcol+.pcol{border-left:0;padding-left:0}
.feature-card.accent{
  background:
    radial-gradient(circle at 14% 6%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 48%),
    color-mix(in srgb,var(--bg) 84%,transparent);
}
html.gpu-render .feature-card.accent{
  background:
    radial-gradient(circle at 14% 6%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 48%),
    color-mix(in srgb,var(--bg) 54%,transparent);
}
.feature-card.accent .v{color:var(--accent)}

/* ---------- 弹层 ---------- */
/* 弹层打开时锁住底下的页面。不锁的话，滚动会"接力"到下面的文档，两个一起滑：
   ① 滚轮/手指落在遮罩上（遮罩自己不可滚，于是去找上一层可滚的 —— 就是文档）；
   ② 弹窗内容已经滚到顶/底，再继续滑同样接力出去。
   锁在 html 而不是 body：body 上有 sticky（.capture-wrap），给 body 加 overflow:hidden
   会新建一个滚动容器、把 sticky 直接废掉（这也是 body 那条写 overflow-x:clip 而不是 hidden 的原因）。
   html 本来就设了 scrollbar-gutter:stable，所以锁上/解开不会因为滚动条消失而横向位移。 */
html.locked{overflow:hidden}
.mask{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.42);display:none;align-items:center;justify-content:center;padding:20px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mask.on{display:flex;animation:fadein .2s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:600px;max-height:88vh;overflow:auto;overscroll-behavior:contain;padding:clamp(22px,3vw,34px);border-radius:38px;animation:rise .34s var(--mo-soft) both}
/* 弹窗压在深色遮罩上，而 .glass 的底是**半透明**的（真机 GPU 下只有 54% 不透明）——
   于是遮罩的深色透过弹窗本身浮上来，整块被染成灰、连字都跟着发灰
   （用户截图里那个灰扑扑的「粘贴导入」就是这么来的）。
   弹层本来就浮在已经压暗的背景之上，没有理由再透，所以单独给一条接近实底的表面。
   必须连 html.gpu-render / html.soft-render 一起写：那两条规则的选择器权重比
   `.mask .modal` 高，不显式覆盖的话真机上跑的还是老配方。 */
.mask .modal,
html.gpu-render .mask .modal,
html.soft-render .mask .modal{
  background:color-mix(in srgb,var(--bg) 97%,transparent);
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
/* ★ 3.5.6 修「下拉展开像透明的」的真凶（用户 2026-09-27 第二次提同一处）：
   `.glass>*`（第 210 行）给每个直接子元素都发了 `position:relative;z-index:1`，
   于是弹层里的 `.row`（装「分区」的那个）自己成了一个层叠上下文；
   里面展开的 `.sel-pop`（z-index:30）被**关在 .row 里**，出不去。
   而「重要程度」那个 `.field` 是 DOM 里更靠后的兄弟、同样是 z-index:1 ——
   于是整条压在展开列表之上：用户看到的就是"重要程度 / 普通 / 空的圆圈
   浮在下拉上面"，读起来像下拉是透明的。
   改法：弹层直接子元素不建层叠上下文（z-index:auto 保留 position:relative，
   相对 .glass::before 的层级关系不变），z-index:30 的浮层就能落到整层之上。 */
.mask .modal>*{z-index:auto}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.modal h3{margin:0 0 20px;font-family:var(--font-display);font-weight:900;font-size:26px;letter-spacing:-.03em}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.field input[type=text],.field input[type=date],.field textarea,.field select{
  width:100%;border:1px solid var(--line2);border-radius:14px;background:transparent;color:var(--fg);
  font:inherit;font-size:14px;padding:11px 14px;outline:0;transition:border-color var(--mo-fast) ease;
}
.field textarea{min-height:100px;resize:vertical;line-height:1.7}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--fg)}
.field select option{background:var(--bg);color:var(--fg)}

/* ---------- 自定义下拉（替代原生 <select>）----------
   为什么不用 <select>：手机上点它会弹**安卓系统**的底部单选列表（用户截图：
   普通/重要/紧急那种系统 UI），字体、圆角、配色全是 Material 的，跟本站完全两个世界。
   option 也几乎没法定制样式 —— 这是唯一能把"点开后的列表"也变成自己 UI 的路。
   结构：.sel（定位容器，dataset.value 存值）> .sel-btn（假输入框）+ .sel-pop（浮层列表）。
   值不进表单，读取走 selValue(id) —— 见 makeSel() 的说明。 */
.sel{position:relative}
/* 假输入框：观感对齐 .field input（同描边/圆角/字号/内边距），但是颗 <button> */
.sel-btn{
  width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border:1px solid var(--line2);border-radius:14px;background:transparent;color:var(--fg);
  font:inherit;font-size:14px;font-weight:600;padding:11px 14px;outline:0;cursor:pointer;
  text-align:left;transition:border-color var(--mo-fast) ease;
}
.sel-btn:focus-visible{border-color:var(--fg)}
.sel-btn:hover{border-color:var(--fg)}
.sel-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 下拉箭头：细线描边 V。right:14px 跟文字内边距对齐 —— 原生 <select> 的箭头是浏览器
   画的，贴着边、距离不受控（用户截图里"箭头快压到右边缘"就是它），自己画才有这个余量。 */
.sel-chev{
  flex:0 0 auto;width:15px;height:15px;margin-right:2px;
  fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  transition:transform .22s cubic-bezier(.2,.8,.2,1);
}
.sel.open .sel-chev{transform:rotate(180deg)}
/* 浮层列表：跟 .modal 同一套表面（近实底、大圆角、投影），滚动容器内 absolute 定位
   —— 跟着字段一起滚，不会出现"列表飘在半空"。 */
.sel-pop{
  position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;
  border:1px solid var(--line2);border-radius:16px;padding:6px;
  /* ★ 3.5.6：原来写 color-mix(...97%,transparent)，剩的 3% 透明会把
     **同一个 .row 里那个「标题」输入框的字**淡淡透出来（用户截图里
     下拉中间那行灰字）。浮层已经压在弹层上了，没有任何理由再透一层，
     跟 `.mask .modal` 一样给实底。 */
  background:var(--bg);
  box-shadow:0 18px 50px color-mix(in srgb,var(--glass-edge) 38%,transparent);
  max-height:236px;overflow:auto;overscroll-behavior:contain;
  display:none;animation:rise .18s var(--mo-soft) both;
}
.sel.open .sel-pop{display:block}
/* 贴底字段：向上弹（见 toggleSel 的说明） */
.sel.up .sel-pop{top:auto;bottom:calc(100% + 6px);animation:fall-up .18s var(--mo-soft) both}
@keyframes fall-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sel-opt{
  width:100%;display:flex;align-items:center;gap:10px;
  border:0;background:transparent;color:var(--fg);font:inherit;font-size:14px;font-weight:600;
  padding:11px 12px;border-radius:11px;cursor:pointer;text-align:left;
  transition:background var(--mo-fast) ease;
}
.sel-opt:hover{background:var(--pill)}
.sel-opt .sel-k{flex:1;min-width:0}
/* 选中态：右侧一颗描边圆点打勾，颜色用 --accent，跟全站"选中=蓝点"一个语言 */
.sel-opt .sel-ck{
  flex:0 0 auto;width:18px;height:18px;border-radius:50%;
  border:1.6px solid var(--line2);display:flex;align-items:center;justify-content:center;
  color:transparent;font-size:11px;font-weight:900;
}
.sel-opt.on{background:var(--pill);font-weight:800}
.sel-opt.on .sel-ck{border-color:var(--accent);background:var(--accent);color:#fff}

/* 日历（makeCal）：与下拉共用 .sel/.sel-btn/.sel-pop，只是浮层里换成月历网格。
   日历比选项列表高，max-height 放开，让 .mask 的滚动容器自己管。 */
.cal .sel-pop{max-height:none}
.cal-head{display:flex;align-items:center;gap:6px;padding:4px 6px 8px}
.cal-title{flex:1;text-align:center;font-size:13px;font-weight:800;letter-spacing:.06em}
.cal-nav{
  width:32px;height:32px;border:0;background:transparent;color:var(--muted);
  border-radius:10px;cursor:pointer;font-size:17px;line-height:1;
  display:flex;align-items:center;justify-content:center;transition:background var(--mo-fast) ease;
}
.cal-nav:hover{background:var(--pill);color:var(--fg)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 4px 6px}
.cal-wd{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--faint);text-align:center;padding:4px 0}
.cal-pad{pointer-events:none}
.cal-d{
  aspect-ratio:1;border:0;background:transparent;color:var(--fg);font:inherit;font-size:12.5px;
  border-radius:9px;cursor:pointer;transition:background var(--mo-fast) ease;
}
.cal-d:hover{background:var(--pill)}
.cal-d.on{background:var(--accent);color:#fff;font-weight:800}

/* 应用内确认框（uiConfirm）：msg 里的 \n 靠 pre-line 换行 */
.confirm-msg{margin:0 0 6px;font-size:14px;line-height:1.8;color:var(--muted);white-space:pre-line}
.tagbox{display:flex;gap:6px;flex-wrap:wrap}
.row{display:flex;gap:12px}
.row>*{flex:1;min-width:0}
.foot{display:flex;gap:10px;margin-top:22px;align-items:center}
.spacer{flex:1}
.checkline{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:600;cursor:pointer}

/* ---------- toast ----------
   ⚠️ 居中用 left:50% + translateX(-50%)，但**宽度必须显式写死**（width:max-content）。
   不写的后果在手机上很难看：fixed 元素 width:auto 时按「left 到右边缘」的剩余空间
   做收缩适配，left:50% 只留了半屏（360px 屏上约 180px），长文案被压成一列五六个字，
   再配上 9999px 的圆角，整个提示框糊成一个大圆 —— 就是用户截图里那个"变形的备份提示"。
   桌面上半屏比文案宽，所以这毛病一直只在手机上露头。

   为什么不是 left:0/right:0 + margin:auto + fit-content：实测在这个布局下
   fit-content 会解成 stretch（三档文案全都吃满 max-width 328px），短提示会变成一条
   莫名的长胶囊。max-content 的语义才是想要的："尽量一行放完，放不下由 max-width 封顶"。

   translateX(-50%) 是按自身宽度算的，所以宽度怎么变都仍然居中。 */
#toast{
  /* ★ v3.32（用户："所有的提示都会挡着"）：提示统一放**屏幕顶部**。
     原来在底部，而"已用语音录入"这类提示是在弹窗打开**之前**弹的 ——
     等弹窗（带底部"取消/确定"）出现时，提示已经在那儿了，压住按钮。
     顶部那一带是变暗背景、没有可点元素，任何流程都不会被挡。 */
  position:fixed;left:50%;top:calc(var(--sat,12px) + 12px);z-index:95;
  transform:translateX(-50%) translateY(-20px);opacity:0;pointer-events:none;
  transition:opacity var(--mo-base) ease,transform var(--mo-base) var(--mo-soft);
  display:flex;align-items:center;gap:16px;padding:13px 22px;border-radius:9999px;font-size:13.5px;font-weight:600;
  width:max-content;max-width:calc(100% - 32px);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
/* ★ v3.36（用户实测："你看这个提示弹窗，它就是纯透明的了。这样上下字体就交叠了，看不清"）：
   提示是要**盖在内容之上**的东西，就不该透。真机 GPU 下 `.glass` 只有 54% 不透明
   （见 html.gpu-render .glass），于是「已用语音录入」压在「今天要做什么」那行大字上时，
   两层字直接叠在一起。
   和 `.mask .modal` 用同一套处理：浮层没有理由再透 → 近实底 + 显式摘掉 backdrop。
   用 ID 选择器（#toast）而不是加 !important：ID 权重天然压过 html.gpu-render .glass，
   这里不需要靠 !important 打补丁。顺带补一圈极淡描边 —— 纯浮动的一小条，
   只靠 .glass 那团柔影在白底上分不出边界。 */
#toast{background:color-mix(in srgb,var(--bg) 97%,transparent);
  -webkit-backdrop-filter:none;backdrop-filter:none;
  border:1px solid color-mix(in srgb,var(--glass-edge) 26%,transparent)}
/* ★ v3.32（用户实测：语音录入的提示压住了弹窗的「取消」键）：弹窗打开时提示挪到屏幕顶部 ——
   顶部那一带是变暗的背景、没有可点的东西，不会再挡任何按钮。没弹窗时仍在底部，行为不变。 */
#toast.at-top{bottom:auto;top:calc(var(--sat,12px) + 10px);transform:translateX(-50%) translateY(-20px)}
#toast.at-top.on{transform:translateX(-50%) translateY(0)}
#toast button{border:0;background:transparent;color:var(--accent);font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}

/* ---------- 页脚（原站 .pdaim-footer） ---------- */
.pdaim-footer{position:relative;z-index:2;padding:40px 24px 56px;text-align:center;color:var(--faint);font-size:12.5px}
/* 同一句话在电脑上和在手机上不可能都对 ——「数据只在这台电脑的浏览器里」
   放进安卓 App 里就是错的（那儿的运行环境根本不是浏览器）。
   这里用 pointer/hover 媒体查询分设备，而不是宽度断点：把窗口拖窄的台式机依然是鼠标、
   数据确实在"这台电脑"上；平板外接键盘也不会被误判成电脑。
   默认（浏览器不支持这两个媒体特性时）显示电脑版。 */
.fw-touch{display:none}
@media (hover:none) and (pointer:coarse){
  .fw-mouse{display:none}
  .fw-touch{display:inline}
}

/* ---------- 流畅模式：软件渲染（如内嵌预览 iframe 关了 GPU）时自动降级 ----------
   软件渲染把整页每个像素都用 CPU 画，且不支持分层滚动，
   色球模糊 / 玻璃模糊 / 点阵 / 入场模糊 这类"每帧都重画"的东西会让滚动掉到个位数帧。
   此模式把它们全关掉，但保留布局、配色、玻璃的形状感（半透明底 + 内描边 + 阴影）。 */
/* 顶栏那颗手动切"流畅模式"的 ⚡ 已撤（手机上挤掉标题），这条样式随之删掉。
   「流畅模式」现在只有两处来源：软件渲染自动识别，以及设置页里那个开关。 */
html.soft-render body::after,html.soft-render .hero::before{display:none}
html.soft-render .glass{
  -webkit-backdrop-filter:none;backdrop-filter:none;
  background:color-mix(in srgb,var(--bg) 93%,transparent);
}
html.soft-render .glass::before{display:none}
html.soft-render .glass,html.soft-render .site-header,html.soft-render .capture,html.soft-render .feature-card,html.soft-render .hwcard{
  box-shadow:0 1px 3px color-mix(in srgb,var(--fg) 10%,transparent),0 10px 28px color-mix(in srgb,var(--fg) 6%,transparent);
}
html.soft-render .site-header,html.soft-render .capture{background:color-mix(in srgb,var(--bg) 95%,transparent)}
/* 揭示改成 animation 之后，这里要关的是 animation（原来关的是 transition）。 */
html.soft-render .reveal-on-scroll{opacity:1;transform:none;filter:none;transition:none;animation:none}
html.soft-render .feature-card:hover{transform:none}

/* ---------- 统计页：布局切换（右上角）+ 完成量细分 ---------- */
.stat-toolbar{
  display:flex;align-items:center;justify-content:flex-end;gap:9px;
  width:min(100%,1180px);margin:clamp(20px,2.8vw,34px) auto 0;
}
.stat-toolbar .len{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--faint)}
.seg{
  display:inline-flex;gap:3px;padding:4px;border-radius:999px;
  background:var(--pill);border:1px solid color-mix(in srgb,var(--glass-edge) 55%,transparent);
}
.segbtn{
  appearance:none;-webkit-appearance:none;border:0;background:transparent;cursor:pointer;
  font:inherit;font-size:12.5px;font-weight:800;color:var(--muted);
  padding:6px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;
  transition:background 220ms ease,color 220ms ease,box-shadow 220ms ease;
}
.segbtn:hover{color:var(--fg)}
.segbtn.on{background:var(--bg);color:var(--fg);box-shadow:0 2px 10px color-mix(in srgb,var(--glass-edge) 45%,transparent)}
.segbtn .gl{font-size:12px;line-height:1;opacity:.8}
/* ---------- 分段控件的滑块（用户点名要的「慢—快—慢 + 拉伸」） ----------
   原来每个按钮各画自己那块底色（.segbtn.on{background:var(--bg)}），切换就是
   "这块灭、那块亮"，是硬切。现在 .seg 里多一个滑块 .seg-pill，由 JS 对齐到当前选中项；
   切换时它从旧位置滑到新位置，中途 scaleX 过冲到 1.24 —— 就是用户要的
   "在『快』的阶段把这个白色的东西变瘦、拉成一条再弄过去"。
   曲线 cubic-bezier(.66,0,.18,1) 是标准的"慢—快—慢"（两端导数小、中段陡）。
   渐进增强：JS 没跑起来时 .seg 不带 .has-pill，选中项仍按老样子显示底色。 */
.seg{position:relative}
.segbtn{position:relative;z-index:1}
.seg-pill{
  position:absolute;left:0;top:0;width:0;height:0;border-radius:999px;
  background:var(--bg);z-index:0;opacity:0;pointer-events:none;
  box-shadow:0 2px 10px color-mix(in srgb,var(--glass-edge) 45%,transparent);
}
.seg.has-pill .seg-pill{opacity:1}
.seg.has-pill .segbtn.on{background:transparent;box-shadow:none}
/* --sx0/--sxm/--sx1/--sy/--r0/--r1 由 syncSegPills() 按实测矩形写进来。
   整条动画只用 translate + scaleX（一律 transform-origin 打在一端），所以
   ① 全程走合成器，不触发重排；② 宽度差异靠 scaleX 表达，一趟动画就能走完。
   三帧的几何含义（见 syncSegPills 里的推导）：
     0%   还没动，占位在「上一个选中项」的位置和宽度
     44%  "液桥"：拉长到**刚好盖住旧位与新位的并集**，看着就是一条被抻细的白条
     100% 收拢成目标项的形状
   特意让中点盖住并集而不是盲目放大：这样滑块永远不越出 .seg 的胶囊边界（不会露头）。 */
.seg-pill.anim{animation:segSlide var(--seg-dur,460ms) cubic-bezier(.66,0,.18,1) both}
@keyframes segSlide{
  0%   {transform:translate(var(--sx0),var(--sy)) scaleX(var(--r0));opacity:.9}
  44%  {transform:translate(var(--sxm),var(--sy)) scaleX(var(--r1));opacity:1}
  100% {transform:translate(var(--sx1),var(--sy)) scaleX(1)}
}
/* ---------- FLIP：同一批元素换位置/形状，而不是"消失再出现" ----------
   用户原话：「固定的元素只是交换一下位置、形状、大小或者排版，但这个固定元素本身并没有改变，
   并不会直接消失在页面上」。这就是 FLIP：切换前量一次、换完 DOM 再量一次、把差值倒推回去再放开。
   过程只走 transform，**不动 opacity** —— 元素全程可见，正是要的效果。 */
.flip-move{will-change:transform}
/* ★ v3.37（用户："我从时间轴切换到分类清单页面时，『长期』还有『短期』这个大标题还是
   直接跳出来了，没有淡入淡出的动画呀"）：切视图走的是 FLIP —— 而 FLIP 只搬"两边都在"
   的元素（靠 data-fk 配对），分区那几张卡片（.zone）是**只在分区这一侧存在**的结构，
   于是它整块硬出现，正好是用户看到的那一下。
   这里给它补一段**纯淡入**：只动 opacity、不加位移，免得和外层 FLIP 抢位置。
   由 swapContent(…,{flip:true,fade:true}) 的 mutate 之后挂 .content-in 触发，
   播完自动摘掉（不摘的话下次重渲染会重播）。 */
/* ★ v3.38（用户："我切换视图的时候，这些字还会被拉伸，虽然幅度很小，但是还是有" + 后面那条
   "时间轴里有一条，切到分区它直接闪没了"）：两件事一起收。
   ① 只淡入那些"只在一边存在"的**容器标题**（分区的 .zone>header、时间轴的 .tl-meta）。
      原来这里把整张 .zone 卡片（含里面所有条目）一起淡入 —— 后果是 FLIP 正在搬运的条目
      全程被压在 opacity 0~1 的父级里，"移动过去"根本看不见，用户看到的就是"闪没了"。
      条目本身的进出改由 flipPlay 前后的 playEntering / playLeaving 逐条负责。
   ② 条目的进出：进来的淡入（playEntering），出去的在原位留一张影子淡出（playLeaving）。 */
#view.content-in > .zone > header,
#view.content-in > .board > .zone > header,
#view.content-in > .tl-section > .tl-meta{animation:contentIn .42s cubic-bezier(.16,1,.3,1) both}
@keyframes contentIn{from{opacity:0}to{opacity:1}}
/* FLIP 切换时"只在一侧存在"的那条待办：出去的那一条在原位克隆一份淡出。
   影子层是 fixed + pointer-events:none，层级压在底栏（z-index 80）之下。
   ⚠️ 类名**必须**带 flip- 前缀：第一版叫 `.ghost-layer` / `.ghost`，
   而"粘贴导入"那颗按钮的类名是 `.btn.ghost` —— 于是 `.ghost{position:absolute}`
   把按钮变成绝对定位、压到搜索框上面去了（用户截图："粘贴导入跟搜索关键词粘一块了"）。
   这和之前 `.hint` 撞名是同一类坑：新增全局类名前先 grep 一遍同名规则。 */
.flip-ghost-layer{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.flip-ghost{position:absolute;transition:opacity .32s ease}
.flip-ghost-layer.out .flip-ghost{opacity:0}
/* 统计页的布局切换：纯图标按钮（用户要求去掉「横条 / 方块」两个词）。
   两端内边距收一点，让"纯图标"和"带字的"落在同一个 .seg 里高度、圆角完全一致。 */
.segbtn.ico-seg{padding:6px 12px}
.seg-ico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.stat-toolbar + .feature-grid{margin-top:clamp(16px,2.2vw,24px)}

/* ---------- 设置页 ---------- */
.set-wrap{
  width:min(100%,940px);margin:clamp(22px,3vw,36px) auto 0;
  display:flex;flex-direction:column;gap:clamp(14px,1.8vw,20px);
}
/* 圆角必须显式给：.glass 本身没有 border-radius（它的圆角历来由各使用者自己定），
   所以设置页卡片一直是**直角**，跟全站圆角风格不一致 —— 用户原话
   "它这个边缘怎么不是圆角的？怎么跟之前的那种整体风格不一样啊"。
   16px 与同页的 .entry-box / .zone>header 同一档。 */
.set-card{border-radius:16px;padding:8px clamp(20px,2.4vw,30px) 18px}
.set-card > h3{
  margin:22px 0 0;font-size:13px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--fg);
}
.set-card > .set-sub{margin:8px 0 0;font-size:12.5px;line-height:1.6;color:var(--faint);font-weight:600}
.set-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 16px;
  padding:20px 0 4px;border-top:1px solid var(--line);margin-top:16px}
/* v3.3（用户："外观下的主题部分太大了，字窝在左边、按钮弄到右边，占的太多"）：
   原来是 flex：说明和标题共用一个窄栏、被右边的控件挤成 5~6 行，整块高度翻三倍。
   改成 grid 后：**标题与控件同一行**（col1 / col2），**说明文字通栏**（col1 跨到 col2）→
   行高从 5~6 行压到 1~2 行，控件也不再和文字抢横向空间。
   `display:contents` 让 .set-txt 这层壳从布局里消失，它的 b / span 直接变成 grid item。 */
.set-row .set-txt{display:contents}
.set-row .set-txt b{grid-column:1;grid-row:1;min-width:0}
.set-row .set-txt span{grid-column:1 / -1;grid-row:2}
.set-row > *:not(.set-txt){grid-column:2;grid-row:1}
.set-row .set-txt b{display:block;font-size:14.5px;font-weight:800}
.set-row .set-txt span{display:block;margin-top:6px;font-size:12.5px;line-height:1.7;color:var(--muted);font-weight:600}
/* 开关：和顶栏那个主题开关同一套观感（凹槽 + 白色球），但语义是 role="switch"，
   位置状态由 aria-checked 驱动 —— 这样键盘可达，屏幕阅读器也能读出开/关。
   关态用 --pill-hover 而不是 --pill：4.5% 的黑在白卡上几乎看不出"槽"，只剩一个白球漂着，
   分不清这是开关还是装饰。7.5% 既能看出轨道，又没跳出这套中性控件的观感。 */
.switch{
  appearance:none;-webkit-appearance:none;flex:0 0 auto;cursor:pointer;padding:0;position:relative;
  width:58px;height:34px;border-radius:9999px;
  border:1px solid var(--line2);background:var(--pill-hover);
  transition:background var(--mo-quick) ease,border-color var(--mo-quick) ease,transform var(--mo-fast) ease;
}
.switch::after{
  content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:999px;
  background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.72),transparent 30%),color-mix(in srgb,#fff 82%,transparent);
  box-shadow:inset 1px -1px .75px -1px rgba(255,255,255,.86),inset -1px 1px .75px -1px rgba(255,255,255,.46),
             0 3px 9px rgba(0,0,0,.16);
  transition:transform var(--mo-base) var(--mo-soft);
}
.switch[aria-checked="true"]{background:var(--accent);border-color:transparent}
.switch[aria-checked="true"]::after{transform:translateX(24px)}

/* 时间轴：条数 / 逾期这类事实数字单独一行常显，和上面那段可关掉的说明文案分开。
   放在列表正上方 —— 它说的是这份列表的事，本来就该挨着列表。
   ★ v3.36（用户："分类界面里边的『共 5 条，其中逾期 1 条』，这种提示居中"）：
   这行字说的是**整份列表**的合计，就该以列表的中轴居中，而不是贴左和标题对齐。 */
.tl-meta{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--faint);
  margin:clamp(24px,3vw,34px) 0 0;text-align:center}

/* 五张卡一律同一副样子：标签 / 大数字 / 单位 / 细分 chips，竖着排。
   （以前这里有条 :last-child:nth-child(odd) 的规则，把最后一张铺满整行改成横排汇总条，
   为的是别在第二行留空洞 —— 但那样「历史完成」跟前面四张长得完全不一样，
   反而更像出错。现在改成让网格自适应，五张卡桌面宽度刚好排满一行，既不留空、也长一样。） */

/* 方块：1:1 紧凑方形平铺，内容居中 */
.feature-grid.tile{grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:clamp(10px,1.3vw,16px)}
.feature-grid.tile .feature-card{
  min-height:0;aspect-ratio:1/1;border-radius:26px;padding:clamp(14px,1.6vw,20px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
@media (hover:hover){
.feature-grid.tile .feature-card:hover{transform:translateY(-5px)}
}
.feature-grid.tile .feature-card .k{font-size:11px;letter-spacing:.13em}
.feature-grid.tile .feature-card .v{margin:12px 0 0;font-size:clamp(30px,3.3vw,44px)}
/* 方块模式：左列改为居中（横条那套是左对齐） */
.feature-grid.tile .feature-card .pcol{align-items:center}
.feature-grid.tile .feature-card.big .v{font-size:clamp(34px,3.7vw,50px)}
.feature-grid.tile .feature-card .s{margin-top:5px;font-size:11.5px}
.feature-grid.tile .vchips{justify-content:center;margin-top:9px;gap:4px}

/* 完成量的来源细分：短期 / 长期 / 考虑 / 循环。
   ★ v3.38 起在横条布局里是**竖排**放在卡片右侧（.vsub-v）。
   每颗小药丸的宽度统一：`auto 4ch` —— 左边是标签（短期/长期/考虑/循环），
   右边固定留 4 个字符位给数字（用户原话："在『短期』后面留 4 个空格，这 4 个空格就是给
   4 位数预留的"），数字在这 4 格里居中（用户选的那档）。于是"短期 2"与"短期 117"
   长度完全一样，竖着排下来右端是齐的。 */
.vchip{
  display:inline-grid;grid-template-columns:auto 4ch;align-items:center;gap:6px;
  font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;
  padding:3px 10px;border-radius:999px;background:var(--pill);
  border:1px solid color-mix(in srgb,var(--glass-edge) 45%,transparent);
}
.vchip b{
  font-family:var(--font-mono);font-weight:800;color:var(--fg);
  font-variant-numeric:tabular-nums;text-align:center;
}
.vchip.loop b{color:var(--accent)}
/* 空态那句「还没有打勾」没有数字，不能去吃那 4 个空格 */
.vchip.empty{display:inline-block}
.vchips{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
/* 方块模式里 chips 太占地方，换成一行小字 */
.vsub{margin-top:10px;font-size:12px;font-weight:700;line-height:1.5;color:var(--muted)}

/* ---------- 响应式 ---------- */
@media (max-width:1080px){
  .board{grid-template-columns:1fr}
  .feature-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ==========================================================================
   iOS 安全区（刘海 / 灵动岛 / 底部 Home 指示条）
   --------------------------------------------------------------------------
   从 Safari「添加到主屏幕」装上后，页面是以 standalone 模式全屏运行的：没有地址栏、
   没有底部工具栏，内容会直接顶到灵动岛和 Home 指示条上（配合 viewport-fit=cover）。
   env(safe-area-inset-*) 在不支持 env() 或安全区为 0 时解析为 0px ——
   所以安卓 App、桌面浏览器、安卓浏览器全部零影响，不需要额外的媒体查询去分设备。
   注意这里只动 top/bottom/左右内边距，不碰任何尺寸与配色。
   ========================================================================== */
/* 顶栏已撤，录入条吸顶改为贴视口顶部（安全区之上），见 .capture-wrap 主规则 */
.capture-wrap{top:0}
/* v3.32：提示已改为固定在**顶部**（见 #toast 主规则），这条底部偏移作废 —— 保留会把它拉回底部。 */
#toast{top:calc(var(--sat,12px) + 12px);bottom:auto}
/* 页脚同样要避开通栏，正文/版权字才不会被胶囊挡住 */
.pdaim-footer{padding-bottom:calc(118px + env(safe-area-inset-bottom))}
.hero{padding-left:calc(24px + env(safe-area-inset-left));padding-right:calc(24px + env(safe-area-inset-right))}

/* ==========================================================================
   窄屏（手机）—— 这一版是照真机截图重排的，解决三件事：
   ① 顶栏被四个竖排文字页签撑得又高又挤（「时间轴」在窄屏被压成三行）；
   ② 大标题字号超出屏幕、被 .hero 的 overflow:hidden 裁掉半行；
   ③ 页头吃掉首屏近一半，真正要看的清单得往下翻很久才露头。
   ========================================================================== */
@media (max-width:820px){
  /* 顶栏：页签图标化后改成一排 flex，并用 space-between 把标题/页签/右侧控件分开
     （居中排的话，360px 宽时排完只剩几十 px，反而会跟右侧控件叠上）。

     标题不再藏起来 —— 上一版是把 .hleft 整个 display:none，但那条规则写成了
     `.hleft{display:none}`（权重 0,1,0），压不过基础规则 `.site-header .hleft`
     （0,2,0），所以它其实一直显示着：flex 把它挤到只剩几十 px，又被自身
     overflow:hidden 裁掉后半截，屏幕上就剩"待办"两个字 —— 也就是用户截图里
     "标题被右边按钮挡住了"的样子。现在两条都改：
     ① 选择器提到同等权重，规则真的生效；
     ② 右侧控件瘦身（撤掉 ⚡、滑块换圆点，省 60px），三个字放得下，就把它请回来。
     顺带把条数/备份那行小字继续收着 —— 手机上它只会抢位置。 */
  /* 窄屏下页签图标略缩（底栏 .tab 沿用 .np-ico） */
  .np-ico{width:18px;height:18px}

  /* 录入条吸顶：顶栏已撤，贴视口顶部即可（安全区之上） */
  .capture-wrap{top:0}

  /* 首屏：顶栏已撤，只需让开刘海/灵动岛的安全区，不用再为 56px 高的胶囊留位。
     标题字号下限保持 29px（宽度余量来源，别因名字短就抬回去）。 */
  .hero{padding:calc(36px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 16px calc(20px + env(safe-area-inset-left))}
  .hero .eyebrow{font-size:10.5px;letter-spacing:.24em;margin:0 0 10px}
  .hero h1{font-size:clamp(29px,8.2vw,44px);line-height:.94}
  .hero .subtitle{margin-top:12px;font-size:13.5px;line-height:1.65}
  .hero::before{background-size:30px 30px}      /* 点阵跟着缩小，密度观感才一致 */

  /* 以下一段是"尽早露出真正的内容"：区块上边距、区块标题、工具条逐层收窄。
     只压间距和字号 —— 事实数字（.tl-meta）、空态提示、控件尺寸都不动。 */
  .pdaim-section{padding:22px 0 44px}
  .section-kicker{margin-bottom:8px;font-size:11px;letter-spacing:.2em}
  .section-intro h2{font-size:clamp(28px,7.8vw,40px)}
  .section-intro p{margin-top:12px;font-size:13px;line-height:1.7}
  /* ★ 3.5.4：窄屏这条原来把下外边距压成 12px —— 手机（≤1080px）上真正生效的是它，
     所以"标签和下面列表的间距翻倍"必须**在这里**改，光改基础规则是白改（实测展开后
     间距仍是 12px）。现在下边距跟基础规则一致：34px（原来是 16/12 的两倍以上）。 */
  .toolbar{margin:20px 0 34px}
  .tl-meta{margin-top:18px}

  /* 统计 / 设置没有 hero，顶栏也已撤，顶部只需一点呼吸位（时间轴已降级为清单模式，
     不再有独立的 timeline 视图，下面那条 data-view="timeline" 删掉）。 */
  body[data-view="stat"] .pdaim-section,
  body[data-view="settings"] .pdaim-section{padding-top:18px}

  .feature-grid{grid-template-columns:1fr}
  .row{flex-direction:column;gap:0}
}
/* ==========================================================================
   动效增强 —— 只补缺口，不改既有动画的参数
   原则：① 全部是可单独删除的独立规则，删掉任何一条功能都照常；
        ② 没有一条碰到布局（只动 transform / opacity / 高度这类合成友好属性）；
        ③ prefers-reduced-motion 由文件末尾那条全局规则兜底（下面另补两条例外）。
   ========================================================================== */

/* ---------- 1. 按下反馈 ----------
   原来全站只有 :hover，一条 :active 都没有。触屏（iOS / Android）根本不触发 :hover，
   所以在此之前手机上点任何按钮都是"零反馈"，只能靠页面跳变来确认点上了。
   这里给所有可点元素一个"沉一下"的手感；按下用 60ms（跟手），松开的回弹仍走原时长。
   注意必须写成真类选择器而不是 :where(...) —— :where 权重为 0，
   会被上面 .btn:hover 的 translateY(-1px) 压住，鼠标按住时反而不动。 */
.btn:active,.nav-pill:active,.pill:active,.st:active,.segbtn:active,
.theme-dot:active,.mini:active,.pill-x:active,.addpill:active,
.chip[data-tag]:active,.chip.goalchip:active,.backup:active,.sel-btn:active{
  transform:translateY(1px) scale(.972);
  transition-duration:60ms;
}
/* 按下灰罩：盖一层跟元素同圆角的半透明灰（linear-gradient 实色技巧 ——
   background-image 会叠在 background-color 之上，实底按钮也照样变灰）。
   变化是瞬时的（background-image 没法过渡），但位移/缩放仍走过渡，
   而且灰罩严格贴着元素自己的圆角 —— 用户要的就是"整个变灰"而不是"一块方形灰"。
   灰罩色直接复用 --tap（浅色压灰 / 深色提亮），两个主题各自成立。 */
.btn:active,.nav-pill:active,.pill:active,.st:active,.segbtn:active,
.theme-dot:active,.mini:active,.pill-x:active,.addpill:active,
.chip[data-tag]:active,.chip.goalchip:active,.backup:active,.sel-btn:active{
  background-image:linear-gradient(var(--tap),var(--tap));
}
.tick:active{transform:scale(.86)}          /* 勾选框最小，动作要更明显才看得见 */
.vchip:active{opacity:.72}                  /* 统计页细分 chip 只压暗，不做位移（太小） */
.switch:active{transform:scale(.955)}        /* 开关只压一下，不做位移（横向控件，位移看着像歪了） */

/* ---------- 2. 键盘焦点环 ----------
   :focus-visible 只在键盘 / 辅助设备操作时命中，鼠标点击不会出现，所以不污染现有视觉。
   加 !important 是因为页面里有 5 处 outline:0（.capture input / .search / .newtag-input /
   .tagrow input / .field input）—— 不带它的话输入框永远拿不到焦点环。
   注意一个反直觉的点：**文本输入框只要聚焦就一定命中 :focus-visible**（规范如此，
   不看你用鼠标还是手指）—— 所以手机上点一下输入框，这一圈环必然会出来，躲不掉。 */
*:focus-visible{outline:2px solid var(--ring)!important;outline-offset:2px}
/* 文本输入框例外：既然"一聚焦就必然画框"躲不掉，而用户明确说
   「这显得有点突兀」「深色的就别有这种选中的框了」「直接弄个一闪一闪的光标就行，
   不用再弄个框把输入键框起来」—— 那就把文本框从那条规则里摘出来。
   聚焦提示改由「闪烁光标（caret）+ 输入区自身的变化」承担（见 .capture input:focus）。
   **非文本控件（按钮 / 开关 / 链接 / .segbtn / .tick）仍保留上面那圈 ring**，
   键盘可达性不受影响。 */
input:focus-visible,textarea:focus-visible{outline:none!important}

/* ---------- 3. 弹层出场 ----------
   原来只有入场（.mask.on 播 fadein、.modal 播 rise），关闭时 class 一摘就瞬间消失。
   现在关闭会给 .mask 挂 .closing 先播完退场再真正隐藏（见 closeModal / openMask）。 */
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes fall{from{opacity:1;transform:none}to{opacity:0;transform:translateY(10px) scale(.985)}}
.mask.closing{animation:fadeout .17s ease both}
.mask.closing .modal{animation:fall .17s cubic-bezier(.4,0,.7,1) both}

/* ---------- 4. 打勾 / 删除的退场动画 ----------
   ★ 3.5.2（用户重新定义，两条都照这个来）：
     "这一整个条被压缩，相当于直接被挤掉了。因为下面的可能要上来嘛，直接点击，
      再过个几帧之后，就是我们点勾或点叉之后，它就直接像一张纸一样被压缩掉了"
   所以：**只有纵向压扁**，不再往右抽走 ——
     0~16%   先把反馈亮出来（打勾＝绿勾、删除＝标题与 ✕ 变红），给"点中了"几帧确认时间
     16~100% 整条像纸一样被压掉：scaleY 1 → 0.015（上下边缘一起向中线合），
             同时 scaleX 微微收到 0.965（"被挤"的感觉），**从头到尾不加位移**
   压完（动画结束）才落数据，紧接着下面的条目走 FLIP 平滑补位 —— 视觉上就是
   "这一条被挤没了，下面的顶上来"。
   为什么不再淡出：它已经被压成一条 1.5px 的线，再淡出反而多一层。
   全程只动 transform / opacity（都能走合成器）。**没有 filter** ——
   3.5.0/3.5.1 曾用 `filter:brightness()` 当"亮线"，安卓 WebView 上动画化的 filter 会被
   丢回软件光栅化，直接卡成"变绿、停一会儿、消失"（用户实测）。亮线现在由 ::after 的
   opacity 承担（见 rowFlash）。 */
@keyframes rowOut{
  0%{transform:scale(1,1);opacity:1}
  16%{transform:scale(1,1);opacity:1}
  100%{transform:scale(.965,.015);opacity:1}
}
.item.row-out,.hwcard.row-out{
  animation:rowOut 420ms cubic-bezier(.45,.05,.55,.95) both;
  pointer-events:none;will-change:transform;
}
/* 那道"亮线"：白色覆盖层只动 opacity（合成器友好），峰值落在快压到底的那两帧 */
.item.row-out::after,.hwcard.row-out::after{
  content:'';position:absolute;inset:0;border-radius:inherit;background:#fff;
  pointer-events:none;opacity:0;
  animation:rowFlash 420ms cubic-bezier(.45,.05,.55,.95) both;
}
@keyframes rowFlash{0%{opacity:0}16%{opacity:0}62%{opacity:.45}88%{opacity:.92}100%{opacity:0}}
/* 打勾：勾选框立刻变绿并弹一下，标题也转绿。
   ★ 3.5.3（用户实测："为什么我现在点了删除，它前面那个对号键会亮啊？…它莫名其妙亮了个对号，
   还是绿色的"）：原来这条挂在 `.row-out` 上，而 `.row-out` 是**打勾和删除共用的**基类 ——
   于是点 ✕ 删除时，左边的勾选框也被点亮成绿勾。绿勾只属于"完成"，必须挂在
   `.row-out-ok` 这个只给打勾用的子类上；删除那边只有标题与 ✕ 变红。 */
.item.row-out-ok .tick{
  background:var(--ok);border-color:var(--ok);color:#fff;
  transition:transform 180ms var(--mo-soft);transform:scale(1.18);
}
.item.row-out-ok .t{color:var(--ok)}
/* 删除：整条泛一层淡红、标题与 ✕ 变红。
   ★ 划掉那条线**删了**（用户："如果标题是两行的话，我发现你画的横线是在文本的最中间画一条线呀。
   那还不如不画线算了，你别画线了"）—— 我用的是绝对定位的一条 `::after` 横线，
   `top:54%` 量的是**整个标题盒子**的中间，标题一旦换行就横在两行之间，读起来像一条无关的线。
   真要做"划掉"的正确姿势是 `text-decoration:line-through`：它会给每一行各画一条、
   自动贴合行高，只是没有"从左划到右"的过程。用户没要这个，先不加。 */
.item.row-out-del{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--danger) 9%,transparent);border-radius:12px}
.item.row-out-del .t{color:var(--danger)}
.item.row-out-del .acts .mini{color:var(--danger)}

/* ---------- 5. 新录入的那一条落位 ----------
   回车加一条，原来那一行是"凭空出现"的。这里只让刚录入的那一条轻轻落下，其余行不动。
   判据是 id + 时间戳（见 addItem / itemHTML），所以页内重渲染（打勾、换标签、搜索）
   不会整页重播 —— 本项目早先正是栽在「无条件入场动画 + innerHTML 整体重建」上。 */
@keyframes itemIn{from{opacity:0;transform:translateY(-7px) scale(.995)}to{opacity:1;transform:none}}
.item.just-added{animation:itemIn .34s var(--mo-soft) both}

/* ---------- 6. 写法提示的展开 / 收起 ----------
   原生 <details> 是"啪"一下弹开的。Chrome 131+ 支持 ::details-content 伪元素，
   配合 interpolate-size:allow-keywords 就能给高度做过渡；不支持的浏览器
   整段 @supports 被丢弃，退回原来的瞬时开合（优雅降级，不会坏）。 */
@supports selector(::details-content){
  .hint{interpolate-size:allow-keywords}
  .hint::details-content{
    height:0;overflow:hidden;
    transition:height var(--mo-base) var(--mo-soft),
               content-visibility var(--mo-base) allow-discrete;
  }
  .hint[open]::details-content{height:auto}
}

/* ==========================================================================
   底部导航（v3 新增，独立于旧顶栏，便于整体回滚）
   -------------------------------------------------------------------------
   原顶栏（.site-header）撤掉后，这里在屏底放一条「灵动岛」胶囊：居中、浅底、大圆角、
   轻微毛玻璃，内部 3 个等分页签。胶囊中轴线上方再悬浮一颗圆形录入键。
   整条 nav 占满屏宽但 pointer-events:none，只让胶囊本体接点击 —— 胶囊两侧的留白
   不会挡住下面的内容（旧顶栏是整条可点的，会吃掉下方点击）。
   ========================================================================== */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:80;
  display:flex;justify-content:center;
  /* 让出 Home 指示条的安全区，胶囊整体抬到它上面。
     v2.5：再额外抬 8px —— 用户反馈"位置太靠下、按的时候不好按"（贴屏底会跟系统手势抢）。
     ★ v3.36（用户："上下滑动时会跳动：往上滑它就往上移一点，往下滑就往下移一点"）：
     这里**只能读 JS 冻结过的 var(--sab)，绝不能再读 env(safe-area-inset-bottom)**。
     env() 在安卓上是动态值 —— 滚动时系统手势条自动隐藏/显隐切换，这个值就跟着变，
     而底栏是 bottom:0 锚定的，padding-bottom 一变整条栏就上下挪几像素，
     表现恰好就是"跟着手指往上/往下移一点"。--sab 在启动时算好一次（原生 insets 与 env 取大者），
     之后只在转屏时重读，滚动期间纹丝不动。 */
  padding-bottom:calc(var(--sab,0px) + 18px);
  pointer-events:none;
  /* 给悬浮球 + 胶囊一点向上的呼吸位，别贴死屏幕下沿 */
  padding-top:14px;
  /* —— 形状参数定稿（这几个数改这里就能调轮廓）——
     --bar-h 栏高、--btn-d 圆钮直径、--wrap 包边宽、--tr-r 过渡凹角半径、--end-r 两端圆角。
     实际轮廓由 JS 按实测栏宽算出 SVG 路径（见底部 buildBarShape）：垂直尺寸固定 px，
     只有水平布局随栏宽自适应，保证圆钮永远是 56px、栏永远是 48px。 */
  --bar-h:48px;--btn-d:56px;--wrap:6px;--wrap-max:20px;--tr-r:16px;--end-r:24px;
  /* 玻璃层 / 水波层比轮廓大一圈的 overscan：长按时「水环」膨胀，轮廓会探出 capsule
     的底边（那是正常的——水环本来就该凸出去），所以承载它的元素必须比轮廓大这么多，
     否则会被自己的盒子切平。JS 会把裁切路径同步平移同样的距离，两边永远对齐。 */
  --over:18px;
}
/* 胶囊只做定位容器：高度由 JS 按「栏高 + 最大膨胀」算出（见 buildBarShape 的 capH），
   width 固定居中。视觉全交给 .bar-glass（磨砂玻璃栏体），本身不接点击。
   高度里刻意留了一截**上方余量**：水环膨胀时轮廓向上长，而栏体本身的中心必须原地不动
   （用户原话："你不要让它直接往上移，让它保持在原位"），所以多出来的空间全部记在顶部。 */
.tabbar .capsule{
  position:relative;pointer-events:none;
  width:min(360px,calc(100% - 32px)); /* 左右各 16px 外距，栏整体居中 */
  margin:0 auto;height:82px;          /* JS 会按参数重算覆盖，这里只是首帧兜底 */
}
/* 抬升感 —— 注意：这**不是**描边，是一团摊在栏体下方的柔影。
   上一版沿轮廓描了一圈线（.bar-edge），用户直接读成"外面多余出来一个方形框"，
   而且白底上玻璃本身太淡、只剩那圈线，看起来就像凭空画了个框。现在改用柔影表达
   "这块玻璃被托起来了"，它没有任何硬边，不可能被读成框。 */
.tabbar .capsule::after{
  content:'';position:absolute;left:6%;right:6%;bottom:-10px;height:34px;z-index:0;
