const WD = { l: null, r: null };                  // 左词的右缘 / 右词的左缘（胶囊坐标系）
function measureWords(){
  const bl = document.querySelector('.bar-words .bl');
  const br = document.querySelector('.bar-words .br');
  if (!bl || !br || !capsuleEl){ WD.l = null; WD.r = null; return; }
  const cr = capsuleEl.getBoundingClientRect();
  const rect = (el) => { const rg = document.createRange(); rg.selectNodeContents(el);
    const r = rg.getBoundingClientRect(); return { left: r.left - cr.left, right: r.right - cr.left }; };
  WD.l = rect(bl).right;    // 左词的**右缘**（被逼近的那一侧）
  WD.r = rect(br).left;     // 右词的**左缘**
}
const WORD_BASE = .62, WORD_FADE = 44;            // 常态透明度 / 开始淡出的逼近距离
function fadeWords(off){
  if (!capsuleEl || WD.l === null || WD.r === null) return;
  const capW = capsuleEl.getBoundingClientRect().width;
  const fr = (shapeState.btnD || 56) / 2;
  const cx = capW / 2 + off;                      // 圆钮中心（胶囊坐标系）
  const tL = Math.max(0, Math.min(1, 1 - ((cx - fr) - WD.l) / WORD_FADE));
  const tR = Math.max(0, Math.min(1, 1 - (WD.r - (cx + fr)) / WORD_FADE));
  capsuleEl.style.setProperty('--wl-o', (WORD_BASE * (1 - tL)).toFixed(3));
  capsuleEl.style.setProperty('--wr-o', (WORD_BASE * (1 - tR)).toFixed(3));
}
/* v2.5：轮廓与按钮**同一帧**更新。
   用户反馈"左右滑动时黑色的圆钮会有一定延迟才能跟上这个框"——真因不是逻辑反了，而是
   pointermove 一帧内可能派发多次，每次都要重算 SVG 路径（还带一份距离变换），轮廓就比
   按钮慢半拍。这里把跟手计算收敛到**每帧一次**（取最后一次位移）：按钮的 transform 与
   轮廓的 path 写在同一个回调里，绝不可能一先一后。 */
let fabDxPending = 0, fabRaf = 0;
function setFabVoice(dx){
  fabDxPending = dx;
  /* ★ v3.5：`.dragging` 必须**先挂**再排帧 —— v3.4 的顺序是"先写位移、后挂类"，
     于是跟手的**第一帧**仍带着 .fab 那条 transform 过渡（180ms），一上手就能感觉到迟滞。
     先挂类 = 第一帧起就没有过渡。 */
  if (capsuleEl) capsuleEl.classList.add('dragging');
  if (fabRaf) return;
  fabRaf = requestAnimationFrame(() => { fabRaf = 0; applyFabVoice(fabDxPending); });
}
function applyFabVoice(dx){
  const off = fabTravel(dx);
  fab.style.transform = 'translate(-50%,-50%) translateX(' + off.toFixed(2) + 'px)';
  if (capsuleEl){
    capsuleEl.style.setProperty('--fabdx', off + 'px');
    /* 流光的强度按 |off| / SAFE_ZONE 渐变（0→1）→ **跟手就亮**，
       不必等越界之后才"啪"地一下出现（用户要"滑到左边，左边就变成流光"）。
       方向语义不变：安全范围内仍不算方向、松手照样取消；这里只管观感。 */
    const ramp = Math.min(1, Math.abs(off) / SAFE_ZONE);
    capsuleEl.style.setProperty('--flow-l', off < 0 ? ramp.toFixed(3) : '0');
    capsuleEl.style.setProperty('--flow-r', off > 0 ? ramp.toFixed(3) : '0');
    capsuleEl.classList.add('dragging');
  }
  fadeWords(off);                                // 被逼近的那一侧的词变淡（dx=0 时回到常态）
  /* 手指一动就立刻打断水环膨胀：否则"鼓出的水环"会和"跟手的 bulge"两个动画抢同一个
     shapeState.wrap，轮廓会跳。打断即落到常态包边，视觉上就是从水环平滑进入拖拽。 */
  cancelAnimationFrame(shapeState._rafRing);
  shapeState.wrap = null;
  shapeState.btnCx = off;
  buildBarShape({ skipMap: true });   // 只重建路径；置换图等松手后那次 tweenShape 落点再补
}
/* 进入长按态（按用户逐帧描述的顺序）：
   ① 水波纹从圆钮荡开 → ② 栏体两端那两个页签"先分出来、再融进去" → ③ 栏体自己鼓起一圈水环
   → ④ 全屏变灰 → ⑤ 圆钮图标切成麦克风。
   圆钮**原地不动、不放大、不上移**（见 .fab.fab-rec 的注释）；导航栏之外不出现任何元素。 */
function enterVoiceLong(){
  voiceActive = true; voiceSide = 0;
  voiceHandled = false; voiceFillOnly = false;    // 新一轮手势：上一次的"结果已消费"标记清零
  fab.classList.remove('fab-press', 'fab-pulse');
  fab.classList.add('fab-rec');
  measureWords();                                 // 避让量按本轮实测矩形算（栏宽/字号都可能变）
  setFabVoice(0);                                 // 归零：bulge 先回到中轴（同时把 --wd-* 归零）
  /* 整套长按视觉（水波纹 .voice-ripple / 栏两端两个字 .bar-words / 麦克风图标 / 流动层 .bar-flow）
     全部由 .capsule 上的 .voice 一个类驱动；流动的左右由 side-l / side-r 驱动。 */
  if (capsuleEl) capsuleEl.classList.add('voice');
  /* 折射改用"在动的噪声"（v2.5）：长按期间玻璃边缘像水面一样波光粼粼。
     松手时在 cancelVoice 里切回静态置换图。 */
  liquidSource('noise');
  /* v3.23（用户："导航栏之外界面模糊一些"）：长按说话时把页面推到焦外。
     底栏不受影响（遮罩 z-index:70，底栏在它上面）；不再有灰色蒙版。 */
  if (voiceDim) voiceDim.classList.add('on');
  const tabs = document.querySelectorAll('.tab[data-view]:not([style*="display:none"])');
  if (tabs[0]) tabs[0].classList.add('melt-l');// 清单：分出来 → 融进中间
  if (tabs[1]) tabs[1].classList.add('melt-r');// 统计：分出来 → 融进中间
  swellRing();                                   // 栏体自己鼓出一圈水环，再收回成栏形
  if (vlive) vlive.textContent = '语音录入：向左滑直接录入，向右滑进入编辑，松手生效';
  startVoiceIfAllowed();                         // 开了原生语音才真正起识别，否则走键盘降级
  /* 必须排在 startVoiceIfAllowed() 之后：它会先把上一轮的 voicePending 清空。 */
  setVoiceStatus();
}
/* 松手结算：左＝直接录入、右＝进入编辑、居中 / 不足＝取消。 */
function voiceLeft(){
  const text = (voicePending || '').trim();
  /* 先打标记再取消手势：cancelVoice() 会把识别停掉，原生那边"停止→吐最终结果"是异步的，
     标记必须在它到达之前就位（否则又入一次库，见 voiceHandled 的说明）。 */
  voiceHandled = true;
  if (!text) voiceFillOnly = true; else voiceConsumed = text;
  cancelVoice();
  if (text){                                     // 有识别结果 → 直接入库（与打字同一入口）
    const el = document.getElementById('entry');
    if (el){ el.value = text; commitEntry(); }
  } else {                                       // 没结果（语音关 / 不支持 / 没听清）→ 弹键盘降级
    goEntry();
    toast('点键盘上的麦克风说话');
  }
}
function voiceRight(){
  const text = (voicePending || '').trim();
  voiceHandled = true;
  if (text) voiceConsumed = text;
  cancelVoice();
  openEditNew(text);                             // 进入编辑：改标签 / 日期 / 优先级 / 分区，确定才入库
}

fab.addEventListener('pointerdown', e => {
  e.preventDefault();                             // 阻止随后可能的文本选择 / 合成 click
  try { fab.setPointerCapture(e.pointerId); voiceCapId = e.pointerId; } catch (_){}
  fab.classList.add('fab-press');                 // 起手即给"按下去了"的反馈
  fab.classList.add('fab-pulse');                 // "波动一下"（scale 1→1.14→1）
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (_){} }   // 起手轻震
  voiceStartX = e.clientX; voiceLastX = 0; voiceSide = 0;
  voiceStartY = e.clientY; voiceLastY = 0; cancelArmed = false;
  fabTimer = setTimeout(() => { fabTimer = 0; enterVoiceLong(); }, LONG_PRESS_MS);
});
fab.addEventListener('pointermove', e => {
  if (!voiceActive) return;                       // 跟手只在长按态内生效
  /* ---- 上滑取消（v2.5 新增，按用户设计）----
     "往上滑超过一定范围（大概是一个语音录入按钮的距离）就直接取消本次语音输入"，
     并且取消时上方那行识别文字要发红光。这里只**进入待取消态、松手才真取消**
     （用户拍板甲方案），滑回下方还能救回来。垂直判定优先于左右方向判定 ——
     手指往上走时不再跟手左右，免得"取消"和"选边"同时发生。 */
  const dy = e.clientY - voiceStartY;
  voiceLastY = dy;
  const armed = dy <= -CANCEL_LIFT;
  if (armed !== cancelArmed){
    cancelArmed = armed;
    if (capsuleEl) capsuleEl.classList.toggle('cancel-armed', armed);
    if (armed){
      voiceSide = 0;
      if (capsuleEl){
        capsuleEl.classList.remove('side-l', 'side-r');
        capsuleEl.style.setProperty('--flow-l', '0');
        capsuleEl.style.setProperty('--flow-r', '0');
      }
      if (vlive) vlive.textContent = '松开：取消本次录入';
      if (navigator.vibrate){ try { navigator.vibrate([18,60,18]); } catch(_){} }
    } else if (vlive){ vlive.textContent = '继续滑动选择'; }
  }
  if (armed){ setFabVoice(0); return; }           // 待取消态：栏体归中，只留红光提醒
  const dx = e.clientX - voiceStartX;
  voiceLastX = dx;
  /* v3.2：按钮的位移**当场写**，只有轮廓重建才排队到 rAF。
     用户反馈"这个按钮跟我手指头是脱离的、有延迟"——根因是上一版把两者一起压进了 rAF，
     v3.3：按钮按钮与轮廓**必须在同一帧、同一个回调里写**（applyFabVoice 本来就这么做）。
     上一版把按钮位移单独搬到 pointermove 里"当场写"、轮廓仍走 rAF —— 两者分属两个时机，
     快速拖动时就出现用户截图抓到的"黑圆走到前面、包边落在后面"的错位。
     跟手的手感改由**增益**保证：fabTravel 的 K 从 70 收到 110，头 40px 几乎 1:1。 */
  setFabVoice(dx);
  /* 安全范围（用户原话）："手不一定会抖，所以设置一个安全范围，比如错位按钮的一半，
     也就是当前语音录入按钮半径那么长。在这个范围内左右动是没关系的。"
     ±28px 内＝还没选方向（圆钮仍跟手移动，但没有任何方向表示）；
     越界＝单次震动提示 + 那一侧的玻璃开始流动（side-l / side-r）。 */
  const side = Math.abs(dx) <= SAFE_ZONE ? 0 : (dx < 0 ? -1 : 1);
  if (side !== voiceSide){                         // 每次跨越只震一次，不每帧震
    voiceSide = side;
    /* 方向的表达（本轮重做）：不给按钮加任何颜色（原 .fab-glow 光晕已删，用户"太丑了"）。
       越界的那一半玻璃自己开始"流动"（.bf-l / .bf-r 柔光带漂移，见 CSS .bar-flow）。 */
    if (capsuleEl){
      capsuleEl.classList.toggle('side-l', side === -1);
      capsuleEl.classList.toggle('side-r', side === 1);
    }
    if (side === -1 && navigator.vibrate){ try { navigator.vibrate(18); } catch(_){} }       // 越界进左侧：单次短震
    else if (side === 1 && navigator.vibrate){ try { navigator.vibrate([12,40,12]); } catch(_){} } // 越界进右侧：双次短震
    if (vlive) vlive.textContent = side === -1 ? '松开：直接录入' : side === 1 ? '松开：进入编辑' : '继续滑动选择';
  }
});
fab.addEventListener('pointerup', e => {
  try { if (voiceCapId != null) fab.releasePointerCapture(voiceCapId); } catch (_){}
  voiceCapId = null;
  if (voiceActive){
    /* ① 上滑待取消（v2.5，用户拍板"松手才真取消"）：直接取消，不再看左右。
       ② 否则按安全范围结算：越界侧＝执行、范围内＝取消。
       两处阈值必须同源（都是 SAFE_ZONE），否则会出现"震过了提示但松手没反应"的错位。 */
    if (cancelArmed){
      cancelArmed = false;
      voiceCancelled = true;                       // v3.20：这次的结果不要了
      if (capsuleEl) capsuleEl.classList.remove('cancel-armed');
      if (vlive) vlive.textContent = '';
      cancelVoice();
      toast('已取消本次语音输入');
      return;
    }
    const side = Math.abs(voiceLastX) <= SAFE_ZONE ? 0 : (voiceLastX < 0 ? -1 : 1);
    if (side === -1) voiceLeft();
    else if (side === 1) voiceRight();
    else cancelVoice();                            // 居中或不足 → 取消
    if (side === 0) voiceCancelled = true;         // v3.20：居中松手同样丢弃结果
    return;
  }
  if (fabTimer){ clearTimeout(fabTimer); fabTimer = 0; goEntry(); }   // 没到阈值 → 单击（切录入）
  fab.classList.remove('fab-press', 'fab-pulse');
});
/* 手指滑走 / 被打断（来电、系统手势）：长按态→取消，非长按态→复位 */
['pointercancel', 'pointerleave'].forEach(ev => fab.addEventListener(ev, () => {
  if (voiceActive) cancelVoice(); else fabReset();
}));
/* 键盘可访问性：回车 / 空格 = 单击（切录入）。pointer 事件覆盖鼠标/触摸，这里补键盘。 */
fab.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){ e.preventDefault(); goEntry(); }
});

/* ---------------- 原生语音桥（设备端离线识别，零联网） ----------------
   桥对象 window.YuShiNative 由安卓壳经 addJavascriptInterface 注入；PWA / iPhone 上没有，
   所有访问都先判断存在，缺了就走"弹键盘"降级（见下方 startVoiceIfAllowed）。
   识别结果 / 部分结果 / 错误 / 结束，统一经 window 事件 yushi:speech 回传。 */
function voiceReady(){
  try {
    return !!(window.YuShiNative && typeof window.YuShiNative.isAvailable === 'function'
      && window.YuShiNative.isAvailable() === 'true');
  } catch (_){ return false; }
}
function offlineReady(){
  try { return !!(window.YuShiNative && typeof window.YuShiNative.startVoiceOffline === 'function'); } catch (_){ return false; }
}
function startVoiceIfAllowed(){
  if (!S.voice) return;                            // 开关关 → 不调原生识别（直接弹键盘）
  voiceHandled = false; voiceFillOnly = false;      // 每次开识别都从干净状态起步
  /* ★ v3.18：本地 Vosk 识别优先 —— 模型在包里、完全不联网、**输入法不出现**。
     这条必须排在"没有 startVoice 就降级"那句之前：Vosk 不需要系统识别器。 */
  if (offlineReady()){
    voicePending = '';
    try { window.YuShiNative.startVoiceOffline(); } catch (_){}
    /* ★ v3.34（用户："语音录入的时候上面那个录入提示去哪儿了"）：本地识别这条路是 3.18 加的
       提前返回，把后面"设置提示行"那步一起跳过了 —— 于是长按时上面那行"说：时间 + 做什么"
       一直空着。这里显式补一次。 */
    try { setVoiceStatus(); } catch (_){}
    return;
  }
  if (!window.YuShiNative || typeof window.YuShiNative.startVoice !== 'function') return; // 无桥 → 降级
  voicePending = '';
  /* v3.4：本机没有设备端离线模型时，**用户开了「系统语音」**才走系统的语音服务
     （声音由手机的语音服务处理、可能联网）。没开就维持键盘降级 —— 零联网默认不破。 */
  /* v3.16（用户选丙）：系统语音改走「拉起系统语音输入面板」——
     不再自己绑定识别服务（国产 ROM 常把 RecognitionService 限定给系统应用，
     第三方绑不上就是 ERROR_CLIENT 5）。面板由系统自己弹、自己收音。 */
  if (!voiceReady() && S.voiceSystem){
    if (typeof window.YuShiNative.startVoicePanel === 'function'){
      try { window.YuShiNative.startVoicePanel(); return; } catch (_){}
    }
    if (typeof window.YuShiNative.startVoiceSystem === 'function'){
      try { window.YuShiNative.startVoiceSystem(); return; } catch (_){}
    }
  }
  try { window.YuShiNative.startVoice(); } catch (_){}
}
function stopVoiceIfActive(){
  if (window.YuShiNative && typeof window.YuShiNative.stopVoice === 'function'){
    try { window.YuShiNative.stopVoice(); } catch (_){}
  }
  /* v3.18：本地 Vosk 那条路也要收工（松手 → 结束录音 → 出结果） */
  if (window.YuShiNative && typeof window.YuShiNative.stopVoiceOffline === 'function'){
    try { window.YuShiNative.stopVoiceOffline(); } catch (_){}
  }
}
/* ★ v3.36（用户："语音输入的时候，有时候总是出现叠字…比如我说明天种树，它就出现了
   两个名字、两个数字"）：本机识别是流式的，端点/解码偶发重复片段时，吐出来的整句会
   正好是两段相同内容（或同一个片段连着说两遍）。这里做**保守**去重，只处理确定性很高的形态：
     ① 整句 = 两段完全相同的内容；
     ② 同一个 2 字及以上的片段连续重复（"明天明天种树" → "明天种树"）。
   刻意**不**处理单个字的重复："看看 / 刚刚 / 常常 / 妈妈"本来就是正常词，
   为了一次误识别把它们砍掉，代价比留着叠字大得多。 */
function normalizeSpeech(s){
  let t = String(s || '').trim();
  if (!t) return '';
  const half = t.length / 2;
  if (Number.isInteger(half) && half >= 2 && t.slice(0, half) === t.slice(half)) t = t.slice(0, half);
  t = t.replace(/(.{2,12}?)\1{1,2}/g, '$1');
  return t.replace(/\s{2,}/g, ' ').trim();
}
window.addEventListener('yushi:speech', e => {
  const d = e.detail || {};
  if (d.type === 'partial' || d.type === 'result'){ voicePending = normalizeSpeech(d.text); }
  else if (d.type === 'panel_text'){ voicePending = normalizeSpeech(d.text); }
  /* v3.16：走系统语音面板时，文字是**松手之后**才回来的（面板要等用户把话说完），
     那时手势早就结束了 —— 所以这里直接把结果落进录入框并入库，等价于"直接录入"那一侧。 */
  if ((d.type === 'result' || d.type === 'panel_text') && !voiceActive && voicePending){
    /* v3.20：被取消的那次不落地（本地识别要等松手后才出文字，取消标志在这里生效） */
    if (voiceCancelled){ voiceCancelled = false; voicePending = ''; return; }
    /* ★ v3.36：被左滑 / 右滑消费掉的那段文字又回传了一次 → 直接丢（见 voiceConsumed 说明）。 */
    if (voiceConsumed && voicePending === voiceConsumed){
      voiceHandled = false; voicePending = ''; return;
    }
    /* ★ v3.36：左滑时手上没文字 → 已经弹了键盘。这时迟到的结果**只填进输入框**，
       不入库（让用户自己看一眼再回车）。 */
    if (voiceFillOnly){
      const el = document.getElementById('entry');
      if (el && !el.value.trim()) el.value = voicePending;
      voiceFillOnly = false; voiceHandled = false; voicePending = '';
      return;
    }
    /* ★ v3.36：这次的结果已经被左滑 / 右滑那一支消费过了 → 丢弃，不再入第二条 /
       不再偷偷在编辑弹窗背后插一条。 */
    if (voiceHandled){ voiceHandled = false; voicePending = ''; return; }
    const el = document.getElementById('entry');
    if (el){ el.value = voicePending; commitEntry(); toast('已用语音录入'); }
    voicePending = '';
    return;
  }       // 跟手时实时回填
  else if (d.type === 'unavailable'){ voicePending = ''; toast('离线识别不可用：请在设置→语音里打开「系统语音（可能联网）」'); }
  else if (d.type === 'error'){
    voicePending = '';
    /* v3.8：任何原生错误都要出声 —— 上一版除了 permission_denied 之外全是静默，
       真机上"什么都没发生"，根本没法判断是权限、识别器不可用还是别的问题。 */
    if (d.code === 'permission_denied') toast('没给录音权限，已改为键盘输入');
    /* v3.17：面板被取消 / 没听清 / Google 语音连不上网（国内常见）都走这里 ——
       不再甩一个英文错误码给用户，直接告诉他用键盘上的麦克风。 */
    else if (d.code === 'cancelled')
      toast('没听清，点键盘上的麦克风说话');
    /* v3.32（用户："没听清的时候后面就不要用这个了"）：不再把 f/e/p 调试参数显示给用户，
       只留一句人话；原始诊断仍打到 console，万一问题复发还能取。 */
    else if (d.code && d.code.indexOf('empty') === 0){
      try { console.log('语音诊断', d.code); } catch (_){}
      toast('没听清，靠近一点再说一次');
    }
    else toast('语音出错（错误码 ' + (d.code || '?') + '），已改为键盘输入');
  }
  // 'end'：识别自然结束，等松手时再结算，这里不做事
  if (voiceActive) setVoiceStatus();          // 识别文字实时铺到栏体正上方那一行
});

/* 切到录入界面并聚焦输入框（切页 + 焦点都走这一处，幂等） */
function goEntry(){
  if (S.view !== 'entry'){ S.view = 'entry'; ANIM = true; refresh(); }
  const el = document.getElementById('entry');
  if (el) requestAnimationFrame(() => el.focus());
}
/* 外观切换（v2.5 起长在页面右上角，原来是顶栏里那枚）：浅 → 深 → 跟随系统 三档循环。
   图标与文案都由 applyTheme 统一同步，这里只需推进档位。 */
function cycleTheme(){
  const order = ['light', 'dark', 'auto'];
  const next = order[(order.indexOf(S.theme) + 1) % 3] || 'light';
  applyTheme(next, true);
}

/* 外观键（v2.5 定稿）：它现在是**底栏左端的图标键**，与右端的设置齿轮同款同尺寸。
   所以不再需要"10 秒淡出 / 点右上角唤回"那套（那是它做右上角浮层时的权宜之计），
   点击即三档循环。图标与文案仍由 applyTheme 统一同步。 */
(function themeFabWire(){
  const btn = document.getElementById('themeFab');
  if (!btn) return;
  /* 筛选抽屉的高补间（原因见 .toolbar 那段注释：高度不能交给 CSS 过渡）。 */
  const TOOLS_MS = 300;
  let toolsRaf = 0;
  function setToolsOpen(open){
    const tb = document.querySelector('.toolbar');
    if (!tb){ document.body.classList.toggle('tools-open', open); return; }
    const from = open ? 0 : Math.ceil(tb.getBoundingClientRect().height);
    let to = 0;
    if (open){
      /* 量内容高：临时放开 max-height，量完还原成 from —— 全程在同一个任务里，
         中间不会绘制。因为高度不再依赖 CSS 过渡，这一次"放开/还原"不会污染任何东西。 */
      tb.style.maxHeight = 'none';
      to = Math.ceil(tb.offsetHeight);
      tb.style.maxHeight = from + 'px';
    }
    document.body.classList.toggle('tools-open', open);
    if (toolsRaf){ cancelAnimationFrame(toolsRaf); toolsRaf = 0; }
    if (reduceMotion() || from === to){
      tb.style.maxHeight = '';          // 展开 → 回 auto；收起 → 由 CSS 的 max-height:0 管
      return;
    }
    tb.style.maxHeight = from + 'px';
    const t0 = performance.now();
    /* 收尾曲线用和 --mo-soft（cubic-bezier(.2,.9,.25,1)）同族的强缓出：
       前端快、末端收得住，和 opacity/margin 那条过渡看着是同一个节奏。 */
    const ease = u => 1 - Math.pow(1 - u, 2.6);
    const step = now => {
      const u = Math.min(1, (now - t0) / TOOLS_MS);
      tb.style.maxHeight = (from + (to - from) * ease(u)).toFixed(2) + 'px';
      if (u < 1) toolsRaf = requestAnimationFrame(step);
      else {
        toolsRaf = 0;
        /* 收尾清掉 inline 值回到 auto（展开后内容变高才不会被这个旧值裁掉）；收起态由 CSS 管。 */
        tb.style.maxHeight = '';
      }
    };
    toolsRaf = requestAnimationFrame(step);
  }
  btn.addEventListener('click', () => cycleTheme());
  /* v3.13：筛选抽屉的开关改用**事件委托**。
     为什么不能像上一版那样直接给 #filterFab 挂监听 —— 3.13 起这颗按钮被搬进了列表模板，
     每次 refresh()/切页都会重建它，一对一监听会随着旧节点一起消失（表现：按钮点不动）。
     委托挂在 document 上，重建多少次都还在。 */
  document.addEventListener('click', e => {
    const fb = e.target && e.target.closest ? e.target.closest('#filterFab') : null;
    if (!fb) return;
    const open = !document.body.classList.contains('tools-open');
    setToolsOpen(open);
    fb.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();

/* 安卓返回键会派发 Escape（见 MainActivity.onBackPressed）；长按态 / 按住中按返回都要能取消并复原。 */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (voiceActive){ cancelVoice(); }
  else if (fabTimer){ clearTimeout(fabTimer); fabTimer = 0; fab.classList.remove('fab-press', 'fab-pulse'); }
});

/* 吸顶反馈：录入条贴住顶栏时加一层更实的投影
   （不能用 IntersectionObserver —— 吸顶后它仍 100% 可见，ratio 恒为 1） */
(function stickyCapture(){
  const bar = document.getElementById('captureBar');
  const wrap = document.getElementById('captureWrap');
  if (!bar || !wrap) return;
  let ticking = false, stickTop = 0;
  /* 只在尺寸变化时读一次计算样式 —— getComputedStyle 会强制样式重算，不能放进滚动帧里 */
  function measure(){ stickTop = parseFloat(getComputedStyle(wrap).top) || 0; }
  function paint(){
    ticking = false;
    bar.classList.toggle('is-stuck', wrap.getBoundingClientRect().top <= stickTop + 1);
  }
  window.addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(paint); } }, { passive:true });
  window.addEventListener('resize', () => { measure(); paint(); });
  measure(); paint();
})();

/* 主题：light / dark / auto（auto＝跟随系统，见下方 mqDark 的 change 监听）。
   html[data-theme] 上的实际值是 light 或 dark；选 auto 时由系统深浅色决定，
   并实时监听系统变化（mqDark 的 change 回调里只动 data-theme，不碰 S.theme 持久值）。
   S.theme 是用户的选择档位，持久化进 save()；单独的 LS+'.theme' 只是给"未来要加的
   系统级快捷切换"留个读入口，无伤大雅。 */
const mqDark = matchMedia('(prefers-color-scheme: dark)');
function effectiveTheme(){
  if (S.theme === 'auto') return mqDark.matches ? 'dark' : 'light';
  return S.theme;
}
function applyTheme(t, animate){
  S.theme = (t === 'auto' || t === 'dark') ? t : 'light';   // 白名单，挡住外部乱传值
  if (animate){
    document.documentElement.classList.add('theme-changing');
    setTimeout(() => document.documentElement.classList.remove('theme-changing'), 560);
  }
  document.documentElement.dataset.theme = effectiveTheme();
  /* 外观三档图标据此切换（见 .theme-fab .ti 那组规则）——必须写 S.theme 档位，不是
     effectiveTheme()，否则"浅色"和"跟随系统（当前浅）"会显示成同一枚图标。 */
  document.documentElement.dataset.mode = S.theme;
  /* 图标与 aria/title 文案都在这里统一同步：右上角那颗按钮点一次就换一枚图标 + 一句话。 */
  const tb = document.getElementById('themeFab');
  if (tb){
    const nm = { light:'浅色', dark:'深色', auto:'跟随系统' };
    tb.setAttribute('title', '外观：' + nm[S.theme]);
    tb.setAttribute('aria-label', '外观：当前' + nm[S.theme] + '，点击切换');
  }
  try { localStorage.setItem(LS + '.theme', S.theme); } catch (e){}
  save();
}
/* 跟随系统：选 auto 时系统切浅/深，这里即时同步 data-theme（不动 S.theme） */
mqDark.addEventListener('change', () => {
  if (S.theme === 'auto') document.documentElement.dataset.theme = effectiveTheme();
});
/* 启动套用见文件末尾「启动」段：必须排在 load() 之后，S.theme 那时才从备份读好（默认 auto）。 */

/* ---------------- 流畅模式：软件渲染自动降级 + 手动开关 ---------------- */
/* 检测 WebGL 渲染器字符串：Microsoft Basic Render Driver / SwiftShader / llvmpipe 等都是软件渲染。
   实测：Intel Arc（真 GPU）报 "ANGLE (Intel, ...Arc...)"；--disable-gpu 报 "ANGLE (Microsoft, ...Basic Render Driver...)"。 */
function isSoftwareGL(){
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return true;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    const r = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : (gl.getParameter(gl.RENDERER) || '')).toLowerCase();
    return /basic render|swiftshader|llvmpipe|softpipe|software|angle \(microsoft/.test(r);
  } catch (e){ return false; }
}
const LITE_KEY = LS + '.lite';
/* gpu-render：真 GPU 才升级为 backdrop 玻璃。软件渲染下即使手动切回「完整视觉」，
   也用实底玻璃（色球/点阵/动画/高光全保留）—— backdrop-filter 在软件渲染下
   每帧全价重采样，实测一个元素就能把滚动帧率砍半以上。 */
const SOFT_GL = isSoftwareGL();
document.documentElement.classList.toggle('gpu-render', !SOFT_GL);
/* 真折射门控：backdrop-filter 配合 filter:url()（把置换应用到背景像素上）只有 Chromium 系
   能正确合成 —— 含安卓 WebView（UA 带 "Chrome"/"Chromium"/" wv"）。Safari 会解析成功但整块
   不渲染（@supports 检测不出，会骗你）；Firefox 从不支持 -webkit- 别名。二者一律关，落纯磨砂。
   判据用 UA（Chrome 串里虽也含 "Safari"，但先判 Chrome/Chromium 即可排除真正的 Safari）。 */
function isLiquidGlassCapable(){
  const ua = navigator.userAgent || '';
  const isFirefox = /Firefox\//.test(ua);
  const isChromium = /Chrome\//.test(ua) || /Chromium\//.test(ua) || /\bwv\b/.test(ua)
    || !!(window.chrome && (window.chrome.webview || window.chrome.apps));
  return isChromium && !isFirefox;
}
document.documentElement.classList.toggle('liquid-glass', isLiquidGlassCapable());
function applyLite(on){
  document.documentElement.classList.toggle('soft-render', on);
  /* 设置页那个开关（正好在设置页时）跟着同步。进设置页时会按当前状态渲染一份，
     这里是给"在设置页改完、切走又切回来"补一道，免得两处说法不一致。 */
  const sw = document.querySelector('.switch[data-set="lite"]');
  if (sw) sw.setAttribute('aria-checked', on ? 'true' : 'false');
}
function currentLite(){
  let pref = null;
  try { pref = localStorage.getItem(LITE_KEY); } catch (e){}
  if (pref === 'on') return true;          // 手动开过
  if (pref === 'off') return false;        // 手动关过（即使软件渲染也尊重）
  return SOFT_GL;                          // 否则自动检测
}
applyLite(currentLite());
/* 顶栏那颗手动切"流畅模式"的 ⚡ 已撤（手机上它和主题滑块一起把标题挤没了），
   开关挪进设置页 —— 见 renderSettings 里 data-set="lite" 那一行，
   点击逻辑在 view 的点击代理里（和"页面说明文字"同一个分支）。 */

/* ---------------- 快捷键 ---------------- */
/* `/` 的通用约定是「搜索」。这条原来直接 focus #entry，但**录入条只在录入界面可见**
   （body:not([data-view="entry"]) .capture-wrap{display:none}），
   而对 display:none 的元素调 focus() 是空操作 —— 于是这条快捷键在清单页按下去
   什么都不会发生（代码审查用真渲染实测确认：activeElement 仍是 BODY）。
   现在按当前视图分流：清单页 → 搜索框（与 `/` 的约定一致）；其它页 → 进录入界面再聚焦。 */
document.addEventListener('keydown', e => {
  const a = document.activeElement, tag = a && a.tagName;
  if (e.key !== '/' || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  e.preventDefault();
  if (S.view === 'list'){
    const sb = document.getElementById('searchBox');
    if (sb){ sb.focus(); return; }    // 清单页顶部本来就有搜索框，聚焦它（不再跳页）
  }
  goEntry();                          // 内部已是「改 S.view → refresh → rAF 后 focus #entry」
});

/* ---------------- 启动 ---------------- */
load();
/* 主题：必须排在 load() 之后，S.theme 此刻才从备份读好（默认 auto）。
   选 auto 时实际深浅由系统决定，后续系统切换由 mqDark 的 change 监听实时同步。 */
applyTheme(S.theme, false);
/* 「页面说明文字」的开关在首帧之前就要落到位 —— refresh() 是 rAF 延迟的，
   等它同步会先闪一下那段说明文字。 */
applyHelp();
/* 备份提醒：必须排在 load() 之后 —— 它要读 S.lastBackup，见函数定义处的说明。 */
backupNudge();
/* 写法提示：chip 条数由脚本数一遍填上去；开合状态记进 localStorage。
   放在 load() 之后，否则读不到已存的 hintOpen。 */
(function initHint(){
  const box = document.getElementById('hintBox');
  if (!box) return;
  const n = box.querySelectorAll('.hint-chips span').length;
  const badge = box.querySelector('.hb-n');
  if (badge) badge.textContent = n + ' 种';
  box.open = !!S.hintOpen;
  box.addEventListener('toggle', () => { S.hintOpen = box.open; save(); });
})();
refresh();
</script>
<!-- 注册 Service Worker：装上之后断网也能打开（这个 App 的数据本来就全在本地，
     不该因为没网就开不了）。放在 </body> 前，不阻塞首屏。 -->
<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () { /* 本地 file:// 打开时注册失败，正常 */ });
  });
}
</script>
