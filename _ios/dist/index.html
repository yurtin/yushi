        <p class="set-sub">长按底部圆钮说话的能力。它跟界面长什么样无关，所以单独一栏。</p>
        <!-- 语音输入：默认关。开了才在安卓上走设备端离线识别（零联网）；关着时长按圆钮直接弹键盘。
             不支持离线识别 / 没给权限 → 页面自己降级为"弹键盘 + 提示"，见 startVoiceIfAllowed。 -->
        <div class="set-row">
          <div class="set-txt">
            <b>语音输入</b>
            <span>长按底部圆钮说话，直接录入或进入编辑。只在安卓上走设备端离线识别，不上传任何内容。
              关着时（或 iPhone / 不支持的设备）长按仍是打字。</span>
          </div>
          <button class="switch" data-set="voice" role="switch" aria-label="语音输入"
                  aria-checked="${S.voice ? 'true' : 'false'}"></button>
        </div>
        <!-- v3.18：原来的「系统语音（可能联网）」开关已删除 —— 语音改成**内置本地模型**
             （Vosk 中文小模型跟包走），不联网、不弹输入法，所以包也不再声明 INTERNET。 -->
      </section>

      <section class="glass set-card${rv()}"${rvd(180)}>
        <h3>性能</h3>
        <p class="set-sub">老机型、省电模式下可以把这套视觉降下来，数据不受影响。</p>
        <!-- 流畅模式原来在顶栏（一颗 ⚡）。撤掉是因为手机上它和主题滑块一起挤掉了标题，
             功能本身有用（老机型 / 软件渲染滚动更顺），所以搬到这里。
             aria-checked 直接读 html.soft-render —— 那是唯一真相：
             它由"软件渲染自动检测"或"用户手动选择"共同决定，这里不另存一份状态。 -->
        <div class="set-row">
          <div class="set-txt">
            <b>流畅模式</b>
            <span>关掉玻璃模糊、背景点阵和入场动画，老机型滚动明显更顺。
              检测到设备在用软件渲染时会自动打开；这里的开关可以手动覆盖它。</span>
          </div>
          <button class="switch" data-set="lite" role="switch" aria-label="流畅模式"
                  aria-checked="${document.documentElement.classList.contains('soft-render') ? 'true' : 'false'}"></button>
        </div>
      </section>

      <section class="glass set-card${rv()}"${rvd(240)}>
        <h3>数据</h3>
        <p class="set-sub">数据只存在这台手机上、不上云。这里只做"导出留底"。</p>
        <!-- 备份导出从清单页工具行搬来（原来和粘贴导入并排）。#exportBtn 的点击在脚本里统一处理，
             #backup 角标由 refresh 每帧同步（未备份 / 几天前备份）。 -->
        <div class="set-row">
          <div class="set-txt">
            <b>备份</b>
            <span>把数据导成一份 json 文件存到别处。数据只存在这台手机里，记得偶尔留个底。</span>
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <button class="btn" id="exportBtn">备份</button>
            <span class="backup" id="backup"></span>
          </div>
        </div>
      </section>

      <!-- v3.8（用户要求）：设置页最下面的版本说明。
           版本号的**唯一真相源**仍是 _android/app/AndroidManifest.xml 的 versionName；
           打包时 _android/build.py 会把 APP_VERSION 常量替换成同一个值，
           所以包里显示的不会和包本身对不上。
           ★ v3.37（用户："我看设置里边的这个关于版本说明，它怎么就是一份 HTML 了？
           HTML 不是只有在浏览器上才能打开吗？我要的不是 HTML 啊，我要的是一个完完整整的 APP"）：
           这里原来写的是「整个应用就是一份 鱼事.html」—— 那是**实现细节**，不该出现在用户看的
           「关于」里；它把一个装好的独立 App 说成了网页，用户当然要问。改成人话：
           装在这台手机上的独立 App、不需要联网、数据只在本机。 -->
      <section class="glass set-card${rv()}"${rvd(240)}>
        <h3>关于</h3>
        <p class="set-sub">鱼事 · 本地待办</p>
        <div class="set-row">
          <div class="set-txt">
            <b>版本 v${APP_VERSION}</b>
            <span>装在这台手机上的独立 App，不用联网、没有账号：数据只存在这台手机里，
              不会上传到任何地方。换手机时用「备份」导出一份文件，在新手机上导入即可。</span>
          </div>
        </div>
      </section>
    </div>`;
}

/* 统计页大数字滚动计数：从 0 数到目标值。
   原来数字是"啪"一下出现的，看不出"涨了多少"；数一下能让增减有感知。
   三个必须守住的点：
   ① 结束时**必须**写回精确目标值 —— 动画中途被打断（切页、切布局）也不能留下错数字；
   ② 0 不数（"0 → 0"没有意义，反而多闪一下）；
   ③ reduced-motion 直接跳过，尊重系统设置。
   元素是每次 renderStat 重建的，旧动画里的 el 已脱离文档，写它也不会污染新页面。 */
function countUpNumbers(){
  if (reduceMotion()) return;
  const DUR = 460;
  view.querySelectorAll('.feature-grid .v').forEach(el => {
    const to = parseInt(String(el.textContent).trim(), 10);
    if (!isFinite(to) || to <= 0) return;
    const t0 = performance.now();
    el.textContent = '0';
    el.setAttribute('data-counting', '1');       // 给测试一个"还在数"的抓手
    const step = now => {
      if (!el.isConnected) return;               // 已被下次渲染换掉，别再写
      const p = Math.min(1, (now - t0) / DUR);
      const e = 1 - Math.pow(1 - p, 3);          // easeOutCubic：开头快、收尾稳
      el.textContent = String(Math.round(to * e));
      if (p < 1) requestAnimationFrame(step);
      else { el.textContent = String(to); el.removeAttribute('data-counting'); }
    };
    requestAnimationFrame(step);
  });
}

/* 标签条右端固定的那组按钮（两处标签栏共用一份 HTML）。
   放在滚动区外面，标签滚起来的时候它们不会跟着跑。 */
const tagActsHTML =
  `<div class="tagacts">` +
    `<button class="pill addpill" data-act="addtag" title="新建标签（回车确认）">＋</button>` +
    `<button class="pill addpill" data-act="managetag" title="管理标签：改名 / 删除">⚙</button>` +
  `</div>`;

function renderFilters(){
  const box = document.getElementById('filters');
  if (!box) return;
  const n = S.filterTags.length;
  /* 「全部」在不筛选时就是个静态状态；一旦选了标签，它就变成一键清空 */
  const clearPulse = filterPulse === '' ? ' pulse' : '';
  box.innerHTML = `<button class="pill${n ? '' : ' on'}${clearPulse}" data-f="" title="${n ? '清空筛选' : '不筛选'}">` +
      (n ? '清空 (' + n + ')' : '全部') + `</button>` +
    S.tags.map(t => tagPillHTML(t, 'filter')).join('');
  filterPulse = null;   // 只在"被点中的那一次刷新"里生效，别让后面的无关刷新重播
  restoreStripScroll(box);
}

/* 两处标签条都是「整块重建 innerHTML」来刷新的：筛选栏那条更狠 ——
   refresh() 会把整个 #view 重画一遍，连它自己都是新元素。
   所以横滚位置不能靠重建前后读一次，得单独记一份，重建后还回去，
   否则滚到右边点一颗标签，整条立刻弹回开头，很难连着选几个。 */
const stripScrollX = { filters: 0, entryStrip: 0 };
document.addEventListener('scroll', e => {
  const el = e.target;
  if (el && el.id && el.id in stripScrollX) stripScrollX[el.id] = el.scrollLeft;
}, true);
function restoreStripScroll(el){
  if (el && el.id in stripScrollX) el.scrollLeft = stripScrollX[el.id];
}

/* 标签条的边缘渐隐开关（CSS 那边有三条 mask 规则）。
   判据是"这一侧是否真的还有内容被切住"：
   - scrollWidth <= clientWidth（压根没溢出）→ 两侧都不渐隐；
   - scrollLeft 已经在 0 → 左边没东西被切，别把第一颗 pill 淡化；
   - 已经滚到底（scrollLeft ≈ max）→ 右边同理。
   留 1px 容差：某些缩放下 scrollLeft 会是 1.0001 这种小数，卡死等号会让边缘反复闪。
   统一挂类而不是写 inline 样式，是为了让"要不要渐隐"只由这一处决定。 */
function syncStripFades(){
  document.querySelectorAll('.pillstrip').forEach(el => {
    const max = el.scrollWidth - el.clientWidth;
    const scrollable = max > 1;
    el.classList.toggle('fade-l', scrollable && el.scrollLeft > 1);
    el.classList.toggle('fade-r', scrollable && el.scrollLeft < max - 1);
  });
}
/* 捕获阶段监听：滚动事件不冒泡，但在捕获阶段能收到子元素的滚动 ——
   条子自己滚、页面滚（可能把整条滑出视口）、窗口变宽变窄，都要重算。 */
document.addEventListener('scroll', syncStripFades, true);
window.addEventListener('resize', syncStripFades);

/* 刚被点中的那颗筛选标签。筛选栏每次 refresh 都整块重建，没有元素可以复用，
   所以只能给"这一颗"补一段入场动画把状态切换接上（见 CSS .pill.pulse / @keyframes pillOn）。
   用完立刻清空 —— 否则下一次无关的 refresh（搜索、打勾…）会把旧的那颗又播一遍。 */
let filterPulse = null;

/* 标签 pill：一律带 × 可删（内置的那三个也能删，所有标签一视同仁）。
   mode='filter' 点标签＝加入/移出筛选（可多选）；mode='entry' 点标签＝给之后录入的条目加/去这个标签（可多选） */
function tagPillHTML(t, mode){
  const entryMode = mode === 'entry';
  const on = entryMode ? entryTagSet.has(t) : S.filterTags.indexOf(t) >= 0;
  const attr = entryMode ? `data-et="${esc(t)}"` : `data-f="${esc(t)}"`;
  /* 筛选栏那颗刚被点中的补一个入场：选中走 .pulse（无底色→实底），
     取消走 .pulse-off（实底→无底色）。它整块重画、没有元素可复用，
     只能靠动画把这次状态切换接上。 */
  const pulse = (!entryMode && t === filterPulse) ? (on ? ' pulse' : ' pulse-off') : '';
  return `<span class="pillwrap"><button class="pill${on ? ' on' : ''}${pulse}" ${attr}>${esc(t)}</button>` +
    `<button class="pill-x" data-act="deltag" data-t="${esc(t)}" title="删除「${esc(t)}」">×</button></span>`;
}

/* 录入区标签条的选中态：**就地改 class，绝不重建 innerHTML**。
   以前点一颗标签就把整条 innerHTML 重画一遍，节点全是新的 ——
   CSS 上那条 transition 压根没有可过渡的旧状态，于是"选中"永远是硬切一下
   （用户说的"过渡非常生硬"就是这个）。就地改还有个附带好处：
   整条标签栏的横向滚动位置不会因为重画而弹回开头。 */
function syncEntryTagUI(){
  const box = document.getElementById('entryTags');
  if (!box) return;
  box.querySelectorAll('[data-et]').forEach(b => {
    b.classList.toggle('on', entryTagSet.has(b.dataset.et));
  });
  const n = entryTagSet.size;
  const old = box.querySelector('.et-n');
  if (n && old) old.textContent = '已选 ' + n;
  else if (n && !old){
    const s = document.createElement('span');
    s.className = 'et-n mono';
    s.title = '当前已选，回车录入时会加到条目上';
    s.textContent = '已选 ' + n;
    box.insertBefore(s, box.querySelector('.pillstrip'));
  }
  else if (!n && old) old.remove();
}

/* 录入区标签栏：可以多选，选中的标签会一起加到之后录入的条目上（再点一次取消）。
   和筛选栏共用同一套标签库，但不共用选中状态。
   结构＝[标签] [已选 N] [可横向滚动的标签条] [＋ ⚙]：
   标签多的时候只有中间那条滚，「已选几」和加标签按钮一直看得见。 */
function renderEntryTags(){
  const box = document.getElementById('entryTags');
  if (!box) return;
  const n = entryTagSet.size;
  box.innerHTML = `<span class="et-l">标签</span>` +
    (n ? `<span class="et-n mono" title="当前已选，回车录入时会加到条目上">已选 ${n}</span>` : '') +
    `<div class="pillstrip" id="entryStrip" tabindex="0" role="group" aria-label="给之后录入的条目加标签">` + S.tags.map(t => tagPillHTML(t, 'entry')).join('') + `</div>` +
    tagActsHTML;
  restoreStripScroll(document.getElementById('entryStrip'));
}

let rafRefresh = 0;
function refresh(){
  if (rafRefresh) return;
  rafRefresh = requestAnimationFrame(() => {
    rafRefresh = 0;
    if (S.view === 'list') renderList();
    else if (S.view === 'entry'){ /* 录入界面由 hero + 录入条 + 标签/提示构成，#view 留空 */ view.innerHTML = ''; }
    else if (S.view === 'settings') renderSettings();
    else renderStat();   // 其余（含 'stat'）都走统计
    renderFilters();
    renderEntryTags();
    ANIM = false;   // 渲染完就关掉，之后的纯数据更新不再重播入场动画

    /* 顶栏撤掉后没有「条数」常驻位了，这里只需无错即可（没有 #counts 时不抛） */
    const counts = document.getElementById('counts');
    if (counts){
      const total = S.items.filter(i => !i.done).length;
      counts.textContent = total ? total + ' 条未完成' : '清空了';
    }

    /* 备份角标只在设置页（#backup 在那里）才有，其它视图里元素不存在，跳过即可 */
    const b = document.getElementById('backup');
    if (b){
      /* 「该备份了」只换形态、不换颜色（用户要求去掉红字，见 .backup.due 处的说明）：
         未备份 / 超 7 天 → 加中性描边胶囊；其余只是一行次级小字。 */
      if (!S.lastBackup){ b.textContent = '未备份'; b.className = 'backup due'; }
      else {
        const d = Math.floor((Date.now() - S.lastBackup) / 86400000);
        b.textContent = d <= 0 ? '今天已备份' : d + ' 天前备份';
        b.className = 'backup' + (d >= 7 ? ' due' : '');
      }
    }
    /* 底栏 3 个页签（.tab）：用 aria-current="page" 标当前页（读屏标准说法）。
       录入界面（entry）不是页签，三个页签都不标当前。 */
    document.querySelectorAll('.tab').forEach(x => {
      if (x.dataset.view === S.view) x.setAttribute('aria-current', 'page');
      else x.removeAttribute('aria-current');
    });
    document.body.dataset.view = S.view;   // CSS 据此隐藏统计页 / 录入界面不需要的区块
    /* ★ v3.36：换页时给 body 挂一次 .view-enter，让录入界面那三块静态 DOM 也播一次入场
       （清单/统计在 #view 里整块重画，本来就有；录入界面全是静态 DOM，原来什么都没有）。
       只在"视图真的换了"时挂 —— 否则每回车加一条都会重播一次入场。 */
    if (S.view !== renderedView){
      renderedView = S.view;
      document.body.classList.add('view-enter');
      clearTimeout(viewEnterT);
      viewEnterT = setTimeout(() => document.body.classList.remove('view-enter'), 900);
    }
    /* v2.5：顶部图标行整行撤掉后，页面名不再单独渲染 —— 当前页由底栏选中态
       （aria-current + 指示短线）表达，读屏也由 aria-label 承担。 */
    applyHelp();                           // 「页面说明文字」总开关（切页后 DOM 是新的，这里每帧同步一次最稳）
    observeReveals();
    /* 标签条是这一帧刚重建的，边缘渐隐要按新的 scrollWidth 重算
       （标签增删、筛选栏重置滚动位置都会改变"哪一侧还被切住"）。 */
    syncStripFades();
    /* 分段控件的滑块也要重新对齐：refresh 会重建整个 .seg，新 DOM 里没有旧位置。
       animate=false —— 页面渲染不该让滑块从上一个位置飘过来（那是"换挡"才该有的动作）。 */
    syncSegPills(false);
  });
}

/* 布局切换过渡（分区 ⇄ 时间轴、统计的横条 ⇄ 方块 共用）。两种手法见 swapContent 内的说明：
   ① 淡出淡入（本函数 + #view.swap-out/.swap-in）—— 切视图那类"换了一批东西"的场合；
   ② FLIP —— "同一批东西换了排法"，本轮改成走这条（用户点名要来）。
   refresh() 自己是用 rAF 延迟写 innerHTML 的，所以淡入那一步要等两帧，确保新 DOM 已经在树上。 */
function replaySwap(){
  view.classList.remove('swap-out', 'swap-in');
  void view.offsetWidth;                 // 强制回流，连点两次也能重播
  view.classList.add('swap-in');
  setTimeout(() => view.classList.remove('swap-in'), 460);
}
/* ---------- FLIP：把"同一批元素换了排法"做成位移，而不是淡出淡入 ----------
   用户原话：「固定的元素只是交换一下位置、形状、大小或者排版，但这个固定元素本身并没有改变，
   并不会直接消失在页面上」。这正是 FLIP 的适用面：
     First  切换前，把每个带身份键的元素量一遍（视口矩形）
     Last   换完 DOM 立刻再量一遍
     Invert 用 transform 把元素"倒推"回旧位置（此时肉眼看还是切换前的样子）
     Play   放开 transform → 元素自己滑/长到新位置
   身份键用 data-fk：清单里是 i:<id>（整条）、t:<id>（标题）、d:<id>（日期）、g:<id>:<标签>；
   统计页是 c:<序号>（卡片）、v:<卡片>:<列>（大数字）。跨视图对得上的才有动画，
   只在一侧存在的键自然被跳过 —— 不需要为"新增/消失"写特例，它本来就该是"出现/离开"。 */
function fkOfKeyed(el){ return el.dataset.fk || ''; }
function flipCapture(root){
  if (!root) return null;
  const out = [];
  root.querySelectorAll('[data-fk]').forEach(el => {
    const k = fkOfKeyed(el);
    if (!k) return;
    const r = el.getBoundingClientRect();
    if (!r.width && !r.height) return;      // 隐藏元素（折叠的子树）不参与
    out.push({ k, x: r.left, y: r.top, w: r.width, h: r.height });
  });
  return out;
}
function flipPlay(before, dur){
  if (reduceMotion() || !before || !before.length) return 0;
  const D = dur || 520;
  /* 收集新 DOM 里的元素。同键只认第一个（容器先于其后代，正是我们要的那个"框"）。 */
  const now = new Map();
  document.querySelectorAll('[data-fk]').forEach(el => {
    const k = fkOfKeyed(el);
    if (k && !now.has(k)) now.set(k, el);
  });
  /* ---------- 根因修复：content-visibility:auto 的祖先会把子树"跳过"，而**被跳过的子树里
     transition 根本不会起步** ----------
     反向（时间轴 → 分区）一直没有动画，病灶就在这里，而且只在反向上出现：
     · 分区模式下承接 FLIP 的是 `.item`，它们是 `.zone` 的**后代**，而 `.zone` 带
       `content-visibility:auto`（见上面 .zone 规则，屏幕外跳过布局+绘制的省力点）。
       renderList() 是**同步**重写 innerHTML 的，这批 .zone 是刚 insert 的：在浏览器跑完
       一次渲染更新、判定它"与用户相关"之前，内容处于 skipped 状态。被跳过的子树不跑
       transition —— 倒推值写下去、`void document.body.offsetWidth` 强制回流也读不到，
       于是播放那一写等于把 none 又写了一遍，computed transform 全程是 none。
     · 正向（分区 → 时间轴）之所以一直正常：承接搬运的是 `.hwcard` **自己**，而
       content-visibility 只管"它内部的内容"跳不跳，不影响元素自身的 transform 过渡。
     实测（_ref/_probe-revflip.mjs + _probe-revflip2.mjs，390×844）：
       · 反向基线：capture 21 个键、flipPlay 排进 4 个、`.flip-move` 挂满 94 帧，

/* ---------- 分段控件的滑块：对齐 + 换挡动画 ----------

   .seg，新 DOM 里没有旧位置可量，只能靠这张表找回"从哪来"。键用 aria-label，
   它对每个 .seg 都是稳定且唯一的（清单展示方式 / 统计布局 / 主题）。 */
const segPrev = new Map();
function ensureSegPill(seg){
  let p = seg.querySelector('.seg-pill');
  if (!p){
    p = document.createElement('i');
    p.className = 'seg-pill';
    p.setAttribute('aria-hidden', 'true');
    seg.insertBefore(p, seg.firstChild);

function syncSegPills(animate){
  document.querySelectorAll('.seg').forEach(seg => {
    const on = seg.querySelector('.segbtn.on') || seg.querySelector('.segbtn');

    const pill = ensureSegPill(seg);
    /* 绝对定位元素的包含块是 .seg 的**内边距盒**，而 getBoundingClientRect 的差值是
       从边框盒起算的 —— 所以要减掉 clientLeft/clientTop 这 1px 边框，否则滑块会整体偏 1px。 */
    const sr = seg.getBoundingClientRect(), br = on.getBoundingClientRect();

       那一头总是朝目标长出去，而不是往回缩。设 scaleX 的参照宽度是 V：
         0%   transform = (A, U/V)         → 渲染出的跨度还是 [A, A+U]（旧位，原样）
         44%  transform = (锚点, span/V)   → 跨度正好 [min(A,B), max(A+U,B+V)]（盖住并集）
         100% transform = (B, 1)           → 跨度 [B, B+V]（新位）

    const right = to.x >= from.x;

    pill.addEventListener('animationend', () => pill.classList.remove('anim'), { once: true });

}

/* 滚动揭示（原站 .reveal-on-scroll + IntersectionObserver） */
let revealIO = null;
function observeReveals(){
  const els = document.querySelectorAll('.reveal-on-scroll:not(.is-visible)');
  if (!els.length) return;
  if (!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('is-visible')); return; }
  if (!revealIO){
    revealIO = new IntersectionObserver(list => {
      list.forEach(en => {
        if (!en.isIntersecting) return;
        const el = en.target;
        el.classList.add('is-visible');
        revealIO.unobserve(el);
        // 入场动画跑完就撤掉 will-change，别让这些图层永久留在合成器里。
        // 注意监听的是 animationend：揭示改成了 animation（见 CSS 里那段说明），
        // 不再有 transitionend 可听。reduced-motion 下动画被全局那条 !important 关掉，
        // 这里就等不到事件 —— 那种情况下浏览器本来也不会为它们建合成层，无需收拾。
        el.addEventListener('animationend', function done(ev){
          if (ev.target !== el || ev.animationName !== 'rvIn') return;
          el.style.willChange = 'auto';
          el.removeEventListener('animationend', done);
        });
      });
    }, { rootMargin:'0px 0px -8% 0px', threshold:0.04 });
  }
  els.forEach(e => revealIO.observe(e));
  clearTimeout(observeReveals._t);
  observeReveals._t = setTimeout(() => {
    document.querySelectorAll('.reveal-on-scroll:not(.is-visible)').forEach(e => {
      if (e.getBoundingClientRect().top < window.innerHeight) e.classList.add('is-visible');
    });
  }, 1400);
}

/* ---------------- toast ---------------- */
let toastTimer = null;
function toast(msg, actionLabel, action, dur){
  const el = document.getElementById('toast');
  if (!el) return;                       // 与 hideToast 同一道空值保护（见下）
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (actionLabel){
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.onclick = () => { action(); hideToast(); };
    el.appendChild(b);
  }
  el.classList.add('on');
  /* v3.32：弹窗开着时把提示挪到顶部，别压住弹窗底部的按钮（用户被"已用语音录入"挡过"取消"）。
     找不到弹窗元素就照旧在底部 —— 最坏情况与改动前一致。 */
  try {
    const dlg = document.querySelector('.overlay.on,.sheet.on,.mask.on,[aria-modal="true"],dialog[open]');
    el.classList.toggle('at-top', !!dlg);
  } catch (_){}
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, dur || 5000);
}
/* 加空值保护：正常运行中 #toast 常驻，不会缺；但外部脚本/将来的重构若把它移走，
   那条已排队的 hideToast 定时器就会在这里抛 TypeError（本项目核验脚本踩过一次）。 */
function hideToast(){ const t = document.getElementById('toast'); if (t) t.classList.remove('on'); }

/* 备份提醒：数据只在 localStorage 里，超 7 天没备份（或从未备份）就提醒一次，
   并提供「复制备份到剪贴板」——不用导出文件也能快速留底 */
function copyBackup(){
  const json = JSON.stringify(snapshot(), null, 2);
  const done = () => { S.lastBackup = Date.now(); save(); toast('已复制，找个地方（备忘录/网盘）粘贴保存一下'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(done).catch(() => fallbackCopy(json, done));
  } else fallbackCopy(json, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { toast('复制失败，请用「备份」按钮导出文件'); }
  ta.remove();
}
/* 备份提醒：数据只在 localStorage 里，超 7 天没备份（或从未备份）就提醒一次，
   并提供「复制备份到剪贴板」——不用导出文件也能快速留底。

   ⚠️ 这个函数**必须在 load() 之后调用**（见文件末尾的启动块）。
   原来它写成「定义即执行」的 IIFE、位置又落在 load() 之前，守卫读到的 S.lastBackup
   永远是初始值 null，于是**每次打开页面都误报一次**；更别扭的是文案是在下面的 setTimeout
   里才拼的，那时 load() 早跑完了 —— 结果 header 显示"今天已备份"、toast 说"已经 0 天没备份"。 */
function backupNudge(){
  if (S.lastBackup && Date.now() - S.lastBackup < 7 * 86400000) return;
  const d = S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 86400000) : 0;
  setTimeout(() => toast(
    !S.lastBackup ? '数据只存在这台手机里，还没备份过，建议留个底'
                  : '已经 ' + d + ' 天没备份数据了，建议留个底',
    '复制备份', copyBackup, 12000), 1500);
}

/* ---------------- 交互 ---------------- */
/* 标签栏（录入区 + 筛选栏共用一套标签库 S.tags）：点选 / 新建 / 改名 / 删除。
   两处标签条完全平权 —— 内置的「学习/生活/娱乐」也只是默认值，一样能改名和删掉。
   —— 放在 document 级委托，两处标签条改动后都会同步刷新
   注意：筛选栏在 #view 内，而 view 自己的委托只认 tick/edit/fold/tag/f 那几类，
   不认 addtag/deltag/managetag；所以下面只对这几个 act 做委托，且不能按 #view 跳过。 */
let entryTagSet = new Set();      // 录入区多选出来的标签（会话级，不持久化）
const TAG_MAX = 24;

function addTag(name){
  const v = normTagList([name])[0];
  if (!v) return false;
  if (S.tags.indexOf(v) >= 0) return false;
  if (S.tags.length >= TAG_MAX) return false;
  S.tags.push(v); syncTags(); save(); refresh(); return true;
}

/* 删标签：从标签库拿掉，同时把条目上这个标签也摘掉（否则会出现「筛选栏里没有、
   条目上却挂着一个点不到的标签」）。整个操作可撤销。 */
function removeTag(t){
  const k = S.tags.indexOf(t);
  if (k < 0) return false;
  S.tags.splice(k, 1);
  S.filterTags = S.filterTags.filter(x => x !== t);
  entryTagSet.delete(t);
  const touched = [];
  S.items.forEach(i => {
    const j = (i.tags || []).indexOf(t);
    if (j >= 0){ i.tags.splice(j, 1); touched.push(i.id); }
  });
  syncTags(); save(); refresh();
  const undo = () => {
    if (S.tags.indexOf(t) < 0) S.tags.splice(Math.min(k, S.tags.length), 0, t);
    S.items.forEach(i => {
      if (touched.indexOf(i.id) >= 0 && (i.tags || []).indexOf(t) < 0) i.tags.push(t);
    });
    syncTags(); save(); refresh();
  };
  toast('删掉标签「' + t + '」' + (touched.length ? '，' + touched.length + ' 条也一并摘掉' : ''),
        '撤销', undo);
  return true;
}

/* 改标签名：标签库和所有条目一起改，筛选/录入区的选中状态也跟着走 */
function renameTag(from, to){
  const v = normTagList([to])[0];
  const k = S.tags.indexOf(from);
  if (k < 0 || !v) return false;
  if (v === from) return true;                     // 没改动，当成功
  if (S.tags.indexOf(v) >= 0) return false;        // 和别的标签重名
  S.tags[k] = v;
  S.filterTags = S.filterTags.map(x => x === from ? v : x);
  if (entryTagSet.has(from)){ entryTagSet.delete(from); entryTagSet.add(v); }
  S.items.forEach(i => {
    const j = (i.tags || []).indexOf(from);
    if (j >= 0) i.tags[j] = v;
  });
  syncTags(); save(); refresh(); return true;
}

/* 管理标签弹窗：一行一个，输入框直接改名，右边删除；底部加新标签。
   ★ v3.36（用户："当我点击标签右边的设置按钮时，不要直接跳转到输入状态（即不要直接弹出输入法）。
   如果需要添加，点击右边的加号就可以直接弹出来"）：
   原来弹窗一开就 addInp.focus() —— 管理标签的人多半只是想看看/删一个，结果先弹出一屏输入法。
   改成默认**不聚焦**（焦点停在弹窗容器上，读屏照样播报标题）；只有"刚添加成功、要接着加下一条"
   这一种情况才把光标递到新标签框。 */
function openTagManager(focusAdd){
  const row = t => `<div class="tagrow">
      <input type="text" value="${esc(t)}" maxlength="12" data-tagin="${esc(t)}" aria-label="标签名 ${esc(t)}">
      <button class="btn danger" data-tagdel="${esc(t)}" title="删除「${esc(t)}」">删除</button>
    </div>`;
  modal.innerHTML = `<h3 id="modalTitle">管理标签</h3>
    <p class="modal-note">改名字直接在框里改，回车或点到别处生效；删除会把这些条目上的这个标签也一并摘掉，可以撤销。</p>
    <div class="tagrows">${S.tags.length ? S.tags.map(row).join('')
      : '<p class="modal-note">现在一个标签都没有，下面加一个吧。</p>'}</div>
    <div class="tagrow addrow">
      <input type="text" id="tagNew" placeholder="新标签名" maxlength="12">
      <button class="btn primary" id="tagAdd">添加</button>
    </div>
    <div class="foot">
      <span class="modal-note">${S.tags.length} / ${TAG_MAX} 个标签</span>
      <div class="spacer"></div>
      <button class="btn" id="tmClose">关闭</button>
    </div>`;
  openMask();

  modal.querySelectorAll('[data-tagin]').forEach(inp => {
    let busy = false;
    const apply = () => {
      if (busy) return; busy = true;
      const from = inp.dataset.tagin, to = inp.value;
      if (normTagList([to])[0] === from){ busy = false; return; }   // 没改
      if (renameTag(from, to)){ openTagManager(); return; }         // 重开一遍，行里的 data 才是新的
      busy = false;
      inp.value = from;
      toast('改不了：名字不能空着，也不能和别的标签重名');
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); } });
    inp.addEventListener('blur', apply);
  });

  modal.querySelectorAll('[data-tagdel]').forEach(b => {
    b.onclick = () => { removeTag(b.dataset.tagdel); openTagManager(); };
  });

  const addInp = document.getElementById('tagNew');
  const doAdd = () => {
    const v = addInp.value;
    if (!v.trim()){ toast('标签名不能空着'); return; }
    if (!addTag(v)){ toast(S.tags.length >= TAG_MAX ? '标签太多了，先删几个' : '这个标签已经有了'); return; }
    openTagManager(true);                        // 刚加完 → 接着加下一条，这次才把光标给上
  };
  document.getElementById('tagAdd').onclick = doAdd;
  addInp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); doAdd(); } });
  document.getElementById('tmClose').onclick = closeModal;
  /* 只有显式要求"接着加"时才聚焦（管理标签不该顺手弹出输入法，见函数顶部说明）。
     弹窗打开时 openMask() 已把焦点放到弹窗容器上，读屏会播报"对话框 + 管理标签"。 */
  if (focusAdd) addInp.focus();
}

document.addEventListener('click', e => {
  const et = e.target.closest('[data-et]');
  if (et){
    const t = et.dataset.et;                     // 多选：点一下加入，再点移出
    if (entryTagSet.has(t)) entryTagSet.delete(t);
    else {
      /* 一条最多 TAG_PER_ITEM 个标签，超了就在这里拦住，
         不然用户选了 5 个、录入时被悄悄砍掉一个，会觉得"选了没用" */
      if (entryTagSet.size >= TAG_PER_ITEM){ toast('每条最多 ' + TAG_PER_ITEM + ' 个标签'); return; }
      entryTagSet.add(t);
    }
    /* 就地改 class，不重建 —— 这样 .pill 上那条 transition 才播得出来（见 syncEntryTagUI） */
    syncEntryTagUI(); return;
  }
  /* 新建 / 改名 / 删除标签：两处标签条（录入区 + 筛选栏）都走这里。
     筛选栏在 #view 里，而 view 的委托只认 tick/edit/fold 那几类，不认这几个 act，
     所以这里不能按 #view 跳过 —— 否则筛选栏的 ＋ / ⚙ / × 都是死的。 */
  const act = e.target.closest('[data-act="addtag"],[data-act="deltag"],[data-act="managetag"]');
  if (!act) return;
  if (act.dataset.act === 'managetag'){ openTagManager(); return; }
  if (act.dataset.act === 'addtag'){
    const wrap = document.createElement('span');
    wrap.className = 'pillwrap';
    wrap.innerHTML = `<input class="newtag-input" id="newTagInput" placeholder="标签名" maxlength="12">`;
    act.replaceWith(wrap);
    const inp = document.getElementById('newTagInput');
    inp.focus();
    inp.addEventListener('keydown', ev => {
      if (ev.key === 'Enter'){
        const v = inp.value;
        if (!v.trim()){ toast('标签名不能空着'); inp.focus(); return; }   // 空的不关盒子，方便接着打
        if (!addTag(v)) toast(S.tags.length >= TAG_MAX ? '标签太多了，先删几个' : '这个标签已经有了');
        refresh();
      }
      else if (ev.key === 'Escape') refresh();
    });
    inp.addEventListener('blur', () => refresh());
    return;
  }
  if (act.dataset.act === 'deltag'){ removeTag(act.dataset.t); return; }
});

/* 标签条横向滚动：鼠标滚轮落在标签条上时，把竖向滚转换成横向滚 ——
   标签一多，光靠拖那条细滚动条很难选。滚到头就放行，让页面照常上下滚。 */
document.addEventListener('wheel', e => {
  const box = e.target && e.target.closest ? e.target.closest('.pillstrip') : null;
  if (!box) return;
  const max = box.scrollWidth - box.clientWidth;
  if (max <= 2) return;                                    // 没得滚，别抢事件
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;     // 本来就是横向手势（触控板），交给浏览器
  const atStart = box.scrollLeft <= 0.5, atEnd = box.scrollLeft >= max - 0.5;
  if ((e.deltaY < 0 && atStart) || (e.deltaY > 0 && atEnd)) return;   // 到头了就交给页面
  e.preventDefault();
  /* deltaMode: 0=像素 1=行 2=页。Firefox 的滚轮一格是「行」，
     不换算是 3px 一步，等于没滚 */
  const d = e.deltaMode === 1 ? e.deltaY * 26
          : e.deltaMode === 2 ? e.deltaY * box.clientWidth
          : e.deltaY;
  box.scrollLeft += d;
}, { passive: false });

/* 录入提交只有一个入口：键盘 Enter（下方 keydown）和右侧「存」按钮都调它。
   原先是 keydown 里一段内联逻辑 —— 升级成按钮后必须抽出来共用，否则两条路径行为会漂移。 */
function commitEntry(){
  const el = document.getElementById('entry');
  const v = el.value.trim();
  if (!v) return;
  const it = addItem(v);
  el.value = '';
  /* 录入区手选的标签（可多选）优先加在最前面，再跟上正文里写的 #标签，去重后截断 */
  if (it && entryTagSet.size){
    it.tags = normTagList([...entryTagSet].concat(it.tags || [])).slice(0, TAG_PER_ITEM);
    save();
  }
  refresh();
  if (it){
    /* 兜底 `|| '待办'`（代码审查补）：目前 parseSmart 只会给出 short / long / consider
       （循环任务被归入 short），所以取不到 undefined。但 ZONES 里是有 'repeat' 的，
       一旦将来有代码把 zone 设成它，这行就会拼出「已加入「undefined」」这种用户可见的错。
       加个默认值，代价为零。 */
    const zl = { short:'短期', long:'长期', consider:'考虑' }[it.zone] || '待办';
    toast('已加入「' + zl + '」' + (it.date ? ' · ' + dateLabel(it) : '') +
          ((it.tags && it.tags.length) ? ' · ' + it.tags.join('/') : ''),
      '撤销', () => { S.items = S.items.filter(x => x.id !== it.id); save(); refresh(); });
    // 新增后把看板滚进视野，避免"存了但没看见"
    const sec = document.getElementById('view');
    if (sec && sec.getBoundingClientRect().top > window.innerHeight * 0.6)
      sec.scrollIntoView({ behavior:'smooth', block:'start' });
  }
}
document.getElementById('entry').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  commitEntry();
});
/* 「存」按钮。手机上点它必然先让输入框失焦、软键盘收起 —— 这是想要的行为
   （存完键盘不挡列表）。桌面（有悬停设备）则把焦点还给输入框，方便连续录入。 */
document.getElementById('entryGo').addEventListener('click', () => {
  commitEntry();
  if (matchMedia('(hover:hover)').matches) document.getElementById('entry').focus();
});

/* 搜索：过滤标题。渲染是整体重建 innerHTML，输入框会被重建，所以每次刷新后
   用 rAF 把焦点和光标补回去（rAF2 排在 refresh 的 rAF1 之后）。

   **为什么要 debounce**：原来每敲一个键就 refresh() 一次整块重建，
   条目一多（还带 .reveal-on-scroll / .goal-kids）输入会明显发涩；
   搜索框还得靠 refocusSearch 把焦点找回来，本身就说明重建代价不小。
   现在只把 refresh() 推到停手之后（S.q 仍然立刻更新 —— 这样期间任何
   别的原因触发的 refresh() 拿到的都是最新的过滤词，不会把输入框内容冲掉）。

   顺带把「光标位置」也接住了：重建后如果无脑 setSelectionRange(末尾)，
   用户点到中间改字、120ms 后光标会自己跳到末尾。 */
const SEARCH_DEBOUNCE_MS = 130;
let searchTimer = 0;
function refocusSearch(caret){
  requestAnimationFrame(() => {
    const el = document.getElementById('searchBox');
    if (!el) return;
    if (document.activeElement !== el) el.focus();
    const p = caret === undefined ? el.value.length : Math.min(caret, el.value.length);
    try { el.setSelectionRange(p, p); } catch (e){}
  });
}
view.addEventListener('input', e => {
  if (e.target.id !== 'searchBox') return;
  S.q = e.target.value;
  const caret = e.target.selectionStart;      // 重建前先把光标记下来
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchTimer = 0; refresh(); refocusSearch(caret); }, SEARCH_DEBOUNCE_MS);
});
view.addEventListener('keydown', e => {
  /* 清空要立刻生效（还带一个清空搜索的挂起定时器，否则它稍后会把刚清掉的词又填回去） */
  if (e.target.id === 'searchBox' && e.key === 'Escape'){
    clearTimeout(searchTimer); searchTimer = 0;
    S.q = ''; refresh(); refocusSearch(0);
    return;
  }
  /* 分区标题是 role="button"，Enter / 空格 要能折叠。
     空格必须 preventDefault —— 不挡的话浏览器会当成"向下翻页"，页面会跳一下。 */
  const zf = e.target.closest && e.target.closest('[data-zfold]');
  if (zf && (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar')){
    e.preventDefault();
    zf.click();
  }
});

view.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-tag],[data-f],[data-lay],[data-set],[data-zfold],[data-theme],[data-listmode]');
  if (!el) return;

  /* 分区折叠（长期 / 短期 / 循环 / 考虑）：复用 .zone 高度过渡（foldZoneWithMotion），
     就地切换、不走 refresh()。走 refresh() 的话整页重建会闪、滚动位置也会跳，
     跟设置页那个开关同一个道理。折叠态存进 S.foldedZones，刷新或重开仍保持收起。 */
  if (el.dataset.zfold !== undefined){ foldZoneWithMotion(el); return; }

  /* 主题三档（浅色 / 深色 / 跟随系统）：在设置页点 .segbtn[data-theme] 切换。
     不整页刷新（否则设置页会闪），直接就地同步同组三档的 on / aria-pressed。 */
  if (el.dataset.theme !== undefined){
    applyTheme(el.dataset.theme, true);
    const seg = el.closest('.seg');
    if (seg) seg.querySelectorAll('.segbtn').forEach(b => {
      const on = b.dataset.theme === S.theme;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    syncSegPills(true);              // 主题这一档也走同一套换挡动画
    return;
  }

  /* 清单页「分区 ⇄ 时间轴」分段控件：两档互斥（S.listMode），共用搜索与筛选。
     它嵌在清单工具栏里，refresh() 重建后会自带正确的 on 态，所以这里直接刷新即可。 */
  if (el.dataset.listmode !== undefined){
    const mode = el.dataset.listmode === 'timeline' ? 'timeline' : 'zone';
    if (mode === S.listMode) return;                    // 已经是这一档 → 不折腾
    /* 「同一批条目换了排法」，不是换内容 —— 所以走 FLIP（见 swapContent 的说明）：
       每条待办被"搬"到新位置、标题/日期/标签各自归位，全程不淡出。
       这里不能用 refresh()：它是 rAF 延迟的，DOM 下一帧才换，FLIP 量不到新布局。 */
    swapContent(() => {
      S.listMode = mode; save();
      ANIM = false;                 // 入场动画让位给 FLIP，别两套一起上
      renderList();
      renderFilters();
      syncSegPills(true);           // 分段控件的滑块同时换挡
    }, { flip: true, dur: 520, fade: true });
    return;
  }

  /* 按钮自身可能不带 data-id（id 在外层 .item / .hwcard 容器上），向上找一层 */
  const id = el.dataset.id || el.closest('[data-id]')?.dataset.id;
  const it = id ? S.items.find(x => x.id === id) : null;

  /* 统计页布局：横条 / 方块。只换视图内部，不走 refresh()，省得整页重排。
     同样走两段式过渡，跟「分区 ⇄ 时间轴」是同一套手感。 */
  if (el.dataset.lay !== undefined){
    const lay = el.dataset.lay === 'tile' ? 'tile' : 'card';
    if (lay !== S.statLayout){
      /* 同理走 FLIP：卡片从"宽条"被拉成"方块"、大数字各自归位，而不是整页重画。 */
      swapContent(() => {
        S.statLayout = lay; save();
        ANIM = false;
        renderStat();
        syncSegPills(true);
      }, { flip: true, dur: 520, fade: true });
    }
    return;
  }
  /* 设置页的外观开关。同样不走 refresh()：显示的显隐交给 body[data-help]，
     所以这里只要改状态 + 同步 aria-checked，页面一帧都不会跳。 */
  if (el.dataset.set !== undefined){
    if (el.dataset.set === 'help'){
      S.showHelp = !S.showHelp;
      save();
      applyHelp();
      el.setAttribute('aria-checked', S.showHelp ? 'true' : 'false');
    }
    /* 流畅模式：改之前那颗 ⚡ 的行为一样 —— 手动选择记进 localStorage，
       以后即使自动检测认为"你是真 GPU"也尊重用户的手动选择（见 currentLite）。
       状态不另存，直接以 html.soft-render 为准，避免两处状态打架。 */
    else if (el.dataset.set === 'lite'){
      const on = !document.documentElement.classList.contains('soft-render');
      try { localStorage.setItem(LITE_KEY, on ? 'on' : 'off'); } catch (e){}
      applyLite(on);
      el.setAttribute('aria-checked', on ? 'true' : 'false');
      toast(on ? '已开启流畅模式（更省性能）' : '已切回完整视觉');
    }
    /* 语音输入：只存开关；真正申请权限 / 起识别都在"长按圆钮"那一刻才发生（见 startVoiceIfAllowed）。
       打开时顺手测一下设备端离线识别是否可用，不可用就给一句明白提示，免得用户以为开了就能用。 */
    else if (el.dataset.set === 'voice'){
      S.voice = !S.voice; save();
      el.setAttribute('aria-checked', S.voice ? 'true' : 'false');
      if (S.voice && !voiceReady()) toast('当前设备不支持离线语音，长按仍走键盘输入');
      else toast(S.voice ? '已开启语音输入（长按圆钮说话）' : '已关闭语音输入');
    }
    /* v3.4 系统语音（备用路线）：只在设备端离线不可用时才会真的被走到。 */
    else if (el.dataset.set === 'voiceSystem'){
      S.voiceSystem = !S.voiceSystem; save();
      el.setAttribute('aria-checked', S.voiceSystem ? 'true' : 'false');
      toast(S.voiceSystem
        ? (voiceReady() ? '已开启系统语音（本机支持离线识别，仍优先走离线）'
                        : '已开启系统语音：长按圆钮将改用系统语音服务，可能联网')
        : '已关闭系统语音');
    }
    return;
  }
  /* 筛选栏：多选开关。点标签切换选中，点最前面的「全部/清空」一次清空 */
  if (el.dataset.f !== undefined && el.classList.contains('pill')){
    const t = el.dataset.f;
    if (!t) S.filterTags = [];
    else {
      const k = S.filterTags.indexOf(t);
      k >= 0 ? S.filterTags.splice(k, 1) : S.filterTags.push(t);
    }
    filterPulse = t || null;   // 让重画出来的那颗补一段入场（否则选中态是硬切）
    refresh(); return;
  }
  if (el.dataset.tag && it){
    const t = el.dataset.tag, i = it.tags.indexOf(t);
    if (i >= 0) it.tags.splice(i, 1); else it.tags.push(t);
    save(); refresh(); return;
  }
  const act = el.dataset.act;
  if (act === 'fold' && it){ foldWithMotion(el, it); return; }
  if (act === 'tick' && it){ tickWithFeedback(el, it); return; }
  if (act === 'del' && it){ remove(it, el); return; }
  if (act === 'edit' && it){ openEdit(it); return; }
  if (act === 'st' && it && it.hw){
    const s = el.dataset.s;
    it.hw.status = s;
    it.hw.submittedAt = s === 'submitted' ? ymd(new Date()) : null;
    if (s === 'submitted' && !it.done){ it.done = true; it.doneAt = Date.now(); }
    save(); refresh(); return;
  }
});

/* 打勾的确认 + 退场（v3.38 按用户指定的形态重做）：
   点击瞬间 → 绿勾弹一下 → 整条纵向压成一条线并亮一下（CRT 关机那道亮线）→ 往右退出；
   动画走完才落数据（所以数据只晚 ~520ms，撤销 toast 照旧）。
   连点用「按 id 记账」防 —— 全局锁会让第二下走到另一条分支，
   结果第二次 toggleDone 把刚完成的那条又翻回来（勾上又冒出来）。
   exitPending 是打勾与删除**共用**的一张表：同一条正在退场时，另一个按钮也不该响应。 */
const exitPending = new Set();
const EXIT_MS = 420;
function tickWithFeedback(el, it){
  if (exitPending.has(it.id)) return;
  const row = el.closest('.item, .hwcard');
  if (!row || reduceMotion()){ toggleDone(it); return; }
  exitPending.add(it.id);
  /* 退场动画期间把祖先的 content-visibility:auto 放开（.zone 带着它）：
     被跳过的子树里 CSS 动画不推进，行就会"绿一下然后停住"。 */
  const cv = releaseCVFor([row]);
  row.classList.add('row-out', 'row-out-ok', 'exiting');
  setTimeout(() => {
    exitPending.delete(it.id);
    dropCV(cv);
    toggleDone(it);
  }, EXIT_MS);
}
/* 数据改了之后的整页重渲染 —— 也走 FLIP（v3.38）。
   原来直接 refresh()：它是 rAF 延迟 + 整块重建 innerHTML，于是"被抽走那一条"下面的行
   是**一帧跳上来**的，跟前面那条 CRT 退场接不上（用户要的正是"跟着平滑上移"）。
   为什么不等 refresh()：它的 DOM 重建在下一帧，会把 FLIP 刚写上去的 transform 一起换掉，
   动画当场断掉。这里同步渲染 + 立刻 FLIP；计数、aria、reveal 这些在这一屏都不变，
   不需要再跑一遍 refresh()。 */
function refreshAfterChange(dur){
  if (reduceMotion()){ refresh(); return; }
  const before = flipCapture(view);
  renderList();
  renderFilters();
  syncStripFades();
  syncSegPills(false);
  /* 补位比常规切换快一点：它接在"被压掉"之后，太长会让"下面的顶上来"显得迟钝。 */
  flipPlay(before, dur || 420);
}

/* 复合目标的折叠 / 展开高度过渡。
   原来这条路上是「改 collapsed → refresh() 整页重建」：DOM 全换了，没有旧高度可量，
   所以只能硬切。这里改成就地做，顺序按「先渲染再塌陷」：
     展开 = 先把 display:none 摘掉让结构就位 → 量内容高度 → 从 0 长到量出来的值；
     收起 = 结构本来就在 → 量当前高度 → 从当前值压到 0，动画走完才真正 display:none。
   几个必须守住的点：
   ① 收尾一定要把 inline 的 height/overflow 清掉，否则那张卡片的高度被钉死 ——
      以后往里加子任务、标题换行、窗口变窄，它都不会再长高；
   ② 终值是「量出来的 px」而不是 auto：auto 不参与过渡。清掉 inline 之后自然回到 auto；
   ③ 连点（上一次没收完又点）：先把上一次的目标态立刻落定。不这么做，两个定时器
      会互相清 inline，最后停在一个错误的高度上；
   ④ 动画期间刷新了整页（比如顺手勾掉一条），这个 box 就成了孤儿 —— 收尾里先查 isConnected；
   ⑤ reduced-motion：不量不补间，直接切；
   ⑥ 量高度必须在摘掉 folded **之后**：display:none 的元素量出来是 0。
   还有一个坑是"提交"：起点和 transition 各强制一次布局。把 transition 和高度变化
   挤在同一帧里，浏览器会拿"还没有 transition 的旧样式"当起点，过渡根本不启动。 */
const FOLD_MS = 280;   // 跟 .goal-kids.folding 的 height 过渡时长（--mo-base .24s）留一点余量
function resetFold(box){
  box.style.height = ''; box.style.opacity = ''; box.style.overflow = '';
  box.style.marginTop = ''; box.style.marginBottom = '';
  box.classList.remove('folding');
}
/* 分区（长期 / 短期 / 循环 / 考虑）的折叠 / 展开高度过渡。
   跟复合目标那套 foldWithMotion 同思路，但作用对象是整张 .zone 卡：
     折叠 = 全高 → 只剩标题栏；展开 = 只剩标题栏 → 全高。
   必须守住的点跟 foldWithMotion 一致：
   ① 收尾清掉 inline 的 height/overflow/content-visibility，否则高度被钉死；
   ② 终值是量出来的 px 而非 auto（auto 不参与过渡）；
   ③ 连点（上一次没收完又点）：先把上一次目标态立刻落定；
   ④ 动画期间整页被刷新 → 收尾里查 isConnected，不去写孤儿节点；
   ⑤ reduced-motion：不量不补间，直接切；
   ⑥ .zone 默认带 content-visibility:auto，量高度前临时摘成 visible，否则可能跳帧/量不准，
      收尾再清掉 inline 让它回到 auto。
   折叠的"终态"仍交给 CSS `.zone.folded>:not(header){display:none}`（永久隐藏条目），
   所以这里动画只负责"高度从全高塌到标题栏"，塌完把 .folded 挂上即可。 */
function resetFoldZone(sec){
  sec.style.height = ''; sec.style.overflow = ''; sec.style.contentVisibility = '';
  sec.classList.remove('folding');
}
/* ★ v3.38-b：分区卡片的"按下"反馈自己记账（挂 .pressing），不只靠 CSS 的 :active。
   原因：触摸端 :active 的触发与持续在各家 WebView 上不一致（用户实测"快速点击时
   灰罩只盖住标题那一条"），自己挂类就完全可控。灰罩的形状由 CSS 的 `::before` 决定
   （永远铺满整张卡片），这里只负责开关。
   capture 阶段监听：条目里的按钮仍先处理自己的事，互不干扰。 */
document.addEventListener('pointerdown', e => {
  const h = e.target && e.target.closest ? e.target.closest('[data-zfold]') : null;
  document.querySelectorAll('.zone.pressing').forEach(z => z.classList.remove('pressing'));
  if (h){ const z = h.closest('.zone'); if (z) z.classList.add('pressing'); }
}, true);
['pointerup', 'pointercancel'].forEach(nm =>
  document.addEventListener(nm, () => {
    document.querySelectorAll('.zone.pressing').forEach(z => z.classList.remove('pressing'));
  }, true));

function foldZoneWithMotion(el){
  const k = el.dataset.zfold;
  const sec = el.closest('.zone');
  if (!sec) return;
  const wasFolded = S.foldedZones.includes(k);

  /* 数据态：先写盘（折叠 / 展开都要记住，重开仍保持） */
  const i = S.foldedZones.indexOf(k);
  if (wasFolded) S.foldedZones.splice(i, 1); else S.foldedZones.push(k);
  save();
  el.setAttribute('aria-expanded', wasFolded ? 'true' : 'false');

  /* ③ 上一次收尾先立刻补上 */
  if (sec._foldTimer){ clearTimeout(sec._foldTimer); sec._foldTimer = 0; sec.classList.toggle('folded', wasFolded); resetFoldZone(sec); }
  /* ⑤ */
  if (reduceMotion()){ sec.classList.toggle('folded', !wasFolded); resetFoldZone(sec); return; }

  const head = sec.querySelector(':scope > header');
  const cs = getComputedStyle(sec);
  /* border-box 下 height 含 padding，折叠终态 = 标题栏 + 卡片上下内边距（body 已 display:none），
     padV 必须把上下都算上，否则塌到的值比真实折叠高度矮一截，落定 .folded 时会跳一下。 */
  const padV = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  const collapsedH = (head ? head.offsetHeight : 0) + padV;   // 折叠态可见高度

  /* ⑥ 量高度前摘掉 content-visibility，免得它把内容"虚拟化"导致量不准 */
  sec.style.contentVisibility = 'visible';

  if (wasFolded){                         // 展开：先把高度钉在 collapsedH，再摘 .folded 让条目显形（被 overflow 兜住不闪）
    sec.style.overflow = 'hidden';
    sec.style.height = collapsedH + 'px';
    sec.classList.remove('folded');
  }
  const FULL = sec.scrollHeight;          // 此刻条目可见，量得真实全高

  sec.style.overflow = 'hidden';          // ---- 起点 ----
  sec.style.height = (wasFolded ? collapsedH : FULL) + 'px';
  void sec.offsetHeight;                   // 提交起点（此刻还没挂 transition）
  sec.classList.add('folding');
  void sec.offsetHeight;                   // 提交 transition 本身，别和高度变化挤同一帧
  sec.style.height = (wasFolded ? FULL : collapsedH) + 'px';   // ---- 终点 ----

  sec._foldTimer = setTimeout(() => {
    sec._foldTimer = 0;
    if (!sec.isConnected) return;         // ④ 整页已被换掉，别写孤儿节点
    sec.classList.toggle('folded', !wasFolded);   // 收起：动画走完才真正 display:none 条目
    resetFoldZone(sec);                   // ①② 清掉 inline，高度交还给内容
  }, FOLD_MS);
}
function foldWithMotion(chip, it){
  const body = chip.closest('.body');
  const box = body ? body.querySelector(':scope > .goal-kids') : null;
  if (!box){                                  // 没有可折叠的子树（正常到不了）：退回整页重渲染
    collapsed.has(it.id) ? collapsed.delete(it.id) : collapsed.add(it.id);
    refresh(); return;
  }
  const wasFolded = collapsed.has(it.id);

  if (box._foldTimer){                        // ③ 上一次的收尾先立刻补上
    clearTimeout(box._foldTimer); box._foldTimer = 0;
    box.classList.toggle('folded', wasFolded);
    resetFold(box);
  }

  if (wasFolded) collapsed.delete(it.id); else collapsed.add(it.id);
  chip.textContent = chip.textContent.replace(/^[▸▾]/, wasFolded ? '▾' : '▸');
  chip.setAttribute('aria-expanded', wasFolded ? 'true' : 'false');

  if (reduceMotion()){                        // ⑤
    resetFold(box);
    box.classList.toggle('folded', !wasFolded);
    return;
  }

  if (wasFolded){                             // ⑥ 展开：先把 height:0;overflow:hidden 写上再摘 folded，
    box.style.overflow = 'hidden';            //    摘掉那一帧被兜住，所以不会闪一下完整高度
    box.style.height = '0px';
    box.classList.remove('folded');
  }
  const FULL = box.scrollHeight;              // 内容真实高度（height:0 + overflow:hidden 也量得准）

  box.style.overflow = 'hidden';              // ---- 起点 ----
  box.style.height = (wasFolded ? 0 : FULL) + 'px';
  box.style.opacity = wasFolded ? '0' : '1';
  box.style.marginTop = wasFolded ? '0px' : '6px';
  box.style.marginBottom = wasFolded ? '0px' : '2px';
  void box.offsetHeight;                      // 提交起点（此刻还没挂 transition）
  box.classList.add('folding');
  void box.offsetHeight;                      // 提交 transition 本身，别和高度变化挤同一帧
  box.style.height = (wasFolded ? FULL : 0) + 'px';   // ---- 终点 ----
  box.style.opacity = wasFolded ? '1' : '0';
  box.style.marginTop = wasFolded ? '6px' : '0px';
  box.style.marginBottom = wasFolded ? '2px' : '0px';

  box._foldTimer = setTimeout(() => {
    box._foldTimer = 0;
    if (!box.isConnected) return;             // ④ 整页已被换掉，别去写孤儿节点
    box.classList.toggle('folded', !wasFolded);   // 收起：动画走完才真正 display:none
    resetFold(box);                           // ①② 清掉 inline，高度交还给内容
  }, FOLD_MS);
}

function toggleDone(it){
  it.done = !it.done;
  it.doneAt = it.done ? Date.now() : null;
  if (it.done && it.hw && it.hw.status !== 'submitted'){ it.hw.status = 'submitted'; it.hw.submittedAt = ymd(new Date()); }
  // 循环任务：打勾即完成一轮，按间隔生成下一次（作业不走循环）
  let nextId = null, nextLabel = '';
  if (it.done && it.repeat && !it.hw){
    const base = today0(); base.setDate(base.getDate() + it.repeat);
    const nx = {
      id: uid(), raw: it.raw, title: it.title,
      date: ymd(base), dateEnd: null, monthOnly: false, time: it.time || null,
      zone: it.zone, tags: [...(it.tags || [])], done: false, doneAt: null,
      createdAt: Date.now(), hw: null, repeat: it.repeat, pri: it.pri || 0
    };
    S.items.unshift(nx); nextId = nx.id;
    nextLabel = '，' + (+nx.date.slice(5, 7)) + '月' + (+nx.date.slice(8)) + '日再来一轮';
  }
  save(); refreshAfterChange(320);
  if (it.done) toast('完成 · ' + it.title + nextLabel, '撤销', () => {
    it.done = false; it.doneAt = null;
    if (nextId) S.items = S.items.filter(x => x.id !== nextId);
    save(); refreshAfterChange(320);
  });
}
/* 删除（3.5.2 按用户重新定义）：先把"标题与 ✕ 变红 → 整条像纸一样被压掉"演完，再动数据，
   紧接着下面的条目 FLIP 补位。el 是那颗 ✕（从点击处传进来），用来找它所在的那一行。 */
function remove(it, el){
  const idx = S.items.indexOf(it);
  /* 不在库里就当没点过。少了这句守卫，splice(-1, 1) 会**删掉最后一条**（删错对象），
     撤销时又把 it 插到倒数第二位。当前调用点的 it 都取自 S.items.find 所以走不到，
     但这是个"一旦重构就变成数据丢失"的写法。 */
  if (idx < 0) return;
  if (exitPending.has(it.id)) return;
  const row = el && el.closest ? el.closest('.item, .hwcard') : null;
  const commit = () => {
    S.items.splice(idx, 1); save(); refreshAfterChange(320);
    toast('已删除「' + it.title + '」', '撤销', () => { S.items.splice(idx, 0, it); save(); refreshAfterChange(320); });
  };
  if (!row || reduceMotion()){ commit(); return; }
  exitPending.add(it.id);
  const cv = releaseCVFor([row]);              // 同上：动画期间别让 content-visibility 把动画掐停
  row.classList.add('row-out', 'row-out-del', 'exiting');
  setTimeout(() => { exitPending.delete(it.id); dropCV(cv); commit(); }, EXIT_MS);
}

/* ---------------- 弹层 ---------------- */
const mask = document.getElementById('mask'), modal = document.getElementById('modal');
/* 弹层开合。原来只有入场（fadein + rise），关闭是 remove('on') 瞬间消失。
   现在先播 ~170ms 退场再真正隐藏。有两个边角必须处理：
   ① 退场没走完又点了打开：openMask() 要先取消未完成的退场，否则那个定时器
      会把刚填好的新弹窗内容清空（症状是"弹窗闪一下就空了"）；
   ② prefers-reduced-motion：用户已声明不要动效，别让他白等这 170ms，直接关。 */
const MASK_OUT_MS = 170;
let maskOutTimer = 0;
function reduceMotion(){
  try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e){ return false; }
}
/* 锁 / 解锁底下页面的滚动。和 .mask.on 同进同出 —— 三个弹层（编辑、导入、标签管理）
   都是 openMask() 打开、closeModalNow() 收尾，所以挂在两头上就全覆盖了，不必逐个调用点去加。 */
function lockPage(){ document.documentElement.classList.add('locked'); }
function unlockPage(){ document.documentElement.classList.remove('locked'); }

/* 弹层打开时把背景整块设成 inert，一次解决三件事：
   ① 读屏不再读到遮罩背后的正文（语义上真的"模态"了）；
   ② Tab 够不到背后的控件；
   ③ 焦点跑到遮罩后面按 Enter 触发底层按钮的路径被彻底切断 ——
      那条路径的症状（背景被 scrollTo 顶走）和"滚动穿透"一模一样，光测滚轮永远发现不了。
   弹层和 toast 都在 .page-shell 之外，所以不会被自己设的 inert 误伤。 */
const MASK_BG = ['.site-header', '.page-shell', '.pdaim-footer'];
function setBackgroundInert(on){
  for (const sel of MASK_BG){
    const el = document.querySelector(sel);
    if (el) el.inert = on;
  }
}
/* 关闭后焦点要还回触发它的那个按钮，否则键盘用户得从头 Tab 一遍 */
let maskPrevFocus = null;
/* 用 getClientRects() 判可见：display:none 的元素（编辑弹层里那块折叠的「作业信息」）
   返回 0 长度。`offsetParent` 在 fixed 祖先下不可靠，不能用。 */
function modalFocusables(){
  return [...modal.querySelectorAll(
    'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
  )].filter(el => el.getClientRects().length);
}
function openMask(){
  clearTimeout(maskOutTimer); maskOutTimer = 0;
  mask.classList.remove('closing');
  mask.classList.add('on');
  lockPage();
  /* 顺序要紧：**先记焦点、再 inert** —— 给一棵"焦点正在里面"的子树设 inert，
     浏览器会把焦点踢到 body，那时再记就只剩 body 了。
     再进一层守卫：只有当前记着的那个还在文档里才保留（openTagManager 改名会重开一次，
     那时焦点落在弹层里的输入框上，要留住最初触发弹层的那个按钮）。 */
  if (!maskPrevFocus || !maskPrevFocus.isConnected){
    const a = document.activeElement;
    maskPrevFocus = (a && a !== document.body && a !== document.documentElement) ? a : null;
  }
  setBackgroundInert(true);
  /* 焦点移到弹层容器（tabindex=-1）而不是第一个输入框：读屏会播报"对话框 + 标题"，
     而且不会顺带把弹层内部滚一下。preventScroll 保证背景滚动位置纹丝不动。 */
  if (!modal.contains(document.activeElement)) modal.focus({ preventScroll: true });
}
function closeModalNow(){
  clearTimeout(maskOutTimer); maskOutTimer = 0;
  mask.classList.remove('on', 'closing');
  modal.innerHTML = '';
  /* 等退场动画（~170ms）走完才解锁：这段时间页面还锁着，不然背景会先跟着滑一下。 */
  unlockPage();
  setBackgroundInert(false);
  const back = maskPrevFocus; maskPrevFocus = null;
  if (back && back.isConnected && typeof back.focus === 'function') back.focus({ preventScroll: true });
}
/* 焦点陷阱：背景已经 inert，正常 Tab 出不去，但会跳到浏览器地址栏再绕回来 ——
   键盘用户等于"当前位置丢了"。这里在两个端点之间显式回绕。 */
mask.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || !mask.classList.contains('on')) return;
  const f = modalFocusables();
  if (f.length < 2) return;
  const first = f[0], last = f[f.length - 1], cur = document.activeElement;
  if (e.shiftKey && (cur === first || cur === modal)){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && cur === last){ e.preventDefault(); first.focus(); }
});
function closeModal(){
  clearTimeout(maskOutTimer); maskOutTimer = 0;
  if (!mask.classList.contains('on')) return closeModalNow();   // 没开着：别白挂一个 closing
  if (reduceMotion()) return closeModalNow();
  mask.classList.add('closing');
  maskOutTimer = setTimeout(closeModalNow, MASK_OUT_MS);
}
mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
/* 没开着就别走一遍关闭流程 —— 否则 closeModalNow() 会去清空 #modal、还会解开滚动锁，
   让"弹层是否打开"和"页面是否上锁"有机会不同步。 */
document.addEventListener('keydown', e => { if (e.key === 'Escape' && mask.classList.contains('on')) closeModal(); });

/* ---------------- 自定义下拉 / 日历 / 确认框 ----------------
   为什么要这三件套：手机上点原生 <select> 弹的是安卓系统的底部单选列表，
   点 <input type=date> 弹的是系统日历，confirm() 是浏览器对话框 —— 字体、圆角、
   配色全是系统 Material 的，跟本站完全两个世界（用户截图：普通/重要/紧急那份）。
   而且原生 <select> 的 option 几乎没法定制样式，这是唯一能把"点开后的列表"
   也变成自己 UI 的路。值都不进表单：select 存在 .sel 的 dataset.value，
   日历存在同一结构里，读取统一走 selValue(id)。 */

let selOpenEl = null;                       // 当前展开的下拉（同一时间只开一个）
function closeSel(){
  if (!selOpenEl) return;
  selOpenEl.classList.remove('open');
  const b = selOpenEl.querySelector('.sel-btn');
  if (b) b.setAttribute('aria-expanded', 'false');
  selOpenEl = null;
}
document.addEventListener('click', e => {
  if (selOpenEl && !selOpenEl.contains(e.target)) closeSel();
});
/* Escape 先关下拉、再关弹窗 —— capture 阶段拦下并 stopImmediatePropagation，
   否则下面那条"Escape 关弹窗"的监听会同时把整个编辑弹窗关掉。 */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && selOpenEl){ closeSel(); e.stopImmediatePropagation(); }
}, true);

/* 把一个空 <div class="sel" id="..."> 变成完整的下拉控件。
   options: [[值, 显示文字], ...]；value: 初始值。
   值不写进任何 input/select —— 保存时用 selValue(id) 读 dataset.value。
   （不藏一个真 <select> 的原因：焦点陷阱、序列化、样式覆盖三条路都会多出隐形分支，
   还不如让"没有表单控件"这件事明明白白。） */
/* 展开 / 收起一个下拉或日历（makeSel / makeCal 共用）。
   贴近弹窗底部时向上弹（.up）：.modal 是 overflow:auto 的滚动容器，
   浮层是 absolute 定位 —— 底部的字段往下弹会被容器裁掉半截（真机截图踩过）。 */
function toggleSel(el){
  const btn = el.querySelector('.sel-btn');
  const was = el.classList.contains('open');
  closeSel();
  if (was) return;
  el.classList.add('open');
  /* 先展开再量：display:none 时 scrollHeight 是 0、量不出真实高度。
     同一个任务里连续改样式不会产生中间帧 —— 不存在"先往下弹再跳上去"的闪烁。 */
  const pop = el.querySelector('.sel-pop');
  const modal = document.getElementById('modal');
  if (modal && pop){
    const b = btn.getBoundingClientRect(), m = modal.getBoundingClientRect(), p = pop.getBoundingClientRect();
    const room = m.bottom - b.bottom - 10;                    // 字段以下还剩多少可视空间
    const need = p.height + 6;
    if (room < need && b.top - m.top > need) el.classList.add('up');
  }
  btn.setAttribute('aria-expanded', 'true');
  selOpenEl = el;
}

function makeSel(el, options, value){
  el.classList.add('sel');
  el.dataset.value = value;
  const label = k => { const o = options.find(x => x[0] === k); return o ? o[1] : ''; };
  el.innerHTML =
    '<button type="button" class="sel-btn" aria-haspopup="listbox" aria-expanded="false">' +
      '<span class="sel-t"></span>' +
      '<svg class="sel-chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9.2l6 6 6-6"/></svg>' +
    '</button>' +
    '<div class="sel-pop" role="listbox">' +
      options.map(([k, t]) =>
        '<button type="button" class="sel-opt" role="option" data-v="' + esc(k) + '">' +
          '<span class="sel-k">' + esc(t) + '</span><span class="sel-ck" aria-hidden="true">✓</span>' +
        '</button>').join('') +
    '</div>';
  const btn = el.querySelector('.sel-btn');
  const pop = el.querySelector('.sel-pop');
  const paint = () => {
    el.querySelector('.sel-t').textContent = label(el.dataset.value);
    pop.querySelectorAll('.sel-opt').forEach(o => {
      const on = o.dataset.v === el.dataset.value;
      o.classList.toggle('on', on);
      o.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  };
  paint();
  btn.onclick = e => {
    e.stopPropagation();                    // 别让这次点击立刻被"点外面就关"接住
    toggleSel(el);
  };
  pop.querySelectorAll('.sel-opt').forEach(o => {
    o.onclick = () => { el.dataset.value = o.dataset.v; paint(); closeSel(); };
  });
}
function selValue(id){ return document.getElementById(id).dataset.value; }

/* 日历：结构与下拉共用同一套 .sel/.sel-btn/.sel-pop（弹层语言一致），只是浮层里
   换成一格一月的网格。周一开头 —— 中文语境的日历习惯。 */
function makeCal(el, value){
  el.classList.add('sel', 'cal');
  el.dataset.value = value || ymd(new Date());
  let cur = new Date(el.dataset.value + 'T00:00:00');
  if (isNaN(cur)) cur = new Date();
  const WD = ['一','二','三','四','五','六','日'];
  const CN = d => d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  function render(){
    const wasOpen = el.classList.contains('open');
    const y = cur.getFullYear(), m = cur.getMonth();
    const shift = (new Date(y, m, 1).getDay() + 6) % 7;        // 周一=0
    const days = new Date(y, m + 1, 0).getDate();
    let cells = '';
    for (let i = 0; i < shift; i++) cells += '<span class="cal-pad"></span>';
    for (let d = 1; d <= days; d++){
      const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      cells += '<button type="button" class="cal-d' + (ds === el.dataset.value ? ' on' : '') +
               '" data-v="' + ds + '" aria-label="' + CN(new Date(y, m, d)) + '">' + d + '</button>';
    }
    el.innerHTML =
      '<button type="button" class="sel-btn" aria-haspopup="dialog" aria-expanded="false">' +
        '<span class="sel-t">' + esc(CN(new Date(el.dataset.value + 'T00:00:00'))) + '</span>' +
        '<svg class="sel-chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/></svg>' +
      '</button>' +
      '<div class="sel-pop" role="dialog" aria-label="选择日期">' +
        '<div class="cal-head">' +
          '<button type="button" class="cal-nav" data-nav="-1" aria-label="上个月">‹</button>' +
          '<span class="cal-title">' + y + '年' + (m + 1) + '月</span>' +
          '<button type="button" class="cal-nav" data-nav="1" aria-label="下个月">›</button>' +
        '</div>' +
        '<div class="cal-grid">' +
          WD.map(w => '<span class="cal-wd">' + w + '</span>').join('') + cells +
        '</div>' +
      '</div>';
    const btn = el.querySelector('.sel-btn');
    btn.onclick = e => { e.stopPropagation(); toggleSel(el); };
    el.querySelectorAll('.cal-nav').forEach(n => {
      n.onclick = e => { e.stopPropagation(); cur = new Date(y, m + (+n.dataset.nav), 1); render(); };
    });
    el.querySelectorAll('.cal-d').forEach(d => {
      d.onclick = () => { el.dataset.value = d.dataset.v; render(); closeSel(); };
    });
    /* 翻月会整体重建 innerHTML —— 把"正展开"这个状态接回来，否则点一次 ›/‹ 浮层就合上 */
    if (wasOpen){
      el.classList.add('open');
      el.querySelector('.sel-btn').setAttribute('aria-expanded', 'true');
      selOpenEl = el;
    }
  }
  render();
}

/* 应用内确认框（替代 confirm()）。文案里的换行用 white-space:pre-line 保留。 */

/* 编辑弹层：既有条目编辑（isNew=false）与"语音 / 快捷录入"新建（isNew=true）共用同一套。
   复用现有的 .mask/.modal/.sel/makeSel，焦点陷阱 / 滚动锁 / Escape 关闭都靠 openMask 那套，不新造。 */

  modal.innerHTML = `

    <div class="row">

        <div class="field"><label>状态</label><div class="sel" id="m_status"></div></div>
      </div>

  makeSel(document.getElementById('m_zone'), zoneOpts, it.zone || 'short');
  makeSel(document.getElementById('m_pri'),
    [['0', '普通'], ['1', '重要（!）'], ['2', '紧急（!!）']], String(it.pri || 0));
  makeSel(document.getElementById('m_status'), stOpts, (it.hw && it.hw.status) || 'todo');

  modal.querySelectorAll('#m_tags .pill').forEach(b => b.onclick = () => b.classList.toggle('on'));
  document.getElementById('m_hw').onchange = e => {
    document.getElementById('m_hwbox').style.display = e.target.checked ? 'block' : 'none';

  document.getElementById('m_cancel').onclick = closeModal;

  document.getElementById('m_save').onclick = () => {
    const raw = document.getElementById('m_raw').value;

    it.tags = [...modal.querySelectorAll('#m_tags .pill.on')].map(b => b.dataset.t);
    if (raw.trim() && titleVal === p.title){

      if (it.hw.status === 'submitted' && !it.hw.submittedAt) it.hw.submittedAt = ymd(new Date());
    } else it.hw = null;
    if (isNew) S.items.push(it);   // 新建：先入库存，再统一 save/refresh（编辑则本来就在库里）

function openEdit(it){ openItemEditor(it, false); }
/* 语言 / 快捷录入"进入编辑"分支：拿识别结果（或空串）先解析成草稿，再让用户改标签 / 日期 / 优先级 / 分区，确定才入库。 */
function openEditNew(rawText){

/* ---------------- 导入 / 导出 ---------------- */
const SEC = { '长期':'long', '短期':'short', '考虑':'consider', '已完成':'short', '完成':'short' };
function importText(txt, base){
  const lines = txt.split(/\r?\n/);
  let zone = 'long', n = 0, sawSection = false;
  /* BASEDAY 是模块级状态，today0() 到处都在读它。中途任何一处抛错都必须复位 ——
     否则之后所有「今天 / 周四 / 17号」都会按那个旧基准日解析，静默错位、极难排查。 */
  BASEDAY = base || null;
  try {
    for (const raw of lines){
      const line = raw.trim();
      if (!line) continue;
      const sec = line.match(/^[\-—–]{2,}\s*(.+?)\s*[\-—–]{2,}$/);
      if (sec){ zone = SEC[sec[1].trim()] || zone; sawSection = true; continue; }
      if (!/^[☐☑☒□√✓✗×]/.test(line)) continue;
      const done = /^[☑☒√✓✗×]/.test(line);
      const p = parseSmart(line);
      if (!p.title) continue;
      const it = {
        id: uid(), raw: line, title: p.title,
        date: p.date, dateEnd: p.dateEnd, monthOnly: p.monthOnly, time: p.time,
        zone: sawSection ? zone : p.zone,
        tags: p.tags, done, doneAt: done ? Date.now() : null,
        createdAt: Date.now() + n, hw: null, repeat: p.repeat || null, pri: p.pri || 0
      };
      if (/作业/.test(p.title)){
        it.hw = { course: guessCourse(p.title), detail:'', channel: guessChannel(line), naming: guessNaming(line),
                  status: done ? 'submitted' : 'todo', submittedAt: done ? ymd(new Date()) : null };
        splitHw(it, p);
      }
      S.items.push(it); n++;
    }
  } finally {
    BASEDAY = null;
  }
  save(); refresh();
  return n;
}

  modal.innerHTML = `

      <textarea id="i_txt" style="min-height:240px" placeholder="----长期----&#10;☐ 读一本专业书101～1015&#10;☐ 写结课论文105～1020&#10;----短期----&#10;☐ 1016 交数学作业"></textarea></div>

window.addEventListener('dragover', e => e.preventDefault());
/* 拖一个 json 进来 = 恢复备份；拖一整块笔记文本进来 = 走文本导入。
   恢复这条必须过两道闸：
   ① **形状校验**。原来只判 `if (o.items)`：一个 items 是字符串/对象/数字的 json 会直接塞进
      S.items，下一次渲染就 `S.items.map is not a function` 整个应用瘫痪 ——
      而且坏数据当场就写进了 localStorage，刷新也救不回来，只能手动清。
   ② **二次确认**。这是唯一一个会覆盖全部数据的操作，不能点一下就没。
   另外老备份（只带 items 的那种）没有 tags 字段，缺什么就保持现状，**不能顺手把标签库清空**。 */
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let o = null;
    try { o = JSON.parse(r.result); } catch (err){ o = null; }
    if (o && Array.isArray(o.items)){
      /* 原生 confirm 对话框换成应用内确认框 —— 系统弹窗跟全站不是一个语言。
         恢复逻辑整个挪进回调：uiConfirm 关掉弹窗后才真正动数据。 */
      uiConfirm('恢复备份',
        '用备份里的 ' + o.items.length + ' 条，覆盖现在的 ' + S.items.length + ' 条？\n\n此操作不可撤销（当前数据不会自动留底）。',
        '确认覆盖',
        () => {
          S.items = o.items;
          if (Array.isArray(o.tags)){ S.tags = normTagList(o.tags); syncTags(); }
          if (o.statLayout === 'tile' || o.statLayout === 'card') S.statLayout = o.statLayout;
          if (typeof o.hintOpen === 'boolean') S.hintOpen = o.hintOpen;
          if (typeof o.showHelp === 'boolean') S.showHelp = o.showHelp;
          /* 折叠状态也恢复。跟 tags 一样要判形状 + 过白名单 ——
             备份是外部数据，别让里面的任意字符串直接变成 class 名 */
          if (Array.isArray(o.foldedZones)) S.foldedZones = o.foldedZones.filter(k => ZONES.includes(k));
          if (o.lastBackup) S.lastBackup = o.lastBackup;
          save(); applyHelp(); refresh();
          toast('已从备份恢复 ' + S.items.length + ' 条');
        });
      return;
    }
    /* 不是备份 json（多半是直接拖进来的一整块笔记文本） */
    const n = importText(String(r.result));
    toast(n ? '导入了 ' + n + ' 条' : '这个文件里没认出可导入的条目（备份请拖 json）');
  };
  r.readAsText(f);
});

/* ---------------- 导航 / 主题 / 吸顶 ---------------- */
/* 底部导航（v3）：3 个 .tab 页签等分 + 中轴上方悬浮录入键（录入键有自己的长按骨架，
   不在这儿处理）。切页不靠整页重建的副作用，而是显式改 S.view 后 refresh()；
   refresh 每帧同步 aria-current（见 refresh 内 .tab 段）。录入界面不是页签，
   三个页签都不标当前（同样在 refresh 内处理）。 */
const tabbar = document.getElementById('tabbar');
tabbar.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;   // 录入键也在 tabbar 里但不是 .tab，交给它的长按骨架
  const v = b.dataset.view;
  /* ★ 真 bug（用户实测："点外观按钮会跳转到统计页"）：外观键为了复用底栏样式也挂着 .tab，
     但它**不是一页**、没有 data-view → 原来会把 S.view 写成 undefined 再 refresh()，
     于是界面跳走（同时 cycleTheme 照样生效，所以"外观变了 + 页面也跳了"）。
     凡是带 .tab 但不是页面切换的按钮，一律在这里退出。 */
  if (!v) return;
  if (v === S.view) return;
  S.view = v;
  ANIM = true;   // 切视图时允许播一次入场
  refresh();
  if (v === 'list'){
    const sec = document.getElementById('view');
    if (sec) window.scrollTo({ top: sec.offsetTop - 132, behavior: 'smooth' });
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });   // 统计 / 设置页头都没有 hero，直接回顶
  }
});

/* 底栏轮廓：按实测栏宽算出「被圆钮撑起并包住」的 SVG 路径，写进 #barClipPath
   （玻璃层与水波层共用同一段 d，所以两者永远严丝合缝）。
   形状参数（栏高48/圆径56/包边6/最大包边20/过渡凹角16/两端圆角24）都是 .tabbar 上的
   CSS 变量；这里只做几何推导，垂直尺寸固定 px，只有水平布局随栏宽自适应。 */
/* shapeState 的三个自由度：
   btnD  圆钮直径 —— 本轮起恒定 56（用户明确要求长按不放大圆钮）；
   btnCx bulge 圆心相对栏体中轴的水平偏移 —— 跟手拖拽时逐帧改写，让"包裹按钮的那一圈
         跟着手指滑走，它经过的地方被撑大、走后复原"；
   wrap  包边宽 —— null 表示跟随 CSS 变量 --wrap（常态 6px）；长按起手时被 swellRing
         临时推大到 --wrap-max（20px），也就是"栏体自己鼓起一圈水环再收回"。 */
const shapeState = { btnD: 56, btnCx: 0, wrap: null, _raf: 0, _rafRing: 0 };
function buildBarShape(opts){
  const cap = document.getElementById('capsule');
  if(!cap) return;
  const cs = getComputedStyle(cap);
  const num = (n, fb) => { const v = parseFloat(cs.getPropertyValue(n)); return isNaN(v) ? fb : v; };
  const barH    = num('--bar-h', 48);      // 栏高（水平直边那一段的高度）
  const btnD    = shapeState.btnD || num('--btn-d', 56);
  const wrapRest= num('--wrap', 6);        // 常态包边宽
  const wrapMax = num('--wrap-max', 20);   // 水环膨胀到的最大包边宽
  const wrap    = (shapeState.wrap == null) ? wrapRest : shapeState.wrap;
  const r       = num('--tr-r', 16);       // 过渡凹角半径
  const endR    = num('--end-r', 24);      // 两端圆角半径
  const over    = num('--over', 18);       // 玻璃层的 overscan
  const R = btnD / 2 + wrap;               // 包边圆半径 = 圆钮半径 + 包边宽
  const W = Math.max(1, Math.round(cap.getBoundingClientRect().width));
  /* ── 三条不变量（改这里之前必须先读）────────────────────────────────────────
     ① cyTop（栏体中心距 capsule 顶的距离）是**常量** = 圆钮半径 + 最大包边。
        「常量」这三个字就是用户那句"你不要让它直接往上移，让它保持在原位"的实现：
        圆钮、页签、栏肉的水平直边全都挂在 cyTop 上，水环怎么鼓都不会带动它们。
     ② capsule 的高度也只跟常态有关：cyTop + 常态包边圆半径。于是**常态下轮廓的最低点
        正好落在 capsule 的底边**（和改造前完全一致，栏体贴着底边、底下不留空）。
        水环鼓到最大时轮廓会往下探 (wrapMax − wrapRest) = 14px —— 那 14px 由 .bar-glass
        的 overscan（--over:18px）兜住，所以既不会被裁、也不需要挪动 capsule。
     ③ 多出来的余量全部记在**顶部**：.tabbar 是 bottom:0 锚定的，capsule 长高只会向上长，
        底边不动 → 屏幕上看到的就是"栏体原地鼓起来"。 */
  const cyTop = btnD / 2 + wrapMax;
  const barTop = cyTop - barH / 2, barBot = cyTop + barH / 2; // 水平直边的上下 y（常量）
  const H = cyTop + (btnD / 2 + wrapRest);                    // capsule 高度（常量）
  // 凹角过渡几何：过渡圆(r)与包边圆(R)外切（圆心距 R+r）且与直边相切 → 推出切点偏移
  const dx = Math.sqrt(Math.max(0, (R + r) * (R + r) - (barH / 2 + r) * (barH / 2 + r)));
  const fx = dx * R / (R + r);              // 过渡弧与包边圆切点的水平偏移
  const fy = r * (R - barH / 2) / (R + r);  // 同切点的竖直偏移（相对直边向上）
  /* bulge 圆心：常态落在栏体中轴；跟手时由 shapeState.btnCx 给一个水平偏移。
     必须夹住范围：偏移过大时过渡凹角的切点会越过两端圆角、路径自交。
     安全区间 = 中轴两侧各留出 (W/2 - endR - dx) 的余量。 */
  const maxCx = Math.max(0, W / 2 - endR - dx);
  const cx = W / 2 + Math.max(-maxCx, Math.min(maxCx, shapeState.btnCx || 0));
  const x1 = cx - dx, x2 = cx + dx;
  /* 走线（顺时针）：上直边 → 左过渡(凹,sweep0) → 上包边圆弧 → 右过渡(凹) → 上直边 →
     右端半圆 → 下直边 → 右过渡(凹) → 下包边圆弧 → 左过渡(凹) → 左端半圆 → 闭合。
     两段 r 的过渡必须是凹角（sweep=0），直边到包边圆才液体般柔化、不生硬。 */
  const d = [
    'M', endR, barTop,
    'L', x1.toFixed(2), barTop,
    'A', r, r, 0, 0, 0, (cx - fx).toFixed(2), (barTop - fy).toFixed(2),
    'A', R, R, 0, 0, 1, (cx + fx).toFixed(2), (barTop - fy).toFixed(2),
    'A', r, r, 0, 0, 0, x2.toFixed(2), barTop,
    'L', (W - endR).toFixed(2), barTop,
    'A', endR, endR, 0, 0, 1, (W - endR).toFixed(2), barBot,
    'L', x2.toFixed(2), barBot,
    'A', r, r, 0, 0, 0, (cx + fx).toFixed(2), (barBot + fy).toFixed(2),
    'A', R, R, 0, 0, 1, (cx - fx).toFixed(2), (barBot + fy).toFixed(2),
    'A', r, r, 0, 0, 0, x1.toFixed(2), barBot,
    'L', endR, barBot,
    'A', endR, endR, 0, 0, 1, endR, barTop,
    'Z'
  ].join(' ');
  cap.style.height = H + 'px';
  /* 把两个"钉住位置"的值写给 CSS：圆钮的垂直位置、页签条/栏内文字的顶部。
     它们都只依赖常量，所以跟手拖拽与水环膨胀期间一动不动。 */
  cap.style.setProperty('--cy-top', cyTop + 'px');
  cap.style.setProperty('--bar-top', barTop + 'px');
  const strip = cap.querySelector('.tab-strip');
  if(strip){ strip.style.top = barTop + 'px'; strip.style.height = barH + 'px'; }
  /* 裁切路径：同一段 d 同时给玻璃层和水波层用。两层都带 inset:calc(-1 * var(--over))，
     所以路径整体平移 (over, over) 抵消 —— 平移量按变量写，不硬编码。 */
  const cp = document.getElementById('barClipPath');
  if(cp){
    cp.setAttribute('d', d);
    cp.setAttribute('transform', 'translate(' + over + ',' + over + ')');
  }
  /* 折射置换图（边缘加权）：初始化 / resize 各生成一次；水环/跟手动画期间 skipMap
     （见 tweenShape / swellRing），结束时再补一次。每帧重算距离变换太贵（约 4~12ms）。 */
  if (!(opts && opts.skipMap)) updateDisplacement(d, W, H, over);
}
buildBarShape();
/* 屏宽变化（旋转 / 分屏 / 字号）时重算轮廓；防抖即可，不必每帧 */
let _barT = 0;
window.addEventListener('resize', () => { clearTimeout(_barT); _barT = setTimeout(buildBarShape, 120); });
/* 布局彻底稳定后再算一次，避免首帧量到的宽度不准导致轮廓错位 */
window.addEventListener('load', buildBarShape);

/* A1.1 边缘加权置换图：用 canvas 生成一张 PNG（R=X 位移 / G=Y 位移 / 128=中性），内联进
   <feImage> 喂给 feDisplacementMap。算法：Path2D 填充 → 掩膜 → 两趟 Chamfer 距离变换 →
   梯度求外法线 → 仅贴边 bezel 宽写入沿法线的位移（中间 = 128 中性、不糊）。
   性能：1× 分辨率（cw×ch ≈ 406×116 ≈ 4.7 万像素），距离变换 O(N) 极快（<12ms）；
   只在 init / resize（防抖）/ 长按落点 跑。canvas 或 Path2D 不可用时返回 null → 走旧噪声兜底。 */
function buildDisplacementMap(d, W, H, over){
  try {
    /* pad 必须等于玻璃层的 overscan（--over），否则置换图与可见轮廓会错位一整圈。
       画布 = 玻璃层的盒子尺寸，轮廓按同样距离平移后画进去。 */
    const pad = (typeof over === 'number' && over > 0) ? over : 18;
    const cw = W + pad * 2, ch = H + pad * 2;
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d'); if (!ctx) return null;
    ctx.fillStyle = 'rgb(128,128,128)'; ctx.fillRect(0, 0, cw, ch);   // 中性 = 不位移
    const p = new Path2D(d);
    ctx.translate(pad, pad);                 // 与 #barClipPath 的 translate(over,over) 对齐
    ctx.fillStyle = 'rgb(255,0,0)'; ctx.fill(p);
    const data = ctx.getImageData(0, 0, cw, ch).data, N = cw * ch;
    const mask = new Uint8Array(N);
    for (let i = 0; i < N; i++) mask[i] = data[i * 4] > 200 ? 1 : 0;  // 红=255 → 内部
    const INF = 1e9, SQ = 1.41421356;
    const A = new Float32Array(N).fill(INF), B = new Float32Array(N).fill(INF);
    for (let i = 0; i < N; i++){ if (!mask[i]) A[i] = 0; else B[i] = 0; }
    const fwd = (a) => { for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++){
      const i = y * cw + x; let v = a[i];
      if (x > 0)    v = Math.min(v, a[i - 1] + 1);
      if (y > 0)    v = Math.min(v, a[i - cw] + 1);
      if (x > 0 && y > 0)       v = Math.min(v, a[i - cw - 1] + SQ);
      if (x < cw - 1 && y > 0)  v = Math.min(v, a[i - cw + 1] + SQ);
      a[i] = v; } };
    const bwd = (a) => { for (let y = ch - 1; y >= 0; y--) for (let x = cw - 1; x >= 0; x--){
      const i = y * cw + x; let v = a[i];
      if (x < cw - 1)          v = Math.min(v, a[i + 1] + 1);
      if (y < ch - 1)          v = Math.min(v, a[i + cw] + 1);
      if (x < cw - 1 && y < ch - 1) v = Math.min(v, a[i + cw + 1] + SQ);
      if (x > 0 && y < ch - 1) v = Math.min(v, a[i + cw - 1] + SQ);
      a[i] = v; } };
    fwd(A); bwd(A); fwd(B); bwd(B);
    const cd = new Float32Array(N);          // 到轮廓的双向距离
    for (let i = 0; i < N; i++) cd[i] = A[i] > B[i] ? A[i] : B[i];
    const bezel = 13, out = ctx.createImageData(cw, ch), od = out.data;
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++){
      const i = y * cw + x; let Rc = 128, Gc = 128;
      const dist = cd[i];
      if (dist < bezel){
        const t = 1 - dist / bezel, mag = t * t * (3 - 2 * t);   // smoothstep：贴边最强
        const xl = x > 0 ? cd[i - 1] : dist, xr = x < cw - 1 ? cd[i + 1] : dist;
        const yu = y > 0 ? cd[i - cw] : dist, yd = y < ch - 1 ? cd[i + cw] : dist;
        let nx = xl - xr, ny = yu - yd;                          // 外法线（指向轮廓外）
        const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
        Rc = 128 + nx * mag * 127; Gc = 128 + ny * mag * 127;
      }
      const j = i * 4;
      od[j]     = Rc < 0 ? 0 : Rc > 255 ? 255 : Rc;
      od[j + 1] = Gc < 0 ? 0 : Gc > 255 ? 255 : Gc;
      od[j + 2] = 128; od[j + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
    return { url: cv.toDataURL('image/png'), cw, ch };
  } catch (e){ return null; }
}
/* 把置换图写进 <feImage> 并切到 map；失败（无 canvas）则保留 feTurbulence 噪声兜底（in2=smoothed）。 */
function updateDisplacement(d, W, H, over){
  const feImg = document.getElementById('barLiquidMap');
  /* 三通道色散：R/G/B 三个 feDisplacementMap 都要切到生成好的置换图（#map）。
     拿不到三个里的任何一个就整体放弃，维持 feTurbulence 噪声兜底 —— 三个通道
     用不同的图源会彩虹乱飞，比"没有色散"难看得多。 */
  const disps = ['barDispR', 'barDispG', 'barDispB'].map(id => document.getElementById(id));
  if (!feImg || disps.some(x => !x)) return;
  const res = buildDisplacementMap(d, W, H, over);
  if (!res) return;                       // 兜底：维持旧噪声滤镜不变
  feImg.setAttribute('width', res.cw); feImg.setAttribute('height', res.ch);
  feImg.setAttribute('href', res.url);
  feImg.setAttributeNS('http://www.w3.org/1999/xlink', 'href', res.url);
  disps.forEach(disp => { if (disp.getAttribute('in2') !== 'map') disp.setAttribute('in2', 'map'); });
  if (voiceActive) liquidSource('noise');   // 长按态里重建过图也仍走"在动的噪声"
}
/* 折射位移的来源（v2.5）：'map' = JS 生成的静态置换图（平常那种"贴着轮廓的厚边"），
   'noise' = 上面那张**频率在呼吸**的 feTurbulence（长按态专用：边缘折射像水一样流动）。
   长按切换它的理由：真正的"波光粼粼"必须让位移图本身随时间变；把静态图换成动噪声是最省的
   路子（每帧重算距离变换是不可能的），而且仍在同一条 backdrop-filter 链里。 */
function liquidSource(kind){
  const want = kind === 'noise' ? 'smoothed' : 'map';
  /* 三通道统一切换（都用同一张图源）：给 B 通道单独换图源会让彩虹乱飞，
     色散已经由三者的 scale 差（40/36/32）保证。 */
  ['barDispR', 'barDispG', 'barDispB'].forEach((id) => {
    const n = document.getElementById(id);
    if (!n) return;
    if (n.getAttribute('in2') !== want) n.setAttribute('in2', want);
  });
}
/* 逐帧插值轮廓参数（btnD 直径 / btnCx 水平位置）并重建 d（三份路径）；动画期间 skipMap，
   落点才补一次置换图（距离变换太贵，不能每帧跑）。
   btnCx 的插值让"松手后 bulge 滑回中轴"是一段动画而不是瞬间弹回；onDone 用来在落点
   摘掉 .dragging、把折射层恢复出来。 */
function tweenShape(target, dur, targetCx, onDone){
  const sD = shapeState.btnD, sCx = shapeState.btnCx;
  const tCx = (typeof targetCx === 'number') ? targetCx : sCx;
  const t0 = performance.now();
  cancelAnimationFrame(shapeState._raf);
  (function step(now){
    let k = Math.min(1, (now - t0) / dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;   // easeInOutQuad
    shapeState.btnD  = sD  + (target - sD)  * e;
    shapeState.btnCx = sCx + (tCx    - sCx) * e;
    buildBarShape(k < 1 ? { skipMap: true } : undefined);              // 落点补一次置换图
    if (k < 1) shapeState._raf = requestAnimationFrame(step);
    else if (typeof onDone === 'function') onDone();
  })(performance.now());
}

/* 录入圆钮（第二批）：单击＝切到录入界面；长按＝进入「跟手语音 / 快捷录入」手势。
   用 pointer 事件而非 click：长按要在"按住期间"就给反馈、松手/取消要复位，
   click 只能拿到"已松手一刻"，分不出短按长按的意图。CSS 里 touch-action:none 已就位，
   这里再 setPointerCapture，移动端不会把长按当滚动/缩放吞掉 pointer。键盘用户走 keydown。 */
const fab = document.getElementById('entryFab');
/* v3.8：页面显示的版本号。开发期手改这里；打包时 _android/build.py 会用 AndroidManifest
   的 versionName 覆盖它 —— 版本号只有一处真相源（manifest），这里只是它的投影。 */
const APP_VERSION = '3.5.6';

const LONG_PRESS_MS = 350;          // 长按阈值（≥350ms 才进入手势态）
const SAFE_ZONE = 28;               // 安全范围＝按钮半径（用户："错位按钮的一半"）：
                                    // ±28px 内怎么抖都不选方向；越界那一刻轻震一下作提示，
                                    // 同时已越过的那一半玻璃开始"流动"（.bar-flow）。
/* 用 var 而不是 let：`buildBarShape()` 在脚本顶层就会被调用一次（见下方的初始化调用），
   而 updateDisplacement 里要读 voiceActive 决定折射图来源 —— 用 let 会落进 TDZ
   （"Cannot access 'voiceActive' before initialization"），整个脚本会在加载期直接中止。
   var 从脚本一开始就存在（undefined），读它是安全的。 */
var fabTimer = 0, voiceActive = false, voiceSide = 0, voicePending = '', voiceStartX = 0, voiceLastX = 0, voiceCapId = null;

/* ★ v3.8 真全面屏的关键一步：把**原生算出来的真实安全区**写进 CSS 变量。
   为什么要这一步：v3.8 把 Activity 改成了 edge-to-edge（内容铺到状态栏/手势条下面），
   而 WebView 的 env(safe-area-inset-*) 在旧系统/旧 WebView 上常常仍是 0 ——
   只靠 env() 的话内容会直接顶到状态栏下面。原生 insets() 返回的是真值，env() 只作兜底。 */
(function applyInsets(){
  /* ★ v3.36（用户："上下滑动时会跳动：往上滑它就往上移一点，往下滑就往下移一点"）：
     真凶是**动态的 env(safe-area-inset-bottom)**。安卓上系统手势条在滚动时会自动隐藏/显隐切换，
     env() 就跟着变；底栏是 bottom:0 锚定的，padding-bottom 一变，整条栏就上下挪几像素 ——
     看起来正好是"跟着手指往上/往下移一点"。
     现在改成：启动时把 env() 与原生 insets() 取大者**算一次写进 --sab / --sat**，
     之后只认这两个变量（CSS 里已经不再出现 env()）。滚动期间一个字节都不会重写，
     栏体的位置因此不参与任何滚动期的计算。

  const envInset = side => {
    try {
      const p = document.createElement('div');
      p.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;'
        + 'padding-' + side + ':env(safe-area-inset-' + side + ',0px)';
      document.body.appendChild(p);
      const v = parseFloat(getComputedStyle(p)['padding' + (side === 'top' ? 'Top' : 'Bottom')]) || 0;
      p.remove();
      return v;
    } catch (_){ return 0; }
  };
  const readNative = () => {
    try {
      if (!window.YuShiNative || typeof window.YuShiNative.insets !== 'function') return [0, 0];
      const s = String(window.YuShiNative.insets() || '0,0').split(',');
      return [parseFloat(s[0]) || 0, parseFloat(s[1]) || 0];
    } catch (_){ return [0, 0]; }

     照它重写变量正是"整条栏跟着滚动跳"的来源（v3.11 的老结论，v3.36 把 env() 这最后一条
     动态来源也堵掉）。 */
  try {
    if (!window.YuShiNative || typeof window.YuShiNative.insets !== 'function') return;
    /* v3.24：滚动期间给 <html> 挂 is-scrolling（停 140ms 摘掉）—— CSS 用它收掉越界流光。
       注意 v3.36 起这条**不再**关玻璃（见 CSS 那条说明）。被动监听，不拦滚动。 */
    let _scrollT = 0;
    window.addEventListener('scroll', () => {
      const de = document.documentElement;
      if (!de.classList.contains('is-scrolling')) de.classList.add('is-scrolling');
      clearTimeout(_scrollT);
      _scrollT = setTimeout(() => de.classList.remove('is-scrolling'), 140);
    }, { passive: true });
    /* v3.25：内容装得下 → 整页锁死，不许上下滑；装不下（设置页那种长页）才放行。
       挂在 MutationObserver 上，任何重新渲染/展开分区之后都会重算，不用去改 refresh()。 */
    try {
      const _de = document.documentElement;
      const _syncFit = () => {

             设置页/长清单那种真装不下的，溢出远超 140px，照样能滚。 */
          const over = document.body.scrollHeight - window.innerHeight;
          const fit = over <= 140;
          _de.classList.toggle('fit-view', fit);
          if (fit && window.scrollY > 0) window.scrollTo(0, 0);   // 锁死的同时把偏移归零
        } catch (_){}
      };
      _syncFit();
      window.addEventListener('resize', _syncFit, { passive: true });
      window.addEventListener('orientationchange', _syncFit);
      new MutationObserver(_syncFit).observe(view, { childList: true, subtree: true });
    } catch (_){}
  } catch (_){}
})();

const HEARD_HINT_SAY = '说：时间 + 做什么，例如：明天下午 交实验报告';

    ? (!S.voice ? HEARD_HINT_OFF
        : ((voiceReady() || offlineReady()) ? HEARD_HINT_SAY

/* 退出长按态：复原全部视觉、解绑拖拽、停掉识别。位移不足 / 松手居中 / 取消都走这里。 */
function fabReset(){

function cancelVoice(){

/* 水环膨胀 / 收回：**栏体自己**的包边宽度在 --wrap(6) 与 --wrap-max(20) 之间走一遍，
   也就是"水环突出并恢复，形成整个导航栏的形状"（用户原话）。
   为什么不用一个独立的圆环元素来做这件事：用户明确要求"这两个元素要在同一个图层里，
   并且是可以相互干扰的，而不是像你现在这样直接分成两个图层来回滑动"。让栏体自己的轮廓
   鼓起来，就是字面意义上的"同一个图层、相互干扰"——圆钮把栏体撑开，栏体裹住圆钮。
   只跑两段：0→1 鼓出（ease-out，像水滴被挤出来），1→0 收回（ease-in-out，落回栏形）。
   全程 skipMap，落点补一次置换图（距离变换不能每帧跑）。 */
const SWELL_OUT_MS = 220, SWELL_IN_MS = 300;
function swellRing(){
  const cap = document.getElementById('capsule');
  if (!cap) return;
  const wrapMax = (() => {
    const v = parseFloat(getComputedStyle(cap).getPropertyValue('--wrap-max'));
    return isNaN(v) ? 20 : v;
  })();
  const t0 = performance.now();
  cancelAnimationFrame(shapeState._rafRing);
  (function step(now){
    const k = now - t0;
    if (k < SWELL_OUT_MS){                                   // 鼓出
      const t = k / SWELL_OUT_MS, e = 1 - Math.pow(1 - t, 3); // easeOutCubic
      shapeState.wrap = wrapMax * e;
      buildBarShape({ skipMap: true });
      shapeState._rafRing = requestAnimationFrame(step);
    } else if (k < SWELL_OUT_MS + SWELL_IN_MS){               // 收回
      const t = (k - SWELL_OUT_MS) / SWELL_IN_MS;
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOutQuad
      shapeState.wrap = wrapMax * (1 - e);
      buildBarShape({ skipMap: true });
      shapeState._rafRing = requestAnimationFrame(step);
    } else {                                                  // 落点：交还给 CSS 变量 + 重建置换图
      shapeState.wrap = null;
      buildBarShape();
    }

}
/* 圆钮在手势态下跟手：**不再放大**，只随手指水平位移，并且把栏体的 bulge 一起带走 ——
   这就是用户要的效果："左右滑的时候，导航栏被撑大的部分也要随着它左右滑动，并且有相应的
   动画效果"。圆钮 / 水波中心 / 栏体 bulge 三者共用同一个偏移量 off，所以永远重合，
   不会出现"按钮走了包边还在原地"的穿帮。
   跟手期间给胶囊挂 .dragging：置换图是按"水环在中轴"生成一次的，跟不上移动中的轮廓，
   硬留着会在栏体中间画出一道假的弯折。 */
const FAB_TRAVEL = 92;              // bulge 最大水平行程（buildBarShape 里还会按栏宽再夹一次）
/* 变速跟手（用户要求：起步容易、越往左右滑越慢、快到头时几乎不动）。
   手指位移 dx → UI 位移走 tanh 饱和曲线，而不是线性：
     v3.2：K 从 70 收到 **110** —— 起步增益 = FAB_TRAVEL/K ≈ 0.84，头 40px 几乎 1:1 跟手
     （用户："按钮跟我手指头是脱离的，有延迟"），之后增益单调下降：
     dx=70 用掉 53%，dx=140 用掉 84%，dx=210 用掉 95%。
   **永远逼近但到不了 FAB_TRAVEL** —— 这就是"手指走的距离一样，UI 走的越来越少"。

function fabTravel(dx){ return FAB_TRAVEL * Math.tanh(dx / 110); }
/* ---- 两个词的淡出（v2.5 重做）----
   用户最新要求：①"不要让它们变动，正常固定在一个合适的距离即可"；②"往哪边滑时，那边的
   字体就开始变淡；如果滑到那个字体上，那个字体直接消失"。
   所以：**位置完全固定**（间距只由 CSS 的 28px 内边距决定，JS 不碰 transform），只改透明度。
   淡出量按"圆钮逼近该词的程度"算：从词的内侧边缘再往前 44px 开始变淡，压到字上即 0。
