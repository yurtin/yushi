view.addEventListener('pointerup', () => {
  const g = seedG;
  /* ★ 5I：手势期内**几乎没动**（没方向、没目标）这一档，浏览器随后会补发一发 click，
     落点是刚打开的遮罩 → 菜单被立刻关掉。这里做个标记，让下面那个捕获监听吞掉那一发。
     有方向 / 有目标的那几档本来就不会补 click（拖动被浏览器当成手势），不受影响。 */
  if (g && !g.dir && !g.target) seedClickMute = Date.now();
  seedPressCancel();
  if (!g) return;
  if (g.target){                                          // 落到另一条上 → 合并这两条
    const b = S.items.find(x => x.id === g.target);
    if (b && isSeed(b)){
      seedMergeBegin([g.it.id, b.id]);
      refresh();
    }
    return;
  }
  if (g.dir === 'right'){ openSeedPromote(g.it); return; }   // 右滑 → 立项（送去清单）
  if (g.dir === 'left'){ openEdit(g.it); return; }           // 左滑 → 编辑
  if (g.dir === 'down'){                                     // 下滑 → 续写
    S.lastOpenedSeed = g.it.id; S.ideaUsedAt = ymd(new Date());
    /* ★ 5I：打开行内输入框这一下也会让整列重排（回顾抽屉按 ideaUsedAt 收起），
       把这张卡钉回原来的屏幕位置 —— 否则用户按的那张卡连输入框一起跑出视口。 */
    keepSeedPlace(g.it.id, () => { ideaUI.sparkOpen = g.it.id; save(); refresh(); });
    return;
  }
  if (g.dir === 'up'){ openSeedSheet(g.it); return; }        // 上滑 → 动作菜单
  openSeedSheet(g.it);                                       // 没动 → 菜单（兜底 + 可发现）
});
view.addEventListener('pointercancel', seedPressCancel);
view.addEventListener('scroll', seedPressCancel, true);   // 捕获阶段：内部任何一层滚动都要取消
/* ★ 审查修复（2026-10-04）：`pointerup` 只挂在 #view 上 —— 长按后在 #view 外面松手
   （例如落在底栏）就收不到，`seedG` 会一直留着；而手势态下 #view 的 touchmove 是
   preventDefault 的，于是**页面再也滚不动**，直到下一次按到卡片才复位。挂 window 兜底。 */
window.addEventListener('pointerup', () => { if (seedG) seedPressCancel(); });
window.addEventListener('pointercancel', () => { if (seedG) seedPressCancel(); });
/* ★ 本轮真 bug（用户实测："长按时上滑或下滑没有反应；上滑时整个页面就跟着滑动了"）：
   根因不是方向没写，而是**没拦住页面滚动**。卡片长在可滚动内容里，手指一动，浏览器就把
   这一串指针事件判成"滚动"，立刻派发 pointercancel 把手势掐掉 —— 屏幕上只剩页面在滚。
   长按成立的前提正是"400ms 内几乎没动"，也就是说这一刻浏览器还没开始滚，此时在 touchmove
   上 preventDefault 才真正拦得住；手势没成立时不拦（日常上下滑页面照旧，滚动优先）。
   ⚠️ 必须 passive:false，默认 passive 下 preventDefault 无效。 */
view.addEventListener('touchmove', e => {
  if (seedG && e.cancelable) e.preventDefault();
}, { passive: false });
/* ★ 5I：吞掉长按收尾后浏览器补发的那一发 click（见 seedClickMute 的说明）。
   必须在**捕获阶段**拦在 document 上：遮罩的关闭监听在 #mask 上，
   捕获先跑，stopPropagation 之后它就到不了 #mask。
   两个限定，缺一不可：
     · 只吞手势收尾后 300ms 内的第一发（补发的那一发是抬手后立刻到，实测量到 <50ms）；
     · 只吞 **isTrusted === true** 的（浏览器补发的真事件）。脚本里 `el.click()` 造出来的
       是 isTrusted=false 的合成事件 —— 决不能吞，`_verify-idea.mjs` 就是靠它在菜单里点
       「收起来 / 生长」，一口吞掉会让那一整段假红。 */
document.addEventListener('click', e => {
  if (!seedClickMute) return;
  const fresh = Date.now() - seedClickMute < 300;
  seedClickMute = 0;
  if (fresh && e.isTrusted){ e.stopPropagation(); e.preventDefault(); }
}, true);

/* 长按菜单里的动作：**先收菜单再执行** —— 否则菜单会盖在结果上面
   （"续写"要展开行内输入框、"立项"要弹编辑器、"编辑"要弹整页编辑器，都不能被挡着）。
   这些动作原本挂在 #view 的委托上，而菜单在 #view 之外，所以这里单独接一遍；
   能复用现成函数的就复用，不另写一份逻辑。 */
modal.addEventListener('click', e => {
  if (!mask.classList.contains('sheet-mode')) return;
  if (e.target.closest('[data-act="sheetclose"]')){ closeModal(); return; }
  /* ★ v5.0 第 3 批：挂载建议的接受 / 拒绝。也在抽屉态里，所以接在这一处。
     **先关弹层再改数据** —— 改完要 refresh，弹层开着会让它跨在旧 DOM 上。 */
  const sg = e.target.closest('[data-act="sugapply"],[data-act="sugdrop"]');
  if (sg){
    const sIt = S.items.find(x => x.id === sg.dataset.id);
    const sIdx = Number(sg.dataset.i);
    const isApply = sg.dataset.act === 'sugapply';
    closeModal();
    if (!sIt) return;
    if (isApply) aiSuggestApply(sIt, sIdx); else aiSuggestDrop(sIt, sIdx);
    return;
  }
  const b = e.target.closest('.sheet-item');
  if (!b) return;
  const act = b.dataset.act;
  const it = S.items.find(x => x.id === b.dataset.id);
  /* 删除要拿到卡片元素播退场动画，所以在关菜单之前先取 */
  const cardEl = it ? view.querySelector('.item.seed[data-id="' + it.id + '"]') : null;
  closeModal();
  if (!it) return;
  /* ★ v5.0 树状图里**没有卡片，也就没有那行就地输入框**。
     原来一律走 ideaUI.sparkOpen —— 在树状图里就是"点了一下续写、什么也没发生"（真 bug）。
     树状图里改成开弹窗。 */
  if (act === 'sparkadd'){
    if (S.ideaLayout === 'tree'){
      openSeedPrompt('续写', it.title, '现在多了什么信息？',
        v => { if (seedAddSpark(it, v)) refresh(); });
      return;
    }
    /* ★ 5I：同下滑那条 —— 打开输入框时把卡片钉在原位（列表会因抽屉收起/重排而整体位移） */
    keepSeedPlace(it.id, () => { ideaUI.sparkOpen = it.id; refresh(); });
    return;
  }
  if (act === 'fork'){
    openSeedPrompt('从「' + it.title + '」生长', '新的想法第一句', '从这里分出去的那条',
      v => {
        const nx = seedGrow(it, v);
        /* ★ 审查修复：§10 要求长出有撤销出口 —— 误触之后不用手动去删那条新想法 */
        if (nx){ refresh(); toast('长出一条新想法', '撤销', () => { remove(nx); }); }
      });
    return;
  }
  if (act === 'promote'){ openSeedPromote(it); return; }
  /* ★ v5.0 第 3 批：AI 质疑（一次一个问题）。不 await —— 弹层已经关了，
     结果回来时自己 refresh；期间用户可以去干别的。 */
  if (act === 'aiask'){ aiAsk(it); return; }
  if (act === 'edit'){ openEdit(it); return; }
  if (act === 'mergepick'){ ideaUI.mergeMode = true; ideaUI.mergeSel.clear(); ideaUI.mergeSel.add(it.id); refresh(); return; }
  if (act === 'seeduse'){ seedUse(it); return; }
  if (act === 'del'){ remove(it, cardEl); return; }
});

/* ---------------- 自定义下拉 / 日历 / 确认框 ----------------
   为什么要这三件套：手机上点原生 <select> 弹的是安卓系统的底部单选列表，
   点 <input type=date> 弹的是系统日历，confirm() 是浏览器对话框 —— 字体、圆角、
   配色全是系统 Material 的，跟本站完全两个世界（用户截图：普通/重要/紧急那份）。
   而且原生 <select> 的 option 几乎没法定制样式，这是唯一能把"点开后的列表"
   也变成自己 UI 的路。值都不进表单：select 存在 .sel 的 dataset.value，
   日历存在同一结构里，读取统一走 selValue(id)。 */

let selOpenEl = null;                       // 当前展开的下拉（同一时间只开一个）
function closeSel(){
  if (!selOpenEl) return;
  selOpenEl.classList.remove('open');
  const b = selOpenEl.querySelector('.sel-btn');
  if (b) b.setAttribute('aria-expanded', 'false');
  selOpenEl = null;
}
document.addEventListener('click', e => {
  if (selOpenEl && !selOpenEl.contains(e.target)) closeSel();
});
/* Escape 先关下拉、再关弹窗 —— capture 阶段拦下并 stopImmediatePropagation，
   否则下面那条"Escape 关弹窗"的监听会同时把整个编辑弹窗关掉。 */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && selOpenEl){ closeSel(); e.stopImmediatePropagation(); }
}, true);

/* 把一个空 <div class="sel" id="..."> 变成完整的下拉控件。
   options: [[值, 显示文字], ...]；value: 初始值。
   值不写进任何 input/select —— 保存时用 selValue(id) 读 dataset.value。
   （不藏一个真 <select> 的原因：焦点陷阱、序列化、样式覆盖三条路都会多出隐形分支，
   还不如让"没有表单控件"这件事明明白白。） */
/* 展开 / 收起一个下拉或日历（makeSel / makeCal 共用）。
   贴近弹窗底部时向上弹（.up）：.modal 是 overflow:auto 的滚动容器，
   浮层是 absolute 定位 —— 底部的字段往下弹会被容器裁掉半截（真机截图踩过）。 */
function toggleSel(el){
  const btn = el.querySelector('.sel-btn');
  const was = el.classList.contains('open');
  closeSel();
  if (was) return;
  el.classList.add('open');
  /* 先展开再量：display:none 时 scrollHeight 是 0、量不出真实高度。
     同一个任务里连续改样式不会产生中间帧 —— 不存在"先往下弹再跳上去"的闪烁。 */
  const pop = el.querySelector('.sel-pop');
  const modal = document.getElementById('modal');
  if (modal && pop){
    const b = btn.getBoundingClientRect(), m = modal.getBoundingClientRect(), p = pop.getBoundingClientRect();
    const room = m.bottom - b.bottom - 10;                    // 字段以下还剩多少可视空间
    const need = p.height + 6;
    if (room < need && b.top - m.top > need) el.classList.add('up');
  }
  btn.setAttribute('aria-expanded', 'true');
  selOpenEl = el;
}

function makeSel(el, options, value){
  el.classList.add('sel');
  el.dataset.value = value;
  const label = k => { const o = options.find(x => x[0] === k); return o ? o[1] : ''; };
  el.innerHTML =
    '<button type="button" class="sel-btn" aria-haspopup="listbox" aria-expanded="false">' +
      '<span class="sel-t"></span>' +
      '<svg class="sel-chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9.2l6 6 6-6"/></svg>' +
    '</button>' +
    '<div class="sel-pop" role="listbox">' +
      options.map(([k, t]) =>
        '<button type="button" class="sel-opt" role="option" data-v="' + esc(k) + '">' +
          '<span class="sel-k">' + esc(t) + '</span><span class="sel-ck" aria-hidden="true">✓</span>' +
        '</button>').join('') +
    '</div>';
  const btn = el.querySelector('.sel-btn');
  const pop = el.querySelector('.sel-pop');
  const paint = () => {
    el.querySelector('.sel-t').textContent = label(el.dataset.value);
    pop.querySelectorAll('.sel-opt').forEach(o => {
      const on = o.dataset.v === el.dataset.value;
      o.classList.toggle('on', on);
      o.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  };
  paint();
  btn.onclick = e => {
    e.stopPropagation();                    // 别让这次点击立刻被"点外面就关"接住
    toggleSel(el);
  };
  pop.querySelectorAll('.sel-opt').forEach(o => {
    o.onclick = () => { el.dataset.value = o.dataset.v; paint(); closeSel(); };
  });
}
function selValue(id){ return document.getElementById(id).dataset.value; }

/* 日历：结构与下拉共用同一套 .sel/.sel-btn/.sel-pop（弹层语言一致），只是浮层里
   换成一格一月的网格。周一开头 —— 中文语境的日历习惯。 */
function makeCal(el, value){
  el.classList.add('sel', 'cal');
  el.dataset.value = value || ymd(new Date());
  let cur = new Date(el.dataset.value + 'T00:00:00');
  if (isNaN(cur)) cur = new Date();
  const WD = ['一','二','三','四','五','六','日'];
  const CN = d => d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  function render(){
    const wasOpen = el.classList.contains('open');
    const y = cur.getFullYear(), m = cur.getMonth();
    const shift = (new Date(y, m, 1).getDay() + 6) % 7;        // 周一=0
    const days = new Date(y, m + 1, 0).getDate();
    let cells = '';
    for (let i = 0; i < shift; i++) cells += '<span class="cal-pad"></span>';
    for (let d = 1; d <= days; d++){
      const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
      cells += '<button type="button" class="cal-d' + (ds === el.dataset.value ? ' on' : '') +
               '" data-v="' + ds + '" aria-label="' + CN(new Date(y, m, d)) + '">' + d + '</button>';
    }
    el.innerHTML =
      '<button type="button" class="sel-btn" aria-haspopup="dialog" aria-expanded="false">' +
        '<span class="sel-t">' + esc(CN(new Date(el.dataset.value + 'T00:00:00'))) + '</span>' +
        '<svg class="sel-chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M4 10.5h16M8.5 3.5v4M15.5 3.5v4"/></svg>' +
      '</button>' +
      '<div class="sel-pop" role="dialog" aria-label="选择日期">' +
        '<div class="cal-head">' +
          '<button type="button" class="cal-nav" data-nav="-1" aria-label="上个月">‹</button>' +
          '<span class="cal-title">' + y + '年' + (m + 1) + '月</span>' +
          '<button type="button" class="cal-nav" data-nav="1" aria-label="下个月">›</button>' +
        '</div>' +
        '<div class="cal-grid">' +
          WD.map(w => '<span class="cal-wd">' + w + '</span>').join('') + cells +
        '</div>' +
      '</div>';
    const btn = el.querySelector('.sel-btn');
    btn.onclick = e => { e.stopPropagation(); toggleSel(el); };
    el.querySelectorAll('.cal-nav').forEach(n => {
      n.onclick = e => { e.stopPropagation(); cur = new Date(y, m + (+n.dataset.nav), 1); render(); };
    });
    el.querySelectorAll('.cal-d').forEach(d => {
      d.onclick = () => { el.dataset.value = d.dataset.v; render(); closeSel(); };
    });
    /* 翻月会整体重建 innerHTML —— 把"正展开"这个状态接回来，否则点一次 ›/‹ 浮层就合上 */
    if (wasOpen){
      el.classList.add('open');
      el.querySelector('.sel-btn').setAttribute('aria-expanded', 'true');
      selOpenEl = el;
    }
  }
  render();
}

/* 应用内确认框（替代 confirm()）。文案里的换行用 white-space:pre-line 保留。 */
function uiConfirm(title, msg, okText, onOk){
  modal.innerHTML =
    '<h3 id="modalTitle">' + esc(title) + '</h3>' +
    '<p class="confirm-msg">' + esc(msg) + '</p>' +
    '<div class="foot"><div class="spacer"></div>' +
      '<button class="btn" id="uc_no">取消</button>' +
      '<button class="btn primary" id="uc_yes">' + esc(okText) + '</button></div>';
  openMask();
  document.getElementById('uc_no').onclick = closeModal;
  document.getElementById('uc_yes').onclick = () => { closeModal(); onOk(); };
}

/* ============ 时间编辑器（v3.40 第 1 批）============
   这一整块只服务编辑弹层的「时间」行，需求见 需求-时间编辑器与随手记.md 的 A1–A4。
   四条硬规矩：
   ① 时间字段此后**只由结构化控件写**（update 路径不再回写 parseSmart 的结果）。
   ② 日历原地内联展开，不新起浮层；时刻滑轮复用 .sel 弹层语言（fixed 底部卡片）。
   ③ 日期点选是"第1次单日 / 第2次成区间 / 第3次旧区间作废重开"的状态机。
   ④ 循环间隔 = **区间结束后空 N 天**，不是周期总长。 */

/* 编辑会话内的临时状态。放模块级而不是闭包里，因为滑轮（另一个函数）也要读写它。 */
let TE = null;
const TE_WD = ['日','一','二','三','四','五','六'];

function teParseDate(str){
  const m = String(str || '').trim();
  if (!m) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(m)) return m;
  if (/^今天$/.test(m)) return ymd(today0());
  if (/^明天$/.test(m)){ const d = today0(); d.setDate(d.getDate() + 1); return ymd(d); }
  if (/^后天$/.test(m)){ const d = today0(); d.setDate(d.getDate() + 2); return ymd(d); }
  const w = m.match(/^周([一二三四五六日天])$/);
  if (w){
    const target = TE_WD.indexOf(w[1] === '天' ? '日' : w[1]);
    const d = today0();
    d.setDate(d.getDate() + ((target - d.getDay() + 7) % 7));
    return ymd(d);
  }
  /* 复用 numToDate：921 / 9.21 / 9月21日 / 21号 都在它的能力范围内，别另写一套解析 */
  const r = numToDate(m.replace(/\s+/g, ''));
  if (r && r.date) return r.date;
  return null;
}
/* 三位数字的歧义（930 → 9:30）用 numToDate 顶不上，时刻得自己收：
   930 / 9:30 / 9.30 / 9点30 / 下午5点 / 晚上8点半 … */
function teParseTime(str){
  let s = String(str || '').trim();
  if (!s) return null;
  let pm = null, am = null;
  if (/下午|晚上|傍晚|夜里/.test(s)) pm = true;
  if (/凌晨|早上|上午/.test(s)) am = true;
  /* ★ 4D：汉字数字钟点（语音输入法吐的是汉字，手打「九点五十一」也是）。
     这一步必须在「点→冒号」与剥非数字**之前** —— 否则 `九点五十一` 会被 [^\d:]
     整段剥成 `:` 判成 null（改前实测就是 null）；`十一点半` 更糟：剥成 `:30`
     编出 00:30。整段认不出的（如 `零`）原样留着交给后面的剥离逻辑（宁可漏认）。 */
  s = s.replace(/[零一二两三四五六七八九十]+/g, w => {
    const n = cnNum(w);
    return n == null ? w : String(n);
  });
  /* ★ 0F.1：「半」必须在「点→冒号」之后、剥非数字之前换掉。
     以前没有这一步时，`9点半` 走成 `9:半` → 被 [^\d:] 连"半"一起剥成 `9:` → 分钟取空 = 0，
     半小时被丢掉（现象：打 9点半 存成 09:00）。 */
  s = s.replace(/[点時时]/g, ':').replace(/半/g, '30').replace(/[分]/g, '').replace(/[^\d:]/g, '');
  /* 归一化后一个数字都没有的（例如只打了"点半"）不是时刻：返回 null，而不是编出 00:30 */
  if (!/\d/.test(s)) return null;
  let h = null, mi = 0;
  if (/^\d{3,4}$/.test(s)){
    /* 930 → 9:30；0930 → 9:30；1730 → 17:30 */
    const n = s.padStart(4, '0');
    h = +n.slice(0, 2); mi = +n.slice(2);
  } else if (s.includes(':')){
    const [a, b] = s.split(':');
    h = +a; mi = b ? +b : 0;
  } else {
    h = +s;
    if (!isFinite(h)) return null;
    /* 单个数字当小时：5 → 05:00（下午 5 → 17:00） */
    mi = 0;
  }
  if (!isFinite(h) || !isFinite(mi)) return null;
  if (pm && h < 12) h += 12;
  if (am && h === 12) h = 0;
  if (h < 0 || h > 23 || mi < 0 || mi > 59) return null;
  return String(h).padStart(2, '0') + ':' + String(mi).padStart(2, '0');
}
function teDateLabelFromStr(ds){
  if (!ds) return '';
  const d = dateFrom(ds);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日';
}
/* 区间内语义：做一次 = once（缺省，老数据也走它）；每天都做 = daily */
function teMode(){ return TE && TE.mode === 'daily' ? 'daily' : 'once'; }

/* 日历点选状态机（需求 A2 定稿）：
     · 第 1 次点 → 单日
     · 第 2 次点 → 自动成区间
     · 第 3 次点 → 旧区间作废，以它为起点重来
   两条不显眼但必需的细节：
   ① **弹层一打开就数用户点击**（userClicks）。条目本来就有日期时，TE 的初始态
      带着"单日/区间"，如果直接拿 picks 计数，第一次点日期会被当成"第 2 次点"→
      区间从老日期一路拉过来。用户看到的是"我只点了一下，怎么出来一大段区间"。

function tePick(ds){
  if (!TE) return;
  TE.userClicks = (TE.userClicks || 0) + 1;
  if (TE.userClicks === 1){
    TE.start = ds; TE.end = ds; TE.picks = 1;
    return;
  }
  if (TE.picks === 1){
    if (ds === TE.start){ TE.picks = 2; }            // 同一天点两次：按单日处理
    else {
      TE.end = ds < TE.start ? TE.start : ds;
      TE.start = ds < TE.start ? ds : TE.start;
      TE.picks = 2;
    }
  } else {
    TE.start = ds; TE.end = ds; TE.picks = 1;        // 第 3 次：旧区间全部作废
  }
}
function teRenderCal(){
  const wrap = document.querySelector('#te_cal');
  if (!wrap || !TE) return;
  /* 幂等守卫：这个函数在每次 teSyncUI 里都会被调到，而它每次都重建 innerHTML。
     绝不能让它携带任何"会被累加"的状态 —— 早期版本把点击处理器写成
     addEventListener，结果同一个格子挂了两份 handler，一次点击被算成两次：
     第 1 次点 10/23 → 直接落到"第 2 次点"分支，区间被拉成 10/4–10/23，
     再点 10/25 → 旧区间作废只剩 10/25。症状就是"区间永远选不出来"。
     现在一律用 onclick（赋值语义，天然幂等），并在这里做一次显式清空，
     给以后改这块代码的人留个记号。 */
  const y = TE.cur.getFullYear(), m = TE.cur.getMonth();
  const shift = (new Date(y, m, 1).getDay() + 6) % 7;   // 周一开头，跟 makeCal 一致
  const days = new Date(y, m + 1, 0).getDate();
  const t0 = ymd(today0());
  const inRange = ds => TE.picks === 2 && TE.start && TE.end && ds >= TE.start && ds <= TE.end;
  let cells = '';
  for (let i = 0; i < shift; i++) cells += '<span class="cal-pad"></span>';
  for (let d = 1; d <= days; d++){
    const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    let cls = 'cal-d';
    if (inRange(ds)){
      cls += ' inrange';
      if (ds === TE.start && ds === TE.end) cls += ' rboth edge';
      else if (ds === TE.start) cls += ' rstart edge';
      else if (ds === TE.end) cls += ' rend edge';
    } else if (TE.picks === 1 && ds === TE.start){
      cls += ' rboth edge';
    }
    if (ds === t0) cls += ' today-d';
    cells += `<button type="button" class="${cls}" data-d="${ds}" aria-pressed="${inRange(ds) || ds === TE.start ? 'true' : 'false'}">${d}</button>`;
  }
  wrap.innerHTML =
    '<div class="cal-head">' +
      '<button type="button" class="cal-nav" data-nav="-1" aria-label="上个月">‹</button>' +
      '<span class="cal-title">' + y + '年' + (m + 1) + '月</span>' +
      '<button type="button" class="cal-nav" data-nav="1" aria-label="下个月">›</button>' +
    '</div>' +
    '<div class="cal-grid">' + ['一','二','三','四','五','六','日'].map(w => '<span class="cal-wd">' + w + '</span>').join('') + cells + '</div>';
  wrap.querySelectorAll('.cal-nav').forEach(n => n.onclick = e => {
    e.stopPropagation();

  });
  wrap.querySelectorAll('.cal-d').forEach(b => b.onclick = e => {
    e.stopPropagation();
    tePick(b.dataset.d);

  });
}
/* ★ 4A：#te_gap 这一个输入框按方式复用 —— 「每 N 天」走 1~365，「每月某日」走 1~31。
   统一在这里夹一次，免得"显示"与"保存"两处各夹一遍、夹出两个不同的数。 */
function teGapVal(){
  const el = document.querySelector('#te_gap');
  let n = parseInt(el && el.value, 10);
  if (!Number.isFinite(n)) n = 1;
  const hi = (TE && TE.kind === 'month') ? 31 : 365;

}

  kr.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === kind));
  gr.classList.toggle('hide', kind === 'week');
  wr.classList.toggle('hide', kind !== 'week');
  const lead = document.querySelector('#te_gaplead');
  const unit = document.querySelector('#te_gapunit');

  const gEl = document.querySelector('#te_gap');
  if (gEl) gEl.max = kind === 'month' ? '31' : '365';
  const days = (TE && Array.isArray(TE.days)) ? TE.days : [];

/* 把 TE 的当前值刷到界面上（折叠行文案 + 输入框 + 循环派生值 + 日历高亮） */
function teSyncUI(){
  if (!TE) return;
  const dEl = document.querySelector('#te_dtxt');
  if (dEl && document.activeElement !== dEl)
    dEl.value = TE.start ? teDateLabelFromStr(TE.start) + (TE.picks === 2 && TE.end !== TE.start ? '–' + teDateLabelFromStr(TE.end) : '') : '';
  const tEl = document.querySelector('#te_ttxt');
  if (tEl && document.activeElement !== tEl) tEl.value = TE.time || '';
  const val = document.querySelector('#te_val');
  if (val){
    /* ★ 4A：折叠行的文案也要认新形态 —— 走同一个 repRuleText（teRangeLabel 里调它）。
       week 形态的 repeat 是占位 1，所以这里要按 kind 组装规则字段，不能只看数字框。 */
    const kind = (TE && TE.kind === 'week') ? 'week' : ((TE && TE.kind === 'month') ? 'month' : 'days');
    const rn = TE.repeatOn ? (kind === 'week' ? 1 : teGapVal()) : null;
    const tmp = { date: TE.start, dateEnd: TE.picks === 2 ? TE.end : null, time: TE.time, repeat: rn,
                  repeatKind: TE.repeatOn ? kind : null,
                  repeatDays: TE.repeatOn ? TE.days : null,
                  repeatDay: TE.repeatOn ? teGapVal() : null };
    const txt = (TE.start || TE.time) ? teRangeLabel(tmp) : '';
    val.textContent = txt || '未设置';

       只在打开弹层那一次设 disabled，后面任何一次刷新都会被这里重新打开。 */
    const hwLock = sw.dataset.hwlock === '1';
    if (hwLock){

    } else if (!TE.start){
      TE.repeatOn = false; sw.checked = false; sw.disabled = true; rp.classList.add('dis');
    } else {

       原来这两颗按钮只按 TE.start 启停，单日也能点亮。现在按 TE.picks 判，
       并且禁用（不只是变灰，要真的点不动）+ 说清楚为什么。 */
    b.disabled = daily && !twoEnds;
    b.title = (daily && !twoEnds) ? '先在日历上点出两个端点（一个区间）才能选「每天都做」' : '';

    de.textContent = (TE.repeatOn && TE.picks === 2 && TE.end) ? '周期结束于 ' + teDateLabelFromStr(TE.end) : '';

  teRenderCal();

/* ---- 时刻滑轮 ----
   ⚠️ 两条都来自需求 A3 的实现约束：
   ① stopPropagation：根元素上有 wheel 监听（桌面滚轮导航），滑轮内部必须拦下；
   ② 取值时机用 scroll 结束 debounce 80ms，**不靠 click**（手指滑动不触发 click）。 */
let wheelEl = null;
function buildWheel(col, list, cur, onPick){
  const idx = Math.max(0, list.indexOf(cur));
  col.innerHTML = '<div class="wheel-pad"></div>' +
    list.map((v, i) => `<button type="button" class="wheel-it${i === idx ? ' on' : ''}" data-i="${i}">${v}</button>`).join('') +
    '<div class="wheel-pad"></div>';
  const it = col.querySelector('.wheel-it');
  const step = it ? it.getBoundingClientRect().height || 44 : 44;
  /* 关掉滑轮时按"最终位置"取值要用的两样东西（不靠 click：手指滑动不触发 click） */
  col._list = list; col._step = step;
  requestAnimationFrame(() => { col.scrollTop = idx * step; });
  /* ⚠️ 「好」按钮随时会被点，而 scroll 的 debounce 还在路上 ——
     所以这里**不**清 debounce 之外的东西：读值走 colRead()，谁需要谁现算。 */
  let settle = 0;
  const read = () => {
    const i = Math.max(0, Math.min(list.length - 1, Math.round(col.scrollTop / step)));
    col.querySelectorAll('.wheel-it').forEach((n, k) => n.classList.toggle('on', k === i));
    onPick(list[i]);
  };
  col.addEventListener('scroll', () => {
    clearTimeout(settle);
    settle = setTimeout(read, 80);
  }, { passive: true });
  col.querySelectorAll('.wheel-it').forEach((n, i) => {
    n.onclick = () => { col.scrollTo({ top: i * step, behavior: 'smooth' }); onPick(list[i]); };
  });
  /* 桌面滚轮：拦在这里，别让页面翻页（根元素上那个 wheel 监听见需求 A3-2） */
  col.addEventListener('wheel', e => { e.stopPropagation(); }, { passive: true });
  col.addEventListener('touchstart', e => { e.stopPropagation(); }, { passive: true });
}
function colRead(){
  if (!wheelEl) return null;
  const h = wheelEl.querySelector('#wh_h'), m = wheelEl.querySelector('#wh_m');
  if (!h || !m) return null;
  const pick = c => {
    const i = Math.max(0, Math.min(c._list.length - 1, Math.round(c.scrollTop / c._step)));
    return c._list[i];
  };
  return pick(h) + ':' + pick(m);
}
function openWheel(){
  if (!TE || wheelEl) return;
  const H = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0'));
  const M = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, '0'));
  const cur = TE.time && /^\d{2}:\d{2}$/.test(TE.time) ? TE.time : '09:00';
  const wrap = document.createElement('div');
  wrap.className = 'wheel-mask';
  wrap.innerHTML =
    '<div class="wheel-sheet" role="dialog" aria-modal="true" aria-label="选择时刻">' +
      '<div class="wheel-head"><span class="wheel-cap">时刻</span>' +
        '<button type="button" class="wheel-ok" id="wh_ok">确定</button></div>' +
      '<div class="wheel-units"><span>时</span><span>分</span></div>' +
      '<div class="wheel-cols">' +
        '<div class="wheel-col" id="wh_h"></div>' +
        '<div class="wheel-col" id="wh_m"></div>' +
      '</div>' +
    '</div>';
  document.body.appendChild(wrap);
  wheelEl = wrap;
  let hh = cur.slice(0, 2), mm = cur.slice(3);
  const sync = () => {
    TE.time = hh + ':' + mm;
    const t = document.querySelector('#te_ttxt');
    if (t) t.value = TE.time;
    teSyncUI();
  };
  buildWheel(wrap.querySelector('#wh_h'), H, hh, v => { hh = v; sync(); });
  buildWheel(wrap.querySelector('#wh_m'), M, mm, v => { mm = v; sync(); });
  wrap.addEventListener('click', e => { if (e.target === wrap) closeWheel(); });
  wrap.querySelector('#wh_ok').onclick = closeWheel;
  wrap.querySelectorAll('.wheel-col').forEach(c => {
    c.addEventListener('wheel', e => { e.preventDefault(); e.stopPropagation();

function closeWheel(){
  if (!wheelEl) return;
  /* 关之前按**最终位置**取一次值 —— scroll 的 80ms debounce 可能还没跑，
     用户滑完立刻点「好」时若只信 debounce，就会回填上一个值。 */
  const v = colRead();
  wheelEl.remove(); wheelEl = null;
  if (v && TE) TE.time = v;

/* 重建「时间」行（每次打开编辑器都重建，避免上一次的状态串台） */
function teMount(it){

    mode: it.timeMode === 'daily' ? 'daily' : 'once',

    cur: it.date ? new Date(dateFrom(it.date).getFullYear(), dateFrom(it.date).getMonth(), 1)

    repeatOn: !!it.repeat,

  openMask();

  /* ★ v5.0「重新想」（1.11）：做不下去的待办 → 重新种下一条想法。

  const rsBtn = document.getElementById('m_rethink');

  /* 三个下拉改自定义控件后在这里赋值（模板里只剩空的 <div class="sel">）。

  /* ★ 7B：初始值只认分区表里真的有的 k —— 老数据里的 'short' 这种值在这里就是认不出的，

  const zoneInit = (it.zone === 'idea' || validZoneKey(it.zone)) ? it.zone : '';
  makeSel(document.getElementById('m_zone'), zoneOpts, zoneInit);
  makeSel(document.getElementById('m_pri'),
    [['0', '普通'], ['1', '重要（!）'], ['2', '紧急（!!）']], String(it.pri || 0));

  modal.querySelectorAll('#m_tags .pill').forEach(b => b.onclick = () => b.classList.toggle('on'));
  /* ★ v3.50：分区选到「想法」时，时间栏和作业栏整块收起 —— 种子没有死线、也没有作业状态。

     那一刻就得立刻让位。（.hide 在 CSS 里是 display:none !important，压得住 .te-row 的 display。） */
  const hwField = document.getElementById('m_hw') ? document.getElementById('m_hw').closest('.field') : null;

  let parentVal = it.parent || null;
  const parentOf = id => (id ? S.items.find(x => x.id === id) || null : null);
  /* ★ 0B 顺手修的缺陷（实测）：这里原来无条件读 `selValue('m_zone')` ——

     后面的东西全带走（列不关、编辑页不回来）。
     现在把"要不要顺带判分区"交给调用点：挂靠列表的回调传 false，只更新那一行文案。
     ★ 0C 注：挂靠列表已改成"盖一层"，回调跑起来时 `#m_zone` 其实还在；这里仍传 false，
     保持行为不变（分区那一栏由 syncZone 自己管，选择器只负责父标题那一行）。 */
  function renderParentRow(showIdeaToggle){
    const txt = document.getElementById('m_parenttxt');
    const btn = document.getElementById('m_parent');
    const fld = document.getElementById('m_parentfield');

    const p = parentOf(parentVal);
    if (!p){
      parentVal = null;
      txt.textContent = '顶层（不属于谁）';
      btn.classList.add('mutepick');
    } else {
      txt.textContent = p.title;
      btn.classList.remove('mutepick');
    }
  }
  function syncZone(){
    const idea = selValue('m_zone') === 'idea';
    const teRow = document.getElementById('te_row');
    const f = document.getElementById('m_raw') ? document.getElementById('m_raw').closest('.field') : null;
    if (teRow) teRow.classList.toggle('hide', idea);

    if (f) f.querySelector('label').textContent = idea ? '原文（种子记下的那句话）' : '原文';

  }
  {
    const sel = document.getElementById('m_zone');
    if (sel) sel.addEventListener('click', () => setTimeout(syncZone, 0));
  }
  renderParentRow(true);
  document.getElementById('m_parent').onclick = () => openParentPicker(it, isNew, () => parentVal, id => {
    parentVal = id;
    /* 这里**不能**再判分区：此刻 #m_zone 已经不在 DOM 里了（见 renderParentRow 的说明） */
    renderParentRow(false);
  });
  /* ★ 0B.7：作业与循环互斥。让循环对作业生效会牵扯"提交状态"这套语义
     （勾作业会写 hw.status='submitted'，再排一轮就说不清"这一轮算交没交"），
     所以勾了作业就把循环开关禁用掉，并在旁边说明原因。 */
  function syncHwRepeat(){
    const on = !!(document.getElementById('m_hw') && document.getElementById('m_hw').checked);
    const row = document.getElementById('te_rep');
    const sw = document.getElementById('te_sw');
    const note = document.getElementById('te_hwnote');
    if (note) note.classList.toggle('hide', !on);
    if (!sw) return;
    sw.dataset.hwlock = on ? '1' : '';
    if (on){
      /* 老数据（作业 + repeat）要能继续显示：只把开关置灰，不改 it.repeat —— 用户没动过它，
         不该因为打开一次编辑弹层就被悄悄清掉。真要清，是用户取消勾选作业之后的显式动作。 */
      sw.disabled = true;
      if (row) row.classList.add('dis');
    } else {
      teSyncUI();
    }
  }
  document.getElementById('m_hw').onchange = e => {
    document.getElementById('m_hwbox').style.display = e.target.checked ? 'block' : 'none';
    syncHwRepeat();
  };
  /* 打开弹层时也要判一次：老数据（作业 + repeat）打开就得看到循环是锁着的 */
  syncHwRepeat();

  /* ---- 时间行接线（v3.40）----
     顺序很重要：先 teMount() 建状态，再接线（接线里要读 TE），最后 teSyncUI() 刷界面。 */
  teMount(it);
  document.getElementById('te_head').onclick = () => teToggle();
  const gapEl = document.getElementById('te_gap');
  const swEl = document.getElementById('te_sw');
  /* ★ 4A：数字框按形态回填 —— 老数据（每 N 天）仍然显示 N，每月形态显示"几号"。 */
  if (gapEl){
    gapEl.value = String(TE.kind === 'month' ? TE.day : TE.gap);
    gapEl.max = TE.kind === 'month' ? '31' : '365';
  }
  if (swEl) swEl.checked = !!it.repeat;
  if (it.repeat) TE.repeatOn = true;
  /* 日期自由输入：输入即生效 */
  const dTxt = document.getElementById('te_dtxt');
  dTxt.oninput = () => {
    const ds = teParseDate(dTxt.value);
    if (ds){ TE.start = ds; TE.end = ds; TE.picks = 1; teRenderCal(); teSyncUI(); }
  };
  dTxt.onchange = () => { if (!teParseDate(dTxt.value)) teSyncUI(); };
  document.getElementById('te_dclear').onclick = e => {
    e.stopPropagation();
    TE.start = null; TE.end = null; TE.picks = 0;
    if (swEl){ swEl.checked = false; }
    teSyncUI();
  };
  /* 时刻自由输入：输入即生效；失焦时的值不回退（允许只写时刻、不写日期） */
  const tTxt = document.getElementById('te_ttxt');
  tTxt.oninput = () => {
    const v = teParseTime(tTxt.value);
    if (v){ TE.time = v; }
    else if (!tTxt.value.trim()){ TE.time = null; }
    teSyncUI();
  };
  tTxt.onchange = () => { const v = teParseTime(tTxt.value); TE.time = v; teSyncUI(); };
  document.getElementById('te_tclear').onclick = e => { e.stopPropagation(); TE.time = null; teSyncUI(); };
  /* 点输入框弹滑轮（需求 A3b）；键盘仍可直接打字 */
  tTxt.onpointerdown = () => { setTimeout(openWheel, 0); };
  if (swEl) swEl.onchange = () => {
    TE.repeatOn = swEl.checked;
    if (!swEl.checked && gapEl) gapEl.value = String(Math.max(1, parseInt(gapEl.value, 10) || 1));
    teSyncUI();
  };
  if (gapEl) gapEl.oninput = () => {
    /* ★ 4A：上限按形态走 —— 「每 N 天」到 365，「每月某日」只到 31 */
    const hi = TE.kind === 'month' ? 31 : 365;
    const n = Math.max(1, Math.min(hi, parseInt(gapEl.value, 10) || 1));
    if (String(n) !== gapEl.value && gapEl.value !== '') gapEl.value = String(n);
    teSyncUI();
  };
  /* ★ 4A：三种循环方式的切换。切到「每周几」就把数字框让给星期键；

  const krEl = document.getElementById('te_kindrow');
  if (krEl) krEl.querySelectorAll('button').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const raw = b.dataset.k;
      const want = raw === 'week' ? 'week' : (raw === 'month' ? 'month' : 'days');
      if (want === TE.kind) return;
      if (TE.kind === 'days') TE.gap = teGapVal();
      else if (TE.kind === 'month') TE.day = teGapVal();
      TE.kind = want;
      if (gapEl) gapEl.value = String(want === 'month' ? (TE.day || 1) : (TE.gap || 1));

    };
  });
  /* 星期几：可多选，但**至少留一个** —— 最后一个被点掉时回填"今天"，

  const wkEl = document.getElementById('te_wkrow');
  if (wkEl) wkEl.querySelectorAll('button').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const d = +b.dataset.d;
      const i = TE.days.indexOf(d);
      if (i >= 0) TE.days.splice(i, 1); else TE.days.push(d);
      if (!TE.days.length) TE.days = [new Date().getDay()];
      TE.days.sort((x, y) => x - y);
      teSyncUI();
    };

      teSyncUI();

  teSyncUI();

  document.getElementById('m_cancel').onclick = closeModal;
  /* ★ 5F：编辑弹层的「删除」以前直接 `remove(it)` —— 删一条**有子任务**的父条目时，

     现在接上统一入口 removeAskAndCommit（有子才问，无子照旧直接删）。
     顺序（自己判断，理由写在回报里）：**先 closeModal() 再问** ——
     确认条与弹层抢同一块地方，弹层还开着时它会被弹层/遮罩压住看不见；
     先关（退场 170ms，与确认条的 8s 相比无感）再弹，确认条才真的看得见、点得着。
     el 传 null：这里唯一的作用是给退场动画找行，弹层关掉后那一行本来就被挡住了，
     remove() 拿不到行时走同步落库分支，行为与"清单卡 ✕ 在流畅模式下"完全一致。 */
  document.getElementById('m_del').onclick = () => { closeModal(); if (!isNew) removeAskAndCommit(it, null); };
  document.getElementById('m_save').onclick = () => {
    const titleVal = document.getElementById('m_title').value.trim();
    const priVal = +selValue('m_pri') || 0;
    const t = teRead();
    /* ★ 2A：改标题之前先留一份原样 —— 纠错层的"常用词"采集要拿它做差异
       （用户把「豆付」改成「豆腐」两次 → 问一次要不要收进常用词）。 */
    const titleBefore = String(it.title || '');
    const zoneBefore = it.zone;
    it.title = titleVal || it.title;
    /* ★ 7B：保存时改分区 = **一次教学信号**（用户把 AI 猜的分区改掉了，正是本卡点名的第二个信号）。
       口径见 zoneTeachFromEditor：改回想法/未分组不算（那不是"这类内容归那栏"）。 */
    it.zone = selValue('m_zone');
    it.zoneBy = 'user';
    it.tags = [...modal.querySelectorAll('#m_tags .pill.on')].map(b => b.dataset.t);
    /* ★ v3.40 核心修复：日期/时刻/循环只由结构化控件写入。
       v3.39 及以前这里拿原文重解析的结果覆盖 date/dateEnd/time/repeat，
       而原文栏一改就重解析 —— "标题没改、只改日期"这条路必然被覆盖回去，
       时间怎么点都改不动（旧 bug 的根因）。原文栏现在是只读备注，不再参与写入。
       ⚠️ 「原文」保存时不覆盖：它记的就是用户最初粘贴/语音进来的那句话（需求 A5）。 */
    it.date = t.date; it.dateEnd = t.dateEnd; it.time = t.time;
    it.monthOnly = false;
    it.timeMode = t.mode;
    /* ★ 4A：循环按三形态写回存档。
       · 没勾/没日期：repeat 与两个新字段**一起清掉**（不留半个形状 ——
         否则"取消循环"之后它还会被当成每周循环）。
       · 每 N 天：只写数字 repeat，形状与改动前完全一致（老数据这条路的回归红线）。
       · 每周几 / 每月某日：repeat 写 1 当占位，再挂各自那两个字段。 */
    const repOn = !!(swEl && swEl.checked && t.date);
    if (!repOn){
      it.repeat = null;
      delete it.repeatKind; delete it.repeatDays; delete it.repeatDay;
    } else if (TE.kind === 'week'){
      it.repeat = 1;
      it.repeatKind = 'week';
      it.repeatDays = TE.days.length ? TE.days.slice().sort((a, b) => a - b) : [new Date().getDay()];
      delete it.repeatDay;
    } else if (TE.kind === 'month'){
      it.repeat = 1;
      it.repeatKind = 'month';
      it.repeatDay = teGapVal();
      delete it.repeatDays;
    } else {
      it.repeat = teGapVal();
      delete it.repeatKind; delete it.repeatDays; delete it.repeatDay;
    }
    it.pri = priVal;
    /* ★ v3.50：分区选「想法」＝把它变成种子，选别处＝变回待办。两个方向都要管 ——
       否则会出两种"看着不对"：待办改成想法后渲染不出时间轴（kind 还是 task），
       种子改回短期后还带着 sparks 和「种子」chip。kind 由分区推导，是唯一的真相源。 */
    if (it.zone === 'idea'){

         合并之后紧接着 openEdit 的场景最容易被看见：合并出的种子一保存就多出一模一样的一步。 */
      if (!Array.isArray(it.suggest)) it.suggest = [];

      if (it.aiUse === undefined) it.aiUse = null;

         造出来的形状必须一模一样，否则一条还挂着待办父、一条没有，同一个动作两种结果。

      it.parent = null;

      it.parent = parentVal;

    if (document.getElementById('m_hw').checked){

    /* ★ 2A 纠错层：用户把某个词改对了 → 记一次账；同一个词第 2 次就**问一次**

   这样编辑页里看到的标题跟落库结果一致（以前只跑 parseSmart，用户看到的是识别原文的错字）。 */
function openEditNew(rawText, preset){
  const p = preset || parseSmart(rawText || '');
  const it = { id: uid(), raw: (rawText || '').trim(), title: p.title || (rawText || '').trim(),
    date: p.date, dateEnd: p.dateEnd, monthOnly: p.monthOnly, time: p.time,
    zone: p.zone || 'short', tags: p.tags || [], done: false, doneAt: null,
    createdAt: Date.now(), hw: null, repeat: p.repeat || null, pri: p.pri || 0, timeMode: 'once',
    parent: null, goal: !!p.goal, dayParts: p.dayParts || null,
    heard: p.heard || null };   // AI 纠错后的整句（调用方塞在 preset 上，见 voiceRight）
  applyRepeatFields(it, p);      // ★ 4A：新循环形态（每 N 天的老形状一个字段都不多写）

  if (p.steps && p.steps.length >= 2){

/* ★ 0A.4：把 `A> B> C` 解析出来的祖先链落成真实的父子关系（复用 findOrCreateGoal 自动建目标卡）。
   抽成一个函数是因为粘贴导入、语音编辑这两条要补的路写的是同一套东西 —— 抄两遍迟早漂开。
   addItem 里那份等价逻辑**保持原样不动**：本卡只补缺口，不重构既有路径（红线 4）。 */
function hangPath(it, p, zone){
  if (!it || !p || !p.path || !p.path.length) return;
  if (p.zone === 'idea') return;                 // 想法不挂待办树
  let prev = null;
  for (const seg of p.path){
    const node = findOrCreateGoal(seg, prev ? prev.zone : (zone || 'long'));
    if (!node) break;
    if (prev && node.id !== prev.id) node.parent = prev.id;
    if (node.goal !== true) node.goal = true;

const SEC = { '长期':'long', '短期':'short', '已完成':'short', '完成':'short' };   /* v5.0：删掉「考虑」——该分区已并入想法 */
function importText(txt, base){
  const lines = txt.split(/\r?\n/);
  let zone = 'long', n = 0, sawSection = false;
  /* BASEDAY 是模块级状态，today0() 到处都在读它。中途任何一处抛错都必须复位 ——
     否则之后所有「今天 / 周四 / 17号」都会按那个旧基准日解析，静默错位、极难排查。 */
  BASEDAY = base || null;
  try {
    for (const raw of lines){
      const line = raw.trim();
      if (!line) continue;
      const sec = line.match(/^[\-—–]{2,}\s*(.+?)\s*[\-—–]{2,}$/);
      if (sec){ zone = SEC[sec[1].trim()] || zone; sawSection = true; continue; }
      if (!/^[☐☑☒□√✓✗×]/.test(line)) continue;
      const done = /^[☑☒√✓✗×]/.test(line);
      const p = parseSmart(line);
      if (!p.title) continue;
      const it = {
        id: uid(), raw: line, title: p.title,
        date: p.date, dateEnd: p.dateEnd, monthOnly: p.monthOnly, time: p.time,
        zone: sawSection ? zone : p.zone,
        tags: p.tags, done, doneAt: done ? Date.now() : null,
        createdAt: Date.now() + n, hw: null, repeat: p.repeat || null, pri: p.pri || 0,
        parent: null, goal: !!p.goal
      };
      applyRepeatFields(it, p);   // ★ 4A：粘贴导入也认「每周三 / 每月1号」
      /* ★ 0A.4：粘贴导入**逐行**都要消费 `p.path` —— 以前这条路的父级前缀被整段吃掉，
         「论文> 查文献」导进来只是两条互不相干的扁平条目。 */
      hangPath(it, p, zone);
      if (/作业/.test(p.title)){
        it.hw = { course: guessCourse(p.title), detail:'', channel: guessChannel(line), naming: guessNaming(line),
                  status: done ? 'submitted' : 'todo', submittedAt: done ? ymd(new Date()) : null };
        splitHw(it, p);
      }
      S.items.push(it); n++;
    }
  } finally {
    BASEDAY = null;
  }
  /* ★ 0A.1：导入是"外部数据进来"的路，父级可能指向本次没导入的条目（比如分段粘进来的）——
     在这里收口一次，不让悬空 parent 落进存档。 */
  sanitizeParents();
  save(); refresh();
  return n;
}

          if (Array.isArray(o.setOpen)) S.setOpen = o.setOpen.filter(x => typeof x === 'string');
          if (o.aiMode === 'off' || o.aiMode === 'title' || o.aiMode === 'full') S.aiMode = o.aiMode;
          if (typeof o.aiBase === 'string') S.aiBase = o.aiBase;
          if (typeof o.aiModel === 'string') S.aiModel = o.aiModel;
          /* ★ 2A：常用词表与上次焦点也认（配额字段 aiUse 已拆掉，这里不再读它 ——
             老备份里的 aiUse 自然被忽略，不影响其它字段恢复）。 */
          S.hotwords = sanitizeHotwords(o.hotwords);
          S.hotwordSeen = sanitizeHotwordSeen(o.hotwordSeen);
          if (typeof o.aiAnchor === 'string' && o.aiAnchor.trim()) S.aiAnchor = o.aiAnchor.trim().slice(0, 60);
          /* ★ v5.1.2：日期显示口径 + 震动档位也要跟着备份回来（否则同一份备份恢复两次结果不同） */
          if (o.dateShow && typeof o.dateShow === 'object'){
            S.dateShow = { y: o.dateShow.y !== false, m: o.dateShow.m !== false, d: o.dateShow.d !== false };
          }
          if (['off', 'low', 'std', 'high'].includes(o.haptic)) S.haptic = o.haptic;
          /* ★ 0B.2：勾完最后一个子任务是否自动完成父任务 —— 也要跟着备份回来，
             否则同一份备份恢复两次结果不同 */
          if (typeof o.autoDoneParent === 'boolean') S.autoDoneParent = o.autoDoneParent;
          /* ★ 阶段1 提醒：总开关跟着备份回来（否则同一份备份恢复两次结果不同） */
          if (typeof o.notify === 'boolean') S.notify = o.notify;
          /* ★ 0A.1：备份里的 parent 同样可能悬空或成环（备份可能来自旧版本、也可能被手改过）——
             落盘前收口，判据与启动加载完全一致。 */
          sanitizeParents();
          /* ★ 7B：备份里指向不存在分区的折叠态也收掉（同一份备份恢复两次结果必须相同） */
          zonePruneFolded();
          save(); applyHelp(); refresh();
          /* ★ 阶段1 提醒：整批 id 都换了 —— 必须做一次全量对账，把上一批的排期撤干净、
             按新数据重排（这是"旧排期不残留"的唯一出口）。 */
          notifyReconcile();
          toast('已从备份恢复 ' + S.items.length + ' 条');
        });
      return;
    }
    /* 不是备份 json（多半是直接拖进来的一整块笔记文本） */
    const n = importText(String(r.result));
    toast(n ? '导入了 ' + n + ' 条' : '这个文件里没认出可导入的条目（备份请拖 json）');
  };
  r.readAsText(f);
});

/* ---------------- 导航 / 主题 / 吸顶 ---------------- */
/* 底部导航（v3）：3 个 .tab 页签等分 + 中轴上方悬浮录入键（录入键有自己的长按骨架，
   不在这儿处理）。切页不靠整页重建的副作用，而是显式改 S.view 后 refresh()；
   refresh 每帧同步 aria-current（见 refresh 内 .tab 段）。录入界面不是页签，
   三个页签都不标当前（同样在 refresh 内处理）。 */
const tabbar = document.getElementById('tabbar');
tabbar.addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;   // 录入键也在 tabbar 里但不是 .tab，交给它的长按骨架
  const v = b.dataset.view;
  /* ★ 真 bug（用户实测："点外观按钮会跳转到统计页"）：外观键为了复用底栏样式也挂着 .tab，
     但它**不是一页**、没有 data-view → 原来会把 S.view 写成 undefined 再 refresh()，
     于是界面跳走。凡是带 .tab 但不是页面切换的按钮，一律在这里退出。
     ⚠️ v3.50 起外观键已从底栏撤走（想法键顶替了它的位置），这条守卫仍然保留 ——
     它是"带 .tab 却没有页"这类按钮的通用护栏，不是只为外观键写的。 */
  if (!v) return;
  /* ★ 0G：在统计子页里点「统计」= 回统计首页。原来这行 `if (v === S.view) return;` 把
     "我在子页、想回首页"也当成"我已经在这一页了"直接挡掉 —— 子页根本出不去（用户实测：
     "在子页直接点底栏统计能不能回首页？"）。子页不是一页，它只是统计页里的一屏，
     所以这里必须放行给 goView（它会清掉 statPage 再重画首页）。 */
  if (v === S.view && !(v === 'stat' && statPage)) return;
  /* ★ 0G：从统计子页回首页是"同一个视图里的另一屏"，要带一次入场动画 ——
     显式点名 anim（不点名时 goView 走的是"同页重画不播动画"那条路，用户看到的就是"没动画"）。 */
  goView(v, v === S.view ? { anim: true } : undefined);
  if (v === 'list'){
    const sec = document.getElementById('view');
    if (sec) window.scrollTo({ top: sec.offsetTop - 132, behavior: 'smooth' });
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });   // 统计 / 设置页头都没有 hero，直接回顶
  }
});

/* 底栏轮廓：按实测栏宽算出「被圆钮撑起并包住」的 SVG 路径，写进 #barClipPath
   （玻璃层与水波层共用同一段 d，所以两者永远严丝合缝）。
   形状参数（栏高48/圆径56/包边6/最大包边20/过渡凹角16/两端圆角24）都是 .tabbar 上的
   CSS 变量；这里只做几何推导，垂直尺寸固定 px，只有水平布局随栏宽自适应。 */
/* shapeState 的三个自由度：
   btnD  圆钮直径 —— 本轮起恒定 56（用户明确要求长按不放大圆钮）；
   btnCx bulge 圆心相对栏体中轴的水平偏移 —— 跟手拖拽时逐帧改写，让"包裹按钮的那一圈
         跟着手指滑走，它经过的地方被撑大、走后复原"；
   wrap  包边宽 —— null 表示跟随 CSS 变量 --wrap（常态 6px）；长按起手时被 swellRing
         临时推大到 --wrap-max（20px），也就是"栏体自己鼓起一圈水环再收回"。 */
const shapeState = { btnD: 56, btnCx: 0, wrap: null, _raf: 0, _rafRing: 0 };
function buildBarShape(opts){
  const cap = document.getElementById('capsule');
  if(!cap) return;
  const cs = getComputedStyle(cap);
  const num = (n, fb) => { const v = parseFloat(cs.getPropertyValue(n)); return isNaN(v) ? fb : v; };
  const barH    = num('--bar-h', 48);      // 栏高（水平直边那一段的高度）
  const btnD    = shapeState.btnD || num('--btn-d', 56);
  const wrapRest= num('--wrap', 6);        // 常态包边宽
  const wrapMax = num('--wrap-max', 20);   // 水环膨胀到的最大包边宽
  const wrap    = (shapeState.wrap == null) ? wrapRest : shapeState.wrap;
  const r       = num('--tr-r', 16);       // 过渡凹角半径
  const endR    = num('--end-r', 24);      // 两端圆角半径
  const over    = num('--over', 18);       // 玻璃层的 overscan
  const R = btnD / 2 + wrap;               // 包边圆半径 = 圆钮半径 + 包边宽
  const W = Math.max(1, Math.round(cap.getBoundingClientRect().width));
  /* ── 三条不变量（改这里之前必须先读）────────────────────────────────────────
     ① cyTop（栏体中心距 capsule 顶的距离）是**常量** = 圆钮半径 + 最大包边。
        「常量」这三个字就是用户那句"你不要让它直接往上移，让它保持在原位"的实现：
        圆钮、页签、栏肉的水平直边全都挂在 cyTop 上，水环怎么鼓都不会带动它们。
     ② capsule 的高度也只跟常态有关：cyTop + 常态包边圆半径。于是**常态下轮廓的最低点
        正好落在 capsule 的底边**（和改造前完全一致，栏体贴着底边、底下不留空）。
        水环鼓到最大时轮廓会往下探 (wrapMax − wrapRest) = 14px —— 那 14px 由 .bar-glass
        的 overscan（--over:18px）兜住，所以既不会被裁、也不需要挪动 capsule。
     ③ 多出来的余量全部记在**顶部**：.tabbar 是 bottom:0 锚定的，capsule 长高只会向上长，
        底边不动 → 屏幕上看到的就是"栏体原地鼓起来"。 */
  const cyTop = btnD / 2 + wrapMax;
  const barTop = cyTop - barH / 2, barBot = cyTop + barH / 2; // 水平直边的上下 y（常量）
  const H = cyTop + (btnD / 2 + wrapRest);                    // capsule 高度（常量）
  // 凹角过渡几何：过渡圆(r)与包边圆(R)外切（圆心距 R+r）且与直边相切 → 推出切点偏移
  const dx = Math.sqrt(Math.max(0, (R + r) * (R + r) - (barH / 2 + r) * (barH / 2 + r)));
  const fx = dx * R / (R + r);              // 过渡弧与包边圆切点的水平偏移
  const fy = r * (R - barH / 2) / (R + r);  // 同切点的竖直偏移（相对直边向上）
  /* bulge 圆心：常态落在栏体中轴；跟手时由 shapeState.btnCx 给一个水平偏移。
     必须夹住范围：偏移过大时过渡凹角的切点会越过两端圆角、路径自交。
     安全区间 = 中轴两侧各留出 (W/2 - endR - dx) 的余量。 */
  const maxCx = Math.max(0, W / 2 - endR - dx);
  const cx = W / 2 + Math.max(-maxCx, Math.min(maxCx, shapeState.btnCx || 0));
  const x1 = cx - dx, x2 = cx + dx;
  /* 走线（顺时针）：上直边 → 左过渡(凹,sweep0) → 上包边圆弧 → 右过渡(凹) → 上直边 →
     右端半圆 → 下直边 → 右过渡(凹) → 下包边圆弧 → 左过渡(凹) → 左端半圆 → 闭合。
     两段 r 的过渡必须是凹角（sweep=0），直边到包边圆才液体般柔化、不生硬。 */
  const d = [
    'M', endR, barTop,
    'L', x1.toFixed(2), barTop,
    'A', r, r, 0, 0, 0, (cx - fx).toFixed(2), (barTop - fy).toFixed(2),
    'A', R, R, 0, 0, 1, (cx + fx).toFixed(2), (barTop - fy).toFixed(2),
    'A', r, r, 0, 0, 0, x2.toFixed(2), barTop,
    'L', (W - endR).toFixed(2), barTop,
    'A', endR, endR, 0, 0, 1, (W - endR).toFixed(2), barBot,
    'L', x2.toFixed(2), barBot,
    'A', r, r, 0, 0, 0, (cx + fx).toFixed(2), (barBot + fy).toFixed(2),
    'A', R, R, 0, 0, 1, (cx - fx).toFixed(2), (barBot + fy).toFixed(2),
    'A', r, r, 0, 0, 0, x1.toFixed(2), barBot,
    'L', endR, barBot,
    'A', endR, endR, 0, 0, 1, endR, barTop,
    'Z'
  ].join(' ');
  cap.style.height = H + 'px';
  /* 把两个"钉住位置"的值写给 CSS：圆钮的垂直位置、页签条/栏内文字的顶部。
     它们都只依赖常量，所以跟手拖拽与水环膨胀期间一动不动。 */
  cap.style.setProperty('--cy-top', cyTop + 'px');
  cap.style.setProperty('--bar-top', barTop + 'px');
  const strip = cap.querySelector('.tab-strip');
  if(strip){ strip.style.top = barTop + 'px'; strip.style.height = barH + 'px'; }
  /* 裁切路径：同一段 d 同时给玻璃层和水波层用。两层都带 inset:calc(-1 * var(--over))，
     所以路径整体平移 (over, over) 抵消 —— 平移量按变量写，不硬编码。 */
  const cp = document.getElementById('barClipPath');
  if(cp){
    cp.setAttribute('d', d);
    cp.setAttribute('transform', 'translate(' + over + ',' + over + ')');
  }
  /* 折射置换图（边缘加权）：初始化 / resize 各生成一次；水环/跟手动画期间 skipMap
     （见 tweenShape / swellRing），结束时再补一次。每帧重算距离变换太贵（约 4~12ms）。 */
  if (!(opts && opts.skipMap)) updateDisplacement(d, W, H, over);
}
buildBarShape();
/* 屏宽变化（旋转 / 分屏 / 字号）时重算轮廓；防抖即可，不必每帧 */
let _barT = 0;
window.addEventListener('resize', () => { clearTimeout(_barT); _barT = setTimeout(buildBarShape, 120); });
/* 布局彻底稳定后再算一次，避免首帧量到的宽度不准导致轮廓错位 */
window.addEventListener('load', buildBarShape);

/* A1.1 边缘加权置换图：用 canvas 生成一张 PNG（R=X 位移 / G=Y 位移 / 128=中性），内联进
   <feImage> 喂给 feDisplacementMap。算法：Path2D 填充 → 掩膜 → 两趟 Chamfer 距离变换 →
   梯度求外法线 → 仅贴边 bezel 宽写入沿法线的位移（中间 = 128 中性、不糊）。
   性能：1× 分辨率（cw×ch ≈ 406×116 ≈ 4.7 万像素），距离变换 O(N) 极快（<12ms）；
   只在 init / resize（防抖）/ 长按落点 跑。canvas 或 Path2D 不可用时返回 null → 走旧噪声兜底。 */
function buildDisplacementMap(d, W, H, over){
  try {
    /* pad 必须等于玻璃层的 overscan（--over），否则置换图与可见轮廓会错位一整圈。
       画布 = 玻璃层的盒子尺寸，轮廓按同样距离平移后画进去。 */
    const pad = (typeof over === 'number' && over > 0) ? over : 18;
    const cw = W + pad * 2, ch = H + pad * 2;
    const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d'); if (!ctx) return null;
    ctx.fillStyle = 'rgb(128,128,128)'; ctx.fillRect(0, 0, cw, ch);   // 中性 = 不位移
    const p = new Path2D(d);
    ctx.translate(pad, pad);                 // 与 #barClipPath 的 translate(over,over) 对齐
    ctx.fillStyle = 'rgb(255,0,0)'; ctx.fill(p);
    const data = ctx.getImageData(0, 0, cw, ch).data, N = cw * ch;
    const mask = new Uint8Array(N);
    for (let i = 0; i < N; i++) mask[i] = data[i * 4] > 200 ? 1 : 0;  // 红=255 → 内部
    const INF = 1e9, SQ = 1.41421356;
    const A = new Float32Array(N).fill(INF), B = new Float32Array(N).fill(INF);
    for (let i = 0; i < N; i++){ if (!mask[i]) A[i] = 0; else B[i] = 0; }
    const fwd = (a) => { for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++){
      const i = y * cw + x; let v = a[i];
      if (x > 0)    v = Math.min(v, a[i - 1] + 1);
      if (y > 0)    v = Math.min(v, a[i - cw] + 1);
      if (x > 0 && y > 0)       v = Math.min(v, a[i - cw - 1] + SQ);
      if (x < cw - 1 && y > 0)  v = Math.min(v, a[i - cw + 1] + SQ);
      a[i] = v; } };
    const bwd = (a) => { for (let y = ch - 1; y >= 0; y--) for (let x = cw - 1; x >= 0; x--){
      const i = y * cw + x; let v = a[i];
      if (x < cw - 1)          v = Math.min(v, a[i + 1] + 1);
      if (y < ch - 1)          v = Math.min(v, a[i + cw] + 1);
      if (x < cw - 1 && y < ch - 1) v = Math.min(v, a[i + cw + 1] + SQ);
      if (x > 0 && y < ch - 1) v = Math.min(v, a[i + cw - 1] + SQ);
      a[i] = v; } };
    fwd(A); bwd(A); fwd(B); bwd(B);
    const cd = new Float32Array(N);          // 到轮廓的双向距离
    for (let i = 0; i < N; i++) cd[i] = A[i] > B[i] ? A[i] : B[i];
    const bezel = 13, out = ctx.createImageData(cw, ch), od = out.data;
    for (let y = 0; y < ch; y++) for (let x = 0; x < cw; x++){
      const i = y * cw + x; let Rc = 128, Gc = 128;
      const dist = cd[i];
      if (dist < bezel){
        const t = 1 - dist / bezel, mag = t * t * (3 - 2 * t);   // smoothstep：贴边最强
        const xl = x > 0 ? cd[i - 1] : dist, xr = x < cw - 1 ? cd[i + 1] : dist;
        const yu = y > 0 ? cd[i - cw] : dist, yd = y < ch - 1 ? cd[i + cw] : dist;
        let nx = xl - xr, ny = yu - yd;                          // 外法线（指向轮廓外）
        const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
        Rc = 128 + nx * mag * 127; Gc = 128 + ny * mag * 127;
      }
      const j = i * 4;
      od[j]     = Rc < 0 ? 0 : Rc > 255 ? 255 : Rc;
      od[j + 1] = Gc < 0 ? 0 : Gc > 255 ? 255 : Gc;
      od[j + 2] = 128; od[j + 3] = 255;
    }
    ctx.putImageData(out, 0, 0);
    return { url: cv.toDataURL('image/png'), cw, ch };
  } catch (e){ return null; }
}
/* 把置换图写进 <feImage> 并切到 map；失败（无 canvas）则保留 feTurbulence 噪声兜底（in2=smoothed）。 */
function updateDisplacement(d, W, H, over){
  const feImg = document.getElementById('barLiquidMap');
  /* 三通道色散：R/G/B 三个 feDisplacementMap 都要切到生成好的置换图（#map）。
     拿不到三个里的任何一个就整体放弃，维持 feTurbulence 噪声兜底 —— 三个通道
     用不同的图源会彩虹乱飞，比"没有色散"难看得多。 */
  const disps = ['barDispR', 'barDispG', 'barDispB'].map(id => document.getElementById(id));
  if (!feImg || disps.some(x => !x)) return;
  const res = buildDisplacementMap(d, W, H, over);
  if (!res) return;                       // 兜底：维持旧噪声滤镜不变
  feImg.setAttribute('width', res.cw); feImg.setAttribute('height', res.ch);
  feImg.setAttribute('href', res.url);
  feImg.setAttributeNS('http://www.w3.org/1999/xlink', 'href', res.url);
  disps.forEach(disp => { if (disp.getAttribute('in2') !== 'map') disp.setAttribute('in2', 'map'); });
  if (voiceActive) liquidSource('noise');   // 长按态里重建过图也仍走"在动的噪声"
}
/* 折射位移的来源（v2.5）：'map' = JS 生成的静态置换图（平常那种"贴着轮廓的厚边"），
   'noise' = 上面那张**频率在呼吸**的 feTurbulence（长按态专用：边缘折射像水一样流动）。
   长按切换它的理由：真正的"波光粼粼"必须让位移图本身随时间变；把静态图换成动噪声是最省的
   路子（每帧重算距离变换是不可能的），而且仍在同一条 backdrop-filter 链里。 */
function liquidSource(kind){
  const want = kind === 'noise' ? 'smoothed' : 'map';
  /* 三通道统一切换（都用同一张图源）：给 B 通道单独换图源会让彩虹乱飞，
     色散已经由三者的 scale 差（40/36/32）保证。 */
  ['barDispR', 'barDispG', 'barDispB'].forEach((id) => {
    const n = document.getElementById(id);
    if (!n) return;
    if (n.getAttribute('in2') !== want) n.setAttribute('in2', want);
  });
}
/* 逐帧插值轮廓参数（btnD 直径 / btnCx 水平位置）并重建 d（三份路径）；动画期间 skipMap，
   落点才补一次置换图（距离变换太贵，不能每帧跑）。
   btnCx 的插值让"松手后 bulge 滑回中轴"是一段动画而不是瞬间弹回；onDone 用来在落点
   摘掉 .dragging、把折射层恢复出来。 */
function tweenShape(target, dur, targetCx, onDone){
  const sD = shapeState.btnD, sCx = shapeState.btnCx;
  const tCx = (typeof targetCx === 'number') ? targetCx : sCx;
  const t0 = performance.now();
  cancelAnimationFrame(shapeState._raf);
  (function step(now){
    let k = Math.min(1, (now - t0) / dur);

      const t = (k - SWELL_OUT_MS) / SWELL_IN_MS;
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOutQuad
      shapeState.wrap = wrapMax * (1 - e);
      buildBarShape({ skipMap: true });
      shapeState._rafRing = requestAnimationFrame(step);
    } else {                                                  // 落点：交还给 CSS 变量 + 重建置换图
      shapeState.wrap = null;
      buildBarShape();
    }
  })(t0);
}
/* 圆钮在手势态下跟手：**不再放大**，只随手指水平位移，并且把栏体的 bulge 一起带走 ——
   这就是用户要的效果："左右滑的时候，导航栏被撑大的部分也要随着它左右滑动，并且有相应的
   动画效果"。圆钮 / 水波中心 / 栏体 bulge 三者共用同一个偏移量 off，所以永远重合，
   不会出现"按钮走了包边还在原地"的穿帮。
   跟手期间给胶囊挂 .dragging：置换图是按"水环在中轴"生成一次的，跟不上移动中的轮廓，
   硬留着会在栏体中间画出一道假的弯折。 */
const FAB_TRAVEL = 92;              // bulge 最大水平行程（buildBarShape 里还会按栏宽再夹一次）
/* 变速跟手（用户要求：起步容易、越往左右滑越慢、快到头时几乎不动）。
   手指位移 dx → UI 位移走 tanh 饱和曲线，而不是线性：
     v3.2：K 从 70 收到 **110** —— 起步增益 = FAB_TRAVEL/K ≈ 0.84，头 40px 几乎 1:1 跟手
     （用户："按钮跟我手指头是脱离的，有延迟"），之后增益单调下降：
     dx=70 用掉 53%，dx=140 用掉 84%，dx=210 用掉 95%。
   **永远逼近但到不了 FAB_TRAVEL** —— 这就是"手指走的距离一样，UI 走的越来越少"。
   附带好处：不需要额外 clamp 也不会出界，两端导数连续（不会在边界"咔"一下）。 */
function fabTravel(dx){ return FAB_TRAVEL * Math.tanh(dx / 110); }
/* ---- 两个词的淡出（v2.5 重做）----
   用户最新要求：①"不要让它们变动，正常固定在一个合适的距离即可"；②"往哪边滑时，那边的
   字体就开始变淡；如果滑到那个字体上，那个字体直接消失"。
   所以：**位置完全固定**（间距只由 CSS 的 28px 内边距决定，JS 不碰 transform），只改透明度。
   淡出量按"圆钮逼近该词的程度"算：从词的内侧边缘再往前 44px 开始变淡，压到字上即 0。
   词的真实矩形用 Range 量（span 是 flex:1，量它自己得到的是半条栏，不是字的宽度）。 */
const WD = { l: null, r: null };                  // 左词的右缘 / 右词的左缘（胶囊坐标系）
function measureWords(){
  const bl = document.querySelector('.bar-words .bl');
  const br = document.querySelector('.bar-words .br');
  if (!bl || !br || !capsuleEl){ WD.l = null; WD.r = null; return; }
  const cr = capsuleEl.getBoundingClientRect();
  const rect = (el) => { const rg = document.createRange(); rg.selectNodeContents(el);
    const r = rg.getBoundingClientRect(); return { left: r.left - cr.left, right: r.right - cr.left }; };
  WD.l = rect(bl).right;    // 左词的**右缘**（被逼近的那一侧）
  WD.r = rect(br).left;     // 右词的**左缘**
}
const WORD_BASE = .62, WORD_FADE = 44;            // 常态透明度 / 开始淡出的逼近距离
function fadeWords(off){
  if (!capsuleEl || WD.l === null || WD.r === null) return;
  const capW = capsuleEl.getBoundingClientRect().width;
  const fr = (shapeState.btnD || 56) / 2;
  const cx = capW / 2 + off;                      // 圆钮中心（胶囊坐标系）
  const tL = Math.max(0, Math.min(1, 1 - ((cx - fr) - WD.l) / WORD_FADE));
  const tR = Math.max(0, Math.min(1, 1 - (WD.r - (cx + fr)) / WORD_FADE));
  capsuleEl.style.setProperty('--wl-o', (WORD_BASE * (1 - tL)).toFixed(3));
  capsuleEl.style.setProperty('--wr-o', (WORD_BASE * (1 - tR)).toFixed(3));
}
/* v2.5：轮廓与按钮**同一帧**更新。
   用户反馈"左右滑动时黑色的圆钮会有一定延迟才能跟上这个框"——真因不是逻辑反了，而是
   pointermove 一帧内可能派发多次，每次都要重算 SVG 路径（还带一份距离变换），轮廓就比
   按钮慢半拍。这里把跟手计算收敛到**每帧一次**（取最后一次位移）：按钮的 transform 与
   轮廓的 path 写在同一个回调里，绝不可能一先一后。 */
let fabDxPending = 0, fabRaf = 0;
function setFabVoice(dx){
  fabDxPending = dx;
  /* ★ v3.5：`.dragging` 必须**先挂**再排帧 —— v3.4 的顺序是"先写位移、后挂类"，
     于是跟手的**第一帧**仍带着 .fab 那条 transform 过渡（180ms），一上手就能感觉到迟滞。
     先挂类 = 第一帧起就没有过渡。 */
  if (capsuleEl) capsuleEl.classList.add('dragging');
  if (fabRaf) return;
  fabRaf = requestAnimationFrame(() => { fabRaf = 0; applyFabVoice(fabDxPending); });
}
function applyFabVoice(dx){
  const off = fabTravel(dx);
  fab.style.transform = 'translate(-50%,-50%) translateX(' + off.toFixed(2) + 'px)';
  if (capsuleEl){
    capsuleEl.style.setProperty('--fabdx', off + 'px');
    /* 流光的强度按 |off| / SAFE_ZONE 渐变（0→1）→ **跟手就亮**，
       不必等越界之后才"啪"地一下出现（用户要"滑到左边，左边就变成流光"）。
       方向语义不变：安全范围内仍不算方向、松手照样取消；这里只管观感。 */
    const ramp = Math.min(1, Math.abs(off) / SAFE_ZONE);
    capsuleEl.style.setProperty('--flow-l', off < 0 ? ramp.toFixed(3) : '0');
    capsuleEl.style.setProperty('--flow-r', off > 0 ? ramp.toFixed(3) : '0');
    capsuleEl.classList.add('dragging');
  }
  fadeWords(off);                                // 被逼近的那一侧的词变淡（dx=0 时回到常态）
  /* 手指一动就立刻打断水环膨胀：否则"鼓出的水环"会和"跟手的 bulge"两个动画抢同一个
     shapeState.wrap，轮廓会跳。打断即落到常态包边，视觉上就是从水环平滑进入拖拽。 */
  cancelAnimationFrame(shapeState._rafRing);
  shapeState.wrap = null;
  shapeState.btnCx = off;
  buildBarShape({ skipMap: true });   // 只重建路径；置换图等松手后那次 tweenShape 落点再补
}
/* 进入长按态（按用户逐帧描述的顺序）：
   ① 水波纹从圆钮荡开 → ② 栏体两端那两个页签"先分出来、再融进去" → ③ 栏体自己鼓起一圈水环
   → ④ 全屏变灰 → ⑤ 圆钮图标切成麦克风。
   圆钮**原地不动、不放大、不上移**（见 .fab.fab-rec 的注释）；导航栏之外不出现任何元素。 */
function enterVoiceLong(){
  voiceActive = true; voiceSide = 0;
  voiceHandled = false; voiceFillOnly = false;    // 新一轮手势：上一次的"结果已消费"标记清零
  fab.classList.remove('fab-press', 'fab-pulse');
  fab.classList.add('fab-rec');
  measureWords();                                 // 避让量按本轮实测矩形算（栏宽/字号都可能变）
  setFabVoice(0);                                 // 归零：bulge 先回到中轴（同时把 --wd-* 归零）
  /* 整套长按视觉（水波纹 .voice-ripple / 栏两端两个字 .bar-words / 麦克风图标 / 流动层 .bar-flow）
     全部由 .capsule 上的 .voice 一个类驱动；流动的左右由 side-l / side-r 驱动。 */
  if (capsuleEl) capsuleEl.classList.add('voice');
  /* 折射改用"在动的噪声"（v2.5）：长按期间玻璃边缘像水面一样波光粼粼。
     松手时在 cancelVoice 里切回静态置换图。 */
  liquidSource('noise');
  /* v3.23（用户："导航栏之外界面模糊一些"）：长按说话时把页面推到焦外。
     底栏不受影响（遮罩 z-index:70，底栏在它上面）；不再有灰色蒙版。 */
  if (voiceDim) voiceDim.classList.add('on');
  const tabs = document.querySelectorAll('.tab[data-view]:not([style*="display:none"])');
  if (tabs[0]) tabs[0].classList.add('melt-l');// 清单：分出来 → 融进中间
  if (tabs[1]) tabs[1].classList.add('melt-r');// 统计：分出来 → 融进中间
  swellRing();                                   // 栏体自己鼓出一圈水环，再收回成栏形
  if (vlive) vlive.textContent = '语音录入：向左滑直接录入，向右滑进入编辑，松手生效';
  startVoiceIfAllowed();                         // 开了原生语音才真正起识别，否则走键盘降级
  /* 必须排在 startVoiceIfAllowed() 之后：它会先把上一轮的 voicePending 清空。 */
  setVoiceStatus();
}
/* 松手结算：左＝直接录入、右＝进入编辑、居中 / 不足＝取消。 */
function voiceLeft(){
  const text = (voicePending || '').trim();
  /* 先打标记再取消手势：cancelVoice() 会把识别停掉，原生那边"停止→吐最终结果"是异步的，
     标记必须在它到达之前就位（否则又入一次库，见 voiceHandled 的说明）。 */
  voiceHandled = true;
  if (!text) voiceFillOnly = true; else voiceConsumed = text;
  cancelVoice();
  if (text){                                     // 有识别结果 → 直接入库（与打字同一入口）
    const el = document.getElementById('entry');
    /* ★ 2B：语音这条走**两段式上屏** —— 本地结果先顶上，AI 回来再替换（见 commitEntry）。 */
    if (el){ el.value = text; commitEntry({ twoPhase: true }); }
  } else {                                       // 没结果（语音关 / 不支持 / 没听清）→ 弹键盘降级
    goEntry();
    toast('点键盘上的麦克风说话');
  }
}
/* ★ 2B（用户 2026-10-08）：右滑「进入编辑」也要**先过一遍理解内核**。
   以前这条路只跑 parseSmart，于是"左滑直接录入"拿到的是 AI 改写过的干净标题，
   "右滑进入编辑"却是本地解析识别原文的结果 —— 同一个入口两套待遇，用户原话：
   "我真不确定，录入的时候 AI 能不能给我翻译得当"。现在两条路共用一个理解结果。
   多条目时编辑页只能编第一条，所以顺手把"AI 听成了几条"说清楚（不静默丢）。 */
async function voiceRight(){
  const text = (voicePending || '').trim();
  voiceHandled = true;
  if (text) voiceConsumed = text;
  cancelVoice();
  if (!text){ openEditNew(''); return; }
  /* ★ 3B：右滑也先判"这句是新建还是改已有"。判成 update 时**不进编辑页** ——
     编辑页是给"记一条新事"用的，把「删掉那条」填进去只会让用户看到一条莫名其妙的内容。
     改不动时（没候选 / 降级）**退回原路**开编辑页，用户那句话一个字都不会丢；
     这条路上不给「记成新的一条」按钮（编辑页本身就是那个出口，两个出口会打架）。 */
  {
    const route = await aiRouteForEntry(text, {});
    if (route === 'update'){
      const r = await aiRunUpdateEntry(text, { retryCreate: false });
      if (r && (r.executed || r.needConfirm)) return;
    }
  }
  let plan;
  try {
    plan = await aiUnderstand(text);
  } catch (e){
    plan = smartLocalPlan(text);
    plan.reason = 'error';
  }
  const list = (plan && Array.isArray(plan.items)) ? plan.items : [];
  const first = list[0] || null;
  /* 本地条目的 items[i].preset 就是 parseSmart 的完整返回值（含 path / repeat / goal / dayParts）；
     模型条目没有 preset，才用 aiPlanPreset 拼一份 —— 与 aiCommitPlan 同一条规矩。 */
  const preset = first ? (first.preset || aiPlanPreset(first)) : null;
  const heard = String((plan && plan.corrected) || '').trim();
  if (preset && heard && heard !== text) preset.heard = heard;
  openEditNew(text, preset);
  const reply = aiEntryReply(plan, '进入编辑');
  if (reply.via === 'aiFail') aiFail(reply.msg, null, 6000);
  if (list.length > 1) toast('AI 听成了 ' + list.length + ' 条，这里先编辑第 1 条', null, 6000);
}

fab.addEventListener('pointerdown', e => {
  e.preventDefault();                             // 阻止随后可能的文本选择 / 合成 click
  try { fab.setPointerCapture(e.pointerId); voiceCapId = e.pointerId; } catch (_){}
  fab.classList.add('fab-press');                 // 起手即给"按下去了"的反馈
  fab.classList.add('fab-pulse');                 // "波动一下"（scale 1→1.14→1）
  buzz(14);   // 起手轻震
  voiceStartX = e.clientX; voiceLastX = 0; voiceSide = 0;
  voiceStartY = e.clientY; voiceLastY = 0; cancelArmed = false;
  fabTimer = setTimeout(() => { fabTimer = 0; enterVoiceLong(); }, LONG_PRESS_MS);
});
fab.addEventListener('pointermove', e => {
  if (!voiceActive) return;                       // 跟手只在长按态内生效
  /* ---- 上滑取消（v2.5 新增，按用户设计）----
     "往上滑超过一定范围（大概是一个语音录入按钮的距离）就直接取消本次语音输入"，
     并且取消时上方那行识别文字要发红光。这里只**进入待取消态、松手才真取消**
     （用户拍板甲方案），滑回下方还能救回来。垂直判定优先于左右方向判定 ——
     手指往上走时不再跟手左右，免得"取消"和"选边"同时发生。 */
  const dy = e.clientY - voiceStartY;
  voiceLastY = dy;
  const armed = dy <= -CANCEL_LIFT;
  if (armed !== cancelArmed){
    cancelArmed = armed;
    if (capsuleEl) capsuleEl.classList.toggle('cancel-armed', armed);
    if (armed){
      voiceSide = 0;
      if (capsuleEl){
        capsuleEl.classList.remove('side-l', 'side-r');
        capsuleEl.style.setProperty('--flow-l', '0');
        capsuleEl.style.setProperty('--flow-r', '0');
      }
      if (vlive) vlive.textContent = '松开：取消本次录入';
      buzz([18, 54, 18]);
    } else if (vlive){ vlive.textContent = '继续滑动选择'; }
  }

  voiceLastX = dx;

     用户反馈"这个按钮跟我手指头是脱离的、有延迟"——根因是上一版把两者一起压进了 rAF，
     v3.3：按钮按钮与轮廓**必须在同一帧、同一个回调里写**（applyFabVoice 本来就这么做）。
     上一版把按钮位移单独搬到 pointermove 里"当场写"、轮廓仍走 rAF —— 两者分属两个时机，
     快速拖动时就出现用户截图抓到的"黑圆走到前面、包边落在后面"的错位。
     跟手的手感改由**增益**保证：fabTravel 的 K 从 70 收到 110，头 40px 几乎 1:1。 */
  setFabVoice(dx);
  /* 安全范围（用户原话）："手不一定会抖，所以设置一个安全范围，比如错位按钮的一半，
     也就是当前语音录入按钮半径那么长。在这个范围内左右动是没关系的。"
     ±28px 内＝还没选方向（圆钮仍跟手移动，但没有任何方向表示）；
     越界＝单次震动提示 + 那一侧的玻璃开始流动（side-l / side-r）。 */
  const side = Math.abs(dx) <= SAFE_ZONE ? 0 : (dx < 0 ? -1 : 1);
  if (side !== voiceSide){                         // 每次跨越只震一次，不每帧震

    /* 方向的表达（本轮重做）：不给按钮加任何颜色（原 .fab-glow 光晕已删，用户"太丑了"）。
       越界的那一半玻璃自己开始"流动"（.bf-l / .bf-r 柔光带漂移，见 CSS .bar-flow）。 */
    if (capsuleEl){

      capsuleEl.classList.toggle('side-r', side === 1);
    }
    if (side === -1) buzz(20);                 // 越界进左侧：单次短震
    else if (side === 1) buzz([14, 36, 14]);   // 越界进右侧：双次短震
    if (vlive) vlive.textContent = side === -1 ? '松开：直接录入' : side === 1 ? '松开：进入编辑' : '继续滑动选择';
  }
});
fab.addEventListener('pointerup', e => {
  try { if (voiceCapId != null) fab.releasePointerCapture(voiceCapId); } catch (_){}
  voiceCapId = null;
  if (voiceActive){
    /* ① 上滑待取消（v2.5，用户拍板"松手才真取消"）：直接取消，不再看左右。
       ② 否则按安全范围结算：越界侧＝执行、范围内＝取消。
       两处阈值必须同源（都是 SAFE_ZONE），否则会出现"震过了提示但松手没反应"的错位。 */

    }

  }

/* 手指滑走 / 被打断（来电、系统手势）：长按态→取消，非长按态→复位 */

/* 键盘可访问性：回车 / 空格 = 单击（切录入）。pointer 事件覆盖鼠标/触摸，这里补键盘。 */
fab.addEventListener('keydown', e => {

/* ---------------- 原生语音桥（设备端离线识别，零联网） ----------------
   桥对象 window.YuShiNative 由安卓壳经 addJavascriptInterface 注入；PWA / iPhone 上没有，
   所有访问都先判断存在，缺了就走"弹键盘"降级（见下方 startVoiceIfAllowed）。
   识别结果 / 部分结果 / 错误 / 结束，统一经 window 事件 yushi:speech 回传。 */
function voiceReady(){
  try {
    return !!(window.YuShiNative && typeof window.YuShiNative.isAvailable === 'function'
      && window.YuShiNative.isAvailable() === 'true');
  } catch (_){ return false; }
}
function offlineReady(){
  try { return !!(window.YuShiNative && typeof window.YuShiNative.startVoiceOffline === 'function'); } catch (_){ return false; }
}
function startVoiceIfAllowed(){
  if (!S.voice) return;                            // 开关关 → 不调原生识别（直接弹键盘）
  voiceHandled = false; voiceFillOnly = false;      // 每次开识别都从干净状态起步
  /* ★ v3.18：本地 Vosk 识别优先 —— 模型在包里、完全不联网、**输入法不出现**。
     这条必须排在"没有 startVoice 就降级"那句之前：Vosk 不需要系统识别器。 */
  if (offlineReady()){

/* ★ 阶段1 · 决策 4：单字连续重复的白名单。
   这一档当年之所以"完全不管单字重复"，就是因为 `看看 / 刚刚 / 妈妈` 是正常词 ——
   现在补这一档，靠的就是把那些正常词一个个列出来（**表里全是"同一个字连两次"的形状**，
   判定就是"这一段与表里的词完全相等"，不做词性分析，简单可核）。
   收词口径：口语重叠式（看看/试试/想想）、亲属称呼（妈妈/爸爸/奶奶）、
   副词型（刚刚/常常/渐渐/慢慢/悄悄/轻轻）、量词型（天天/年年/人人/个个）。 */
const SPEECH_KEEP = new Set([
  '看看','试试','想想','聊聊','问问','说说','走走','坐坐','歇歇','等等','笑笑','听听',
  '拍拍','摸摸','揉揉','擦擦','洗洗','翻翻','查查','读读','写写','算算','数数','点点',
  '妈妈','爸爸','爷爷','奶奶','哥哥','姐姐','弟弟','妹妹','宝宝','娃娃','太太',
  '刚刚','常常','渐渐','慢慢','悄悄','轻轻','好好','多多','早早','天天','年年','人人','个个',
]);
/* ★ 阶段1（决策 4）：把同一个字连续 3 次以上压成 1 次；连续 2 次查白名单，不在表里也压成 1 次。
   真机上的叠字恰恰是**单字**形态（`代代代办级籍`），原来那一档不管单字，所以一直漏。
   ⚠️ 只处理汉字 / 字母 / 数字的连续段：标点整段放行 ——
   中文省略号是「……」（两个 U+2026）、破折号是「——」，把它们压掉就是新的坏输入。 */
function collapseRuns(s){
  let out = '', i = 0;
  while (i < s.length){
    let j = i;
    while (j < s.length && s[j] === s[i]) j++;

    if (!/[\u4e00-\u9fffA-Za-z0-9]/.test(c)) out += s.slice(i, j);        // 标点原样
    else if (n >= 3) out += c;                                            // 3 次以上 → 1 次
    else if (n === 2) out += SPEECH_KEEP.has(c + c) ? c + c : c;          // 2 次 → 查表
    else out += c;
    i = j;
  }

}
/* ★ v3.36（用户："语音输入的时候，有时候总是出现叠字…比如我说明天种树，它就出现了
   两个名字、两个数字"）：本机识别是流式的，端点/解码偶发重复片段时，吐出来的整句会
   正好是两段相同内容（或同一个片段连着说两遍）。这里做**保守**去重，只处理确定性很高的形态：
     ① 整句 = 两段完全相同的内容；
     ② 同一个字连续 3 次以上 → 压成 1 次；连续 2 次 → 查 SPEECH_KEEP，不在表里就压成 1 次
        （★ 阶段1 决策 4 新增的这一档，原来这里只注释说"不管单字"，但真机的叠字恰恰是单字）；
     ③ 同一个 2 字及以上的**片段**连续重复（"明天明天种树" → "明天种树"）。
   ②③ 的顺序不能反：片段那一档会把白名单里 2 字以上的词一起吃掉（`刚刚刚刚` → `刚刚` 对，
   但 `刚刚` 单独出现时它不动，所以先跑②、再跑③是安全的）。 */
function normalizeSpeech(s){
  let t = String(s || '').trim();
  if (!t) return '';
  const half = t.length / 2;
  if (Number.isInteger(half) && half >= 2 && t.slice(0, half) === t.slice(half)) t = t.slice(0, half);
  t = collapseRuns(t);
  t = t.replace(/(.{2,12}?)\1{1,2}/g, '$1');
  return t.replace(/\s{2,}/g, ' ').trim();
}
window.addEventListener('yushi:speech', e => {
  const d = e.detail || {};
  if (d.type === 'partial' || d.type === 'result'){ voicePending = normalizeSpeech(d.text); }
  else if (d.type === 'panel_text'){ voicePending = normalizeSpeech(d.text); }
  /* v3.16：走系统语音面板时，文字是**松手之后**才回来的（面板要等用户把话说完），
     那时手势早就结束了 —— 所以这里直接把结果落进录入框并入库，等价于"直接录入"那一侧。 */
  if ((d.type === 'result' || d.type === 'panel_text') && !voiceActive && voicePending){

    if (voiceConsumed && voicePending === voiceConsumed){
      voiceHandled = false; voicePending = ''; return;
    }
    /* ★ v3.36：左滑时手上没文字 → 已经弹了键盘。这时迟到的结果**只填进输入框**，
       不入库（让用户自己看一眼再回车）。 */
    if (voiceFillOnly){
      const el = document.getElementById('entry');
      if (el && !el.value.trim()) el.value = voicePending;
      voiceFillOnly = false; voiceHandled = false; voicePending = '';
      return;
    }
    /* ★ v3.36：这次的结果已经被左滑 / 右滑那一支消费过了 → 丢弃，不再入第二条 /
       不再偷偷在编辑弹窗背后插一条。 */
    if (voiceHandled){ voiceHandled = false; voicePending = ''; return; }
    const el = document.getElementById('entry');
    if (el){ el.value = voicePending; commitEntry(); toast('已用语音录入'); }
    voicePending = '';
    return;
  }       // 跟手时实时回填
  else if (d.type === 'unavailable'){ voicePending = ''; toast('离线识别不可用：请在设置→语音里打开「系统语音（可能联网）」'); }
  else if (d.type === 'error'){
    voicePending = '';
    /* v3.8：任何原生错误都要出声 —— 上一版除了 permission_denied 之外全是静默，
       真机上"什么都没发生"，根本没法判断是权限、识别器不可用还是别的问题。 */
    if (d.code === 'permission_denied') toast('没给录音权限，已改为键盘输入');

       不再甩一个英文错误码给用户，直接告诉他用键盘上的麦克风。 */
    else if (d.code === 'cancelled')
      toast('没听清，点键盘上的麦克风说话');
    /* v3.32（用户："没听清的时候后面就不要用这个了"）：不再把 f/e/p 调试参数显示给用户，

    else if (d.code && d.code.indexOf('empty') === 0){
      try { console.log('语音诊断', d.code); } catch (_){}
      toast('没听清，靠近一点再说一次');

    else toast('语音出错（错误码 ' + (d.code || '?') + '），已改为键盘输入');

/* ---------------- 原生通知桥（阶段1） ----------------
   桥的方法与事件形状见 _android/NOTIFY-BRIDGE.md。两件事：

  const d = e.detail || {};
  if (d.type === 'open' && d.id){ jumpToTask(String(d.id)); return; }
  if (d.type === 'perm'){
    if (S.view === 'settings') refresh();
    else refreshNotifyPerm();

  }

  if (d.type === 'exact'){
    if (S.view === 'settings') refresh();
    else refreshNotifyExact();
  }
});

/* ---------------- 换页面：**唯一入口** ----------------
   ★ 2026-10-06 审查修复（状态收敛）：换页面原来是 9 处各写一遍 `S.view = 'xxx'`，
   每处都得自己记得"要不要顺手清临时态、要不要收敛副作用类"。tree-full 那次死路
   （底栏消失 + 页面锁死，安卓上没有 Escape 只能杀进程）就是这种写法的后果 ——
   后来只能在 refresh() 里补一道兜底。
   现在收成一处：调用点只表达"我要去哪一页"，下面三件事由它统一负责：
     ① 该清的会话态（多选 / 续写框）；
     ② 副作用类收敛（全屏树只在"想法页 + 树状图"里才有意义，否则一定得关）；
     ③ 入场动画开关 + 重绘。
   ⚠️ refresh() 顶部那道 tree-full 兜底**保留** —— 它是安全网（万一还有别的路径绕过这里），
      不是冗余代码。 */
function goView(v, opts){
  const o = opts || {};

     统计首页。statPage 故意不进 S、不进备份，所以这条兜底是它唯一的清理点。
     清单页那行入口要**直接**进某一子页，就用 goView('stat', { statPage:'today' }) 点名。 */
  statPage = (v === 'stat' && o.statPage) ? o.statPage : null;
  /* ★ 0G：来处与 statPage 同一处赋值/清理（同一套生命周期，别让第二个真相源长在调用点上）。
     从清单页底部那行进来时带 {from:'list'} → 子页的「返回」才知道要回清单页。 */
  statFrom = (v === 'stat' && o.from === 'list') ? 'list' : null;
  /* ★ 0G：同一个视图内部换屏也要能要求播一次入场。原来是直接 refresh()（而 ANIM 已被上一次
     渲染关成 false）→ 从统计子页点底栏「统计」回首页时**一点动画都没有**（用户实测反馈）。
     现在传 { anim:true } 就能播；不传时行为与改动前一致。 */
  if (S.view === v){
    /* ★ 0G：同屏换屏（统计子页进出）也要播一次入场。原来这里直接 refresh()（而 ANIM 已被上一次
       渲染关成 false）→ 从子页点底栏「统计」回首页时**一点动画都没有**（用户实测反馈）。
       两个触发条件：显式点名的 anim，或本次是"进/出某个统计子页"。不满足时行为与改动前一致。 */
    if (o.anim || o.statPage) ANIM = true;
    refresh();
    return;
  }
  S.view = v;
  /* ★ 3A 决策 3：切换视图时清除焦点 —— 焦点是"我刚才在跟哪一条打交道"，
     换了页面这句话就不再成立。只清内存 + sessionStorage，不碰 S、不碰备份。
     用 typeof 守卫：纯 Node 回归把 goView 整段切进隔离环境时没有焦点层。 */

   通知点击（yushi:notify）要的是同一件事 —— 抽成一个函数，两条路共用同一份实现，
   不另写一套（任务卡步骤 5 明确要求复用）。
   两个细节照旧：先清掉清单页的搜索词（否则那一条可能正好被筛掉，滚过去什么都没有），
   再等 80ms 让 goView → refresh 那一帧把 DOM 建出来。 */
function jumpToTask(tid){
  const t = tid && S.items.find(x => x.id === tid);
  if (!t){ toast('那条待办已经删掉了'); return; }
  S.q = ''; goView('list');
  setTimeout(() => {
    const node = view.querySelector('[data-fk="t:' + t.id + '"]');
    const row = node && node.closest ? node.closest('.item') : null;
    if (!row) return;
    try { row.scrollIntoView({ behavior:'smooth', block:'center' }); } catch (e){}
    row.classList.add('jump-hl');
    setTimeout(() => row.classList.remove('jump-hl'), 1700);

/* 外观切换（v2.5 起长在页面右上角，原来是顶栏里那枚）：浅 → 深 → 跟随系统 三档循环。
   图标与文案都由 applyTheme 统一同步，这里只需推进档位。 */
function cycleTheme(){
  const order = ['light', 'dark', 'auto'];
  const next = order[(order.indexOf(S.theme) + 1) % 3] || 'light';
  applyTheme(next, true);

/* ★ v3.50：外观键已从底栏撤掉（位置让给「想法」页），三档改在设置页选。
   这个 IIFE 里**还住着筛选抽屉的开关**（setToolsOpen + #filterFab 的事件委托）——
   原来它第一行是 `if (!btn) return;`，一旦外观键不存在，整个块连抽屉一起失效。
   所以这里改成：外观键有就接、没有也不早退，抽屉那部分照常跑。
   外观三档的点击逻辑在设置页的 data-theme 分支（view 的点击代理里），见那里的说明。 */
(function themeFabWire(){
  const btn = document.getElementById('themeFab');
  /* 筛选抽屉的高补间（原因见 .toolbar 那段注释：高度不能交给 CSS 过渡）。 */
  const TOOLS_MS = 300;
  let toolsRaf = 0;
  function setToolsOpen(open){
    const tb = document.querySelector('.toolbar');
    if (!tb){ document.body.classList.toggle('tools-open', open); return; }
    const from = open ? 0 : Math.ceil(tb.getBoundingClientRect().height);
    let to = 0;
    if (open){
      /* 量内容高：临时放开 max-height，量完还原成 from —— 全程在同一个任务里，
         中间不会绘制。因为高度不再依赖 CSS 过渡，这一次"放开/还原"不会污染任何东西。 */
      tb.style.maxHeight = 'none';
      to = Math.ceil(tb.offsetHeight);
      tb.style.maxHeight = from + 'px';
    }
    document.body.classList.toggle('tools-open', open);
    if (toolsRaf){ cancelAnimationFrame(toolsRaf); toolsRaf = 0; }
    if (reduceMotion() || from === to){
      tb.style.maxHeight = '';          // 展开 → 回 auto；收起 → 由 CSS 的 max-height:0 管
      return;
    }
    tb.style.maxHeight = from + 'px';
    const t0 = performance.now();
    /* 收尾曲线用和 --mo-soft（cubic-bezier(.2,.9,.25,1)）同族的强缓出：
       前端快、末端收得住，和 opacity/margin 那条过渡看着是同一个节奏。 */
    const ease = u => 1 - Math.pow(1 - u, 2.6);
    const step = now => {
      const u = Math.min(1, (now - t0) / TOOLS_MS);
      tb.style.maxHeight = (from + (to - from) * ease(u)).toFixed(2) + 'px';
      if (u < 1) toolsRaf = requestAnimationFrame(step);
      else {
        toolsRaf = 0;
        /* 收尾清掉 inline 值回到 auto（展开后内容变高才不会被这个旧值裁掉）；收起态由 CSS 管。 */
        tb.style.maxHeight = '';
      }
    };
    toolsRaf = requestAnimationFrame(step);
  }

     为什么不能像上一版那样直接给 #filterFab 挂监听 —— 3.13 起这颗按钮被搬进了列表模板，
     每次 refresh()/切页都会重建它，一对一监听会随着旧节点一起消失（表现：按钮点不动）。
     委托挂在 document 上，重建多少次都还在。 */
  document.addEventListener('click', e => {
    const fb = e.target && e.target.closest ? e.target.closest('#filterFab') : null;
    if (!fb) return;
    const open = !document.body.classList.contains('tools-open');
    setToolsOpen(open);
    fb.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();

/* 安卓返回键会派发 Escape（见 MainActivity.onBackPressed）；长按态 / 按住中按返回都要能取消并复原。 */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (voiceActive){ cancelVoice(); }
  else if (fabTimer){ clearTimeout(fabTimer); fabTimer = 0; fab.classList.remove('fab-press', 'fab-pulse'); }
});

/* 吸顶反馈：录入条贴住顶栏时加一层更实的投影
   （不能用 IntersectionObserver —— 吸顶后它仍 100% 可见，ratio 恒为 1） */
(function stickyCapture(){
  const bar = document.getElementById('captureBar');
  const wrap = document.getElementById('captureWrap');
  if (!bar || !wrap) return;
  let ticking = false, stickTop = 0;
  /* 只在尺寸变化时读一次计算样式 —— getComputedStyle 会强制样式重算，不能放进滚动帧里 */
  function measure(){ stickTop = parseFloat(getComputedStyle(wrap).top) || 0; }
  function paint(){
    ticking = false;
    bar.classList.toggle('is-stuck', wrap.getBoundingClientRect().top <= stickTop + 1);
  }
  window.addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(paint); } }, { passive:true });
  window.addEventListener('resize', () => { measure(); paint(); });
  measure(); paint();
})();

/* 主题：light / dark / auto（auto＝跟随系统，见下方 mqDark 的 change 监听）。
   html[data-theme] 上的实际值是 light 或 dark；选 auto 时由系统深浅色决定，
   并实时监听系统变化（mqDark 的 change 回调里只动 data-theme，不碰 S.theme 持久值）。
   S.theme 是用户的选择档位，持久化进 save()；单独的 LS+'.theme' 只是给"未来要加的
   系统级快捷切换"留个读入口，无伤大雅。 */
const mqDark = matchMedia('(prefers-color-scheme: dark)');
function effectiveTheme(){
  if (S.theme === 'auto') return mqDark.matches ? 'dark' : 'light';
  return S.theme;
}
function applyTheme(t, animate){
  S.theme = (t === 'auto' || t === 'dark') ? t : 'light';   // 白名单，挡住外部乱传值
  if (animate){
    document.documentElement.classList.add('theme-changing');
    setTimeout(() => document.documentElement.classList.remove('theme-changing'), 560);
  }
  document.documentElement.dataset.theme = effectiveTheme();
  /* 外观三档图标据此切换（见 .theme-fab .ti 那组规则）——必须写 S.theme 档位，不是
     effectiveTheme()，否则"浅色"和"跟随系统（当前浅）"会显示成同一枚图标。 */
  document.documentElement.dataset.mode = S.theme;
  /* ★ v3.50：外观三档控件从底栏搬进了设置页，所以这里同步的对象改成**设置页那三个按钮**。
     图标与 aria/title 那套已经不需要了（按钮上有文字），改成同步 .on 与 aria-pressed；
     设置页没渲染时（其它视图）这两个集合都是空的，什么也不做。 */
  const seg = document.querySelector('.seg [data-theme]');
  if (seg){
    seg.closest('.seg').querySelectorAll('[data-theme]').forEach(b => {
      const on = b.dataset.theme === S.theme;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  try { localStorage.setItem(LS + '.theme', S.theme); } catch (e){}
  save();
}
/* 跟随系统：选 auto 时系统切浅/深，这里即时同步 data-theme（不动 S.theme） */
mqDark.addEventListener('change', () => {
  if (S.theme === 'auto') document.documentElement.dataset.theme = effectiveTheme();
});
/* 启动套用见文件末尾「启动」段：必须排在 load() 之后，S.theme 那时才从备份读好（默认 auto）。 */

/* ---------------- 流畅模式：软件渲染自动降级 + 手动开关 ---------------- */
/* 检测 WebGL 渲染器字符串：Microsoft Basic Render Driver / SwiftShader / llvmpipe 等都是软件渲染。
   实测：Intel Arc（真 GPU）报 "ANGLE (Intel, ...Arc...)"；--disable-gpu 报 "ANGLE (Microsoft, ...Basic Render Driver...)"。 */
function isSoftwareGL(){
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return true;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    const r = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : (gl.getParameter(gl.RENDERER) || '')).toLowerCase();
    return /basic render|swiftshader|llvmpipe|softpipe|software|angle \(microsoft/.test(r);
  } catch (e){ return false; }
}
const LITE_KEY = LS + '.lite';
/* gpu-render：真 GPU 才升级为 backdrop 玻璃。软件渲染下即使手动切回「完整视觉」，
   也用实底玻璃（色球/点阵/动画/高光全保留）—— backdrop-filter 在软件渲染下
   每帧全价重采样，实测一个元素就能把滚动帧率砍半以上。 */
const SOFT_GL = isSoftwareGL();
document.documentElement.classList.toggle('gpu-render', !SOFT_GL);
/* 真折射门控：backdrop-filter 配合 filter:url()（把置换应用到背景像素上）只有 Chromium 系
   能正确合成 —— 含安卓 WebView（UA 带 "Chrome"/"Chromium"/" wv"）。Safari 会解析成功但整块
   不渲染（@supports 检测不出，会骗你）；Firefox 从不支持 -webkit- 别名。二者一律关，落纯磨砂。
   判据用 UA（Chrome 串里虽也含 "Safari"，但先判 Chrome/Chromium 即可排除真正的 Safari）。 */
function isLiquidGlassCapable(){
  const ua = navigator.userAgent || '';
  const isFirefox = /Firefox\//.test(ua);
  const isChromium = /Chrome\//.test(ua) || /Chromium\//.test(ua) || /\bwv\b/.test(ua)
    || !!(window.chrome && (window.chrome.webview || window.chrome.apps));
  return isChromium && !isFirefox;
}
document.documentElement.classList.toggle('liquid-glass', isLiquidGlassCapable());
function applyLite(on){
  document.documentElement.classList.toggle('soft-render', on);
  /* 设置页那个开关（正好在设置页时）跟着同步。进设置页时会按当前状态渲染一份，
     这里是给"在设置页改完、切走又切回来"补一道，免得两处说法不一致。 */
  const sw = document.querySelector('.switch[data-set="lite"]');
  if (sw) sw.setAttribute('aria-checked', on ? 'true' : 'false');
}
function currentLite(){
  let pref = null;
  try { pref = localStorage.getItem(LITE_KEY); } catch (e){}
  if (pref === 'on') return true;          // 手动开过
  if (pref === 'off') return false;        // 手动关过（即使软件渲染也尊重）
  return SOFT_GL;                          // 否则自动检测
}
applyLite(currentLite());
/* 顶栏那颗手动切"流畅模式"的 ⚡ 已撤（手机上它和主题滑块一起把标题挤没了），
   开关挪进设置页 —— 见 renderSettings 里 data-set="lite" 那一行，
   点击逻辑在 view 的点击代理里（和"页面说明文字"同一个分支）。 */

/* ---------------- 快捷键 ---------------- */
/* `/` 的通用约定是「搜索」。这条原来直接 focus #entry，但**录入条只在录入界面可见**
   （body:not([data-view="entry"]) .capture-wrap{display:none}），
   而对 display:none 的元素调 focus() 是空操作 —— 于是这条快捷键在清单页按下去
   什么都不会发生（代码审查用真渲染实测确认：activeElement 仍是 BODY）。
   现在按当前视图分流：清单页 → 搜索框（与 `/` 的约定一致）；其它页 → 进录入界面再聚焦。 */
document.addEventListener('keydown', e => {
  const a = document.activeElement, tag = a && a.tagName;
  if (e.key !== '/' || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  e.preventDefault();
  if (S.view === 'list'){
    const sb = document.getElementById('searchBox');
    if (sb){ sb.focus(); return; }    // 清单页顶部本来就有搜索框，聚焦它（不再跳页）
  }
  goEntry();                          // 内部已是「改 S.view → refresh → rAF 后 focus #entry」
});

/* ---------------- 启动 ---------------- */
load();
/* 主题：必须排在 load() 之后，S.theme 此刻才从备份读好（默认 auto）。
   选 auto 时实际深浅由系统决定，后续系统切换由 mqDark 的 change 监听实时同步。 */
applyTheme(S.theme, false);
/* 「页面说明文字」的开关在首帧之前就要落到位 —— refresh() 是 rAF 延迟的，
   等它同步会先闪一下那段说明文字。 */
applyHelp();
/* 键盘浮起的兜底（--kb）：只在浏览器 / PWA / 老壳里量得到值，安卓新壳那条走原生 insets。 */
initKeyboardInset();
/* 备份提醒：必须排在 load() 之后 —— 它要读 S.lastBackup，见函数定义处的说明。 */
backupNudge();
/* 写法提示：chip 条数由脚本数一遍填上去；开合状态记进 localStorage。
   放在 load() 之后，否则读不到已存的 hintOpen。 */
(function initHint(){
  const box = document.getElementById('hintBox');
  if (!box) return;
  const n = box.querySelectorAll('.hint-chips span').length;
  const badge = box.querySelector('.hb-n');
  if (badge) badge.textContent = n + ' 种';
  box.open = !!S.hintOpen;
  box.addEventListener('toggle', () => { S.hintOpen = box.open; save(); });
})();
refresh();
/* ★ 阶段1 提醒：启动时做一次**全量对账** —— 重装 / 换机 / 改过系统时间 / 上次排期失败，
   全靠这一次补上（硬约定 8：开机广播那一刻页面还没跑，所以"重启也不丢"真正靠的是
   原生侧自己持久化的排期表；这一次对账是把页面里的真相再同步回去）。
   排在 refresh 之后：它不需要 DOM，让首帧先出来，别跟开屏抢那一帧。 */
notifyReconcile();
/* ★ v5.0 第 3 批：AI 的静默关联扫描。**排在 refresh 之后**，而且只在
   开关打开 + 有 key + 距上次 > 24h 三条同时成立时才排那一次请求
   （函数内部自己判断，关着的时候这里什么都不做 —— 页面零外部请求）。 */
aiMaybeAutoScan();
</script>
</body>
</html>
