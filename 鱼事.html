<script>
/* =========================================================================
   鱼事 · 纯前端单文件
   视觉层照抄 pidanai.com 首页（#about）；解析/存储逻辑为本项目核心，保持既有行为
   ========================================================================= */

/* ---------------- 标签词典 ----------------
   这里只是「默认给几个」+「自动猜标签的关键词」。
   真实来源是 S.tags —— 用户可以给任意标签改名或删掉，所以渲染一律读 S.tags。
   自动猜只猜「标签还在、且词典里有规则的」那几个；用户改过名或新建的标签不参与猜测。 */
const TAGS_DEFAULT = ['学习','生活','娱乐'];
let ACTIVE_TAGS = TAGS_DEFAULT.slice();     // 应用层同步成 S.tags
/* 一个条目最多挂几个标签。手选可以多选，加上正文里写的 #标签，超过就截断 */
const TAG_PER_ITEM = 4;
const TAG_RULES = {
  学习:['作业','课','论文','考试','复习','预习','申论','考研','读书','书','讲座','答辩','稿子','ppt','侦查','讯问','法条','案例','学分','老师','报告','笔记','教材','题','学'],
  生活:['洗','晾','打扫','收拾','清理','买','拿','快递','丢','垃圾','牙膏','行李箱','箱','水','衣服','衣','鞋','锅','茶几','沙发','被罩','酸奶','面包','西瓜','饭','睡','药','充电','话费','套餐','理发','袜子','内裤'],
  娱乐:['游戏','以撒','星露谷','表情包','b站','视频','电影','听歌','动漫','小说','看剧','闲鱼','刷','比赛','boss','拼豆']
};
function guessTags(text){
  const s = String(text || '').toLowerCase();
  const score = ACTIVE_TAGS
    .filter(t => TAG_RULES[t])               // 标签被删/改名后词典里就没有对应规则了
    .map(t => ({ t, n: TAG_RULES[t].filter(k => s.includes(k)).length }))
    .filter(x => x.n > 0)
    .sort((a, b) => b.n - a.n);
  return score.slice(0, 2).map(x => x.t);
}

/* ---------------- 日期工具 ---------------- */
function pad2(n){ return String(n).padStart(2, '0'); }
function ymd(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function dateFrom(s){ const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

/* 导入历史笔记时，相对日期（今天/周四/17号）按「基准日」算，而不是按今天 */
let BASEDAY = null;
function today0(){
  if (BASEDAY){ const d = new Date(BASEDAY); d.setHours(0, 0, 0, 0); return d; }
  const d = new Date(); d.setHours(0, 0, 0, 0); return d;
}
function daysFromToday(s){ return Math.round((dateFrom(s) - today0()) / 86400000); }

/* 你的日期简写 → YYYY-MM-DD：91 / 915 / 9.21
   三位数字（如 123）天然有歧义：1月23 还是 12月3？按「当前月份优先」消歧：
   1) 哪种切分的月份等于输入当时的月份就选哪种 —— 12月2日输 123 → 12月3；1月输 123 → 1月23
   2) 都匹配不上 → 取离今天更近的（待办指向将来，9月输 123 → 12月3）
   导入历史笔记时以 BASEDAY 为基准，同样适用。 */
function mkDate(mo, da, monthOnly){
  if (!(mo >= 1 && mo <= 12)) return null;
  if (!(da >= 1 && da <= 31)) return null;
  const now = today0();
  const y = now.getFullYear();
  let d = new Date(y, mo - 1, da);
  if (d.getMonth() !== mo - 1) return null;
  // 跨年规则：算出来已过去超过 180 天 → 当作明年
  if (!monthOnly && Math.round((now - d) / 86400000) > 180) d = new Date(y + 1, mo - 1, da);
  return { date: ymd(d), monthOnly };
}
function numToDate(tok){
  if (tok.includes('.')){ const p = tok.split('.'); return mkDate(+p[0], +p[1], false); }
  if (tok.length === 1) return mkDate(+tok, 1, true);
  if (tok.length === 2) return mkDate(+tok[0], +tok[1], false);
  if (tok.length === 3){
    const a = mkDate(+tok.slice(0, 1), +tok.slice(1), false);  // 1|23 → 1月23
    const b = mkDate(+tok.slice(0, 2), +tok.slice(2), false);  // 12|3 → 12月3
    if (a && b){
      const cm = today0().getMonth() + 1;
      if (+tok.slice(0, 1) === cm) return a;   // 当前月份 = 前一位 → 选 1|23
      if (+tok.slice(0, 2) === cm) return b;   // 当前月份 = 前两位 → 选 12|3
      // 都不是当前月：取离基准日更近的
      return Math.abs(dateFrom(a.date) - today0()) <= Math.abs(dateFrom(b.date) - today0()) ? a : b;
    }
    return a || b;                              // 只有一种合法（如 915 只能 9|15）
  }
  return mkDate(+tok.slice(0, 2), +tok.slice(2), false);  // 4 位：10|15 无歧义
}

const WEEK = { '一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'日':0,'天':0 };
const REL  = { '今天':0,'今日':0,'明天':1,'明日':1,'后天':2,'大后天':3 };

/* ---------------- 核心：一行字 → {title,date,dateEnd,time,tags,zone,done} ---------------- */
function parseSmart(input){
  let text = String(input || '').trim();
  let explicit = null, time = null, date = null, dateEnd = null, monthOnly = false;

  /* 已完成标记 / 行首装饰。刻意**不含 x / X**：
     下面 done 的判定用 [☑☒√✓]、导入的行首判定用 [☐☑☒□√✓✗×]，两处都不认 x —— 只有这里认过。
     而 `\s*` 允许零个空白，于是「x 光片取报告」→「光片取报告」、
     「xiaomi 手环保修」→「iaomi 手环保修」，静默把用户写的字吃掉了，还没法察觉。
     真想支持「x 打勾」这种写法的话，得三处一起改，不能只在这儿悄悄剥。 */
  text = text.replace(/^[☐☑☒□√✓✗×]\s*/, '').trim();
  text = text.replace(/[\-—–·、,，。;；:：\s]+$/, '').trim();

  // 重要程度：行首 ! = 重要，!! = 紧急
  let pri = 0;
  {
    const pm = text.match(/^\s*(!{1,2})\s*/);
    if (pm){ pri = pm[1].length >= 2 ? 2 : 1; text = text.slice(pm[0].length).trim(); }
  }

  // 显式进「考虑」
  if (/[?？]$/.test(text)){ explicit = 'consider'; text = text.replace(/[?？]+$/, '').trim(); }

  // 显式标签：#任意词 都收下（内置 3 个之外的自动成为自定义标签，见 addItem）
  const forced = [];
  text = text.replace(/#([\u4e00-\u9fa5A-Za-z0-9_]+)/g, (m, g) => {
    forced.push(g); return '';
  }).trim();

  // 复合目标：「目标 写论文」建大目标；「写论文> 搜材料 925」挂子任务；
  // 「写论文> 第一周> 查文献」多层嵌套。父级不存在会自动创建。
  let goal = false, path = [];
  text = text.replace(/^目标\s+/, () => { goal = true; return ''; }).trim();
  {
    const pm = text.match(/^((?:[^>]+\s*>\s*)+)(.+)$/);
    if (pm){
      path = pm[1].split('>').map(s => s.trim()).filter(Boolean);
      if (path.length) text = pm[2].trim();
    }
  }

  // 时间点：下午5点 / 5点半 / 晚上
  const tpat = /(凌晨|早上|早晨|上午|中午|下午|傍晚|晚上|晚)?\s*(\d{1,2})\s*[点时](半|\d{1,2}\s*分)?\s*(之?[前后])?/;
  const tm = text.match(tpat);
  if (!tm){
    const bare = text.match(/(凌晨|早上|早晨|上午|中午|下午|傍晚|晚上|晚)\s*$/);
    if (bare) text = text.slice(0, bare.index).trim();
  } else {
    let hh = +tm[2];
    const mm = tm[3] ? (tm[3] === '半' ? 30 : parseInt(tm[3])) : 0;
    const per = tm[1] || '';
    if (/下午|傍晚|晚上|晚/.test(per) && hh < 12) hh += 12;
    if (/凌晨/.test(per) && hh === 12) hh = 0;
    if (!per && hh >= 1 && hh <= 6) hh += 12;
    if (hh >= 0 && hh <= 23 && mm >= 0 && mm < 60) time = pad2(hh) + ':' + pad2(mm);
    text = (text.slice(0, tm.index) + ' ' + text.slice(tm.index + tm[0].length)).replace(/\s+/g, ' ').trim();
    text = text.replace(/(之前|以前|前)\s*$/, '').trim();
  }

  // 相对词：今天/明天/后天
  for (const k in REL){
    if (text.includes(k)){
      const d = today0(); d.setDate(d.getDate() + REL[k]);
      date = ymd(d); text = text.replace(k, '').trim(); break;
    }
  }
  // 星期：周四 / 本周五 / 下周一
  if (!date){
    const wm = text.match(/(本周|这周|这个|下?周|星期|礼拜)([一二三四五六日天])\s*(之前|以前|前)?/);
    if (wm){
      const target = WEEK[wm[2]], base = today0();
      let diff = (target - base.getDay() + 7) % 7;
      if (/下/.test(wm[1])) diff += 7;
      const d = new Date(base); d.setDate(d.getDate() + diff);
      date = ymd(d);
      text = (text.slice(0, wm.index) + ' ' + text.slice(wm.index + wm[0].length)).trim();
      text = text.replace(/(之前|以前|前)\s*$/, '').trim();
    }
  }

  // 区间 914~919
  if (!date){
    const rm = text.match(/(\d{1,2}\.\d{1,2}|\d{1,4})\s*[~～\-—－]\s*(\d{1,2}\.\d{1,2}|\d{1,4})\s*$/);
    if (rm){
      const a = numToDate(rm[1]), b = numToDate(rm[2]);
      if (a && b){ date = a.date; dateEnd = b.date; text = text.slice(0, rm.index).trim(); }
    }
  }

  // 行尾数字（从长到短试）—— 即使已有日期也剥掉，免得留在标题里
  {
    const nm = text.match(/(\d{1,2}\.\d{1,2}|\d+)\s*$/);
    if (nm){
      const run = nm[1], cands = [];
      if (run.includes('.')) cands.push(run);
      else for (let len = Math.min(4, run.length); len >= 1; len--) cands.push(run.slice(run.length - len));
      for (const c of cands){
        const r = numToDate(c);
        if (r){
          if (!date){ date = r.date; monthOnly = r.monthOnly; }
          text = text.slice(0, nm.index + (run.length - c.length)).trim();
          break;
        }
      }
    }
  }

  // 行首数字：921 交作业（你习惯把日期写在最前面）
  if (!date){
    const lm = text.match(/^(\d{1,2}\.\d{1,2}|\d{1,4})[\s、,，]+(.+)$/);
    if (lm){
      const r = numToDate(lm[1]);
      if (r){ date = r.date; monthOnly = r.monthOnly; text = lm[2].trim(); }
    }
  }

  // X号
  if (!date){
    const hm = text.match(/(\d{1,2})\s*号\s*(之前|以前|前)?\s*$/);
    if (hm && +hm[1] >= 1 && +hm[1] <= 31){
      const now0 = today0();
      let d = new Date(now0.getFullYear(), now0.getMonth(), +hm[1]);
      if (Math.round((now0 - d) / 86400000) > 15) d = new Date(now0.getFullYear(), now0.getMonth() + 1, +hm[1]);
      date = ymd(d); text = text.slice(0, hm.index).trim();
    }
  }

  // 行中独立数字（前后是空白/边界，且至少两位）—— 「#大 924 给植物浇水」这类日期夹中间的写法
  if (!date){
    const re = /(?:^|(?<=\s))(\d{2,4}|\d{1,2}\.\d{1,2})(?=\s|$)/g;
    let mm2;
    while ((mm2 = re.exec(text))){
      const r = numToDate(mm2[1]);
      if (r && !date){ date = r.date; monthOnly = r.monthOnly; }
      if (r){
        text = (text.slice(0, mm2.index) + ' ' + text.slice(mm2.index + mm2[0].length)).replace(/\s+/g, ' ').trim();
        break;
      }
    }
  }

  // 循环任务：每天 / 每2天 / 每隔3天 —— 打勾后自动生成下一次（见 toggleDone）
  let repeat = null;
  {
    const rm = text.match(/每\s*隔\s*(\d+)\s*天|每\s*(\d+)\s*天|每天/);
    if (rm){
      repeat = Math.max(1, +(rm[1] || rm[2] || 1));
      if (repeat > 365) repeat = 365;
      text = text.replace(rm[0], '').trim();
    }
  }

  const cleaned = text.replace(/^[\-—·、,，。;；:：\s]+/, '').replace(/[\-—·、,，。;；:：\s]+$/, '').trim();
  const fallback = String(input || '').trim();
  const tags = forced.length ? forced.slice(0, TAG_PER_ITEM) : guessTags((cleaned || fallback) + ' ' + fallback);
  // 循环任务没写日期时归短期 —— 它总是「近期要做」的
  const zone = explicit || (date ? (daysFromToday(date) <= 14 ? 'short' : 'long') : (repeat ? 'short' : 'long'));

  return {
    title: (cleaned || fallback).replace(/\s{2,}/g, ' '),
    titleRaw: cleaned || fallback,
    date, dateEnd, monthOnly, time, tags, zone, repeat: repeat || null,
    pri,           // 0 无 / 1 重要(!) / 2 紧急(!!)
    goal,          // 「目标」前缀：显式标记为目标卡（有子任务也会按目标渲染）
    path           // 「写论文> 搜材料」的祖先链，addItem 里解析挂靠
  };
  /* 这里原来还返回过一个 `done: /^[☑☒√✓]/.test(fallback)`，是**死字段** ——
     三个调用方都不读：addItem 硬编码 done:false，openEdit 只用 date/repeat/pri，
     导入路径（importText）自己从行首符号另算一遍 done。已删除。
     注意别为了"用上它"去改 addItem：录入框的职责是**新建一条待办**，
     真写 ☑ 就立刻完成、从列表里消失，那是另一种"静默改数据"。导入才是 ☑ 的入口。 */
}

/* ---------------- 作业字段猜测 ---------------- */
function guessCourse(title){
  const known = ['形策','电诈','戒毒','申论','侦查','讯问','禁毒','思政','英语','体育','法律','刑侦','治安','形势与政策','计算机'];
  for (const k of known) if (title.includes(k)) return k;
  const m = title.match(/^(.{2,6}?)(课|的)?作业/);
  return m ? m[1] : '未分类';
}
function guessChannel(raw){
  if (/学习通/.test(raw)) return '学习通';
  if (/邮箱|邮件|email/i.test(raw)) return '邮箱';
  if (/打印|纸质|交到/.test(raw)) return '纸质';
  return '';
}
function guessNaming(raw){
  const m = raw.match(/\b(\d{2}[A-Za-z0-9]{1,3}\s*[-－]\s*姓名\s*[-－]\s*学号)\b/);
  if (m) return m[1].replace(/\s/g, '');
  const m2 = raw.match(/(?:命名|文件名|格式)[：:是为]?\s*([^\s，。,；;]{2,40})/);
  return m2 ? m2[1] : '';
}
/* 作业长条：用连续空格切出标题与详细要求 */
function splitHw(it, p){
  const segs = String(p.titleRaw || p.title || '').split(/\s{2,}/).map(s => s.trim()).filter(Boolean);
  if (segs.length > 1){ it.title = segs[0]; it.hw.detail = segs.slice(1).join('\n'); }
}
function dateLabel(it){
  if (!it.date) return '';
  const d = dateFrom(it.date);
  if (it.monthOnly) return (d.getMonth() + 1) + '月内';
  let s = (d.getMonth() + 1) + '月' + d.getDate() + '日';
  if (it.dateEnd){
    const e = dateFrom(it.dateEnd);
    s += '–' + (e.getMonth() + 1) + '月' + e.getDate() + '日';
  }
  if (it.time) s += ' ' + it.time;
  return s;
}
/* 转义进 HTML 的文本。**必须带上单引号** —— 当前所有插值点都用双引号包属性，
   所以单引号暂时炸不开；但只要有人日后写了 class='${esc(x)}' 就会漏。
   一次补齐，比等到出问题再全库排查便宜。 */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

/* =============================== 应用层 =============================== */
const LS = 'daibanji.v2';
const LS_OLD = 'daibanji.v1';
/* tags 是唯一的标签库（默认 3 个，用户可任意改名/删除）；customTags 只用于读旧数据。
   filterTags 是筛选栏多选出来的标签集合，空数组＝不筛 */
const S = { items: [], lastBackup: null, view: 'list', filterTags: [], q: '', tags: TAGS_DEFAULT.slice(), statLayout: 'card', hintOpen: false, showHelp: true };
/* 折叠中的目标卡（会话级，不持久化） */
const collapsed = new Set();

/* 数据迁移：老版本存在 daibanji.v1，别丢 */
function load(){
  try {
    let raw = localStorage.getItem(LS);
    if (!raw){
      const old = localStorage.getItem(LS_OLD);
      if (old){ raw = old; localStorage.setItem(LS, old); }
    }
    if (raw){
      const o = JSON.parse(raw);
      S.items = o.items || [];
      S.lastBackup = o.lastBackup || null;
      /* 标签库：老数据只有 customTags（内置 3 个是写死的），迁成一份完整的 S.tags。
         注意要区分「没有 tags 字段」（老数据 → 迁默认值）和「tags 是空数组」
         （用户把标签全删了 → 就得保持空的，不能把默认的三个又塞回来）。 */
      const hasTags = Array.isArray(o.tags);
      const src = hasTags ? o.tags : TAGS_DEFAULT.concat(Array.isArray(o.customTags) ? o.customTags : []);
      S.tags = normTagList(src);
      S.statLayout = o.statLayout === 'tile' ? 'tile' : 'card';
      S.hintOpen = !!o.hintOpen;
      /* 页面说明文字默认开。老数据里没有这个字段 → 保持默认开；
         显式存过 false 才关（不能写成 `!!o.showHelp`，否则老数据会被静默关掉）。 */
      S.showHelp = o.showHelp !== false;
    }
  } catch (e){}
  syncTags();
  save();      // 把迁移后的规范结构写回去（老数据只有 customTags，不写回就一直是旧形状）
}
/* 写盘失败只提示一次。原来是空 catch —— 配额写满（条目多、hw.detail 里贴了大段文字）
   或隐私模式下 localStorage 不可写时，用户只会看到"我明明勾了，刷新就没了"，查不到原因。 */
let saveFailed = false;
function save(){
  try {
    localStorage.setItem(LS, JSON.stringify({
      items: S.items, lastBackup: S.lastBackup, tags: S.tags,
      statLayout: S.statLayout, hintOpen: S.hintOpen, showHelp: S.showHelp
    }));
    saveFailed = false;
  } catch (e){
    if (!saveFailed){
      saveFailed = true;
      toast('保存失败：浏览器写不进去了（空间可能已满，或处于隐私模式），先用「备份」留个底');
    }
  }
}
/* 备份 / 导出的完整快照。**只带 items 是不够的** —— 标签库和外观设置也在这份数据里，
   缺了它们，在另一台电脑上恢复时会静默丢掉自定义标签：条目上还挂着那些标签字符串，
   但筛选栏是标签库驱动的，于是那些标签"筛不到、也删不掉"。 */
function snapshot(){
  return {
    items: S.items, tags: S.tags, statLayout: S.statLayout,
    hintOpen: S.hintOpen, showHelp: S.showHelp, lastBackup: S.lastBackup
  };
}
/* 去空白、去空串、去重（保留先后顺序） */
function normTagList(list){
  const out = [];
  (Array.isArray(list) ? list : []).forEach(t => {
    const v = String(t == null ? '' : t).replace(/^#/, '').trim();
    if (v && out.indexOf(v) < 0) out.push(v);
  });
  return out;
}
/* 标签库变了就同步给解析层，自动猜标签才知道哪些还活着 */
function syncTags(){ ACTIVE_TAGS = S.tags.slice(); }
function uid(){ return Math.random().toString(36).slice(2, 10); }

/* 按标题找未完成条目（精确 → 前缀 → 包含）；找不到就自动建一张目标卡 */
function findOrCreateGoal(title, zone){
  const t = String(title || '').trim();
  if (!t) return null;
  const live = S.items.filter(i => !i.done);
  const hit = live.find(i => i.title === t)
    || live.find(i => i.title.startsWith(t))
    || live.find(i => i.title.includes(t));
  if (hit) return hit;
  const g = {
    id: uid(), raw: t, title: t,
    date: null, dateEnd: null, monthOnly: false, time: null,
    zone: zone || 'long', tags: [], done: false, doneAt: null,
    createdAt: Date.now(), hw: null, repeat: null, parent: null, goal: true, pri: 0
  };
  S.items.unshift(g); return g;
}

function addItem(text){
  const p = parseSmart(text);
  if (!p.title) return null;
  const it = {
    id: uid(), raw: text.trim(), title: p.title,
    date: p.date, dateEnd: p.dateEnd, monthOnly: p.monthOnly, time: p.time,
    zone: p.zone, tags: p.tags, done: false, doneAt: null,
    createdAt: Date.now(), hw: null, repeat: p.repeat || null,
    parent: null, goal: !!p.goal, pri: p.pri || 0
  };
  // 祖先链逐级挂靠：'写论文> 第一周> 查文献' → 论文 ← 第一周 ← 查文献
  if (p.path && p.path.length){
    let prev = null;
    for (const seg of p.path){
      const node = findOrCreateGoal(seg, prev ? prev.zone : 'long');
      if (!node) break;
      if (prev && node.id !== prev.id) node.parent = prev.id;
      if (node.goal !== true) node.goal = true;
      prev = node;
    }
    if (prev && prev.id !== it.id) it.parent = prev.id;
  }
  if (/作业/.test(p.title)){
    it.hw = { course: guessCourse(p.title), detail:'', channel: guessChannel(text), naming: guessNaming(text), status:'todo', submittedAt:null };
    splitHw(it, p);
  }
  /* 正文里写的 #标签 也进标签库，但**要守同一个上限** —— addTag() 有 TAG_MAX 检查，
     这里原来没有，连续录入十几种新标签就能把库撑过 24，而管理弹窗还显示"30 / 24 个标签"。 */
  (p.tags || []).forEach(t => {
    if (S.tags.indexOf(t) < 0 && S.tags.length < TAG_MAX) S.tags.push(t);
  });
  syncTags();
  S.items.unshift(it);
  justAdded = { id: it.id, t: Date.now() };   // 渲染时给这一条挂 .just-added，播一次落位
  save(); return it;
}

/* ---------------- 渲染 ---------------- */
const view = document.getElementById('view');
/* 分栏顺序写死在 renderList 里（长期 → 短期 → 循环，考虑单独铺满一行），这里不再放一份 */

/* 入场动画只在「切视图」时播一次。
   纯数据更新（回车加一条、打个勾、换个标签）不重播 —— 因为渲染是整体重建 innerHTML，
   .is-visible 会随之销毁，若照常播动画，每次回车都会把整页卡片重新淡入 + 去模糊一遍，
   条目上百时既卡又闪。 */
let ANIM = true;
function rv(){ return ANIM ? ' reveal-on-scroll' : ''; }
function rvd(ms){ return ANIM ? ` style="--delay:${ms}ms"` : ''; }
/* 长期区积压提醒：每次会话只问一次 */
let staleToastShown = false;
/* 刚录入的那一条：只让它播一次落位动画，别让整页重渲染时全列表一起播。
   用 id + 时间戳而不是一个"用完就清"的标记 —— 万一这条被筛掉了没渲染，
   标记也就自然过期，不会留到下一次刷新去污染别的条目。 */
let justAdded = { id: '', t: 0 };

/* 筛选栏可以多选：选中的标签之间是「或」——挂着其中任意一个就显示出来。
   同时搜索框再做一次标题/原文的过滤。 */
function ordered(){
  const q = (S.q || '').trim().toLowerCase();
  return S.items
    .filter(i => !S.filterTags.length || S.filterTags.some(t => (i.tags || []).includes(t)))
    .filter(i => !q || (i.title || '').toLowerCase().includes(q) || (i.raw || '').toLowerCase().includes(q));
}
function chipDate(it){
  const dl = dateLabel(it);
  if (!dl) return '';
  let cls = 'chip date';
  const df = daysFromToday(it.date);
  if (df < 0) cls += ' late'; else if (df === 0) cls += ' today';
  const txt = it.done ? dl : (df < 0 ? dl + ' · 逾期' + (-df) + '天' : (df === 0 ? dl + ' · 今天' : dl));
  return `<span class="${cls}">${txt}</span>`;
}
/* 区内排序：重要度优先（紧急 > 重要 > 普通），再按日期先近后远，最后新加入的在前 */
function cmpItem(a, b){
  const pa = a.pri || 0, pb = b.pri || 0;
  if (pa !== pb) return pb - pa;
  /* 必须先把「两边同日期」这种情况排除掉再返回 -1/1：原来写成 `a.date && b.date ? (a<b?-1:1)`，
     日期相等时两个方向都返回 1，违反反对称性 —— sort 拿到不一致的比较函数，
     结果由引擎实现决定、不保证稳定，而且下面那条"新加入的在前"的兜底永远走不到。 */
  if (a.date && b.date && a.date !== b.date) return a.date < b.date ? -1 : 1;
  if (a.date && !b.date) return -1;
  if (!a.date && b.date) return 1;
  return b.createdAt - a.createdAt;
}

/* 紧急度 0~4，行首那颗点、时间轴上的节点都用它上色：
   0 灰＝没日期也不循环（还没到时候）   1 黄＝这周内   2 橙＝三天内或循环到期当天
   3 红＝逾期、或标了 !                 4 深红＝标了 !!
   人工标的优先：写 !! 你就说它最急，不该被「还早」的日期压下去。 */
const URG_TXT = ['不急', '这周内', '三天内', '逾期 / 重要', '紧急'];
function urgencyLevel(it){
  if (it.done) return 0;                        // 完成就没有紧急度可言，一律灰点收着
  const pri = it.pri || 0;
  if (pri >= 2) return 4;
  if (pri === 1) return 3;
  const df = it.date ? daysFromToday(it.date) : null;
  /* 循环任务看的是节奏不是死线：平时黄点惦记着，到期当天升橙，漏了一天算红。
     否则「每1天 喂寄居蟹」会天天挂在橙/红上，看两天就麻木了。 */
  if (it.repeat) return df === null ? 1 : (df < 0 ? 3 : (df === 0 ? 2 : 1));
  if (df === null) return 0;
  if (df < 0) return 3;
  if (df <= 3) return 2;
  if (df <= 7) return 1;
  return 0;
}

function itemHTML(it, kidsHTML, goalInfo){
  /* 标签名和 id 都必须转义：标签名来自用户输入（重命名时 normTagList 只去 # 和空白），
     id 来自备份 json（外部数据）。不转义的话，名字里带一个英文引号就会把属性截断 ——
     实测标签名设为 a"b 时 data-tag 读回来是 "a"，列表 DOM 直接坏掉，而且很难看出原因。
     注意 tagPillHTML() 一直是转义的，这里没跟上，才是不一致的那一处。 */
  const tags = (it.tags || []).map(t => `<span class="chip" data-tag="${esc(t)}" data-id="${esc(it.id)}">${esc(t)}</span>`).join('');
  // overdue 只用来把标题染红；紧急度不再靠这些类，统一由行首那颗 udot 表达
  // stale 给长期区放了超 30 天的条目挂一个「放了N天」chip
  const overdue = !it.done && it.date && daysFromToday(it.date) < 0;
  const staleDays = (!it.done && !it.date && it.zone === 'long' && it.createdAt)
    ? Math.floor((Date.now() - it.createdAt) / 86400000) : 0;
  const stale = staleDays > 30;
  const pri = it.pri || 0;
  const cls = 'item' + (it.done ? ' done' : '') + (overdue ? ' overdue' : '') + (stale ? ' stale' : '')
    + (pri ? ' pri' + pri : '') + (goalInfo ? ' goal' : '')
    + (it.id === justAdded.id && Date.now() - justAdded.t < 1200 ? ' just-added' : '');
  const lvl = urgencyLevel(it);
  return `<div class="${cls}" data-id="${esc(it.id)}" data-u="${lvl}">
    <div class="lead">
      <span class="udot u${lvl}" title="紧急度：${URG_TXT[lvl]}"></span>
      <button class="tick" data-act="tick" title="完成">✓</button>
    </div>
    <div class="body">
      <div class="t" data-act="edit">${esc(it.title)}</div>
      <div class="meta">
        ${goalInfo ? `<span class="chip goalchip" data-act="fold" data-id="${esc(it.id)}" aria-expanded="${goalInfo.folded ? 'false' : 'true'}" title="展开/收起子任务">${goalInfo.folded ? '▸' : '▾'} ${goalInfo.done}/${goalInfo.total}</span>` : ''}
        ${pri ? `<span class="chip prichip p${pri}">${pri === 2 ? '紧急' : '重要'}</span>` : ''}
        ${chipDate(it)}
        ${it.repeat ? `<span class="chip rep">每${it.repeat === 1 ? '' : it.repeat}天</span>` : ''}
        ${it.goal && !goalInfo ? '<span class="chip goalchip">目标</span>' : ''}
        ${it.hw ? '<span class="chip hwchip">作业</span>' : ''}
        ${stale ? `<span class="chip old">放了${staleDays}天</span>` : ''}
        ${tags}
      </div>
      ${kidsHTML || ''}
    </div>
    <div class="acts">
      <button class="mini" data-act="edit" title="编辑">✎</button>
      <button class="mini" data-act="del" title="删除">✕</button>
    </div>
  </div>`;
}

function renderList(){
  let h = `<div class="section-intro${rv()}">
    <p class="section-kicker">Today</p>
    <h2>今天要做什么</h2>
    <p class="intro-note">没日期的沉长期，有死线的进短期，带节奏的走循环，行尾带 <b class="mono">?</b> 的去考虑 —— 你不用先想它属于哪。<br>
       每条最左边那颗点按紧急度上色：灰 → 黄 → 橙 → 红 → 深红，鼠标停上去会说是哪一档。</p>
  </div>`;

  h += `<div class="toolbar${rv()}"${rvd(60)}>
    <div class="tb-row search-row">
      <input class="search" id="searchBox" type="text" aria-label="搜索标题关键词" placeholder="搜索标题关键词…" value="${esc(S.q || '')}">
      <button class="btn ghost" id="importBtn">粘贴导入</button>
      <button class="btn ghost" id="exportBtn">备份</button>
    </div>
    <div class="tb-row tag-row">
      <!-- tabindex=0：标签一多这条就横向滚，键盘用户得能聚焦到它才滚得动（方向键） -->
      <div class="pillstrip" id="filters" tabindex="0" role="group" aria-label="按标签筛选"></div>
      ${tagActsHTML}
    </div>
  </div>`;

  h += '<div class="board">';

  /* ---- 复合目标：树形渲染 ----
     vis = 搜索/标签过滤后的可见集（子任务可见时，祖先链强制可见）；
     kids = 父id → 可见且未完成的子任务；根 = 无父 / 父不存在 / 父已完成 */
  const byId = new Map(S.items.map(i => [i.id, i]));
  const vis = new Set(ordered().map(i => i.id));
  for (const i of ordered()){
    let cur = i;
    while (cur.parent && byId.has(cur.parent)){
      const p = byId.get(cur.parent);
      if (p.done) break;
      vis.add(p.id);
      cur = p;
    }
  }
  const kids = new Map();
  for (const i of ordered()){
    if (i.done || !i.parent || !byId.has(i.parent)) continue;
    const p = byId.get(i.parent);
    if (p.done) continue;
    if (!kids.has(i.parent)) kids.set(i.parent, []);
    kids.get(i.parent).push(i);
  }
  kids.forEach(arr => arr.sort(cmpItem));
  /* 每个节点都要数一遍自己**全部**子任务（含已完成、含被过滤掉的），用来显示 ▾ 3/5 那个角标。
     原来这行是 `S.items.filter(x => x.parent === it.id)`，而它在 renderTree 里 ——
     一次渲染里整个数组被扫「节点数」遍，是 O(n²)。这里进函数前建一次索引降到 O(n)。
     注意它和上面的 kids 语义不同：kids 只收「可见且未完成」，这里收所有，
     所以不能合并成一张表。 */
  const byParent = new Map();
  for (const i of S.items){
    if (!i.parent) continue;
    if (!byParent.has(i.parent)) byParent.set(i.parent, []);
    byParent.get(i.parent).push(i);
  }
  function renderTree(it){
    /* 子任务**始终**渲染进 DOM，折叠只加一个 display:none。
       为什么不能沿用「折叠就不渲染」：高度过渡必须"先渲染再塌陷" ——
       展开时若等结构建好再补动画，会先闪一下完整高度；收起时若结构已经不在，
       就无高度可量，只能硬切。留在 DOM 里的代价只是折叠的子树多占一点内存。 */
    const children = kids.get(it.id) || [];
    const allKids = byParent.get(it.id) || [];
    const folded = collapsed.has(it.id);
    const info = (it.goal || allKids.length)
      ? { total: allKids.length, done: allKids.filter(x => x.done).length, folded }
      : null;
    const kidsHTML = children.length
      ? `<div class="goal-kids${folded ? ' folded' : ''}" data-kids="${esc(it.id)}">` + children.map(renderTree).join('') + `</div>`
      : '';
    return itemHTML(it, kidsHTML, info);
  }
  /* 根列表从 vis 取而不是 ordered —— 搜索/标签过滤命中子任务时，祖先目标是补进 vis 的；
     循环任务不混进 zone，它自己一栏 */
  const rootList = k => S.items.filter(i => {
    if (i.done || i.zone !== k || !vis.has(i.id) || i.repeat) return false;
    const p = i.parent && byId.get(i.parent);
    return !p || p.done;                          // 根：无父 / 父不存在 / 父已完成
  }).sort(cmpItem);

  const repList = ordered()
    .filter(i => !i.done && i.repeat && vis.has(i.id) && !(i.parent && byId.get(i.parent) && !byId.get(i.parent).done))
    .sort(cmpItem);

  /* 三栏顺序＝「要管的程度」从松到紧：长期（最没期限）→ 短期（有死线）→ 循环（节奏固定）。
     「考虑」不算待办，只在这儿暂存想法，铺满整行收在最后，不挤进这三栏。 */
  const cols = [
    { k:'long',   label:'长期', list: rootList('long'),  empty:'空' },
    { k:'short',  label:'短期', list: rootList('short'), empty:'空' },
    { k:'repeat', label:'循环', cls:' repeat-zone', list: repList,
      empty:'还没有循环任务。写「每2天 喂寄居蟹」，打勾后自动排下一次。' },
  ];
  cols.forEach((c, zi) => {
    h += `<section class="glass zone${c.cls || ''}${rv()}" data-z="${c.k}"${rvd(100 + zi * 80)}>
      <header><span class="dot"></span><h3>${c.label}</h3><span class="n mono">${c.list.length}</span></header>
      ${c.list.length ? c.list.map(renderTree).join('') : `<div class="empty">${c.empty}</div>`}
    </section>`;
  });

  /* 考虑区：这里放的是「还没决定要不要做」的事，不是待办 —— 不占三栏之一，
     靠 grid-column:1/-1 铺满整行落在所有栏目脚下，绿点跟上面三栏的蓝点分开。
     必须写在 .board 里面：它是这个网格的一个 item，行间距（gap）才管得到它。
     以前这段渲染在 .board 外面（`</div>` 提前把看板关掉了），后果是
     grid-column 空转、而且它紧贴着看板一个像素都不隔 —— 看着像跟「循环」粘成一张卡。 */
  const conList = rootList('consider');
  h += `<section class="glass zone zone-wide${rv()}" data-z="consider"${rvd(360)}>
    <header><span class="dot"></span><h3>考虑</h3><span class="n mono">${conList.length}</span></header>
    ${conList.length ? conList.map(renderTree).join('')
      : '<div class="empty">这儿暂存「还没想好要不要做」的事。写的时候在结尾加个 <b class="mono">?</b>，它就会落到这儿，不占上面三栏。</div>'}
  </section>`;

  h += '</div>';   // 关掉 .board（放在考虑区之后）

  // 长期区积压提醒：每次会话只问一次；备份提醒更重要，它要弹时这里让位
  const backupStale = !S.lastBackup || Date.now() - S.lastBackup >= 7 * 86400000;
  const staleCount = S.items.filter(i => !i.done && !i.date && i.zone === 'long' &&
    i.createdAt && (Date.now() - i.createdAt) > 30 * 86400000).length;
  if (staleCount && !staleToastShown && !backupStale){
    staleToastShown = true;
    setTimeout(() => toast('长期区有 ' + staleCount + ' 条放了超过 30 天，看看要不要处理掉', null, null, 8000), 800);
  }

  // 时间线已经单开一页（导航「时间轴」），清单页不再重复贴一份
  // 「已完成」栏目也已去掉：完成态不在清单页展示，只在统计页计数

  view.innerHTML = h;
}

/* 时间线卡片：作业条目带课程/渠道/状态按钮，普通条目带完成/编辑 */
function tlCardHTML(it){
  const df = it.date ? daysFromToday(it.date) : null;
  const dl = it.date ? (df < 0 ? dateLabel(it) + ' · 逾期' + (-df) + '天' : (df === 0 ? dateLabel(it) + ' · 今天' : dateLabel(it))) : '未定截止';
  const chips = `<span class="chip ${df !== null && df < 0 ? 'late' : (df === 0 ? 'today' : '')}">${dl}</span>` +
    (it.pri ? `<span class="chip prichip p${it.pri}">${it.pri === 2 ? '紧急' : '重要'}</span>` : '') +
    (it.repeat ? `<span class="chip rep">每${it.repeat === 1 ? '' : it.repeat}天</span>` : '') +
    (it.tags || []).map(t => `<span class="chip" data-tag="${esc(t)}" data-id="${esc(it.id)}">${esc(t)}</span>`).join('');

  if (it.hw){
    const hw = it.hw;
    const st = [['todo','未开始'], ['doing','在做'], ['submitted','已交']];
    return `<article class="glass hwcard" data-id="${esc(it.id)}">
      <div class="top"><span class="course">${esc(hw.course || '未分类')}</span>${chips}</div>
      <h3>${esc(it.title)}</h3>
      ${hw.detail ? `<div class="detail">${esc(hw.detail)}</div>` : ''}
      <div class="grid">
        ${hw.channel ? `<b>提交渠道</b><span>${esc(hw.channel)}</span>` : ''}
        ${hw.naming ? `<b>命名要求</b><span class="mono">${esc(hw.naming)}</span>` : ''}
        ${hw.submittedAt ? `<b>交于</b><span class="mono">${esc(hw.submittedAt)}</span>` : ''}
      </div>
      <div class="statuses">
        ${st.map(([k, t]) => `<button class="st ${hw.status === k ? 'on' : ''}" data-s="${k}" data-act="st" data-id="${esc(it.id)}">${t}</button>`).join('')}
        <button class="mini" data-act="edit" data-id="${esc(it.id)}" style="margin-left:auto">编辑</button>
      </div>
    </article>`;
  }
  return `<article class="glass hwcard" data-id="${esc(it.id)}">
    <div class="top">${chips}</div>
    <h3>${esc(it.title)}</h3>
    <div class="statuses">
      <button class="st" data-act="tick" data-id="${esc(it.id)}">完成</button>
      <button class="mini" data-act="edit" data-id="${esc(it.id)}" style="margin-left:auto">编辑</button>
    </div>
  </article>`;
}

/* 时间轴页：一条左侧竖轴，所有带日期的未完成任务按截止日从近到远上下排 */
function renderTimeline(){
  const list = S.items.filter(i => !i.done && i.date)
    .sort((a, b) => { const A = a.date || '', B = b.date || ''; return A < B ? -1 : A > B ? 1 : 0; });
  const late = list.filter(i => daysFromToday(i.date) < 0).length;

  view.innerHTML = `<div class="section-intro${rv()}">
      <p class="section-kicker">Timeline</p>
      <h2>时间轴</h2>
          <p class="intro-note">所有写了日期的未完成任务，按截止日从近到远上下排。<br>
             点越红越急：灰＝还早，黄＝这周内，橙＝三天内，红＝逾期，深红＝标了 <b class="mono">!!</b>。</p>
    </div>` +
    (list.length
      ? `<div class="tl-section${rv()}">
          <div class="tl-meta">共 ${list.length} 条${late ? ' · 其中逾期 ' + late + ' 条' : ''}</div>
          <ol class="timeline">` + list.map((it, hi) => {
            const lv = urgencyLevel(it);
            /* 入场错峰最多算 12 步，否则第 30 条要等 1.5 秒才出现 */
            return `<li class="tl-item${rv()}"${rvd(80 + Math.min(hi, 12) * 50)} data-u="${lv}" title="紧急度：${URG_TXT[lv]}">
              <span class="tl-node"></span>
              ${tlCardHTML(it)}
            </li>`;
          }).join('') + `</ol></div>`
      : `<div class="glass zone${rv()}" style="margin-top:clamp(30px,4vw,48px)">
          <div class="empty">还没有带日期的任务。在录入时写个日期，它就会排到这里 ——
            比如「交实验报告 924」「明天 买牙膏」「周四之前 交表」。</div>
        </div>`);
}

function streak(){
  const days = new Set(S.items.filter(i => i.done && i.doneAt).map(i => ymd(new Date(i.doneAt))));
  let n = 0; const d = today0();
  if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
  while (days.has(ymd(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderStat(){
  const today = ymd(today0());
  const doneItems = S.items.filter(i => i.done);
  const doneTodayList = doneItems.filter(i => i.doneAt && ymd(new Date(i.doneAt)) === today);
  const overdue = S.items.filter(i => !i.done && i.date && daysFromToday(i.date) < 0).length;
  const hwOpen = S.items.filter(i => i.hw && !i.done && i.hw.status !== 'submitted').length;
  const doneAll = doneItems.length;
  const st = streak();
  const tile = S.statLayout === 'tile';

  /* 完成量按来源拆开：循环 / 短期 / 长期 / 考虑。
     清单页每个分区标题本来就带未完成条数，这里就不重复列分区待办数了。 */
  function byOrigin(list){
    const c = { short: 0, long: 0, consider: 0, loop: 0 };
    list.forEach(i => { if (i.repeat) c.loop++; else if (c[i.zone] !== undefined) c[i.zone]++; });
    return c;
  }
  function breakdown(list){
    const c = byOrigin(list);
    const total = c.short + c.long + c.consider + c.loop;
    if (!total) return tile ? `<div class="vsub">还没有打勾</div>`
                            : `<div class="vchips"><span class="vchip">还没有打勾</span></div>`;
    if (tile){                                   /* 方块太小，chips 会挤爆 → 收成一行小字 */
      const parts = [];
      if (c.short) parts.push('短期 ' + c.short);
      if (c.long) parts.push('长期 ' + c.long);
      if (c.consider) parts.push('考虑 ' + c.consider);
      if (c.loop) parts.push('循环 ' + c.loop);
      return `<div class="vsub">${parts.join(' · ')}</div>`;
    }
    const chip = (label, n, cls) => `<span class="vchip ${cls || ''}">${label}<b>${n}</b></span>`;
    return `<div class="vchips">` + chip('短期', c.short) + chip('长期', c.long) +
      (c.consider ? chip('考虑', c.consider) : '') + chip('循环', c.loop, 'loop') + `</div>`;
  }

  const cards = [
    { k: '今日完成', v: doneTodayList.length, s: '条', cls: 'accent big', sub: breakdown(doneTodayList) },
    { k: '连续打勾', v: st, s: '天没断', cls: 'big',
      tip: '连着多少天，每天都至少打勾一次。今天还没打勾不算断，从昨天往前数。' },
    /* 已逾期和作业未交合成一张卡：都是「欠着的」，平时又常是 0，各占一张太浪费地方。
       卡里并排两个指标，三层排版（标签/大数字/单位）跟别的卡一模一样。 */
    { cls: 'pair', pair: [
      { k: '已逾期', v: overdue, s: '条' },
      { k: '作业未交', v: hwOpen, s: '项' }
    ] },
    { k: '历史完成', v: doneAll, s: '条', cls: '', sub: breakdown(doneItems) }
  ];

  /* 「布局 横条/方块」这一行原来没挂揭示类：整页别的东西都在淡入去模糊，
     只有它（和紧接着的卡片）"啪"地出现 —— 切进统计页时就显得很生硬。
     现在跟其它区块同一条入场，延迟排在标题之后、卡片之前。 */
  view.innerHTML = `<div class="section-intro${rv()}">
      <p class="section-kicker">Progress</p>
      <h2>这些天</h2>
      <p class="intro-note">只统计这台电脑上的这份数据。<b>连续打勾</b>＝连着多少天每天都至少打过一次勾，<br>今天还没打勾不算断，从昨天往前数。</p>
    </div>
    <div class="stat-toolbar${rv()}"${rvd(30)}>
      <span class="len">布局</span>
      <span class="seg">
        <button class="segbtn${tile ? '' : ' on'}" data-lay="card" title="横条：宽卡片竖着排">▤ 横条</button>
        <button class="segbtn${tile ? ' on' : ''}" data-lay="tile" title="方块：方形平铺">▦ 方块</button>
      </span>
    </div>
    <div class="feature-grid${tile ? ' tile' : ''}">` + cards.map((c, ci) => {
      const tip = c.tip ? ' title="' + c.tip + '"' : '';
      /* 一张卡里放几个指标：pair 的卡走两列，普通卡一列 + 可选细分 */
      const cols = c.pair || [c];
      const inner = cols.map(x =>
        `<div class="pcol"><div class="k">${x.k}</div><div class="v">${x.v}</div><div class="s">${x.s}</div>` +
        (x.sub || '') + `</div>`).join('');
      return `<div class="glass feature-card ${c.cls}${rv()}"${rvd(60 + ci * 50)}${tip}>
        ${inner}
      </div>`;
    }).join('') + `</div>`;

  countUpNumbers();
}

/* ---------- 设置页 ---------- */

/* 「外观 → 页面说明文字」的总开关。
   实现成一个 body 属性 + 一条 CSS（见 body[data-help="off"] .intro-note），
   不在清单/时间轴/统计三个视图里各写一份判断 —— 所以切换时不需要重渲染，
   当前页和之后切过去的每一页都会自动跟上，页面也不会跳一下。
   启动时（load 之后）就要调一次：refresh 是 rAF 延迟的，等它来会先闪一下那段字。 */
function applyHelp(){ document.body.dataset.help = S.showHelp ? 'on' : 'off'; }

/* 设置页。
   目前只有「外观」一栏、一个开关 —— 故意保持这么小：页面上真正需要用户决定的事情
   只有"屏幕上有多少字"。开关用 role="switch" + aria-checked 表达状态（键盘可达、
   读屏能读出开/关），位置状态也由 aria-checked 驱动，不在 CSS 里另存一套类名。 */
function renderSettings(){
  view.innerHTML = `<div class="section-intro${rv()}">
      <p class="section-kicker">Settings</p>
      <h2>设置</h2>
    </div>
    <div class="set-wrap">
      <section class="glass set-card${rv()}"${rvd(60)}>
        <h3>外观</h3>
        <p class="set-sub">只管"屏幕上出现什么"，不动你的数据。改完立刻生效，存在这台电脑上。</p>
        <div class="set-row">
          <div class="set-txt">
            <b>页面说明文字</b>
            <span>清单 / 时间轴 / 统计页标题下面那段解释文案（分区规则、色阶含义这类）。
              关掉只收掉这些字：条数、逾期这类数字照旧显示，列表空着时的引导提示也不会消失。</span>
          </div>
          <button class="switch" data-set="help" role="switch" aria-label="显示页面说明文字"
                  aria-checked="${S.showHelp ? 'true' : 'false'}"></button>
        </div>
        <!-- 流畅模式原来在顶栏（一颗 ⚡）。撤掉是因为手机上它和主题滑块一起挤掉了标题，
             功能本身有用（老机型 / 软件渲染滚动更顺），所以搬到这里。
             aria-checked 直接读 html.soft-render —— 那是唯一真相：
             它由"软件渲染自动检测"或"用户手动选择"共同决定，这里不另存一份状态。 -->
        <div class="set-row">
          <div class="set-txt">
            <b>流畅模式</b>
            <span>关掉玻璃模糊、背景点阵和入场动画，老机型滚动明显更顺。
              检测到设备在用软件渲染时会自动打开；这里的开关可以手动覆盖它。</span>
          </div>
          <button class="switch" data-set="lite" role="switch" aria-label="流畅模式"
                  aria-checked="${document.documentElement.classList.contains('soft-render') ? 'true' : 'false'}"></button>
        </div>
      </section>
    </div>`;
}

/* 统计页大数字滚动计数：从 0 数到目标值。
   原来数字是"啪"一下出现的，看不出"涨了多少"；数一下能让增减有感知。
   三个必须守住的点：
   ① 结束时**必须**写回精确目标值 —— 动画中途被打断（切页、切布局）也不能留下错数字；
   ② 0 不数（"0 → 0"没有意义，反而多闪一下）；
   ③ reduced-motion 直接跳过，尊重系统设置。
   元素是每次 renderStat 重建的，旧动画里的 el 已脱离文档，写它也不会污染新页面。 */
function countUpNumbers(){
  if (reduceMotion()) return;
  const DUR = 460;
  view.querySelectorAll('.feature-grid .v').forEach(el => {
    const to = parseInt(String(el.textContent).trim(), 10);
    if (!isFinite(to) || to <= 0) return;
    const t0 = performance.now();
    el.textContent = '0';
    el.setAttribute('data-counting', '1');       // 给测试一个"还在数"的抓手
    const step = now => {
      if (!el.isConnected) return;               // 已被下次渲染换掉，别再写
      const p = Math.min(1, (now - t0) / DUR);
      const e = 1 - Math.pow(1 - p, 3);          // easeOutCubic：开头快、收尾稳
      el.textContent = String(Math.round(to * e));
      if (p < 1) requestAnimationFrame(step);
      else { el.textContent = String(to); el.removeAttribute('data-counting'); }
    };
    requestAnimationFrame(step);
  });
}

/* 标签条右端固定的那组按钮（两处标签栏共用一份 HTML）。
   放在滚动区外面，标签滚起来的时候它们不会跟着跑。 */
const tagActsHTML =
  `<div class="tagacts">` +
    `<button class="pill addpill" data-act="addtag" title="新建标签（回车确认）">＋</button>` +
    `<button class="pill addpill" data-act="managetag" title="管理标签：改名 / 删除">⚙</button>` +
  `</div>`;

function renderFilters(){
  const box = document.getElementById('filters');
  if (!box) return;
  const n = S.filterTags.length;
  /* 「全部」在不筛选时就是个静态状态；一旦选了标签，它就变成一键清空 */
  const clearPulse = filterPulse === '' ? ' pulse' : '';
  box.innerHTML = `<button class="pill${n ? '' : ' on'}${clearPulse}" data-f="" title="${n ? '清空筛选' : '不筛选'}">` +
      (n ? '清空 (' + n + ')' : '全部') + `</button>` +
    S.tags.map(t => tagPillHTML(t, 'filter')).join('');
  filterPulse = null;   // 只在"被点中的那一次刷新"里生效，别让后面的无关刷新重播
  restoreStripScroll(box);
}

/* 两处标签条都是「整块重建 innerHTML」来刷新的：筛选栏那条更狠 ——
   refresh() 会把整个 #view 重画一遍，连它自己都是新元素。
   所以横滚位置不能靠重建前后读一次，得单独记一份，重建后还回去，
   否则滚到右边点一颗标签，整条立刻弹回开头，很难连着选几个。 */
const stripScrollX = { filters: 0, entryStrip: 0 };
document.addEventListener('scroll', e => {
  const el = e.target;
  if (el && el.id && el.id in stripScrollX) stripScrollX[el.id] = el.scrollLeft;
}, true);
function restoreStripScroll(el){
  if (el && el.id in stripScrollX) el.scrollLeft = stripScrollX[el.id];
}

/* 标签条的边缘渐隐开关（CSS 那边有三条 mask 规则）。
   判据是"这一侧是否真的还有内容被切住"：
   - scrollWidth <= clientWidth（压根没溢出）→ 两侧都不渐隐；
   - scrollLeft 已经在 0 → 左边没东西被切，别把第一颗 pill 淡化；
   - 已经滚到底（scrollLeft ≈ max）→ 右边同理。
   留 1px 容差：某些缩放下 scrollLeft 会是 1.0001 这种小数，卡死等号会让边缘反复闪。
   统一挂类而不是写 inline 样式，是为了让"要不要渐隐"只由这一处决定。 */
function syncStripFades(){
  document.querySelectorAll('.pillstrip').forEach(el => {
    const max = el.scrollWidth - el.clientWidth;
    const scrollable = max > 1;
    el.classList.toggle('fade-l', scrollable && el.scrollLeft > 1);
    el.classList.toggle('fade-r', scrollable && el.scrollLeft < max - 1);
  });
}
/* 捕获阶段监听：滚动事件不冒泡，但在捕获阶段能收到子元素的滚动 ——
   条子自己滚、页面滚（可能把整条滑出视口）、窗口变宽变窄，都要重算。 */
document.addEventListener('scroll', syncStripFades, true);
window.addEventListener('resize', syncStripFades);

/* 刚被点中的那颗筛选标签。筛选栏每次 refresh 都整块重建，没有元素可以复用，
   所以只能给"这一颗"补一段入场动画把状态切换接上（见 CSS .pill.pulse / @keyframes pillOn）。
   用完立刻清空 —— 否则下一次无关的 refresh（搜索、打勾…）会把旧的那颗又播一遍。 */
let filterPulse = null;

/* 标签 pill：一律带 × 可删（内置的那三个也能删，所有标签一视同仁）。
   mode='filter' 点标签＝加入/移出筛选（可多选）；mode='entry' 点标签＝给之后录入的条目加/去这个标签（可多选） */
function tagPillHTML(t, mode){
  const entryMode = mode === 'entry';
  const on = entryMode ? entryTagSet.has(t) : S.filterTags.indexOf(t) >= 0;
  const attr = entryMode ? `data-et="${esc(t)}"` : `data-f="${esc(t)}"`;
  /* 筛选栏那颗刚被点中的补一个入场：选中走 .pulse（无底色→实底），
     取消走 .pulse-off（实底→无底色）。它整块重画、没有元素可复用，
     只能靠动画把这次状态切换接上。 */
  const pulse = (!entryMode && t === filterPulse) ? (on ? ' pulse' : ' pulse-off') : '';
  return `<span class="pillwrap"><button class="pill${on ? ' on' : ''}${pulse}" ${attr}>${esc(t)}</button>` +
    `<button class="pill-x" data-act="deltag" data-t="${esc(t)}" title="删除「${esc(t)}」">×</button></span>`;
}

/* 录入区标签条的选中态：**就地改 class，绝不重建 innerHTML**。
   以前点一颗标签就把整条 innerHTML 重画一遍，节点全是新的 ——
   CSS 上那条 transition 压根没有可过渡的旧状态，于是"选中"永远是硬切一下
   （用户说的"过渡非常生硬"就是这个）。就地改还有个附带好处：
   整条标签栏的横向滚动位置不会因为重画而弹回开头。 */
function syncEntryTagUI(){
  const box = document.getElementById('entryTags');
  if (!box) return;
  box.querySelectorAll('[data-et]').forEach(b => {
    b.classList.toggle('on', entryTagSet.has(b.dataset.et));
  });
  const n = entryTagSet.size;
  const old = box.querySelector('.et-n');
  if (n && old) old.textContent = '已选 ' + n;
  else if (n && !old){
    const s = document.createElement('span');
    s.className = 'et-n mono';
    s.title = '当前已选，回车录入时会加到条目上';
    s.textContent = '已选 ' + n;
    box.insertBefore(s, box.querySelector('.pillstrip'));
  }
  else if (!n && old) old.remove();
}

/* 录入区标签栏：可以多选，选中的标签会一起加到之后录入的条目上（再点一次取消）。
   和筛选栏共用同一套标签库，但不共用选中状态。
   结构＝[标签] [已选 N] [可横向滚动的标签条] [＋ ⚙]：
   标签多的时候只有中间那条滚，「已选几」和加标签按钮一直看得见。 */
function renderEntryTags(){
  const box = document.getElementById('entryTags');
  if (!box) return;
  const n = entryTagSet.size;
  box.innerHTML = `<span class="et-l">标签</span>` +
    (n ? `<span class="et-n mono" title="当前已选，回车录入时会加到条目上">已选 ${n}</span>` : '') +
    `<div class="pillstrip" id="entryStrip" tabindex="0" role="group" aria-label="给之后录入的条目加标签">` + S.tags.map(t => tagPillHTML(t, 'entry')).join('') + `</div>` +
    tagActsHTML;
  restoreStripScroll(document.getElementById('entryStrip'));
}

let rafRefresh = 0;
function refresh(){
  if (rafRefresh) return;
  rafRefresh = requestAnimationFrame(() => {
    rafRefresh = 0;
    if (S.view === 'list') renderList();
    else if (S.view === 'timeline') renderTimeline();
    else if (S.view === 'settings') renderSettings();
    else renderStat();
    renderFilters();
    renderEntryTags();
    ANIM = false;   // 渲染完就关掉，之后的纯数据更新不再重播入场动画

    const total = S.items.filter(i => !i.done).length;
    document.getElementById('counts').textContent = total ? total + ' 条未完成' : '清空了';

    const b = document.getElementById('backup');
    if (!S.lastBackup){ b.textContent = '未备份'; b.className = 'backup warn'; }
    else {
      const d = Math.floor((Date.now() - S.lastBackup) / 86400000);
      b.textContent = d <= 0 ? '今天已备份' : d + ' 天前备份';
      b.className = 'backup' + (d >= 7 ? ' warn' : '');
    }
    document.querySelectorAll('.nav-pill').forEach(x => {
      const on = x.dataset.view === S.view;
      x.classList.toggle('on', on);
      /* 只同步类名的话读屏不知道"现在在哪一页"；aria-current 才是标准说法 */
      if (on) x.setAttribute('aria-current', 'page'); else x.removeAttribute('aria-current');
    });
    moveNavGlide();   // 页签的滑动指示块跟着当前视图走（首帧自动不补间）
    document.body.dataset.view = S.view;   // CSS 据此隐藏统计页不需要的区块
    applyHelp();                           // 「页面说明文字」总开关（切页后 DOM 是新的，这里每帧同步一次最稳）
    observeReveals();
    /* 标签条是这一帧刚重建的，边缘渐隐要按新的 scrollWidth 重算
       （标签增删、筛选栏重置滚动位置都会改变"哪一侧还被切住"）。 */
    syncStripFades();
  });
}

/* 滚动揭示（原站 .reveal-on-scroll + IntersectionObserver） */
let revealIO = null;
function observeReveals(){
  const els = document.querySelectorAll('.reveal-on-scroll:not(.is-visible)');
  if (!els.length) return;
  if (!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('is-visible')); return; }
  if (!revealIO){
    revealIO = new IntersectionObserver(list => {
      list.forEach(en => {
        if (!en.isIntersecting) return;
        const el = en.target;
        el.classList.add('is-visible');
        revealIO.unobserve(el);
        // 入场动画跑完就撤掉 will-change，别让这些图层永久留在合成器里。
        // 注意监听的是 animationend：揭示改成了 animation（见 CSS 里那段说明），
        // 不再有 transitionend 可听。reduced-motion 下动画被全局那条 !important 关掉，
        // 这里就等不到事件 —— 那种情况下浏览器本来也不会为它们建合成层，无需收拾。
        el.addEventListener('animationend', function done(ev){
          if (ev.target !== el || ev.animationName !== 'rvIn') return;
          el.style.willChange = 'auto';
          el.removeEventListener('animationend', done);
        });
      });
    }, { rootMargin:'0px 0px -8% 0px', threshold:0.04 });
  }
  els.forEach(e => revealIO.observe(e));
  clearTimeout(observeReveals._t);
  observeReveals._t = setTimeout(() => {
    document.querySelectorAll('.reveal-on-scroll:not(.is-visible)').forEach(e => {
      if (e.getBoundingClientRect().top < window.innerHeight) e.classList.add('is-visible');
    });
  }, 1400);
}

/* ---------------- toast ---------------- */
let toastTimer = null;
function toast(msg, actionLabel, action, dur){
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>`;
  if (actionLabel){
    const b = document.createElement('button');
    b.textContent = actionLabel;
    b.onclick = () => { action(); hideToast(); };
    el.appendChild(b);
  }
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, dur || 5000);
}
function hideToast(){ document.getElementById('toast').classList.remove('on'); }

/* 备份提醒：数据只在 localStorage 里，超 7 天没备份（或从未备份）就提醒一次，
   并提供「复制备份到剪贴板」——不用导出文件也能快速留底 */
function copyBackup(){
  const json = JSON.stringify(snapshot(), null, 2);
  const done = () => { S.lastBackup = Date.now(); save(); toast('已复制，找个地方（备忘录/网盘）粘贴保存一下'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(done).catch(() => fallbackCopy(json, done));
  } else fallbackCopy(json, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { toast('复制失败，请用「备份」按钮导出文件'); }
  ta.remove();
}
/* 备份提醒：数据只在 localStorage 里，超 7 天没备份（或从未备份）就提醒一次，
   并提供「复制备份到剪贴板」——不用导出文件也能快速留底。

   ⚠️ 这个函数**必须在 load() 之后调用**（见文件末尾的启动块）。
   原来它写成「定义即执行」的 IIFE、位置又落在 load() 之前，守卫读到的 S.lastBackup
   永远是初始值 null，于是**每次打开页面都误报一次**；更别扭的是文案是在下面的 setTimeout
   里才拼的，那时 load() 早跑完了 —— 结果 header 显示"今天已备份"、toast 说"已经 0 天没备份"。 */
function backupNudge(){
  if (S.lastBackup && Date.now() - S.lastBackup < 7 * 86400000) return;
  const d = S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 86400000) : 0;
  setTimeout(() => toast(
    !S.lastBackup ? '数据只存在这台电脑的浏览器里，还没备份过，建议留个底'
                  : '已经 ' + d + ' 天没备份数据了，建议留个底',
    '复制备份', copyBackup, 12000), 1500);
}

/* ---------------- 交互 ---------------- */
/* 标签栏（录入区 + 筛选栏共用一套标签库 S.tags）：点选 / 新建 / 改名 / 删除。
   两处标签条完全平权 —— 内置的「学习/生活/娱乐」也只是默认值，一样能改名和删掉。
   —— 放在 document 级委托，两处标签条改动后都会同步刷新
   注意：筛选栏在 #view 内，而 view 自己的委托只认 tick/edit/fold/tag/f 那几类，
   不认 addtag/deltag/managetag；所以下面只对这几个 act 做委托，且不能按 #view 跳过。 */
let entryTagSet = new Set();      // 录入区多选出来的标签（会话级，不持久化）
const TAG_MAX = 24;

function addTag(name){
  const v = normTagList([name])[0];
  if (!v) return false;
  if (S.tags.indexOf(v) >= 0) return false;
  if (S.tags.length >= TAG_MAX) return false;
  S.tags.push(v); syncTags(); save(); refresh(); return true;
}

/* 删标签：从标签库拿掉，同时把条目上这个标签也摘掉（否则会出现「筛选栏里没有、
   条目上却挂着一个点不到的标签」）。整个操作可撤销。 */
function removeTag(t){
  const k = S.tags.indexOf(t);
  if (k < 0) return false;
  S.tags.splice(k, 1);
  S.filterTags = S.filterTags.filter(x => x !== t);
  entryTagSet.delete(t);
  const touched = [];
  S.items.forEach(i => {
    const j = (i.tags || []).indexOf(t);
    if (j >= 0){ i.tags.splice(j, 1); touched.push(i.id); }
  });
  syncTags(); save(); refresh();
  const undo = () => {
    if (S.tags.indexOf(t) < 0) S.tags.splice(Math.min(k, S.tags.length), 0, t);
    S.items.forEach(i => {
      if (touched.indexOf(i.id) >= 0 && (i.tags || []).indexOf(t) < 0) i.tags.push(t);
    });
    syncTags(); save(); refresh();
  };
  toast('删掉标签「' + t + '」' + (touched.length ? '，' + touched.length + ' 条也一并摘掉' : ''),
        '撤销', undo);
  return true;
}

/* 改标签名：标签库和所有条目一起改，筛选/录入区的选中状态也跟着走 */
function renameTag(from, to){
  const v = normTagList([to])[0];
  const k = S.tags.indexOf(from);
  if (k < 0 || !v) return false;
  if (v === from) return true;                     // 没改动，当成功
  if (S.tags.indexOf(v) >= 0) return false;        // 和别的标签重名
  S.tags[k] = v;
  S.filterTags = S.filterTags.map(x => x === from ? v : x);
  if (entryTagSet.has(from)){ entryTagSet.delete(from); entryTagSet.add(v); }
  S.items.forEach(i => {
    const j = (i.tags || []).indexOf(from);
    if (j >= 0) i.tags[j] = v;
  });
  syncTags(); save(); refresh(); return true;
}

/* 管理标签弹窗：一行一个，输入框直接改名，右边删除；底部加新标签 */
function openTagManager(){
  const row = t => `<div class="tagrow">
      <input type="text" value="${esc(t)}" maxlength="12" data-tagin="${esc(t)}" aria-label="标签名 ${esc(t)}">
      <button class="btn danger" data-tagdel="${esc(t)}" title="删除「${esc(t)}」">删除</button>
    </div>`;
  modal.innerHTML = `<h3 id="modalTitle">管理标签</h3>
    <p class="modal-note">改名字直接在框里改，回车或点到别处生效；删除会把这些条目上的这个标签也一并摘掉，可以撤销。</p>
    <div class="tagrows">${S.tags.length ? S.tags.map(row).join('')
      : '<p class="modal-note">现在一个标签都没有，下面加一个吧。</p>'}</div>
    <div class="tagrow addrow">
      <input type="text" id="tagNew" placeholder="新标签名" maxlength="12">
      <button class="btn primary" id="tagAdd">添加</button>
    </div>
    <div class="foot">
      <span class="modal-note">${S.tags.length} / ${TAG_MAX} 个标签</span>
      <div class="spacer"></div>
      <button class="btn" id="tmClose">关闭</button>
    </div>`;
  openMask();

  modal.querySelectorAll('[data-tagin]').forEach(inp => {
    let busy = false;
    const apply = () => {
      if (busy) return; busy = true;
      const from = inp.dataset.tagin, to = inp.value;
      if (normTagList([to])[0] === from){ busy = false; return; }   // 没改
      if (renameTag(from, to)){ openTagManager(); return; }         // 重开一遍，行里的 data 才是新的
      busy = false;
      inp.value = from;
      toast('改不了：名字不能空着，也不能和别的标签重名');
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); } });
    inp.addEventListener('blur', apply);
  });

  modal.querySelectorAll('[data-tagdel]').forEach(b => {
    b.onclick = () => { removeTag(b.dataset.tagdel); openTagManager(); };
  });

  const addInp = document.getElementById('tagNew');
  const doAdd = () => {
    const v = addInp.value;
    if (!v.trim()){ toast('标签名不能空着'); return; }
    if (!addTag(v)){ toast(S.tags.length >= TAG_MAX ? '标签太多了，先删几个' : '这个标签已经有了'); return; }
    openTagManager();
  };
  document.getElementById('tagAdd').onclick = doAdd;
  addInp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); doAdd(); } });
  document.getElementById('tmClose').onclick = closeModal;
  addInp.focus();
}

document.addEventListener('click', e => {
  const et = e.target.closest('[data-et]');
  if (et){
    const t = et.dataset.et;                     // 多选：点一下加入，再点移出
    if (entryTagSet.has(t)) entryTagSet.delete(t);
    else {
      /* 一条最多 TAG_PER_ITEM 个标签，超了就在这里拦住，
         不然用户选了 5 个、录入时被悄悄砍掉一个，会觉得"选了没用" */
      if (entryTagSet.size >= TAG_PER_ITEM){ toast('每条最多 ' + TAG_PER_ITEM + ' 个标签'); return; }
      entryTagSet.add(t);
    }
    /* 就地改 class，不重建 —— 这样 .pill 上那条 transition 才播得出来（见 syncEntryTagUI） */
    syncEntryTagUI(); return;
  }
  /* 新建 / 改名 / 删除标签：两处标签条（录入区 + 筛选栏）都走这里。
     筛选栏在 #view 里，而 view 的委托只认 tick/edit/fold 那几类，不认这几个 act，
     所以这里不能按 #view 跳过 —— 否则筛选栏的 ＋ / ⚙ / × 都是死的。 */
  const act = e.target.closest('[data-act="addtag"],[data-act="deltag"],[data-act="managetag"]');
  if (!act) return;
  if (act.dataset.act === 'managetag'){ openTagManager(); return; }
  if (act.dataset.act === 'addtag'){
    const wrap = document.createElement('span');
    wrap.className = 'pillwrap';
    wrap.innerHTML = `<input class="newtag-input" id="newTagInput" placeholder="标签名" maxlength="12">`;
    act.replaceWith(wrap);
    const inp = document.getElementById('newTagInput');
    inp.focus();
    inp.addEventListener('keydown', ev => {
      if (ev.key === 'Enter'){
        const v = inp.value;
        if (!v.trim()){ toast('标签名不能空着'); inp.focus(); return; }   // 空的不关盒子，方便接着打
        if (!addTag(v)) toast(S.tags.length >= TAG_MAX ? '标签太多了，先删几个' : '这个标签已经有了');
        refresh();
      }
      else if (ev.key === 'Escape') refresh();
    });
    inp.addEventListener('blur', () => refresh());
    return;
  }
  if (act.dataset.act === 'deltag'){ removeTag(act.dataset.t); return; }
});

/* 标签条横向滚动：鼠标滚轮落在标签条上时，把竖向滚转换成横向滚 ——
   标签一多，光靠拖那条细滚动条很难选。滚到头就放行，让页面照常上下滚。 */
document.addEventListener('wheel', e => {
  const box = e.target && e.target.closest ? e.target.closest('.pillstrip') : null;
  if (!box) return;
  const max = box.scrollWidth - box.clientWidth;
  if (max <= 2) return;                                    // 没得滚，别抢事件
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;     // 本来就是横向手势（触控板），交给浏览器
  const atStart = box.scrollLeft <= 0.5, atEnd = box.scrollLeft >= max - 0.5;
  if ((e.deltaY < 0 && atStart) || (e.deltaY > 0 && atEnd)) return;   // 到头了就交给页面
  e.preventDefault();
  /* deltaMode: 0=像素 1=行 2=页。Firefox 的滚轮一格是「行」，
     不换算是 3px 一步，等于没滚 */
  const d = e.deltaMode === 1 ? e.deltaY * 26
          : e.deltaMode === 2 ? e.deltaY * box.clientWidth
          : e.deltaY;
  box.scrollLeft += d;
}, { passive: false });

document.getElementById('entry').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim();
  if (!v) return;
  const it = addItem(v);
  e.target.value = '';
  /* 录入区手选的标签（可多选）优先加在最前面，再跟上正文里写的 #标签，去重后截断 */
  if (it && entryTagSet.size){
    it.tags = normTagList([...entryTagSet].concat(it.tags || [])).slice(0, TAG_PER_ITEM);
    save();
  }
  refresh();
  if (it){
    const zl = { short:'短期', long:'长期', consider:'考虑' }[it.zone];
    toast('已加入「' + zl + '」' + (it.date ? ' · ' + dateLabel(it) : '') +
          ((it.tags && it.tags.length) ? ' · ' + it.tags.join('/') : ''),
      '撤销', () => { S.items = S.items.filter(x => x.id !== it.id); save(); refresh(); });
    // 新增后把看板滚进视野，避免"存了但没看见"
    const sec = document.getElementById('view');
    if (sec && sec.getBoundingClientRect().top > window.innerHeight * 0.6)
      sec.scrollIntoView({ behavior:'smooth', block:'start' });
  }
});

/* 搜索：过滤标题。渲染是整体重建 innerHTML，输入框会被重建，所以每次刷新后
   用 rAF 把焦点和光标补回去（rAF2 排在 refresh 的 rAF1 之后）。

   **为什么要 debounce**：原来每敲一个键就 refresh() 一次整块重建，
   条目一多（还带 .reveal-on-scroll / .goal-kids）输入会明显发涩；
   搜索框还得靠 refocusSearch 把焦点找回来，本身就说明重建代价不小。
   现在只把 refresh() 推到停手之后（S.q 仍然立刻更新 —— 这样期间任何
   别的原因触发的 refresh() 拿到的都是最新的过滤词，不会把输入框内容冲掉）。

   顺带把「光标位置」也接住了：重建后如果无脑 setSelectionRange(末尾)，
   用户点到中间改字、120ms 后光标会自己跳到末尾。 */
const SEARCH_DEBOUNCE_MS = 130;
let searchTimer = 0;
function refocusSearch(caret){
  requestAnimationFrame(() => {
    const el = document.getElementById('searchBox');
    if (!el) return;
    if (document.activeElement !== el) el.focus();
    const p = caret === undefined ? el.value.length : Math.min(caret, el.value.length);
    try { el.setSelectionRange(p, p); } catch (e){}
  });
}
view.addEventListener('input', e => {
  if (e.target.id !== 'searchBox') return;
  S.q = e.target.value;
  const caret = e.target.selectionStart;      // 重建前先把光标记下来
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchTimer = 0; refresh(); refocusSearch(caret); }, SEARCH_DEBOUNCE_MS);
});
view.addEventListener('keydown', e => {
  /* 清空要立刻生效（还带一个清空搜索的挂起定时器，否则它稍后会把刚清掉的词又填回去） */
  if (e.target.id === 'searchBox' && e.key === 'Escape'){
    clearTimeout(searchTimer); searchTimer = 0;
    S.q = ''; refresh(); refocusSearch(0);
  }
});

view.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-tag],[data-f],[data-lay],[data-set]');
  if (!el) return;
  /* 按钮自身可能不带 data-id（id 在外层 .item / .hwcard 容器上），向上找一层 */
  const id = el.dataset.id || el.closest('[data-id]')?.dataset.id;
  const it = id ? S.items.find(x => x.id === id) : null;

  /* 统计页布局：横条 / 方块。只换视图内部，不走 refresh()，省得整页重排 */
  if (el.dataset.lay !== undefined){
    const lay = el.dataset.lay === 'tile' ? 'tile' : 'card';
    if (lay !== S.statLayout){ S.statLayout = lay; save(); renderStat(); }
    return;
  }
  /* 设置页的外观开关。同样不走 refresh()：显示的显隐交给 body[data-help]，
     所以这里只要改状态 + 同步 aria-checked，页面一帧都不会跳。 */
  if (el.dataset.set !== undefined){
    if (el.dataset.set === 'help'){
      S.showHelp = !S.showHelp;
      save();
      applyHelp();
      el.setAttribute('aria-checked', S.showHelp ? 'true' : 'false');
    }
    /* 流畅模式：改之前那颗 ⚡ 的行为一样 —— 手动选择记进 localStorage，
       以后即使自动检测认为"你是真 GPU"也尊重用户的手动选择（见 currentLite）。
       状态不另存，直接以 html.soft-render 为准，避免两处状态打架。 */
    else if (el.dataset.set === 'lite'){
      const on = !document.documentElement.classList.contains('soft-render');
      try { localStorage.setItem(LITE_KEY, on ? 'on' : 'off'); } catch (e){}
      applyLite(on);
      el.setAttribute('aria-checked', on ? 'true' : 'false');
      toast(on ? '已开启流畅模式（更省性能）' : '已切回完整视觉');
    }
    return;
  }
  /* 筛选栏：多选开关。点标签切换选中，点最前面的「全部/清空」一次清空 */
  if (el.dataset.f !== undefined && el.classList.contains('pill')){
    const t = el.dataset.f;
    if (!t) S.filterTags = [];
    else {
      const k = S.filterTags.indexOf(t);
      k >= 0 ? S.filterTags.splice(k, 1) : S.filterTags.push(t);
    }
    filterPulse = t || null;   // 让重画出来的那颗补一段入场（否则选中态是硬切）
    refresh(); return;
  }
  if (el.dataset.tag && it){
    const t = el.dataset.tag, i = it.tags.indexOf(t);
    if (i >= 0) it.tags.splice(i, 1); else it.tags.push(t);
    save(); refresh(); return;
  }
  const act = el.dataset.act;
  if (act === 'fold' && it){ foldWithMotion(el, it); return; }
  if (act === 'tick' && it){ tickWithFeedback(el, it); return; }
  if (act === 'del' && it){ remove(it); return; }
  if (act === 'edit' && it){ openEdit(it); return; }
  if (act === 'st' && it && it.hw){
    const s = el.dataset.s;
    it.hw.status = s;
    it.hw.submittedAt = s === 'submitted' ? ymd(new Date()) : null;
    if (s === 'submitted' && !it.done){ it.done = true; it.doneAt = Date.now(); }
    save(); refresh(); return;
  }
});

/* 打勾的确认动效。
   打勾后条目就不在清单里了（完成态不上清单页），所以原来那一行是"一帧之内直接消失"，
   完全看不出勾上没有、勾的是哪一条。这里先在点击处让那一行变绿 + 收掉，动画走完再落数据。
   代价只是数据晚 ~230ms 落库，用户感知不到。
   防连点用「按 id 记账」而不是一个全局锁 —— 全局锁会让连点第二下走另一条分支，
   结果第二次 toggleDone 把刚完成的那条又翻回来（勾上又冒出来）。 */
const tickPending = new Set();
function tickWithFeedback(el, it){
  if (tickPending.has(it.id)) return;              // 这一条正在播动效，忽略连点
  const row = el.closest('.item, .hwcard');
  if (!row || reduceMotion()){ toggleDone(it); return; }
  tickPending.add(it.id);
  row.classList.add('tick-out');
  setTimeout(() => { tickPending.delete(it.id); toggleDone(it); }, 230);
}

/* 复合目标的折叠 / 展开高度过渡。
   原来这条路上是「改 collapsed → refresh() 整页重建」：DOM 全换了，没有旧高度可量，
   所以只能硬切。这里改成就地做，顺序按「先渲染再塌陷」：
     展开 = 先把 display:none 摘掉让结构就位 → 量内容高度 → 从 0 长到量出来的值；
     收起 = 结构本来就在 → 量当前高度 → 从当前值压到 0，动画走完才真正 display:none。
   几个必须守住的点：
   ① 收尾一定要把 inline 的 height/overflow 清掉，否则那张卡片的高度被钉死 ——
      以后往里加子任务、标题换行、窗口变窄，它都不会再长高；
   ② 终值是「量出来的 px」而不是 auto：auto 不参与过渡。清掉 inline 之后自然回到 auto；
   ③ 连点（上一次没收完又点）：先把上一次的目标态立刻落定。不这么做，两个定时器
      会互相清 inline，最后停在一个错误的高度上；
   ④ 动画期间刷新了整页（比如顺手勾掉一条），这个 box 就成了孤儿 —— 收尾里先查 isConnected；
   ⑤ reduced-motion：不量不补间，直接切；
   ⑥ 量高度必须在摘掉 folded **之后**：display:none 的元素量出来是 0。
   还有一个坑是"提交"：起点和 transition 各强制一次布局。把 transition 和高度变化
   挤在同一帧里，浏览器会拿"还没有 transition 的旧样式"当起点，过渡根本不启动。 */
const FOLD_MS = 280;   // 跟 .goal-kids.folding 的 height 过渡时长（--mo-base .24s）留一点余量
function resetFold(box){
  box.style.height = ''; box.style.opacity = ''; box.style.overflow = '';
  box.style.marginTop = ''; box.style.marginBottom = '';
  box.classList.remove('folding');
}
function foldWithMotion(chip, it){
  const body = chip.closest('.body');
  const box = body ? body.querySelector(':scope > .goal-kids') : null;
  if (!box){                                  // 没有可折叠的子树（正常到不了）：退回整页重渲染
    collapsed.has(it.id) ? collapsed.delete(it.id) : collapsed.add(it.id);
    refresh(); return;
  }
  const wasFolded = collapsed.has(it.id);

  if (box._foldTimer){                        // ③ 上一次的收尾先立刻补上
    clearTimeout(box._foldTimer); box._foldTimer = 0;
    box.classList.toggle('folded', wasFolded);
    resetFold(box);
  }

  if (wasFolded) collapsed.delete(it.id); else collapsed.add(it.id);
  chip.textContent = chip.textContent.replace(/^[▸▾]/, wasFolded ? '▾' : '▸');
  chip.setAttribute('aria-expanded', wasFolded ? 'true' : 'false');

  if (reduceMotion()){                        // ⑤
    resetFold(box);
    box.classList.toggle('folded', !wasFolded);
    return;
  }

  if (wasFolded){                             // ⑥ 展开：先把 height:0;overflow:hidden 写上再摘 folded，
    box.style.overflow = 'hidden';            //    摘掉那一帧被兜住，所以不会闪一下完整高度
    box.style.height = '0px';
    box.classList.remove('folded');
  }
  const FULL = box.scrollHeight;              // 内容真实高度（height:0 + overflow:hidden 也量得准）

  box.style.overflow = 'hidden';              // ---- 起点 ----
  box.style.height = (wasFolded ? 0 : FULL) + 'px';
  box.style.opacity = wasFolded ? '0' : '1';
  box.style.marginTop = wasFolded ? '0px' : '6px';
  box.style.marginBottom = wasFolded ? '0px' : '2px';
  void box.offsetHeight;                      // 提交起点（此刻还没挂 transition）
  box.classList.add('folding');
  void box.offsetHeight;                      // 提交 transition 本身，别和高度变化挤同一帧
  box.style.height = (wasFolded ? FULL : 0) + 'px';   // ---- 终点 ----
  box.style.opacity = wasFolded ? '1' : '0';
  box.style.marginTop = wasFolded ? '6px' : '0px';
  box.style.marginBottom = wasFolded ? '2px' : '0px';

  box._foldTimer = setTimeout(() => {
    box._foldTimer = 0;
    if (!box.isConnected) return;             // ④ 整页已被换掉，别去写孤儿节点
    box.classList.toggle('folded', !wasFolded);   // 收起：动画走完才真正 display:none
    resetFold(box);                           // ①② 清掉 inline，高度交还给内容
  }, FOLD_MS);
}

function toggleDone(it){
  it.done = !it.done;
  it.doneAt = it.done ? Date.now() : null;
  if (it.done && it.hw && it.hw.status !== 'submitted'){ it.hw.status = 'submitted'; it.hw.submittedAt = ymd(new Date()); }
  // 循环任务：打勾即完成一轮，按间隔生成下一次（作业不走循环）
  let nextId = null, nextLabel = '';
  if (it.done && it.repeat && !it.hw){
    const base = today0(); base.setDate(base.getDate() + it.repeat);
    const nx = {
      id: uid(), raw: it.raw, title: it.title,
      date: ymd(base), dateEnd: null, monthOnly: false, time: it.time || null,
      zone: it.zone, tags: [...(it.tags || [])], done: false, doneAt: null,
      createdAt: Date.now(), hw: null, repeat: it.repeat, pri: it.pri || 0
    };
    S.items.unshift(nx); nextId = nx.id;
    nextLabel = '，' + (+nx.date.slice(5, 7)) + '月' + (+nx.date.slice(8)) + '日再来一轮';
  }
  save(); refresh();
  if (it.done) toast('完成 · ' + it.title + nextLabel, '撤销', () => {
    it.done = false; it.doneAt = null;
    if (nextId) S.items = S.items.filter(x => x.id !== nextId);
    save(); refresh();
  });
}
function remove(it){
  const idx = S.items.indexOf(it);
  /* 不在库里就当没点过。少了这句守卫，splice(-1, 1) 会**删掉最后一条**（删错对象），
     撤销时又把 it 插到倒数第二位。当前调用点的 it 都取自 S.items.find 所以走不到，
     但这是个"一旦重构就变成数据丢失"的写法。 */
  if (idx < 0) return;
  S.items.splice(idx, 1); save(); refresh();
  toast('已删除「' + it.title + '」', '撤销', () => { S.items.splice(idx, 0, it); save(); refresh(); });
}

/* ---------------- 弹层 ---------------- */
const mask = document.getElementById('mask'), modal = document.getElementById('modal');
/* 弹层开合。原来只有入场（fadein + rise），关闭是 remove('on') 瞬间消失。
   现在先播 ~170ms 退场再真正隐藏。有两个边角必须处理：
   ① 退场没走完又点了打开：openMask() 要先取消未完成的退场，否则那个定时器
      会把刚填好的新弹窗内容清空（症状是"弹窗闪一下就空了"）；
   ② prefers-reduced-motion：用户已声明不要动效，别让他白等这 170ms，直接关。 */
const MASK_OUT_MS = 170;
let maskOutTimer = 0;
function reduceMotion(){
  try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e){ return false; }
}
/* 锁 / 解锁底下页面的滚动。和 .mask.on 同进同出 —— 三个弹层（编辑、导入、标签管理）
   都是 openMask() 打开、closeModalNow() 收尾，所以挂在两头上就全覆盖了，不必逐个调用点去加。 */
function lockPage(){ document.documentElement.classList.add('locked'); }
function unlockPage(){ document.documentElement.classList.remove('locked'); }

/* 弹层打开时把背景整块设成 inert，一次解决三件事：
   ① 读屏不再读到遮罩背后的正文（语义上真的"模态"了）；
   ② Tab 够不到背后的控件；
   ③ 焦点跑到遮罩后面按 Enter 触发底层按钮的路径被彻底切断 ——
      那条路径的症状（背景被 scrollTo 顶走）和"滚动穿透"一模一样，光测滚轮永远发现不了。
   弹层和 toast 都在 .page-shell 之外，所以不会被自己设的 inert 误伤。 */
const MASK_BG = ['.site-header', '.page-shell', '.pdaim-footer'];
function setBackgroundInert(on){
  for (const sel of MASK_BG){
    const el = document.querySelector(sel);
    if (el) el.inert = on;
  }
}
/* 关闭后焦点要还回触发它的那个按钮，否则键盘用户得从头 Tab 一遍 */
let maskPrevFocus = null;
/* 用 getClientRects() 判可见：display:none 的元素（编辑弹层里那块折叠的「作业信息」）
   返回 0 长度。`offsetParent` 在 fixed 祖先下不可靠，不能用。 */
function modalFocusables(){
  return [...modal.querySelectorAll(
    'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
  )].filter(el => el.getClientRects().length);
}
function openMask(){
  clearTimeout(maskOutTimer); maskOutTimer = 0;
  mask.classList.remove('closing');
  mask.classList.add('on');
  lockPage();
  /* 顺序要紧：**先记焦点、再 inert** —— 给一棵"焦点正在里面"的子树设 inert，
     浏览器会把焦点踢到 body，那时再记就只剩 body 了。
     再进一层守卫：只有当前记着的那个还在文档里才保留（openTagManager 改名会重开一次，
     那时焦点落在弹层里的输入框上，要留住最初触发弹层的那个按钮）。 */
  if (!maskPrevFocus || !maskPrevFocus.isConnected){
    const a = document.activeElement;
    maskPrevFocus = (a && a !== document.body && a !== document.documentElement) ? a : null;
  }
  setBackgroundInert(true);
  /* 焦点移到弹层容器（tabindex=-1）而不是第一个输入框：读屏会播报"对话框 + 标题"，
     而且不会顺带把弹层内部滚一下。preventScroll 保证背景滚动位置纹丝不动。 */
  if (!modal.contains(document.activeElement)) modal.focus({ preventScroll: true });
}
function closeModalNow(){
  clearTimeout(maskOutTimer); maskOutTimer = 0;
  mask.classList.remove('on', 'closing');
  modal.innerHTML = '';
  /* 等退场动画（~170ms）走完才解锁：这段时间页面还锁着，不然背景会先跟着滑一下。 */
  unlockPage();
  setBackgroundInert(false);
  const back = maskPrevFocus; maskPrevFocus = null;
  if (back && back.isConnected && typeof back.focus === 'function') back.focus({ preventScroll: true });
}
/* 焦点陷阱：背景已经 inert，正常 Tab 出不去，但会跳到浏览器地址栏再绕回来 ——
   键盘用户等于"当前位置丢了"。这里在两个端点之间显式回绕。 */
mask.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || !mask.classList.contains('on')) return;
  const f = modalFocusables();
  if (f.length < 2) return;
  const first = f[0], last = f[f.length - 1], cur = document.activeElement;
  if (e.shiftKey && (cur === first || cur === modal)){ e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && cur === last){ e.preventDefault(); first.focus(); }
});
function closeModal(){
  clearTimeout(maskOutTimer); maskOutTimer = 0;
  if (!mask.classList.contains('on')) return closeModalNow();   // 没开着：别白挂一个 closing
  if (reduceMotion()) return closeModalNow();
  mask.classList.add('closing');
  maskOutTimer = setTimeout(closeModalNow, MASK_OUT_MS);
}
mask.addEventListener('click', e => { if (e.target === mask) closeModal(); });
/* 没开着就别走一遍关闭流程 —— 否则 closeModalNow() 会去清空 #modal、还会解开滚动锁，
   让"弹层是否打开"和"页面是否上锁"有机会不同步。 */
document.addEventListener('keydown', e => { if (e.key === 'Escape' && mask.classList.contains('on')) closeModal(); });

/* ---------------- 导入 / 导出 ---------------- */
const SEC = { '长期':'long', '短期':'short', '考虑':'consider', '已完成':'short', '完成':'short' };
function importText(txt, base){
  const lines = txt.split(/\r?\n/);
  let zone = 'long', n = 0, sawSection = false;
  /* BASEDAY 是模块级状态，today0() 到处都在读它。中途任何一处抛错都必须复位 ——
     否则之后所有「今天 / 周四 / 17号」都会按那个旧基准日解析，静默错位、极难排查。 */
  BASEDAY = base || null;
  try {
    for (const raw of lines){
      const line = raw.trim();
      if (!line) continue;
      const sec = line.match(/^[\-—–]{2,}\s*(.+?)\s*[\-—–]{2,}$/);
      if (sec){ zone = SEC[sec[1].trim()] || zone; sawSection = true; continue; }
      if (!/^[☐☑☒□√✓✗×]/.test(line)) continue;
      const done = /^[☑☒√✓✗×]/.test(line);
      const p = parseSmart(line);
      if (!p.title) continue;
      const it = {
        id: uid(), raw: line, title: p.title,
        date: p.date, dateEnd: p.dateEnd, monthOnly: p.monthOnly, time: p.time,
        zone: sawSection ? zone : p.zone,
        tags: p.tags, done, doneAt: done ? Date.now() : null,
        createdAt: Date.now() + n, hw: null, repeat: p.repeat || null, pri: p.pri || 0
      };
      if (/作业/.test(p.title)){
        it.hw = { course: guessCourse(p.title), detail:'', channel: guessChannel(line), naming: guessNaming(line),
                  status: done ? 'submitted' : 'todo', submittedAt: done ? ymd(new Date()) : null };
        splitHw(it, p);
      }
      S.items.push(it); n++;
    }
  } finally {
    BASEDAY = null;
  }
  save(); refresh();
  return n;
}

    <div class="field"><label>把荣耀笔记整段粘进来（☐ / ☒ 和 ----分区---- 都能认）</label>
      <textarea id="i_txt" style="min-height:240px" placeholder="----长期----&#10;☐ 读一本专业书101～1015&#10;☐ 写结课论文105～1020&#10;----短期----&#10;☐ 1016 交数学作业"></textarea></div>

/* 拖一个 json 进来 = 恢复备份；拖一整块笔记文本进来 = 走文本导入。
   恢复这条必须过两道闸：
   ① **形状校验**。原来只判 `if (o.items)`：一个 items 是字符串/对象/数字的 json 会直接塞进
      S.items，下一次渲染就 `S.items.map is not a function` 整个应用瘫痪 ——
      而且坏数据当场就写进了 localStorage，刷新也救不回来，只能手动清。
   ② **二次确认**。这是唯一一个会覆盖全部数据的操作，不能点一下就没。
   另外老备份（只带 items 的那种）没有 tags 字段，缺什么就保持现状，**不能顺手把标签库清空**。 */
window.addEventListener('drop', e => {
  e.preventDefault();
  const f = e.dataTransfer.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    let o = null;
    try { o = JSON.parse(r.result); } catch (err){ o = null; }
    if (o && Array.isArray(o.items)){
      if (!confirm('用备份里的 ' + o.items.length + ' 条，覆盖现在的 ' + S.items.length +
                   ' 条？\n\n此操作不可撤销（当前数据不会自动留底）。')) return;
      S.items = o.items;
      if (Array.isArray(o.tags)){ S.tags = normTagList(o.tags); syncTags(); }
      if (o.statLayout === 'tile' || o.statLayout === 'card') S.statLayout = o.statLayout;
      if (typeof o.hintOpen === 'boolean') S.hintOpen = o.hintOpen;
      if (typeof o.showHelp === 'boolean') S.showHelp = o.showHelp;
      if (o.lastBackup) S.lastBackup = o.lastBackup;
      save(); applyHelp(); refresh();
      toast('已从备份恢复 ' + S.items.length + ' 条');
      return;
    }
    /* 不是备份 json（多半是直接拖进来的一整块笔记文本） */
    const n = importText(String(r.result));
    toast(n ? '导入了 ' + n + ' 条' : '这个文件里没认出可导入的条目（备份请拖 json）');
  };
  r.readAsText(f);
});

/* ---------------- 导航 / 主题 / 吸顶 ---------------- */
/* 页签的滑动指示块：把底块按当前 .on 那个页签的**实际**位置和宽度摆过去。
   这里现场量 offsetLeft/offsetWidth，而不是写死「下标 × 宽度」—— 三个页签文字不一样长，
   窄屏还有一条改 padding/font-size 的媒体查询，量出来才跟着走。
   两处必须小心：
   ① 首帧、窗口尺寸变化、字体换上来之后都要**不带动画**直接落位，否则会看到底块
      从左上角滑到目标位置那一下；
   ② 页签在 header 里，renderList/Stat/Timeline 只换 #view 的内容，它不会随每次渲染重建，
      所以定位挂在 refresh 的 rAF 里就够了 —— 那儿同时也在同步 .on 的类名。 */
const navPillsEl = document.getElementById('navPills');
const navGlideEl = document.getElementById('navGlide');
let navGlidePlaced = false;
function moveNavGlide(animate = true){
  if (!navPillsEl || !navGlideEl) return;
  const on = navPillsEl.querySelector('.nav-pill.on');
  if (!on) return;
  const instant = !animate || !navGlidePlaced || reduceMotion();
  if (instant) navGlideEl.style.transition = 'none';
  navGlideEl.style.width = on.offsetWidth + 'px';
  navGlideEl.style.height = on.offsetHeight + 'px';
  navGlideEl.style.transform = `translate(${on.offsetLeft}px, ${on.offsetTop}px)`;
  if (instant){
    void navGlideEl.offsetWidth;   // 让上面几个值先落定，再把过渡交还给 CSS
    navGlideEl.style.transition = '';
  }
  if (!navGlidePlaced){
    navGlidePlaced = true;
    navPillsEl.classList.add('glide-ready');   // 到这一步才让 .on 原来的那块底让位给滑动块
  }
}
window.addEventListener('resize', () => moveNavGlide(false));
/* 中文字体是晚一步换上的，换字之后页签宽度会变一点点，重摆一次 */
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => moveNavGlide(false));

  }
});

/* 吸顶反馈：录入条贴住顶栏时加一层更实的投影
   （不能用 IntersectionObserver —— 吸顶后它仍 100% 可见，ratio 恒为 1） */
(function stickyCapture(){
  const bar = document.getElementById('captureBar');
  const wrap = document.getElementById('captureWrap');
  if (!bar || !wrap) return;
  let ticking = false, stickTop = 0;
  /* 只在尺寸变化时读一次计算样式 —— getComputedStyle 会强制样式重算，不能放进滚动帧里 */
  function measure(){ stickTop = parseFloat(getComputedStyle(wrap).top) || 0; }
  function paint(){
    ticking = false;
    bar.classList.toggle('is-stuck', wrap.getBoundingClientRect().top <= stickTop + 1);
  }
  window.addEventListener('scroll', () => { if (!ticking){ ticking = true; requestAnimationFrame(paint); } }, { passive:true });
  window.addEventListener('resize', () => { measure(); paint(); });
  measure(); paint();
})();

const tb = document.getElementById('themeBtn');
function applyTheme(t, animate){
  if (animate){
    document.documentElement.classList.add('theme-changing');
    setTimeout(() => document.documentElement.classList.remove('theme-changing'), 560);
  }
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(LS + '.theme', t); } catch (e){}
}
tb.onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark', true);
applyTheme((() => {
  try {
    return localStorage.getItem(LS + '.theme')
        || localStorage.getItem(LS_OLD + '.theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (e){ return 'light'; }
})());

/* ---------------- 流畅模式：软件渲染自动降级 + 手动开关 ---------------- */
/* 检测 WebGL 渲染器字符串：Microsoft Basic Render Driver / SwiftShader / llvmpipe 等都是软件渲染。
   实测：Intel Arc（真 GPU）报 "ANGLE (Intel, ...Arc...)"；--disable-gpu 报 "ANGLE (Microsoft, ...Basic Render Driver...)"。 */
function isSoftwareGL(){
  try {
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if (!gl) return true;
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    const r = String(ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : (gl.getParameter(gl.RENDERER) || '')).toLowerCase();
    return /basic render|swiftshader|llvmpipe|softpipe|software|angle \(microsoft/.test(r);
  } catch (e){ return false; }
}
const LITE_KEY = LS + '.lite';
/* gpu-render：真 GPU 才升级为 backdrop 玻璃。软件渲染下即使手动切回「完整视觉」，
   也用实底玻璃（色球/点阵/动画/高光全保留）—— backdrop-filter 在软件渲染下
   每帧全价重采样，实测一个元素就能把滚动帧率砍半以上。 */
const SOFT_GL = isSoftwareGL();
document.documentElement.classList.toggle('gpu-render', !SOFT_GL);
function applyLite(on){
  document.documentElement.classList.toggle('soft-render', on);
  /* 设置页那个开关（正好在设置页时）跟着同步。进设置页时会按当前状态渲染一份，
     这里是给"在设置页改完、切走又切回来"补一道，免得两处说法不一致。 */
  const sw = document.querySelector('.switch[data-set="lite"]');
  if (sw) sw.setAttribute('aria-checked', on ? 'true' : 'false');
}
function currentLite(){
  let pref = null;
  try { pref = localStorage.getItem(LITE_KEY); } catch (e){}
  if (pref === 'on') return true;          // 手动开过
  if (pref === 'off') return false;        // 手动关过（即使软件渲染也尊重）
  return SOFT_GL;                          // 否则自动检测
}
applyLite(currentLite());
/* 顶栏那颗手动切"流畅模式"的 ⚡ 已撤（手机上它和主题滑块一起把标题挤没了），
   开关挪进设置页 —— 见 renderSettings 里 data-set="lite" 那一行，
   点击逻辑在 view 的点击代理里（和"页面说明文字"同一个分支）。 */

/* ---------------- 快捷键 ---------------- */
document.addEventListener('keydown', e => {
  const tag = document.activeElement && document.activeElement.tagName;
  if (e.key === '/' && tag !== 'INPUT' && tag !== 'TEXTAREA'){
    e.preventDefault();
    document.getElementById('entry').focus();
  }
});

/* ---------------- 启动 ---------------- */
load();
/* 「页面说明文字」的开关在首帧之前就要落到位 —— refresh() 是 rAF 延迟的，
   等它同步会先闪一下那段说明文字。 */
applyHelp();
/* 备份提醒：必须排在 load() 之后 —— 它要读 S.lastBackup，见函数定义处的说明。 */
backupNudge();
/* 写法提示：chip 条数由脚本数一遍填上去；开合状态记进 localStorage。
   放在 load() 之后，否则读不到已存的 hintOpen。 */
(function initHint(){
  const box = document.getElementById('hintBox');
  if (!box) return;
  const n = box.querySelectorAll('.hint-chips span').length;
  const badge = box.querySelector('.hb-n');
  if (badge) badge.textContent = n + ' 种';
  box.open = !!S.hintOpen;
  box.addEventListener('toggle', () => { S.hintOpen = box.open; save(); });
})();
refresh();
</script>
