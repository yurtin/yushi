/* ★ v5.0：设置页的折叠 —— 在上面那份 markup 渲染完之后**原地加工**，不改各栏自己的写法。
   为什么不在模板里逐栏包壳：这里 4 栏（v5.2 从 8 栏并到 5 栏；6B 按频率重排成 4 栏），
   以后还会加；包壳写法要求每加一栏都记得再包一次，漏了就成一个"点了没反应"的标题。
   在这里统一加工，新加的栏自动带上折叠。
   加工后每张卡的形状：button.set-head（里面是 h3 + ▸）→ div.set-body（原来的其余内容）。
   展开态读 S.setOpen（默认空数组 = 全收起）；收起时卡片只剩一行标题。
   ★ 6B：`.set-keep`（「常用」）**跳过** —— 它常驻展开（理由见 renderSettings 里那段）。 */
function setFoldInit(){
  const cards = view.querySelectorAll('.set-card');
  cards.forEach((card, i) => {
    if (card.classList.contains('set-keep')) return;
    const h3 = card.querySelector(':scope > h3');
    if (!h3) return;
    const key = h3.textContent.trim() || ('c' + i);
    const id = 'setb-' + i;
    const open = S.setOpen.indexOf(key) >= 0;
    /* 顺序要紧：先把 h3 之后的所有节点搬进 body，再动 h3 —— 反了会把 body 自己也搬进去 */
    const body = document.createElement('div');
    body.className = 'set-body';
    body.id = id;
    while (h3.nextSibling) body.appendChild(h3.nextSibling);
    const head = document.createElement('button');
    head.type = 'button';
    head.className = 'set-head';
    head.dataset.act = 'setfold';
    head.dataset.key = key;
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    head.setAttribute('aria-controls', id);
    const chev = document.createElement('span');
    chev.className = 'sh-chev';
    chev.setAttribute('aria-hidden', 'true');
    chev.textContent = '▸';
    card.insertBefore(head, h3);
    head.appendChild(h3);
    head.appendChild(chev);          // 箭头靠右由 .sh-chev 的 margin-left:auto 负责
    card.appendChild(body);
    card.classList.toggle('open', open);
  });
}

/* 统计页大数字滚动计数：从 0 数到目标值。
   原来数字是"啪"一下出现的，看不出"涨了多少"；数一下能让增减有感知。
   三个必须守住的点：
   ① 结束时**必须**写回精确目标值 —— 动画中途被打断（切页、切布局）也不能留下错数字；
   ② 0 不数（"0 → 0"没有意义，反而多闪一下）；
   ③ reduced-motion 直接跳过，尊重系统设置。
   元素是每次 renderStat 重建的，旧动画里的 el 已脱离文档，写它也不会污染新页面。 */
function countUpNumbers(){
  if (reduceMotion()) return;
  const DUR = 460;
  view.querySelectorAll('.feature-grid .v').forEach(el => {
    const to = parseInt(String(el.textContent).trim(), 10);
    if (!isFinite(to) || to <= 0) return;
    const t0 = performance.now();
    el.textContent = '0';
    el.setAttribute('data-counting', '1');       // 给测试一个"还在数"的抓手
    const step = now => {
      if (!el.isConnected) return;               // 已被下次渲染换掉，别再写
      const p = Math.min(1, (now - t0) / DUR);
      const e = 1 - Math.pow(1 - p, 3);          // easeOutCubic：开头快、收尾稳
      el.textContent = String(Math.round(to * e));
      if (p < 1) requestAnimationFrame(step);
      else { el.textContent = String(to); el.removeAttribute('data-counting'); }
    };
    requestAnimationFrame(step);
  });
}

/* 标签条右端固定的那组按钮（两处标签栏共用一份 HTML）。
   放在滚动区外面，标签滚起来的时候它们不会跟着跑。 */
const tagActsHTML =
  `<div class="tagacts">` +
    `<button class="pill addpill" data-act="addtag" title="新建标签（回车确认）">＋</button>` +
    `<button class="pill addpill" data-act="managetag" title="管理标签：改名 / 删除">⚙</button>` +
  `</div>`;

function renderFilters(){
  const box = document.getElementById('filters');
  if (!box) return;
  const n = S.filterTags.length;
  /* 「全部」在不筛选时就是个静态状态；一旦选了标签，它就变成一键清空 */
  const clearPulse = filterPulse === '' ? ' pulse' : '';
  box.innerHTML = `<button class="pill${n ? '' : ' on'}${clearPulse}" data-f="" title="${n ? '清空筛选' : '不筛选'}">` +
      (n ? '清空 (' + n + ')' : '全部') + `</button>` +
    S.tags.map(t => tagPillHTML(t, 'filter')).join('');
  filterPulse = null;   // 只在"被点中的那一次刷新"里生效，别让后面的无关刷新重播
  restoreStripScroll(box);
}

/* 两处标签条都是「整块重建 innerHTML」来刷新的：筛选栏那条更狠 ——
   refresh() 会把整个 #view 重画一遍，连它自己都是新元素。
   所以横滚位置不能靠重建前后读一次，得单独记一份，重建后还回去，
   否则滚到右边点一颗标签，整条立刻弹回开头，很难连着选几个。 */
const stripScrollX = { filters: 0, entryStrip: 0 };
document.addEventListener('scroll', e => {
  const el = e.target;
  if (el && el.id && el.id in stripScrollX) stripScrollX[el.id] = el.scrollLeft;
}, true);
function restoreStripScroll(el){
  if (el && el.id in stripScrollX) el.scrollLeft = stripScrollX[el.id];
}

/* 标签条的边缘渐隐开关（CSS 那边有三条 mask 规则）。
   判据是"这一侧是否真的还有内容被切住"：
   - scrollWidth <= clientWidth（压根没溢出）→ 两侧都不渐隐；
   - scrollLeft 已经在 0 → 左边没东西被切，别把第一颗 pill 淡化；
   - 已经滚到底（scrollLeft ≈ max）→ 右边同理。
   留 1px 容差：某些缩放下 scrollLeft 会是 1.0001 这种小数，卡死等号会让边缘反复闪。
   统一挂类而不是写 inline 样式，是为了让"要不要渐隐"只由这一处决定。 */
/* ★ v5.0：量出每个底栏页签里**图标**的真实中心，写进 --dot-x，供 `.tab::after`（小指示条）定位。
   为什么不在 CSS 里手算：清单/统计为中间圆钮让位、各带单边内边距，而 flex 居中算的是内容盒 ——
   差值受 padding / gap / 图标尺寸共同影响，实测是 10px 而不是 padding/2 的 13px。
   量一次就永远准；以后谁改内边距都不会再让指示条悄悄偏掉。 */
function syncTabDots(){
  document.querySelectorAll('.tab-strip .tab').forEach(t => {
    const ic = t.querySelector('.np-ico');
    const r = t.getBoundingClientRect();
    if (!ic || !r.width){ t.style.removeProperty('--dot-x'); return; }
    const ir = ic.getBoundingClientRect();
    t.style.setProperty('--dot-x', Math.round(ir.left + ir.width / 2 - r.left) + 'px');
  });
}
function syncStripFades(){
  document.querySelectorAll('.pillstrip').forEach(el => {
    const max = el.scrollWidth - el.clientWidth;
    const scrollable = max > 1;
    el.classList.toggle('fade-l', scrollable && el.scrollLeft > 1);
    el.classList.toggle('fade-r', scrollable && el.scrollLeft < max - 1);
  });
}
/* 捕获阶段监听：滚动事件不冒泡，但在捕获阶段能收到子元素的滚动 ——
   条子自己滚、页面滚（可能把整条滑出视口）、窗口变宽变窄，都要重算。 */
document.addEventListener('scroll', syncStripFades, true);
window.addEventListener('resize', syncStripFades);

/* 刚被点中的那颗筛选标签。筛选栏每次 refresh 都整块重建，没有元素可以复用，
   所以只能给"这一颗"补一段入场动画把状态切换接上（见 CSS .pill.pulse / @keyframes pillOn）。
   用完立刻清空 —— 否则下一次无关的 refresh（搜索、打勾…）会把旧的那颗又播一遍。 */
let filterPulse = null;

/* 标签 pill：一律带 × 可删（内置的那三个也能删，所有标签一视同仁）。
   mode='filter' 点标签＝加入/移出筛选（可多选）；mode='entry' 点标签＝给之后录入的条目加/去这个标签（可多选） */
function tagPillHTML(t, mode){
  const entryMode = mode === 'entry';
  const on = entryMode ? entryTagSet.has(t) : S.filterTags.indexOf(t) >= 0;
  const attr = entryMode ? `data-et="${esc(t)}"` : `data-f="${esc(t)}"`;
  /* 筛选栏那颗刚被点中的补一个入场：选中走 .pulse（无底色→实底），
     取消走 .pulse-off（实底→无底色）。它整块重画、没有元素可复用，
     只能靠动画把这次状态切换接上。 */
  const pulse = (!entryMode && t === filterPulse) ? (on ? ' pulse' : ' pulse-off') : '';
  return `<span class="pillwrap"><button class="pill${on ? ' on' : ''}${pulse}" ${attr}>${esc(t)}</button>` +
    `<button class="pill-x" data-act="deltag" data-t="${esc(t)}" title="删除「${esc(t)}」">×</button></span>`;
}

/* 录入区标签条的选中态：**就地改 class，绝不重建 innerHTML**。
   以前点一颗标签就把整条 innerHTML 重画一遍，节点全是新的 ——
   CSS 上那条 transition 压根没有可过渡的旧状态，于是"选中"永远是硬切一下
   （用户说的"过渡非常生硬"就是这个）。就地改还有个附带好处：
   整条标签栏的横向滚动位置不会因为重画而弹回开头。 */
function syncEntryTagUI(){
  const box = document.getElementById('entryTags');
  if (!box) return;
  box.querySelectorAll('[data-et]').forEach(b => {
    b.classList.toggle('on', entryTagSet.has(b.dataset.et));
  });
  const n = entryTagSet.size;
  const old = box.querySelector('.et-n');
  if (n && old) old.textContent = '已选 ' + n;
  else if (n && !old){
    const s = document.createElement('span');
    s.className = 'et-n mono';
    s.title = '当前已选，回车录入时会加到条目上';
    s.textContent = '已选 ' + n;
    box.insertBefore(s, box.querySelector('.pillstrip'));
  }
  else if (!n && old) old.remove();
}

/* 录入区标签栏：可以多选，选中的标签会一起加到之后录入的条目上（再点一次取消）。
   和筛选栏共用同一套标签库，但不共用选中状态。
   结构＝[标签] [已选 N] [可横向滚动的标签条] [＋ ⚙]：
   标签多的时候只有中间那条滚，「已选几」和加标签按钮一直看得见。 */
function renderEntryTags(){
  const box = document.getElementById('entryTags');
  if (!box) return;
  const n = entryTagSet.size;
  box.innerHTML = `<span class="et-l">标签</span>` +
    (n ? `<span class="et-n mono" title="当前已选，回车录入时会加到条目上">已选 ${n}</span>` : '') +
    `<div class="pillstrip" id="entryStrip" tabindex="0" role="group" aria-label="给之后录入的条目加标签">` + S.tags.map(t => tagPillHTML(t, 'entry')).join('') + `</div>` +
    tagActsHTML;
  restoreStripScroll(document.getElementById('entryStrip'));
}

/* ==================== ★ 3B：把 3A 的内核接到界面上（让遥控器真的能用） ====================
   3A 把「指向与执行内核」做完了（aiRouteIntent / 候选打分 / aiOpsPlan / aiOpsNeedConfirm /
   aiSnapField / aiRestoreSnap），但它当时是一个**纯内核、没有任何入口调用它** ——
   装了 5.8.0 的用户感受不到任何变化。这一块补四件事：

     ① 接线：录入（回车 / 语音左滑）与语音右滑，都先问一句"这句是新建还是改已有"；
     ② 焦点可见：卡片左侧一道**实色**细高亮 + 屏幕顶部一行「正在改：XXX」；
     ③ 「改前 → 改后」确认页（破坏性 / 批量）—— 就住在现有的 #mask / .modal 里；
     ④ 撤销（接 3A 的 aiRestoreSnap）与「改挂到…」出口。

   四条本卡红线（改这块之前先读）：
     ① **确认页出来之前一行数据都不许动** —— 由 aiOpsNeedConfirm + aiRunCommand 保证，
        这里只负责"不抢在它前面落库"（真凶是 2B 的预落库，处理见 commitEntry 开头）；
     ② **取消 = 数据逐字段零变化** —— 取消路径只调 closeModal()，一个字段都不碰；
     ③ AI 消息一律走 aiSay() / aiFail()（toast 有"带按钮的提示不被顶掉"的保护，裸 toast 没有）；
     ④ **更新路径不预落库** —— 与 2B 两段式上屏的冲突在 commitEntry 开头显式处理。

   位置说明：这一块**不在** _3a-regress 切出来的那个 block3a 里（那段切到
   `/* ---------- 设置页` 为止），所以不必受 3A 那几条源码级断言约束；但**仍然**不新增
   notifyTimeOf / b.notifySchedule( 的调用点 —— 阶段1 有源码级断言钉"排期真相源只有一处"，
   撤销要重排提醒时走的是转发口 notifyFire。 */

/* ---------- 3B.1 焦点：一处读取，两处呈现 ---------- */
/* 当前焦点那条。已超时 / 已删掉 / 已完成都算"没有焦点" —— 顶部条写着「正在改：XXX」
   而那条已经勾掉了，读起来本身就是个 bug。 */
function aiFocusItem(){
  const id = (typeof aiFocusId === 'function') ? aiFocusId() : null;
  const it = id ? it_byId(id) : null;
  return (it && !it.done) ? it : null;
}
/* 渲染层（itemHTML / seedHTML）用的判断。**用 typeof 守一道** —— 0B/0E 的纯 Node 回归
   把 renderZoneBody 整段切进隔离环境跑，那里没有 3A 内核；未声明的标识符只有放在
   typeof 里才不抛（本项目既有的"转发口"写法，见 notifyFire）。 */
function aiIsFocused(id){
  if (!id || typeof aiFocusId !== 'function') return false;
  const f = aiFocusId();
  return !!f && f === id;
}
/* ★ 5G：卡片左侧那道细高亮（focus-bar）已按用户要求整条删掉 —— 这里不再生成任何元素。
   `ai-focus` 这个类保留在卡片上：它只是"这一条是当前焦点"的身份标记，没有样式，
   顶部「正在改：XXX」那行（syncFocusStrip）不看它，两者互不依赖。 */
/* 顶部那条「正在改：XXX」。在 afterRender() 里每帧同步一次 —— 渲染出口只留一处，
   换页 / 改数据 / 清焦点都会自动跟上，不需要散到各个调用点去自觉。 */
function syncFocusStrip(){
  const el = document.getElementById('focusStrip');
  if (!el) return;
  const it = aiFocusItem();
  el.hidden = !it;
  document.body.classList.toggle('has-focus', !!it);
  if (!it) return;
  const t = document.getElementById('focusTitle');
  if (t) t.textContent = String(it.title || '').slice(0, 40);
}
document.getElementById('focusClear').addEventListener('click', () => {
  if (typeof aiFocusClear === 'function') aiFocusClear();
  refresh();
});

/* ---------- 3B.2 路由：这句话是"新建"还是"改已有" ---------- */
/* commitEntry / voiceRight 共用的一道闸。三件事必须在这里收口：
   ① 纯 Node 回归 / 外部脚本可能没有 3A 内核 → typeof 守卫；
   ② 路由自己抛异常绝不能让用户那句话丢掉 → 一律回落 create（create 是既有行为）；
   ③ noRoute / forceCreate 是给"还是新建一条"那条重试路用的。 */
async function aiRouteForEntry(text, opts){
  if (opts && (opts.noRoute || opts.forceCreate)) return 'create';
  if (typeof aiRouteIntent !== 'function') return 'create';
  try { return await aiRouteIntent(text); } catch (e){ return 'create'; }
}

/* ---------- 3B.3 撤销 + 成功提示上的按钮 ---------- */
/* 3A 的 aiRestoreSnap 要一个 Map（逐字段 + 删掉的整条 + 原下标），而 aiExecOps 交出来的
   快照是**纯数据**。这一层就是把纯数据还原成那个 Map。
   ⚠️ 快照里必须留着**原对象引用**（aiExecOps 里那一行 `obj: rec.it`）：被删除的条目早已
   从 S.items 里摘掉，只靠 id 是找不回来的 —— 少了它，"撤销删除"会是个空操作。 */
function aiSnapMap(snapshot){
  const map = new Map();
  (Array.isArray(snapshot) ? snapshot : []).forEach(rec => {
    if (!rec || !rec.id || !rec.obj) return;
    const f = {};
    Object.keys(rec.fields || {}).forEach(k => { f[k] = { had: rec.fields[k].had, v: rec.fields[k].v }; });
    map.set(rec.id, { it: rec.obj, f: f, removed: !!rec.removed,
      index: Number.isFinite(rec.index) ? rec.index : -1 });
  });
  return map;
}
/* 撤销。三件事缺一不可：
   ① 逐字段还原（含"整条被删 → 插回原下标"）；
   ② **重排提醒**：凡碰过 date / time / done 的都要走一次 notifyFire ——
      syncNotify 自己判"该排还是该撤"，唯一真相源没有被复制；删掉又插回来的那条尤其
      要补，否则它在排期表里已经被撤了，提醒就真没了；
   ③ 焦点撤掉：数据已经回到操作前，条上还写着「正在改：XXX」就名不副实。 */
function aiOpsUndo(snapshot){
  const map = aiSnapMap(snapshot);
  if (!map.size) return;
  aiRestoreSnap(map);
  map.forEach(rec => {
    const it = it_byId(rec.it.id) || rec.it;
    try { notifyFire(it); } catch (e){}
  });
  if (typeof aiFocusClear === 'function') aiFocusClear();
  save();
  refresh();
  syncFocusStrip();
  toast('已撤回', null, 2600);
}
/* 成功提示上挂哪些按钮。
   「改挂到…」只在"这一句正好动了一条普通待办"时给 —— 批量动了好几条时不挂：
   一次把好几条挂出去，撤销的语义立刻变得含糊（本项目在批量上栽过跟头）。 */
function aiOpsActs(r){
  const acts = [];
  const changed = Array.isArray(r && r.changed) ? r.changed : [];
  if (Array.isArray(r && r.snapshot) && r.snapshot.length){
    /* ★ 5F：aiOpsUndo 是同步的、结尾还会弹一条「已撤回」—— 不延后会被按钮处理器的
       hideToast() 收掉（同 later 的说明）。typeof 守卫 = 转发口（本函数会被 3A/3B/3C
       那几个切片式回归放进隔离环境跑）。 */
    const defer = (typeof later === 'function') ? later : function(f){ return f; };
    acts.push({ label: '撤销', fn: defer(() => aiOpsUndo(r.snapshot)) });
  }
  if (changed.length === 1){
    const it = it_byId(changed[0]);
    if (it && !isSeed(it)) acts.push({ label: '改挂到…', fn: () => aiOpenRemount(it) });
  }
  return acts;
}

/* ---------- 3B.4 「改前 → 改后」确认页（住在现有的 #mask / .modal 里） ---------- */
/* 只读渲染 3A 的 aiOpsPlan 产物：哪一条（标题）+ 哪个字段 → 改前 / 改后。
   字段名在 3A 侧就已经人话化过（日期 / 钟点 / 标题 / 分区 / 挂在 / 完成 / 整条）。
   取消的**三条路**（按钮 / Esc / 点遮罩）都由 openMask / closeModal 既有的那套接住，
   它们一个字段都不碰 —— 红线 ② 就是这么成立的，不需要额外代码。 */
function aiConfirmOps(r){
  const rows = Array.isArray(r && r.plan) ? r.plan : [];
  const n = rows.length;
  const body = rows.map(row => `
    <div class="cf-row">
      <div class="cf-t">${esc(row.title || '（无标题）')}</div>
      ${(row.changes || []).map(c => `
        <div class="cf-ch">
          <span class="cf-f">${esc(c.field)}</span>
          <span class="cf-from">${esc(c.from)}</span>
          <span class="cf-ar" aria-hidden="true">→</span>
          <span class="cf-to">${esc(c.to)}</span>
        </div>`).join('')}
    </div>`).join('');
  modal.innerHTML =
    `<h3 id="modalTitle">改前 → 改后</h3>
     <p class="cf-sub">这次会改 <b>${n}</b> 条${r.confirmWhy ? ' · ' + esc(r.confirmWhy) : ''}。
       确认之前，一行数据都不会动。</p>
     <div class="cf-list">${body}</div>
     <div class="foot">
       <button type="button" class="btn" id="cf_cancel">取消</button>
       <div class="spacer"></div>
       <button type="button" class="btn primary" id="cf_ok">确认执行</button>
     </div>`;
  openMask();
  const ops = r.ops;
  const no = document.getElementById('cf_cancel');
  const ok = document.getElementById('cf_ok');
  if (no) no.onclick = () => closeModal();
  if (ok) ok.onclick = () => { closeModal(); aiOpsApply(ops); };
}
/* 执行 + 播报。确认页点了「确认执行」，或者 3A 判出"不需要确认"时直接走这里。 */
function aiOpsApply(ops, execOpts){
  const run = aiExecOps(ops, execOpts);
  /* 立刻同步一次焦点条：aiExecOps 落库后调的是 refreshAfterChange（FLIP 快路径），
     那 420ms 里顶部那行还是旧的 —— 遥控器的"我在改哪一条"不该滞后。 */
  syncFocusStrip();
  if (!run.ok){ aiFail('没改成，已经退回去了'); return run; }
  const n = (run.changed || []).length;
  if (!n){ aiSay('什么都没改'); return run; }
  /* 带撤销的提示活 9 秒（比默认 5 秒长一点）：撤销是数据安全那一类，窗口要够。
     toast 的"带按钮的提示不被顶掉"规则会保护它不被后台建议替换。 */
  aiSay('已改 ' + n + ' 条', aiOpsActs(run), 9000);
  return run;
}

/* ---------- 3B.5 「改挂到…」出口 ---------- */
/* 照抄 aiSuggestApply 的三条纪律：防环（aiIsDescendant）、可撤销、折叠态还原。
   选父那一层直接复用 0C 的 openParentPicker（"在弹层上盖一层不透明面板"那套）。
   ⚠️ 独立使用（这里没有编辑器撑着）时 .modal 里是空的，而面板是 `inset:0` 的 absolute ——
   父盒高度塌成 0 的话面板也看不见，所以先放一个占位壳把 .modal 撑起来。
   面板收起（确定 / 移出到顶层 / 取消 / Esc）后这个壳就没用了 → 连同弹层一起关掉；
   用 MutationObserver 盯住面板的移除，而不是在 onPick 里关 —— 取消那条路根本不走 onPick。 */
function aiOpenRemount(it){
  if (!it) return;
  const cur = it.parent || null;
  modal.innerHTML = '<h3 id="modalTitle">改挂到…</h3>'
    + '<p class="cf-sub">把「' + esc(it.title || '') + '」挂到哪一条下面？</p>'
    + '<div class="cf-holder" aria-hidden="true"></div>';
  const mo = new MutationObserver(() => {
    if (modal.querySelector('#pp_panel')) return;
    mo.disconnect();
    if (mask.classList.contains('on')) closeModal();
  });
  openParentPicker(it, false, () => cur, pid => {
    if (pid === cur) return;
    const old = it.parent || null;
    const to = pid ? it_byId(pid) : null;
    /* 折叠态记的是**新目标**的（与 aiSuggestApply 同一口径）：挂进去要看得见 → 先展开；
       撤销时把"它本来是收起的"这件事还回去。记旧父的折叠态是错的 —— 那条我们没动过。 */
    const wasCollapsed = pid ? collapsed.has(pid) : false;
    it.parent = pid || null;
    if (pid) collapsed.delete(pid);
    save(); refresh();
    toast(to ? ('已挂到「' + to.title + '」下面') : '已移到顶层', '撤销', () => {
      it.parent = old;
      if (pid){ if (wasCollapsed) collapsed.add(pid); else collapsed.delete(pid); }
      save(); refresh();
    });
  });
  mo.observe(modal, { childList: true });
}

/* ---------- 3B.6 入口接线：update 一律不预落库 ---------- */
/* 走一次 update 全流程（aiRunCommand 内部已经分好了"该确认"和"直接执行"）。
   返回内核结果，调用方据此决定要不要退回原路（voiceRight 用得上）。 */
async function aiRunUpdateEntry(text, opts){
  const o = opts || {};
  let r = null;
  try { r = await aiRunCommand(text, null); }
  catch (e){ aiFail('AI 没接上，这条没改'); return null; }
  if (!r || r.route !== 'update') return r;          // 判成新建：调用方照老路走
  if (r.needConfirm){
    /* 红线 ①：确认页出来之前一行数据都不动 —— aiRunCommand 已经把"不执行"保证好了，
       这里只负责把计划**渲染出来**。不额外播报：确认页自己就是那条消息。 */
    aiConfirmOps(r);
    return r;
  }
  if (!r.ok){
    /* 改不动（没候选 / 降级 / 关着）。**绝不能把用户那句话吞掉** —— 给一个一键出口，
       点一下就走原来的新建路径（同一个输入框、同一条落库路径）。 */
    const msg = aiOpsReply(r).msg;
    const acts = o.retryCreate === false ? null
      : [{ label: '记成新的一条', fn: () => commitEntry({ text: text, forceCreate: true }) }];
    aiFail(msg, acts, 9000);
    return r;
  }
  const n = (r.changed || []).length;
  aiSay(n ? ('已改 ' + n + ' 条') : '什么都没改', aiOpsActs(r), 9000);
  return r;
}

/* ==================================================================== */
/*  ★ 4B 图片入口：拍/选一张图（便签、白板、截图、课程表）→ 待办条目        */
/* ==================================================================== */
/* 本卡红线（都有源码级或行为级断言钉着）：
     · 出网只走 aiCall —— 全文件 fetch( 仍然只有那 1 处；
     · 校验只走 2A 的 aiValidateItems，**不另写一套解析**；
     · 失败绝不生成假数据（看不清就说看不清）；
     · aiMode === 'off' 时零请求，并给一句人话；
     · base64 不进 S、不进 snapshot()（图只在内存里活一次就扔）；
     · 上传前必须压图（长边 ≤1600px、JPEG 0.8）；
     · 一个权限都不加（原生侧走系统选择器 / SAF，两条路都不要权限）。 */
const IMG_MAX_SIDE = 1600;                    // 长边上限
const IMG_JPEG_Q = 0.8;                       // JPEG 质量
const IMG_REJECT_BYTES = 8 * 1024 * 1024;     // 原图 > 8MB 直接拒（别硬传）
/* 请求体的前缀：schema **就是 2A 那一条**（这样 aiValidateItems 能直接吃），
   整段是常量、逐字符固定 —— 变量全在最后那条 user 消息里（缓存命中价 1/50）。 */
const AI_IMAGE_SYS =
  '你把一张照片（便签、白板、截图、课程表、手写清单）整理成待办条目。'
  + '只输出 JSON，不要解释文字、不要 markdown 围栏。\n'
  + '输出形状固定为：' + AI_UNDERSTAND_SCHEMA + '\n'
  + '字段规则：\n'
  + '· title 条目内容（中文，去掉时间词与语气词，不能为空）\n'
  + '· date / endDate 只能是 YYYY-MM-DD（endDate 是区间的结束日，没有就写空串）\n'
  + '· time 只能是 HH:MM 24 小时制（没有就写空串）\n'
  + '· tags 字符串数组，每项只允许中文/字母/数字/下划线，最多 3 个\n'
  + '· pri 0 普通 / 1 重要 / 2 紧急\n'
  + '· parent 这一条要挂到**同一次回答里另一条**下面时，填那一条的 title；否则空串\n'
  + '· note 补充说明，没有就空串\n'
  /* ★ 5F：这一行原来还是旧措辞「想做的事」（2C 只改了文字路径的 AI_UNDERSTAND_SYS，
     把它留着当债务登记了三轮）——「想做的事」与「要做的事」在中文里近乎同义，
     模型会把待办判成想法。现在与 AI_UNDERSTAND_SYS 的**排斥式定义**对齐（语义相同、
     按"这条"而不是"这句话"改写；AI_UNDERSTAND_SYS 本身**一个字不动**，_2c-regress 逐字符钉着）。 */
  + '· zone 只管**没写日期**的那一条，两个值**互不重叠**：'
  + '写 "idea" = **现在还没法动手**的事，还在纠结"要不要做"、方向都没定的念头'
  + '（该不该换工作、要不要学个乐器这类）；'
  + '写 "long" = **已经确定要做、只是还没排日期**的事（开个会、交材料、给谁回个电话）。'
  + '判据：这条里只要有一个**能直接去做的动作**（开会 / 买 / 写 / 交 / 打 / 发 / 约 / 找 / 问 / 准备 / 整理…），'
  + '它就是待办，**不许**写 "idea"。'
  + '写了日期的一律空串；拿不准**一律当待办**（写空串），别去猜"他是不是只是想想"。'
  + '这两个词只能二选一，别自创。\n'
  + '· steps 子想法：**只有这件事明显能拆成两个及以上步骤时才给**，每项一句话、不超过 30 字；'
  + '否则一律空数组。\n'
  + '· corrected 把图里**明显的**错字按上下文改对之后的完整句子（没把握就照抄）\n'
  + '· confidence 0~1，你对这次识别的把握\n'
  + '铁律：只做**转录**。图上看不清、认不出的字一律不要猜；'
  + '图里没有任何一件要办的事，就输出 {"items":[],"corrected":"","confidence":0}。'
  + '不许新增图里没有的信息，不许替用户决定做不做。';
/* user 消息里的变量部分（今天日期必须有，否则图里的"明天 / 下周三"会算错）。 */
function aiImageUser(){
  return '今天是：' + ymd(new Date()) + '\n把这张图里要办的事整理成待办条目。看不清的字不要猜。';
}

/* 等比缩到长边 ≤ max —— **纯函数**。真实渲染在 imgCompress 里，这一步单独抽出来
   是为了能离线断言"1600 这个口径"（见 _4b-regress 第 7 条）。 */
function imgFitSide(w, h, max){
  const W = Math.max(1, Math.round(Number(w) || 1));
  const H = Math.max(1, Math.round(Number(h) || 1));
  const m = Math.max(W, H);
  if (m <= max) return { w: W, h: H };
  const k = max / m;
  return { w: Math.max(1, Math.round(W * k)), h: Math.max(1, Math.round(H * k)) };
}
/* 压图：长边 ≤1600px、JPEG 质量 0.8 → dataURL。
   为什么必须压：原图直接 base64 还要再膨胀 33%，一张 5MB 的图既慢又贵；
   "单图 ≤32MiB / 请求体 ≤48MiB"是最后一道闸，不是第一道。
   解不出来 / canvas 不给用一律抛异常 —— 调用方提示"读不出来"，**绝不上传原图**。 */
function imgCompress(file){
  return new Promise((resolve, reject) => {
    let url = '';
    try { url = URL.createObjectURL(file); } catch (e){ reject(e); return; }
    const im = new Image();
    const done = fn => { try { if (url) URL.revokeObjectURL(url); } catch (e){} fn(); };
    im.onload = () => {
      try {
        const t = imgFitSide(im.naturalWidth, im.naturalHeight, IMG_MAX_SIDE);
        const cv = document.createElement('canvas');
        cv.width = t.w; cv.height = t.h;
        const cx = cv.getContext('2d');
        cx.drawImage(im, 0, 0, t.w, t.h);
        const dataUrl = cv.toDataURL('image/jpeg', IMG_JPEG_Q);
        done(() => resolve({ dataUrl: dataUrl, w: t.w, h: t.h,
          srcW: im.naturalWidth, srcH: im.naturalHeight }));
      } catch (e){ done(() => reject(e)); }
    };
    im.onerror = () => done(() => reject(new Error('decode')));
    im.src = url;
  });
}

/* 入口：点了图片键。先过"AI 能不能用"这道闸（红线 4：关着就零请求 + 一句人话），
   再打开那个隐藏的 file input；真正干活在 onImagePicked → imageTodos。 */
function pickImage(){
  if (!aiOn()){
    if (S.aiMode === 'off') aiFail('识图要联网，先开一下 AI');
    else openAiNeedOn();              // 开着但没 key：给引导页（隐私开关必须他本人点）
    return;
  }
  const inp = document.getElementById('imgInput');
  if (!inp){ aiFail('这个环境挑不了图'); return; }
  inp.click();
}
/* <input type=file> 的 change。**value 立刻清空** —— 不清的话同一张图连选两次不触发 change。 */
function onImagePicked(e){
  const f = e && e.target && e.target.files && e.target.files[0];
  if (e && e.target){ try { e.target.value = ''; } catch (err){} }
  if (f) imageTodos(f);
}
/* 图 → 条目：两道前置闸（太大 / AI 关着）→ 压图 → 出网 → 校验 → 确认页。 */
async function imageTodos(file){
  if (!file) return;
  if (Number(file.size) > IMG_REJECT_BYTES){
    aiFail('这张图太大了（' + Math.round(Number(file.size) / 1048576) + 'MB），先裁小一点再试');
    return;
  }
  if (!aiOn()){
    if (S.aiMode === 'off') aiFail('识图要联网，先开一下 AI');
    else openAiNeedOn();
    return;
  }
  toast('看图识别中…', null, 8000);
  let shot = null;
  try { shot = await imgCompress(file); }
  catch (e){ aiFail('这张图读不出来，换一张试试'); return; }
  await imageAsk(shot.dataUrl);
}
/* 出网 → 解析 → 校验 → 确认页。**那张图的 base64 只以参数形式活这一次**，
   全程不落到 S / localStorage / snapshot() 里（几 MB 的字符串会把存档撑爆）。 */
async function imageAsk(dataUrl){
  let txt;
  try {
    txt = await aiCall([
      { role: 'system', content: AI_IMAGE_SYS },
      { role: 'user', content: [
        { type: 'text', text: aiImageUser() },
        { type: 'image_url', image_url: { url: String(dataUrl || '') } }
      ] }
    ], { json: true });
  } catch (e){ aiFail('AI 没接上，这张图没看'); return; }
  let data = null;
  try { data = aiParseJSON(txt); } catch (e){ aiFail('AI 没接上，这张图没看'); return; }
  /* 红线 2：**复用 2A 的校验器**，一个字都不许另写解析。
     空标题、pri=9 这类脏条目在这里就被丢掉；一条都不剩 → 什么都不落。
     ★ 5F：图片这条没有"**原话**"，但**图里识别出来的文字**是有的 —— 拿它当 fromText
     喂给 2C 那条窄护栏（「什么时候 / 哪天 / 几点 / …」出现时不许写 idea）。
     拼的是 corrected + 每条 title（都不进 S、不上屏，只是本函数里的一个局部串）。
     口径与文字路径一致：护栏按"整段识别文本"判，而不是逐条各判一次。 */
  const seenText = [];
  if (data && typeof data.corrected === 'string') seenText.push(data.corrected);
  ((data && data.items) || []).forEach(x => {
    const t = x && x.title;
    if (typeof t === 'string') seenText.push(t);
  });
  const items = aiValidateItems(data && data.items, seenText.join('\n'));
  if (!items.length){ aiFail('这张图我没看出待办 · 换一张清楚点的'); return; }
  openImageConfirm(items);
}
/* 确认页：住在现有的 #mask / .modal 里，复用 3B 的 .cf-* 样式，**不新造浮层**。
   取消 = 零落库：取消 / Esc / 点遮罩三条路都只走 closeModal，一个字段都不碰。
   ★ 4D（用户点名要）：每一条现在**点得开** —— 点它开现有的编辑弹层改，
   改完回到这一页，改的值写回这份 items；点「确认添加」才落库，落的是改后的值。 */
/* 这一份就是确认页的数据源，也是"确认添加"要落库的那份 —— 所以它必须活在模块级：
   编辑器打开时会把 .modal 的 DOM 整个换掉，闭包里的局部变量活不过那一下。 */
let icItems = [];
/* 一行灰字（日期 · 钟点 · 重要度 · 标签 · 挂在）—— 抽成纯函数，改完能单测它跟着变。 */
function icRowBits(x){
  const bits = [];
  if (x.date) bits.push('日期 ' + x.date + (x.dateEnd ? '~' + x.dateEnd : ''));
  if (x.time) bits.push('钟点 ' + x.time);
  if (x.pri) bits.push(x.pri === 2 ? '紧急' : '重要');
  if (x.tags && x.tags.length) bits.push(x.tags.join('/'));
  if (x.parent) bits.push('挂在「' + x.parent + '」下');
  return bits;
}
/* 编辑器保存回来的字段 → 写回确认页那一条。
   **只写编辑器真正管得着、且落库真正会读的那几样**（aiPlanPreset 读的字段）：
   title/date/dateEnd/time/pri/tags/zone。
   刻意**不写 parent** —— 确认页那儿的 parent 是"标题"，编辑器里的是真 id，
   两个口径不能混（编辑器那条「挂在…下面」在这条路上是关掉的）。 */
function icApplyEdit(src, it){
  if (!src || !it) return src;
  src.title = String(it.title || src.title || '');
  src.date = it.date || null;
  src.dateEnd = it.dateEnd || null;
  src.time = it.time || null;
  src.pri = Number(it.pri) || 0;
  src.tags = Array.isArray(it.tags) ? it.tags.slice() : [];
  /* ★ 7B：分区白名单从写死的三值改成"分区表里认得出 + 未分组 + 想法"。 */
  if (it.zone === 'idea' || it.zone === '' || validZoneKey(it.zone)) src.zone = it.zone;
  return src;
}
function openImageConfirm(items){
  /* 「看图识别中…」那条提示要在这里收掉：确认页一出来它就没意义了，
     而且它会浮在弹层上方（#toast 的 z-index 比 .mask 还高）挡着标题。 */
  hideToast();
  if (Array.isArray(items)) icItems = items;
  const list = icItems;
  const body = list.map((x, i) => {
    const bits = icRowBits(x);
    /* 用真 <button>（不是给 div 挂 onclick）：键盘能 Tab 到、读屏会播"按钮"。
       类名 .cf-row-go 只加"可点"这套盒模型 —— .cf-row 基类与 3B 的确认页共用，
       不能动（那儿的行是普通列表，改成 flex 会散架）。 */
    return '<button type="button" class="cf-row cf-row-go" data-i="' + i + '"'
      + ' aria-label="编辑「' + esc(x.title) + '」">'
      + '<span class="cf-main"><span class="cf-t">' + esc(x.title) + '</span>'
      + (bits.length ? '<span class="cf-ch"><span class="cf-bits">' + esc(bits.join(' · ')) + '</span></span>' : '')
      + '</span><span class="cf-go" aria-hidden="true">✎</span></button>';
  }).join('');
  modal.innerHTML =
    '<h3 id="modalTitle">图里认出了 ' + list.length + ' 条</h3>'
    + '<p class="cf-sub">确认之前，一条都不会存。<b>点一条可以改它。</b></p>'
    + '<div class="cf-list">' + body + '</div>'
    + '<div class="foot">'
    +   '<button type="button" class="btn" id="ic_cancel">取消</button>'
    +   '<div class="spacer"></div>'
    +   '<button type="button" class="btn primary" id="ic_ok">确认添加</button>'
    + '</div>';
  openMask();
  modal.querySelectorAll('.cf-row-go').forEach(b => {
    b.onclick = () => imageConfirmEdit(+b.dataset.i);
  });
  const no = document.getElementById('ic_cancel');
  const ok = document.getElementById('ic_ok');
  if (no) no.onclick = () => closeModal();
  if (ok) ok.onclick = () => { closeModal(); imageCommit(icItems); };
}
/* ★ 4D：点确认页的一条 → 借现有的 openItemEditor 改它（不新造编辑器）。
   三个坑都在这里处理：
    ① 编辑器住在**同一个 .modal** 里，打开会把确认页 DOM 整个换掉 → 所以数据在模块级
       `icItems`，关掉编辑器后重建确认页（不是回到一片空白）。
    ② 编辑器改的是**一份草稿副本**，只有点「改好了」才把字段写回 icItems ——
       取消时那条一个字都不变（0B/3B 的老红线）。
    ③ 确认页的「取消 / Esc / 点遮罩」走的是全局 closeModal，没法逐个改写 ——
       用弹层自带的"关闭后回调"（setModalAfterClose）把确认页接回来，一处收口。
       编辑器保存走的是我们给它的 opts.onSave：**不落库、不关弹层**，
       直接重建确认页（这就是"改完回到确认页"）。 */
function imageConfirmEdit(i){
  const src = icItems[i];
  if (!src) return;
  const draft = Object.assign({}, src);
  let done = false;
  const back = () => {
    if (done) return;
    done = true;
    setModalAfterClose(null);
    openImageConfirm(icItems);
  };
  setModalAfterClose(back);
  openItemEditor(draft, true, null, null, {
    title: '改这一条',
    okLabel: '改好了',
    noParent: true,                       // 确认页的 parent 是"标题"，与编辑器的 id 口径不能混
    onSave: it => { icApplyEdit(src, it); back(); }
  });
}
/* 确认后落库。走 aiCommitPlan → addItem(text, preset) —— 落库的**唯一路径**
   （通知排期 / 标签上限 / 父子挂靠 / 作业字段都在 addItem 里，一条都不用另写）。
   raw 传 "图片" 两个字：它的唯一用途是给这条留一段可追溯的原文。 */
function imageCommit(items){
  const list = Array.isArray(items) ? items : [];
  const made = aiCommitPlan({ items: list }, '图片');
  if (!made.length){ aiFail('这张图我没看出待办 · 换一张清楚点的'); return; }
  S.aiAnchor = String(made[0].title || '').slice(0, 60);
  save();
  refresh();
  const ids = made.map(x => x.id);
  toast('从图里加了 ' + made.length + ' 条', [{ label: '撤销', fn: () => {
    const kill = new Set(ids);
    S.items = S.items.filter(x => !kill.has(x.id));
    save(); refresh();
  } }], 9000);
}
/* 4B 的入口接线。与录入框的 Enter 同一个位置（script 在 body 末尾，元素已经在）。 */
(function initImageEntry(){
  const pb = document.getElementById('picBtn');
  const ii = document.getElementById('imgInput');
  if (pb) pb.addEventListener('click', pickImage);
  if (ii) ii.addEventListener('change', onImagePicked);
})();

let rafRefresh = 0;
/* ★ 5I：刷新代次。keepSeedPlace 靠它判断"别人是不是又刷新了一次界面"——
   是的话就收工，不再替后来那次改动继续补偿（否则会跟用户的下一步抢）。 */
let refreshSeq = 0;
function refresh(){
  refreshSeq++;
  if (rafRefresh) return;
  rafRefresh = requestAnimationFrame(() => {
    rafRefresh = 0;
    /* ★ v3.50：离开想法页就把它那点会话级状态清干净 —— 多选态和展开着的续写框
       都是"这一屏的临时状态"，带到别的页去只会让人莫名其妙（比如回到想法页时
       发现上次勾了一半还开着）。 */
    if (S.view !== 'idea' && (ideaUI.mergeMode || ideaUI.mergeSel.size || ideaUI.sparkOpen)){
      ideaUI.mergeMode = false; ideaUI.mergeSel.clear(); ideaUI.sparkOpen = null;
    }
    /* 回顾的进度也是"这一屏的临时状态"，跨天不该带着走 */
    if (S.view !== 'idea' && S.ideaReviewDone !== ymd(new Date())){
      ideaUI.reviewShown = new Set(); ideaUI.reviewHandled = new Set();
    }
    /* ★ 审查修复（2026-10-04）：全屏树状图是**全局副作用**（藏底栏 + 锁滚动），只在
       "正在看树状图"时才有意义。它原来只在两处被清（切分段开关 / Escape），于是任何别的
       换视图路径 —— 例如立项后 toast 的「去看」—— 都会把它留下：底栏永久 display:none、
       页面永久锁滚动，安卓上没有 Escape，只能杀进程。在这里做一次校验兜底，不依赖调用点自觉。 */
    if (treeFull && (S.view !== 'idea' || S.ideaLayout !== 'tree')){
      treeFull = false;
      document.documentElement.classList.remove('tree-full');
    }
    if (S.view === 'list') renderList();
    else if (S.view === 'entry'){ /* 录入界面由 hero + 录入条 + 标签/提示构成，#view 留空 */ view.innerHTML = ''; }
    else if (S.view === 'idea') renderIdeas();
    else if (S.view === 'settings') renderSettings();
    else renderStat();   // 其余（含 'stat'）都走统计
    renderFilters();
    renderEntryTags();
    ANIM = false;   // 渲染完就关掉，之后的纯数据更新不再重播入场动画

    /* 顶栏撤掉后没有「条数」常驻位了，这里只需无错即可（没有 #counts 时不抛） */
    const counts = document.getElementById('counts');
    if (counts){
      const total = S.items.filter(i => !i.done).length;
      counts.textContent = total ? total + ' 条未完成' : '清空了';
    }

    /* 备份角标只在设置页（#backup 在那里）才有，其它视图里元素不存在，跳过即可 */
    const b = document.getElementById('backup');
    if (b){
      /* 「该备份了」只换形态、不换颜色（用户要求去掉红字，见 .backup.due 处的说明）：
         未备份 / 超 7 天 → 加中性描边胶囊；其余只是一行次级小字。 */
      if (!S.lastBackup){ b.textContent = '未备份'; b.className = 'backup due'; }
      else {
        const d = Math.floor((Date.now() - S.lastBackup) / 86400000);
        b.textContent = d <= 0 ? '今天已备份' : d + ' 天前备份';
        b.className = 'backup' + (d >= 7 ? ' due' : '');
      }
    }
    /* 底栏 3 个页签（.tab）：用 aria-current="page" 标当前页（读屏标准说法）。
       录入界面（entry）不是页签，三个页签都不标当前。 */
    document.querySelectorAll('.tab').forEach(x => {
      if (x.dataset.view === S.view) x.setAttribute('aria-current', 'page');

/* 布局切换过渡（分区 ⇄ 时间轴、统计的横条 ⇄ 方块 共用）。两种手法见 swapContent 内的说明：

     Last   换完 DOM 立刻再量一遍

          · 带 data-fk 的（标题 / 日期 / 标签）会被下面的"祖先补偿"反解回去，看起来不扁；
          · **不带 data-fk 的**（那颗勾选框、没挂键的 chip、作业补充行……）没人替它们反解，
            于是被父级那 8% 的横向挤压直接压扁 —— 这一部分正是用户看到的"字被左右拉伸"。
          只要有一个祖先是非等比缩放，整棵子树就不可能不变形（等比链条才是可逆的）。
          所以：**所有元素都只用同一个比例 s**，链条整体等比，子树里的字一律不变形。

       位移仍按左上角精确反解，所以落点一分不差。
       如实测：一条待办在分区/时间轴之间搬动时 sx=0.918 / sy=1.013 → s=0.964 → 命中吸附 → 纯平移。

    ux = Math.min(1.3333, Math.max(0.75, ux));
    uy = Math.min(1.3333, Math.max(0.75, uy));

    if (Math.abs(ux - 1) <= 0.06 && Math.abs(uy - 1) <= 0.06) us = 1;

    const ay = (Poy - y1) + (b.y - Poy - Pay) / PSy;

     .feature-card 自己就有 `transition:transform 320ms`（统计卡片的悬停抬升用的）。
     带着它写倒推值时，那次写入会被当成一段过渡的起点，此刻计算样式仍是旧值；
     紧接着我们再写 `none`，浏览器前后两次算出来都是"没有位移" → 过渡压根不触发。
     实测对照：裸 div 的 computed 立刻是 matrix(1.5,…)、.feature-card 却始终是 matrix(1,0,0,1,0,0)。

  plan.forEach(el => {

    el.style.transform = 'translate(' + t.ax.toFixed(2) + 'px,' + t.ay.toFixed(2) + 'px)'

     的那一帧被画出来）。 */
  void document.body.offsetWidth;
  plan.forEach(el => {

  /* 收尾：把行内样式全部撤掉，回到 CSS 说了算 —— 否则这些元素会一直挂着

  setTimeout(() => {
    plan.forEach(el => {

      el.style.transition = ''; el.style.transform = ''; el.style.transformOrigin = '';
    });
    restoreCV();                     // 动画收尾再把 content-visibility 还给样式表
  }, D + 80);
  return plan.length;
}
