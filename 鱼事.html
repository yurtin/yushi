      const n = Number(v[k]);
      /* ★ 2B：计数带小数权重（手动改标题 = 1、AI 纠错 = 0.5）—— 这里原来是 Math.floor，
         会把 0.5 直接抹成 0、AI 那一路的印记全丢。改成保留一位小数。 */
      if (k && Number.isFinite(n) && n > 0) out[k] = Math.min(99, Math.round(n * 10) / 10);
    }
  }
  return out;
}
/* 按隐私档组装要发出去的文本。**只发当前这一条**，不发全库。 */
function aiSeedText(it, withBody){
  const title = String(it.title || '').trim();
  if (!withBody) return title;
  const sparks = (Array.isArray(it.sparks) ? it.sparks : [])
    .map(s => '- ' + String(s.text || '')).join('\n');
  const raw = String(it.raw || '').trim();
  return '标题：' + title
    + (raw && raw !== title ? '\n原文：' + raw : '')
    + (sparks ? '\n过程：\n' + sparks : '');
}
function aiPayload(it){ return aiSeedText(it, S.aiMode === 'full'); }

/* 唯一的出网口。返回文本；任何失败都抛异常 —— 调用方一律显示「AI 没接上」。 */
async function aiCall(messages, opts){
  const base = String(S.aiBase || '').trim().replace(/\/+$/, '');
  if (!base) throw new Error('no base');
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), AI_TIMEOUT_MS);
  try {
    const res = await fetch(base + '/v1/chat/completions', {
      method: 'POST',
      signal: ctl.signal,
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + aiKey() },
      body: JSON.stringify({
        model: S.aiModel || 'deepseek-flash',
        messages,
        stream: false,
        /* 关掉思考链：这里要的是"一个短问题 / 一组建议"，8 秒超时里跑思考链必然超时，
           而且思考 token 一样计费（官方文档：thinking 默认 enabled）。 */
        thinking: { type: 'disabled' },
        ...(opts && opts.json ? { response_format: { type: 'json_object' } } : {})
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const msg = data && data.choices && data.choices[0] && data.choices[0].message;
    const txt = String((msg && msg.content) || '').trim();
    if (!txt) throw new Error('empty');
    return txt;
  } finally { clearTimeout(timer); }
}
/* 从可能带 markdown 围栏 / 前后废话的输出里抠出第一个 JSON 对象 */
function aiParseJSON(txt){
  const s = String(txt || '').replace(/```[a-zA-Z]*/g, '').replace(/```/g, '').trim();
  const i = s.indexOf('{'), j = s.lastIndexOf('}');
  if (i < 0 || j <= i) throw new Error('no json');
  return JSON.parse(s.slice(i, j + 1));
}
/* 失败提示必须先清掉当前那条。toast() 有一条"带按钮的提示不被顶掉"的规则（保护撤销），
   而「问我一问」成功后会留一条带「怎么回」按钮的提示 —— 不清掉的话，紧跟着的
   「AI 没接上」会被整条吃掉，用户只看到上一条，等于报错静默。
   （2026-10-03 实测：连点两次提问，第二次失败时页面上什么都不显示。） */
function aiFail(msg, acts, dur){ hideToast(); return toast(msg || 'AI 没接上', acts, dur); }
/* AI 的其它消息也走同一条路：先清掉当前那条再说，免得被上面那条带按钮的提示吃掉。
   （「问我一问」成功那条带「怎么回」，它自己就是被保护的那一条，不走这里。） */
function aiSay(msg, acts, dur){ hideToast(); return toast(msg, acts, dur); }

/* ★ v5.0 真机反馈：key 输入框原来用 type=password —— 安卓一看到密码框就切**安全键盘**，
   而安全键盘（以及部分输入法的密码模式）**禁用粘贴**，于是 key 根本填不进去。
   现在改成 type=text + CSS 遮字（看起来还是圆点，但走普通键盘，长按能粘贴），
   再配一个「粘贴」按钮兜底。三档降级：
     ① native 桥（Android 剪贴板，最稳）→ ② navigator.clipboard → ③ 提示长按输入框。 */
function aiPasteKey(){
  const inp = document.getElementById('aiKeyInput');
  if (!inp) return;
  const fill = txt => {
    const s = String(txt == null ? '' : txt).trim();
    if (!s){ aiSay('剪贴板里没有文字'); return; }
    inp.value = s;
    aiSetKey(s);              // 点完「粘贴」就生效，不用等失焦
    refresh();                // 重渲染：label 上的掩码、按钮状态一起更新
    aiSay('填好了：' + (s.length > 8 ? '••••••' + s.slice(-4) : '••••'));
  };
  try {
    const N = window.YuShiNative;
    if (N && typeof N.readClipboard === 'function'){
      const t = N.readClipboard();
      if (t && String(t).trim()) fill(t);
      else aiSay('剪贴板是空的，或系统不让读');
      return;
    }
  } catch (e){}
  if (navigator.clipboard && navigator.clipboard.readText){
    navigator.clipboard.readText().then(fill).catch(() => {
      inp.focus(); aiSay('浏览器不让自动读，长按输入框选「粘贴」');
    });
    return;
  }
  inp.focus();
  aiSay('长按输入框，用系统的「粘贴」');
}
/* 显示 / 隐藏：贴完核对一下后四位，或者确认没贴错时用 */
function aiToggleKeyShow(){
  const inp = document.getElementById('aiKeyInput');
  const btn = document.querySelector('[data-act="aishowkey"]');
  if (!inp || !btn) return;
  const masked = inp.getAttribute('data-mask') !== '0';
  inp.setAttribute('data-mask', masked ? '0' : '1');
  btn.setAttribute('aria-pressed', masked ? 'true' : 'false');
  btn.textContent = masked ? '隐藏' : '显示';
}
/* 未开启 / 没 key 时的引导页。**不替用户打开开关** —— 隐私开关必须由他本人点。 */
function openAiNeedOn(){

/* ---------- 3.6 质疑（角色扮演式）：一次一个问题 ---------- */
async function aiAsk(it){
  if (!isSeed(it)) return;
  if (!aiOn()){ openAiNeedOn(); return; }
  const r = AI_ROLES[Math.floor(Math.random() * AI_ROLES.length)];
  toast('以「' + r + '」的身份问着…');
  let txt;
  try {
    txt = await aiCall([
      { role: 'system', content:
        '你只做一件事：就用户写的一条想法，问出恰好一个问题。'
        + '不要给建议、不要总结、不要下判断、不要多问。'
        + '问题必须用中文，并且必须出现用户原文里出现过的具体词。直接输出这个问题本身。' },
      { role: 'user', content:
        '你现在扮演：' + r + '。\n下面是我的这条想法：\n' + aiPayload(it)
        + '\n\n请只问一个问题。' }
    ]);
  } catch (e){ aiFail('AI 没接上'); return; }          // 失败不扣配额
  const q = txt.replace(/^[\s"'「『（(]+/, '').replace(/[\s"'」』）)]+$/, '')
    .split('\n').map(x => x.trim()).filter(Boolean)[0] || '';
  if (!q){ aiFail('AI 没接上'); return; }
  if (!Array.isArray(it.sparks)) it.sparks = [];
  it.sparks.push({ at: ymd(new Date()), text: q, by: 'ai', role: r });
  S.ideaUsedAt = ymd(new Date());
  save(); refresh();
  toast('它作为「' + r + '」问了你一句', '怎么回', () => { seedOpenInline(it); });
}
/* 树状图里没有行内输入框，所以"怎么回"要分两条路 */
function seedOpenInline(it){
  if (S.ideaLayout === 'tree'){
    openSeedPrompt('续写', it.title, '现在多了什么信息？', v => { if (seedAddSpark(it, v)) refresh(); });
    return;
  }
  ideaUI.sparkOpen = it.id; refresh();
}

/* ---------- 3.4 找关联：产物是**挂载建议**，不是相关列表 ---------- */
let aiScanBusy = false;
async function aiScanLinks(manual){
  /* ★ 审查修复（2026-10-04）：自动扫描与手动点击可以同时发，提示互相顶掉。
     加一道会话级在途闸 —— 一次只跑一个。 */
  if (aiScanBusy) return;
  if (!aiOn()){ if (manual) openAiNeedOn(); return; }
  const pool = S.items.filter(i => isSeed(i) && !i.done)
    .sort((a, b) => ideaLastAt(b) - ideaLastAt(a)).slice(0, AI_MAX_SCAN);
  if (pool.length < 2){ if (manual) aiSay('想法还太少，再多记几条'); return; }
  const lines = pool.map((it, i) => (i + 1) + '. ' + aiPayload(it).replace(/\n/g, ' / ')).join('\n');
  if (manual) toast('找着…');
  let out;
  try {
    out = await aiCall([
      { role: 'system', content: '你把一个人的想法整理成树。只输出 JSON，不要任何解释文字。' },
      { role: 'user', content:
        '下面是想法列表，编号从 1 开始：\n' + lines
        + '\n\n请找出最多 3 组「A 应该挂在 B 下面」的关系（A 是从 B 发展出来的，或本来就是 B 的一部分）。'
        + '要求：from / to 都是上面的编号（整数）；why 是一句中文，必须引用这两条里出现过的词。'
        + '只输出这个形状：{"links":[{"from":1,"to":2,"why":"…"}]}。没有就输出 {"links":[]}。' }
    ], { json: true });
  } catch (e){
    /* ★ 审查修复（2026-10-04）：失败不扣配额，但要**记下时间** ——
       原来失败不写 S.lastScanAt，于是"距上次扫描 > 24h"永远成立，每次打开 App 都会重发一次，
       与"每天 1 次"的口径不符。自动路径仍然不打扰用户（§12：不报错、不空转）。 */
    aiScanBusy = false;
    S.lastScanAt = Date.now(); save();
    if (manual) aiFail('AI 没接上');
    return;
  }
  aiScanBusy = false;

  let links = [];
  try { links = (aiParseJSON(out).links || []); } catch (e){ links = []; }
  const byIdx = i => (i >= 1 && i <= pool.length) ? pool[i - 1] : null;
  let n = 0;
  links.slice(0, 3).forEach(L => {
    const a = byIdx(Number(L && L.from)), b = byIdx(Number(L && L.to));
    if (!a || !b || a.id === b.id) return;
    if (aiIsDescendant(b, a)) return;                     // 防环：不能挂到自己的后代下面
    if (!Array.isArray(a.suggest)) a.suggest = [];
    if (a.suggest.some(s => s.to === b.id)) return;
    a.suggest.push({ to: b.id, why: String((L && L.why) || '').slice(0, 120) });
    n++;
  });
  /* ★ 审查修复（2026-10-04）：模型答了但**一条都用不了**（编号越界 / 全非法）= "没答好"，
     按 §12 应当丢弃结果 + 配额退回，而不是算一次有效扫描把配额扣掉。 */
  if (!n && links.length){
    S.lastScanAt = Date.now(); save();
    if (manual) aiFail('AI 没答好，再试一次');
    return;
  }
  S.lastScanAt = Date.now();
  save(); refresh();
  if (manual) aiSay(n ? ('找到 ' + n + ' 条可以挂的，卡片上有 ✦') : '这次没找到可挂的');
}
/* to 是不是 it 的后代（防环：挂过去会形成 A→B→A 的圈） */
function aiIsDescendant(cand, it){
  const byId = new Map(S.items.map(i => [i.id, i]));
  let p = cand && cand.parent, g = 0;
  while (p && g++ < 64){
    if (p === it.id) return true;
    const q = byId.get(p); p = q && q.parent;
  }
  return false;
}

/* ==================== ★ 2A：理解内核（把一句话变成结构化条目） ====================
   由来（用户原话）："这个大于号太难用了，搞得跟还要我自己去学一套输入语言规范似的。"
   所以这一块的目标不是"多支持几种说法"，而是：

     **把输入语法从"必须学"降级成"可以学"。**
     你想快，就按语法写（本地 parseSmart，秒出、不烧 token）；
     你不想学，就随便说（模型听懂）。

   结构是一条**级联**：本地判据 → 出网（唯一出口 aiCall）→ 校验 → 纠错 → 失败降级。

   三条红线（改这块之前先读）：
     ① 不新增 fetch 调用点：全文件 AI 的**唯一网络出口**是 aiCall()；
     ② **失败绝不生成假数据**：网络 / 超时 / 非 2xx / JSON 坏 / 校验后为空，
        一律退回本地 parseSmart 的结果，并把"用的是本地识别"说清楚；
     ③ aiMode === 'off' 时**零请求**（一个字都不出这台手机）。

   ★ 叠字去重已经在 normalizeSpeech 里做过了（阶段1，commit 8e31b5a）——
     这里**只消费它的输出，绝不再写一遍**：JS 同名函数取最后一个定义，
     重写会让新代码静默失效（本项目在 gStartView 与 goBack 上各撞过一次）。 */

/* ---------- 本地级联：能本地解的，零调用 ---------- */
/* 追加词：出现这些词，说明这句大概率是**接着刚才那句**说的 —— 要不要挂到"刚才那条"
   下面需要模型判断，所以这一档交给模型。
   没有追加词 → 一律**新建独立条目**（用户定的保守默认：自动做错比不做更烦）。 */
const SMART_APPEND_WORDS = ['再加上', '还有', '顺便', '另外', '以及', '同时', '另外一个'];
/* 列举式切分只认"动词 + 顿号并列"这一种明显形状（买 A、B、C）。
   宁可不切 —— 把「研究」「东西」「资料」这类词切坏，比不切烦人得多。 */
const SMART_LIST_VERBS = ['买', '拿', '带', '交', '写', '做', '查', '看', '发', '寄',
  '准备', '预约', '订', '取', '还', '洗', '修', '送', '找', '领',
  '打印', '下载', '提交', '复习', '通知', '问'];

function smartAppendWord(text){
  const s = String(text || '');
  for (const w of SMART_APPEND_WORDS) if (s.indexOf(w) >= 0) return w;
  return null;
}
/* ★ 5E：加任何本地口语规则时，必须问一句 —— 「**关掉 AI 它还能用吗**？」
   本地不认 → AI 关着时它会静默变成"没时间 + 落长期 + 不提醒"，不报错。
   `_ref/_5e-regress.mjs` 是这张压力测试表（探针 `_ref/_5e-probe.mjs` 扫出真相）。
   ★ 6A：时间表达那一半已经升级成**全表扫描 + 常驻回归**：
     · 语料表 `_ref/_6a-corpus.mjs`（正交维度枚举，200 条，按常用度 freq 排序）；
     · 只读探针 `_ref/_6a-probe.mjs`（**不桩 fetch**：要的是"AI 关着"的 smartLocalPlan 那条路）；
     · 常驻回归 `_ref/_6a-regress.mjs`（**断言数 == 语料表行数**，一行一条）。
     以后要动时间解析：先 `node _ref/_6a-probe.mjs` 看真相，再在语料表里加一行 + 回归加一条断言。
   配套纪律：新规则若让 parseSmart 产出**非 title 字段**（date/time/repeat/tags/path/dayParts），
   必须在下面 smartHintCount 里补一条对应探测，否则 AI 开着时会白出一次网。
   ⚠️ 唯一的例外是**落点**（zone）：它不进 smartHintCount —— 路由判据是 2A 定的、不在本卡射程，
   而且 AI 开着时模型判落点比本地正则细，收回来会让"AI 开着"变差。 */
/* 本地"语法命中"计数 —— 用户**主动写了语法**的证据。
   命中 ≥1 且没有追加词 → 本地解析已经把这一行吃干净了，不必问模型。
   这条就是"语法降级为可选"的闸门：`买西瓜 明天`、`论文> 查文献 921`
   都从这里走掉，请求数为 0。 */
function smartHintCount(text){
  const s = String(text || '');
  let n = 0;
  if (/^\s*!{1,2}\s*\S/.test(s)) n++;                                    // !重要 / !!紧急
  if (/#[\u4e00-\u9fa5A-Za-z0-9_]+/.test(s)) n++;                        // #标签
  if (/[>＞]/.test(s)) n++;                                              // 父级路径
  if (/[?？]\s*$/.test(s)) n++;                                          // 行尾 ? → 想法
  if (/\d{1,2}\.\d{1,2}|\d{3,4}/.test(s)) n++;                           // 日期简写 921 / 9.21
  if (/今天|今日|明天|明日|后天|大后天|昨天|昨日|前天|大前天/.test(s)) n++;   // 相对日期（★ 6A 补往前那半边）
  /* ★ 6A：星期字后面紧跟量词的不算 —— `每周一次` 不是「每周一」。
     与 parseSmart 里那条守卫同一个判据：parseSmart 对它**不产出任何字段**，
     hint 也不该数它，否则 AI 开着时它会被当成"本地已吃干净"而白漏给规则。 */
  if (/(本周|这周|这个|下?周|星期|礼拜)[一二三四五六日天](?![次遍回个趟])/.test(s)) n++;     // 星期
  if (/\d{1,2}\s*号/.test(s)) n++;                                       // X 号
  /* ★ 6A：中文月日（`9月15号` / `2026年10月15日`）与 `X号到Y号`、`9/14~9/19`
     都是 parseSmart 会产出 date/dateEnd 的形状，必须各自有一条探测。 */
  if (/\d{1,4}\s*年\s*\d{1,2}\s*月|\d{1,2}\s*月\s*\d{1,2}\s*[日号]/.test(s)) n++;   // 中文月日
  if (/\d{1,2}\s*号\s*[到至]\s*\d{1,2}\s*号/.test(s)) n++;              // 号式区间
  if (/\d{1,2}\s*\/\s*\d{1,2}\s*[~～\-—－–−〜∼]\s*\d{1,2}\s*\/\s*\d{1,2}/.test(s)) n++;  // 斜杠月日区间
  if (/(凌晨|早上|早晨|上午|中午|下午|傍晚|晚上|晚)?\s*(\d{1,2}|[一二两三四五六七八九十]{1,3})\s*[点时:：]/.test(s)) n++;  // 钟点（★ 4D 起也认汉字数字，★ 5A 起认冒号）
  /* ★ 6A：时段缩写（今早/今晚/明早/明晚/昨晚）与单个时段词，都是"用户主动写了时间"。 */
  if (/(今|明|昨)\s*(早|晚)(?=\s|$|[、,，。;；:：!！?？]|\d|[一二两三四五六七八九十点])/.test(s)) n++;   // 今早/今晚/明早/明晚/昨晚
  if (/(?:^|[\s、,，。;；:：!！?？])(?:清晨|早上|早晨|上午|中午|午间|正午|下午|傍晚|晚上|夜里|夜间|凌晨|深夜)(?:$|[\s、,，。;；:：!！?？])/.test(s)) n++;   // 单个时段词
  /* ★ 5B：相对时间也是"用户主动写了语法"的证据 —— 不补这条，`1分钟后 交表`
     会被当成大白话白出一次网（多花钱、还可能被模型改写）。 */
  if (/\d+\s*(?:个)?\s*(?:分钟|分|小时|钟头)\s*(?:之?后)/.test(s)
    || /[一二两三四五六七八九十半]+\s*(?:个)?\s*(?:分钟|小时|钟头)\s*(?:之?后)/.test(s)) n++;  // N 分钟后 / 半小时后
  /* ★ 6A：`三天后` / `两周后` / `一个月后` 也是本地会产出 date 的形状。 */
  if (/(\d+|[一二两三四五六七八九十]+|半)\s*(?:个)?\s*(?:天|周|星期|月)\s*(?:之?后)/.test(s)) n++;  // N 天后 / N 周后 / N 个月后
  if (/每\s*隔?\s*(\d+|[一二两三四五六七八九十]+)\s*天|每天/.test(s)) n++;    // 循环
  /* ★ 4A：新循环形态也是"用户主动写了语法"的证据。
     「每周三」本来就被上面那条"星期"正则数到；漏的是「每月一号」这种汉字写法 ——
     不补这一条，它会当成大白话白出一次网（多花钱、还可能被模型改写）。 */
  if (/每\s*个?\s*月\s*(\d{1,2}|[一二三四五六七八九十]+)\s*[号日]/.test(s)) n++;  // 每月某日
  if (/[\d一二两三四五六七八九十]+\s*[~～\-—－–−〜∼]\s*[\d一二两三四五六七八九十]+/.test(s)) n++;  // 区间
  /* ★ 早中晚连写（`早中晚吃药`）也是**一条本地语法** —— 它是阶段1 的本地规则，
     会在 addItem 里长出 3 条带钟点的子任务。漏了这一条，它就会被当成大白话送去模型，
     而模型根本不知道「早中晚」在该项目里等于 08:00 / 12:00 / 19:00 三条子任务。 */
  if (parseDayParts(s)) n++;
  return n;
}
/* 这一行要不要交给模型？
   交（true）：① 有追加词（要判断挂哪条）  ② 一句语法都没命中（纯大白话，只能靠模型听懂）
   不交（false）：本地就能出结果 —— 写了语法，或者明显列举（本地会切成多条）。 */
function smartNeedAI(text){
  const s = String(text || '').trim();
  if (!s) return false;
  if (smartAppendWord(s)) return true;
  if (smartHintCount(s)) return false;
  const p = parseSmart(s);
  /* 明显列举（`买西瓜、牛奶、鸡蛋`）：本地已经能切成 3 条，不必再问模型。
     带路径（`论文> 买西瓜、牛奶`）的不切 —— 那种形状本地已经处理完了。 */
  if (!(p.path && p.path.length) && smartLocalList(p.title)) return false;
  return true;
}
/* 列举式切分：`买西瓜、牛奶、鸡蛋` → 三条。
   只在"首个词是常见动词 + 顿号分成 2~5 段 + 每段都很短"时才切；
   后续段自己不带那个动词时把动词补上（"买西瓜、牛奶" ≡ "买西瓜、买牛奶"）。 */
function smartLocalList(title){
  const s = String(title || '').trim();
  if (!s) return null;
  const verb = SMART_LIST_VERBS.find(v => s.indexOf(v) === 0);
  if (!verb) return null;
  const segs = s.split(/[、,，]/).map(x => x.trim()).filter(Boolean);
  if (segs.length < 2 || segs.length > 5) return null;
  if (segs.some(x => x.length > 12)) return null;
  if (segs.some(x => /[。？！;；\s]/.test(x))) return null;
  if (segs[0].indexOf(verb) !== 0) return null;
  return segs.map((x, i) => (i === 0 || x.indexOf(verb) === 0) ? x : verb + x);
}
/* 本地级联的产出：与模型输出**同一种形状**（items[] + corrected + confidence + source），
   这样上层（校验 / 落库 / 提示）只有一条路，不必为两种来源各写一套。

   ⚠️ 每条还多带一个 `preset` —— 就是 parseSmart 的**完整返回值**。落库时优先用它
   （`aiCommitPlan` 里 `x.preset || aiPlanPreset(x)`），因为 `aiPlanPreset` 是给**模型**的
   输出准备的：它只认 date / time / tags / pri / parent 这几样，会把本地才有的
   `path`（`论文> 查文献` 的父级）、`repeat`（每N天）、`goal`（目标 前缀）、
   `dayParts`（早中晚三条子任务）、`monthOnly` 统统丢掉。这条口子是 2026-10-08 实测补上的：
   当初本地也走 aiPlanPreset，`论文> 查文献 921` 落库后父级就没了。 */
function smartLocalPlan(text){
  const raw = String(text || '').trim();
  const whole = parseSmart(raw);
  /* 带父级路径的不做列举切分（`论文> 买西瓜、牛奶` 那种形状本地已经拆完了） */
  const listed = (whole.path && whole.path.length) ? null : smartLocalList(whole.title);
  const titles = listed || [whole.title];
  const items = [];
  const single = !listed;                 // 没有切分 = 这一行就是一条，可以整份继承 parseSmart 的结果
  titles.forEach(t => {
    const title = String(t || '').trim();
    if (!title) return;
    /* preset = 落库时真正喂给 addItem 的那份解析结果。
       单条：原样用 parseSmart 的返回值（path / repeat / goal / dayParts / monthOnly 全在）。
       切开的列举：每条改掉标题，并把"整行级"的三个语法摘掉 ——
         dayParts（会按父标题长 3 条子任务，切成多条时不该各长一份）、
         path / goal（父级与目标前缀对列举出来的小条目没有意义）。 */
    const preset = single ? whole : Object.assign({}, whole, {
      title: title, titleRaw: title, dayParts: null, path: [], goal: false
    });
    items.push({
      title: title,
      date: whole.date, dateEnd: whole.dateEnd, time: whole.time,
      tags: (whole.tags || []).slice(), pri: whole.pri || 0,
      parent: '', note: '',
      preset: preset
    });
  });
  return {
    items: items,
    corrected: raw,
    confidence: items.length ? 1 : 0,
    source: 'local',
    reason: ''
  };
}

/* ---------- 结构化解析：输出 schema 与提示词 ---------- */
/* ⚠️ 请求体的**前缀必须逐字符固定**：系统提示词 + schema 说明放最前，变量全部放最后。
   理由：DeepSeek 的缓存命中输入单价是未命中的 1/50 —— 前缀一变，整个缓存失效。
   所以这两条是常量字符串，**不许拼接任何变量**。 */
const AI_UNDERSTAND_SCHEMA = '{"items":[{"title":"","date":"","endDate":"","time":"","tags":[],"pri":0,"parent":"","note":"","zone":"","steps":[]}],"corrected":"","confidence":0.0}';
const AI_UNDERSTAND_SYS =
  '你把用户随口说的一句话整理成待办条目。只输出 JSON，不要解释文字、不要 markdown 围栏。\n'
  + '输出形状固定为：' + AI_UNDERSTAND_SCHEMA + '\n'
  + '字段规则：\n'
  + '· title 条目内容（中文，去掉时间词与语气词，不能为空）\n'
  + '· date / endDate 只能是 YYYY-MM-DD（endDate 是区间的结束日，没有就写空串）\n'
  + '· time 只能是 HH:MM 24 小时制（没有就写空串）\n'
  + '· tags 字符串数组，每项只允许中文/字母/数字/下划线，最多 3 个\n'
  + '· pri 0 普通 / 1 重要 / 2 紧急\n'
  + '· parent 这一条要挂到**同一次回答里另一条**下面时，填那一条的 title；否则空串\n'
  + '· note 补充说明，没有就空串\n'
  + '· zone 只管**没写日期**的那一条，两个值**互不重叠**：'
  + '写 "idea" = **现在还没法动手**的事，还在纠结"要不要做"、方向都没定的念头'
  + '（该不该换工作、要不要学个乐器这类）；'
  + '写 "long" = **已经确定要做、只是还没排日期**的事（开个会、交材料、给谁回个电话）。'
  + '判据：这句话里只要有一个**能直接去做的动作**（开会 / 买 / 写 / 交 / 打 / 发 / 约 / 找 / 问 / 准备 / 整理…），'
  + '它就是待办，**不许**写 "idea"。'
  + '写了日期的一律空串；拿不准**一律当待办**（写空串），别去猜"他是不是只是想想"。'
  + '这两个词只能二选一，别自创。\n'
  + '· steps 子想法：**只有这件事明显能拆成两个及以上步骤时才给**，每项一句话、不超过 30 字。'
  + '一个动作就能做完的事（交房租、喝酸奶、买个生日礼物）一律写空数组 —— '
  + '宁可少给，也不要硬把一句话拆成几步。\n'
  + '· corrected 把原话里明显的同音错字改对之后的完整句子（没把握就原样回填）\n'
  + '· confidence 0~1，你对这次解析的把握\n'
  + '铁律：只做整理。不许新增用户没说的信息，不许下判断，不许替用户决定做不做。'
  + '一句话里有多件事就拆成多条；一件事就是一条。';
/* 变量部分（**放在最后**）。今天日期必须给，否则"明天 / 下周三"这类相对词会算错。
   清单名**限量**（未完成的前 AI_LISTEN_MAX 条），不全量塞。

   ★ 2B 修（2026-10-09 真机）：**背景块必须显式标注、并与原话隔开**。
   用户先记了一条「学做菜」，紧接着录别的句子，标题却被填成「学做菜」——
   原话里一个字都不沾，而提示词里唯一出现「学做菜」的地方就是下面这行"我刚刚记下的一条是"。
   模型把**背景**当成了**要整理的句子**回填。所以：
     · 背景（已有条目 / 上次焦点）用一行说明包起来，并明确"不要把它们写进 title"；
     · 原话单独起一行、用「只整理这一行」点名，放在最末 —— 模型对最后一行最敏感。
   前缀（系统提示词 + schema）仍然逐字符不动，缓存不受影响。 */
function aiUnderstandUser(text){
  const hot = sanitizeHotwords(S.hotwords);
  const list = S.items.filter(i => !isSeed(i) && !i.done).slice(0, AI_LISTEN_MAX)
    .map(i => '- ' + String(i.title || '').slice(0, 40));
  const ctx = [];
  if (list.length) ctx.push('我已经有的未完成条目：\n' + list.join('\n'));
  if (S.aiAnchor) ctx.push('我刚刚记下的一条是：' + S.aiAnchor);
  const lines = ['今天是：' + ymd(new Date())];
  if (hot.length) lines.push('我的常用词（只用来纠正同音错字，不要凭空塞进来）：' + hot.join('、'));
  if (ctx.length){
    lines.push('--- 以下是背景，只用来判断"是不是同一件事、要不要挂到哪"，'
      + '**不要**把它们当成要整理的句子，更不要把其中任何一条写进 title ---');
    lines.push(ctx.join('\n'));
    lines.push('--- 背景结束 ---');
  }
  lines.push('只整理这一行，title 必须来自它：');
  lines.push('我的原话：' + String(text || '').trim());
  return lines.join('\n');
}
/* 用于"回声护栏"的上下文清单 —— 必须与 aiUnderstandUser 塞进提示词的那几行同源 */
function aiContextTitles(){
  const out = [];
  const a = String(S.aiAnchor || '').trim();
  if (a) out.push(a);
  S.items.filter(i => !isSeed(i) && !i.done).slice(0, AI_LISTEN_MAX)
    .forEach(i => { const t = String(i.title || '').slice(0, 40).trim(); if (t) out.push(t); });
  return out;
}
/* ★ 2B 护栏：**模型把上下文当成内容抄回来**时把它拦住。
   判据（两条同时成立才算回声）：
     ① 它给的 title **整条等于**我们塞进上下文的某个字符串；
     ② **原话里根本没出现过这几个字**。
   为什么留 ②：用户真的又提了一次同一件事时必须放行（"交房租"本来就在清单里，原话也说了）。
   纯函数，便于离线单测。 */
function aiDropEcho(items, raw, ctxTitles){
  const list = Array.isArray(items) ? items : [];
  const ctx = (Array.isArray(ctxTitles) ? ctxTitles : [])
    .map(t => String(t == null ? '' : t).trim()).filter(Boolean);
  if (!ctx.length) return list;
  const text = String(raw == null ? '' : raw);
  return list.filter(x => {
    const t = String((x && x.title) || '');
    if (!t) return false;
    if (ctx.indexOf(t) < 0) return true;     // 不在上下文里 → 放行
    return text.indexOf(t) >= 0;             // 在上下文里：原话也提到过才放行
  });
}

/* ==================== ★ 7B：AI 落点（三级层次） ====================
   用户 2026-10-11 定的口径（见 方案-自定义分区.md 第四节）：
     ① 用户写了 S.zoneRules（规范设置）→ 出网：把「规则 + 现有分区名 + 原话」给它，让它选一个；
     ② 没写规则，但本地 S.zoneHints 命中（2-gram 累计 ≥ ZONE_HINT_MIN 且不并列）→ 本地直接定，零请求；
     ③ 都没命中 → 出网：把「现有分区名 + 原话」给它。
   **失败 / 超时 / AI 关着一律留空 → 未分组**（绝不瞎猜）。

   三条纪律（与 2A/3A 那几条同源，改这里之前先读）：
     · 前缀逐字符固定：AI_ZONE_SYS 是常量，**不许拼任何变量**；分区名与规则只能进
       最后那条 user 消息（缓存命中价差 50 倍）。`_7b-regress` 有源码级断言钉着。
     · 失败**不编数据**：拿不到就返回 ''（未分组），绝不返回一个"猜的"分区。
     · 这是**新增的一次请求**，只在"没写日期、模型也没表态"的条目上发生
       （见 commitEntry 里的调用条件），且只有开关开着时才会真的发出去。 */
const AI_ZONE_SYS =
  '用户在往待办清单里加一条**没写日期**的事。清单被分成了若干个「分区」（栏目）。\n'
  + '你的任务：只根据我给的原话（以及可能给的规则说明），判断这条事该进哪个分区。\n'
  + '只输出 JSON，不要解释文字、不要 markdown 围栏：{"zone":"分区标识","confidence":0.0}\n'
  + '规则：\n'
  + '· zone 必须是我给的那份**分区标识列表**里的一个标识，原样照抄，不许改写、不许自创；\n'
  + '· 拿不准就写空串 "" —— **宁可留空，也不要瞎猜**；\n'
  + '· 规则说明是用户自己写的口径，与它冲突时以规则为准；\n'
  + '· 只做分类，不要改写原话、不要补充内容。';

const zoneAskBusy = {};
/* 出网那一次。命中规则 / 兜底都走它，区别只在 `rules` 是否为空。
   返回 ''=没结论（未分组）。**任何异常都吞掉** —— 分区是可选增强，不能因为它失败而丢用户的话。 */
async function aiZoneAsk(text, rules){
  const zs = zonesForPick();
  if (!zs.length) return '';
  const lines = ['可用分区（只能用这些标识）：'];
  for (const z of zs) lines.push('- ' + z.k + '  ' + String(z.name).slice(0, 20));
  const r = String(rules == null ? '' : rules).trim();
  if (r) lines.push('用户写的分区规则：\n' + r.slice(0, 600));
  lines.push('只判断这一行该进哪个分区，不要做别的事：');
  lines.push('原话：' + String(text == null ? '' : text).trim().slice(0, 200));
  let txt;
  try {
    txt = await aiCall([
      { role: 'system', content: AI_ZONE_SYS },
      { role: 'user', content: lines.join('\n') }
    ], { json: true });
  } catch (e){ return ''; }
  let d = null;
  try { d = aiParseJSON(txt); } catch (e){ return ''; }
  const z = (d && typeof d.zone === 'string') ? d.zone.trim() : '';
  return validZoneKey(z) ? z : '';
}
/* 三级决策的**纯函数**部分（同步、可单测）：
   `hasRules` 为真 = 第一层（必须出网，别读 hints）；否则本地命中就零请求直接定。 */
function zoneAdvisorLocal(title, hasRules){
  if (hasRules) return null;                    // ① 规则在手：不读 zoneHints，交给模型
  const g = zoneHintGuess(title);               // ② 行为学习
  if (g.k && g.score >= ZONE_HINT_MIN && !g.tie) return { zone: g.k, by: 'hint' };
  return null;                                  // ③ 都不中 → 出网
}
/* 接线口（commitEntry 调它）。**同步拿不到结论时返回 Promise 不了** —— commitEntry 不等它，
   所以这里只做"本地能定的立刻定"，剩下的交给一个不阻塞的异步任务，回来后重画。 */
function zoneAdvisorAsk(title, cur, rawText, preset){
  /* 结构型条目（早中晚 / 带父级路径）不出网：它的归属由结构决定，不是"分不清"。
     判据读的是 preset（本地解析的完整结果），没有 preset 的模型条目不受影响。 */
  if (preset && ((preset.dayParts && preset.dayParts.length) || (preset.path && preset.path.length))) return null;
  const rules = String(S.zoneRules || '').trim();
  const loc = zoneAdvisorLocal(title, !!rules);
  if (loc) return loc;                          // ② 零请求
  if (!aiOn()) return null;                     // AI 关着 → 留空（未分组）
  /* ③ / ①：出网要 await，这里不能阻塞录入 —— 用一个"打了标就不重复跑"的异步任务。 */
  if (zoneAskBusy[title]) return null;
  zoneAskBusy[title] = 1;
  aiZoneAsk(title, rules ? rules : '').then(z => {
    delete zoneAskBusy[title];
    if (!z) return;
    const it = S.items.find(x => x.title === title);
    if (!it || it.zone === z) return;
    it.zone = z;
    it.zoneBy = rules ? 'rule' : 'ai';
    save();
    if (typeof refresh === 'function') refresh();
  }).catch(() => { delete zoneAskBusy[title]; });
  return null;
}

/* ---------- 校验器（本卡的重点，不许省） ----------
   落库之前逐条校验，**任一不过就丢弃该条**（宁可少收一条，也不收一条脏的）。
   日期 / 时间只接受严格格式；模型给别的格式就丢掉那个字段 —— 不猜着转换。 */
function aiValidDateStr(s){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d = dateFrom(s);
  if (!d || isNaN(d.getTime())) return false;
  const y = d.getFullYear();
  if (y < 2000 || y > 2100) return false;
  return ymd(d) === s;            // 2026-02-31 会被 Date 归一化成 3 月 3 日 → 拒
}
function aiValidTimeStr(s){
  return /^([01]\d|2[0-3]):[0-5]\d$/.test(s);
}
function aiValidTag(s){
  return /^[\u4e00-\u9fa5A-Za-z0-9_]{1,12}$/.test(s);
}
function aiValidateItems(raw, fromText){
  const out = [];
  const src = Array.isArray(raw) ? raw : [];
  /* ★ 2C：这一句的**原话**（图片入口没有原话，传空串即可）——
     下面那条"事已定、只差细节"的护栏要用它。 */
  const cue = String(fromText == null ? '' : fromText);
  /* 只扫前 4×上限 条（防模型话痨把我们拖死），但**上限卡在产出上** ——
     脏条目不占名额：前 8 条全是废的，第 9 条好的也该收下。 */
  const scan = src.slice(0, AI_UNDERSTAND_MAX * 4);
  for (const r of scan){
    if (out.length >= AI_UNDERSTAND_MAX) break;
    if (!r || typeof r !== 'object' || Array.isArray(r)) continue;
    if (typeof r.title !== 'string') continue;                   // title 必须是字符串
    const title = r.title.trim();
    if (!title) continue;                                        // 且非空
    const x = { title: title, date: null, dateEnd: null, time: null,
      tags: [], pri: 0, parent: '', note: '', zone: '', steps: [] };
    if (typeof r.date === 'string' && aiValidDateStr(r.date.trim())) x.date = r.date.trim();
    if (typeof r.endDate === 'string' && aiValidDateStr(r.endDate.trim())) x.dateEnd = r.endDate.trim();
    if (!x.date) x.dateEnd = null;
    if (x.date && x.dateEnd && x.dateEnd < x.date) x.dateEnd = null;   // endDate 不早于 date
    if (typeof r.time === 'string' && aiValidTimeStr(r.time.trim())) x.time = r.time.trim();
    /* ★ 2B：落点由模型判（用户 2026-10-08 定："让用户接入的 AI 模型去区分，应该归入
       「长期待办」还是「想法」"）；**带了日期或钟点的一律不认 idea** —— 有具体安排的事
       就是待办，不是念头（模型偶尔会把带日期的事也判成想法）。
       ★ 4D：原来只挡 `x.date`，漏了 `time` —— 而 taskToSeed / 编辑器里"改成想法"会把
       date/time/repeat 一起清掉，于是"只有钟点、没有日期"的句子一旦被判成想法，
       钟点被清 → 永不提醒（一条静默失效的路）。补上 time，代价为零。
       ★ 7B：schema 里那行枚举**故意保持逐字符不动**（AI_UNDERSTAND_SYS 是缓存前缀，
       红线 8 钉着）。所以除了 'idea' 之外，这里额外认两种"模型可能回的值"：
       ① 某个分区的主键 k（用户分区表里的，见 validZoneKey）；
       ② 老值 long / short —— 模型看 schema 学的就是这两个词，按默认分区翻译它。 */
    if (r.zone === 'idea' || r.zone === 'long' || r.zone === 'short' || validZoneKey(r.zone)){
      x.zone = (r.zone === 'long') ? zoneLongKey() : (r.zone === 'short' ? zoneShortKey() : r.zone);
    }
    if (x.zone === 'idea' && (x.date || x.time)) x.zone = '';
    /* ★ 2C：**事已定、只差细节** → 不许写 idea。
       「什么时候 / 哪天 / 几点 / 在哪 / 跟谁 / 怎么弄 / 该怎么办」表示这件事**要做了**，
       只是细节还没定 —— 那是待办（"想一想什么时候开个会" != 念头）。
       ⚠️ **「要不要 / 该不该 / 值不值得」不在名单里，也绝不能加**：那才是真的"还没定要不要做"，
       正是 idea 该管的。所以这里是白名单式列举，不是"带疑问词就否掉"。 */
    if (x.zone === 'idea' && /什么时候|哪天|几点|在哪|跟谁|怎么弄|该怎么办/.test(cue)) x.zone = '';
    /* ★ 2B：子想法。**少于 2 步一律当没有** —— 用户的原话是"只有那种明显的可以拆成
       多个步骤，两个及以上步骤的，再把它录入子想法"。1 步不叫"能拆开"。 */
    if (Array.isArray(r.steps)){
      const st = r.steps.map(s => String(s == null ? '' : s).trim())
        .filter(s => s && s.length <= 30).slice(0, 6);
      x.steps = st.length >= 2 ? st : [];
    }
    if (Array.isArray(r.tags)){
      x.tags = r.tags.map(t => String(t == null ? '' : t).trim())
        .filter(aiValidTag).slice(0, TAG_PER_ITEM);
    }
    if (r.pri === 0 || r.pri === 1 || r.pri === 2) x.pri = r.pri;
    const p = String(r.parent == null ? '' : r.parent).trim();
    if (p && p !== title) x.parent = p;                          // parent 不能指自己
    if (typeof r.note === 'string') x.note = r.note.trim().slice(0, 200);
    out.push(x);
  }
  /* parent 不能指向自己的后代 —— 组内按 title 建边走一遍，回到自己就断开。
     （标题级的父子引用只在这一次回答里有意义；成环会让渲染期的祖先遍历打转。） */
  const byTitle = new Map(out.map(x => [x.title, x]));
  out.forEach(x => {
    let cur = x.parent, guard = 0;
    while (cur && guard++ < 32){
      if (cur === x.title){ x.parent = ''; break; }
      const nx = byTitle.get(cur);
      cur = nx ? nx.parent : '';
    }
  });
  return out;
}

/* ---------- 唯一入口：一句话 → 结构化条目 ---------- */
async function aiUnderstand(text){
  const raw = String(text || '').trim();
  const local = smartLocalPlan(raw);
  /* ① 红线 3：开关关着（或没 key）→ 一个字都不出这台手机。 */
  if (!aiOn()) return Object.assign(local, { reason: 'off' });
  /* ② 本地级联已经够用 → 零请求（"语法仍然可选"就靠这一条）。 */
  if (!smartNeedAI(raw)) return Object.assign(local, { reason: 'syntax' });
  /* ③ 两条护栏（取代配额）：同一句最多 2 次；两次调用间隔 ≥ 1 秒（不够就等）。 */
  const wait = aiGateWaitMs(raw);
  if (wait < 0) return Object.assign(local, { reason: 'retry' });
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  aiGateNote(raw);
  /* ④ 出网 —— 全文件 AI 的唯一出口。 */
  let txt;
  try {
    txt = await aiCall([
      { role: 'system', content: AI_UNDERSTAND_SYS },
      { role: 'user', content: aiUnderstandUser(raw) }
    ], { json: true });
  } catch (e){ return Object.assign(local, { reason: 'network' }); }
  /* ⑤ 坏 JSON / 校验后为空 → 一样退回本地。**绝不编一条内容出来。** */
  let data = null;
  try { data = aiParseJSON(txt); } catch (e){ return Object.assign(local, { reason: 'json' }); }
  const items = aiDropEcho(aiValidateItems(data && data.items, raw), raw, aiContextTitles());
  if (!items.length) return Object.assign(local, { reason: 'invalid' });
  /* ⑥ 纠错层：只回传"我听到的是"，**不在这里改用户的数据** ——
     与原句不同时留给 2B 展示确认。不许改语义、不许增删信息。 */
  const corrected = (typeof data.corrected === 'string' && data.corrected.trim())
    ? data.corrected.trim().slice(0, 200) : raw;
  return {
    items: items,
    corrected: corrected,
    confidence: Number.isFinite(data.confidence)
      ? Math.max(0, Math.min(1, data.confidence)) : 0,
    source: 'ai',
    reason: ''
  };
}
/* 把一条**模型**输出变成 addItem 认的"预解析结果"（形状与 parseSmart 的返回值对齐）。
   parent 给的是**标题字符串**，落成真实父子关系交给 addItem 里的 findOrCreateGoal
   —— 理解内核只负责"叫什么"，不负责"挂哪个 id"。
   ⚠️ 本地级联的条目**不走这里**：它们自带 preset（parseSmart 的完整返回值），
   走这里会把 path / repeat / goal / dayParts 丢掉。见 smartLocalPlan 的说明。 */
function aiPlanPreset(x){
  const date = x.date || null;
  return {
    title: x.title, titleRaw: x.title,
    date: date, dateEnd: x.dateEnd || null, monthOnly: false,
    time: x.time || null,
    tags: (x.tags || []).slice(0, TAG_PER_ITEM),
    /* ★ 2B：zone 的优先级 —— **模型表了态就听模型的**（用户 2026-10-08 定：让 AI 判
       "该进长期待办还是想法"）；模型没表态（空串 / 不认识的值）才按日期推：
       14 天内算短期，其余算长期，没日期也当长期（再由 commitEntry 按「录入默认落点」处置）。
       ★ 7B：这些落点现在写的是**分区的 k**（校验器已经翻译过 long/short），不再是老值 ——
       写老值会被 sanitizeItemZones 清成未分组。分区表被删空时 k 为 ''，落在「未分组」。 */
    zone: (x.zone === 'idea' || validZoneKey(x.zone))
      ? x.zone
      : (date ? (daysFromToday(date) <= 14 ? zoneShortKey() : zoneLongKey())
         : (zoneLongKey() || zoneShortKey())),
    repeat: null, pri: x.pri || 0, goal: false, dayParts: null,
    path: x.parent ? [x.parent] : [],
    /* 子想法：校验器已经保证"少于 2 步等于没有"，这里只是原样带过去 */
    steps: Array.isArray(x.steps) ? x.steps.slice(0, 6) : []
  };
}
/* 按计划落库。返回真正建出来的条目（可能是 0 条 —— 调用方据此判断"什么都没收到"）。
   本地条目自带 `preset`（parseSmart 的完整返回值，含 path / repeat / goal / dayParts），
   模型条目没有，才用 aiPlanPreset 从 schema 字段拼一份。 */
function aiCommitPlan(plan, raw){
  const made = [];
  const list = (plan && Array.isArray(plan.items)) ? plan.items : [];
  list.forEach(x => {
    const it = addItem(raw, x.preset || aiPlanPreset(x));
    if (it) made.push(it);
  });
  return made;
}
/* 录入之后的**提示语分档** —— 抽成纯函数是为了能单测（它决定用户看到哪句话）。
   三档的差别只在"用户该不该知道这次走了模型"：
     · AI 听懂了            → aiSay（告诉他这次是模型理解的）
     · 本地语法 / AI 关着    → toast（静默，与改动前完全一样；语法仍然可选，不该多一句嘴）
     · 降级（网络/超时/JSON/校验）→ aiFail，**必须说清"用的是本地识别"** */
function aiEntryReply(plan, where){
  let via = 'toast';
  if (plan && plan.source === 'ai') via = 'aiSay';
  else if (plan && plan.reason && plan.reason !== 'syntax' && plan.reason !== 'off' && plan.reason !== '') via = 'aiFail';
  const head = via === 'aiFail' ? 'AI 没接上，用的是本地识别 · '
    : (via === 'aiSay' ? 'AI 听懂了 · ' : '');
  return { via: via, msg: head + String(where == null ? '' : where) };
}

/* ---------- 纠错层的"常用词"采集 ----------
   词表**只作为纠错偏置传进提示词，绝不进本地 ASR 偏置**（本地偏置错了无从纠正）。
   采集靠"用户把某个词改对两次 → 弹一次要不要加进常用词"，不让用户从零录。 */
/* 找出"同一位置被换掉的一小段"。逐字对齐（最长公共前缀 + 最长公共后缀），
   中间那一段 ≤ 6 字才算一次"改对了某个词"。
   两条经验规则（都是为了让问出来的那句话**像个词**）：
     · 前后都**没有**共同上下文（i 与 j 都是 0）→ 那是整句重写，不算改词；
     · 左右各多带最多 1 个汉字 —— 只取"变的那一个字"会问出「腐」是你的常用词吗
       这种没头没脑的话（"豆腐"才是那个词）。 */
function hotwordDiff(before, after){
  const a = String(before || ''), b = String(after || '');
  if (!a || !b || a === b) return null;
  let i = 0;
  while (i < a.length && i < b.length && a.charAt(i) === b.charAt(i)) i++;
  let j = 0;
  while (j < a.length - i && j < b.length - i
    && a.charAt(a.length - 1 - j) === b.charAt(b.length - 1 - j)) j++;
  if (i === 0 && j === 0) return null;
  const CJK = /[\u4e00-\u9fa5]/;
  const ds = (i > 0 && CJK.test(a.charAt(i - 1))) ? 1 : 0;
  const de = (j > 0 && CJK.test(a.charAt(a.length - j))) ? 1 : 0;
  const gone = a.slice(i - ds, a.length - j + de);
  const got = b.slice(i - ds, b.length - j + de);
  if (!gone || !got) return null;
  if (gone.length > 6 || got.length > 6) return null;
  return { from: gone, to: got };
}
function hotwordAdd(w){
  const s = String(w == null ? '' : w).trim();
  if (!s || s.length > 10) return false;              // 热词规格：单词 ≤ 10 汉字
  if (!Array.isArray(S.hotwords)) S.hotwords = [];
  if (S.hotwords.indexOf(s) >= 0) return false;
  if (S.hotwords.length >= HOTWORDS_MAX) S.hotwords.shift();   // 满了丢最旧的
  S.hotwords.push(s);
  save();
  return true;
}
/* 记一次"某个词被改对了"。**权重分两档**（用户 2026-10-08 定）：
     · 用户自己把标题改对 → 1 分（他的原话：AI 纠错的"权重肯定是不如用户自己手动录入编辑的那些"）
     · AI 纠错层改对        → 0.5 分
   凑够 HOTWORD_ASK_AT（2 分）才问一次。于是：手动改 2 次、或 AI 改 4 次、或 1 手动 + 2 次 AI。
   判定用"**跨过**阈值"而不是"等于阈值" —— 带小数之后 `n === 2` 会漏掉 1.5 + 0.5 这一档。 */
function hotwordObserve(before, after, weight){
  const d = hotwordDiff(before, after);
  if (!d) return null;
  const w = (Number(weight) > 0) ? Number(weight) : 1;
  if (!S.hotwordSeen || typeof S.hotwordSeen !== 'object') S.hotwordSeen = {};
  const n0 = Number(S.hotwordSeen[d.to]) || 0;
  const n = n0 + w;
  S.hotwordSeen[d.to] = Math.min(99, Math.round(n * 10) / 10);
  if (n0 >= HOTWORD_ASK_AT || n < HOTWORD_ASK_AT) return d;   // 只在**第一次跨过**门槛时问
  if (S.hotwords.indexOf(d.to) >= 0) return d;
  if (S.hotwords.length >= HOTWORDS_MAX) return d;
  hideToast();
  /* ★ 5F："加进常用词"点下去会同步 aiSay(...) 弹一条新提示 —— 不延后的话会被按钮处理器
     随后的 hideToast() 收掉（与勾选确认条同一个坑，见 later 的定义）。
     typeof 守卫 = 项目既有的转发口写法（本函数会被纯 Node 回归切进隔离环境跑）。 */
  const defer = (typeof later === 'function') ? later : function(f){ return f; };
  toast('「' + d.to + '」是你的常用词吗？', [
    { label: '加进常用词', fn: defer(() => { hotwordAdd(d.to); aiSay('已收进常用词：' + d.to); }) },
    { label: '不用' }
  ], 8000);
  return d;
}

/* ---------- 3.5 挂载建议的接受 / 拒绝 ---------- */
function openSuggestSheet(it){
  const list = Array.isArray(it.suggest) ? it.suggest : [];
  const row = (s, i) => {
    const to = S.items.find(x => x.id === s.to);
    return `<div class="ai-sug">
      <div class="ai-sug-b"><b>${to ? esc(to.title) : '（那条已经不在了）'}</b>
        <span>${esc(s.why || '')}</span></div>
      <button type="button" class="btn primary" data-act="sugapply" data-id="${esc(it.id)}" data-i="${i}">挂到它下面</button>
      <button type="button" class="btn" data-act="sugdrop" data-id="${esc(it.id)}" data-i="${i}">不是</button>
    </div>`;
  };
  modal.innerHTML =
    `<div class="sheet-head"><b>挂到哪条下面？</b></div>
     <p class="ai-note">AI 觉得这几条和你这条有关系。挂上去只是多一层缩进，内容一个字都不改。</p>
     <div>${list.length ? list.map(row).join('') : '<p class="ai-note">没有待处理的建议了。</p>'}</div>
     <div class="sheet-foot"><button type="button" class="btn" data-act="sheetclose">关闭</button></div>`;
  openMask(true);
}
function aiSuggestApply(it, idx){
  const s = (Array.isArray(it.suggest) ? it.suggest : [])[idx];
  if (!s) return;
  const to = S.items.find(x => x.id === s.to);
  if (!to || to.id === it.id || aiIsDescendant(to, it)){ it.suggest.splice(idx, 1); save(); refresh(); return; }
  const oldParent = it.parent || null;
  const wasCollapsed = collapsed.has(to.id);
  it.parent = to.id;
  it.suggest.splice(idx, 1);
  collapsed.delete(to.id);
  save(); refresh();
  toast('已挂到「' + to.title + '」下面', '撤销', () => {
    it.parent = oldParent;
    /* ★ 审查修复（2026-10-04）：撤销不能按旧下标硬插 —— 中间若又接受/拒绝过别的建议，
       下标早就变了，会插错位置甚至重复。按 to 身份判重，落点夹在合法范围内。
       同时把"强制展开目标节点"这件事也还回去，否则折叠态回不去。 */
    if (!it.suggest.some(x => x && x.to === s.to)){
      it.suggest.splice(Math.max(0, Math.min(idx, it.suggest.length)), 0, s);
    }
    if (wasCollapsed) collapsed.add(to.id); else collapsed.delete(to.id);
    save(); refresh();
  });
}
function aiSuggestDrop(it, idx){
  if (!Array.isArray(it.suggest) || !it.suggest[idx]) return;
  it.suggest.splice(idx, 1);
  save(); refresh();
}

/* 自检**不花配额**：这不是质疑也不是扫描，只是一次连通性确认。 */
function aiTestSelf(){

/* §14 I-49：设置页能一键筛出所有 by:'ai' 的 spark 并删掉 */
function aiPrune(){
  const hits = [];
  S.items.forEach(it => {
    if (!Array.isArray(it.sparks)) return;
    it.sparks.forEach((s, i) => { if (s && s.by === 'ai') hits.push([it, s, i]); });
  });
  if (!hits.length){ toast('没有 AI 写的句子'); return; }
  /* 从后往前删，免得下标串位 */
  hits.slice().sort((a, b) => b[2] - a[2]).forEach(([it, , i]) => { it.sparks.splice(i, 1); });
  save(); refresh();
  toast('删掉 ' + hits.length + ' 句 AI 写的', '撤销', () => {
    hits.slice().sort((a, b) => a[2] - b[2]).forEach(([it, s, i]) => { it.sparks.splice(i, 0, s); });
    save(); refresh();
  });
}
/* 打开 App 时的静默扫描：**只在开关打开且距上次 > 24h** 时才联网。
   关闭状态下一行请求都不会发（§14 I-43：关掉时页面零外部请求）。 */
function aiMaybeAutoScan(){
  if (!aiOn()) return;
  if (!(Date.now() - (S.lastScanAt || 0) > 24 * 3600 * 1000)) return;
  setTimeout(() => {
    if (!aiOn()) return;
    if (!(Date.now() - (S.lastScanAt || 0) > 24 * 3600 * 1000)) return;
    aiScanLinks(false);
  }, 4000);   // 让首屏先画完，别和入场动画抢
}

/* ==================== ★ 3A：指向与执行内核（把语音从"录音笔"变成"遥控器"） ====================
   2A / 2B 解决的是"能听懂人话"，但听懂之后只会**新建**条目。这一块补的是另一半：
   **说一句话就能改已有数据** —— 改期、改标题、改分区、挂到某条下面、批量完成 / 删除。

   本卡只做**内核**（纯逻辑，可用桩 fetch 全部离线验）：判断意图 → 挑出说哪一条 →
   出一个可校验的操作计划 → 原子执行 → 能回滚。
   界面上那层（焦点高亮、改前→改后确认页、改挂出口、语音入口接线）是 3B 的事。

   四条红线（改这块之前先读）：
     ① AI 输出的必须是**操作**（结构化 ops），不是一段话 —— 落库前每一条都过校验器；
     ② 一次操作**要么全成要么全不做** —— 逐字段快照 + try/catch 整体还原；
     ③ **破坏性 / 批量操作必须先出计划**（计划对象在这里产出，确认页在 3B）；
     ④ **焦点永不进 S、永不进备份** —— 只存内存 + sessionStorage。

   另外三条继承自 2A：`aiMode === 'off'` 零请求；不新增 fetch 调用点（只用 aiCall）；
   失败绝不生成假数据（退回"什么都没做"并把话说清楚）。 */

/* ---------- 3A.0 常量 ---------- */
const AI_TOP_N = 3;                  // 发给模型的候选条数（全量塞会让输入涨十几倍且更易选错）
const AI_OPS_MAX = 6;                // 一次最多接受几条操作
const AI_OPS_KINDS = ['reschedule', 'retitle', 'rezone', 'remount', 'done', 'delete'];
/* 破坏性 = 会丢信息或改结构；批量 = 一次动好几条。两种都要先出「改前 → 改后」的计划。 */
const AI_OPS_DESTRUCTIVE = ['delete', 'done', 'remount'];
/* 焦点：只活这一次会话。**绝不放 S** —— 清单/统计/想法三个视图共享 S，
   一个纯交互态放进去会被 save() 与 snapshot() 顺带写进存档和备份（红线 ④）。 */
const AI_FOCUS_LS = 'daibanji.aiFocus';
const AI_FOCUS_MS = 5 * 60 * 1000;   // 5 分钟超时

/* "改"字样的强提示词 —— 命中就直接判 update，**零请求**。
   ⚠️ 「完成 / 去掉 / 放到」这几个**故意不收**：`完成作业`、`去掉重复的` 都是普通的新建描述，
   收进来会把它们误判成"改"（然后因为候选为空而什么都不做，等于把用户要记的事吞掉）。
   那几个字交给下面那句"判不出来才出网"的模型路由去分。 */
const AI_UPDATE_CUES = ['改成', '改到', '改为', '换成', '换到', '换为', '推迟', '延期', '提前', '延后',
  '挪到', '移到', '删掉', '删了', '删除', '勾掉', '勾上', '打勾', '标记完成', '标记为完成',
  '改标题', '改个标题', '改名字', '重命名', '挂到', '加到', '归到'];

/* ---------- 3A.1 意图路由：这句是"新建"还是"改已有" ---------- */
/* 返回本地能判的那一档：命中"改"字样 → 'update'；其余返回 ''（= 本地判不出来）。
   拆成纯函数是为了让"本地优先"这条能被源码级断言钉住（见 _3a-regress 的 [1]）。 */
function aiUpdateCue(text){
  const s = String(text || '');
  for (const c of AI_UPDATE_CUES) if (s.indexOf(c) >= 0) return c;
  return null;
}
function aiCancelCue(text){
  /* 明确说"取消勾选"时，已完成的条目**要**留在候选里（否则没有可取消的对象）。 */
  return /取消勾选|取消完成|撤销完成|还没做|改回没做|变成没做|取消打勾/.test(String(text || ''));
}
/* 路由结果只有两个值：'create' | 'update'。
   本地判据的**先后顺序**是有讲究的：
     ① 有"改"字样 → update（零请求）；
     ② 有本地语法（smartHintCount > 0）→ 这是一句"写给新建的描述"→ create（零请求）；
     ③ 一条候选都没有 → 没有可改的东西 → create（零请求）；
     ④ 剩下才是判不出来的大白话 → 出网问一次（走 2A 同一套闸门）。
   ④ 失败 / 关着 / 超时 → 一律回落 'create'。理由：create 是**既有行为**，
   而 update 会真的改用户的数据 —— 判不准时宁可什么都不改。 */
async function aiRouteIntent(text){
  const s = String(text || '').trim();
  if (!s) return 'create';
  if (aiUpdateCue(s)) return 'update';
  if (!aiOn()) return 'create';
  if (!smartNeedAI(s)) return 'create';
  if (!aiRankCandidates(s).length) return 'create';
  const wait = aiGateWaitMs(s);
  if (wait < 0) return 'create';
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  aiGateNote(s);
  let txt;
  try { txt = await aiCall([{ role: 'system', content: AI_ROUTE_SYS }, { role: 'user', content: '我的原话：' + s }], { json: true }); }
  catch (e){ return 'create'; }
  let data = null;
  try { data = aiParseJSON(txt); } catch (e){ return 'create'; }
  return (data && data.route === 'update') ? 'update' : 'create';
}

/* ---------- 3A.2 焦点（{id, at}）：内存 + sessionStorage ---------- */
let aiFocus = null;                   // { id, at }
const aiTouched = new Map();          // id → 最后一次被操作的时间（只活这一次会话）
function aiFocusSave(){
  try {
    if (aiFocus) sessionStorage.setItem(AI_FOCUS_LS, JSON.stringify(aiFocus));
    else sessionStorage.removeItem(AI_FOCUS_LS);
  } catch (e){}
}
function aiFocusLoad(){
  try {
    const raw = sessionStorage.getItem(AI_FOCUS_LS);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && o.id && Number.isFinite(o.at)){
      aiFocus = { id: String(o.id), at: o.at };
      aiTouched.set(aiFocus.id, aiFocus.at);
    }
  } catch (e){}
}
/* 读的时候才判超时 —— 5 分钟没人碰就自动作废，不需要定时器。 */
function aiFocusGet(){
  if (aiFocus && Date.now() - aiFocus.at > AI_FOCUS_MS) aiFocus = null;
  return aiFocus;
}
function aiFocusId(){ const f = aiFocusGet(); return f ? f.id : null; }
function aiFocusSet(id){
  const s = String(id == null ? '' : id);
  if (!s) return;
  aiFocus = { id: s, at: Date.now() };
  aiTouched.set(s, Date.now());
  aiFocusSave();
}
function aiFocusClear(){ aiFocus = null; aiFocusSave(); }
/* 5 分钟内被操作过的条数。两条及以上才需要"反问一次"（决策 3 的后半句）。 */
function aiFocusCount5m(){
  const now = Date.now();
  let n = 0;
  aiTouched.forEach((t, id) => { if (now - t <= AI_FOCUS_MS && it_byId(id)) n++; });
  return n;
}
/* ★ 焦点只做"默认押"，不是"乱猜"。用户的纪律是"自动做错比不做更烦"：
   追加类指令（顺便/还有/再加上…）**默认作用于焦点条、不反问**；
   只有**两条都在 5 分钟内被操作过**时才反问一次（反问由 3B 的确认页承担）。 */
function aiFocusAmbiguous(){
  const f = aiFocusGet();
  if (!f || !it_byId(f.id)) return false;
  return aiFocusCount5m() >= 2;
}
try { aiFocusLoad(); } catch (e){}

/* ---------- 3A.3 本地候选打分：一分钱不花，挑出"说哪一条" ---------- */
/* 字面重合用**字符二元组**而不是分词 —— 中文没有词边界，二元组对短语（"暑假计划"）足够准，
   而且不需要任何词表。 */
function aiBigrams(s){
  const t = String(s == null ? '' : s).replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, '');
  const out = [];
  for (let i = 0; i + 1 < t.length; i++) out.push(t.slice(i, i + 2));
  if (!out.length && t) out.push(t);
  return out;
}
/* 打分权重按**用户亲自定的优先级**排（关键词重合 > 时间近 > 同视图 > 焦点 > 同标签）：
   二元组一次 1000 分，时间最多 900 分 —— 保证"一个字面上重合的旧条目"永远压得住
   "三天前新加但一个字都不沾的条目"。 */
/* ★ 3C：门槛与「同视图」加分分家。
   原来两处都写 300，而判据是 `score < 300` 才丢 → 只要一条在你当前看的这一屏里、
   还没做完，它就自带 300 分、恰好**不**被丢 → 列表里每条未完成条目都是候选
   （见 aiRankCandidates 里那段注释）。现在明确成两个常量，含义不再碰巧相等。 */
const AI_CAND_MIN = 300;      // 候选门槛：**去掉「同视图」之后**仍要达到这么多分
const AI_VIEW_BONUS = 300;    // 「同视图」加分：只做"同分排序辅助"，不参与"够不够格"
function aiScoreCandidate(it, text, now, focusId, appendHit){
  if (!it || !it.id) return null;
  const t = String(text || '');
  let score = 0;
  const why = [];
  const bg = aiBigrams(String(it.title || '') + ' ' + String(it.raw || ''));
  const qg = aiBigrams(t);
  let hit = 0;
  qg.forEach(g => { if (bg.indexOf(g) >= 0) hit++; });
  if (hit){ score += hit * 1000; why.push('字面重合 ' + hit); }
  const title = String(it.title || '');
  const bare = t.replace(/[^\u4e00-\u9fa5A-Za-z0-9]/g, '');
  if (title && (t.indexOf(title) >= 0 || (bare.length >= 2 && title.indexOf(bare) >= 0))){
    score += 2000; why.push('整名命中');
  }
  let timeScore;
  if (typeof it.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(it.date)){
    timeScore = Math.max(0, 900 - Math.abs(daysFromToday(it.date)) * 30);
  } else {
    const age = Math.floor((now - (Number(it.createdAt) || 0)) / 86400000);
    timeScore = Math.max(0, 600 - age * 20);
  }
  score += timeScore;
  let viewBonus = 0;
  if ((S.view === 'idea') === isSeed(it)){ viewBonus = AI_VIEW_BONUS; score += viewBonus; why.push('同视图'); }
  if (focusId && it.id === focusId){
    /* 追加类指令默认押在焦点条上 —— 加一个压倒性权重，等价于"默认押、不反问"。 */
    score += appendHit ? 20000 : 200;
    why.push('焦点');
  }
  const tags = Array.isArray(it.tags) ? it.tags : [];
  if (tags.length && Array.isArray(S.filterTags) && S.filterTags.length
      && tags.some(x => S.filterTags.indexOf(x) >= 0)){ score += 100; why.push('同标签'); }
  return { it: it, id: it.id, title: title, score: score, kw: hit, why: why, view: viewBonus };
}
/* 排序后的候选。**一票否决**：未完成的优先 —— 已完成的一律排除，
   除非这句明确是"取消勾选"（见 aiCancelCue）。 */
function aiRankCandidates(text){
  const t = String(text || '').trim();
  const now = Date.now();
  const focus = aiFocusGet();
  const cancel = aiCancelCue(t);
  const appendHit = !!smartAppendWord(t);
  const out = [];
  S.items.forEach(it => {
    if (!it || !it.id) return;
    if (it.done && !cancel) return;
    const s = aiScoreCandidate(it, t, now, focus ? focus.id : null, appendHit);
    if (!s) return;
    /* 完全沾不上关系的条目不进候选 —— ★ 3C：判据里**把「同视图」那 300 分剔掉**。
       它只是"和你现在看的这一屏一致"这种环境信号，最多给已经够格的条目做同分排序；
       一算进去，门槛就恰好等于它 → 列表里每条未完成条目都进候选，`aiLocalOps` 那个
       "只有一条候选才本地直判"的置信门控就永远不成立（遥控器因此基本用不了）。
       剔掉之后仍要够 AI_CAND_MIN，也就是下面**至少占一条**：
         · 有字面重合（二元组 1000/次）或整名命中（+2000）—— 你说的那句里出现了它的字；
         · 时间分 ≥ 300 —— 有日期的离今天 ≤20 天，没日期的按"最近 15 天内建的"算；
         · 焦点（+200，带追加词时 +20000）或同标签（+100）把它顶上去。
       "一个字都不沾、又不是刚记的、也没个近期的日子"才丢 —— 这才对应原注释的本意。 */
    if (!s.kw && s.score - s.view < AI_CAND_MIN) return;
    out.push(s);
  });
  out.sort((a, b) => (b.score - a.score) || String(a.title).localeCompare(String(b.title)));
  return out;
}

/* ---------- 3A.4 本地能直接定的操作（有它才能"零请求"） ---------- */
/* 命令句里的钟点读取器。**不是 parseSmart 的复制品**：
   解析层那个 tpat 只吃阿拉伯数字（`下午3点` 认、`下午三点` 不认），因为它面向"记一条事"；
   而遥控器面对的是"改到明天下午三点"这种**口述命令**，汉字钟点才是常态。
   规则：时段词（下午/晚上…）+ 数字（阿拉伯或汉字）+ 点/时 [+ 半/N分]。
   解不出来就返回空串，由调用方决定"是交给模型、还是当没说过" —— 这里**绝不猜**。 */
const AI_CN_DIGIT = { '零': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5,
  '六': 6, '七': 7, '八': 8, '九': 9, '十': 10 };
function aiCnNum(s){
  const t = String(s == null ? '' : s).trim();
  if (/^\d+$/.test(t)) return parseInt(t, 10);
  if (!t || !/^[零一二两三四五六七八九十]+$/.test(t)) return null;
  if (t === '十') return 10;
  if (t.length === 1) return AI_CN_DIGIT[t];
  const x = t.indexOf('十');
  if (x === 0) return 10 + (AI_CN_DIGIT[t.charAt(1)] || 0);
  if (x === 1) return (AI_CN_DIGIT[t.charAt(0)] || 0) * 10 + (AI_CN_DIGIT[t.charAt(2)] || 0);
  return null;
}
function aiCommandClock(text){
  const s = String(text || '');
  const m = s.match(/(凌晨|早上|早晨|上午|中午|下午|傍晚|晚上|夜里|晚)?\s*([0-9]{1,2}|[零一二两三四五六七八九十]{1,3})\s*[点時时]\s*(半|[0-9]{1,2}\s*分)?/);
  if (!m) return '';
  let h = aiCnNum(m[2]);
  if (h == null || h > 24) return '';
  const seg = m[1] || '';
  const min = m[3] === '半' ? 30 : (m[3] ? (aiCnNum(String(m[3]).replace(/[^\d零一二两三四五六七八九十]/g, '')) || 0) : 0);
  if (seg === '下午' || seg === '傍晚' || seg === '晚上' || seg === '夜里' || seg === '晚'){
    if (h < 12) h += 12;
  } else if (seg === '中午'){ if (h < 12) h = 12; }
  /* 没说时段的不猜 —— 直接交回空串，由调用方决定"是交给模型、还是当没说过"。 */
  else if (!seg) return '';
  if (h > 23 || min > 59) return '';
  return String(h).padStart(2, '0') + ':' + String(min).padStart(2, '0');
}
/* 只有**一条候选**时才本地直判 —— 多条候选里挑哪一条是模型更擅长的事。
   本地判不出来就返回 null，交给模型（那才是"判不出来才出网"的真含义）。 */
function aiLocalOps(text, top){
  const s = String(text || '').trim();
  if (!s || !Array.isArray(top) || top.length !== 1) return null;
  const it = top[0].it;
  if (!it) return null;
  const cue = aiUpdateCue(s);
  if (!cue) return null;
  const p = parseSmart(s);
  const say = (ops, confidence) => ({ ops: ops, confidence: confidence, source: 'local' });
  if (/删掉|删了|删除/.test(s)) return say([{ kind: 'delete', ids: [it.id] }], 1);
  if (/勾掉|勾上|打勾|标记完成|标记为完成/.test(s)) return say([{ kind: 'done', ids: [it.id], undo: false }], 1);
  if (/挂到|加到|归到/.test(s)){
    const m = s.match(/(?:挂到|加到|归到)\s*(.+?)\s*(?:下面|下边|里头|里面|里|中|下面了)/);
    const name = m ? String(m[1]).trim() : '';
    if (name){
      const hits = S.items.filter(x => !isSeed(x) && x.id !== it.id
        && (x.title === name || x.title.startsWith(name)) && !aiIsDescendant(x, it));
      if (hits.length === 1) return say([{ kind: 'remount', id: it.id, parent: hits[0].id }], 0.9);
    }
    return null;
  }
  if (/改标题|改个标题|改名字|重命名/.test(s)){
    const m = s.match(/(?:改标题|改个标题|改名字|重命名)\s*(?:为|成|叫)?\s*(.+)$/);
    const t2 = m ? String(m[1]).trim() : '';
    if (t2) return say([{ kind: 'retitle', id: it.id, title: t2 }], 0.9);
    return null;
  }
  /* 改期：日期 / 钟点至少给一个。两个都没给（"推迟一天"这种相对位移）本地不算 —— 交给模型。
     句子里出现了「点 / 时」却解不出钟点 → 也交给模型：宁可多问一次，也不把"下午三点"吃掉。 */
  const date = (p && p.date) || '';
  const time = (p && p.time) || aiCommandClock(s) || teParseTime(s) || '';
  if (!time && /[点時时]/.test(s)) return null;
  if (!date && !time) return null;
  return say([{ kind: 'reschedule', id: it.id, date: date, time: time }], 1);
}

/* ---------- 3A.5 请求体：前缀逐字符固定（照 2A 的 AI_UNDERSTAND_SYS 写法） ---------- */
/* ⚠️ 这两个常量**不许拼接任何变量** —— 变量全在最后那条 user 消息里。
   DeepSeek 缓存命中输入单价是未命中的 1/50，前缀一变整个缓存失效。 */
const AI_ROUTE_SCHEMA = '{"route":"create"}';
const AI_ROUTE_SYS =
  '你判断用户这句话是想**新建**一条待办，还是想**修改已有的**那条。只输出 JSON，不要解释、不要 markdown 围栏。\n'
  + '输出形状固定为：' + AI_ROUTE_SCHEMA + '\n'
  + '· route 只能是 "create" 或 "update" 两个值之一。\n'
  + '· "create"：在说一件要新记下来的事（明天买西瓜、交实验报告、想想换工作）。\n'
  + '· "update"：在改一件已经记下的事（把它改到后天、删掉那条、勾掉这个、挂到另一个下面）。\n'
  + '· 拿不准一律 "create" —— 改错别人的数据比多记一条烦得多。';

const AI_OPS_SCHEMA = '{"ops":[{"kind":"reschedule","id":"","date":"","time":"","title":"","zone":"","parent":"","ids":[],"undo":false}],"confidence":0.0}';
const AI_OPS_SYS =
  '你把用户随口说的一句话翻译成**对已有条目的一组操作**。只输出 JSON，不要解释文字、不要 markdown 围栏。\n'
  + '输出形状固定为：' + AI_OPS_SCHEMA + '\n'
  + 'kind 只能是下面 6 种之一，每种只填自己那几个字段，其余留空串或空数组：\n'
  + '· reschedule 改期：id + date（YYYY-MM-DD）/ time（HH:MM），至少给一个\n'
  + '· retitle    改标题：id + title（新的标题，不超过 60 字）\n'
  + '· rezone     改分区：id + zone（long 长期 / short 短期 / idea 想法）\n'
  + '· remount    换父级：id（要挪的那条）+ parent（挪到哪条的 id）\n'
  + '· done       完成或取消完成：ids（数组）+ undo（false 表示勾上，true 表示取消勾选）\n'
  + '· delete     删除：ids（数组）\n'
  + '铁律：\n'
  + '1) id / parent 只能从下面候选里**原样照抄**，绝对不许自己编一个 id。\n'
  + '2) 挑不出该操作哪一条时，**这条操作就不要给**，不要猜。\n'
  + '3) 只做用户明确说出口的改动。没说的一律不动。\n'
  + '4) confidence 0~1，你对这组操作的把握。';
/* 候选只发 top3（**不全量塞**）。今天日期必须给，否则"后天 / 下周三"会算错。
   变量全在最后。 */
function aiOpsUser(text, top){
  const lines = ['今天是：' + ymd(new Date())];
  lines.push('--- 只能从下面这几条里挑，id 必须原样照抄，不许自己编 ---');
  if (!top.length) lines.push('（没有候选）');
  top.forEach(c => {
    const it = c.it || {};
    const bits = ['id=' + it.id, '标题：' + String(it.title || '')];
    if (it.date) bits.push('日期：' + it.date);
    if (it.time) bits.push('钟点：' + it.time);
    bits.push('分区：' + aiZoneLabel(it.zone));
    if (it.done) bits.push('已完成');
    lines.push('- ' + bits.join(' '));
  });
  lines.push('--- 候选结束 ---');
  lines.push('我的原话：' + String(text || '').trim());
  return lines.join('\n');
}
/* ★ 7B：分区标签改成"查用户的分区表" ——
   以前是写死的 short→短期 / long→长期 / 其它→未定。分区可配置之后那样会显示「未定」，
   用户看到的是"我自己建的分区名没了"。现在：想法 → 「想法」，分区表里有的 → 它的名字，
   空 / 认不出 → 「未分组」。 */
function aiZoneLabel(z){ return zoneNameOf(z); }

/* ---------- 3A.6 校验器（本卡的重点） ---------- */
/* 逐条校验，**任一不过就作废那一条操作**（不是整个计划）——
   模型给三条里有一条是编的 id，另外两条该照做。
   `allowedIds` = 这次发给模型的候选 id 集合：**防模型编 id** 就靠它。 */
function aiValidateOps(raw, allowedIds){
  const allow = new Set(Array.isArray(allowedIds) ? allowedIds.map(String) : []);
  const src = Array.isArray(raw) ? raw : [];
  const out = [];
  const live = id => !!id && S.items.some(i => i.id === id);
  for (const r of src){
    if (out.length >= AI_OPS_MAX) break;
    if (!r || typeof r !== 'object' || Array.isArray(r)) continue;
    const kind = String(r.kind == null ? '' : r.kind).trim();
    if (AI_OPS_KINDS.indexOf(kind) < 0) continue;               // kind 白名单
    if (kind === 'done' || kind === 'delete'){
      const ids = [];
      (Array.isArray(r.ids) ? r.ids : []).forEach(x => {
        const id = String(x == null ? '' : x).trim();
        if (id && allow.has(id) && live(id) && ids.indexOf(id) < 0) ids.push(id);
      });
      const undo = r.undo === true;
      /* done：排掉"已经完成"的（重复勾选无意义）；undo 方向反过来，排掉没完成的。 */
      const use = kind === 'done'
        ? ids.filter(id => { const it = it_byId(id); return it && (undo ? it.done === true : !it.done); })
        : ids;
      if (!use.length) continue;
      out.push({ kind: kind, ids: use, undo: kind === 'done' ? undo : false });
      continue;
    }
    const id = String(r.id == null ? '' : r.id).trim();
    if (!id || !allow.has(id) || !live(id)) continue;
    const it = it_byId(id);
    if (kind === 'reschedule'){
      let date = typeof r.date === 'string' ? r.date.trim() : '';
      let time = typeof r.time === 'string' ? r.time.trim() : '';
      if (date && !aiValidDateStr(date)) date = '';             // `明天昨天` 这种直接丢字段
      if (time && !aiValidTimeStr(time)) time = '';
      if (!date && !time) continue;                             // 一个都没剩 → 这条作废
      out.push({ kind: kind, id: id, date: date, time: time });
    } else if (kind === 'retitle'){
      const t2 = String(r.title == null ? '' : r.title).trim();
      if (!t2 || t2.length > 60) continue;
      out.push({ kind: kind, id: id, title: t2 });
    } else if (kind === 'rezone'){
      const z = String(r.zone == null ? '' : r.zone).trim();
      /* ★ 7B：分区白名单从写死的三选一改成"当前分区表里的 k"（外加 ''＝未分组、'idea'＝想法）。 */
      if (z !== '' && z !== 'idea' && !validZoneKey(z)) continue;
      out.push({ kind: kind, id: id, zone: z });
    } else if (kind === 'remount'){
      const pid = String(r.parent == null ? '' : r.parent).trim();
      if (!pid || pid === id) continue;                         // 不能挂到自己
      const to = it_byId(pid);
      if (!to) continue;                                        // 目标必须在库
      if (aiIsDescendant(to, it)) continue;                     // 不能挂到自己的后代（防环）
      out.push({ kind: kind, id: id, parent: pid });
    }
  }
  return out;
}

/* ---------- 3A.7 出网：把候选 + 原话交给模型，换回一组操作 ---------- */
async function aiUnderstandOps(text, top){
  const s = String(text || '').trim();
  if (!aiOn()) return { ops: [], confidence: 0, reason: 'off' };         // 红线：关着零请求
  const wait = aiGateWaitMs(s);                                          // 与 2A 共用同一个闸
  if (wait < 0) return { ops: [], confidence: 0, reason: 'retry' };
  if (wait > 0) await new Promise(r => setTimeout(r, wait));
  aiGateNote(s);
  let txt;
  try { txt = await aiCall([{ role: 'system', content: AI_OPS_SYS }, { role: 'user', content: aiOpsUser(s, top) }], { json: true }); }
  catch (e){ return { ops: [], confidence: 0, reason: 'network' }; }
  let data = null;
  try { data = aiParseJSON(txt); } catch (e){ return { ops: [], confidence: 0, reason: 'json' }; }
  const ops = aiValidateOps(data && data.ops, top.map(c => c.id));
  if (!ops.length) return { ops: [], confidence: 0, reason: 'invalid' };
  const c = Number(data && data.confidence);
  return { ops: ops, confidence: Number.isFinite(c) ? Math.max(0, Math.min(1, c)) : 0, reason: '' };
}

/* ---------- 3A.8 计划对象（「改前 → 改后」） ---------- */
/* 只读，不改数据。3B 的确认页直接渲染它。 */
function aiOpsPlan(ops){
  const rows = [];
  (Array.isArray(ops) ? ops : []).forEach(op => {
    if (op.kind === 'delete' || op.kind === 'done'){
      (op.ids || []).forEach(id => {
        const x = it_byId(id);
        if (!x) return;
        const from = op.kind === 'delete' ? '在库里' : (x.done ? '已完成' : '未完成');
        const to = op.kind === 'delete' ? '删除' : (op.undo ? '未完成' : '已完成');
        rows.push({ kind: op.kind, id: id, title: x.title, undo: !!op.undo,
          changes: [{ field: op.kind === 'delete' ? '整条' : '完成', from: from, to: to }] });
      });
      return;
    }
    const it = it_byId(op.id);
    if (!it) return;
    const ch = [];
    if (op.kind === 'reschedule'){
      if (op.date) ch.push({ field: '日期', from: it.date || '（没写）', to: op.date });
      if (op.time) ch.push({ field: '钟点', from: it.time || '（没写）', to: op.time });
    } else if (op.kind === 'retitle'){
      ch.push({ field: '标题', from: it.title || '', to: op.title });
    } else if (op.kind === 'rezone'){
      ch.push({ field: '分区', from: aiZoneLabel(it.zone), to: aiZoneLabel(op.zone) });
    } else if (op.kind === 'remount'){
      const fromP = it.parent ? it_byId(it.parent) : null;
      const toP = it_byId(op.parent);
      ch.push({ field: '挂在', from: fromP ? fromP.title : '（顶层）', to: toP ? toP.title : '（顶层）' });
    }
    if (ch.length) rows.push({ kind: op.kind, id: it.id, title: it.title, changes: ch });
  });
  return rows;
}
/* 红线 ③：破坏性 / 批量必须先出计划、确认后才落库（确认页在 3B，本卡把计划产出好）。 */
function aiOpsNeedConfirm(ops){
  const list = Array.isArray(ops) ? ops : [];
  if (!list.length) return { need: false, why: '' };
  if (list.length >= 2) return { need: true, why: '批量' };
  if (AI_OPS_DESTRUCTIVE.indexOf(list[0].kind) >= 0) return { need: true, why: '破坏性' };
  return { need: false, why: '' };
}

/* ---------- 3A.9 原子执行 + 回滚 ---------- */
/* 逐**字段**快照（不是整条浅拷）：整条浅拷只记住对象引用，字段改了照样一起变。 */
function aiSnapField(map, it, key){
  let rec = map.get(it.id);
  if (!rec){ rec = { it: it, f: {}, removed: false, index: -1 }; map.set(it.id, rec); }
  if (!Object.prototype.hasOwnProperty.call(rec.f, key)){
    rec.f[key] = { had: Object.prototype.hasOwnProperty.call(it, key), v: it[key] };
  }
  return rec;
}
function aiRestoreSnap(map){
  map.forEach(rec => {
    if (rec.removed){                       // 被删掉的整条：按原下标插回去
      if (S.items.indexOf(rec.it) < 0){
        const at = Math.max(0, Math.min(rec.index, S.items.length));
        S.items.splice(at, 0, rec.it);
      }
    }
    Object.keys(rec.f).forEach(k => {
      const o = rec.f[k];
      if (o.had) rec.it[k] = o.v; else delete rec.it[k];
    });
  });
}
/* 分区切换的字段清理 —— 与 openItemEditor 保存分支、taskToSeed 保持**同一份口径**，
   否则同一个动作两条路造出两种形状（一条还挂着待办父、一条没有）。 */
function aiApplyZone(it, zone){
  it.zone = zone;
  if (zone === 'idea'){
    it.kind = 'seed';
    if (!Array.isArray(it.sparks)) it.sparks = [];
    if (!Array.isArray(it.suggest)) it.suggest = [];
    if (it.reviewedAt === undefined) it.reviewedAt = null;
    if (it.aiUse === undefined) it.aiUse = null;
    it.parent = null;
    delete it.foldedByParent;
  } else {
    delete it.kind;
    delete it.sparks; delete it.bornFrom; delete it.promoted;
    delete it.foldedByParent;
  }
}
/* 执行一组操作。返回 { ok, changed, snapshot }；snapshot 供 3B 的撤销用。
   红线 ②：全部操作在一个 try 里跑，任一步抛异常 → **用快照整体还原**。 */
function aiExecOps(ops, opts){
  const list = Array.isArray(ops) ? ops : [];
  const map = new Map();
  const changed = [];
  const o = opts || {};
  try {
    list.forEach(op => {
      if (op.kind === 'delete'){
        (op.ids || []).forEach(id => {
          const it = it_byId(id);
          if (!it) return;
          const rec = aiSnapField(map, it, 'title');
          rec.removed = true;
          rec.index = S.items.indexOf(it);
          S.items.splice(rec.index, 1);
          changed.push(id);
        });
        return;
      }
      if (op.kind === 'done'){
        (op.ids || []).forEach(id => {
          const it = it_byId(id);
          if (!it) return;
          aiSnapField(map, it, 'done');
          aiSnapField(map, it, 'doneAt');
          it.done = !op.undo;
          it.doneAt = it.done ? Date.now() : null;
          if (it.done && it.hw && it.hw.status !== 'submitted'){
            aiSnapField(map, it, 'hw');
            it.hw = Object.assign({}, it.hw, { status: 'submitted', submittedAt: ymd(new Date()) });
          }
          changed.push(id);
        });
        return;
      }
      const it = it_byId(op.id);
      if (!it) throw new Error('op target gone');
      if (op.kind === 'reschedule'){
        if (op.date){
          aiSnapField(map, it, 'date');
          aiSnapField(map, it, 'dateEnd');
          aiSnapField(map, it, 'monthOnly');
          it.date = op.date;
          if (it.dateEnd && it.dateEnd < op.date) it.dateEnd = null;
          it.monthOnly = false;
        }
        if (op.time){ aiSnapField(map, it, 'time'); it.time = op.time; }
      } else if (op.kind === 'retitle'){
        aiSnapField(map, it, 'title');
        it.title = op.title;
      } else if (op.kind === 'rezone'){
        ['zone','kind','sparks','suggest','parent','foldedByParent','bornFrom','promoted','reviewedAt','aiUse']
          .forEach(k => aiSnapField(map, it, k));
        aiApplyZone(it, op.zone);
      } else if (op.kind === 'remount'){
        aiSnapField(map, it, 'parent');
        it.parent = op.parent;
      } else {
        throw new Error('unknown kind');
      }
      changed.push(it.id);
    });
  } catch (e){
    aiRestoreSnap(map);
    return { ok: false, changed: [], snapshot: [] };
  }
  /* 落库 + 通知提醒层。凡碰了 date / time / done 的条目都要走这条路
     （syncNotify 自己判"该排还是该撤"，唯一真相源没有被复制）。 */
  const uniq = [...new Set(changed)];
  uniq.forEach(id => { const it = it_byId(id); if (it) aiFocusSet(it.id); });
  if (typeof save === 'function') save();
  uniq.forEach(id => {
    const it = it_byId(id);
    if (it) notifyFire(it);
    else notifyFire({ id: id });            // 已经删掉的：syncNotify 会判"不在库里"→ 只撤不排
  });
  if (o.refresh !== false && typeof refreshAfterChange === 'function') refreshAfterChange(0);
  const snapshot = [];
  map.forEach(rec => {
    const f = {};
    Object.keys(rec.f).forEach(k => { f[k] = { had: rec.f[k].had, v: rec.f[k].v }; });
    /* ★ 3B：多带一个**原对象引用** —— `removed`（整条被删）的条目已经从 S.items 里
       摘掉了，只留 id 是找不回来的，"撤销删除"会变成空操作。aiRestoreSnap 本来就用
       rec.it，这里只是让快照也拿得到同一样东西。 */
    snapshot.push({ id: rec.it.id, fields: f, removed: rec.removed, index: rec.index, obj: rec.it });
  });
  return { ok: true, changed: uniq, snapshot: snapshot };
}

/* ---------- 3A.10 总入口（内核） ---------- */
/* 返回一份**完整可测**的结果对象：
     { route, ops, plan, needConfirm, confirmWhy, confidence, source,
       executed, ok, changed, snapshot, reason }
   - needConfirm 为真时**一行数据都没动**（计划交给 3B 的确认页）；
   - reason 非空 = 降级（route 仍是 'update'，ok 为 false）—— 调用方据此说"这条没改"。 */
function aiOpsFail(reason, extra){
  return Object.assign({ route: 'update', ops: [], plan: [], needConfirm: false, confirmWhy: '',
    confidence: 0, source: '', executed: false, ok: false, changed: [], snapshot: [], reason: reason || '' },
    extra || {});
}
async function aiRunCommand(text, opts){
  const s = String(text == null ? '' : text).trim();
  if (!s) return aiOpsFail('empty');
  const route = await aiRouteIntent(s);
  if (route !== 'update') return { route: 'create', ops: [], plan: [], needConfirm: false, confirmWhy: '',
    confidence: 0, source: '', executed: false, ok: false, changed: [], snapshot: [], reason: 'create' };
  const cands = aiRankCandidates(s);
  if (!cands.length) return aiOpsFail('cand');            // 候选为空 → 什么都不做
  const top = cands.slice(0, AI_TOP_N);
  let res = aiLocalOps(s, top);
  if (!res || !res.ops.length){ res = await aiUnderstandOps(s, top); }
  if (!res.ops || !res.ops.length) return aiOpsFail(res.reason || 'invalid');
  const plan = aiOpsPlan(res.ops);
  if (!plan.length) return aiOpsFail('invalid');          // 计划渲染不出任何一条 → 等于没操作
  const gate = aiOpsNeedConfirm(res.ops);
  const base = { route: 'update', ops: res.ops, plan: plan,
    needConfirm: gate.need, confirmWhy: gate.why,
    confidence: Number(res.confidence) || 0, source: res.source || 'ai',
    executed: false, ok: true, changed: [], snapshot: [], reason: '' };
  /* ★ 决策 3 的后半句：追加类指令默认押焦点、不反问；只有"两条都在 5 分钟内被操作过"时反问一次。 */
  if (!gate.need && aiFocusAmbiguous() && top.some(c => c.id === aiFocusId())
      && ['reschedule', 'retitle', 'rezone'].indexOf(res.ops[0].kind) >= 0){
    return Object.assign(base, { needConfirm: true, confirmWhy: '两条都在 5 分钟内动过' });
  }
  if (gate.need) return base;                              // 红线 ③：先出计划，不落库
  const run = aiExecOps(res.ops, opts);
  return Object.assign(base, { executed: true, ok: run.ok, changed: run.changed, snapshot: run.snapshot });
}
/* 播报分档 —— 与 2A 的 aiEntryReply 同一个形状，抽成纯函数才好单测。
   降级（网络 / 超时 / JSON 坏 / 校验后无有效操作 / 候选为空）**必须说清"这条没改"**。 */
function aiOpsReply(result){
  const r = result || {};
  if (r.route === 'create') return { via: 'create', msg: '' };
  if (!r.ok){
    const why = {
      empty: '没听清',
      cand: '没找到你说的是哪一条',
      off: 'AI 关着',
      retry: '这一句试过了',
      network: 'AI 没接上',
      json: 'AI 没答好',
      invalid: 'AI 没答好'
    }[r.reason] || 'AI 没接上';
    return { via: 'aiFail', msg: 'AI 没接上，这条没改 · ' + why };
  }
  if (r.needConfirm){
    return { via: 'aiSay', msg: '要动 ' + r.plan.length + ' 处，先给你看改前 → 改后'
      + (r.confirmWhy ? '（' + r.confirmWhy + '）' : '') };
  }
  const n = (r.changed || []).length;
  return { via: 'aiSay', msg: n ? ('改好了 ' + n + ' 条') : '什么都没改' };
}
/* 3B 直接调这个（内核 + 播报）。本卡只保证它可被调用，不做语音入口接线。 */
async function aiCommand(text, opts){
  const r = await aiRunCommand(text, opts);
  const rep = aiOpsReply(r);
  if (rep.via === 'aiFail') aiFail(rep.msg);
  else if (rep.via === 'aiSay') aiSay(rep.msg);
  return r;
}

/* ---------- 设置页 ---------- */

/* 「外观与体感 → 页面说明文字」的总开关。
   实现成一个 body 属性 + 两条 CSS（见 body[data-help="off"] .intro-note / .set-card .set-sub），
   不在清单/时间轴/统计三个视图里各写一份判断 —— 所以切换时不需要重渲染，
   当前页和之后切过去的每一页都会自动跟上。
   启动时（load 之后）就要调一次：refresh 是 rAF 延迟的，等它来会先闪一下那段字。

   ★ v5.2（用户："打开页面说明文字时，这个字体的弹出太过于生硬了，让它像隐藏或折叠的部分
   被展开时那样出现，而不是现在直接跳转到这种有说明文字的界面"）：
   开关带 animate 参数。关→开是"从 0 撑到真实高度"，开→关是"收回 0" —— 都走 revealAnim。
   **必须在切 body 属性之前量高度**：展开态才量得到自然高度与外边距（切完就都是 0 了）。 */
function applyHelp(animate){
  const on = !!S.showHelp;
  const was = document.body.dataset.help === 'on';
  const anim = !!animate && was !== on;
  /* 收起方向必须在切属性**之前**量：切完高度就是 0，量不到要收回去的那个高度。 */
  const pre = (anim && !on) ? helpEls().map(el => ({
    el,
    h: Math.max(0, Math.round(el.getBoundingClientRect().height)),
    mt: getComputedStyle(el).marginTop,
  })) : null;
  document.body.dataset.help = on ? 'on' : 'off';
  if (!anim) return;
  if (on){
    /* 展开方向反过来：切完属性才量得到自然高度与外边距，再从这里从 0 撑开。 */
    helpEls().forEach(el => revealAnim(el, true,
      Math.round(el.getBoundingClientRect().height), getComputedStyle(el).marginTop));
  } else {
    pre.forEach(m => revealAnim(m.el, false, m.h, m.mt));
  }
}
/* 受「页面说明文字」开关管的元素（设置页自己的灰字 + 各页标题下的解释）。
   ★ 5G：v5.2 的 data-keephelp 例外已删（唯一使用者是「关于」栏那段版本介绍，
   按用户要求整段删掉了）—— 机制没有使用者，跟着清掉，只剩一条直白的查询。 */
const HELP_SEL = '.intro-note,.set-card .set-sub,.set-row .set-txt > span';
function helpEls(){
  return [...view.querySelectorAll(HELP_SEL)];
}

/* 高度"撑开 / 收回"的通用动画（说明文字、设置栏目折叠共用）。
   参数：open=目标状态；h/mt = **展开态**的自然高度与外边距（收起方向要在切状态前自己量好）。
   为什么用 rAF 逐帧补间、不用 CSS 过渡：`.toolbar` 那段注释里记着实测结论 ——
   `max-height` 的 CSS 过渡在真实 click 回调里**不建过渡**（写死大数又会"前 30% 就走完"），
   当年筛选抽屉就是这么改成 rAF 的。这里沿用同一条缓出曲线，全站节奏一致。
   连点两次时用 el.__rt 记的令牌作废上一次的收尾，避免两段动画抢同一份 inline 样式。 */
const REVEAL_MS = 300;
function revealAnim(el, open, h, mt){
  if (!el) return;
  const clear = () => ['max-height','opacity','margin-top','visibility','overflow']
    .forEach(p => el.style.removeProperty(p));
  if (!el.isConnected || reduceMotion() || !h){ clear(); return; }
  const token = (el.__rt = (el.__rt || 0) + 1);
  const H0 = open ? 0 : h, H1 = open ? h : 0;
  const m0 = open ? 0 : (parseFloat(mt) || 0), m1 = open ? (parseFloat(mt) || 0) : 0;
  el.style.overflow = 'hidden';
  el.style.visibility = 'visible';       // 收起态是 visibility:hidden（为了不被 Tab 聚焦），动画期间要显出来
  el.style.maxHeight = H0 + 'px';
  el.style.opacity = open ? '0' : '1';
  el.style.marginTop = m0 + 'px';
  const t0 = performance.now();
  const ease = u => 1 - Math.pow(1 - u, 2.6);      // 与筛选抽屉同族的强缓出
  const step = now => {
    if (el.__rt !== token) return;                 // 被下一次点击接管了，这一趟作废
    const u = Math.min(1, (now - t0) / REVEAL_MS), k = ease(u);
    el.style.maxHeight = (H0 + (H1 - H0) * k).toFixed(2) + 'px';
    el.style.opacity = ((open ? 0 : 1) + ((open ? 1 : 0) - (open ? 0 : 1)) * k).toFixed(3);
    el.style.marginTop = (m0 + (m1 - m0) * k).toFixed(2) + 'px';
    if (u < 1) requestAnimationFrame(step);
    else clear();                                  // 收尾清 inline：展开回自然高、收起交回 CSS
  };
  requestAnimationFrame(step);
}

/* 设置页：**按语义分区**（用户原话："你怎么能把它们归到'外观'这个栏目里边呢"）。
   ★ v5.2 重新分组（用户一次性给了四条）：外观（含从「性能」搬来的流畅模式）/
   功能（语音＋想法合成一栏）/ AI / 数据（含示例数据）/ 关于 —— 从 8 张卡收到 5 张。
   每个区各一张 .glass.set-card —— .set-wrap 本来就是 flex 纵列 + gap，天然支持多卡片。
   开关一律用 role="switch" + aria-checked 表达状态（键盘可达、读屏能读出开/关），
   位置状态由 aria-checked 驱动，不在 CSS 里另存一套类名。 */
/* 设置页：**按频率分区**（6B 信息架构重做）。

   用户 2026-10-10 的诊断（见《方案-设置页信息架构》第二节）：
   ①「功能」是个"其他"抽屉 —— 叫"功能/其他"的分类一定会变成垃圾桶；
   ②按**模块**分（外观/功能/AI/数据），但人找东西是按**"我要干什么"**找，分组维度不统一；
   ③`API key / 接口地址 / 模型名` 一年配一次，`语音输入 / 提醒` 一天拨好几次，却挤在同一可视层
     （没做渐进披露）；
   ④`试连接 / 现在找一次 / 备份` 这类"点一下执行一次"的动作，和开关那种"长期生效"的设置长得一样。

/* ★ 6B：主列表上那行 AI 状态的文案。

   注意它只说"配没配 key"，不代表真的连通 —— 连通性由二级页的「试连接」回答（别把两件事混成一个）。 */

}

/* ★ 6B：AI 那三格输入（key / 接口地址 / 模型名）与「对 AI 的规范设置」的落库逻辑。
   原来只写在 #view 的 change 代理里；这三格搬进二级面板之后，面板**不在 #view 里**，
   所以抽成一处共用 —— 两条路（#view 的老代理 / 面板自己的监听）落库行为一字不变。
   返回 true = 这个 id 归它管（调用方就别再往下走了）。 */
function aiFieldCommit(el){
  if (!el || !el.id) return false;
  const id = el.id;
  if (id === 'aiKeyInput'){
    const had = !!aiKey();
    aiSetKey(el.value);
    el.value = '';                               // 不回显明文；掩码由重渲染后的 label 显示
    toast(aiKey() ? 'key 存好了（只在设置页显示后四位）' : (had ? 'key 已清空' : '还没填 key'));
    if (typeof refresh === 'function') refresh();
    return true;
  }
  if (id === 'aiBaseInput'){
    const v = String(el.value || '').trim();
    S.aiBase = v || 'https://api.deepseek.com';
    save(); refresh(); toast('接口地址已更新');
    return true;
  }
  if (id === 'aiModelInput'){
    const v = String(el.value || '').trim();
    S.aiModel = v || 'deepseek-flash';
    save(); refresh(); toast('模型名已更新');
    return true;
  }
  /* ★ 7B：「对 AI 的规范设置」——存的是自然语言，原样留着（只限长），空串合法（= 不写规则）。 */
  if (id === 'zoneRulesInput'){
    S.zoneRules = String(el.value || '').slice(0, 1000);
    save();
    toast(S.zoneRules.trim() ? '规则存好了 · 以后 AI 按它分区' : '规则清空了 · 改用学到的词 + 模型自己判');
    return true;
  }
  return false;
}

/* ★ 6B：AI 的二级页面「AI 连接」—— key / 接口地址 / 模型名 / 试连接 / 现在找一次。
   形态**照 openParentPicker**：在现有 `.modal` 里 appendChild 一个绝对定位铺满的面板，
   共用同一套 openMask / closeModal，**不新造浮层**（0E 那条红线的正解）。
   为什么要一个占位壳：面板是 `inset:0` 的 absolute，模态里没有别的流内容时父盒高度塌成 0、
   面板就看不见（3B 的「改挂到…」踩过同一个坑）。壳只负责撑高，`aria-hidden` 不进无障碍树。 */
function openAiPanel(){
  if (document.getElementById('ai_panel')) return;
  const holder = document.createElement('div');
  holder.className = 'ai-holder';
  holder.setAttribute('aria-hidden', 'true');
  modal.appendChild(holder);
  const panel = document.createElement('div');
  panel.id = 'ai_panel';
  panel.tabIndex = -1;
  panel.style.cssText = 'position:absolute;inset:0;z-index:2;background:var(--bg);overflow:auto;' +
    'overscroll-behavior:contain;padding:clamp(22px,3vw,34px);display:flex;flex-direction:column;';
  panel.innerHTML =
    `<h3 id="aiPanelTitle">AI 连接</h3>
     <p class="ai-note">鱼事把你说的一句话整理成条目、给想法找关系，都靠这一把 key。填一次就行。</p>
     <p class="ai-quote">打开之后，鱼事会把<b>当前这一条想法的文字</b>发到模型服务商那里去。
       关着的时候，鱼事和以前一样，一个字都不出你的手机。</p>
     <div class="ai-row">
       <label for="aiKeyInput" id="aiKeyLabel">API key（只存在这台手机上，不进备份文件）${aiKey() ? '  · 现在是 ' + esc(aiKeyMask()) : ''}</label>
       <div class="ai-keyline">
         <input class="ai-input" id="aiKeyInput" type="text" autocomplete="off" spellcheck="false"
                autocapitalize="off" autocorrect="off" data-mask="1"
                placeholder="粘贴 DeepSeek 的 key（sk-…）" value="">
         <button type="button" class="btn" data-act="aipaste" title="从剪贴板粘贴">粘贴</button>
         <button type="button" class="btn" data-act="aishowkey" aria-pressed="false" title="显示 / 隐藏">显示</button>
       </div>
     </div>
     <div class="ai-row">
       <label for="aiBaseInput">接口地址（任意 OpenAI 兼容端点）</label>
       <input class="ai-input" id="aiBaseInput" type="text" autocomplete="off" spellcheck="false"
              value="${esc(S.aiBase)}">
     </div>
     <div class="ai-row">
       <label for="aiModelInput">模型名</label>
       <input class="ai-input" id="aiModelInput" type="text" autocomplete="off" spellcheck="false"
              value="${esc(S.aiModel)}">
     </div>
     <div class="set-acts" style="margin-top:16px">
       <button type="button" class="set-act" data-act="aitest">试连接</button>
       <button type="button" class="set-act" data-act="aiscan">现在找一次</button>
     </div>
     <div class="foot" style="margin-top:auto;padding-top:20px">
       <div class="spacer"></div>
       <button class="btn" id="aiPanelClose">关掉</button>
     </div>`;
  modal.appendChild(panel);
  /* 面板不在 #view 里，#view 的点击 / change 代理都到不了它 —— 这里自己接线。
     ⚠️ 调用的仍是原来那几个函数（aiPasteKey / aiToggleKeyShow / aiTestSelf / aiScanLinks），
     一项处理逻辑都没有重写。按钮上的 data-act 只为探针可读，delegation 不会二次触发
     （#view 那条只认自己子树里的元素）。 */
  panel.querySelector('[data-act="aipaste"]').onclick = () => { aiPasteKey(); aiPanelSync(); setTimeout(aiPanelSync, 400); };
  panel.querySelector('[data-act="aishowkey"]').onclick = () => aiToggleKeyShow();
  panel.querySelector('[data-act="aitest"]').onclick = () => aiTestSelf();
  panel.querySelector('[data-act="aiscan"]').onclick = () => aiScanLinks(true);
  panel.querySelector('#aiPanelClose').onclick = closeModal;
  panel.addEventListener('change', e => { if (aiFieldCommit(e.target)) aiPanelSync(); });
  /* Escape 拦在**捕获阶段**、只关这一层（同 openParentPicker）。本页没有下一层，
     所以"关这一层"就等于关弹层 —— 语义与全局那条 Escape 一致，只是不绕一圈。 */
  panel.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    e.stopPropagation();
    closeModal();
  }, true);
  panel.focus({ preventScroll: true });
  openMask();
}
/* 面板里那行 key 掩码的显隐 —— 存了 / 清了 key 之后就地问更新，不整块重画（重画会丢输入焦点）。 */
function aiPanelSync(){
  const lbl = document.getElementById('aiKeyLabel');
  if (lbl) lbl.textContent = 'API key（只存在这台手机上，不进备份文件）'
    + (aiKey() ? '  · 现在是 ' + aiKeyMask() : '');
