  -webkit-backdrop-filter:none;backdrop-filter:none;
  border:1px solid color-mix(in srgb,var(--glass-edge) 26%,transparent)}
/* ★ v3.32（用户实测：语音录入的提示压住了弹窗的「取消」键）：弹窗打开时提示挪到屏幕顶部 ——
   顶部那一带是变暗的背景、没有可点的东西，不会再挡任何按钮。没弹窗时仍在底部，行为不变。 */
#toast.at-top{bottom:auto;top:calc(var(--sat,12px) + 10px);transform:translateX(-50%) translateY(-20px)}
#toast.at-top.on{transform:translateX(-50%) translateY(0)}
#toast button{border:0;background:transparent;color:var(--accent);font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}

/* ---------- ★ 3B 焦点条（「正在改：XXX」）与卡片高亮 ----------
   用户原话的理由："状态不可见，用户就会当成 bug 报"。所以遥控器的焦点必须有**两处**可见：
   卡片左侧一道细高亮（跟着这一条走）+ 屏幕顶部一行「正在改：XXX」（永远看得见）。
   三条硬门槛都在这里兑现：
    ① 实底：焦点条 background:var(--bg)、高亮用 --accent 实色，**都不用 backdrop-filter**
       （禁用 blur 的环境里半透明会整条透出下层文字）；
    ② 不新增层叠上下文：焦点条是 body 的**直接子元素**（不在 .page-shell / #view 里），
       所以不会被 .pdaim-section{z-index:2} 那种内部层序困住（本项目踩过：容器内再高的
       z-index 也压不过容器外的兄弟）；
    ③ z-index 64 < .mask(90) < #toast(130) —— 焦点条永不盖住弹层与提示。
   高度基准 --focus-h 同时给"让位"用：它是 fixed 的，不腾出空间就会盖住录入条与首屏第一行
   （--focus-h 的声明在文件头的 :root 里，与主题无关，不重复声明）。 */
.focus-strip{
  position:fixed;left:0;right:0;top:0;z-index:64;
  display:none;align-items:center;gap:8px;
  padding:calc(max(env(safe-area-inset-top),var(--sat,12px)) + 6px) 14px 6px;
  background:var(--bg);border-bottom:1px solid var(--line);
  font-size:12px;font-weight:700;color:var(--fg);
}
/* 用 [hidden] 而不是类名收放 —— 但 display:flex 会盖掉浏览器默认的 [hidden]{display:none}
   （本项目的老坑，见 .notify-perm）。这条 :not([hidden]) 写法天然绕开它：不显示就没有 display。 */
.focus-strip:not([hidden]){display:flex}
.focus-strip .fs-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--accent)}
.focus-strip .fs-txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.focus-strip .fs-txt b{font-weight:900}
.focus-strip .fs-x{margin-left:auto;flex:0 0 auto;border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:13px;font-weight:900;cursor:pointer;padding:2px 7px;border-radius:8px}
.focus-strip .fs-x:active{background:var(--tap)}
/* 让位：录入条吸顶的基准从 0 挪到焦点条下沿，页面顶部内边距多留一条条的高度。 */
body.has-focus .capture-wrap{top:var(--focus-h)}
body.has-focus .page-shell{padding-top:calc(var(--focus-h) + 10px)}
/* 提示在窄屏也是贴顶的（v3.32），跟焦点条抢同一块 —— 有焦点时把提示挪到焦点条**下面**，
   两行都看得见（实测：不挪的话 400px 宽下提示整条盖住焦点条）。
   用 body 类提权重，压过 @media 里那条 #toast{top:…}（权重高，不靠书写顺序）。 */
body.has-focus #toast{top:calc(var(--focus-h) + 10px)}
/* ★ 5G（用户："我编辑了一个待办，在待办那个点的前面就会出现一个竖状的蓝色条。我不想要这个条"）：
   卡片左侧那道 `.focus-bar` 细高亮**整条删掉**（CSS 三条规则 + aiFocusBarHTML + 两处调用点）。
   卡片上仍挂 `ai-focus` 类（只是身份标记，没有对应样式，不产生任何可见元素）；
   屏幕顶部那行「正在改：XXX」保留 —— 那行写出了标题、能定位，是用户要的"状态可见"（见 #focusStrip）。 */

/* ★ 3B 确认页（「改前 → 改后」）。它住在 .mask / .modal 里，所以**不需要**自己的底色 ——
   `.mask .modal` 已经是实底 var(--bg)（见那条规则里的注释），浮层硬门槛天然满足。 */
.cf-sub{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.7;font-weight:600}
.cf-sub b{color:var(--fg)}
.cf-list{display:flex;flex-direction:column;gap:12px}
.cf-row{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--pill)}
.cf-t{font-weight:800;font-size:14.5px;margin-bottom:8px;word-break:break-word}
.cf-ch{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-size:13px;line-height:1.6}
.cf-ch + .cf-ch{margin-top:4px}
.cf-f{flex:0 0 auto;color:var(--faint);font-size:11px;font-weight:800;letter-spacing:.12em;
  min-width:2.6em}
.cf-from{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2);
  word-break:break-word}
.cf-ar{flex:0 0 auto;color:var(--faint)}
.cf-to{color:var(--fg);font-weight:800;word-break:break-word}
/* ★ 4B：图片确认页每个条目下面那行"日期 · 钟点 · 标签…"（只读，不是改前→改后）。
   用 .cf-ch 同一套盒模型，所以视觉上与 3B 的确认页是同一族，不引入第二种长相。 */
.cf-bits{color:var(--muted);font-size:12.5px;font-weight:600;word-break:break-word}
.cf-row .cf-t:last-child{margin-bottom:0}
/* ★ 4D：图片确认页的每条做成**可点按钮**（点开编辑）。基类 .cf-row 与 3B 的确认页共用，
   所以"可点"这套盒模型只加在 .cf-row-go 上 —— 3B 那版行内布局一个字不动。 */
.cf-row-go{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;
  color:inherit;cursor:pointer}
.cf-row-go .cf-main{flex:1 1 auto;min-width:0}
.cf-row-go .cf-t{display:block}
.cf-row-go .cf-go{flex:0 0 auto;color:var(--faint);font-size:15px;line-height:1}
.cf-row-go:active{opacity:.72}
/* 「改挂到…」单独用时的占位壳：撑出与编辑页同量级的高度，面板才有地方铺（见 aiOpenRemount）。 */
.cf-holder{height:min(420px,58vh)}
@media (max-width:560px){
  .cf-holder{height:min(360px,52vh)}
}

/* ---------- 页脚：★ 5G 整块删除 ----------
   原来这里定义 .pdaim-footer（padding:40px 24px calc(118px + env(safe-area-inset-bottom))）
   与 .fw-mouse / .fw-touch 两套文案的显示切换。用户 2026-10-10 明确要删：
   "咱们现在是 AI 版本，『零联网』这个其实也没必要这样"。
   元素、规则、两个类一起删（页脚只在设置页显示过，删掉不影响其它屏的底部留白 ——
   那由 .page-shell 的 padding-bottom:var(--bar-keep) 单独承担）。 */

/* ---------- 流畅模式：软件渲染（如内嵌预览 iframe 关了 GPU）时自动降级 ----------
   软件渲染把整页每个像素都用 CPU 画，且不支持分层滚动，
   色球模糊 / 玻璃模糊 / 点阵 / 入场模糊 这类"每帧都重画"的东西会让滚动掉到个位数帧。
   此模式把它们全关掉，但保留布局、配色、玻璃的形状感（半透明底 + 内描边 + 阴影）。 */
/* 顶栏那颗手动切"流畅模式"的 ⚡ 已撤（手机上挤掉标题），这条样式随之删掉。
   「流畅模式」现在只有两处来源：软件渲染自动识别，以及设置页里那个开关。 */
html.soft-render body::after,html.soft-render .hero::before{display:none}
html.soft-render .glass{
  -webkit-backdrop-filter:none;backdrop-filter:none;
  background:color-mix(in srgb,var(--bg) 93%,transparent);
}
html.soft-render .glass::before{display:none}
html.soft-render .glass,html.soft-render .site-header,html.soft-render .capture,html.soft-render .feature-card,html.soft-render .hwcard{
  box-shadow:0 1px 3px color-mix(in srgb,var(--fg) 10%,transparent),0 10px 28px color-mix(in srgb,var(--fg) 6%,transparent);
}
html.soft-render .site-header,html.soft-render .capture{background:color-mix(in srgb,var(--bg) 95%,transparent)}
/* 揭示改成 animation 之后，这里要关的是 animation（原来关的是 transition）。
   ★ 0G：同 reduce 那条 —— 这里把元素强制成可见，指针也要一起交回去。 */
html.soft-render .reveal-on-scroll{opacity:1;transform:none;filter:none;transition:none;animation:none;pointer-events:auto}
@media (hover:hover){ html.soft-render .feature-card:hover{transform:none} }

/* ---------- 统计页：布局切换（右上角）+ 完成量细分 ---------- */
.stat-toolbar{
  display:flex;align-items:center;justify-content:flex-end;gap:9px;
  width:min(100%,1180px);margin:clamp(20px,2.8vw,34px) auto 0;
}
.stat-toolbar .len{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--faint)}

/* ---------- ★ 0E：统计页的「内部子页」----------
   用户拍定：不新增浮层、不新增 S.view —— 子页就在统计页内部**就地替换**
   （同一个 S.view === 'stat'）。本项目在浮层层序上踩过多次坑，能就地替换就不新造浮层。
   所以这里没有任何 position:fixed / z-index，只是一段普通的页面内容。 */
.stat-sub{width:min(100%,1180px);margin:0 auto}
.stat-sub-top{display:flex;align-items:center;gap:12px;padding:4px 2px 16px}
.stat-sub-title{margin:0;font-size:clamp(19px,2.3vw,26px);font-weight:900;color:var(--fg)}
.stat-sub-n{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--faint)}
/* 明细卡：复用 .zone 的玻璃卡（同一套圆角/内边距），只是里面装的是统计页的条目 */
.stat-list{width:100%}
/* ---------- ★ 0G：完成量细分（从统计首页的卡片搬进子页）----------
   用户原话："关于'短期、长期循环'任务……那个显示完成了多少任务的条就不要放在这儿了，
   把它放到详情里面。不然这样看的话，它跟其他 3 个统计展示不太一样，显得比较难看。"
   ⇒ 今日完成 / 历史完成 两张卡上的副行**撤掉**（五张卡终于同一形态），改画在子页标题下面。
   三个等分列（用户选定"标题下、左中右三等分一行"）：数字 --fg、标签 --muted（两者在
   --bg 上的对比度实测见 _ref/_0g-dom.mjs）。刻意不做成一张玻璃卡：它是标题的一部分，
   不是又一屏内容。 */
.stat-origin{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:2px 2px 16px}
.stat-origin .so{display:flex;flex-direction:column;align-items:center;gap:1px}
/* 纯数字元素才挂 tabular-nums（含 CJK 的选择器挂它会让浏览器换字形，见 0G 之前的教训） */
.stat-origin .so b{font-size:20px;font-weight:900;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.2}
.stat-origin .so i{font-style:normal;font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
.stat-origin .so.loop b{color:var(--accent)}
.stat-origin.empty{display:block;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);padding:8px 0 16px}

/* ---------- ★ 0G：长列表跳转钮（只统计子页有）----------
   规格由用户 2026-10-08 定：①内容超过 **4 屏**才有这枚按钮；②要**滑过 2 屏**才浮现；
   ③方向感知——往下滑给「↓ 到最下」，往上滑给「↑ 回到最上」；④停在原地 **1 秒**自己隐去
   （"不然对页面内容造成一定的遮挡"）。
   它是**浮层**，所以按项目硬规则来：实底 var(--bg)（不靠 backdrop-filter 提供可读性）、
   z-index 归到 #view 这一层（70 < 底栏 80，永远不盖底栏）、只在滚动中现身。
   动画：出现 220ms 项目现成曲线；隐去 160ms ease-in；两枚箭头**交叉淡入**（旧 90ms 淡出、
   新 140ms 淡入并位移 6px 归位），按钮本体不重播出现动画（否则切换方向时会闪）。 */
.stat-jump{
  /* bottom 的算法：--bar-keep(90) 是内容避让线（= 底栏中间那颗圆钮的顶边，见 0D.3），
     但底栏那圈玻璃胶囊的上沿比它还要高约 12px（实测 capsuleTop=786 / 视口 888 → 距底 102）。
     于是 90 + 12 + 14（呼吸）= 116：实测按钮底边 772、胶囊上沿 786 → 让开 14px。
     （不能只写 --bar-keep：那样按钮底边 784 只比胶囊高 2px，贴着边看着要撞上。） */
  position:fixed;right:14px;bottom:calc(var(--bar-keep,90px) + 26px);z-index:70;
  width:44px;height:44px;padding:0;border:1px solid color-mix(in srgb,var(--glass-edge) 18%,transparent);
  border-radius:14px;background:var(--bg);color:var(--fg);cursor:pointer;
  display:grid;place-items:center;
  box-shadow:0 10px 26px color-mix(in srgb,var(--glass-edge) 22%,transparent),
             0 2px 6px color-mix(in srgb,var(--glass-edge) 12%,transparent);
  opacity:0;transform:translateY(10px) scale(.94);pointer-events:none;
  transition:opacity 160ms cubic-bezier(.4,0,1,1),transform 160ms cubic-bezier(.4,0,1,1);
}
.stat-jump.on{
  opacity:1;transform:none;pointer-events:auto;
  transition:opacity 220ms cubic-bezier(.16,1,.3,1),transform 220ms cubic-bezier(.16,1,.3,1);
}
.stat-jump:active{transform:scale(.96)}
.stat-jump .ji{
  position:absolute;width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
}
.stat-jump[data-dir="up"] .ji-up{opacity:1;transform:none;
  transition:opacity 140ms linear,transform 140ms cubic-bezier(.16,1,.3,1)}
.stat-jump[data-dir="up"] .ji-down{opacity:0;transform:translateY(-6px);transition:opacity 90ms linear}
.stat-jump[data-dir="down"] .ji-down{opacity:1;transform:none;
  transition:opacity 140ms linear,transform 140ms cubic-bezier(.16,1,.3,1)}
.stat-jump[data-dir="down"] .ji-up{opacity:0;transform:translateY(6px);transition:opacity 90ms linear}
.stat-jump[data-dir="up"] .ji-down,
.stat-jump[data-dir="down"] .ji-up{position:absolute}
/* 统计页是**回看**的地方：勾选框和标题仍可点（取消勾选 / 跳详情），删除按钮不画
   （itemHTML 的第 5 个参数负责不生成它，"误删代价高"是用户拍的） */
.stat-day{display:flex;align-items:baseline;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.stat-day:last-child{border-bottom:0}
.stat-day .dd{font-size:13.5px;font-weight:800;color:var(--fg)}
.stat-day .dn{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted)}
.seg{
  display:inline-flex;gap:3px;padding:4px;border-radius:999px;
  background:var(--pill);border:1px solid color-mix(in srgb,var(--glass-edge) 55%,transparent);
}
.segbtn{
  appearance:none;-webkit-appearance:none;border:0;background:transparent;cursor:pointer;
  font:inherit;font-size:12.5px;font-weight:800;color:var(--muted);
  padding:6px 14px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;
  transition:background 220ms ease,color 220ms ease,box-shadow 220ms ease;
}
.segbtn:hover{color:var(--fg)}
.segbtn.on{background:var(--bg);color:var(--fg);box-shadow:0 2px 10px color-mix(in srgb,var(--glass-edge) 45%,transparent)}
.segbtn .gl{font-size:12px;line-height:1;opacity:.8}
/* ---------- 分段控件的滑块（用户点名要的「慢—快—慢 + 拉伸」） ----------
   原来每个按钮各画自己那块底色（.segbtn.on{background:var(--bg)}），切换就是
   "这块灭、那块亮"，是硬切。现在 .seg 里多一个滑块 .seg-pill，由 JS 对齐到当前选中项；
   切换时它从旧位置滑到新位置，中途 scaleX 过冲到 1.24 —— 就是用户要的
   "在『快』的阶段把这个白色的东西变瘦、拉成一条再弄过去"。
   曲线 cubic-bezier(.66,0,.18,1) 是标准的"慢—快—慢"（两端导数小、中段陡）。
   渐进增强：JS 没跑起来时 .seg 不带 .has-pill，选中项仍按老样子显示底色。 */
.seg{position:relative}
.segbtn{position:relative;z-index:1}
.seg-pill{
  position:absolute;left:0;top:0;width:0;height:0;border-radius:999px;
  background:var(--bg);z-index:0;opacity:0;pointer-events:none;
  box-shadow:0 2px 10px color-mix(in srgb,var(--glass-edge) 45%,transparent);
}
.seg.has-pill .seg-pill{opacity:1}
.seg.has-pill .segbtn.on{background:transparent;box-shadow:none}
/* --sx0/--sxm/--sx1/--sy/--r0/--r1 由 syncSegPills() 按实测矩形写进来。
   整条动画只用 translate + scaleX（一律 transform-origin 打在一端），所以
   ① 全程走合成器，不触发重排；② 宽度差异靠 scaleX 表达，一趟动画就能走完。
   三帧的几何含义（见 syncSegPills 里的推导）：
     0%   还没动，占位在「上一个选中项」的位置和宽度
     44%  "液桥"：拉长到**刚好盖住旧位与新位的并集**，看着就是一条被抻细的白条
     100% 收拢成目标项的形状
   特意让中点盖住并集而不是盲目放大：这样滑块永远不越出 .seg 的胶囊边界（不会露头）。 */
.seg-pill.anim{animation:segSlide var(--seg-dur,460ms) cubic-bezier(.66,0,.18,1) both}
@keyframes segSlide{
  0%   {transform:translate(var(--sx0),var(--sy)) scaleX(var(--r0));opacity:.9}
  44%  {transform:translate(var(--sxm),var(--sy)) scaleX(var(--r1));opacity:1}
  100% {transform:translate(var(--sx1),var(--sy)) scaleX(1)}
}
/* ---------- FLIP：同一批元素换位置/形状，而不是"消失再出现" ----------
   用户原话：「固定的元素只是交换一下位置、形状、大小或者排版，但这个固定元素本身并没有改变，
   并不会直接消失在页面上」。这就是 FLIP：切换前量一次、换完 DOM 再量一次、把差值倒推回去再放开。
   过程只走 transform，**不动 opacity** —— 元素全程可见，正是要的效果。 */
.flip-move{will-change:transform}
/* ★ v3.37（用户："我从时间轴切换到分类清单页面时，『长期』还有『短期』这个大标题还是
   直接跳出来了，没有淡入淡出的动画呀"）：切视图走的是 FLIP —— 而 FLIP 只搬"两边都在"
   的元素（靠 data-fk 配对），分区那几张卡片（.zone）是**只在分区这一侧存在**的结构，
   于是它整块硬出现，正好是用户看到的那一下。
   这里给它补一段**纯淡入**：只动 opacity、不加位移，免得和外层 FLIP 抢位置。
   由 swapContent(…,{flip:true,fade:true}) 的 mutate 之后挂 .content-in 触发，
   播完自动摘掉（不摘的话下次重渲染会重播）。 */
/* ★ v3.38（用户："我切换视图的时候，这些字还会被拉伸，虽然幅度很小，但是还是有" + 后面那条
   "时间轴里有一条，切到分区它直接闪没了"）：两件事一起收。
   ① 只淡入那些"只在一边存在"的**容器标题**（分区的 .zone>header、时间轴的 .tl-meta）。
      原来这里把整张 .zone 卡片（含里面所有条目）一起淡入 —— 后果是 FLIP 正在搬运的条目
      全程被压在 opacity 0~1 的父级里，"移动过去"根本看不见，用户看到的就是"闪没了"。
      条目本身的进出改由 flipPlay 前后的 playEntering / playLeaving 逐条负责。
   ② 条目的进出：进来的淡入（playEntering），出去的在原位留一张影子淡出（playLeaving）。 */
#view.content-in > .zone > header,
#view.content-in > .board > .zone > header,
#view.content-in > .tl-section > .tl-meta{animation:contentIn .42s cubic-bezier(.16,1,.3,1) both}
@keyframes contentIn{from{opacity:0}to{opacity:1}}
/* FLIP 切换时"只在一侧存在"的那条待办：出去的那一条在原位克隆一份淡出。
   影子层是 fixed + pointer-events:none，层级压在底栏（z-index 80）之下。
   ⚠️ 类名**必须**带 flip- 前缀：第一版叫 `.ghost-layer` / `.ghost`，
   而"粘贴导入"那颗按钮的类名是 `.btn.ghost` —— 于是 `.ghost{position:absolute}`
   把按钮变成绝对定位、压到搜索框上面去了（用户截图："粘贴导入跟搜索关键词粘一块了"）。
   这和之前 `.hint` 撞名是同一类坑：新增全局类名前先 grep 一遍同名规则。 */
.flip-ghost-layer{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.flip-ghost{position:absolute;transition:opacity .32s ease}
.flip-ghost-layer.out .flip-ghost{opacity:0}
/* 统计页的布局切换：纯图标按钮（用户要求去掉「横条 / 方块」两个词）。
   两端内边距收一点，让"纯图标"和"带字的"落在同一个 .seg 里高度、圆角完全一致。 */
.segbtn.ico-seg{padding:6px 12px}
.seg-ico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.stat-toolbar + .feature-grid{margin-top:clamp(16px,2.2vw,24px)}

/* ---------- 设置页 ---------- */
.set-wrap{
  width:min(100%,940px);margin:clamp(22px,3vw,36px) auto 0;
  display:flex;flex-direction:column;gap:clamp(14px,1.8vw,20px);
}
/* 圆角必须显式给：.glass 本身没有 border-radius（它的圆角历来由各使用者自己定），
   所以设置页卡片一直是**直角**，跟全站圆角风格不一致 —— 用户原话
   "它这个边缘怎么不是圆角的？怎么跟之前的那种整体风格不一样啊"。
   16px 与同页的 .entry-box / .zone>header 同一档。 */
.set-card{border-radius:16px;padding:4px clamp(20px,2.4vw,30px) 18px}
/* ★ v5.0：设置页改成**默认全收起的栏目列表**（用户："设置栏目有点太长了，把它变成可折叠的"）。
   标题变成一行按钮（.set-head），内容包进 .set-body；展开态存进存档（S.setOpen，默认空数组
   = 全收起），下次进来还是上次展开的那几栏。
   ★ v5.2（用户："让它像隐藏或折叠的部分被展开时那样出现"）：展开/收起也从 display 切换
   改成**高度撑开**，和"页面说明文字"共用 revealAnim() 同一套节奏 —— 全页动画语言统一。
   收起态：max-height:0 + overflow:hidden + 淡出 + visibility:hidden（收起的内容不该还能 Tab 聚焦），
   真实高度由 revealAnim() 量出来写 inline 再过渡。 */
.set-head{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;
  margin:0;padding:14px 0 12px;background:none;border:0;font:inherit;color:inherit;
  text-align:left;cursor:pointer}
.set-head h3{margin:0;font-size:13px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--fg)}
.set-head .sh-chev{margin-left:auto;font-size:13px;color:var(--faint);
  transition:transform var(--mo-fast) ease}
.set-card.open .set-head .sh-chev{transform:rotate(90deg)}
.set-head:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.set-body{max-height:0;overflow:hidden;opacity:0;visibility:hidden}
.set-card.open .set-body{max-height:none;opacity:1;visibility:visible}
/* 收起时卡片只剩一行标题，底部那 18px 内边距也要跟着收 —— 否则一屏 5 张卡就是 5 段空白。
   这一段也给它过渡：不然高度动画跑完了还会"咔"地跳 16px。 */
.set-card{transition:padding-bottom var(--mo-base) var(--mo-size)}
.set-card:not(.open){padding-bottom:2px}
/* 灰字（每栏标题下那行 + 每项下面那行）。⚠️ 选择器用**后代**而不是 `>`：
   v5.0 折叠改造后它们被搬进了 .set-body，不再是 .set-card 的直接子元素了。 */
.set-card .set-sub{margin:2px 0 0;font-size:12.5px;line-height:1.6;color:var(--faint);font-weight:600}
/* 「页面说明文字」那颗开关（外观栏里）一并管到设置页自己的灰字：
   关掉后只剩设置项本身，不留解释。⚠️ AI 那段隐私告知（.ai-quote）**不在**此列 ——
   它是知情同意，不该被一个显示开关藏起来。
   ★ 5G：v5.2 那条 `:not([data-keephelp])` 例外已删 —— 带该属性的版本介绍段按用户要求
   整段删掉了，机制没有使用者，跟着一起清掉（不留空转的选择器）。
   选择器必须写成 `.set-txt > span`（直接子元素）：示例数、配额数那些数字是
   `<b>…<span class="mono">N</span>…</b>`，用后代选择器会把数字本身也一起隐藏。
   收起态和 .intro-note 同一套：高度 0 + overflow:hidden + 淡出 + visibility:hidden
   （不是 display:none —— 那样就没有"撑开"的过程），真实高度由 revealAnim() 量。 */
body[data-help="off"] .set-card .set-sub,
body[data-help="off"] .set-row .set-txt > span{
  max-height:0;overflow:hidden;opacity:0;margin-top:0;visibility:hidden}
/* 数字一行写完，前后各留一点空隙（用户："这个数字跟左右两边的字体稍微空出一些距离，
   就可以了"）—— 不学统计页那种"标签 / 大数字 / 单位"三行块。
   只作用于设置页：统计页那个三行块是刻意突出的，不受影响。 */
.set-card .mono{margin:0 .18em}
/* ★ v5.1.2（用户："在标题后面放 3 个圆形的按钮…如果开启，UI 就变白；不按（关闭）就是灰色的。
   3 个按钮并排不太好看，但换成方形会跟上下方的元素冲突，所以还是要圆形"）：
   想法卡日期显示的三颗圆键。视觉**沿用 .segbtn.on / 未选中那一套**（白底浮起 + 灰字无底），
   不新造一套"选中"语言 —— 全站只有这一种选中长相。 */
/* 圆键的投影要留出地方：外层是 `.glass.set-card{overflow:hidden}`（圆角裁切 + 收起动画要用它），
   `.set-body` 也是 overflow:hidden；三颗键原来**贴着内容盒的右边**（实测圆键右沿 362 / 卡片右沿 382、
   卡片 padding-right 只有 20px，而投影是 `0 2px 10px` ≈ 十来个像素），于是最右那颗的右侧投影
   被卡片边界切掉 —— 用户看到的就是"这个字的阴影右边被挡着了"。
   这里只给这一组补出上下右三个方向的呼吸位（16px）：三颗键整体左移 16px，
   同时也不再和卡片右边界贴在一起。左边不加 —— 但要用负外边距把那 16px 抵掉，
   否则这一组会连带左边距一起缩进，跟上面几行说明文字的左沿对不齐。 */
.rbtns{display:flex;gap:8px;align-items:center;padding:16px 16px 16px 0;margin-left:-16px}
/* ★ v5.2.1（用户实测两个点：①"点完它没有变灰，外圈还被黑色的描边了一下；再点另一个，刚才那颗才变灰"
   ②"开是正常的"）：
   ①**那圈黑描边是全站默认聚焦环**（`*:focus-visible{outline:2px solid var(--ring)!important}`，
     --ring 在浅色下是 rgba(7,7,7,.42)）。它在第一次点击时冒出来、再点别处才消失 ——
     正好就是用户描述的那个"一直留着的黑圈"。这里换成和 .tab 同一种做法的**中性 box-shadow 环**
     （不用 outline，免得 `!important` 继续压着它）：键盘/辅助设备仍看得见焦点，手指点不再冒黑圈。
   ②**状态切换原来是 240ms 的染色过渡**。用户在手机上先看到的是聚焦环，颜色要 0.24s 才走完，
     于是"第一次点没变灰、点下一颗时上一颗才灰" —— 关掉底色/文字/描边的过渡，状态切换**瞬时生效**
     （只保留按下缩放那一下，否则整颗键按下去没有触感）。 */
.rbtn{
  width:36px;height:36px;padding:0;border-radius:50%;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line2);background:transparent;color:var(--muted);
  font:inherit;font-size:13px;font-weight:800;line-height:1;
  transition:transform var(--mo-quick) var(--mo-soft);
}
@media (hover:hover){ .rbtn:hover{color:var(--fg);border-color:var(--fg)} }
.rbtn:active{transform:scale(.94)}
/* 焦点环：和 .tab 同一套中性描边，不用 outline */
.rbtn:focus-visible{outline:none!important;box-shadow:0 0 0 2px var(--ring)}
.rbtn.on{
  background:var(--bg);color:var(--fg);border-color:var(--bg);
  box-shadow:0 2px 10px color-mix(in srgb,var(--glass-edge) 45%,transparent);
}
/* ★ 6C（2026-10-11，用户原话："万一它分了很多区呢？弄一个抽屉把这些按钮排成队列，
   让它上下滑动去选"）：设置页「没写时间的条目默认去哪」原来是一排药丸（.seg-cap）。
   分区可自建之后这一行会被撑爆 —— 真机截图里药丸横向溢出，连标题都被挤成一列单字
   （每行只剩一个字："没 / 写 / 时 / 间 / 的…"）。改成恒定高度的一枚按钮：
   右边显示当前值，点开底部面板去选，选项再多也是列表自己滚。 */
.set-pick{
  display:inline-flex;align-items:center;gap:6px;max-width:46vw;
  border:1px solid var(--line2,var(--line));background:var(--pill);
  color:var(--fg);border-radius:999px;padding:7px 12px;
  font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;
}
/* max-width 是硬要求：值可能是用户自建的长分区名，不设上限照样把左边的标题挤竖。 */
.set-pick .sp-v{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-pick .sp-arr{color:var(--muted);font-weight:800;line-height:1}
@media (hover:hover){ .set-pick:hover{border-color:var(--fg)} }
.set-pick:active{transform:scale(.97)}
/* ★ v5.0：设置页里"清空示例"在没有示例时禁用 —— 灰掉比"点了弹个提示"更早说明情况。
   （pointer-events:none 是给触摸端的：disabled 在部分 WebView 里仍会收到 pointerdown） */
.pill.is-off{opacity:.4;pointer-events:none}
/* 空态里的动作按钮：空态原本只有一段文字，加一个入口时要让它跟文字留出呼吸 */
.empty-acts{margin-top:14px;display:flex;justify-content:center}
.set-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 16px;
  padding:20px 0 4px;border-top:1px solid var(--line);margin-top:16px}
/* v3.3（用户："外观下的主题部分太大了，字窝在左边、按钮弄到右边，占的太多"）：
   原来是 flex：说明和标题共用一个窄栏、被右边的控件挤成 5~6 行，整块高度翻三倍。
   改成 grid 后：**标题与控件同一行**（col1 / col2），**说明文字通栏**（col1 跨到 col2）→
   行高从 5~6 行压到 1~2 行，控件也不再和文字抢横向空间。
   `display:contents` 让 .set-txt 这层壳从布局里消失，它的 b / span 直接变成 grid item。 */
.set-row .set-txt{display:contents}
/* ★ v5.1.2：这三条一律用**直接子元素** `> b` —— 说明文字里也会有行内 `<b>`（例如
   "三颗圆键分别是<b>年 / 月 / 日</b>，现在显示的是 <b class="mono">2026-10-04</b>"），
   用后代选择器会把那些行内加粗也变成 `display:block` 的标题行：一句话被拆成好几行，
   用户截图里就是"分别是 / 年 / 月 / 日 / ，亮着 = ……"这样断开的。 */
.set-row .set-txt > b{grid-column:1;grid-row:1;min-width:0}
/* ⚠️ 必须是**直接子元素** `> span`：`<b>今天还剩 <span class="mono">3</span> 次</b>` 里的
   .mono 也是 span，用后代选择器会给它套上 display:block —— 于是"今天还剩 3 次"被拆成
   三行（用户："你看像这种分明就是一行的，你就不要把它分成三行去表述"）。 */
.set-row .set-txt > span{grid-column:1 / -1;grid-row:2}
.set-row > *:not(.set-txt){grid-column:2;grid-row:1}
.set-row .set-txt > b{display:block;font-size:14.5px;font-weight:800}
.set-row .set-txt > span{display:block;margin-top:6px;font-size:12.5px;line-height:1.7;color:var(--muted);font-weight:600}
/* ★ v5.0：右边放两枚按钮的那种行，左边那行字会被挤成两三行 ——
   用户："你看像这种分明就是一行的，你就不要把它分成三行去表述……这个数字跟左右两边的
   字体稍微空出一些距离，就可以了"。这类行（示例数据、AI 的配额）加 .stack：
   文字占满整行，控件落到下一行、左对齐。 */
.set-row.stack{grid-template-columns:1fr}
.set-row.stack .set-txt > b{grid-row:1}
.set-row.stack .set-txt > span{grid-row:3}
.set-row.stack > *:not(.set-txt){grid-column:1;grid-row:2;justify-self:start;margin-top:10px}
/* ★ 6B（设置页信息架构重做）——两条新语言：
   ①「动作 vs 设置」：开关 / 分段选择器是"拨一下就长期生效"（凹槽 / 描边药丸），
     而 `试连接 / 现在找一次 / 筛出来删掉 / 备份 / 放一批进来 / 清空示例 / 清空学到的`
     是"点一下执行一次"。后者统一换成 `.set-act`：**实心 + 方角** ——
     形状与填充都跟状态类对不上，不会再被读成"选项"（用户原话：把描边药丸读成选项，
     点下去发现它开始干活了）。
   ② 二级页「AI 连接」那一行（原来整张 AI 卡的位置）：整行是一个按钮，右边一个 ›。 */
.set-act{
  border:1px solid var(--fg);background:var(--fg);color:var(--bg);
  font:inherit;font-size:13px;font-weight:800;padding:8px 16px;border-radius:11px;
  cursor:pointer;white-space:nowrap;
  transition:transform var(--mo-quick) ease,opacity var(--mo-quick) ease;
}
/* hover 一律包在 (hover:hover) 里 —— 顶层 :hover 会在触摸端留下"粘滞态"（_2b-hover 那条红线）。 */
@media (hover:hover){ .set-act:hover{transform:translateY(-1px)} }
.set-act:active{transform:scale(.97)}
.set-act[disabled],.set-act.is-off{opacity:.4;pointer-events:none}
.set-acts{display:flex;gap:8px;flex-wrap:wrap;flex:0 0 auto;align-self:center}
.ai-entry{
  display:flex;align-items:center;gap:10px;width:100%;cursor:pointer;text-align:left;
  border:0;font:inherit;color:inherit;padding:15px clamp(20px,2.4vw,30px);border-radius:16px;
}
.ai-entry .ae-t{flex:1 1 auto;min-width:0;font-size:14px;font-weight:800;color:var(--fg)}
.ai-entry .ae-chev{flex:0 0 auto;font-size:17px;line-height:1;color:var(--faint)}
.ai-entry:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 「常用」那张卡常驻展开、不参与折叠（理由见 renderSettings 里那段：S.setOpen 的
   字段名 / 默认值 / 读写路径一个都不许动 ⇒ "默认展开 + 可收起"要多存一个状态）。
   它没有 .set-head，标题用同一套字，看着仍是一张卡的头。
   行距也比别栏再紧一档：这一栏的职责是"一屏之内把提醒 / 语音输入 / 主题一次拨到"，
   而它默认展开、下面还有 3 栏收起的卡 —— 收紧 12px×4 换来的是一屏能看全。 */
.set-card.set-keep > h3{
  margin:0;padding:14px 0 12px;font-size:13px;font-weight:900;letter-spacing:.2em;
  text-transform:uppercase;color:var(--fg);
}
.set-card.set-keep .set-row{padding-top:14px;margin-top:12px}
/* 二级页「AI 连接」的面板需要 modal 里有个流内容把高度撑开（面板是 inset:0 的 absolute）。 */
.ai-holder{height:min(560px,74vh)}
/* 开关：和顶栏那个主题开关同一套观感（凹槽 + 白色球），但语义是 role="switch"，
   位置状态由 aria-checked 驱动 —— 这样键盘可达，屏幕阅读器也能读出开/关。
   关态用 --pill-hover 而不是 --pill：4.5% 的黑在白卡上几乎看不出"槽"，只剩一个白球漂着，
   分不清这是开关还是装饰。7.5% 既能看出轨道，又没跳出这套中性控件的观感。 */
.switch{
  appearance:none;-webkit-appearance:none;flex:0 0 auto;cursor:pointer;padding:0;position:relative;
  width:58px;height:34px;border-radius:9999px;
  border:1px solid var(--line2);background:var(--pill-hover);
  transition:background var(--mo-quick) ease,border-color var(--mo-quick) ease,transform var(--mo-fast) ease;
}
.switch::after{
  content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:999px;
  background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.72),transparent 30%),color-mix(in srgb,#fff 82%,transparent);
  box-shadow:inset 1px -1px .75px -1px rgba(255,255,255,.86),inset -1px 1px .75px -1px rgba(255,255,255,.46),
             0 3px 9px rgba(0,0,0,.16);
  transition:transform var(--mo-base) var(--mo-soft);
}
.switch[aria-checked="true"]{background:var(--accent);border-color:transparent}
.switch[aria-checked="true"]::after{transform:translateX(24px)}
/* ★ 阶段1 提醒：开关右侧那一列（开关 + 「未授权 / 去设置」）。竖着排、右对齐 ——
   授权提示是开关的补充说明，横着摆会在手机上把「提醒」那行标题挤成两行。
   ⚠️ `[hidden]` 必须自己写回 display:none：下面给了 .notify-perm 一个 display:flex，
   会把浏览器默认的 [hidden]{display:none} 盖掉（条件显示的老坑）。 */
.notify-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.notify-perm{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  color:var(--muted);white-space:nowrap}
.notify-perm[hidden]{display:none}
.notify-perm .pill{padding:3px 10px;font-size:12px}
/* ★ 4C 真闹钟档 2：精确排期状态那一行。与上面「未授权」同一副形状（同一个 `.notify-side`
   竖列里再添一行），文案说人话、带不带「去开启」由 refreshNotifyExact() 收口。
   ⚠️ 同一条老坑：`.notify-exact{display:flex}` 会盖掉浏览器默认的 [hidden]{display:none}。 */
.notify-exact{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
  color:var(--muted);text-align:right;justify-content:flex-end;max-width:240px;line-height:1.35}
.notify-exact[hidden]{display:none}
.notify-exact .pill{padding:3px 10px;font-size:12px;flex:0 0 auto}
/* ★ 5C：提醒对账那一行（"排 8:36 · 实际 8:37（晚了 62 秒） [去放行]"）。
   整行铺开的小字，与 .notify-perm 同一个色阶。 */
.notify-last{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;
  font-size:12px;font-weight:600;color:var(--muted)}
.notify-last[hidden]{display:none}
.notify-last .pill{padding:3px 10px;font-size:12px;flex:0 0 auto}

/* 时间轴：条数 / 逾期这类事实数字单独一行常显，和上面那段可关掉的说明文案分开。
   放在列表正上方 —— 它说的是这份列表的事，本来就该挨着列表。
   ★ v3.36（用户："分类界面里边的『共 5 条，其中逾期 1 条』，这种提示居中"）：
   这行字说的是**整份列表**的合计，就该以列表的中轴居中，而不是贴左和标题对齐。 */
.tl-meta{font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--faint);
  margin:clamp(24px,3vw,34px) 0 0;text-align:center}

/* 五张卡一律同一副样子：标签 / 大数字 / 单位 / 细分 chips，竖着排。
   （以前这里有条 :last-child:nth-child(odd) 的规则，把最后一张铺满整行改成横排汇总条，
   为的是别在第二行留空洞 —— 但那样「历史完成」跟前面四张长得完全不一样，
   反而更像出错。现在改成让网格自适应，五张卡桌面宽度刚好排满一行，既不留空、也长一样。） */

/* 方块：1:1 紧凑方形平铺，内容居中 */
.feature-grid.tile{grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:clamp(10px,1.3vw,16px)}
.feature-grid.tile .feature-card{
  min-height:0;aspect-ratio:1/1;border-radius:26px;padding:clamp(14px,1.6vw,20px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
}
@media (hover:hover){
.feature-grid.tile .feature-card:hover{transform:translateY(-5px)}
}
.feature-grid.tile .feature-card .k{font-size:11px;letter-spacing:.13em}
.feature-grid.tile .feature-card .v{margin:12px 0 0;font-size:clamp(30px,3.3vw,44px)}
/* 方块模式：左列改为居中（横条那套是左对齐） */
.feature-grid.tile .feature-card .pcol{align-items:center}
.feature-grid.tile .feature-card.big .v{font-size:clamp(34px,3.7vw,50px)}
.feature-grid.tile .feature-card .s{margin-top:5px;font-size:11.5px}
/* ★ 0G：原来这里有一整族「完成量来源细分」的样式（.vchip / .vchips / .vsub / .vsub-v，
   还有方块模式那句 .feature-grid.tile .vchips）—— 那是长在统计首页卡片上的小药丸。
   用户把那条分解挪进子页之后，这一族**全都没有引用了**（源码级 grep：0 处使用），
   按"不留死代码"一并删除；子页那行用的是新的 .stat-origin（见统计子页那一段）。 */

/* ---------- 响应式 ---------- */
@media (max-width:1080px){
  .board{grid-template-columns:1fr}
  .feature-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
/* ==========================================================================
   iOS 安全区（刘海 / 灵动岛 / 底部 Home 指示条）
   --------------------------------------------------------------------------
   从 Safari「添加到主屏幕」装上后，页面是以 standalone 模式全屏运行的：没有地址栏、
   没有底部工具栏，内容会直接顶到灵动岛和 Home 指示条上（配合 viewport-fit=cover）。
   env(safe-area-inset-*) 在不支持 env() 或安全区为 0 时解析为 0px ——
   所以安卓 App、桌面浏览器、安卓浏览器全部零影响，不需要额外的媒体查询去分设备。
   注意这里只动 top/bottom/左右内边距，不碰任何尺寸与配色。
   ========================================================================== */
/* 顶栏已撤，录入条吸顶改为贴视口顶部（安全区之上），见 .capture-wrap 主规则 */
.capture-wrap{top:0}
/* v3.32：提示已改为固定在**顶部**（见 #toast 主规则），这条底部偏移作废 —— 保留会把它拉回底部。 */
#toast{top:calc(var(--sat,12px) + 12px);bottom:auto}
/* 页脚避开通栏的底部留白已并进 .pdaim-footer 的主规则（0F.3：一个选择器只留一处真相源） */
.hero{padding-left:calc(24px + env(safe-area-inset-left));padding-right:calc(24px + env(safe-area-inset-right))}

/* ==========================================================================
   窄屏（手机）—— 这一版是照真机截图重排的，解决三件事：
   ① 顶栏被四个竖排文字页签撑得又高又挤（「时间轴」在窄屏被压成三行）；
   ② 大标题字号超出屏幕、被 .hero 的 overflow:hidden 裁掉半行；
   ③ 页头吃掉首屏近一半，真正要看的清单得往下翻很久才露头。
   ========================================================================== */
@media (max-width:820px){
  /* 顶栏：页签图标化后改成一排 flex，并用 space-between 把标题/页签/右侧控件分开
     （居中排的话，360px 宽时排完只剩几十 px，反而会跟右侧控件叠上）。

     标题不再藏起来 —— 上一版是把 .hleft 整个 display:none，但那条规则写成了
     `.hleft{display:none}`（权重 0,1,0），压不过基础规则 `.site-header .hleft`
     （0,2,0），所以它其实一直显示着：flex 把它挤到只剩几十 px，又被自身
     overflow:hidden 裁掉后半截，屏幕上就剩"待办"两个字 —— 也就是用户截图里
     "标题被右边按钮挡住了"的样子。现在两条都改：
     ① 选择器提到同等权重，规则真的生效；
     ② 右侧控件瘦身（撤掉 ⚡、滑块换圆点，省 60px），三个字放得下，就把它请回来。
     顺带把条数/备份那行小字继续收着 —— 手机上它只会抢位置。 */
  /* 窄屏下页签图标略缩（底栏 .tab 沿用 .np-ico） */
  .np-ico{width:18px;height:18px}

  /* 录入条吸顶：顶栏已撤，贴视口顶部即可（安全区之上） */
  .capture-wrap{top:0}

  /* 首屏：顶栏已撤，只需让开刘海/灵动岛的安全区，不用再为 56px 高的胶囊留位。
     标题字号下限保持 29px（宽度余量来源，别因名字短就抬回去）。 */
  .hero{padding:calc(36px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 16px calc(20px + env(safe-area-inset-left))}
  .hero .eyebrow{font-size:10.5px;letter-spacing:.24em;margin:0 0 10px}
  .hero h1{font-size:clamp(29px,8.2vw,44px);line-height:.94}
  .hero .subtitle{margin-top:12px;font-size:13.5px;line-height:1.65}
  .hero::before{background-size:30px 30px}      /* 点阵跟着缩小，密度观感才一致 */

  /* 以下一段是"尽早露出真正的内容"：区块上边距、区块标题、工具条逐层收窄。
     只压间距和字号 —— 事实数字（.tl-meta）、空态提示、控件尺寸都不动。 */
  .pdaim-section{padding:22px 0 44px}
  .section-kicker{margin-bottom:8px;font-size:11px;letter-spacing:.2em}
  .section-intro h2{font-size:clamp(28px,7.8vw,40px)}
  .section-intro p{margin-top:12px;font-size:13px;line-height:1.7}
  /* ★ 3.5.4：窄屏这条原来把下外边距压成 12px —— 手机（≤1080px）上真正生效的是它，
     所以"标签和下面列表的间距翻倍"必须**在这里**改，光改基础规则是白改（实测展开后
     间距仍是 12px）。现在下边距跟基础规则一致：34px（原来是 16/12 的两倍以上）。 */
  .toolbar{margin:20px 0 34px}
  .tl-meta{margin-top:18px}

  /* 统计 / 设置没有 hero，顶栏也已撤，顶部只需一点呼吸位（时间轴已降级为清单模式，
     不再有独立的 timeline 视图，下面那条 data-view="timeline" 删掉）。 */
  body[data-view="stat"] .pdaim-section,
  body[data-view="settings"] .pdaim-section{padding-top:18px}

  .feature-grid{grid-template-columns:1fr}
  .row{flex-direction:column;gap:0}
}
/* ==========================================================================
   动效增强 —— 只补缺口，不改既有动画的参数
   原则：① 全部是可单独删除的独立规则，删掉任何一条功能都照常；
        ② 没有一条碰到布局（只动 transform / opacity / 高度这类合成友好属性）；
        ③ prefers-reduced-motion 由文件末尾那条全局规则兜底（下面另补两条例外）。
   ========================================================================== */

/* ---------- 1. 按下反馈 ----------
   原来全站只有 :hover，一条 :active 都没有。触屏（iOS / Android）根本不触发 :hover，
   所以在此之前手机上点任何按钮都是"零反馈"，只能靠页面跳变来确认点上了。
   这里给所有可点元素一个"沉一下"的手感；按下用 60ms（跟手），松开的回弹仍走原时长。
   注意必须写成真类选择器而不是 :where(...) —— :where 权重为 0，
   会被上面 .btn:hover 的 translateY(-1px) 压住，鼠标按住时反而不动。 */
.btn:active,.nav-pill:active,.pill:active,.st:active,.segbtn:active,
.theme-dot:active,.mini:active,.pill-x:active,.addpill:active,
.chip[data-tag]:active,.chip.goalchip:active,.backup:active,.sel-btn:active{
  transform:translateY(1px) scale(.972);
  transition-duration:60ms;
}
/* 按下灰罩：盖一层跟元素同圆角的半透明灰（linear-gradient 实色技巧 ——
   background-image 会叠在 background-color 之上，实底按钮也照样变灰）。
   变化是瞬时的（background-image 没法过渡），但位移/缩放仍走过渡，
   而且灰罩严格贴着元素自己的圆角 —— 用户要的就是"整个变灰"而不是"一块方形灰"。
   灰罩色直接复用 --tap（浅色压灰 / 深色提亮），两个主题各自成立。 */
.btn:active,.nav-pill:active,.pill:active,.st:active,.segbtn:active,
.theme-dot:active,.mini:active,.pill-x:active,.addpill:active,
.chip[data-tag]:active,.chip.goalchip:active,.backup:active,.sel-btn:active{
  background-image:linear-gradient(var(--tap),var(--tap));
}
.tick:active{transform:scale(.86)}          /* 勾选框最小，动作要更明显才看得见 */
.switch:active{transform:scale(.955)}        /* 开关只压一下，不做位移（横向控件，位移看着像歪了） */

/* ---------- 2. 键盘焦点环 ----------
   :focus-visible 只在键盘 / 辅助设备操作时命中，鼠标点击不会出现，所以不污染现有视觉。
   加 !important 是因为页面里有 5 处 outline:0（.capture input / .search / .newtag-input /
   .tagrow input / .field input）—— 不带它的话输入框永远拿不到焦点环。
   注意一个反直觉的点：**文本输入框只要聚焦就一定命中 :focus-visible**（规范如此，
   不看你用鼠标还是手指）—— 所以手机上点一下输入框，这一圈环必然会出来，躲不掉。 */
*:focus-visible{outline:2px solid var(--ring)!important;outline-offset:2px}
/* 文本输入框例外：既然"一聚焦就必然画框"躲不掉，而用户明确说
   「这显得有点突兀」「深色的就别有这种选中的框了」「直接弄个一闪一闪的光标就行，
   不用再弄个框把输入键框起来」—— 那就把文本框从那条规则里摘出来。
   聚焦提示改由「闪烁光标（caret）+ 输入区自身的变化」承担（见 .capture input:focus）。
   **非文本控件（按钮 / 开关 / 链接 / .segbtn / .tick）仍保留上面那圈 ring**，
   键盘可达性不受影响。 */
input:focus-visible,textarea:focus-visible{outline:none!important}

/* ---------- 3. 弹层出场 ----------
   原来只有入场（.mask.on 播 fadein、.modal 播 rise），关闭时 class 一摘就瞬间消失。
   现在关闭会给 .mask 挂 .closing 先播完退场再真正隐藏（见 closeModal / openMask）。 */
@keyframes fadeout{from{opacity:1}to{opacity:0}}
@keyframes fall{from{opacity:1;transform:none}to{opacity:0;transform:translateY(10px) scale(.985)}}
.mask.closing{animation:fadeout .17s ease both}
.mask.closing .modal{animation:fall .17s cubic-bezier(.4,0,.7,1) both}
/* ★ v5.0「去程」退场：往哪个方向送走，弹层就往哪边收。
   配合「立项」的语义 —— 把这条想法送去清单（底栏右边那个页签）。
   曲线刻意**不带过冲**：它是在"送走"，不是在"弹开"；
   过冲留给"东西回来了"那类动作（比如继续想）。 */
.mask.exit-right .modal{animation:leaveR .22s cubic-bezier(.4,0,.2,1) both}
.mask.exit-left  .modal{animation:leaveL .22s cubic-bezier(.4,0,.2,1) both}
@keyframes leaveR{from{transform:translateX(0) scale(1);opacity:1}
                  to{transform:translateX(28%) scale(.97);opacity:0}}
@keyframes leaveL{from{transform:translateX(0) scale(1);opacity:1}
                  to{transform:translateX(-28%) scale(.97);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .mask.exit-right .modal,.mask.exit-left .modal{animation:fall .12s ease both}
}
/* ★ v5.0：目标页签的"收到"回执 —— 一次性的颜色/位移脉冲，播完自动回常态。
   实测过的坑：把颜色挂在 :hover 上会在触摸端**粘住**（见 .zone>header 那段），
   所以这里走 animation 而不是 hover/类态。
   只用 color + transform：两者都能走合成器。**不用 filter** ——
   动画化的 filter 在安卓 WebView 上会被丢回软件光栅化（早期版本踩过）。 */
.tab.tab-ping{animation:tabPing .46s cubic-bezier(.2,.9,.25,1) 1}
@keyframes tabPing{
  0%  {color:var(--muted); transform:translateY(0)    scale(1)}
  38% {color:var(--accent);transform:translateY(-3px) scale(1.15)}
  100%{color:var(--muted); transform:translateY(0)    scale(1)}
}

/* ---------- 4. 打勾 / 删除的退场动画 ----------
   ★ 3.5.2（用户重新定义，两条都照这个来）：
     "这一整个条被压缩，相当于直接被挤掉了。因为下面的可能要上来嘛，直接点击，
      再过个几帧之后，就是我们点勾或点叉之后，它就直接像一张纸一样被压缩掉了"
   所以：**只有纵向压扁**，不再往右抽走 ——
     0~16%   先把反馈亮出来（打勾＝绿勾、删除＝标题与 ✕ 变红），给"点中了"几帧确认时间
     16~100% 整条像纸一样被压掉：scaleY 1 → 0.015（上下边缘一起向中线合），
             同时 scaleX 微微收到 0.965（"被挤"的感觉），**从头到尾不加位移**
   压完（动画结束）才落数据，紧接着下面的条目走 FLIP 平滑补位 —— 视觉上就是
   "这一条被挤没了，下面的顶上来"。
   为什么不再淡出：它已经被压成一条 1.5px 的线，再淡出反而多一层。
   全程只动 transform / opacity（都能走合成器）。**没有 filter** ——
   3.5.0/3.5.1 曾用 `filter:brightness()` 当"亮线"，安卓 WebView 上动画化的 filter 会被
   丢回软件光栅化，直接卡成"变绿、停一会儿、消失"（用户实测）。亮线现在由 ::after 的
   opacity 承担（见 rowFlash）。 */
@keyframes rowOut{
  0%{transform:scale(1,1);opacity:1}
  16%{transform:scale(1,1);opacity:1}
  100%{transform:scale(.965,.015);opacity:1}
}
.item.row-out,.hwcard.row-out{
  animation:rowOut 420ms cubic-bezier(.45,.05,.55,.95) both;
  pointer-events:none;will-change:transform;
}
/* 那道"亮线"：白色覆盖层只动 opacity（合成器友好），峰值落在快压到底的那两帧 */
.item.row-out::after,.hwcard.row-out::after{
  content:'';position:absolute;inset:0;border-radius:inherit;background:#fff;
  pointer-events:none;opacity:0;
  animation:rowFlash 420ms cubic-bezier(.45,.05,.55,.95) both;
}
@keyframes rowFlash{0%{opacity:0}16%{opacity:0}62%{opacity:.45}88%{opacity:.92}100%{opacity:0}}
/* 打勾：勾选框立刻变绿并弹一下，标题也转绿。
   ★ 3.5.3（用户实测："为什么我现在点了删除，它前面那个对号键会亮啊？…它莫名其妙亮了个对号，
   还是绿色的"）：原来这条挂在 `.row-out` 上，而 `.row-out` 是**打勾和删除共用的**基类 ——
   于是点 ✕ 删除时，左边的勾选框也被点亮成绿勾。绿勾只属于"完成"，必须挂在
   `.row-out-ok` 这个只给打勾用的子类上；删除那边只有标题与 ✕ 变红。 */
.item.row-out-ok .tick{
  background:var(--ok);border-color:var(--ok);color:#fff;
  transition:transform 180ms var(--mo-soft);transform:scale(1.18);
}
.item.row-out-ok .t{color:var(--ok)}
/* 删除：整条泛一层淡红、标题与 ✕ 变红。
   ★ 划掉那条线**删了**（用户："如果标题是两行的话，我发现你画的横线是在文本的最中间画一条线呀。
   那还不如不画线算了，你别画线了"）—— 我用的是绝对定位的一条 `::after` 横线，
   `top:54%` 量的是**整个标题盒子**的中间，标题一旦换行就横在两行之间，读起来像一条无关的线。
   真要做"划掉"的正确姿势是 `text-decoration:line-through`：它会给每一行各画一条、
   自动贴合行高，只是没有"从左划到右"的过程。用户没要这个，先不加。 */
.item.row-out-del{box-shadow:inset 0 0 0 999px color-mix(in srgb,var(--danger) 9%,transparent);border-radius:12px}
/* 「已立项」跳回目标待办时闪一下（一次性，不是常驻光效） */
@keyframes jumpHl{
  0%{box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 70%,transparent)}
  100%{box-shadow:0 0 0 2px transparent}
}
.item.jump-hl{animation:jumpHl 1.6s ease both}
/* ★ 本轮（用户："清单里有个按钮删一下，看不太出来。是不是因为你这个闪了一下，
   在卡片消失之前闪的"）：删除和"完成"共用同一道**白**闪。白色是"打勾"的语言，
   用在删除上是错的语言，而且它盖住了"整条被压掉"的过程，删了什么反而看不清。
   删除改成红色闪 —— 两个动作各说各的话。 */
.item.row-out-del::after,
.hwcard.row-out-del::after{background:color-mix(in srgb,var(--danger) 45%,transparent)}
.item.row-out-del .t{color:var(--danger)}
.item.row-out-del .acts .mini{color:var(--danger)}

/* ---------- 5. 新录入的那一条落位 ----------
   回车加一条，原来那一行是"凭空出现"的。这里只让刚录入的那一条轻轻落下，其余行不动。
   判据是 id + 时间戳（见 addItem / itemHTML），所以页内重渲染（打勾、换标签、搜索）
   不会整页重播 —— 本项目早先正是栽在「无条件入场动画 + innerHTML 整体重建」上。 */
@keyframes itemIn{from{opacity:0;transform:translateY(-7px) scale(.995)}to{opacity:1;transform:none}}
.item.just-added{animation:itemIn .34s var(--mo-soft) both}
/* ★ 2B 两段式上屏的第二段：AI 回来之后把这一条的标题换了，**亮 0.5 秒**让用户看见改成了什么
   （用户原话："并且要停留 0.5 秒左右吧，就是让用户知道修改成什么了"）。
   只亮标题那一块，不整卡闪 —— 否则看起来像又新加了一条。
   用 animation 而不是 transition：它是一次性提示，跑完就该消失，不需要结束状态。 */
@keyframes swapFlash{
  from{background:color-mix(in srgb,var(--accent) 26%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  to{background:transparent;box-shadow:none}
}
.item.ai-swapped .t{
  border-radius:7px;margin:-2px -5px;padding:2px 5px;
  animation:swapFlash .5s var(--mo-soft) both;
}
@media (prefers-reduced-motion:reduce){ .item.ai-swapped .t{animation:none} }

/* ---------- 6. 写法提示的展开 / 收起 ----------
   原生 <details> 是"啪"一下弹开的。Chrome 131+ 支持 ::details-content 伪元素，
   配合 interpolate-size:allow-keywords 就能给高度做过渡；不支持的浏览器
   整段 @supports 被丢弃，退回原来的瞬时开合（优雅降级，不会坏）。 */
@supports selector(::details-content){
  .hint{interpolate-size:allow-keywords}
  .hint::details-content{
    height:0;overflow:hidden;
    transition:height var(--mo-base) var(--mo-soft),
               content-visibility var(--mo-base) allow-discrete;
  }
  .hint[open]::details-content{height:auto}
}

/* ==========================================================================
   底部导航（v3 新增，独立于旧顶栏，便于整体回滚）
   -------------------------------------------------------------------------
   原顶栏（.site-header）撤掉后，这里在屏底放一条「灵动岛」胶囊：居中、浅底、大圆角、
   轻微毛玻璃，内部 3 个等分页签。胶囊中轴线上方再悬浮一颗圆形录入键。
   整条 nav 占满屏宽但 pointer-events:none，只让胶囊本体接点击 —— 胶囊两侧的留白
   不会挡住下面的内容（旧顶栏是整条可点的，会吃掉下方点击）。
   ========================================================================== */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:80;
  display:flex;justify-content:center;
  /* 让出 Home 指示条的安全区，胶囊整体抬到它上面。
     v2.5：再额外抬 8px —— 用户反馈"位置太靠下、按的时候不好按"（贴屏底会跟系统手势抢）。
     ★ v3.36（用户："上下滑动时会跳动：往上滑它就往上移一点，往下滑就往下移一点"）：
     这里**只能读 JS 冻结过的 var(--sab)，绝不能再读 env(safe-area-inset-bottom)**。
     env() 在安卓上是动态值 —— 滚动时系统手势条自动隐藏/显隐切换，这个值就跟着变，
     而底栏是 bottom:0 锚定的，padding-bottom 一变整条栏就上下挪几像素，
     表现恰好就是"跟着手指往上/往下移一点"。--sab 在启动时算好一次（原生 insets 与 env 取大者），
     之后只在转屏时重读，滚动期间纹丝不动。 */
  padding-bottom:calc(var(--sab,0px) + 18px);
  pointer-events:none;
  /* 给悬浮球 + 胶囊一点向上的呼吸位，别贴死屏幕下沿 */
  padding-top:14px;
  /* —— 形状参数定稿（这几个数改这里就能调轮廓）——
     --bar-h 栏高、--btn-d 圆钮直径、--wrap 包边宽、--tr-r 过渡凹角半径、--end-r 两端圆角。
     实际轮廓由 JS 按实测栏宽算出 SVG 路径（见底部 buildBarShape）：垂直尺寸固定 px，
     只有水平布局随栏宽自适应，保证圆钮永远是 56px、栏永远是 48px。 */
  --bar-h:48px;--btn-d:56px;--wrap:8px;--wrap-max:20px;--tr-r:16px;--end-r:24px;
  /* 玻璃层 / 水波层比轮廓大一圈的 overscan：长按时「水环」膨胀，轮廓会探出 capsule
     的底边（那是正常的——水环本来就该凸出去），所以承载它的元素必须比轮廓大这么多，
     否则会被自己的盒子切平。JS 会把裁切路径同步平移同样的距离，两边永远对齐。 */
  --over:18px;
}
/* 胶囊只做定位容器：高度由 JS 按「栏高 + 最大膨胀」算出（见 buildBarShape 的 capH），
   width 固定居中。视觉全交给 .bar-glass（磨砂玻璃栏体），本身不接点击。
   高度里刻意留了一截**上方余量**：水环膨胀时轮廓向上长，而栏体本身的中心必须原地不动
   （用户原话："你不要让它直接往上移，让它保持在原位"），所以多出来的空间全部记在顶部。 */
.tabbar .capsule{
  position:relative;pointer-events:none;
  width:min(360px,calc(100% - 32px)); /* 左右各 16px 外距，栏整体居中 */
  margin:0 auto;height:82px;          /* JS 会按参数重算覆盖，这里只是首帧兜底 */
}
/* 抬升感 —— 注意：这**不是**描边，是一团摊在栏体下方的柔影。
   上一版沿轮廓描了一圈线（.bar-edge），用户直接读成"外面多余出来一个方形框"，
   而且白底上玻璃本身太淡、只剩那圈线，看起来就像凭空画了个框。现在改用柔影表达
   "这块玻璃被托起来了"，它没有任何硬边，不可能被读成框。 */
.tabbar .capsule::after{
  content:'';position:absolute;left:6%;right:6%;bottom:-10px;height:34px;z-index:0;
  background:radial-gradient(50% 50% at 50% 50%, var(--bar-cast) 0, transparent 74%);
  filter:blur(10px);pointer-events:none;
}
/* 液态玻璃栏体（本轮重做）：**一层里同时完成磨砂与边缘折射**。
   为什么必须合并成一层 —— 磨砂与折射分居两层时会互相废掉对方：
     ① 折射层在磨砂层之上：它采样到的是下面那层"已经糊过"的玻璃，位移一张模糊图 ≈ 没位移
        （上上版实测像素差只有 9/255，用户的评价是"你的折射跟什么都没有啊"）；
     ② 折射层在磨砂层之下：上面那层磨砂又会把位移一起糊掉。
   所以 blur 与 feDisplacementMap 必须在同一条 backdrop-filter 链里，而且 blur 要克制
   （8px）—— 糊得越狠，边缘弯折越看不出来。磨砂感由 blur + 提饱和 + 微提亮共同给出。
   url(#barLiquid) 只有 Chromium 引擎支持，故单独加持在 html.liquid-glass 下；
   其它引擎（Safari / 老 WebView）落到上面那条纯磨砂声明，形状与文字完全不受影响。 */
/* ★ v3.24（用户实测："上下滑动、切页面时导航栏还是会动"）：两处一起治 ——
   ① 给固定层强制独立合成层（translateZ(0) + will-change），消除滚动/切页时的亚像素抖动；
   ② 滚动期间摘掉最贵的玻璃层（停 140ms 挂回）。安卓 WebView 上 `backdrop-filter`（还挂着
      SVG feDisplacementMap 置换滤镜）压在 position:fixed 元素上，是"滚动时栏在晃"的头号成因。 */
/* ★ v3.35（用户："上下滑，底栏还是会动几个像素，幅度跟着手指，所有页面都动"）：
   那不是"没固定住"，而是**安卓 WebView 的过度滚动/回弹**在整体平移视口 ——
   连 position:fixed 的层也会被一起推走几像素。CSS 侧先禁掉过度滚动，
   原生侧还有 web.setOverScrollMode(OVER_SCROLL_NEVER)（见 MainActivity）。
   同时**撤掉 3.24 加的 will-change/translateZ** —— 在部分 WebView 版本上，
   给 fixed 元素加 will-change:transform 反而会让它参与滚动层，与本次现象相符。 */
html,body{overscroll-behavior:none}
.tabbar{backface-visibility:hidden}
/* ★ v3.25（用户："页面内容能完全被一个屏幕包裹时，就不要让它能上下滑动了"）：
   内容装得下就整页锁死（JS 按实测高度挂 html.fit-view），装不下才允许滚。
   顺带治掉"只溢出几像素"的那种蹭动 —— 那正是导航栏看起来在动的来源之一。 */
html.fit-view,html.fit-view body{overflow:hidden!important;overscroll-behavior:none}
/* ★ v3.36（用户实测："我滑动的时候，导航栏的玻璃材质是不生效的。你看这个图里边，
   它就直接透明了，跟下面的字重叠了"）：v3.24 加的 `html.is-scrolling .bar-glass{backdrop-filter:none}`
   整条删除。它当时的动机是"滚动时栏在晃"，但代价是滚动全程栏体变透明、和下面的文字糊在一起 ——
   用户明确不接受。真正治抖的是另外两条：① 过度滚动已禁（下面 html,body 那条 + 原生 OVER_SCROLL_NEVER）；
   ② 安全区不再动态读 env()（见 applyInsets，栏体位置在滚动期间完全不参与计算）。
   滚动期间仍然只收一样东西：.bar-flow（越界流光），它在滚动时本来就没有意义。 */
html.is-scrolling .bar-flow{opacity:0}
.bar-glass{
  /* overscan：水环膨胀时轮廓会探出 capsule 底边，元素必须比轮廓大一圈才不会被自身盒子切平 */
  position:absolute;inset:calc(-1 * var(--over));pointer-events:none;z-index:1;
  clip-path:url(#barClip);-webkit-clip-path:url(#barClip);
  /* 玻璃本身近乎无色：存在感来自背透（模糊/提亮/加饱和）与边缘弯折，不来自填充色。
     厚度感由两道**极柔**的内部渐变给出（都在轮廓内、无硬边，不会被读成"框"）：
     上沿一道窄高光（光从上方打进玻璃）+ 下沿一道更窄的暗边（玻璃底面背光）。
     这对应 GlassSurface 的 inset 光照 —— 我们不能用它原样的 inset box-shadow，
     因为 inset 阴影沿矩形边框走，而我们的轮廓是气球形（会被 clip-path 裁出直线来）。 */
  background:var(--bar-sheen);
  background-image:
    /* 上沿高光（光从上方打进玻璃）。渐变是**柔的**，没有硬边，不会被读成"框"。 */
    linear-gradient(180deg,color-mix(in srgb,var(--bar-rim-hi) 62%,transparent) 0,transparent 15%),
    /* 下沿暗边（玻璃底面背光）—— "厚度"的主要来源。v2.5 从 26% 提到满配：
       之前 α 只有 .078，在白底上等于没有，这正是"跟背景分不出"的直接原因。 */
    linear-gradient(0deg,color-mix(in srgb,var(--bar-rim-lo) 100%,transparent) 0,transparent 17%),
    /* 两端圆头内侧的反光：光顺着圆角聚一圈 → 端头也有厚度，而不只是中间厚 */
    linear-gradient(90deg,color-mix(in srgb,var(--bar-rim-hi) 46%,transparent) 0,transparent 7%),
    linear-gradient(270deg,color-mix(in srgb,var(--bar-rim-hi) 46%,transparent) 0,transparent 7%);
  -webkit-backdrop-filter:blur(8px) saturate(1.7) brightness(1.05);
  backdrop-filter:blur(8px) saturate(1.7) brightness(1.05);
  /* 拖拽态要在 --bar-sheen 与 --bar-sheen-solid 之间淡换（见 .capsule.dragging） */
  transition:background-color var(--mo-base) ease;
}
/* Chromium 专属：在同一条链的末尾追加真置换折射 —— blur 先糊、位移后弯，
   只有贴近轮廓的那一圈（bezel 带）沿外法线弯折，栏体中间保持干净。
   （置换图生成见 buildDisplacementMap） */
html.liquid-glass .bar-glass{
  -webkit-backdrop-filter:blur(8px) saturate(1.7) brightness(1.05) url(#barLiquid);
  backdrop-filter:blur(8px) saturate(1.7) brightness(1.05) url(#barLiquid);
}
/* 跟手拖拽期间（.dragging）—— 两件事一起做：
   ① 折射关掉：置换图是按"水环在中轴"生成一次的，水环一旦横向移动，图上那圈贴边带
      就与真实轮廓错位，会在栏体中间画出一道假的弯折（用户："折射效果会与下方实时进行
      渲染，这导致能明显看出是外边的框在移动"）。
   ② 壁面从"极淡亮膜"切到 --bar-sheen-solid：拖动中的栏体应当读作**一件实色物体**
      在走（一块磨砂实心玻璃），而不是一片还在折射背后内容的玻璃框。松手后 .dragging
      摘掉、配方淡回，玻璃感恢复 —— "实心 → 重新变透"本身就是松手动画的一部分。
   background-color 带 .24s 过渡，两种配方之间的切换是渐变不是硬切。 */
/* ★ v3.4 修"不跟手"的真凶：`.fab` 自己带 `transition:transform .18s`（按下态那点回弹用的），
   于是跟手时每写一次位移都被它慢慢"追"过去 —— 永远差一截、手感就是"按钮跟我手指脱离"。
   跟手期间（胶囊挂 .dragging）必须关掉这条过渡。 */
.capsule.dragging .fab{transition:none}
.capsule.dragging .bar-glass{
  background-color:var(--bar-sheen-solid);
  -webkit-backdrop-filter:blur(8px) saturate(1.7) brightness(1.05);
  backdrop-filter:blur(8px) saturate(1.7) brightness(1.05);
}
/* ── 本轮删除的两层（保留这段说明，防止以后有人"照着旧结构"再加回来）───────────
   ① .bar-refract（独立折射层）：它的思路是"单独一层带 filter:url(#barLiquid) 去弯折背景"，
      但不论排上排下都必然失效（原因见 .bar-glass 顶上那段）。折射已并入 .bar-glass 的
      backdrop-filter 链，这一层整体删掉。
   ② .bar-edge（沿轮廓的一圈描边 + drop-shadow）：用户连着两轮指它，原话「外边这个多余出来的
      方形框是去不掉了吗」。白色渐变描边在深色半边会变暗，再叠一层柔投影，整圈读起来就是
      "凭空给栏体套了个框"；而且玻璃本身太淡时，那圈线成了唯一可见的东西，更坐实了"框"的观感。
      现在轮廓的"存在感"全部交给「背透 + 边缘弯折 + 下方柔影」三件事，不再画任何线。 */
/* 页签条：只占中间 48px 高那一段（上下包边不属页签区），两页签 flex:1 天然落 25% / 75%。
   top 由 JS 写入 --bar-top：栏体中心固定不动，水环膨胀只向上长，页签因此永远不位移。 */
.tab-strip{position:absolute;left:0;right:0;top:var(--bar-top,10px);height:48px;display:flex;
  /* v2.5：左右各留 20px 内边距 —— 这个数字量的是**按下时那层灰底（＝实际命中区域）**
     到栏体端头的距离：用户说"这个灰色的就是实际按钮面积，那就用这个实际交互面积去算
     距离边框的距离"。两端是 40px 的圆，所以两端留白完全相等。 */
  padding:0 20px;pointer-events:none;z-index:4}
/* 降级：不支持 backdrop-filter → 底弄实，保文字清晰（形状不变） */
@supports not ((-webkit-backdrop-filter:blur(2px)) or (backdrop-filter:blur(2px))){
  .bar-glass{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    background:color-mix(in srgb,var(--bg) 90%,transparent)}
}
/* 降级：用户要更低透明度（无障碍/省电）→ 底弄实 */
@media (prefers-reduced-transparency:reduce){
  .bar-glass{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;
    background:color-mix(in srgb,var(--bg) 90%,transparent)}
}
/* 真 GPU 软渲染：关模糊、底提实（沿用项目 soft-render 约定） */
html.soft-render .bar-glass{
  -webkit-backdrop-filter:none;backdrop-filter:none;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
}
/* 3 个页签等分（flex:1），文字 + 20px 线性图标（复用 .np-ico） */
.tab{
  appearance:none;-webkit-appearance:none;border:0;background:transparent;cursor:pointer;
  pointer-events:auto; /* 胶囊改 none，这里显式接点击 */
  flex:1 1 0;min-width:0;
  display:flex;align-items:center;justify-content:center;gap:6px;
  height:48px;border-radius:9999px;
  color:var(--muted);font:inherit;font-size:13px;font-weight:800;
  transition:color var(--mo-quick) ease,background var(--mo-quick) ease;
}
.tab .np-ico{width:20px;height:20px;flex:0 0 auto}
/* A3 当前页指示：克制。不再铺满半条栏的灰方块 —— 只把图标+文字提到 --fg 满色，
   再在其下加一段很短的下划线小条（明显小于页签格位、不顶到边缘），并加过渡。
   整条栏是连续整体，指示读作「栏的一部分」而非「贴在栏上的另一块」。 */
.tab{position:relative}
/* 本轮修订：连那层 5% 的胶囊底也去掉。它是 flex:1 + radius:9999 的 .tab，所以那一层
   仍然是「半条栏大的一块」—— 用户两轮都在指它（"左边清单上面怎么还有一层方形的东西？
   为什么它还有外框"）。当前页现在只由两件事表达：① 文字/图标提到 --fg 满色；
   ② 下面那根 18×3 的小短杠。整条栏因此是连续一体的，指示读起来是「栏的一部分」。 */
.tab[aria-current="page"]{color:var(--fg)}
.tab::after{
  content:"";position:absolute;left:var(--dot-x,50%);bottom:6px;transform:translateX(-50%);
  width:18px;height:3px;border-radius:2px;opacity:0;
  background:color-mix(in srgb,var(--fg) 55%,transparent);
  /* left 用 --dot-x 而不是 50%：指示条要落在**图标**正下方，不是按钮盒子正中。
     这个值由 syncTabDots() 量出来；left 也参与过渡，切换页签时它跟 opacity 一起动 */
  transition:opacity var(--mo-quick) ease,left var(--mo-base) var(--mo-soft);
}
.tab[aria-current="page"]::after{opacity:1}
/* ★ v5.0 修 bug（用户："你看这两个外边框，这种判定范围都不一样"）：
   全站那圈键盘聚焦环是 `*:focus-visible{outline:2px solid var(--ring)}`，而 outline 会
   **跟着元素盒子**走 —— 同一排四个键，框出来的形状却不一样：
     想法 / 设置是 40×40 的圆形图标键 → 一圈小圆；
     清单 / 统计是 flex:1 的整格（还各带 26px 单边内边距）→ 一大条胶囊。
   一排里两种"高亮范围"，看着就像没对齐。
   改成四个键共用**同一枚 44×44 圆环**，圆心跟着图标（--dot-x，见 syncTabDots）。
   键盘无障碍没有丢：环还在，只是不再是"元素的形状"，而是"图标的形状"。 */
/* ★ 第 3 波（用户截图指着底栏："你这个确实让它变成一个圆了，但是我点一下，你看这个整体
   变灰的，就是有视觉反馈的，仍然是这么大一个区域，还不是一个圆"）：
   聚焦环上一版已经是 44px 圆了，但**按下态的灰罩**还是整格 —— `.tab` 是 flex:1 的整格
   （清单/统计还各带 26px 单边内边距，给中间圆钮让位），直接给它加背景色就是一大条胶囊。
   现在把「按下灰罩」和「聚焦环」都挂到同一枚 `.tab::before` 上：44×44 正圆、圆心跟着图标
   （--dot-x 由 syncTabDots 量出）。四个键的**全部**视觉反馈从此都是同一个圆。 */
.tab::before{
  content:'';position:absolute;left:var(--dot-x,50%);top:50%;
  width:44px;height:44px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:transparent;box-shadow:none;
  pointer-events:none;
  transition:background var(--mo-quick) ease;
}
.tab:active::before{background:var(--tap)}
.tab:focus-visible{outline:none!important}
.tab:focus-visible::before{box-shadow:0 0 0 2px var(--ring);}
/* 按下态：跟全站 .btn:active 同一语言（沉一下）—— 灰罩改由上面那颗圆承担，
   这里不再写 background-image（那就是"一大条胶囊"的来源）。 */
.tab:active{transform:translateY(1px) scale(.96);transition-duration:60ms}

/* v2.5：底栏右端的「设置」入口 + 它的左端占位。
   .bar-gear 固定 36px（不参与 flex:1 等分），只留图标；左端 .tab-pad 等宽，
   所以两个页签的中心仍对称压在中间圆钮两侧。 */
/* v2.5：底栏两端的「设置」入口已经并入 .bar-ico（见上方那段），
   原来「左端等宽假占位 .tab-pad / 右端齿轮 .bar-gear」的写法已删除。 */
/* ★ 第 10 波：原来这条写的是 `{width:14px;bottom:3px}` —— 宽度和偏心都跟另外三个键不一样，
   于是"设置"那条指示条比别的短、还高 3px。现在四个键统一：宽度 18px、位置交给 .tab::after 的 bottom。 */
.bar-gear::after{width:18px}
/* v3.2（用户："清单和统计这两个 UI 按钮距离中间太近"）：两个页签各自往**外**让开 26px ——
   在内侧加内边距（不是移动盒子本身），所以等分布局、两端对称、圆钮位置全都不受影响。 */
/* ★ v5.0 修 bug（用户："点进清单和统计，底下这个灰色小指示条为什么不在图标正下方"）：
   指示条原来是 `.tab::after{left:50%}` —— 按**按钮盒子**居中。
   可这两个页签为了给中间圆钮让位，各带 26px 单边内边距，flex 居中的是**内容盒**，
   两者本就差一截。而且差值**不只是 padding/2** —— gap 和图标尺寸也掺在里面，
   实测差了 10px 而不是 13px，手算一定会偏。
   所以改成：JS 量出图标的真实中心写进 `--dot-x`（见 syncTabDots），
   内边距 / gap / 图标尺寸任何一处再变，指示条都自动跟上。 */
.tab[data-view="list"]{padding-right:26px}
.tab[data-view="stat"]{padding-left:26px}
/* 长按态：两端图标一起退场 —— 那一刻栏体只该有「直接录入 / 进入编辑」两件事。 */
.voice .bar-ico{opacity:0;pointer-events:none;transition:opacity var(--mo-base) ease}

/* 录入圆钮：黑底 + 白图标，直径 56px。**它是嵌在导航栏里的一个普通部件**，不是一个浮在
   栏体之上的悬浮球 —— 这是用户本轮特别强调的一点（"这个按钮是直接嵌套在导航栏的框里边的，
   就像普通的 UI 一样，只不过样式不一样，同时比较大，把导航栏撑大了而已"）。
   所以：投影压到极小（0 2px 6px），让黑圆"落"在栏体里而不是"飘"在上面；
   垂直位置由 --cy-top（栏体中心，由 JS 算出）钉住，**不随水环膨胀上下移动**。
   平面位置：绝对定位挂在栏体水平中轴，不占两个页签的格位。 */
.fab{
  position:absolute;left:50%;top:var(--cy-top,50%);transform:translate(-50%,-50%);
  pointer-events:auto; /* 胶囊改 none，这里显式接点击 */
  width:56px;height:56px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:#070707;color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,.22);
  touch-action:none;            /* 长按要求：别让系统把长按当成滚动/缩放手势抢走 */
  transition:transform var(--mo-quick) ease,box-shadow var(--mo-quick) ease;
  /* 压在材质层(z1)与页签(z4)之上：圆钮是栏体里最上面的一件东西，必须不被玻璃采样、
     也不被页签盖住。.capsule 与 .tabbar 均无 overflow:hidden，投影不会被裁。 */
  z-index:5;
}
/* v2.5：可点热区比视觉大一圈（56 → 72px）。用户反馈"位置太靠下、按的时候不好使"——
   视觉尺寸不动（他明确要求过圆钮不要变大），只把"接得住的区域"往外扩 8px。
   绝对定位的伪元素可以超出父盒并参与命中测试，所以这一圈是**看不见但按得到**的。 */
.fab::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:transparent}
.fab-ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
/* 录入键图标（决定 1）：常态＝「＋」（代表还能打字/手写），长按态＝麦克风（只代表语音）。
   .voice 挂在 capsule 上时切换。两个图标叠放，靠 display 切换，不重排。 */
.fab-ico-mic{display:none}
.voice .fab-ico-plus{display:none}
.voice .fab-ico-mic{display:block}
/* 按下态（单击/长按起手）：沉一下，给"按下去了"的即时反馈 */
.fab.fab-press{transform:translate(-50%,-50%) scale(.92)}
/* 录音态（长按触发）：**圆钮本身不做任何变化**（不放大、不上移、不加色、不加环）。
   历史包袱都清掉了：曾有一圈 scale(2.2) 的 accent 蓝扩散环（.fab-ring，外径实测 185px ≈
   栏高 3 倍，垂出栏体糊掉轮廓）、一轮 3px accent 蓝圈、一圈独立的磨砂水环（.fab-halo）、
   以及圆钮外圈的暖黄/绿方向光晕（.fab-glow，用户原话"太丑了，根本看不了"）。
   现在"在录音"这件事完全由栏体自己表达：栏内两半化身 + 水波在栏体里传播 +
   栏体轮廓膨胀出环形 + 越界侧玻璃流动（.bar-flow）+ 变灰 + 震动。
   也就是说，圆钮和栏体是**同一件东西**在动，而不是两个图层各动各的。 */
.fab.fab-rec{transform:translate(-50%,-50%)}

/* 深色模式：黑圆钮(#070707) 与深色栏体(--bg #050505) 亮度几乎一致，圆读不出来。
   给一圈极淡白描边（复用 --glass-hi），让圆钮在深色下仍是清晰的圆。仅深色生效。 */
html[data-theme="dark"] .fab{
  box-shadow:0 0 0 1px color-mix(in srgb,var(--glass-hi) 24%,transparent),0 2px 6px rgba(0,0,0,.5)}

/* ==========================================================================
   长按语音 / 跟手手势 + 顶部图标行（第二批新增，整段可独立回滚）
   -------------------------------------------------------------------------
   长按圆钮：起手"波动一下" + 轻震 → 进入长按态（全屏变灰、圆钮放大、两侧页签被"吸进"
   中间、上方浮现弧形双区窗口）。按住跟手滑动、松手才生效；位移 > 60px 选中一侧，
   左＝直接录入、右＝进入编辑、不足或居中＝取消。
   全程只动 transform / opacity（不碰 width/height/top/left，避免重排）；
   prefers-reduced-motion 下全局规则已把过渡关掉，这里切状态即终态、无补间。
   ========================================================================== */
/* 全屏变灰遮罩：盖住页面内容，但 z-index 低于底栏(80)与弧形窗口(90)，
   所以圆钮和弧形窗口仍浮在它之上。颜色用 --fg（浅色近黑、深色近白），两种主题都"灰"得出来。 */
/* v3.23（用户："语音输入时，导航栏之外界面还是模糊一些吧"）：
   这层遮罩**不再变灰**，改成**模糊** —— 底栏保持清晰（它在 z-index:70 之上），
   只把后面的页面推到焦外，长按说话时视线自然落到"嘴"和底栏上。 */
.voice-dim{position:fixed;inset:0;z-index:70;background:transparent;opacity:0;pointer-events:none;
  transition:opacity var(--mo-base) ease;
  -webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);
  transition:opacity var(--mo-base) ease,-webkit-backdrop-filter var(--mo-base) ease,
             backdrop-filter var(--mo-base) ease}
.voice-dim.on{opacity:1;
  -webkit-backdrop-filter:blur(7px) saturate(1.08);backdrop-filter:blur(7px) saturate(1.08)}
/* ⚠️ 以下是**已拆除**的「弧形双区窗口」的原始描述，保留只为查档；代码已删（见下一段）。
   原设计：一条横置的椭圆（上下两条边都是弧），中间一条细缝分成左右两区。
   父级 overflow:hidden + border-radius:50% 把两个半区的矩形边缘裁成弧。
   高度 118px（不是 104）：里面要走**两条真正带弧度的文字线**（上弧＝状态、下弧＝识别文字），
   104px 装不下明显弧度，读数看着就成了一条水平文字块（用户原话："我不是说让你弄成
   圆弧线条状的吗"）。浮现只走 opacity + transform（上浮 18px + 放大 .9→1）。 */
/* ── 本轮删除：上方那个"弧形双区大白框"（.voice-arc + .va-* 整套）──────────────
   用户原话：「我长按的时候，你上面那个就不需要弄了。上面这个向左滑和向右滑选择的大白框
   就不需要了」。所以长按态**不再有浮在页面上方的任何框/窗**：方向提示与识别文字都回到
   导航栏自己去表达（见下方 .bar-words / .bar-heard），导航栏之外一个元素都不加。 */
.va-removed{display:none}
/* 长按起手的水波纹（A2a）：一道波从圆钮中心向两侧荡开。
   关键在于它被 clip-path 裁进**栏体自己的轮廓**里 —— 所以它读起来是"在玻璃里传播的一道波"，
   而不是套在圆钮外面的一个圈。上一版那种"一个圆片和一个条放到一块儿"的观感，正是因为
   水环是画在栏体之外的（.fab-halo 那圈独立的圆），跟栏体毫无关系。现在圆钮与栏体是同一件
   东西在动：波在栏体内部传播，栏体轮廓自己往外膨胀。 */
.voice-ripple{position:absolute;inset:calc(-1 * var(--over));z-index:2;pointer-events:none;opacity:0;
  clip-path:url(#barClip);-webkit-clip-path:url(#barClip);
  transition:opacity var(--mo-quick) ease}
.voice-ripple i{position:absolute;left:calc(50% + var(--fabdx,0px));
  top:calc(var(--cy-top,50%) + var(--over));width:56px;height:56px;border-radius:50%;
  transform:translate(-50%,-50%) scale(.4);
  background:radial-gradient(circle, color-mix(in srgb,var(--fg) 24%,transparent) 0,
    color-mix(in srgb,var(--fg) 9%,transparent) 44%, transparent 66%)}
.voice .voice-ripple{opacity:1}
.voice .voice-ripple i{animation:voiceRipple 640ms var(--mo-soft)}
@keyframes voiceRipple{0%{transform:translate(-50%,-50%) scale(.4);opacity:.9}
  100%{transform:translate(-50%,-50%) scale(3.4);opacity:0}}
/* ── 本轮删除：圆钮周边那圈独立的"磨砂水环"（.fab-halo）────────────────────
   它是一圈叠在栏体之上、比栏体高出一截的玻璃圆环。用户一眼看穿："长按按钮后，周围确实围了
   一圈，但这相当于只是把一个圆片和一个条放到一块儿了而已。我的意思是，这两个元素要在同一个
   图层里，并且是可以相互干扰的。"
   现在这件事改由**栏体自己的轮廓**承担：长按时轮廓的包边宽度（--wrap）从 6px 膨胀到
   --wrap-max，即栏体自己鼓起一圈水环再收回（见 swellRing），这才是"同一图层、相互干扰"。 */
/* ── 本轮删除：圆钮外圈的"方向微光"（.fab-glow）────────────────────────────
   用户原话：「算了，别出现那种颜色光晕了，太丑了，我操，你做的根本看不了。」
   整层删除（CSS + DOM 里的 <span class="fab-glow"> + JS 的挂类逻辑）。
   方向的表达改由下面这层「流动」承担 —— 不是给按钮加色，而是让**已选中那一半的
   玻璃自己开始流动**，像液面被拨动。 */
/* 流动层（LiquidLogo 式观感，但不引入 WebGL —— 底栏是 position:fixed 的小元素，
   滚动列表时 backdrop-filter 每帧都在重算，再叠一个流体仿真必然掉帧）。
   做法：玻璃里嵌几道**柔光带**，沿运动方向无限漂移；光带被 barClip 裁进栏体轮廓，
   所以读起来是"玻璃内部在流动"，不是"贴了张动图"。
   实现要点：
   ① 每半边一条轨道（.bf-l / .bf-r），只在那一侧被选中时淡入（side-l / side-r 驱动）；
   ② 光带的 repeating-linear-gradient 周期 = 60px，动画位移也精确 = 60px
      （一个周期），所以无限循环**无缝**——不依赖元素宽度，不会在循环点跳一下；
   ③ 轨道整体 rotate(-18deg)：光带横着生成、斜着摆放，斜向流动比水平"传送带"自然；
   ④ 只动 transform（合成器动画，零重排）；prefers-reduced-motion 下全局规则会
      把 animation 关掉 → 光带静止，再由下面那条 display:none 彻底收掉。 */
.bar-flow{position:absolute;inset:calc(-1 * var(--over));z-index:2;pointer-events:none;
  clip-path:url(#barClip);-webkit-clip-path:url(#barClip);overflow:hidden;
  /* 流光必须**带色**：纯白亮膜压在纯白页面上等于没有 —— 这正是"导航栏这么平"的
     物理原因之一（壁面只能靠背透，白底上背透也是白）。冷蓝/紫/粉取自同源的
     --refraction-* 五色球（只是把 alpha 提上来让它真的看得见），加一道白高光当骨。 */
  --lq-1:rgba(71,169,255,.55); --lq-2:rgba(153,111,255,.48);
  --lq-3:rgba(255,108,174,.42); --lq-w:rgba(255,255,255,.85)}
.bf{position:absolute;top:0;bottom:0;overflow:hidden;
  opacity:0;transition:opacity var(--mo-base) ease}
/* 分界 = 按钮当前的位置（用户："以这个按钮的位置为分界，它左边的就变成流光效果"）：
   --fabdx 由 setFabVoice 逐帧写入 → 左块宽度 = 中轴 + 按钮偏移、右块 = 中轴 − 按钮偏移。
   只改宽度不改 DOM 顺序，跟手是连续的，不会跳。 */
/* 两侧之间必须是**渐变**、不能是一条直线切开（用户原话："我想要的流光效果，跟另一边的普通
   效果之间的过渡应该是渐变的，而不是直接用一条线去过渡"）→ 给两块各加一条朝分界方向的
   mask 渐隐（最后 34px 淡出），于是流光自然"化"进普通玻璃里。 */
.bf-l{left:0;width:calc(50% + var(--fabdx,0px));opacity:var(--flow-l,0);
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 34px),transparent 100%)}
.bf-r{right:0;width:calc(50% - var(--fabdx,0px));opacity:var(--flow-r,0);
  -webkit-mask-image:linear-gradient(270deg,#000 0,#000 calc(100% - 34px),transparent 100%);
  mask-image:linear-gradient(270deg,#000 0,#000 calc(100% - 34px),transparent 100%)}
/* --flow-* 在 setFabVoice 里按 |off| / SAFE_ZONE 渐变（0→1）→ **跟手就亮**，
   不必等到越界；越界（side-l / side-r）之后再锁到满值。
   方向语义仍由 SAFE_ZONE 决定（安全范围内不算方向），变的只是视觉出现得早。 */
.voice.side-l .bf-l{opacity:1}
.voice.side-r .bf-r{opacity:1}
.bf i{position:absolute;left:-40%;width:200%;top:-70%;height:240%;
  display:block;transform:rotate(-18deg);filter:blur(9px) saturate(1.5);
  /* v3.2：光带从"细条纹"改成**宽幅流光**（一个周期 130px、色带之间互相叠色），
     更接近 LiquidLogo 那种大块的流动反光，而不是几根细线扫过去。
     周期(130) 必须等于动画位移(130)，无限循环才无缝。 */
  background:repeating-linear-gradient(100deg,
    transparent 0 10px,
    var(--lq-1) 34px,
    var(--lq-w) 56px,
    var(--lq-2) 78px,
    var(--lq-3) 100px,
    transparent 130px)}
/* 常驻流水（本轮新增）：长按期间**整条栏体**始终有一层缓慢漂移的流光。
   之前只有越界那一侧才动、其余时间栏体完全静止 —— 用户："不要这么平"。
   强度刻意压到 .32：越界侧（--flow-l / --flow-r）是 1，两者要拉开差距，
   否则"以按钮为分界、左边变右边不变"这条诉求就糊了。周期 = 124px = 位移量，无缝循环。 */
.bf-idle{left:0;right:0}
.voice .bf-idle{opacity:.45}
.bf-idle i{filter:blur(12px) saturate(1.4);transform:rotate(-12deg);
  background:repeating-linear-gradient(100deg,
    transparent 0 20px,
    var(--lq-1) 56px,
    var(--lq-2) 96px,
    transparent 150px)}
.bf-l i{animation:flowL 2.4s linear infinite}
.bf-r i{animation:flowR 2.4s linear infinite}
.bf-idle i{animation:flowIdle 4.6s linear infinite}
@keyframes flowL{from{transform:rotate(-18deg)}to{transform:rotate(-18deg) translateX(-130px)}}
@keyframes flowR{from{transform:rotate(-18deg) translateX(-130px)}to{transform:rotate(-18deg)}}
@keyframes flowIdle{from{transform:rotate(-12deg)}to{transform:rotate(-12deg) translateX(-150px)}}
@media (prefers-reduced-motion:reduce){
  .bar-flow{display:none}
}
/* 栏内两端的"化石"：左端＝直接录入、右端＝进入编辑。文字保持中性（与页签同一套灰阶）——
   用户明确要求「字还是那种白色或者灰色的」，方向不加在任何文字上；
   方向的表达是越界侧玻璃的"流动"（.bar-flow），不是颜色。
   两个词各自贴住栏体两端，中间留出一整块空档（空档里是黑圆钮）。
   退回时的过冲见下面 settleL / settleR。 */
.bar-words{position:absolute;left:0;right:0;top:var(--bar-top,10px);height:48px;
  display:flex;pointer-events:none;z-index:4;padding:0 28px;
  opacity:0;transition:opacity var(--mo-base) ease}
.voice .bar-words{opacity:1}
.bar-words span{flex:1;display:flex;align-items:center;
  font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--fg);white-space:nowrap;
  /* v2.5：两个词**永不位移、永不缩放**（用户："不要让它们变动，正常固定在一个合适的距离
     即可"，内边距同时从 24px 放宽到 28px，别再贴着边框）。
     方向只由两件事表达：① 越界那一侧玻璃的流光 ② 被逼近的那一侧**变淡**，
     圆钮压到字上时直接消失 —— --wl-o / --wr-o 由 setFabVoice 逐帧写入（常态 .62）。 */
  opacity:var(--wl-o,.62);transition:opacity 120ms linear}
.bar-words .bl{justify-content:flex-start;opacity:var(--wl-o,.62)}
.bar-words .br{justify-content:flex-end;opacity:var(--wr-o,.62)}
/* 识别到的文字（用户问：「如果我语音输入之后，显示所输入文本的样式是怎么样的？」）
   —— 就是这一行。它不是一个框：**没有底、没有描边、没有模糊、没有弧形窗口**（那个大白框
   按用户要求整块拆了）。它只是栏体正上方一行字，落在栏体与圆钮的上方那一小段空处，
   居中、单行、超长省略号截断，颜色与页签同一个中性灰系（略亮，因为它是"正在发生的事"）。
   没有识别到内容时它是空的、完全不显示。 */
.bar-heard{position:absolute;left:50%;bottom:100%;margin-bottom:24px;
  transform:translateX(-50%);max-width:min(320px,88vw);
  pointer-events:none;z-index:6;opacity:0;
  transition:opacity var(--mo-base) ease}
/* v3.3：长按态就显示这一行 —— 没有识别文字时它是**「说什么」的录入提示**
   （用词/语序教用户怎么讲，识别才准），有文字时换成识别结果。
   上边距从 7px 提到 24px：给下面那行极小的「上滑取消」让出位置。 */
.voice .bar-heard{opacity:1}
/* 提示态（还没有识别文字）：小一号、弱一档 —— 一眼能分出"这是例子"和"这是我说的话"。
   ★ v3.37 两个真 bug 一起修：
   ① 这个状态类原来叫 `hint`，而本文件里**早已有一个全局的 `.hint`**（录入页那个
      「写法提示」<details>，定义是 `.hint{padding:0;overflow:hidden}`）。类名一撞，
      长按说话的瞬间 capsule 就吃到了 `overflow:hidden` —— 而 `.bar-heard` 是**挂在栏体
      上方、在盒子外面**的一行（`bottom:100%`），于是它被自己的父级裁掉：
      实测 `elementFromPoint(那行字的中心)` 命中的是 BODY，字根本没画出来。
      这正是用户连着两轮说的"语音输入的录入提示还是没有"。
      顺带被裁掉的还有 `.bar-glass` / `.voice-ripple` / `.bar-flow` 的 overscan
      （inset:-18px，全在盒子外面）—— 那圈壁厚与水环的上半截一直是被切平的。
      改名为 `say-hint`，与全局 `.hint` 彻底脱钩，并在这里把选择器写成"胶囊为祖先"。
   ② 原来的选择器 `.bar-heard.hint span` 要求 `.hint` 和 `.bar-heard` 在**同一个元素**上，
      而类其实挂在 capsule 上（父级）—— 所以提示态的字号/灰阶从来没生效过。
      现在写成 `.say-hint .bar-heard span`，语义与挂类位置一致。 */
.say-hint .bar-heard span{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--muted);opacity:.9}
/* v3.3 新增（用户："上滑取消要做成特别特别小的灰色小字，悬浮在录入键正上方，
   同时也是导航栏的正上方"）：11px、最淡一档灰、无底无框，长按态才出现。 */
.bar-uptip{position:absolute;left:50%;bottom:100%;margin-bottom:4px;
  transform:translateX(-50%);font-size:11px;font-weight:600;letter-spacing:.04em;
  color:var(--faint);white-space:nowrap;pointer-events:none;z-index:6;
  opacity:0;transition:opacity var(--mo-base) ease}
.voice .bar-uptip{opacity:1}
.bar-heard span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:13.5px;font-weight:800;letter-spacing:.01em;text-align:center;
  color:var(--fg);opacity:.9}
/* v2.5 上滑取消：那一行识别文字整条**发红光**（用户："整个气泡就发一些红光、带有红色光晕"）。
   只加柔光和文字辉光，不加边框 —— 一加边框就又变成他连着两轮骂过的"方框"。
   红光也是"松手就真取消"的预告：进入待取消态即亮，滑回去即灭。 */
.voice.cancel-armed .bar-heard{opacity:1}
.voice.cancel-armed .bar-heard span{
  color:var(--danger);
  padding:5px 12px;border-radius:14px;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--danger) 30%,transparent) 0,transparent 82%);
  text-shadow:0 0 10px color-mix(in srgb,var(--danger) 70%,transparent),
              0 0 22px color-mix(in srgb,var(--danger) 40%,transparent);
  transition:color var(--mo-quick) ease,text-shadow var(--mo-quick) ease;
}
/* 两侧页签：**先分出来、再融进去**。用户逐帧描述过这两段：
   「长按按钮时，显现一道水波纹，把左右两边的清单和统计**分出来，融到里面**」。
   所以这里必须用两段关键帧，不能是一条单向过渡（单向过渡只有"消失"，没有"分出来"）：
     0%   原位
     22%  先往外让开一点点（分出来，同时略放大、更实）
     100% 收回中线、缩小、糊掉（融进去）
   fill:both 停在末态；松手时摘掉 .melt-*、换上 .settle-* 反向播回（带一点向外过冲）。 */
@keyframes meldL{0%{transform:none;opacity:.62;filter:blur(0)}
  22%{transform:translateX(-7px) scale(1.05);opacity:.7;filter:blur(0)}
  100%{transform:translateX(46px) scale(.34);opacity:0;filter:blur(5px)}}
@keyframes meldR{0%{transform:none;opacity:.62;filter:blur(0)}
  22%{transform:translateX(7px) scale(1.05);opacity:.7;filter:blur(0)}
  100%{transform:translateX(-46px) scale(.34);opacity:0;filter:blur(5px)}}
.tab.melt-l{animation:meldL .42s var(--mo-soft) both}
.tab.melt-r{animation:meldR .42s var(--mo-soft) both}
/* 退回时的"分开一些"（用户：「水一样融了过来，然后又分开，一分开要分开一些」）：
   摘掉 .melt-* 后不是直线归位，而是先从熔融态回到原位、**再往外多张开一点**（-9px / +9px 的
   过冲），最后落回。两片像水一样从中间"弹开"。只动 transform/opacity/filter，不重排。 */
@keyframes settleL{0%{transform:translateX(46px) scale(.34);opacity:0;filter:blur(5px)}
  58%{transform:translateX(-9px) scale(1.06);opacity:1;filter:blur(0)}
  100%{transform:translateX(0) scale(1);opacity:1;filter:blur(0)}}
@keyframes settleR{0%{transform:translateX(-46px) scale(.34);opacity:0;filter:blur(5px)}
  58%{transform:translateX(9px) scale(1.06);opacity:1;filter:blur(0)}
  100%{transform:translateX(0) scale(1);opacity:1;filter:blur(0)}}
.tab.settle-l{animation:settleL .34s var(--mo-soft) both}
.tab.settle-r{animation:settleR .34s var(--mo-soft) both}
/* A4（本轮加强）：切换布局的过渡 —— 「分区 ⇄ 时间轴」和「统计的横条 ⇄ 方块」共用同一条。
   上一版只给 #view 加了一条 7px / 0.24s 的微动画，根本看不出来（用户："为什么还是没有动画"）。
   真正的原因是 refresh() 收尾会把 ANIM 置 false，切换布局重建出来的内容**不带任何入场类**，
   所以只有那点微动画在动，视觉上等于没有。现在改成明确的两段式：
   .swap-out 先把旧内容淡出（130ms）→ 换内容 → .swap-in 让新内容淡入（300ms）。
   只动 opacity / transform；且作用在 #view 的**直接子元素**上，不给 #view 自身加 transform
   —— 否则 #view 会变成内部 position:fixed 元素的包含块。 */
@keyframes swapIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes swapOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-7px) scale(.99)}}
#view.swap-in > *{animation:swapIn .30s var(--mo-soft) both}
#view.swap-out > *{animation:swapOut .13s ease both;pointer-events:none}
/* prefers-reduced-motion 下全局那条 !important 规则会把上面两条一起关掉 → 直切，正合预期 */
/* 长按起手"波动一下"：scale 1 → 1.14 → 1（只这一段用 animation，不碰 transition） */
@keyframes fabPulse{0%{transform:translate(-50%,-50%) scale(1)}
  40%{transform:translate(-50%,-50%) scale(1.14)}100%{transform:translate(-50%,-50%) scale(1)}}
.fab.fab-pulse{animation:fabPulse 320ms var(--mo-soft)}

/* 底栏两端的图标键（v2.5 定稿）：左＝外观、右＝设置，**同款同尺寸、只有图标没有文字**。
   用户原话："不用像清单和统计那样弄字体了，直接像设置一样弄个图标，这样也平衡"。
   它不是 .theme-fab 那种独立浮层了 —— 它长在 .tab-strip 里，是栏体的一部分。
   尺寸取正方的 40×40 + border-radius:50%：按下时露出的那层灰底就是它的**命中区域**，
   用户明确要求"不要像圆角矩形，直接变成圆形" → 盒子必须等宽等高，否则 36×48 的盒子
   即使 radius:9999px 也只是个胶囊。 */
.bar-ico{
  flex:0 0 40px;width:40px;height:40px;align-self:center;border-radius:50%;
  color:var(--muted);
  display:flex;align-items:center;justify-content:center;
}
/* ★ 第 10 波（用户："底下这个灰色的指示条，跟其他那个高低都不一样，就这个想法……
   底下的距离都不一样"）：底栏四个键里，`.bar-ico`（想法 / 设置）是 40×40 的方盒、
   `.tab`（清单 / 统计）是 48px 高 —— 而"当前页"那根指示条是用 `bottom:6px` 贴着**各自的盒子底**
   定位的，盒子不一样高，条就不在一条水平线上（差 4~5px，电脑上看得很清楚）。
   修法：让**底栏里**的 `.bar-ico` 跟 `.tab` 一样高（48px），图标照旧居中对齐、
   按下/聚焦那颗 44px 圆也照旧（它挂在 ::before 上，与盒子形状无关）。
   ⚠️ 只限 `.tab.bar-ico` —— 工具栏那颗「?」帮助键也用 .bar-ico，它不是页签，尺寸不能跟着变。 */
.tab.bar-ico{height:48px}
.bar-ico .np-ico,.bar-ico svg{width:19px;height:19px;fill:none;stroke:currentColor;
  stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.bar-ico:hover{color:var(--fg)}
/* 外观键不是「一页」，所以不画当前页那条短线；设置键是页面，保留它。 */
#themeFab::after{display:none}
/* 外观三档图标：只显一枚。由 html[data-mode]（= S.theme 档位，applyTheme 写入）决定，
   所以"跟随系统"也能和"浅色"区分开 —— 不会三档都长一样。 */
#themeFab .ti{display:none}
#themeFab .ti-auto{display:block}          /* 无 data-mode 时的兜底 */
html[data-mode="light"] #themeFab .ti-auto,
html[data-mode="dark"]  #themeFab .ti-auto{display:none}
html[data-mode="light"] #themeFab .ti-sun{display:block}
html[data-mode="dark"]  #themeFab .ti-moon{display:block}
/* ★ v3.50（用户："把外观直接替换掉，不需要了，反正放在设置里就行"）：
   底栏左端那枚「外观」键撤掉，位置让给「想法」页。外观三档改在设置页里选。
   留下的这两条规则**刻意保留**（.bar-ico 仍是底栏图标键的通用样式，#themeFab 已无元素），
   删掉反而要连 .bar-ico 一起动，风险不值当 —— 它们是空转规则，不会命中任何元素。 */
/* 想法键（v3.50）：它是**一页**，所以按 .tab 那套走（aria-current 靠 refresh 同步），
   但外形用 .bar-ico 那套圆形图标键 —— 和右端齿轮同款同尺寸，两端对称。
   当前页那条短线仍要画（它是页，不是功能键），所以不套 #themeFab::after 的隐藏规则。 */
.tab.bar-ico.seed-tab .np-ico{width:19px;height:19px}
.tab.bar-ico.seed-tab{position:relative}
/* ★ v5.0 修：想法键原来单独写了一条 `color:var(--accent)`，于是它选中时是**蓝色**，
   而清单/统计选中时是 `--fg`（近黑）—— 同一个底栏里两套"选中"语言，看着像不一致。
   现在这条删掉，让它统一继承上面 `.tab[aria-current="page"]{color:var(--fg)}`。
   将来也别再给单个页签单独上色：选中态是全栏唯一的语言。 */
/* v3.2（用户："顶部的布局感觉不好看，'今天要做什么'这些内容能不能直接放在背景上，
   或者做虚化处理？"）：文字**仍然直接放在页面上**（不加卡片、不加框、不加底），
   但把**背后的彩色光斑虚化**掉 —— 一层带径向遮罩的 backdrop-filter，四周完全羽化，
   所以它读起来是"背景被柔化了"，而不是"又多了一块面板"。 */
.hero,.section-intro{position:relative}
/* ★ v3.37（用户："它还是能上下滑动，甚至还能左右滑动…左右滑的时候底下也有那个灰色的拖动条"）：
   真凶就是这一条 `inset:-16px -22px`。`.section-intro` 的外层 `.pdaim-section` 是
   `width:calc(100% - 36px)` —— 左右各留 18px；而这块柔光背板往两侧各探 22px，
   于是它右边比视口多出 22−18 = **4px**，页面就真的能横向滚 4px
   （实测：393px 宽下 `scrollLeft` 能设到 4，`de.scrollWidth` 397）。
   浏览器里 4px 看不出来，但在 App 里 WebView 会因此画出横向滚动条、手指还能把页面拖歪。
   改成 −16px：小于 18px 的留白，任何宽度下都探不出视口。
   同一个坑以后别再踩 —— 见下面 html{overflow-x:hidden} 那道总闸。 */
.hero::before,.section-intro::before{
  content:'';position:absolute;inset:-16px -16px;z-index:-1;pointer-events:none;border-radius:28px;
  -webkit-backdrop-filter:blur(16px) saturate(1.05);
  backdrop-filter:blur(16px) saturate(1.05);
  -webkit-mask-image:radial-gradient(125% 105% at 50% 50%,#000 40%,transparent 76%);
  mask-image:radial-gradient(125% 105% at 50% 50%,#000 40%,transparent 76%);
}
/* 软件渲染 / 低端机：这条虚化关掉（它在滚动时每帧都要重算） */
html.soft-render .hero::before,html.soft-render .section-intro::before{
  -webkit-backdrop-filter:none;backdrop-filter:none;background:none;
}
/* 仅供读屏播报、视觉隐藏（无障碍友好提示用） */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* 录入界面吸顶录入条要让出顶部安全区（顶栏已撤，不再需要那 44px） */
body[data-view="entry"] .capture-wrap{top:env(safe-area-inset-top)}

/* ---------- ★ v3.50 想法页（随手记 / 种子） ----------
   种子的形状和待办不同，所以这里是一套自己的皮肤。全部用页面既有 token
   （--bg / --panel-solid / --accent / --mo-soft），不引入新颜色、新字体。
   ⚠️ 浮层铁律（本项目踩过）：凡是浮在内容之上的层必须实底，不许靠 backdrop-filter 兜底。
   这里的 .merge-bar 是浮层，所以底色写实值 --panel-solid，不写半透明。 */
/* ★ 本轮（用户："想法界面的卡片明显比清单页窄，清单页卡片离屏幕边缘更近"）：
   想法页这一整组块的**宽度基准改了**。原来它们各写 `min(1240px,calc(100% - 36px))`，
   而父级 `.pdaim-section` 已经是 `calc(100% - 36px)` —— 两层各扣 18px，
   想法卡左右各让 36px，清单页的 `.zone` 只让 18px，于是同一台手机上两张卡差了 36px 宽。
   现在统一 `width:100%`：宽度基准只由 `.pdaim-section` 一处决定（这也是本项目
   "同一件事只能有一个真相源"的老规矩）。
   gap 10 → 8：给「＋新想法 / 多选 / 视图开关 / 手势说明」腾出一行放得下的余量。 */
.idea-toolbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  /* ★ 本轮（用户："想法这两个字最底下的边缘，跟新想法/多选/视图转换这些框离得非常近"）：
     实测确认了 —— 把「解释文案」关掉时（body[data-help="off"] 会隐藏 .intro-note），
     大标题的字形下沿在 y=149，而工具条上沿在 y=141，**压了 8px**（大标题 line-height:.9，
     字形会溢出自己的行盒）。原来工具条上外边距是 0，全靠那段解释文案撑着间距。
     现在给它固定 26px 上边距：文案开着 → 保留原有呼吸；关掉 → 与标题字底至少 18px。 */
  margin:26px auto 18px;width:100%;
}
.idea-toolbar .len{font-size:12px;color:var(--faint);letter-spacing:.06em}
.idea-toolbar .btn{flex:0 0 auto}
/* ★ 本轮（用户："你这个'新想法'这三个字怎么还没去？'多选'这两个字也没去"）：
   这两颗键去掉文字，只留图标 —— 跟底栏导航、视图开关同一套"图标即语义"，
   文字交给 aria-label / title（读屏和长按提示都还在）。
   方框 40×40 正圆 + flex 居中：图标 17px，上下各留 11.5px。
   ⚠️ 上一轮用户就先警告过"把界面文字去掉之后，那个图标的下边缘会离框太近" ——
   所以居中必须是 flex 算出来的，不能用行高/基线对（文字一走，基线对齐就会偏低）。 */
.idea-toolbar .btn.key{
  display:inline-flex;align-items:center;justify-content:center;
  padding:0;width:40px;height:40px;border-radius:50%;
}
.idea-toolbar .btn.key .btn-ico{width:17px;height:17px;stroke-width:1.8}
.btn-ico{width:14px;height:14px;flex:0 0 auto;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* 本轮起 `.idea-toolbar .idea-new{margin-right:0}` 这条规则删除 —— 那两颗键换成 SVG 后
   类名已无人使用，空转规则不留（本项目的规矩：改样式前先数一遍同一选择器的定义次数）。 */
/* ★ v5.0：多选挪到左边跟「新想法」并排后，靠视图开关自己撑开左边距来分组 ——
   左组（新想法 / 多选）贴左，右组（视图开关 / 手势说明）贴右。 */
.idea-toolbar .idea-seg{margin-left:auto}
/* ★ v5.0：想法页自己的搜索条与标签筛选（不共用清单页那套全局状态） */
.idea-searchbar{width:100%;margin:0 auto 10px}
.idea-searchbar .search{width:100%}
.idea-filters{
  display:flex;flex-wrap:wrap;gap:6px;
  width:100%;margin:0 auto 14px;
}
.idea-filters .pill{padding:5px 12px;font-size:12px}
/* ★ v5.0：老数据的「考虑区」搬家提示（一次性，搬完就不出现）。
   底色必须实底 —— 本项目浮层/提示条禁止靠 backdrop-filter 提供可读性（见坑记录）。 */
.consider-migrate{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  width:100%;margin:0 auto 14px;
  padding:12px 14px;border-radius:16px;
  background:var(--panel-solid,var(--bg));border:1px solid var(--line,var(--pill));
  font-size:13px;line-height:1.5;color:var(--fg);
}
.consider-migrate .btn{margin-left:auto;flex:0 0 auto}

/* ---------- ★ v5.0 想法回顾抽屉 ----------
   位置必须**在列表上方**：放底部就没人滚得到，等于没有。
   默认开合由使用频率决定（见 reviewDrawerHTML / reviewDaysSinceUse），不写死。 */
.review-drawer{
  width:100%;margin:0 auto 14px;
  border-radius:16px;overflow:hidden;
  background:var(--panel-solid,var(--bg));border:1px solid var(--line,var(--pill));
}
.review-head{
  display:flex;align-items:center;gap:8px;width:100%;
  border:0;background:none;padding:12px 14px;cursor:pointer;
  color:var(--fg);font-family:inherit;font-size:14px;font-weight:700;text-align:left;
}
.review-head .rh-chev{color:var(--faint);font-size:12px;display:inline-block;
  transition:transform var(--mo-base) ease}
.review-drawer.open .review-head .rh-chev{transform:rotate(90deg)}
.review-head .rh-t{flex:1}
.review-head .rh-n{
  min-width:20px;height:20px;padding:0 6px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:11px;line-height:20px;text-align:center;
}
.review-body{padding:0 14px 14px;display:grid;gap:10px}
.review-note{margin:0;font-size:12px;line-height:1.6;color:var(--faint)}
.review-item{
  padding:10px 12px;border-radius:14px;
  background:var(--bg);border:1px solid var(--line,var(--pill));
}
.ri-why{font-size:11px;color:var(--accent);letter-spacing:.02em}
.ri-title{font-size:14px;font-weight:600;color:var(--fg);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-sub{font-size:11px;color:var(--faint);margin-top:2px}
.ri-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.review-foot{display:flex;gap:8px;flex-wrap:wrap}
.review-foot .btn{flex:0 0 auto}
.idea-list{display:grid;gap:14px;width:100%;margin:0 auto}
/* ★ 第 2 波（用户："这个分割线还有这个二也不需要了"）：`.idea-used-head`（分隔线 + 条数）
   整条规则删除，DOM 里也不再生成了 —— 不留没人用的死样式。
   两组之间只靠这一条上外边距分开（收起来的卡片本身是暗的，边界看得见）。 */
.idea-list.used{margin-top:26px}
.empty-soft{
  width:100%;margin:0 auto 6px;
  font-size:12px;color:var(--faint);text-align:center;
}
/* 想法卡：**不带勾选框那套 lead 布局**时也要好看，所以 seedHTML 里 .lead 只有一颗按钮。
   .ic-body 让 seedHTML 产出的 .item 直接铺满卡内，不再套一层玻璃。
   ★ 本轮（用户："卡片太靠右 / 左边那个点放靠左一些 / 时间太长了，正文被挤太右"）：
   左右内边距 16 → 12，"脊椎"起点 18 → 12，日期列不再吃 44px 的最小宽度。见下面三条。 */
.idea-card{padding:0;overflow:hidden}
.idea-card .ic-body > .item{border:0;background:none;box-shadow:none;margin:0;width:100%}
/* 「用过了」的变暗样式统一放在下面 `.idea-card.sleep` 那条之后 ——
   两条规则同权重，靠**源序**分胜负；写在这里会被后面的 .sleep 盖掉
   （一条既"用过了"又"沉睡"的卡片就会只按沉睡显示，暗得不够）。 */
.idea-card.used{}
/* 种子自己的条目皮肤：不用待办那条横排（点/勾/标题），改成竖排的"脊椎 + 步骤"。
   .lead 只放那一颗按钮，固定在左上。
   ★ 第 4 波（用户："每个卡片上字体与卡片上边缘、跟卡片下边缘的距离也不相等"）：
   原来下边距是 6px，但卡底还压着一行"长按说明"（默认隐藏却仍占 18px 高度）+ 它的上下外边距，
   实测下半身比上半身多出 20 多像素。那行说明整块删掉（见 seedHTML 与 .seed-acts 的删除），
   上下内边距改成对称的 14px。 */
.item.seed{padding:14px 12px 14px;align-items:flex-start}
.item.seed .lead{flex-direction:column;gap:8px;padding-top:1px}
/* ★ v5.1.2（用户："关于下一级想法的展开和收起，这个标就不要放在左边了，
   把它放在左边灰色的指示线上吧"）：折角键不再是左边那一列里的方钮，改成**竖线上的小圆珠**
   —— 绝对定位在 .spine 上（left:2px 让 18px 的圆珠中心正压在那条 11px 的线上），
   实底背景把线断开，看起来就是线的端点，也是"下面还挂着 N 条"的开关。
   收起态显示 ▸、展开态 ▾（和原来同一个字形，只是换了位置）。 */
.item.seed .spine .fold{
  position:absolute;left:2px;bottom:-2px;z-index:1;
  width:18px;height:18px;padding:0;border-radius:50%;cursor:pointer;
  display:flex;align-items:center;justify-content:center;line-height:1;font-size:10px;
  background:var(--panel-solid,var(--bg));border:1px solid var(--line,var(--pill));
  color:var(--faint);transition:color var(--mo-fast) ease,border-color var(--mo-fast) ease;
}
@media (hover:hover){ .item.seed .spine .fold:hover{border-color:var(--fg);color:var(--fg)} }
.item.seed .spine .fold[aria-expanded="true"]{color:var(--accent);border-color:var(--accent)}
/* 圆珠占的下半截空间：不然它压住最后一步的正文 */
.item.seed .spine.has-kids{padding-bottom:16px}
.seed-tick{color:var(--faint)}
/* ★ v5.0：勾选框删了 —— 原来就是上面这条 .seed-tick（按钮式勾）。
   想法不打勾，"用完了"从长按菜单走「收起来」（卡片变暗、沉底，可"继续想"恢复）。
   这里换成：折叠三角 + 等宽占位 + 缩进树 + 沉睡变淡。 */
/* ★ v5.1.2：原来 `.fold` 是左边那一列里的 22×22 方钮（含着 hover 底色）。
   现在它长在竖线上（见下面 `.item.seed .spine .fold` 那条），这里的老规则整块删掉，
   免得两条同选择器的规则互相盖（本项目在 .cmenu 上吃过这个亏）。 */
/* ★ v5.1.2：`.lead-blank`（没有子想法时的等宽占位）已删除 —— 它白占 22px + 11px 间隔，
   把日期和那个蓝点推到离卡边 45px 外（用户真机截图："这个蓝色的点，左边不还有那么多空间吗"）。
   现在 seedHTML 里**没有可放的东西就整列不渲染**，对齐让位给"贴着左边距"。 */

/* 缩进树：.seed-node 是 .idea-list 网格的直接子项；子想法在 .seed-kids 里再排一层网格。
   16px 一步；第 5 层起加 .flat（不再位移），层级改由卡上的「第 N 层」小标表达。 */
.seed-node{display:block;min-width:0}
/* ★ v5.0：**缩进之外再加连接线**。用户实测反馈：「单纯缩进一下看不太出来」
   —— 是下一级、还是另外一棵，光靠位移分不清。
   做法是常见的树形骨架：每个孩子一根拐角横线接到左边那条竖脊上；
   竖脊由"除最后一个之外"的孩子自己往下画一段（含 14px 的行距），
   所以线的末端正好停在最后一个孩子的拐角处，不会拖出一截无意义的尾巴。 */
/* ★ 第 8 波（用户："这个线怎么不是连续的"）——**像素扫描实测**出来的真相：
   三段线只是"算术上首尾相接"时，相接处是抗锯齿的两个端头，实际渲染会露缝。
   修法两条一起上：
     ① 相接处**重叠**（见下面注释，最终定在 8px）；
     ② 线色用**实色** `--tree-line` —— 半透明色一重叠会叠深（16%→29%），接缝反而更明显；
        实色重叠前后完全一样，缝就彻底没了。
   ★ 第 11 波（用户第二次说"我要的是连续的一条线"）：重叠 2px 在 100%/200%/300% 下都连续，
   但把**浏览器缩放换成 125%**（deviceScaleFactor=1.25，脚本 `_ref/_g12h-junction.mjs 1.25`）
   就露馅：脊线在 y=304 断开 0.8px。原因是圆角钩的弧线一离开切点就往右偏，
   竖线只多画 2px —— 那 1 个设备像素的行上，竖线已画完、弧线已偏右，两边都没盖住脊线那一列。
   重叠加到 **8px**：半径 11 的弧在切点下方 8px 处仍压在脊线这一列上，竖线多画的这段
   把弧线的抗锯齿端头整个盖住；同色实底，看不出多画。 */
.seed-kids{
  display:grid;gap:14px;padding-left:16px;margin-top:14px;min-width:0;   /* §6.1：16px 一步 */
  position:relative;
}
.seed-kids::before{                      /* 主干：父卡下边缘 → 越过第一个钩子的切点 8px */
  content:'';position:absolute;left:0;top:-14px;width:2px;height:40px;
  background:var(--tree-line,var(--line2));
}
.seed-kids > .seed-node{position:relative}
.seed-kids > .seed-node::after{          /* 接驳：圆角钩（下边框 + 左下圆角 = 柔和转角） */
  content:'';position:absolute;left:-16px;top:17px;width:16px;height:12px;
  border-bottom:2px solid var(--tree-line,var(--line2));
  border-bottom-left-radius:11px;
}
.seed-kids > .seed-node:not(:last-child)::before{   /* 脊：接到下一个孩子、并越过它的切点 8px */
  content:'';position:absolute;left:-16px;top:18px;bottom:-40px;width:2px;
  background:var(--tree-line,var(--line2));
}
.seed-kids.flat > .seed-node::after,
.seed-kids.flat > .seed-node::before,
.seed-kids.flat::before,
.seed-kids.flat::after{display:none}   /* 第 5 层起不再缩进，线也一并收掉 */
.seed-kids.flat{padding-left:0}
.seed-kids[hidden]{display:none}

/* 沉睡：超过 14 天没长过一步。**只是变淡**，位置不动 —— 它随时能被续写"点回来"。
   外壳负责变淡，卡内角标说清是几天前。 */
.idea-card.sleep{opacity:.6;filter:grayscale(.5)}
/* ★ v5.0：**「用过了」要真的暗下去**，不能只是"淡一点" —— 用户原话：
   「也没有变得很暗呀，只是变灰了一些而已，应该把它变灰，且变得稍微暗淡一些」。
   去色 + 压暗一起上。静态 filter 是安全的；本项目只禁**动画化的** filter
   （那会被安卓 WebView 丢回软件光栅化，早期版本踩过）。
   ⚠️ 必须写在 `.idea-card.sleep` **之后**：一条既"用过了"又"沉睡"的卡，两条同权重，
   靠源序分胜负 —— 用户**主动**收起来的应当压过自动变淡。 */
.idea-card.used{opacity:.45;filter:grayscale(.85) brightness(.85)}
.chip.sleepchip{color:var(--faint)}
.chip.kidchip{color:var(--accent)}
.chip.suggestchip{color:var(--accent);cursor:pointer}
.chip.depthchip{color:var(--faint)}
.item.seed .body{min-width:0;flex:1;gap:8px}
/* 时间轴：一条 1px 竖脊 + 每步一颗点。第一步（种子本身）的点用强调色实心，
   后面长出来的用空心 —— 一眼能分出"种子"和"长出来的"。
   ★ v5.1.2（用户："这个点距离左边感觉有些太近了，让它稍微往右移一点，大概移一个点的宽度"）：
   内边距 12 → 19px，蓝点跟着从离卡边 13px 挪到 20px（正好一个点的宽度）。
   那条竖线是绝对定位在 .spine 上的，**不随 padding 走**，所以 left 要同步 4 → 11px
   （dot 的中心 = 8 + 3.5 = 11.5，线压在 11 上）—— 这一对数字必须一起改。 */
.spine{position:relative;padding-left:19px}
.spine::before{content:'';position:absolute;left:11px;top:6px;bottom:6px;width:1px;
  background:var(--line,var(--pill))}
.sp-step{position:relative;display:flex;align-items:baseline;gap:8px;padding:3px 0;min-width:0}
.sp-dot{position:absolute;left:-11px;top:8px;width:7px;height:7px;border-radius:50%;
  background:var(--faint);flex:0 0 auto}
.sp-step.seed-first .sp-dot{background:var(--accent);
  box-shadow:0 0 8px color-mix(in srgb,var(--accent) 55%,transparent)}
.sp-step.seed-first .sp-tx{font-weight:800;font-size:15px}
.sp-at{flex:0 0 auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;
  min-width:0}
.sp-tx{min-width:0;word-break:break-word;line-height:1.5}
