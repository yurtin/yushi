    out.push({ k: el.dataset.fk, x: r.left, y: r.top, w: r.width, h: r.height, node });
  });
  return out.length ? out : null;
}
function playLeaving(saved){
  if (!saved || !saved.length) return;
  const all = [...document.querySelectorAll('#view [data-fk^="i:"]')];
  const cv = releaseCVFor(all);                 // 先放开 CV 再量，否则"还在的"会被误判成"没了的"
  const alive = new Set();
  all.forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.width || r.height) alive.add(el.dataset.fk);   // 折叠起来的 display:none 不算"还在"
  });
  const gone = saved.filter(g => !alive.has(g.k));
  if (!gone.length){ dropCV(cv); return; }
  const layer = document.createElement('div');
  layer.className = 'flip-ghost-layer';
  gone.forEach(g => {
    const box = document.createElement('div');
    box.className = 'flip-ghost';
    box.style.left = g.x + 'px'; box.style.top = g.y + 'px';
    box.style.width = g.w + 'px'; box.style.height = g.h + 'px';
    g.node.style.width = '100%'; g.node.style.height = '100%'; g.node.style.margin = '0';
    box.appendChild(g.node);
    layer.appendChild(box);
  });
  document.body.appendChild(layer);
  requestAnimationFrame(() => layer.classList.add('out'));
  setTimeout(() => { layer.remove(); dropCV(cv); }, 460);
}
function playEntering(before, D){
  const have = new Set((before || []).map(b => b.k));
  const cand = [];
  document.querySelectorAll('#view [data-fk^="i:"]').forEach(el => {
    if (!have.has(el.dataset.fk)) cand.push(el);          // 有配对 → 交给 FLIP 搬
  });
  if (!cand.length) return;
  const cv = releaseCVFor(cand);                          // 同上：不放开 CV 会量成 0×0 而漏掉
  const els = cand.filter(el => { const r = el.getBoundingClientRect(); return r.width || r.height; });
  if (!els.length){ dropCV(cv); return; }
  els.forEach(el => { el.style.transition = 'none'; el.style.opacity = '0'; });
  void document.body.offsetWidth;                        // 强制回流：让 0 成为过渡起点，才有淡入
  els.forEach(el => { el.style.transition = 'opacity ' + D + 'ms ease'; el.style.opacity = ''; });
  setTimeout(() => {
    els.forEach(el => { el.style.transition = ''; el.style.opacity = ''; });
    dropCV(cv);
  }, D + 80);
}

/* ---------- 分段控件的滑块：对齐 + 换挡动画 ----------
   segPrev 记着"上一帧滑块在哪"（相对 .seg 左上角），跨渲染保住 —— 因为切档会重建整个
   .seg，新 DOM 里没有旧位置可量，只能靠这张表找回"从哪来"。键用 aria-label，
   它对每个 .seg 都是稳定且唯一的（清单展示方式 / 统计布局 / 主题）。 */
const segPrev = new Map();
function ensureSegPill(seg){
  let p = seg.querySelector('.seg-pill');
  if (!p){
    p = document.createElement('i');
    p.className = 'seg-pill';
    p.setAttribute('aria-hidden', 'true');
    seg.insertBefore(p, seg.firstChild);
    seg.classList.add('has-pill');     // 只有插进成功才接管底色（渐进增强的开关）
  }
  return p;
}
function syncSegPills(animate){
  document.querySelectorAll('.seg').forEach(seg => {
    const on = seg.querySelector('.segbtn.on') || seg.querySelector('.segbtn');
    if (!on) return;
    const pill = ensureSegPill(seg);
    /* 绝对定位元素的包含块是 .seg 的**内边距盒**，而 getBoundingClientRect 的差值是
       从边框盒起算的 —— 所以要减掉 clientLeft/clientTop 这 1px 边框，否则滑块会整体偏 1px。 */
    const sr = seg.getBoundingClientRect(), br = on.getBoundingClientRect();
    const to = { x: br.left - sr.left - seg.clientLeft, y: br.top - sr.top - seg.clientTop,
                 w: br.width, h: br.height };
    const key = seg.getAttribute('aria-label') || 'seg';
    const from = segPrev.get(key);
    segPrev.set(key, { x: to.x, w: to.w });

    pill.classList.remove('anim');
    pill.style.width = to.w + 'px';
    pill.style.height = to.h + 'px';
    /* 行内 transform 始终写"终点"：它既是动画结束后的落点，也是不放动画时的直接落位。
       （动画期间 animation 的值优先于行内；动画摘掉后自然回到行内，不会跳。） */
    pill.style.transform = 'translate(' + to.x + 'px,' + to.y + 'px)';
    if (!animate) return;

    const moved = from && (Math.abs(from.x - to.x) > 0.5 || Math.abs(from.w - to.w) > 0.5);
    if (!moved || reduceMotion() || !from.w || !to.w) return;
    /* 液桥式拉伸的几何推导（A=旧位 x，U=旧宽；B=新位 x，V=新宽）：
       支点选在**运动方向那一端的反面** —— 往右走锚左端、往左走锚右端，于是"被抻长"的
       那一头总是朝目标长出去，而不是往回缩。设 scaleX 的参照宽度是 V：
         0%   transform = (A, U/V)         → 渲染出的跨度还是 [A, A+U]（旧位，原样）
         44%  transform = (锚点, span/V)   → 跨度正好 [min(A,B), max(A+U,B+V)]（盖住并集）
         100% transform = (B, 1)           → 跨度 [B, B+V]（新位）
       其中 span = max(A+U, B+V) - min(A, B)；锚点 = 右行取 A、左行取 A+U-V。
       三个状态都能反推出同一组公式，所以不需要在动画中途换 transform-origin。 */
    const right = to.x >= from.x;
    const anchor = right ? from.x : from.x + from.w - to.w;
    const span = Math.max(from.x + from.w, to.x + to.w) - Math.min(from.x, to.x);
    pill.style.transformOrigin = right ? 'left center' : 'right center';
    pill.style.setProperty('--sx0', anchor + 'px');
    pill.style.setProperty('--sxm', anchor + 'px');   // 拉伸阶段只有粗细在变，锚点不动
    pill.style.setProperty('--sx1', to.x + 'px');
    pill.style.setProperty('--sy', to.y + 'px');
    pill.style.setProperty('--r0', (from.w / to.w).toFixed(4));
    pill.style.setProperty('--r1', (span / to.w).toFixed(4));
    void pill.offsetWidth;                 // 强制回流：连点两次也能重播（同名类不重启动画）
    pill.classList.add('anim');
    pill.addEventListener('animationend', () => pill.classList.remove('anim'), { once: true });
  });
}

/* 滚动揭示（原站 .reveal-on-scroll + IntersectionObserver） */
let revealIO = null;
function observeReveals(){
  const els = document.querySelectorAll('.reveal-on-scroll:not(.is-visible)');
  if (!els.length) return;
  if (!('IntersectionObserver' in window)){ els.forEach(e => e.classList.add('is-visible')); return; }
  if (!revealIO){
    revealIO = new IntersectionObserver(list => {
      list.forEach(en => {
        if (!en.isIntersecting) return;
        const el = en.target;
        el.classList.add('is-visible');
        revealIO.unobserve(el);
        // 入场动画跑完就撤掉 will-change，别让这些图层永久留在合成器里。
        // 注意监听的是 animationend：揭示改成了 animation（见 CSS 里那段说明），
        // 不再有 transitionend 可听。reduced-motion 下动画被全局那条 !important 关掉，
        // 这里就等不到事件 —— 那种情况下浏览器本来也不会为它们建合成层，无需收拾。
        el.addEventListener('animationend', function done(ev){
          if (ev.target !== el || ev.animationName !== 'rvIn') return;
          el.style.willChange = 'auto';
          el.removeEventListener('animationend', done);
        });
      });
    }, { rootMargin:'0px 0px -8% 0px', threshold:0.04 });
  }
  els.forEach(e => revealIO.observe(e));
  clearTimeout(observeReveals._t);
  observeReveals._t = setTimeout(() => {
    document.querySelectorAll('.reveal-on-scroll:not(.is-visible)').forEach(e => {
      if (e.getBoundingClientRect().top < window.innerHeight) e.classList.add('is-visible');
    });
  }, 1400);
}

/* ★ v5.1.2（真机反馈："调出键盘的时候，就看不到输入的内容了"）：弹层是
   `position:fixed;inset:0`，键盘若只是**盖在窗口上**（安卓 API 30+ 的 edge-to-edge 就是这样），
   贴底 sheet 的输入框正好落在键盘下面。
   主线是原生壳那条：MainActivity 按 IME inset 把 WebView 直接缩小（布局视口变小，弹层自然升上去）。
   这里兜底浏览器 / PWA / 老壳：用 visualViewport 量出"被键盘吃掉的高度"写进 --kb，
   CSS 拿它当弹层的底部内边距（并同步收窄 sheet 的 max-height）。
   两条同时生效不会叠：壳那条把 innerHeight 也一起缩小了，这里量出来就是 0。
   ⚠️ 留 60px 死区：地址栏伸缩、四舍五入都会产生几十 px 的差，不该让弹层跟着抖。 */
function applyKeyboardInset(kb){
  const root = document.documentElement;
  const v = Math.max(0, Math.round(kb || 0));
  if (v >= 60) root.style.setProperty('--kb', v + 'px');
  else root.style.removeProperty('--kb');
}
function syncKeyboardInset(){
  const vv = window.visualViewport;
  applyKeyboardInset(vv ? window.innerHeight - (vv.height + vv.offsetTop) : 0);
}
function initKeyboardInset(){
  if (window.visualViewport){
    window.visualViewport.addEventListener('resize', syncKeyboardInset);
    window.visualViewport.addEventListener('scroll', syncKeyboardInset);   // iOS 会把可视框整体上移
  }
  window.addEventListener('resize', syncKeyboardInset);
}

/* ---------- toast ---------------- */
let toastTimer = null;
function toast(msg, actionLabel, action, dur){
  const el = document.getElementById('toast');
  if (!el) return;                       // 与 hideToast 同一道空值保护（见下）
  /* ★ v5.0：第二个参数也可以直接给一个数组 [{label, fn}, …] —— 一次给多个按钮。
     录入提示条要同时给「存入想法」和「撤销」，一个按钮表达不了。
     数组形式下，第三个参数是显示时长（因为 action 这个形参被 dur 占了）。 */
  const multi = Array.isArray(actionLabel);
  const acts = (multi ? actionLabel : (actionLabel ? [{ label: actionLabel, fn: action }] : []))
    .filter(a => a && typeof a.fn === 'function');
  const liveMs = multi ? action : dur;
  /* ★ v3.40：带着「撤销」按钮的提示不许被后台建议顶掉。
     实测：循环任务打勾弹出「完成 · …再来一轮 [撤销]」后，0.8s 后那条
     "长期区有 N 条放了超过 30 天" 的定时提示会把它整条替换掉 —— 用户在
     撤销窗口内点不到按钮，而需求 A6 明确要求"撤销必须能撤回生成的下一轮"。
     规则：普通提示遇到"正在显示撤销"时直接放弃（它只是建议，撤销是数据安全）。 */
  const undoLive = el.classList.contains('on') && el.dataset.act === '1';
  if (undoLive && !acts.length) return;
  el.innerHTML = `<span>${esc(msg)}</span>`;
  el.dataset.act = acts.length ? '1' : '';
  acts.forEach(a => {
    const b = document.createElement('button');
    b.textContent = a.label;
    b.onclick = () => { a.fn(); hideToast(); };
    el.appendChild(b);
  });
  el.classList.add('on');
  /* v3.32：弹窗开着时把提示挪到顶部，别压住弹窗底部的按钮（用户被"已用语音录入"挡过"取消"）。
     找不到弹窗元素就照旧在底部 —— 最坏情况与改动前一致。 */
  try {
    const dlg = document.querySelector('.overlay.on,.sheet.on,.mask.on,[aria-modal="true"],dialog[open]');
    el.classList.toggle('at-top', !!dlg);
  } catch (_){}
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, liveMs || 5000);
}
/* 加空值保护：正常运行中 #toast 常驻，不会缺；但外部脚本/将来的重构若把它移走，
   那条已排队的 hideToast 定时器就会在这里抛 TypeError（本项目核验脚本踩过一次）。 */
function hideToast(){ const t = document.getElementById('toast'); if (t) t.classList.remove('on'); }
/* ★ 5F：多按钮 toast 的按钮处理器写的是 `a.fn(); hideToast();`。
   如果 fn **同步**落库、并在里面紧接着弹一条新提示（「撤销」/「已撤回」这类），
   那条新提示会被随后的 hideToast() 立刻收掉 —— 用户根本看不到撤销按钮。
   5D 给 askRemoveWithKids 就地包了一层延迟执行，5F 把它提到模块级、各处共用一份。

   ⚠️ 为什么 toast() 里那条"带按钮的提示不被顶掉"的保护规则救不了它（最容易再踩的坑）：
   那条规则只拦**新的 toast() 顶替旧的**（`undoLive && !acts.length` 时直接 return），
   而这里收掉撤销的是按钮处理器**显式调用**的 hideToast()，根本不经过 toast()。
   凡是"按钮点下去会同步弹新提示"的地方，都要用 later() 包一层。 */
function later(fn){ return function(){ setTimeout(fn, 0); }; }

/* 备份提醒：数据只在 localStorage 里，超 7 天没备份（或从未备份）就提醒一次，
   并提供「复制备份到剪贴板」——不用导出文件也能快速留底 */
function copyBackup(){
  const json = JSON.stringify(snapshot(), null, 2);
  const done = () => { S.lastBackup = Date.now(); save(); toast('已复制，找个地方（备忘录/网盘）粘贴保存一下'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(json).then(done).catch(() => fallbackCopy(json, done));
  } else fallbackCopy(json, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { toast('复制失败，请用「备份」按钮导出文件'); }
  ta.remove();
}
/* 备份提醒：数据只在 localStorage 里，超 7 天没备份（或从未备份）就提醒一次，
   并提供「复制备份到剪贴板」——不用导出文件也能快速留底。

   ⚠️ 这个函数**必须在 load() 之后调用**（见文件末尾的启动块）。
   原来它写成「定义即执行」的 IIFE、位置又落在 load() 之前，守卫读到的 S.lastBackup
   永远是初始值 null，于是**每次打开页面都误报一次**；更别扭的是文案是在下面的 setTimeout
   里才拼的，那时 load() 早跑完了 —— 结果 header 显示"今天已备份"、toast 说"已经 0 天没备份"。 */
function backupNudge(){
  if (S.lastBackup && Date.now() - S.lastBackup < 7 * 86400000) return;
  const d = S.lastBackup ? Math.floor((Date.now() - S.lastBackup) / 86400000) : 0;
  setTimeout(() => toast(
    !S.lastBackup ? '数据只存在这台手机里，还没备份过，建议留个底'
                  : '已经 ' + d + ' 天没备份数据了，建议留个底',
    '复制备份', copyBackup, 12000), 1500);
}

/* ---------------- 交互 ---------------- */
/* 标签栏（录入区 + 筛选栏共用一套标签库 S.tags）：点选 / 新建 / 改名 / 删除。
   两处标签条完全平权 —— 内置的「学习/生活/娱乐」也只是默认值，一样能改名和删掉。
   —— 放在 document 级委托，两处标签条改动后都会同步刷新
   注意：筛选栏在 #view 内，而 view 自己的委托只认 tick/edit/fold/tag/f 那几类，
   不认 addtag/deltag/managetag；所以下面只对这几个 act 做委托，且不能按 #view 跳过。 */
let entryTagSet = new Set();      // 录入区多选出来的标签（会话级，不持久化）
const TAG_MAX = 24;

function addTag(name){
  const v = normTagList([name])[0];
  if (!v) return false;
  if (S.tags.indexOf(v) >= 0) return false;
  if (S.tags.length >= TAG_MAX) return false;
  S.tags.push(v); syncTags(); save(); refresh(); return true;
}

/* 删标签：从标签库拿掉，同时把条目上这个标签也摘掉（否则会出现「筛选栏里没有、
   条目上却挂着一个点不到的标签」）。整个操作可撤销。 */
function removeTag(t){
  const k = S.tags.indexOf(t);
  if (k < 0) return false;
  S.tags.splice(k, 1);
  S.filterTags = S.filterTags.filter(x => x !== t);
  entryTagSet.delete(t);
  const touched = [];
  S.items.forEach(i => {
    const j = (i.tags || []).indexOf(t);
    if (j >= 0){ i.tags.splice(j, 1); touched.push(i.id); }
  });
  syncTags(); save(); refresh();
  const undo = () => {
    if (S.tags.indexOf(t) < 0) S.tags.splice(Math.min(k, S.tags.length), 0, t);
    S.items.forEach(i => {
      if (touched.indexOf(i.id) >= 0 && (i.tags || []).indexOf(t) < 0) i.tags.push(t);
    });
    syncTags(); save(); refresh();
  };
  toast('删掉标签「' + t + '」' + (touched.length ? '，' + touched.length + ' 条也一并摘掉' : ''),
        '撤销', undo);
  return true;
}

/* 改标签名：标签库和所有条目一起改，筛选/录入区的选中状态也跟着走 */
function renameTag(from, to){
  const v = normTagList([to])[0];
  const k = S.tags.indexOf(from);
  if (k < 0 || !v) return false;
  if (v === from) return true;                     // 没改动，当成功
  if (S.tags.indexOf(v) >= 0) return false;        // 和别的标签重名
  S.tags[k] = v;
  S.filterTags = S.filterTags.map(x => x === from ? v : x);
  if (entryTagSet.has(from)){ entryTagSet.delete(from); entryTagSet.add(v); }
  S.items.forEach(i => {
    const j = (i.tags || []).indexOf(from);
    if (j >= 0) i.tags[j] = v;
  });
  syncTags(); save(); refresh(); return true;
}

/* 管理标签弹窗：一行一个，输入框直接改名，右边删除；底部加新标签。
   ★ v3.36（用户："当我点击标签右边的设置按钮时，不要直接跳转到输入状态（即不要直接弹出输入法）。
   如果需要添加，点击右边的加号就可以直接弹出来"）：
   原来弹窗一开就 addInp.focus() —— 管理标签的人多半只是想看看/删一个，结果先弹出一屏输入法。
   改成默认**不聚焦**（焦点停在弹窗容器上，读屏照样播报标题）；只有"刚添加成功、要接着加下一条"
   这一种情况才把光标递到新标签框。 */
function openTagManager(focusAdd){
  const row = t => `<div class="tagrow">
      <input type="text" value="${esc(t)}" maxlength="12" data-tagin="${esc(t)}" aria-label="标签名 ${esc(t)}">
      <button class="btn danger" data-tagdel="${esc(t)}" title="删除「${esc(t)}」">删除</button>
    </div>`;
  modal.innerHTML = `<h3 id="modalTitle">管理标签</h3>
    <p class="modal-note">改名字直接在框里改，回车或点到别处生效；删除会把这些条目上的这个标签也一并摘掉，可以撤销。</p>
    <div class="tagrows">${S.tags.length ? S.tags.map(row).join('')
      : '<p class="modal-note">现在一个标签都没有，下面加一个吧。</p>'}</div>
    <div class="tagrow addrow">
      <input type="text" id="tagNew" placeholder="新标签名" maxlength="12">
      <button class="btn primary" id="tagAdd">添加</button>
    </div>
    <div class="foot">
      <span class="modal-note">${S.tags.length} / ${TAG_MAX} 个标签</span>
      <div class="spacer"></div>
      <button class="btn" id="tmClose">关闭</button>
    </div>`;
  openMask();

  modal.querySelectorAll('[data-tagin]').forEach(inp => {
    let busy = false;
    const apply = () => {
      if (busy) return; busy = true;
      const from = inp.dataset.tagin, to = inp.value;
      if (normTagList([to])[0] === from){ busy = false; return; }   // 没改
      if (renameTag(from, to)){ openTagManager(); return; }         // 重开一遍，行里的 data 才是新的
      busy = false;
      inp.value = from;
      toast('改不了：名字不能空着，也不能和别的标签重名');
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); inp.blur(); } });
    inp.addEventListener('blur', apply);
  });

  modal.querySelectorAll('[data-tagdel]').forEach(b => {
    b.onclick = () => { removeTag(b.dataset.tagdel); openTagManager(); };
  });

  const addInp = document.getElementById('tagNew');
  const doAdd = () => {
    const v = addInp.value;
    if (!v.trim()){ toast('标签名不能空着'); return; }
    if (!addTag(v)){ toast(S.tags.length >= TAG_MAX ? '标签太多了，先删几个' : '这个标签已经有了'); return; }
    openTagManager(true);                        // 刚加完 → 接着加下一条，这次才把光标给上
  };
  document.getElementById('tagAdd').onclick = doAdd;
  addInp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); doAdd(); } });
  document.getElementById('tmClose').onclick = closeModal;
  /* 只有显式要求"接着加"时才聚焦（管理标签不该顺手弹出输入法，见函数顶部说明）。
     弹窗打开时 openMask() 已把焦点放到弹窗容器上，读屏会播报"对话框 + 管理标签"。 */
  if (focusAdd) addInp.focus();
}

document.addEventListener('click', e => {
  const et = e.target.closest('[data-et]');
  if (et){
    const t = et.dataset.et;                     // 多选：点一下加入，再点移出
    if (entryTagSet.has(t)) entryTagSet.delete(t);
    else {
      /* 一条最多 TAG_PER_ITEM 个标签，超了就在这里拦住，
         不然用户选了 5 个、录入时被悄悄砍掉一个，会觉得"选了没用" */
      if (entryTagSet.size >= TAG_PER_ITEM){ toast('每条最多 ' + TAG_PER_ITEM + ' 个标签'); return; }
      entryTagSet.add(t);
    }
    /* 就地改 class，不重建 —— 这样 .pill 上那条 transition 才播得出来（见 syncEntryTagUI） */
    syncEntryTagUI(); return;
  }
  /* 新建 / 改名 / 删除标签：两处标签条（录入区 + 筛选栏）都走这里。
     筛选栏在 #view 里，而 view 的委托只认 tick/edit/fold 那几类，不认这几个 act，
     所以这里不能按 #view 跳过 —— 否则筛选栏的 ＋ / ⚙ / × 都是死的。 */
  const act = e.target.closest('[data-act="addtag"],[data-act="deltag"],[data-act="managetag"]');
  if (!act) return;
  if (act.dataset.act === 'managetag'){ openTagManager(); return; }
  if (act.dataset.act === 'addtag'){
    const wrap = document.createElement('span');
    wrap.className = 'pillwrap';
    wrap.innerHTML = `<input class="newtag-input" id="newTagInput" placeholder="标签名" maxlength="12">`;
    act.replaceWith(wrap);
    const inp = document.getElementById('newTagInput');
    inp.focus();
    inp.addEventListener('keydown', ev => {
      if (ev.key === 'Enter'){
        const v = inp.value;
        if (!v.trim()){ toast('标签名不能空着'); inp.focus(); return; }   // 空的不关盒子，方便接着打
        if (!addTag(v)) toast(S.tags.length >= TAG_MAX ? '标签太多了，先删几个' : '这个标签已经有了');
        refresh();
      }
      else if (ev.key === 'Escape') refresh();
    });
    inp.addEventListener('blur', () => refresh());
    return;
  }
  if (act.dataset.act === 'deltag'){ removeTag(act.dataset.t); return; }
});

/* 标签条横向滚动：鼠标滚轮落在标签条上时，把竖向滚转换成横向滚 ——
   标签一多，光靠拖那条细滚动条很难选。滚到头就放行，让页面照常上下滚。 */
document.addEventListener('wheel', e => {
  const box = e.target && e.target.closest ? e.target.closest('.pillstrip') : null;
  if (!box) return;
  const max = box.scrollWidth - box.clientWidth;
  if (max <= 2) return;                                    // 没得滚，别抢事件
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;     // 本来就是横向手势（触控板），交给浏览器
  const atStart = box.scrollLeft <= 0.5, atEnd = box.scrollLeft >= max - 0.5;
  if ((e.deltaY < 0 && atStart) || (e.deltaY > 0 && atEnd)) return;   // 到头了就交给页面
  e.preventDefault();
  /* deltaMode: 0=像素 1=行 2=页。Firefox 的滚轮一格是「行」，
     不换算是 3px 一步，等于没滚 */
  const d = e.deltaMode === 1 ? e.deltaY * 26
          : e.deltaMode === 2 ? e.deltaY * box.clientWidth
          : e.deltaY;
  box.scrollLeft += d;
}, { passive: false });

/* 录入提交只有一个入口：键盘 Enter（下方 keydown）和右侧「存」按钮都调它。
   原先是 keydown 里一段内联逻辑 —— 升级成按钮后必须抽出来共用，否则两条路径行为会漂移。 */
/* ★ 2A：录入这一下改走**理解内核**（async）。
   本地级联能解 → 零请求、跟以前一样秒出；
   解不了（大白话）→ 交给模型听懂；模型任何一环出问题 → 退回本地结果，
   并且**明确告诉用户"用的是本地识别"**（红线 2：绝不生成假数据）。
   输入框在等待之前就清掉 —— 用户按回车是"我说完了"，不该盯着自己那句话等。 */
async function commitEntry(opts){
  const el = document.getElementById('entry');
  /* ★ 3B：`opts.text` 是"还是新建一条"那条重试路把原话带回来的口子（用户那句话不能丢）。
     不传就照旧读输入框。 */
  const v = (opts && opts.text !== undefined ? String(opts.text) : el.value).trim();
  if (!v) return;
  el.value = '';
  /* ★★★ 3B 最容易做错的一步：**更新路径不预落库**（红线 ④）。
     它和 2B 的两段式上屏是**正面冲突**的 —— 两段式是"先把本地结果落一条上屏、AI 回来再替换"，
     可如果这句最终判定是 **update**，那条先落的条目就是垃圾（还得删掉），用户还会看到
     "冒出来又消失"。卡里定的正解就是下面这个顺序，别改成别的：
       ① 先判路由（本地强 cue 命中时立刻判、不预落库；非强 cue 才出网，**出网期间也不预落库**）；
       ② 判成 update → 一行都不落，直接走遥控器；
       ③ 判成 create → 才进原来那段（含两段式），一个字都没改。
     代价（故意的取舍）：update 路径的"即时上屏"比 create 差一点 —— 要等路由结果才说话。
     改数据本来就该稳：先落一条再删掉，比多等半秒糟得多。 */
  if (!(opts && opts.forceCreate)){
    const route = await aiRouteForEntry(v, opts);
    if (route === 'update'){
      await aiRunUpdateEntry(v, opts);
      return;
    }
  }
  /* ★ 2B 两段式上屏（用户 2026-10-08 定，选项 A：松手后用 AI 结果整套替换一次 + 停 0.5 秒）。
     松手先把**本地结果**顶上屏（零请求、几毫秒），AI 回来之后再用它的结果替换。
     语音录入的"慢"全部集中在"松手 → 卡片出现"这一段，而这一段根本不需要等网络。
     只在"本地结果是一条干干净净的普通条目"时才启用 —— 带 path / dayParts / 循环 / 目标的
     本地结果会顺手建出父卡与子任务，替换时收不干净；那几种本来就带语法、压根不会出网。 */
  let quickMade = null;
  if (opts && opts.twoPhase && aiOn() && smartNeedAI(v)){
    const quick = smartLocalPlan(v);
    const qp = quick.items[0] && quick.items[0].preset;
    if (quick.items.length === 1 && qp && !(qp.path && qp.path.length)
        && !(qp.dayParts && qp.dayParts.length) && !qp.repeat && !qp.goal){
      quickMade = aiCommitPlan(quick, v);
      refresh();
      if (quickMade[0]) toast('先记下了 · 正在让 AI 听懂…', null, 2600);
    }
  }
  let plan;
  try {
    plan = await aiUnderstand(v);
  } catch (e){
    /* 内核自己就不该抛（内部每条失败路径都 return 本地结果）；真抛了也不能丢用户的话 */
    plan = smartLocalPlan(v);
    plan.reason = 'error';
  }
  let made;
  if (quickMade && quickMade.length){
    /* 第二段。AI 头一条标题与本地一致就什么都不动（这种情况占大多数）；
       不一致才替换，且替换做成**重建**而不是就地改字段 —— AI 的产出可能连分区都换
       （长期 ↔ 想法），就地改要处理种子/待办的整整一列字段，重建只走 addItem 这一条路。 */
    const same = plan.items.length === quickMade.length
      && plan.items.every((x, i) => String(x.title) === String(quickMade[i].title));
    if (same){
      made = quickMade;
    } else {
      const kill = new Set(quickMade.map(x => x.id));
      quickMade.forEach(x => { try { syncNotify(x); } catch (e){} });   // 先撤排期（约定 7 的唯一入口）
      S.items = S.items.filter(x => !kill.has(x.id));
      made = aiCommitPlan(plan, v);
      if (made[0]) aiSwapped = { id: made[0].id, t: Date.now() };       // 亮 0.5 秒
    }
  } else {
    made = aiCommitPlan(plan, v);
  }
  const it = made[0] || null;
  /* ★ 6C（用户 2026-10-11）：「没写时间的条目默认去哪」里**除 auto / idea 外的第三个档**接上。
     7B 把可选值从 long/idea 扩成了"分区表里的任意一个 k"，但只有 idea（长成想法）与
     auto（问 AI 落点）这两条真被消费过 —— 用户选「短期」时，条目仍然按 parseSmart 的默认
     落「长期」，随后还可能被 AI 落点改走。用户视角就是"我明明选了这一档，它根本没理我"。
     口径：**显式选定的落点优先于解析默认，也优先于 AI 落点**；''（不进任何分区）同此。
     只在"没写日期也没有钟点"时生效 —— 写了时间的条目自己有明确落点，不该被这条覆盖。 */
  const czNow = S.captureZone;
  const czExplicit = (czNow === '') ? ''
    : (czNow && czNow !== 'auto' && czNow !== 'idea' && validZoneKey(czNow)) ? czNow : null;
  if (it && czExplicit !== null && !it.date && !it.time && it.zone !== 'idea'){
    it.zone = czExplicit;
    it.zoneBy = 'capture';
    if (typeof save === 'function') save();
  }
  /* ★ 2B（用户 2026-10-08）：把 AI **纠错后的整句**也留下来。
     为什么：用户真机录「我大后天要去图书馆还从图书馆借的书」，本地识别吐的是
     "我大要去图书馆还长图书馆借的书"，AI 其实能纠回来，但这个字段一直没人接，
     他只能自己去猜"AI 到底听懂没有"。
       · 存进 `it.heard`，编辑弹层在「原文」下面多一行「AI 听成 …」（原文一个字不动，需求 A5）
       · 同时按 **0.5 权重**喂纠错层的常用词采集 —— 用户定的口径是"AI 纠错的权重
         不如用户自己手动改标题的"，手动改一次记 1 分。 */
  const heard = String((plan && plan.corrected) || '').trim();
  if (heard && heard !== v) made.forEach(x => { x.heard = heard; });
  /* 录入区手选的标签（可多选）优先加在最前面，再跟上正文里写的 #标签，去重后截断。
     多条目时**每条都套用** —— 用户是给这一整句选的标签，不是只给第一条。 */
  if (made.length && entryTagSet.size){
    made.forEach(x => { x.tags = normTagList([...entryTagSet].concat(x.tags || [])).slice(0, TAG_PER_ITEM); });
    save();
  }
  refresh();
  if (it){
    /* 「上次焦点」：下一句交给模型理解时，"我刚刚记下的是哪条"是判断
       "要不要挂到刚才那条下面"的关键上下文（限量发，不全量塞）。 */
    S.aiAnchor = String(it.title || '').slice(0, 60);
    save();
    /* 兜底 `|| '待办'`（代码审查补）：目前 parseSmart 只会给出 short / long / consider
       （循环任务被归入 short），所以取不到 undefined。但 ZONES 里是有 'repeat' 的，
       一旦有代码把 zone 设成它，这行就会拼出「已加入「undefined」」这种用户可见的错。
       加个默认值，代价为零。 */
    /* ★ 7B：把这条它现在归进哪一栏说出来。以前这里只有一块写死的 {short,long,idea} 表 ——
       分区改成用户自定义之后必须读分区表，而且**只能说"未分组"**不能拼出「undefined」。 */
    /* ★ 7B：AI 落点的**三级层次**（用户 2026-10-11 定，见 方案-自定义分区.md 第四节）：
         ① 用户写了 S.zoneRules（规范设置）→ 出网，把「规则 + 现有分区名 + 原话」给模型让它挑；
         ② 没写规则但行为学习命中（2-gram 累计 ≥ ZONE_HINT_MIN 且不并列）→ **本地直接定、零请求**；
         ③ 都不中 → 出网，只给「现有分区名 + 原话」。
       失败 / 超时 / AI 关着**一律留空 → 未分组**（绝不瞎猜）。
       只在"没写日期、且不是想法"的条目上发生：写了日期的条目自己就会落短期/长期，
       语义已经明确，再问一次模型只是白花钱（2C 那套落点规则仍然管想法）。
       ★ 7B 补（实测 _5e-dom）：**还要求这一条没有任何本地能判的日期/钟点** ——
       否则"明天下午三点开会"这种纯本地句子会凭空多出一次请求，把"写了语法就零请求"
       这条老口径打红。判的是条目自己的 date / time（本地解析出来的就是它们），
       不是再解析一遍原文。
       转发口用 typeof 守卫 —— 纯 Node 回归把 commitEntry 切进隔离环境时没有这一层。 */
    /* ★ 6C：显式选定的落点（某个分区 / 不进任何分区）已经在上一步定死，这里不再问 AI ——
       否则模型会把用户亲手选的栏目再改走，等于设置没生效。 */
    if (!it.date && !it.time && it.zone !== 'idea' && czExplicit === null && typeof zoneAdvisorAsk === 'function'){
      /* preset 一并交过去：带 dayParts（早中晚）或 path 的条目是**结构型**的，
         它的"归哪一栏"由结构本身决定，再问一次模型既白花钱也会把父条目的归属改掉
         （实测 _5e-dom：'早中晚吃药' 的父条目没有 date/time，于是凭空多发了一次请求）。
         preset 挂在 plan 的第一条上（本地路径自带；模型路径没有 → 不受影响）。 */
      const zo = zoneAdvisorAsk(it.title, it.zone, v, (plan.items[0] && plan.items[0].preset) || null);
      if (zo && zo.zone !== it.zone){
        it.zone = (zo.zone === '' || validZoneKey(zo.zone)) ? zo.zone : it.zone;
        it.zoneBy = zo.by;
      }
    }
    /* ★ v5.0 录入提示条（1.14）：**没解析出日期**的**新建**条目，顺手给一个「存入想法」出口。
       为什么要给：现有规则是「没日期的沉长期」，于是长期里混着两种东西 ——
       真的要长期做的任务，和"其实只是个念头"。当场让你选会抬高记录阻力
       （调研的硬结论：捕捉那一刻不该要求决策），所以做成提示条上的一个按钮：
       不点就自己消失，不阻塞，也不改变"默认算待办"这件事。
       只在新建时给；编辑已有条目不弹（否则每次改长期都要被问一遍）。 */
    const ids = made.map(x => x.id);
    /* ★ 5F：多按钮提示条的按钮处理器是 `a.fn(); hideToast();` —— 同步落库 / 同步弹新提示
       会被随后的 hideToast 收掉。所以凡"点下去会同步弹新提示"的按钮都包一层延迟。
       typeof 守卫 = 转发口（本函数会被 2B/3B 那几个切片式回归放进隔离环境跑，那里没有 later）。 */
    const defer0 = (typeof later === 'function') ? later : function(f){ return f; };
    const tActs = [{ label: '撤销', fn: () => {
      const kill = new Set(ids);
      S.items = S.items.filter(x => !kill.has(x.id));
      save(); refresh();
    } }];
    if (!it.date && !isSeed(it)){
      if (S.captureZone === 'idea'){
        /* ★ v5.0：设置里把默认落点切成「想法」→ 没写时间的一律直接长成想法。
           录入那一刻仍然不做任何决定，只是落点变了。 */
        taskToSeed(it, true);
        toast('已存成想法 —— 在底栏左端那颗灯泡里', '去看看', () => {
          goView('idea');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
        const sec0 = document.getElementById('view');
        if (sec0 && sec0.getBoundingClientRect().top > window.innerHeight * 0.6)
          sec0.scrollIntoView({ behavior:'smooth', block:'start' });
        return;
      }
      /* ★ 5F：taskToSeed 是同步的、会弹「已存成想法 —— 在底栏左端那颗灯泡里」——
         不延后会被按钮处理器的 hideToast() 收掉（同 later 的说明）。 */
      tActs.unshift({ label: '存入想法', fn: defer0(() => taskToSeed(it)) });
    }
    /* 提示语分档见 aiEntryReply（纯函数、可单测）：AI 听懂 → aiSay；
       本地语法 / AI 关着 → 静默 toast；降级 → aiFail 且**必须说清"用的是本地识别"**。 */
    const where = '已加入「' + zoneNameOf(it.zone) + '」' + (it.date ? ' · ' + dateLabel(it) : '') +
      ((it.tags && it.tags.length) ? ' · ' + it.tags.join('/') : '') +
      (made.length > 1 ? ' · 共 ' + made.length + ' 条' : '');
    /* ★ 7B：落点提示 —— 刚才这一条被放进了哪一栏，就长在提示条末尾（`→ 学习`）。
       点它换一栏；换成功就是一次教学信号（见 zoneTeach）。想法不参与分区，所以不给它。 */
    if (!isSeed(it)) tActs.push({ label: '→ ' + zoneNameOf(it.zone), fn: defer0(() => zoneTeachPick(it)) });
    const reply = aiEntryReply(plan, where);
    if (reply.via === 'aiSay') aiSay(reply.msg, tActs, 6000);
    else if (reply.via === 'aiFail') aiFail(reply.msg, tActs, 8000);
    else toast(reply.msg, tActs, 6000);
    /* 纠错层的采集排在提示之后：hotwordObserve 自己会 hideToast 再问，
       所以先让"已加入…"（带撤销）活一下，再轮到"是你的常用词吗"。 */
    if (heard && heard !== v) hotwordObserve(v, heard, 0.5);
    // 新增后把看板滚进视野，避免"存了但没看见"
    const sec = document.getElementById('view');
    if (sec && sec.getBoundingClientRect().top > window.innerHeight * 0.6)
      sec.scrollIntoView({ behavior:'smooth', block:'start' });
  }
}
document.getElementById('entry').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  commitEntry();
});
/* 「存」按钮。手机上点它必然先让输入框失焦、软键盘收起 —— 这是想要的行为
   （存完键盘不挡列表）。桌面（有悬停设备）则把焦点还给输入框，方便连续录入。 */
document.getElementById('entryGo').addEventListener('click', () => {
  commitEntry();
  if (matchMedia('(hover:hover)').matches) document.getElementById('entry').focus();
});

/* 搜索：过滤标题。渲染是整体重建 innerHTML，输入框会被重建，所以每次刷新后
   用 rAF 把焦点和光标补回去（rAF2 排在 refresh 的 rAF1 之后）。

   **为什么要 debounce**：原来每敲一个键就 refresh() 一次整块重建，
   条目一多（还带 .reveal-on-scroll / .goal-kids）输入会明显发涩；
   搜索框还得靠 refocusSearch 把焦点找回来，本身就说明重建代价不小。
   现在只把 refresh() 推到停手之后（S.q 仍然立刻更新 —— 这样期间任何
   别的原因触发的 refresh() 拿到的都是最新的过滤词，不会把输入框内容冲掉）。

   顺带把「光标位置」也接住了：重建后如果无脑 setSelectionRange(末尾)，
   用户点到中间改字、120ms 后光标会自己跳到末尾。 */
const SEARCH_DEBOUNCE_MS = 130;
let searchTimer = 0;
function refocusSearch(caret){
  requestAnimationFrame(() => {
    const el = document.getElementById('searchBox');
    if (!el) return;
    if (document.activeElement !== el) el.focus();
    const p = caret === undefined ? el.value.length : Math.min(caret, el.value.length);
    try { el.setSelectionRange(p, p); } catch (e){}
  });
}
view.addEventListener('input', e => {
  if (e.target.id !== 'searchBox') return;
  S.q = e.target.value;
  const caret = e.target.selectionStart;      // 重建前先把光标记下来
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchTimer = 0; refresh(); refocusSearch(caret); }, SEARCH_DEBOUNCE_MS);
});
/* ★ v5.0 想法页的搜索：**自己的词、自己的防抖、自己的焦点回填**。
   跟清单页那套完全平行、互不读写 —— 共用全局 S.q 会让两页互相污染。 */
let ideaSearchTimer = 0;
function refocusIdeaSearch(caret){
  requestAnimationFrame(() => {
    const el = document.getElementById('ideaSearch');
    if (!el) return;
    if (document.activeElement !== el) el.focus();
    const p = caret === undefined ? el.value.length : Math.min(caret, el.value.length);
    try { el.setSelectionRange(p, p); } catch (e){}
  });
}
view.addEventListener('input', e => {
  if (e.target.id !== 'ideaSearch') return;
  ideaUI.q = e.target.value;
  const caret = e.target.selectionStart;
  clearTimeout(ideaSearchTimer);
  ideaSearchTimer = setTimeout(() => { ideaSearchTimer = 0; refresh(); refocusIdeaSearch(caret); }, SEARCH_DEBOUNCE_MS);
});
/* ★ v5.0 第 3 批：设置页 AI 三格输入（key / 接口地址 / 模型名）。
   用 change 而不是 input —— 这三个都是"填完就走"的值，边打字边存会把半截 key 写进
   localStorage；change 在失焦或回车时触发，正好。key 单独存（不进 S、不进备份），
   另外两个进 S 跟着存档走。
   ★ 6B：三格搬进二级页「AI 连接」之后，落库逻辑抽成 aiFieldCommit；
   这里只留一句转发 —— 主列表里若还有同 id 的元素，行为与改动前逐字段一致。 */
view.addEventListener('change', e => {
  if (aiFieldCommit(e.target)) return;
});
view.addEventListener('keydown', e => {
  /* 清空要立刻生效（还带一个清空搜索的挂起定时器，否则它稍后会把刚清掉的词又填回去） */
  if (e.target.id === 'searchBox' && e.key === 'Escape'){
    clearTimeout(searchTimer); searchTimer = 0;
    S.q = ''; refresh(); refocusSearch(0);
    return;
  }
  /* 想法页搜索的 Escape：同样要**先清挂起的防抖**，否则它稍后会把刚清掉的词填回去 */
  if (e.target.id === 'ideaSearch' && e.key === 'Escape'){
    clearTimeout(ideaSearchTimer); ideaSearchTimer = 0;
    ideaUI.q = ''; refresh(); refocusIdeaSearch(0);
    return;
  }
  /* 分区标题是 role="button"，Enter / 空格 要能折叠。
     空格必须 preventDefault —— 不挡的话浏览器会当成"向下翻页"，页面会跳一下。 */
  const zf = e.target.closest && e.target.closest('[data-zfold]');
  if (zf && (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar')){
    e.preventDefault();
    zf.click();
  }
  /* ★ 0E：统计页五张卡与清单页那行入口同样是 role="button"（卡里还有大数字和药丸，
     不能用真的 <button> 包整块），Enter / 空格 要能进去。写法与上面分区标题一致。 */
  const sp = e.target.closest && e.target.closest('[data-statpage],[data-statentry]');
  if (sp && (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar')){
    e.preventDefault();
    sp.click();
  }
  /* ★ 5I：子想法那一行是 role="button" + tabindex=0（不能用真 <button> 包整行 ——
     行里还有 → / ↑ / ✕ 三枚按钮，嵌套按钮是非法结构）。键盘的 Enter / 空格
     走上面同一套写法，点出来的 click 由 #view 的委托接住。 */
  const sptx = e.target.closest && e.target.closest('[data-sparkedit]');
  if (sptx && (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar')){
    e.preventDefault();
    sptx.click();
  }
});

/* ★ 7B 真机修留痕（2026-10-11）：这里**不要**加"捕获阶段 stopPropagation"那种双保险。
   试过 —— `view.addEventListener('click', e => { if (e.target.closest('[data-zmenu]')) e.stopPropagation(); }, true)`
   会把事件**掐死在捕获阶段**，`⋯` 自己的 onclick 与下面委托里的 data-zmenu 分支都收不到，
   面板就再也不开了（实测 trace 只剩 document-capture 与 view-capture 两行，之后什么都没有）。
   真因是 CSS：`.zone>header::after` 那条绝对定位热区伪元素画在静态子元素之上、把 `⋯` 整个盖住
   （`elementFromPoint(⋯中心)` 返回 HEADER，手指那一下落到了标题栏 ⇒ 折叠）。
   正解是在 `.zmenu` 上加 position+z-index（见上面 .zmenu 那段注释），
   再靠下面委托里"更具体的分支排在前面"兜一层。判断事件能不能到，
   用 `document.elementFromPoint(中心)` 的返回，不要靠肉眼看层序、也不要靠再加拦截。 */
view.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-tag],[data-f],[data-lay],[data-set],[data-zfold],[data-theme],[data-listmode],[data-capzone],[data-aipriv],[data-haptic],[data-datepart],[data-statpage],[data-statback],[data-statentry],[data-jump],[data-zmenu],[data-zoneadd],[data-zoneopt],[data-zpick]');
  /* ★ 7B：卡片右下那枚「在哪一栏」的 chip —— 点它换一栏（= 一次教学信号）。
     必须**留在上面那串选择器之外**：它一旦挂 data-act，长按手势的排除名单就会把它吃掉
     （与 5I 给 .sp-tx 留的那条口子同一个理由）。 */
  const zpick = e.target.closest ? e.target.closest('[data-zpick]') : null;
  if (zpick){
    const zi = S.items.find(x => x.id === zpick.dataset.zpick);
    if (zi){ zoneTeachPick(zi); return; }
  }
  /* ★ 5I：子想法那一行的文字（.sp-tx[data-sparkedit]）点一下就能改。
     必须**留在上面那串选择器之外**：长按手势的排除名单只认 `[data-act]`，
     一旦给它挂 data-act，这一行从此再也长按不了（旧行为是长按整张卡出菜单）。 */
  const spTx = e.target.closest ? e.target.closest('[data-sparkedit]') : null;
  if (spTx){
    const spCard = spTx.closest('.idea-card');
    const spSeed = spCard ? spCard.querySelector('.item.seed[data-id]') : null;
    const spIt = spSeed ? S.items.find(x => x.id === spSeed.dataset.id) : null;
    if (spIt && !(e.target.closest && e.target.closest('button'))){
      openSparkEdit(spIt, +spTx.dataset.sparkedit);
      return;
    }
  }
  if (!el) return;

  /* ★ 7B 真机修（2026-10-11）：**更具体的必须排在"容器"之前**。
     `⋯` 长在 `<header data-zfold>` 里，而上面那串选择器同时收 `[data-zfold]` 与 `[data-zmenu]`；
     `closest()` 从 `⋯` 往上爬拿到的是**外层 header**，于是 `el.dataset.zmenu` 永远 undefined、
     先撞上 `data-zfold` 分支 → 点「⋯」变成**把这一栏折叠**（用户真机原话：
     "点不了，直接就展开了详细的待办"）。之前 `_7b-dom` 用 `el.click()` 直接在 `⋯` 上派发，
     目标就是 `⋯` 本体、不走这段 closest 逻辑，所以假绿。现在把 ⋯ / 面板项 / 新建分区
     这三样挪到最前面，与"卡片里那枚 chip 必须留在选择器之外"同一条纪律。 */
  if (el.dataset.zmenu !== undefined){
    const btn = el, k = el.dataset.zmenu;
    if (document.getElementById('zmenuPop')) closeZoneMenu();
    else openZoneMenu(btn, k);
    return;
  }
  if (el.dataset.zoneadd !== undefined){ zoneAddOpen(); return; }
  if (el.dataset.zoneopt !== undefined) return;   // 面板里的动作由它自己的监听处理（见 openZoneMenu）

  /* ★ 0E：清单页底部那块「已完成」折叠区整块撤掉了 —— 连它的展开 / 收起分支一起删。
     （原来这里读写的 S.doneOpen 也一并清掉了，不留"字段还在但没人读"的孤儿。） */

  /* 分区折叠（长期 / 短期 / 循环 / 考虑）：复用 .zone 高度过渡（foldZoneWithMotion），
     就地切换、不走 refresh()。走 refresh() 的话整页重建会闪、滚动位置也会跳，
     跟设置页那个开关同一个道理。折叠态存进 S.foldedZones，刷新或重开仍保持收起。
     ⚠️ 这一支必须留在 zmenu / zoneadd / zoneopt **之后**（见上面那段 7B 真机修）。 */
  if (el.dataset.zfold !== undefined){ foldZoneWithMotion(el); return; }

  /* 主题三档（浅色 / 深色 / 跟随系统）：在设置页点 .segbtn[data-theme] 切换。
     不整页刷新（否则设置页会闪），直接就地同步同组三档的 on / aria-pressed。 */
  if (el.dataset.theme !== undefined){
    applyTheme(el.dataset.theme, true);
    const seg = el.closest('.seg');
    if (seg) seg.querySelectorAll('.segbtn').forEach(b => {
      const on = b.dataset.theme === S.theme;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    syncSegPills(true);              // 主题这一档也走同一套换挡动画
    return;
  }

  /* ★ v5.0 第 3 批：AI 隐私三档（关闭 / 只发标题 / 发全文）。
     和主题同款的分段控件 —— 就地换挡后再 refresh 把说明文字（还剩几次、key 掩码）更新掉。
     关闭是**真关闭**：下一帧开始，任何入口都不会再发请求（见 aiOn 的调用点）。 */
  if (el.dataset.aipriv !== undefined){
    const v = el.dataset.aipriv;
    S.aiMode = (v === 'title' || v === 'full') ? v : 'off';
    save(); refresh();
    toast(S.aiMode === 'off' ? 'AI 已关闭：以后一个字都不出这台手机'
      : (S.aiMode === 'title' ? 'AI 已打开：只把标题发出去' : 'AI 已打开：标题、原文和时间轴都会发出去'));
    return;
  }

  /* ★ v5.1.2：想法卡日期显示哪几段（年/月/日 三颗圆键，各自独立）。
     **不整页 refresh** —— 设置页一重建，刚拨的那颗就换了节点、手感会断；
     就地改类名/aria-pressed，再把那行灰字里的实时预览换掉就够了。
     想法页的卡片下次渲染时自然按新口径出日期。 */
  if (el.dataset.datepart !== undefined){
    const p = el.dataset.datepart;
    if (p === 'y' || p === 'm' || p === 'd'){
      S.dateShow[p] = !S.dateShow[p];
      save();
      el.classList.toggle('on', S.dateShow[p]);
      el.setAttribute('aria-pressed', S.dateShow[p] ? 'true' : 'false');
      const pv = document.getElementById('datePrev');
      if (pv) pv.textContent = dateText('2026-10-04') || '（不显示）';
    }
    return;
  }
  /* ★ v5.1.2：震动档位。跟主题同款的分段控件 —— 就地换挡 + 让滑块滑过去，
     并且**立刻按新档位震一下**：选「强」当场就知道强在哪，不用去别处试。 */
  if (el.dataset.haptic !== undefined){
    const v = el.dataset.haptic;
    S.haptic = ['off', 'low', 'std', 'high'].includes(v) ? v : 'std';
    save();
    const seg = el.closest('.seg');
    if (seg) seg.querySelectorAll('.segbtn').forEach(b => {
      const on = b.dataset.haptic === S.haptic;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    syncSegPills(true);
    buzz(45);                    // 试震：选「关」时 buzz 自己会返回，不会有动静
    return;
  }

  /* 清单页「分区 ⇄ 时间轴」分段控件：两档互斥（S.listMode），共用搜索与筛选。
     它嵌在清单工具栏里，refresh() 重建后会自带正确的 on 态，所以这里直接刷新即可。 */
  if (el.dataset.listmode !== undefined){
    const mode = el.dataset.listmode === 'timeline' ? 'timeline' : 'zone';
    if (mode === S.listMode) return;                    // 已经是这一档 → 不折腾
    /* 「同一批条目换了排法」，不是换内容 —— 所以走 FLIP（见 swapContent 的说明）：
       每条待办被"搬"到新位置、标题/日期/标签各自归位，全程不淡出。
       这里不能用 refresh()：它是 rAF 延迟的，DOM 下一帧才换，FLIP 量不到新布局。 */
    swapContent(() => {
      S.listMode = mode; save();
      ANIM = false;                 // 入场动画让位给 FLIP，别两套一起上
      renderList();
      renderFilters();
      syncSegPills(true);           // 分段控件的滑块同时换挡
    }, { flip: true, dur: 520, fade: true });
    return;
  }

  /* 按钮自身可能不带 data-id（id 在外层 .item / .hwcard 容器上），向上找一层 */
  const id = el.dataset.id || el.closest('[data-id]')?.dataset.id;
  const it = id ? S.items.find(x => x.id === id) : null;
  /* ★ v5.0：从回顾抽屉里点出来的动作 = 这条被"过"了一次。
     记 reviewedAt（近 7 天不再浮出）+ 把今天标成用过想法页（影响抽屉的折叠档位）。
     放在这里而不是各动作内部：抽屉里的按钮复用的就是全站那几个动作，
     逐个改会漏；挂 data-rev 标记只在抽屉渲染时加，一处判断就够。 */
  if (el.dataset.rev && it){
    it.reviewedAt = ymd(new Date()); S.ideaUsedAt = ymd(new Date()); save();
    /* 续写（sparkadd）要等真正写入一条 spark 才算处理过 —— 那条由 seedAddSpark 记账。 */
    if (el.dataset.act !== 'sparkadd') reviewMark(it.id);
  }

  /* 统计页布局：横条 / 方块。只换视图内部，不走 refresh()，省得整页重排。
     同样走两段式过渡，跟「分区 ⇄ 时间轴」是同一套手感。 */
  if (el.dataset.lay !== undefined){
    const lay = el.dataset.lay === 'tile' ? 'tile' : 'card';
    if (lay !== S.statLayout){
      /* 同理走 FLIP：卡片从"宽条"被拉成"方块"、大数字各自归位，而不是整页重画。 */
      swapContent(() => {
        S.statLayout = lay; save();
        ANIM = false;
        renderStat();
        syncSegPills(true);
      }, { flip: true, dur: 520, fade: true });
    }
    return;
  }
  /* ★ 0E：统计页的五张卡 → 进对应子页；子页的「← 返回」→ 回统计首页。
     都是**就地替换**（不新增浮层、不新增 S.view），统一走 statGo 这一个入口。
     ★ 0G：返回的目标由 statFrom 决定（从清单页进来的回清单页），逻辑收在 statGo 里。 */
  if (el.dataset.statpage !== undefined){ statGo(el.dataset.statpage); return; }
  if (el.dataset.statback !== undefined){ statGo(null); return; }
  /* ★ 0G：长列表跳转钮。方向由滚动监听算好存在 sjDir 里，这里只负责"跳"。
     先隐去再滚：smooth 滚动期间滚动事件会把方向判成 down（y 在增大），留在屏上会闪一下。 */
  if (el.dataset.jump !== undefined){
    const maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    statJumpHide();
    try { window.scrollTo({ top: sjDir === 'down' ? maxY : 0, behavior: 'smooth' }); }
    catch (e){ window.scrollTo(0, sjDir === 'down' ? maxY : 0); }
    return;
  }
  /* ★ 0E：清单页那行「今天已完成 N 条」→ 统计页的「今日完成」子页。
     它真的换了视图（list → stat），所以走 goView 这个唯一入口；子页由 opts.statPage
     点名 —— goView 里"每次换页都回统计首页"那条兜底才不会把它一起抹掉。
     ★ 0G：带上来处 from:'list' —— 子页的「返回」要回清单页（用户定的"记住来处"）。 */
  if (el.dataset.statentry !== undefined){ goView('stat', { statPage: 'today', from: 'list' }); return; }
  /* 设置页的外观开关。同样不走 refresh()：显示的显隐交给 body[data-help]，
     所以这里只要改状态 + 同步 aria-checked，页面一帧都不会跳。 */
  if (el.dataset.set !== undefined){
    if (el.dataset.set === 'help'){
      S.showHelp = !S.showHelp;
      save();
      applyHelp(true);          // ★ v5.2：撑开/收回，而不是整页瞬移（见 applyHelp 的注释）
      el.setAttribute('aria-checked', S.showHelp ? 'true' : 'false');
    }
    /* ★ v5.0 想法回顾总开关。关掉后想法页顶部**不出现**抽屉 ——
       调研 02 §6 的结论是"只在页内手动翻的回顾一定不会被用"，所以默认开；
       但给一个关的出口，免得不想被推的人只能忍着。 */
    else if (el.dataset.set === 'ideaReview'){
      S.ideaReview = !S.ideaReview; save();
      el.setAttribute('aria-checked', S.ideaReview ? 'true' : 'false');
      ideaUI.reviewOpen = null;                     // 重开后回到"按频率自动"
      applyHelp(); refresh();
      toast(S.ideaReview ? '想法回顾已打开' : '想法回顾已关闭');
    }
    /* 流畅模式：改之前那颗 ⚡ 的行为一样 —— 手动选择记进 localStorage，
       以后即使自动检测认为"你是真 GPU"也尊重用户的手动选择（见 currentLite）。
       状态不另存，直接以 html.soft-render 为准，避免两处状态打架。 */
    else if (el.dataset.set === 'lite'){
      const on = !document.documentElement.classList.contains('soft-render');
      try { localStorage.setItem(LITE_KEY, on ? 'on' : 'off'); } catch (e){}
      applyLite(on);
      el.setAttribute('aria-checked', on ? 'true' : 'false');
      toast(on ? '已开启流畅模式（更省性能）' : '已切回完整视觉');
    }
    /* 语音输入：只存开关；真正申请权限 / 起识别都在"长按圆钮"那一刻才发生（见 startVoiceIfAllowed）。
       打开时顺手测一下设备端离线识别是否可用，不可用就给一句明白提示，免得用户以为开了就能用。 */
    else if (el.dataset.set === 'voice'){
      S.voice = !S.voice; save();
      el.setAttribute('aria-checked', S.voice ? 'true' : 'false');
      if (S.voice && !voiceReady()) toast('当前设备不支持离线语音，长按仍走键盘输入');
      else toast(S.voice ? '已开启语音输入（长按圆钮说话）' : '已关闭语音输入');
    }
    /* ★ 0B（决策 2）：子任务全勾完是否自动完成父任务。默认关，
       真正的连动逻辑在 toggleDone → parentAutoDone，这里只存开关 + 回执。 */
    else if (el.dataset.set === 'autoDoneParent'){
      S.autoDoneParent = !S.autoDoneParent; save();
      el.setAttribute('aria-checked', S.autoDoneParent ? 'true' : 'false');
      toast(S.autoDoneParent ? '开着：子任务做完，父任务会跟着打勾' : '关着：子任务归子任务，父任务要自己勾');
    }
    /* ★ 阶段1 提醒总开关。关掉 = 把已经排出去的**全部**撤掉（notifyReconcile 里那条
       "库里其余的一律撤掉"），打开 = 按当前数据全量重排。两个方向都只走这一个入口 ——
       页面侧算时间的地方只有 syncNotify（硬约定 7）。 */
    else if (el.dataset.set === 'notify'){
      S.notify = !S.notify; save();
      el.setAttribute('aria-checked', S.notify ? 'true' : 'false');
      refreshNotifyPerm();
      refreshNotifyExact();
      const n = notifyReconcile();
      if (!notifyBridge()) toast('这个壳没有通知桥：网页版 / iPhone 上不弹系统通知');
      else if (S.notify) toast(n ? ('已打开提醒 · 排了 ' + n + ' 条') : '已打开提醒 · 现在还没有写了日期的条目');
      else toast('已关闭提醒，排出去的都取消了');
    }
    /* ★ 5A：锁屏全屏响铃（闹钟档）。只改"到点怎么响"，不动任何排期 ——
       所以这里**不叫** notifyReconcile（排期真相源仍然只有 syncNotify 那一处）。
       开关写进原生侧（到点弹通知的是 NotifyReceiver，那时页面可能没起来）。 */
    else if (el.dataset.set === 'alarmfull'){
      const nx = !notifyAlarmFull();
      if (setNotifyAlarmFull(nx)){
        el.setAttribute('aria-checked', nx ? 'true' : 'false');
        refreshNotifyExact();
        toast(nx ? '开着：锁屏时会弹出响铃页' : '关着：只发一条通知，声音跟随手机的静音 / 震动 / 响铃');
      } else toast('这个壳没有通知桥');
    }
    /* v3.4 系统语音（备用路线）：只在设备端离线不可用时才会真的被走到。 */
    else if (el.dataset.set === 'voiceSystem'){
      S.voiceSystem = !S.voiceSystem; save();
      el.setAttribute('aria-checked', S.voiceSystem ? 'true' : 'false');
      toast(S.voiceSystem
        ? (voiceReady() ? '已开启系统语音（本机支持离线识别，仍优先走离线）'
                        : '已开启系统语音：长按圆钮将改用系统语音服务，可能联网')
        : '已关闭系统语音');
    }
    return;
  }
  /* 筛选栏：多选开关。点标签切换选中，点最前面的「全部/清空」一次清空 */
  if (el.dataset.f !== undefined && el.classList.contains('pill')){
    const t = el.dataset.f;
    if (!t) S.filterTags = [];
    else {
      const k = S.filterTags.indexOf(t);
      k >= 0 ? S.filterTags.splice(k, 1) : S.filterTags.push(t);
    }
    filterPulse = t || null;   // 让重画出来的那颗补一段入场（否则选中态是硬切）
    refresh(); return;
  }
  if (el.dataset.tag && it){
    const t = el.dataset.tag, i = it.tags.indexOf(t);
    if (i >= 0) it.tags.splice(i, 1); else it.tags.push(t);
    save(); refresh(); return;
  }
  const act = el.dataset.act;
  /* ---- 随手记 / 种子（v3.50）----
     这一组 action 全部只可能出现在想法页或编辑器里，和待办的 tick/del/edit 不冲突。
     顺序放在待办那几行之前：seeduse 与 tick 长得像，先拦住，免得种子误入待办的 CRT 退场。 */
  if (act === 'pick' && it){
    if (ideaUI.mergeSel.has(it.id)) ideaUI.mergeSel.delete(it.id);
    else ideaUI.mergeSel.add(it.id);
    refresh(); return;
  }
  if (act === 'mergestart'){ ideaUI.mergeMode = true; ideaUI.mergeSel.clear(); refresh(); return; }
  if (act === 'mergecancel'){ ideaUI.mergeMode = false; ideaUI.mergeSel.clear(); refresh(); return; }
  /* ---------------- ★ v5.0 多选批量的动作（第 2 批第 1 块） ----------------
     四种「逐条」动作走队列（batchStart）；三种「一次性」动作在这里直接做完。
     为什么收起来 / 删除不进队列：它们没有"每条要填什么"的中间步骤，
     逐条反而慢；一次性做完 + 一个撤销就够。 */
  if (act === 'batchmerge'){
    const ids = [...ideaUI.mergeSel];
    ideaUI.mergeMode = false; ideaUI.mergeSel.clear(); refresh();
    seedMergeBegin(ids);
    return;
  }
  if (act === 'batchuse'){
    const list = S.items.filter(x => ideaUI.mergeSel.has(x.id) && isSeed(x) && !x.done);
    if (!list.length){ toast('选中的都已经收起来了'); return; }
    const old = list.map(x => [x, x.done, x.doneAt]);
    list.forEach(x => { x.done = true; x.doneAt = Date.now(); });
    ideaUI.mergeMode = false; ideaUI.mergeSel.clear(); save(); refresh();
    toast('收起来 ' + list.length + ' 条', '撤销', () => {
      old.forEach(a => { a[0].done = a[1]; a[0].doneAt = a[2]; });
      save(); refresh();
    });
    return;
  }
  if (act === 'batchdel'){
    const list = S.items.filter(x => ideaUI.mergeSel.has(x.id) && isSeed(x));
    if (!list.length) return;
    const keep = S.items.slice();
    S.items = S.items.filter(x => list.indexOf(x) < 0);
    /* 被删掉的可能是别人的父节点 → 下面那层上浮为根，**不级联删** */
    sanitizeParents();
    ideaUI.mergeMode = false; ideaUI.mergeSel.clear(); save(); refresh();
    toast('删掉 ' + list.length + ' 条', '撤销', () => { S.items = keep; save(); refresh(); });
    return;
  }
  if (act === 'batchpromote'){ batchStart('promote'); return; }
  if (act === 'batchedit'){ batchStart('edit'); return; }
  if (act === 'batchspark'){ batchStart('spark'); return; }
  if (act === 'batchgrow'){ batchStart('grow'); return; }
  if (act === 'gesturehelp'){ openGestureHelp(); return; }
  /* ★ v5.0 示例数据：只加不盖、每条带 demo 标记、一键清只删带标记的（见 demoFill 上方注释） */
  if (act === 'demofill'){ demoFill(); return; }
  if (act === 'democlear'){ demoClear(); return; }
  /* ★ v5.0 主视图切换：清单页/统计页那套 .seg 分段开关（用户要求"跟它们差不多"）。
     两个按钮各带一个确定的目标值（data-lay），不是"点一下就翻面"——
     分段开关的语义是**选一个**，不是**切一下**；两者在无障碍上也不一样（aria-pressed vs 无状态）。
     视图态（平移/缩放）是会话级的，切过去时复位一次，免得看到上一次留下的奇怪位移。 */
  if (act === 'layoutset'){
    /* ⚠️ 用 data-idealay，**不能复用 data-lay** —— 那是统计页布局开关的属性，
       上面 `el.dataset.lay !== undefined` 那条分支会先把它截走，这里永远轮不到。 */
    const want = el.dataset.idealay === 'tree' ? 'tree' : 'list';
    if (want === S.ideaLayout || layoutBusy) return;
    /* 先把分段开关的滑块**原地**换挡（清单/统计那套慢—快—慢），等它滑完再重渲染画面。
       立刻 refresh() 会把刚建好的滑块整块换掉 —— 动画就没了，那就只是"长得像"，不是"用着一样"。 */
    const seg = el.closest('.seg');
    if (seg) seg.querySelectorAll('.segbtn').forEach(b => {
      const on = b === el;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    syncSegPills(true);
    layoutBusy = true;
    S.ideaLayout = want;
    ideaUI.mergeMode = false; ideaUI.mergeSel.clear(); ideaUI.reviewOpen = false;
    treeView.tx = 0; treeView.ty = 0; treeView.k = 1;
    treeFitted = false;        // ★ v5.0：进树状图才 fit 一次；折叠/重渲染不再动你的视角
    if (want !== 'tree') setTreeFull(false);   // 切回卡片流时退出全屏，免得屏幕一直锁着
    save();
    /* ★ 审查修复（2026-10-04）：减弱动态效果时那 200ms 是纯空窗（什么都不会动），
       等它只是卡手。 */
    setTimeout(() => {
      layoutBusy = false;
      refresh();
      toast(want === 'tree' ? '树状图：拖动平移 · 双指缩放 · 底部可全屏' : '卡片流：能缩进、能就地续写');
    }, reduceMotion() ? 0 : 200);
    return;
  }
  /* 树状图里折叠/展开一个节点的下面（复用会话级 collapsed，和卡片流的 ▾ 同一个状态） */
  if (act === 'treefull'){ setTreeFull(!treeFull); return; }
  /* ★ 审查修复（2026-10-04）：§6.3 的「适应屏幕」 —— 拖乱 / 缩没了之后原来没有任何复位入口；
     以及树里收起一条之后，树只画在用的，同屏没有"继续想"的入口（两处语义不一致）。 */
  if (act === 'treefit'){ treeView.tx = 0; treeView.ty = 0; treeView.k = 1; treeFitted = false; refresh(); return; }
  if (act === 'treeused'){
    S.ideaLayout = 'list'; ideaUI.mergeMode = false; ideaUI.mergeSel.clear();
    setTreeFull(false); save(); refresh();
    setTimeout(() => {
      const grp = view.querySelector('.idea-list.used');
      if (grp) grp.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 80);
    return;
  }
  if (act === 'tnfold'){
    const id = el.dataset.id;
    if (!id) return;
    if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
    refresh(); return;
  }
  if (act === 'seednew'){ openSeedNew(); return; }
  /* ---- ★ v5.0 第 3 批：AI 的入口 ----
     三个都是**手动**入口；自动关联扫描走 aiMaybeAutoScan（打开 App 时那条路）。
     出口一律先过 aiOn()：关着的时候连一次请求都不会发。 */
  if (act === 'suggestopen' && it){ openSuggestSheet(it); return; }
  if (act === 'aitest'){ aiTestSelf(); return; }
  if (act === 'aiscan'){ aiScanLinks(true); return; }
  if (act === 'aiprune'){ aiPrune(); return; }
  if (act === 'aipaste'){ aiPasteKey(); return; }
  if (act === 'aishowkey'){ aiToggleKeyShow(); return; }
  /* ★ 7B：清空行为学习学到的词。**只清学习记录，不动分区表、不动条目** ——
     用户看到的黑箱抱怨必须有一个"一键回到没学过"的出口。 */
  if (act === 'zonehintclear'){
    const n = Object.keys(S.zoneHints || {}).length;
    if (!n){ toast('还没有学到东西'); return; }
    uiConfirm('清空学到的分区？',
      '它会忘掉这 ' + n + ' 条"哪个词归哪一栏"的记录。分区本身和里面的条目不受影响。',
      '清空',
      () => { zoneHintClear(); refresh(); toast('已清空学到的 · 以后重新学'); });
    return;
  }
  /* ---- ★ v5.0 想法页自己的标签筛选（不碰清单页的 S.filterTags）---- */
  if (act === 'ideatag'){
    const tg = el.dataset.tag;
    const i = ideaUI.tags.indexOf(tg);
    if (i >= 0) ideaUI.tags.splice(i, 1); else ideaUI.tags.push(tg);
    refresh(); return;
  }
  if (act === 'ideatagclear'){ ideaUI.tags = []; refresh(); return; }
  /* ★ 6B：主列表那行 AI 状态 → 二级页「AI 连接」。
     它**不新增浮层**：openAiPanel 在现有 #mask/.modal 里铺一层 absolute 面板
     （照 openParentPicker 的形态）。 */
  if (act === 'aipanel'){ openAiPanel(); return; }
  /* ★ v5.0：设置页每栏的折叠开关。**就地切换、不整页重渲染** —— 展开会改变页面高度，
     走 refresh 之后滚动位置会跳一下，用户刚点开的那一栏可能已经不在指尖下了。
     ★ v5.2：展开/收起改成"高度撑开"（和「页面说明文字」共用 revealAnim）。
     高度必须在**切换类之前**量：收起态自己被压到 0，要收的那个高度量不到；展开态用
     scrollHeight（收起时它照样是内容高度）。 */
  if (act === 'setfold'){
    const key = el.dataset.key || '';
    const i = S.setOpen.indexOf(key);
    if (i >= 0) S.setOpen.splice(i, 1); else S.setOpen.push(key);
    save();
    const nowOpen = S.setOpen.indexOf(key) >= 0;
    const card = el.closest('.set-card');
    const body = card && card.querySelector('.set-body');
    /* 量内容高：把 max-height 临时放开量一次（同 setToolsOpen 的手法）。收起态被压成 0 高，
       直接量只能得到 0；而展开方向要的就是"展开后该有多高"。全程在同一个任务里，不会绘制。 */
    let h = 0, mt = '0px';
    if (body){
      const was = body.style.maxHeight;
      body.style.maxHeight = 'none';
      h = Math.ceil(body.offsetHeight);
      body.style.maxHeight = was;
      mt = getComputedStyle(body).marginTop;
    }
    if (card) card.classList.toggle('open', nowOpen);
    el.setAttribute('aria-expanded', nowOpen ? 'true' : 'false');
    revealAnim(body, nowOpen, h, mt);
    /* ★ 0D.3：设置页收起态要把页脚灰字摆到「关于」块与基准线的中点、并把页脚留白收掉
       （展开态再交回正常流）。这个类切换不会触发 #view 的 MutationObserver，
       所以要自己叫一次；高度在 REVEAL_MS(300ms) 里是连续变的，动画跑完再补一次。 */
    if (window.__syncBarFit){
      window.__syncBarFit();
      setTimeout(window.__syncBarFit, REVEAL_MS + 60);
    }
    return;
  }
  /* ★ 6C：「没写时间的条目默认去哪」——设置行现在只是一枚"当前值 + ›"的按钮。
     真正的选项在 openCapZoneSheet() 的底部面板里，而面板住在 #modal，
     **走不到这里的委托**（委托挂在 #view 上）→ 面板内的选项自己挂 onclick。
     这里保留一条兜底分支：任何还带 [data-capzone] 的元素照样能用，
     两处共用 setCaptureZone() 这一个写入口。 */
  if (act === 'capzoneopen'){ openCapZoneSheet(); return; }
  if (el.dataset.capzone !== undefined){ setCaptureZone(el.dataset.capzone); return; }
  /* ---- ★ v5.0 回顾抽屉 ---- */
  if (act === 'reviewtoggle'){
    const cur = ideaUI.reviewOpen === null ? (reviewDaysSinceUse() > 7) : !!ideaUI.reviewOpen;
    ideaUI.reviewOpen = !cur; refresh(); return;
  }
  if (act === 'reviewdone'){
    S.ideaReviewDone = ymd(new Date()); save(); ideaUI.reviewOpen = null;
    ideaUI.reviewHandled = new Set();
    refresh(); toast('今天就这样'); return;
  }
  if (act === 'reviewpurge'){
    /* 抽屉里那行「清掉已收起的 N 条」＝真正的淘汰动作。
       调研 02 §7 的第三条必要条件：「必须有淘汰动作 —— 没有淘汰机制的池子一定变成垃圾场」。
       走 toast 撤销，不做批量硬删。 */
    const gone = S.items.filter(i => isSeed(i) && i.done);
    if (!gone.length){ toast('没有可清的'); return; }
    const keep = S.items.slice();
    S.items = S.items.filter(i => !(isSeed(i) && i.done));
    /* 被清掉的可能是别人的父节点 → 子节点上浮为根，**不级联删** */
    sanitizeParents();
    save(); refresh();
    toast('清掉 ' + gone.length + ' 条已收起的', '撤销', () => { S.items = keep; save(); refresh(); });
    return;
  }
  /* ★ v5.0：折叠/展开一条有子想法的卡片。状态走会话级 collapsed Set（与会话同生命，
     和清单页复合目标那套是同一个 —— App 里"折叠"从来不持久化）。 */
  if (act === 'fold' && it){
    /* ★ 审查修复（2026-10-04）：这里原来 refresh() 硬切，而同一个 action 在下面还有一份
       `foldWithMotion(el, it)` 分支（永远轮不到 = 死代码，已删）。现在统一走动画：
       §10 要求「子树高度→0、卡片位移 220ms」，foldWithMotion 里就是这套。 */
    foldWithMotion(el, it); return;
  }
  /* ★ v5.0：「考虑区」老数据一键搬进想法。搬完原待办删除（整批可撤销）。
     种子第一步 = 原条目的 raw，日期用它的创建日期 —— 这样时间轴从它被写下那天算起，
     而不是搬家那天。 */
  if (act === 'consider2seed'){
    const olds = S.items.filter(i => i.zone === 'consider');
    if (!olds.length){ toast('考虑区已经空了'); refresh(); return; }
    const made = [];
    olds.forEach(old => {
      const nx = newSeed(old.title, {
        sparks: [{ at: ymd(new Date(old.createdAt || Date.now())), text: old.raw || old.title }],
        tags: [...(old.tags || [])], pri: old.pri || 0
      });
      if (nx) made.push({ nx, old });
    });
    made.forEach(m => { const i = S.items.indexOf(m.old); if (i >= 0) S.items.splice(i, 1); });
    save(); refresh();
    toast('搬进想法 ' + made.length + ' 条', '撤销', () => {
      made.forEach(m => {
        const i = S.items.indexOf(m.nx); if (i >= 0) S.items.splice(i, 1);
        S.items.push(m.old);
      });
      save(); refresh();
    });
    return;
  }
  if (act === 'seeduse' && it){ seedUse(it); return; }
  if (act === 'sparkadd' && it){
    /* ★ 审查修复（2026-10-04）：树状图里**没有卡片，也就没有那行就地输入框**。
       长按菜单那条路早就补了树分支（openSeedSheet 里），但 #view 委托这条没跟上 ——
       回顾抽屉的「＋ 续写」正走这条路，于是切到树状图之后点它"什么都不会发生"。
       两条路现在按同一个判断走。 */
    if (S.ideaLayout === 'tree'){
      openSeedPrompt('续写', it.title, '现在多了什么信息？',
        v => { if (seedAddSpark(it, v)) refresh(); });
      return;
    }
    /* 就地展开输入框，不弹窗 —— 续写是"顺手添一句"，打断越少越好。
       同一时刻只开一个：先把它记成当前打开的那条，再整页重渲染，renderIdeas 会把焦点还回来。 */
    ideaUI.sparkOpen = it.id;
    refresh(); return;
  }
  if (act === 'sparkcancel'){ ideaUI.sparkOpen = null; refresh(); return; }
  if (act === 'fork' && it){ openSeedPrompt('从「' + it.title + '」生长', '新的想法第一句', '从这里分出去的那条', v => {
      const nx = seedGrow(it, v);
      if (nx){ refresh(); toast('长出一条新想法', '撤销', () => { remove(nx); }); }
    }); return; }
  if (act === 'promote' && it){ openSeedPromote(it); return; }
  if (act === 'gototask' && it){
    const t = it.promoted && S.items.find(x => x.id === it.promoted);
    if (!t){ toast('那条待办已经删掉了，想法还在'); return; }
    /* ★ 阶段1：滚动定位那段抽成了 jumpToTask()（通知点击走同一份实现，不另写一套）。 */
    jumpToTask(t.id);
    return;
  }
  /* ★ 阶段1：通知权限被明确拒绝之后，唯一能把提醒救回来的入口 —— 跳系统「本应用详情」页。
     这里只负责转发给原生桥；没有桥（网页版 / iPhone）时给一句人话，不静默也不报错。 */
  if (act === 'notifyopen'){
    const b = notifyBridge();
    if (b && typeof b.openNotifySettings === 'function'){
      try { b.openNotifySettings(); } catch (_){}
    } else toast('这个壳没有通知设置入口');
    return;
  }
  /* ★ 4C：精确闹钟在系统设置里的开关页。页面侧只负责转发 ——
     "拿不拿得到、要不要用精确"仍然全在原生侧（与「未授权 + 去设置」同一条约定）。 */
  if (act === 'exactopen'){
    const b = notifyBridge();
    if (b && typeof b.openExactSettings === 'function'){
      try { b.openExactSettings(); } catch (_){}
    } else toast('这个壳没有精确闹钟设置入口');
    return;
  }
  /* ★ 5A：系统的「全屏通知」开关页（Android 14+ 才有这一页）。只在
     「锁屏全屏响铃」开着、系统又没给权限时才露这个按钮 —— 关着时那条路不碰全屏 Intent。 */
  if (act === 'fullopen'){
    const b = notifyBridge();
    if (b && typeof b.openFullScreenSettings === 'function'){
      try { b.openFullScreenSettings(); } catch (_){}
    } else toast('这个壳没有全屏通知设置入口');
    return;
  }
  /* ★ 5C：系统的「电池优化」列表页 —— 用户把鱼事设成"不受限制"，闹钟才不会被省电档推迟。
     只做深链，不申请 REQUEST_IGNORE_BATTERY_OPTIMIZATIONS（那是新权限）。 */
  if (act === 'batteryopen'){
    const b = notifyBridge();
    if (b && typeof b.openBatterySettings === 'function'){
      try { b.openBatterySettings(); } catch (_){}
    } else toast('这个壳没有电池设置入口');
    return;
  }
  /* ★ 5I：点「记下」= 这条记完了 —— 收起输入框 + 卡片留在原位（两条出口共用一个收尾）。 */
  if (act === 'sparkok'){
    const inp = document.getElementById('sp_in');
    if (inp && it && seedAddSpark(it, inp.value)) finishSparkWrite(it.id);
    return;
  }
  if (act === 'sparkdel' && it){
    const i = +el.dataset.i;
    if (Array.isArray(it.sparks) && i >= 0 && i < it.sparks.length){
      /* 撤销：把删掉那一步**插回原位**，而不是追加到末尾 —— 时间轴是有顺序的 */
      const gone = it.sparks.splice(i, 1)[0];
      save(); refresh();
      toast('删掉一步', '撤销', () => { it.sparks.splice(i, 0, gone); save(); refresh(); });
    }
    return;
  }
  /* ★ v5.0 部分转化（1.12）：把时间轴上的**某一句**变成一条待办。
     走的是同一个立项确认页，只是标题预填那一句 —— 种子留下，只有这一步被打标。 */
  if (act === 'sparkpromote' && it){
    const i = +el.dataset.i;
    const sp = (Array.isArray(it.sparks) ? it.sparks : [])[i];
    if (sp) openSeedPromote(it, sp.text, i);
    return;
  }
  /* ★ v5.0 双向活链的**写**这一半（1.13）：把某一步补到那条已立项的待办里。
     追加到待办的 raw 末尾，**原有内容逐字保留**；种子侧不改动。
     撤销存的是改之前那一整串 raw —— 按长度切片回退在中文/换行上很容易切错。 */
  if (act === 'sparkpush' && it){
    const i = +el.dataset.i;
    const sp = (Array.isArray(it.sparks) ? it.sparks : [])[i];
    const pushTo = it.promoted || it.lastPromoted;
    const task = pushTo && S.items.find(x => x.id === pushTo);
    if (!sp) return;
    if (!task){ toast('那条待办已经删掉了，想法还在'); return; }
    const oldRaw = task.raw;
    task.raw = (task.raw ? task.raw + '\n' : '') + sp.text;
    save(); refresh();
    toast('已补到「' + task.title + '」里', '撤销', () => { task.raw = oldRaw; save(); refresh(); });
    return;
  }
  if (act === 'tick' && it){ tickAskAndCommit(el, it); return; }
  /* ★ 5D：清单卡的 ✕ 走统一入口 —— 有子任务先问一句（一起删 / 只删这条），没子直接删。 */
  if (act === 'del' && it){ removeAskAndCommit(it, el); return; }
  if (act === 'edit' && it){ openEdit(it); return; }
  if (act === 'st' && it && it.hw){
    const s = el.dataset.s;
    it.hw.status = s;
    it.hw.submittedAt = s === 'submitted' ? ymd(new Date()) : null;
    if (s === 'submitted' && !it.done){ it.done = true; it.doneAt = Date.now(); }
    save(); refresh(); return;
  }
});

/* ==================== ★ 7B：分区的「教学信号」与清单页的「⋯」面板 ====================
   这一块是全卡最容易做错的地方，两条红线先写在前面：

   ① **改名绝不动 it.zone**。分区的主键是 k，name 只是显示 —— 用户改一次名，
      条目存的还是同一个 k，所以一条都不会掉进「未分组」。
   ② **删分区绝不删条目**。删分区只做两件事：把归属改成 ''（未分组）、清掉指向它的
      zoneHints。`zoneDelete()` 里没有一处 `S.items.splice/filter`，这是硬约束。

   教学信号有两个（用户 2026-10-11 定）：
     · 用户手动把一条待办挪到分区 X（清单页卡片上的 → 分区 一行，或编辑弹层里改分区）
     · 用户改了 AI 猜的分区（同一条路：AI 猜的会带 zoneBy，用户一改就落成教学信号）
   记法：取标题的 2-gram，每个 gram 在 S.zoneHints 里 +1（同一个词记到 2 次才开始预测，
   一次可能是误操作）。 */

/* 一次教学：把这条挪进 k，并记一笔。返回是否真的变了（没变就不记，避免"点开又点回同一栏"
   被算成两次教学）。 */
function zoneTeach(it, k, opts){
  if (!it || !it.id) return false;
  const to = (k === 'idea') ? 'idea' : (k === '' ? '' : (validZoneKey(k) ? k : ''));
  const from = it.zone;
  if (from === to) return false;
  const title = String(it.title || '');
  /* 先按编辑器的口径切换 kind（想法 ↔ 待办两个方向的字段清理都在 aiApplyZone 里，
     与 openItemEditor 的保存分支、taskToSeed 共用同一份 —— 不许在这里各写一套）。 */
  if (to === 'idea') aiApplyZone(it, 'idea');
  else if (from === 'idea') aiApplyZone(it, to);
  else it.zone = to;
  it.zoneBy = 'user';
  /* 只有搬进**真实分区**才算教学；挪去「未分组」/「想法」不记（那不是"这类内容归那栏"）。 */
  if (to && to !== 'idea' && title) zoneHintAdd(title, to);
  save();
  if (typeof notifyFire === 'function') notifyFire(it);
  return true;
}
/* 清单页卡片的 → 分区 一行、以及录入提示条末尾那枚按钮：开一个只做一件事的面板。 */
function zoneTeachPick(it){

  const rows = [];

    data-zpick=""><span class="zp-name">未分组</span><span class="zp-n"></span></button>`);

    rows.push(`<button type="button" class="btn ghost zpick${it.zone === z.k ? ' on' : ''}"

    <p class="confirm-msg">现在在「${esc(zoneNameOf(it.zone))}」。挪一次，我就记住「这类内容归这一栏」——
      相同的词见过两次之后，下次录入会直接猜它。</p>
    <div class="zpick-list">${rows.join('')}</div>

  openMask();

/* 编辑弹层里改分区也算一次教学（用户把 AI 猜的分区改掉，正是本卡点名的第二个教学信号）。 */
function zoneTeachFromEditor(it, before, after){
  if (before === after) return false;

/* 「⋯」面板里的四个动作。删除走二次确认，文案写清条数（绝不悄悄删条目）。 */

/* 打勾的确认 + 退场（v3.38 按用户指定的形态重做）：
   点击瞬间 → 绿勾弹一下 → 整条纵向压成一条线并亮一下（CRT 关机那道亮线）→ 往右退出；
   动画走完才落数据（所以数据只晚 ~520ms，撤销 toast 照旧）。
   连点用「按 id 记账」防 —— 全局锁会让第二下走到另一条分支，
   结果第二次 toggleDone 把刚完成的那条又翻回来（勾上又冒出来）。
   exitPending 是打勾与删除**共用**的一张表：同一条正在退场时，另一个按钮也不该响应。 */
const exitPending = new Set();
const EXIT_MS = 420;
/* ★ 0B：给 tickParentOnly 用的"这一次打勾的通用提示先别弹"开关（见 toggleDone 末尾）。
   它是**一次性**的：调用方在自己那段里置上、finally 清掉，不留全局残留。 */
let tickSilence = null;
/* ★ 0B.1 打勾的统一入口：勾**父任务**而它下面还有没做完的子任务时，先问一句。
   为什么闸门放在这里而不放进 toggleDone：
     · toggleDone 是"数据层"，此刻 DOM 已经不能安全改（调用点可能刚跑完退场动画）；
     · 提示必须**早于**退场动画 —— 先播动画再问，用户看到的是一条已经消失的行配一个问号。
   两个选项都能撤销：
     · `一起勾`    → 后代全部置 done（撤销整棵子树还原）；
     · `只勾父任务` → 父勾上，父下面没做完的后代跟着一起收进已完成区（带 foldedByParent
       标记 + 撤销还原），**不是**升格成根条目、也不是留在分区列表里。 */
function tickAskAndCommit(el, it){
  if (!it || it.done) return tickWithFeedback(el, it);
  const kids = incompleteDescendants(it);
  if (kids.length){
    askTickWithKids(it, kids, el);
    return;
  }
  tickWithFeedback(el, it);
}
/* 这条条目下面（含更深层）还没做完的后代，深度优先、父在前。
   guard 上限与文件其它几处一致（防脏数据成环时转不出来）。 */
function incompleteDescendants(root){
  const out = [];
  const walk = (id, depth) => {
    if (depth > PARENT_GUARD) return;
    for (const x of S.items){
      if (x.parent !== id || x.done) continue;
      out.push(x);
      walk(x.id, depth + 1);
    }
  };
  walk(root.id, 0);
  return out;
}
/* 沿 parent 链往上收集祖先 id（近的在前）。guard 上限与文件其它几处一致 ——
   parent 成环的脏数据下必须能转出来。 */
function ancestorIds(id){
  const byId = new Map(S.items.map(i => [i.id, i]));
  const out = [];
  let cur = byId.get(id), g = 0;
  while (cur && cur.parent && byId.has(cur.parent) && g++ < PARENT_GUARD){
    const p = byId.get(cur.parent);
    out.push(p.id);
    cur = p;
  }
  return out;
}
/* ★ 0B.2：子任务全勾完时，把祖先里"自己下面的子任务已经全勾完"的那些逐级补上勾。
   自底向上走，所以每一级都看得到上一级刚被补上的结果（一次性把整条链补完，
   不需要再点一次）。
   只在开关打开时被 toggleDone 调用。 */
function parentAutoDone(it){
  const hit = [];
  for (const pid of ancestorIds(it.id)){
    const p = S.items.find(x => x.id === pid);
    if (!p || p.done) continue;
    if (S.items.some(x => x.parent === pid && !x.done)) break;   // 这一级还有别的没做完 → 停
    p.done = true; p.doneAt = Date.now();
    hit.push(p);
  }
  if (!hit.length) return;
  save(); refreshAfterChange(320);
  toast('子任务都做完了，父任务也一起勾上了', '撤销', () => {
    hit.forEach(x => { x.done = false; x.doneAt = null; });
    save(); refreshAfterChange(320);
  });
}
/* 「还有 N 项没做，一起勾掉吗？」
   用 toast 的多按钮形态而不是弹窗：这只是一句追问，不该把整页挡住、也不该
   触发弹层的滚动锁与焦点陷阱（那套是给"要填东西"的弹层用的）。 */
function askTickWithKids(it, kids, el){
  const n = kids.length;
  /* ★ 5F：两个选项都**延后一拍**执行 —— 与 askRemoveWithKids 同因同解（见 later 的定义）：
     tickWithSubtree / tickParentOnly 是**同步**落库的，并且紧接着会弹一条带「撤销」的提示，
     不延后的话它会被 toast 按钮处理器随后的 hideToast() 立刻收掉，撤销按钮用户根本看不到。
     `typeof` 守卫是项目既有的"转发口"写法：本函数会被纯 Node 回归整段切进隔离环境跑，
     那里没有 later 这个全局 —— 守卫让它退化成直接调用（页面里恒为真）。 */
  const defer = (typeof later === 'function') ? later : function(f){ return f; };
  toast('「' + it.title + '」下面还有 ' + n + ' 项没做，一起勾掉吗？', [
    { label: '一起勾', fn: defer(() => tickWithSubtree(el, it)) },
    { label: '只勾父任务', fn: defer(() => tickParentOnly(el, it)) }
  ], 8000);
}
/* ★ 0B.1（决策 1 的原话）：选「只勾父任务」→ 子任务**跟着父一起收进已完成区**，
   不是升格成根条目、也不是留在分区列表里。
   所以这里不只是把父勾上：父下面没做完的后代也一并置 done，让它们跟着父一起离开分区列表。
   纪律（决策 6 另一半：自动做错比不做更烦）：
     · 真的被用户勾过的子任务**原样不动**（doneAt 保留它自己那次勾的时间）；
     · 被这一下顺带收起来的，写 `foldedByParent = <父 id>` —— 这是**新字段**（红线允许），
       记的是"它不是做完的，是被父任务收起的"，将来统计/回顾要分开算时有据可依；
     · 撤销把 done/doneAt/标记一起还原成动手之前的样子。
   与「一起勾」的区别：一起勾 = 用户确认"这些都做完了"；只勾父 = 用户只对父任务负责，
   子任务是被收起来的。数据上两者都进已完成区，区别记在 foldedByParent 与提示文案上。 */
function tickParentOnly(el, it){
  const before = incompleteDescendants(it);
  const beforeAt = before.map(x => x.doneAt || null);
  /* ⚠️ tickWithFeedback 走到 toggleDone 时会**同步**弹一条「完成 · 标题」。
     那条提示的撤销回调里 `it.done = false` 看上去没问题，但它是在"数据层"里闭包捕获的，
     而这里紧接着又做了一次 refreshAfterChange —— 两次刷新撞在一起时，用户点「撤销」
     只会看到子任务回来、父任务还是勾着（实测：父不还原、已完成区不消失）。
     而且两条 toast 会互相顶掉：用户根本看不到「完成 · 标题」那条。
     所以这一段把"标题"那条通用提示静音掉：这一路上的话由**本函数**那条提示统一说。
     静音只影响这一次调用，不改变 toggleDone 的其它行为。 */
  const quiet = { on: true };
  tickSilence = quiet;
  try { tickWithFeedback(el, it); }
  finally { tickSilence = null; }
  before.forEach(x => { x.done = true; x.doneAt = Date.now(); x.foldedByParent = it.id; });
  save(); refreshAfterChange(320);
  /* 撤销时**重新查一次父任务**，不信闭包里的引用：整页重渲染之后旧引用可能已经不在库里
     （上面那个 bug 的根因之一）。查不到就按它在库里的身份跳过，别把一个不存在的东西写回状态。 */
  toast('父任务已勾上 · 下面 ' + before.length + ' 项没收尾的也一起收起来了', '撤销', () => {
    before.forEach((x, i) => {
      const live = S.items.find(y => y.id === x.id) || x;
      live.done = false; live.doneAt = beforeAt[i];
      delete live.foldedByParent;
    });
    const p = S.items.find(y => y.id === it.id) || it;
    p.done = false; p.doneAt = null;
    save(); refreshAfterChange(320);
  });
}
/* 一起勾：整棵子树按父任务的新状态对齐（父完成 → 后代全完成）。祖先先落，子后落，
   spawnNextCycle 复制子任务时读到的是"原始"子任务（date 语义不受影响，与手点顺序一致）。
   注意 toast 会互相顶掉：tickWithFeedback 自己那条「完成…」是同步弹的，

     父任务跟着被取消"这种更难解释的连带）。

     在这一步顺手把祖先补掉会让"这一轮结束了吗"变得没有答案（父任务已完成 → 不再排轮）。 */
  if (it.done && S.autoDoneParent && !it.repeat && !it.cycleOf && !it.hw) parentAutoDone(it);
  /* 循环任务：打勾即完成一轮，按间隔生成下一次（作业不走循环）。
     ★ v3.40 两条新语义（需求 A6）：
       · 间隔 = **区间结束后空 N 天**，下一轮起点 = 本轮终点 + N + 1 天；
         单日任务终点就是它自己，于是 `date + N + 1`。
       · `每天都做`：区间内每一天是一条独立条目，全部生成、全勾完才排下一轮。 */
  const cycle = { ids: [], label: '', daily: false };
  /* ★ 0B.9：`repeat` 只对**顶层**条目生效。子任务自带 repeat 时（导入/备份里可能有），
     它勾掉后会在同一个父下面凭空多出一条同样挂着这个父的新条目 ——
     用户的清单里就多了一条谁也不认识的行。判断放在最前面，下面两条分支都受它管。 */
  const topLevel = !it.parent;
  if (it.done && it.repeat && !it.hw && topLevel){
    const start = it.date || ymd(today0());
    const end = it.dateEnd && it.dateEnd > start ? it.dateEnd : start;
    if (it.date && it.timeMode === 'daily'){
      cycle.ids = spawnDailyKids(it, start, end); cycle.daily = true;
      /* ★ 0B.6：区间内每一天都已经被上一轮排过了 → spawnDailyKids 返回空数组。
         原来这里一片安静（用户看到"完成"却什么也没发生，只会以为循环坏了）。
         说清楚一句：不是坏了，是这一区间已经排满。 */
      if (!cycle.ids.length) toast('这一轮的每一天都已经排过了，没有新条目要生成');
    }
    else cycle.ids = spawnNextCycle(it, start, end);
    if (cycle.ids.length){
      const nx = S.items.find(x => x.id === cycle.ids[0]);
      /* 撤销要用同一个标记把整轮生成的条目一起撤回 */
      /* ★ 0A.2：`cycleOf` 这个组标记**只给"每天模式"那一批同日期的兄弟条目**。
         间隔循环（每 N 天）复制到新条目下面的清单型子任务不能带它 —— 带了的话，
         子任务一个个勾完时会被 8730 那段"同组全勾完就再排一轮"认成一组，
         于是又排出一轮重复的（同一批子任务的第二次复制）。 */
      if (cycle.daily) cycle.ids.forEach(id => { const o = S.items.find(x => x.id === id); if (o) o.cycleOf = it.id; });
      if (nx){
        const label = (nx.dateEnd && nx.dateEnd !== nx.date)
          ? '，' + teDateLabelFromStr(nx.date) + '–' + teDateLabelFromStr(nx.dateEnd) + '再来一轮'
          : '，' + teDateLabelFromStr(nx.date) + '再来一轮';
        cycle.label = label;
      }
    }
  }
  /* ★ 审查修复（2026-10-04）：`每天都做` 的"全勾完才排下一轮"从来没有出口 ——
     子条目被置成 repeat:null（勾它不排轮），父条目再勾又会被 spawnDailyKids 的 have 集合挡光。
     现在在"勾完一个子条目"时判断同组是否全部完成，全完才排下一轮。
     ★ 0B 顺手修的既有缺陷（0A 回报里登记的）：spawnNextCycle 返回的是**数组**
     （第 0 项是新父条目 id，其余是复制过来的子任务 id），这里原来当对象用 ——
     `nx.date` 与 `nx.id` 全是 undefined，于是提示里日期是空的、点「撤销」是空操作
     （什么都不删，下一轮排出来了却撤不掉）。现在按数组语义取。 */
  if (it.done && it.cycleOf && !cycle.ids.length){
    const parent = S.items.find(x => x.id === it.cycleOf);
    const grp = S.items.filter(x => x.cycleOf === it.cycleOf);
    if (parent && parent.repeat && grp.length && grp.every(x => x.done)){
      const st = parent.date || ymd(today0());
      const en = parent.dateEnd && parent.dateEnd > st ? parent.dateEnd : st;
      const made = spawnNextCycle(parent, st, en);
      const nx = made.length ? S.items.find(x => x.id === made[0]) : null;
      if (nx){
        /* ★ 阶段1：这一条勾完了 → 撤掉它的提醒（它已经 done）；
           新排出来那一轮（含跟着复制的子任务）按同一套规则排上。 */
        notifyFire(it);
        notifyFireMany(made);
        save(); refreshAfterChange(320);
        toast('这一轮做完了 · ' + teDateLabelFromStr(nx.date) + '再来一轮', '撤销', () => {
          const kill = new Set(made);
          S.items = S.items.filter(x => !kill.has(x.id)); save(); refreshAfterChange(320);
        });
        return;
      }
    }
  }
  /* ★ 阶段1：勾选会改变"要不要提醒" —— 勾完这一条撤掉，撤销回来再排上；
     循环排出的下一轮（含跟着复制的子任务）按同一套规则排上。
     一律走 syncNotify / syncNotifyMany，页面侧算时间只有那一处（约定 7）。 */
  notifyFire(it);
  notifyFireMany(cycle.ids);
  save(); refreshAfterChange(320);
  /* ★ 0B：tickSilence 是给 tickParentOnly 用的"这一路上的话由我说"开关 ——
     它调用本函数后会紧接着弹自己那条更贴切的提示（含子任务一起收起的说明），
     这里再弹一条「完成 · 标题」只会被顶掉、还会让撤销出现两套说法。 */
  if (it.done && !tickSilence) toast('完成 · ' + it.title + cycle.label, '撤销', () => {
    it.done = false; it.doneAt = null;
    if (cycle.ids.length){
      const kill = new Set(cycle.ids);
      S.items = S.items.filter(x => !kill.has(x.id));
    }
    /* ★ 阶段1：撤销「完成」= 这一条又活了 → 提醒要排回来 */
    notifyFire(it);
    save(); refreshAfterChange(320);
  });
}
/* 下一轮：起点 = 本轮终点 + 间隔 + 1 天，区间跨度沿用本轮（需求 A6 例：9/20–9/22 间隔2 → 9/25–9/27）
   ★ 0A.2：**清单型子任务跟着一起复制到新条目下面**。原来只 `Object.assign({}, it, …)` 复制父条目，
   "每月买菜"这种循环＋清单的组合，下一轮是空的 —— 每个月的清单都得手打一遍。
   判定标准（已定决策）：
     · 子任务**没有 date** → 复制（含"只有 time 钟点"的，例如早中晚吃药）
     · 子任务**有 date**  → 不复制（阶段型，比如"论文初稿 11/1"，只属于那一轮）
   新子任务：parent 指向新条目、done:false、doneAt:null、id 重新生成。
   cycleOf 一并清空 —— 它是"这一轮"的组标记，不该跨轮继承（见 toggleDone 里的说明）。
   返回值 = 这一轮**新建的全部 id**（第 0 项仍是新父条目），调用的撤销路径要用它整批撤回。 */
function spawnNextCycle(it, start, end){
  const base = dateFrom(end);
  /* ★ 4A：按 kind 分叉。
     `days` 分支**保持原公式**（+ it.repeat + 1）—— 老数据的推进结果逐字段不变，
     这是本卡的红线 1；新形态的 repeat 只是占位 1，绝不能让它们走到这条公式上。
     week/month 的日期数学在解析层（afterWeekDay / afterMonthDay），
     那几个脚本都是"解析层切片 + 按名取函数"，所以这里调得到。 */
  if (it.repeatKind === 'week'){
    const ds = (Array.isArray(it.repeatDays) ? it.repeatDays : [])
      .filter(d => Number.isInteger(d) && d >= 0 && d <= 6);
    const hit = afterWeekDay(base, ds);
    /* 形状坏了（一个合法星期都没有）就退成"7 天一次"，不要掉进 +repeat+1 那条老公式 */
    if (hit) base.setTime(hit.getTime()); else base.setDate(base.getDate() + 7);
  } else if (it.repeatKind === 'month' && Number.isInteger(it.repeatDay) && it.repeatDay >= 1 && it.repeatDay <= 31){
    base.setTime(afterMonthDay(base, it.repeatDay).getTime());
  } else {
    base.setDate(base.getDate() + it.repeat + 1);
  }
  const span = Math.max(0, Math.round((dateFrom(end) - dateFrom(start)) / 86400000));
  const nx = Object.assign({}, it, {
    id: uid(), done: false, doneAt: null, createdAt: Date.now(),
    date: ymd(base), dateEnd: null, cycleOf: null,
    timeMode: it.timeMode || 'once', hw: null,
    /* 0A.7：整条循环链共用一个组标识（链根 = 最初那条循环任务的 id），跨轮继承 */
    cycleGroup: it.cycleGroup || it.id,
    tags: [...(it.tags || [])]
  });
  if (span){
    const e2 = new Date(base); e2.setDate(e2.getDate() + span);
    nx.dateEnd = ymd(e2);
  }
  S.items.unshift(nx);
  const made = [nx.id];
  /* 只有**清单型**（无 date）子任务跟随下一轮；倒序复制，让新条目里的顺序与原顺序一致。
     这里是"完成一轮"那一下的一次全表扫描（O(n)，全程只跑一次），
     与渲染路径里"每个节点都 filter 一遍全表"（O(n²)，_verify-a11y 专门盯的那处）不是一回事 ——
     渲染那边走的是 byParent 一次索引。 */
  const kidsOfIt = S.items.filter(k => k.parent === it.id);
  kidsOfIt.slice().reverse().forEach(k => {
    if (k.date || isSeed(k)) return;
    const nk = Object.assign({}, k, {
      id: uid(), parent: nx.id, done: false, doneAt: null, createdAt: Date.now(),
      cycleOf: null, tags: [...(k.tags || [])]
    });
    S.items.unshift(nk);
    made.push(nk.id);
  });
  return made;
}
/* 每天都做：区间内每一天展开成独立条目（跳过本轮已有的日期），全勾完才排下一轮
   ★ 0A.7：判重从"同标题 + 同日期"改成"**同一循环组** + 同日期"。
   旧写法 `x.title === it.title` 会让两条同名循环任务互相干扰：A 任务在区间内生成过 10/02，
   B 任务（标题也叫"背单词"）就一条都生成不出来。组标识用 cycleGroup（0A.7 新增字段）：
   同一条循环链的父/子都带同一个值（链根 = 最初那条循环任务的 id），与标题无关。 */
function spawnDailyKids(it, start, end){
  const ids = [];
  const gid = it.cycleGroup || it.id;
  const have = new Set(S.items
    .filter(x => x.id !== it.id && x.date && (x.cycleGroup || x.id) === gid)
    .map(x => x.date));
  const d = dateFrom(start), last = dateFrom(end);
  while (d <= last){
    const ds = ymd(d);
    if (ds !== it.date && !have.has(ds)){
      const k = Object.assign({}, it, {
        id: uid(), done: false, doneAt: null, createdAt: Date.now(),
        date: ds, dateEnd: null, repeat: null, cycleOf: null, hw: null,
        cycleGroup: gid,
        tags: [...(it.tags || [])]
      });
      S.items.unshift(k); ids.push(k.id);
    }
    d.setDate(d.getDate() + 1);
  }
  return ids;
}
/* ★ 5D：这条条目在 S.items 里的**全部**后代（含已完成、含更深层），深度优先、父在前。
   与 incompleteDescendants 只差一个「done」过滤：删除要连已完成的子任务一起收，
   否则删完父、那些已完成的子任务会被 sanitizeParents() 升格成顶层条目留在清单里。
   guard 上限与文件其它几处一致（防脏数据成环时转不出来）。 */
function allDescendants(root){
  const out = [];
  const walk = (id, depth) => {
    if (depth > PARENT_GUARD) return;
    for (const x of S.items){
      if (x.parent !== id) continue;
      out.push(x);
      walk(x.id, depth + 1);
    }
  };
  walk(root.id, 0);
  return out;
}
/* 「这条下面还有 N 项，一起删掉吗？」—— 与打勾那条（askTickWithKids）同一个形态：
   toast 多按钮，不挡屏、不触发弹层的滚动锁与焦点陷阱。删除是破坏性动作，
   所以只给两个选项（一起删 / 只删这条），不另设"取消" —— 不选就等于没删。 */
function askRemoveWithKids(it, kids, el){
  const n = kids.length;
  /* ⚠️ 两个选项都**延后一拍**执行：toast 的按钮处理器写的是 `a.fn(); hideToast();` ——
     同步跑 fn 的话，remove() 在 reduceMotion / 拿不到行时是**同步落库**的，
     它紧接着弹的那条「撤销」会被随后的 hideToast() 立刻收掉（撤销按钮用户根本看不到）。
     延后一拍让 hideToast 先跑完，撤销提示才留得住；删除本来就有 420ms 退场，多一帧无感。
     ★ 5F：这个延迟助手已提到模块级（later），与 askTickWithKids 共用同一份。
     typeof 守卫同 askTickWithKids：本函数被 _5d-regress 整段切进隔离环境跑，
     那里没有 later —— 退化成直接调用即可（那些断言不验延迟这一层）。 */
  const defer = (typeof later === 'function') ? later : function(f){ return f; };
  toast('「' + it.title + '」下面还有 ' + n + ' 项，一起删掉吗？', [
    { label: '一起删掉', fn: defer(() => remove(it, el, kids)) },
    { label: '只删这条', fn: defer(() => remove(it, el)) }
  ], 8000);
}
/* ★ 5D 删除的统一入口：有子才问，没子直接走老路（多一次点击是倒退，验收 4 钉住）。
   闸门放在这里而不是 remove() 里面，与 tickAskAndCommit 同一条理由：
   提示必须**早于**退场动画 —— 先播动画再问，用户看到的是一条已经消失的行配一个问号。 */
function removeAskAndCommit(it, el){
  const kids = allDescendants(it);
  if (!kids.length){ remove(it, el); return; }
  askRemoveWithKids(it, kids, el);
}
/* 删除（3.5.2 按用户重新定义）：先把"标题与 ✕ 变红 → 整条像纸一样被压掉"演完，再动数据，
   紧接着下面的条目 FLIP 补位。el 是那颗 ✕（从点击处传进来），用来找它所在的那一行。
   ★ 5D：第三个参数 kids = 「一起删掉」传进来的整棵子树（allDescendants 的结果）；
   不传 = 只删这一条（老行为）。 */
function remove(it, el, kids){
  const idx = S.items.indexOf(it);
  /* 不在库里就当没点过。少了这句守卫，splice(-1, 1) 会**删掉最后一条**（删错对象），
     撤销时又把 it 插到倒数第二位。当前调用点的 it 都取自 S.items.find 所以走不到，
     但这是个"一旦重构就变成数据丢失"的写法。 */
  if (idx < 0) return;
  if (exitPending.has(it.id)) return;
  const row = el && el.closest ? el.closest('.item, .hwcard') : null;
  /* ★ 真 bug（用户实测："长按删除后跳到清单页，底栏却还亮着想法"）：
     原来自这里调 refreshAfterChange() —— 它内部走的是 renderList()，而 #view 是
     清单与想法**共用的那个容器**（renderList / renderIdeas 都写 view.innerHTML）。
     于是在想法页点删除，塞进去的是一屏清单内容，而 S.view 仍是 'idea'、
     aria-current / body[data-view] 也还是想法 → 页面变成清单、底栏停在想法。
     删除不该换页：refresh() 按 S.view 分派渲染，删完停在原来的页。 */
  /* ★ 5D：删除的快照。两条路都要 ——
       「一起删掉」要把整棵子树收走、撤销时整棵还原；
       「只删这条」不删子任务，但 sanitizeParents() 会把它们的 parent 置成 null（升格成顶层），
       撤销时也要逐个写回，否则父子关系就永久丢了（本卡要修的第三个 bug）。
       按卡面口径只记"被改动的那个字段"parent；对象引用留着，撤销时直接插回 S.items。 */
  const tree = (kids && kids.length) ? kids.slice() : allDescendants(it);
  const snap = tree.map(k => ({ obj: k, parent: k.parent }));
  const commit = () => {
    const cascade = !!(kids && kids.length);
    /* ★ 5D：先 splice 完再撤闹钟 —— syncNotify 判的是"还在不在库里"，
       删干净了才会走"只撤不排"（正是下面那句注释说的事）。顺序反了会一边撤一边又被排回来。 */
    if (cascade){
      tree.forEach(k => { const i = S.items.indexOf(k); if (i >= 0) S.items.splice(i, 1); });
    }
    const pi = S.items.indexOf(it);
    if (pi >= 0) S.items.splice(pi, 1);
    /* ★ 3A：删掉的正好是焦点条 → 焦点必须跟着消失（否则下一句"改成明天"会指向一条
       已经不在库里的条目）。只动内存 + sessionStorage。 */
    if (typeof aiFocusId === 'function' && typeof aiFocusClear === 'function'
        && aiFocusId() === it.id) aiFocusClear();
    /* ★ 0A.1：删掉的可能是别人的父节点 → 立刻收口（悬空置 null、断环），
       不留到下次启动才自愈 —— 否则这一屏里就有条目挂在一个不存在的父上。 */
    sanitizeParents();
    /* ★ 阶段1：删掉的条目还在 S.items 里就已经被剔除了 —— syncNotify 判"还在不在库里"
       得出"只撤不排"，正好是删除该做的事（约定 7 里唯一那个入口）。 */
    notifyFire(it);
    /* ★ 5D：被一起删掉的子任务也要撤闹钟 —— 它们已经从库里摘掉了，notifyFireMany
       对"不在库里的 id"走的就是 syncNotify 的"只撤不排"那条路（见 syncNotifyMany）。
       「只删这条」时**不调用它**：子任务还在库里、本来就该继续响（验收 3 钉住）。 */
    if (cascade) notifyFireMany(tree.map(k => k.id));
    /* ★ 5D：删除后跑一次全量对账（阶段1 定的唯一全量出口）——
       兜住任何漏撤的排期。typeof 守卫：纯 Node 回归会把本函数切进隔离环境，那里没有提醒层。 */
    if (typeof notifyReconcile === 'function') notifyReconcile();
    save(); refresh();
    toast(cascade ? ('已删除「' + it.title + '」和它下面的 ' + tree.length + ' 项')
                  : ('已删除「' + it.title + '」'), '撤销', () => {
      S.items.splice(idx, 0, it);
      /* ★ 5D：整棵子树的 parent 逐个写回（一起删时它们要重新插回库里）。 */
      snap.forEach(s => {
        if (S.items.indexOf(s.obj) < 0) S.items.push(s.obj);
        s.obj.parent = s.parent;
      });
      notifyFire(it);          // 撤销 = 这一条又回来了 → 提醒排回来
      /* ★ 5D：全部 id（父 + 整棵子树）一起排回来 —— 这时它们都回到库里了，走的是排期那条路。 */
      notifyFireMany([it.id].concat(snap.map(s => s.obj.id)));
      if (typeof notifyReconcile === 'function') notifyReconcile();
      save(); refresh();
    });
  };
  if (!row || reduceMotion()){ commit(); return; }
  exitPending.add(it.id);
  const cv = releaseCVFor([row]);              // 同上：动画期间别让 content-visibility 把动画掐停
  row.classList.add('row-out', 'row-out-del', 'exiting');
  setTimeout(() => { exitPending.delete(it.id); dropCV(cv); commit(); }, EXIT_MS);
}

/* ---------------- 弹层 ---------------- */
const mask = document.getElementById('mask'), modal = document.getElementById('modal');
/* 弹层开合。原来只有入场（fadein + rise），关闭是 remove('on') 瞬间消失。
   现在先播 ~170ms 退场再真正隐藏。有两个边角必须处理：
   ① 退场没走完又点了打开：openMask() 要先取消未完成的退场，否则那个定时器
      会把刚填好的新弹窗内容清空（症状是"弹窗闪一下就空了"）；
