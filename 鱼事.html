      S.lastScanAt = Number.isFinite(o.lastScanAt) ? o.lastScanAt : 0;
      S.ideaReview = o.ideaReview !== false;
      S.ideaReviewDone = typeof o.ideaReviewDone === 'string' ? o.ideaReviewDone : null;
      /* ★ 7B：可选值现在是 auto / idea / 任意分区的 k（老存档里的 'long' 认不出 → auto）。
         ★ 6C：'' 也是合法值（不进任何分区 / 未分组）—— 漏掉它的话用户选完
             "不进任何分区"，下次冷启动会被 load() 悄悄改回 auto。 */
      S.captureZone = (o.captureZone === 'idea' || o.captureZone === 'auto' || o.captureZone === '' || validZoneKey(o.captureZone))
        ? o.captureZone : 'auto';
      S.ideaGestureSeen = o.ideaGestureSeen === true;
      S.ideaLayout = o.ideaLayout === 'tree' ? 'tree' : 'list';
      /* ★ v5.0 第 3 批（AI）：老存档没有这几个字段 → 保持默认（**off**）。
         读坏了（存成不认识的值）也一律退回 'off' —— 隐私开关的失败方向必须是"不联网"，
         宁可不发，也不能因为一个脏数据把内容送出去。 */
      S.aiMode = (o.aiMode === 'title' || o.aiMode === 'full') ? o.aiMode : 'off';
      S.aiBase = (typeof o.aiBase === 'string' && o.aiBase.trim())
        ? o.aiBase.trim() : 'https://api.deepseek.com';
      S.aiModel = (typeof o.aiModel === 'string' && o.aiModel.trim())
        ? o.aiModel.trim() : 'deepseek-flash';
      /* ★ 2A：常用词表与"上次焦点"。
         词表建在这里、进 save()/snapshot()/恢复备份（任务卡：数据结构本卡先建好，
         设置页界面留到 2B）。读进来时按上限截断 + 逐条过滤：
         热词规格是"单词 ≤ 10 汉字"（腾讯云口径），超长的丢掉而不是截断 ——
         截断后的词会与用户说的词不同音，等于往纠错里灌噪声。 */
      S.hotwords = sanitizeHotwords(o.hotwords);
      S.hotwordSeen = sanitizeHotwordSeen(o.hotwordSeen);
      S.aiAnchor = (typeof o.aiAnchor === 'string' && o.aiAnchor.trim())
        ? o.aiAnchor.trim().slice(0, 60) : null;
      /* ★ v5.0 设置页折叠：老存档没有这个字段 → 全收起（默认）；只收字符串，别的丢掉 */
      S.setOpen = Array.isArray(o.setOpen)
        ? o.setOpen.filter(k => typeof k === 'string' && k).slice(0, 12) : [];
      /* ★ v5.1.2：日期显示口径与震动档位。
         日期：老存档没有 → 三段全开（就是现在的行为）；显式存过 false 才算关
         —— 写成 `ds.y !== false` 而不是 `!!ds.y`，否则"用户把三段全关掉"这个状态
         会在下次启动被静默改回全开（跟 showHelp 那条同一个坑）。 */
      const ds = (o.dateShow && typeof o.dateShow === 'object') ? o.dateShow : null;
      S.dateShow = {
        y: ds ? ds.y !== false : true,
        m: ds ? ds.m !== false : true,
        d: ds ? ds.d !== false : true,
      };
      /* 震动：读坏了退回 'std'（宁可正常震，也别因为一个脏值变成"完全不震"让人以为坏了） */
      S.haptic = ['off', 'low', 'std', 'high'].includes(o.haptic) ? o.haptic : 'std';
      /* ★ 0B.2：新开关。老存档没有这个字段 → 保持默认关（不能写成 !!o.autoDoneParent 之外的花样，
         也别因为缺字段就打开 —— 这是"自动替你动数据"的开关，默认必须是关） */
      S.autoDoneParent = o.autoDoneParent === true;
      /* ★ 阶段1 提醒：总开关。老存档没有这个字段 → 默认**开**。
         写成 `o.notify !== false` 而不是 `!!o.notify` —— 后者会让"用户显式关掉提醒"
         在下次启动被静默打开（与 showHelp / dateShow 同一个坑）。 */
      S.notify = o.notify !== false;
    }
  } catch (e){}
  syncTags();
  save();      // 把迁移后的规范结构写回去（老数据只有 customTags，不写回就一直是旧形状）
}
/* 写盘失败只提示一次。原来是空 catch —— 配额写满（条目多、hw.detail 里贴了大段文字）
   或隐私模式下 localStorage 不可写时，用户只会看到"我明明勾了，刷新就没了"，查不到原因。 */
let saveFailed = false;
function save(){
  try {
    localStorage.setItem(LS, JSON.stringify({
      items: S.items, lastBackup: S.lastBackup, tags: S.tags,
      statLayout: S.statLayout, hintOpen: S.hintOpen, showHelp: S.showHelp,
      foldedZones: S.foldedZones, theme: S.theme, listMode: S.listMode, voice: S.voice,
      voiceSystem: S.voiceSystem,
      /* ★ v5.0 想法系统的全局状态 */
      ideaUsedAt: S.ideaUsedAt, lastOpenedSeed: S.lastOpenedSeed,
      lastScanAt: S.lastScanAt, ideaReview: S.ideaReview, ideaReviewDone: S.ideaReviewDone,
      captureZone: S.captureZone, ideaGestureSeen: S.ideaGestureSeen, ideaLayout: S.ideaLayout,
      /* ★ v5.0 第 3 批（AI）：只有"设置"，**没有 key**（key 在 AI_KEY_LS 上单独存）。
         ★ 2A：配额字段拆掉，换成常用词表 + 上次焦点。 */
      aiMode: S.aiMode, aiBase: S.aiBase, aiModel: S.aiModel,
      hotwords: S.hotwords, hotwordSeen: S.hotwordSeen, aiAnchor: S.aiAnchor,
      /* ★ 7B：分区表 / 规范设置 / 行为学习的学习记录 —— 一个都不能少（红线 7）。 */
      zones: S.zones, zoneRules: S.zoneRules, zoneHints: S.zoneHints, zoneRev: S.zoneRev,
      setOpen: S.setOpen,
      /* ★ v5.1.2：日期显示口径 + 震动档位 */
      dateShow: S.dateShow, haptic: S.haptic,
      voiceVersion: 2,   /* 语音默认值只迁移一次，之后用户自己的开关说了算（见 load 的说明） */
      /* ★ 阶段1 提醒：总开关进存档 —— 换设备 / 重装后行为一致 */
      notify: !!S.notify,
      /* ★ 0B.2：勾完最后一个子任务是否自动完成父任务（默认关） */
      autoDoneParent: !!S.autoDoneParent
    }));
    saveFailed = false;
  } catch (e){
    if (!saveFailed){
      saveFailed = true;
      toast('保存失败：浏览器写不进去了（空间可能已满，或处于隐私模式），先用「备份」留个底');
    }
  }
}
/* 备份 / 导出的完整快照。**只带 items 是不够的** —— 标签库和外观设置也在这份数据里，
   缺了它们，在另一台电脑上恢复时会静默丢掉自定义标签：条目上还挂着那些标签字符串，
   但筛选栏是标签库驱动的，于是那些标签"筛不到、也删不掉"。 */
function snapshot(){
  return {
    items: S.items, tags: S.tags, statLayout: S.statLayout,
    hintOpen: S.hintOpen, showHelp: S.showHelp, lastBackup: S.lastBackup,
    foldedZones: S.foldedZones, theme: S.theme, listMode: S.listMode, voice: S.voice,
    /* ★ v5.0：想法系统的全局状态也进备份，否则换设备后回顾的频次判定会从头开始 */
    ideaUsedAt: S.ideaUsedAt, lastOpenedSeed: S.lastOpenedSeed,
    lastScanAt: S.lastScanAt, ideaReview: S.ideaReview, ideaReviewDone: S.ideaReviewDone,
    captureZone: S.captureZone, ideaGestureSeen: S.ideaGestureSeen, ideaLayout: S.ideaLayout,
    /* ★ v5.0 第 3 批（AI）：**刻意不写 key** —— 设计稿 §14 I-50 的验收：
       备份导出的 JSON 里不含 API key 字段。key 存在 AI_KEY_LS，永不进快照。
       ★ 2A：常用词表与上次焦点也进备份 —— 换设备后不用重新攒词。 */
    aiMode: S.aiMode, aiBase: S.aiBase, aiModel: S.aiModel,
    hotwords: S.hotwords, hotwordSeen: S.hotwordSeen, aiAnchor: S.aiAnchor,
    /* ★ 7B：分区表 / 规范设置 / 行为学习 —— 备份必须带它们（红线 7：
       换设备恢复后，用户自定义的栏目、写的规则、教过的词都得跟着过来）。 */
    zones: S.zones, zoneRules: S.zoneRules, zoneHints: S.zoneHints, zoneRev: S.zoneRev,
    setOpen: S.setOpen,
    /* ★ v5.1.2：日期显示口径 + 震动档位也进备份 —— 换手机/换电脑后不用再调一遍 */
    dateShow: S.dateShow, haptic: S.haptic,
    /* ★ 阶段1 提醒：总开关也进备份 —— 换设备恢复后不用再调一遍 */
    notify: !!S.notify,
    /* ★ 0B.2：这个开关也进备份 —— 换设备后行为保持一致 */
    autoDoneParent: !!S.autoDoneParent
  };
}

/* =============================== 提醒（阶段1） ===============================
   这一块只做三件事：**算什么时候提醒**、**把结果交给原生桥**、**把原生的事件收回来**。

   两条硬约定（任务卡里写死的，改这里之前先读）：
     ★ 约定 7「排期只留一个真相源」：全页面**只有 syncNotify(it) 这一个函数**会算
       "这一条要不要提醒、什么时候提醒"。新增 / 编辑保存 / 勾选 / 删除 / 恢复备份 / 启动
       六个入口一律调它，谁都不许自己再算一遍时间（算两份 = 迟早不一致）。
     ★ 约定 8「原生侧自己持久化排期表」：开机广播（BOOT_COMPLETED）来的那一刻 WebView
       还没跑、页面读不到 localStorage，所以排期表由**原生**写进 SharedPreferences，
       开机按它重排。页面侧只负责"告诉你该排哪些"。

   桥（window.YuShiNative）只在安卓壳里有；PWA / iPhone / 桌面浏览器上整块静默降级 ——
   没有桥就没有排期，也不会报错（与语音那条路同一个约定）。 */

/* 提醒触发时刻 = 条目 date（没有 date 就用**今天**）+ 钟点（没有钟点就用 09:00）。
   返回毫秒时间戳；返回 null = 这一条不排。
   为什么"只有日期、没有钟点"默认早上 9 点：用户 2026-10-08 拍定的默认值 ——
   写了日期就说明这天有事，早上 9 点是一个不早不晚的兜底钟点。
   为什么"时刻已经过去"也不排：AlarmManager 遇到过去的时刻会**立刻**触发，
   清单里几十条逾期条目会在开机那一刻一起炸出来。过期的不提醒，是"提醒"该有的语义。 */
function notifyTimeOf(it, now){
  if (!it || it.done) return null;
  const t0 = Number.isFinite(now) ? now : Date.now();
  const hasDate = typeof it.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(it.date);
  const time = (typeof it.time === 'string' && /^\d{2}:\d{2}$/.test(it.time)) ? it.time : null;
  if (!hasDate && !time) return null;                       // 没日期也没钟点 → 不排
  const day = hasDate ? it.date : ymd(new Date(t0));        // 只有钟点 → 算今天
  const d = dateFrom(day);
  d.setHours(time ? +time.slice(0, 2) : 9, time ? +time.slice(3, 5) : 0, 0, 0);
  const ts = d.getTime();
  return ts > t0 ? ts : null;
}

/* 当前该排的全部提醒（**纯函数**：喂 items + now 就能断言，不读全局、不碰 DOM、不调桥）。
   这也是 _ref/_1-regress.mjs 断言的那条接缝 —— 任务卡把过滤规则钉在这里：
     无 date 无 time 不进 / 只有 date 进（09:00）/ 有 time 进（该钟点）/ 已完成不进 /
     zone === 'long' 且有 date 的要进（长期条目也是有日期的，照样提醒）。 */
function notifyTargets(items, now){
  const out = [];
  (Array.isArray(items) ? items : []).forEach(it => {
    if (!it || !it.id) return;
    const ts = notifyTimeOf(it, now);
    if (ts) out.push({ id: it.id, title: it.title || it.raw || '', ts: ts });
  });
  return out;
}

/* 拿桥。**必须判方法本身在不在** —— 老版本的 APK 里桥对象存在但没有通知方法，
   只判 `window.YuShiNative` 会调出一个 undefined 然后抛异常。 */
function notifyBridge(){
  const b = window.YuShiNative;
  return (b && typeof b.notifySchedule === 'function' && typeof b.notifyCancel === 'function') ? b : null;
}

/* 通知权限：'granted' | 'denied' | 'unknown'（没有桥时取 'unknown'）。
   'unknown' = 安卓 13+ 且**还没弹过**系统授权框 —— 页面据此决定要不要显示「未授权」，
   "没问过"和"用户拒绝"是两回事，不能混着说。 */
function notifyPerm(){
  const b = notifyBridge();
  if (!b || typeof b.notifyPermState !== 'function') return 'unknown';
  try {
    const s = String(b.notifyPermState() || '');
    return (s === 'granted' || s === 'denied') ? s : 'unknown';
  } catch (_){ return 'unknown'; }
}

/* 设置页那行「未授权 + 去设置」的显隐。三个条件缺一不可：有桥、总开关开着、用户明确拒过。 */
function refreshNotifyPerm(){
  const box = document.getElementById('notifyPerm');
  if (!box) return;
  box.hidden = !(notifyBridge() && S.notify && notifyPerm() === 'denied');
}

/* ---------------- ★ 4C 真闹钟档 2：精确排期 / 全屏响铃的状态 ----------------
   ⚠️ 页面**不据此决定排不排** —— 排期永远是 syncNotify 那一处（硬约定 7），
   "有精确权限就用 setExact*、没有就用 set()" 这个分叉在原生侧（armAlarm）里。
   这里只做一件事：把状态写给用户看，并给一个「去开启」的跳转入口。
   unknown 与 denied 同档处理（探测不出来时按"可能不精确"说，宁可保守）。 */

/* 'granted' | 'denied' | 'unknown'（没有桥 / 老壳没有这个方法时取 'unknown'）。 */
function notifyExact(){
  const b = notifyBridge();
  if (!b || typeof b.notifyExactState !== 'function') return 'unknown';
  try {
    const s = String(b.notifyExactState() || '');
    return (s === 'granted' || s === 'denied') ? s : 'unknown';
  } catch (_){ return 'unknown'; }
}

/* 'granted' | 'denied' —— 全屏响铃（Android 14 起只自动给通话/闹钟类应用）。 */
function notifyFullScreen(){
  const b = notifyBridge();
  if (!b || typeof b.notifyFullScreenState !== 'function') return 'unknown';
  try { return String(b.notifyFullScreenState() || '') === 'granted' ? 'granted' : 'denied'; }
  catch (_){ return 'denied'; }
}

/* ★ 5A：锁屏全屏响铃（闹钟档）开关。**状态存在原生侧** —— 到点弹通知的是 NotifyReceiver，
   那一刻页面可能根本没起来（与硬约定 8 同一个理由）。页面只负责"问状态 / 写开关"。 */
function notifyAlarmFull(){
  const b = notifyBridge();
  if (!b || typeof b.getAlarmFull !== 'function') return false;
  try { return String(b.getAlarmFull() || '') === '1'; } catch (_){ return false; }
}
function setNotifyAlarmFull(on){
  const b = notifyBridge();
  if (!b || typeof b.setAlarmFull !== 'function') return false;
  try { b.setAlarmFull(on ? '1' : '0'); return true; } catch (_){ return false; }
}

/* ★ 5C：上次到点提醒的对账（排的时刻 / 真的响的时刻，毫秒）。
   返回 {sched, fired} 或 null（老壳没这个方法 / 还没响过 → null）。 */
function notifyLastFire(){
  const b = notifyBridge();
  if (!b || typeof b.getLastFire !== 'function') return null;
  try {
    const m = String(b.getLastFire() || '').split('|');
    const s = +m[0], f = +m[1];
    return (s > 0 && f > 0) ? { sched: s, fired: f } : null;
  } catch (_){ return null; }
}
function notifyLastLabel(t){
  const d = new Date(t);
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

/* 那一行的显隐与文案。只在"有桥 + 提醒总开关开着"时才出现 —— 关着的时候
   说"提醒可能不准"没有意义，反而多一行噪音。
   ★ unknown 与 denied 走同一档（探测不出来就按"可能不精确"说，宁可保守）。 */
function refreshNotifyExact(){
  const box = document.getElementById('notifyExact');
  const full = document.getElementById('notifyFull');
  const on = !!(notifyBridge() && S.notify);
  if (box){
    const bad = on && notifyExact() !== 'granted';
    box.hidden = !bad;
    if (bad){
      const txt = document.getElementById('notifyExactTxt');
      if (txt) txt.textContent = '提醒可能会晚几分钟：系统没给精确闹钟权限';
    }
  }
  /* ★ 5A：全屏响铃那一行整体只在有桥时露（网页版 / 老壳没有这两个方法）。
     开关状态从原生读；「系统没给全屏权限」这句只在**开关真打开**时才说 ——
     关着的时候默认路径根本不碰全屏 Intent，提示它只会让人以为哪里坏了。 */
  const b = notifyBridge();
  const hasAlarmFull = !!(b && typeof b.getAlarmFull === 'function');
  const row = document.getElementById('alarmFullRow');
  const sw = document.getElementById('alarmFullSw');
  const af = hasAlarmFull && notifyAlarmFull();
  if (row) row.hidden = !hasAlarmFull;
  if (sw) sw.setAttribute('aria-checked', af ? 'true' : 'false');
  if (full){
    const bad = on && af && notifyFullScreen() !== 'granted';
    full.hidden = !bad;
    if (bad){
      const txt = document.getElementById('notifyFullTxt');
      if (txt) txt.textContent = '锁屏上不会全屏弹，改成横幅 + 响铃提醒';
    }
  }
  /* ★ 5C：上次提醒的对账。它回答的是"响了但晚了，怪谁"——
     排的时刻是**我们算的**、实际时刻是**系统交的**，两个数一摆，责任立刻分明。
     晚了 ≥60 秒才多给一枚「去放行」（跳电池优化页），平时不打扰。 */
  const lastEl = document.getElementById('notifyLast');
  if (lastEl){
    const lf = on ? notifyLastFire() : null;
    lastEl.hidden = !lf;
    if (lf){
      const late = Math.round((lf.fired - lf.sched) / 1000);
      const tail = late >= 60 ? '（晚了 ' + late + ' 秒）'
        : (late <= -60 ? '（早了 ' + (-late) + ' 秒）' : '（准点）');
      lastEl.innerHTML = '<span>上次提醒：排 ' + esc(notifyLastLabel(lf.sched))
        + ' · 实际 ' + esc(notifyLastLabel(lf.fired)) + esc(tail) + '</span>';
      if (late >= 60){
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pill';
        btn.setAttribute('data-act', 'batteryopen');
        btn.textContent = '去放行';
        lastEl.appendChild(btn);
      }
    }
  }
}

/* ★ 约定 7 里那个"唯一入口"。
   方向由数据自己决定，调用方不用说要排还是要撤：
     还在库里 + 没完成 + 有日期或钟点 + 时刻还没到 → 排期；其余一律 → 取消。
     （删除、勾完、清掉日期、时刻已过、总开关关掉，全都是后一条路 —— 不需要各写一遍。） */
function syncNotify(it){
  const b = notifyBridge();
  if (!b || !it || !it.id) return false;
  const live = S.items.indexOf(it) >= 0;                    // 已经删掉的条目只撤不排
  const ts = (S.notify && live) ? notifyTimeOf(it, Date.now()) : null;
  try {
    if (ts) b.notifySchedule(it.id, it.title || it.raw || '', ts);
    else b.notifyCancel(it.id);
  } catch (_){ return false; }
  return !!ts;
}

/* 一次处理一批 id（循环任务打勾时会一次生成一整轮子任务）。
   它**不算时间** —— 逐个转手给 syncNotify，仍然只有那一个真相源。
   ★ 5D：id 已经不在库里的那一档要**撤**。syncNotify 的"不在库里 → 只撤不排"
   需要一个条目对象才走得到，而删除的级联是"对象已经从 S.items 摘掉、只剩 id"——
   原先这里的 `if (x)` 会把它们整批跳过，于是被一起删掉的子任务闹钟原封不动（用户实测：删了还响）。
   新增的这一档与 syncNotify 是同一条语义（不在库里 → 撤掉），撤销回插后 x 又能找到 → 照常排回来。 */
function syncNotifyMany(ids){
  (ids || []).forEach(id => {
    const x = S.items.find(i => i.id === id);
    if (x){ syncNotify(x); return; }
    const b = notifyBridge();
    if (b){ try { b.notifyCancel(id); } catch (_){} }
  });
}

/* 全量对账。只在"整体变了"的三个时刻调：启动、恢复备份、总开关切换。
   ① 该排的排（走 syncNotify，不另算时间）；
   ② 库里其余的一律撤掉 —— 这一步是"旧排期不残留"的唯一出口：备份恢复会把整批 id 换掉，
      上一批的闹钟如果不撤，到点会弹出一条指向已不存在条目的通知。 */
function notifyReconcile(){
  const b = notifyBridge();
  if (!b) return 0;
  const targets = S.notify ? notifyTargets(S.items, Date.now()) : [];
  const live = new Set(targets.map(t => t.id));
  targets.forEach(t => {
    const it = S.items.find(x => x.id === t.id);
    if (it) syncNotify(it);
  });
  S.items.forEach(it => {
    if (it && it.id && !live.has(it.id)){
      try { b.notifyCancel(it.id); } catch (_){}
    }
  });
  return targets.length;
}

/* 去空白、去空串、去重（保留先后顺序） */
function normTagList(list){
  const out = [];
  (Array.isArray(list) ? list : []).forEach(t => {
    const v = String(t == null ? '' : t).replace(/^#/, '').trim();
    if (v && out.indexOf(v) < 0) out.push(v);
  });
  return out;
}
/* 标签库变了就同步给解析层，自动猜标签才知道哪些还活着 */
function syncTags(){ ACTIVE_TAGS = S.tags.slice(); }
function uid(){ return Math.random().toString(36).slice(2, 10); }

/* 按标题找未完成条目（精确 → 前缀）；找不到就自动建一张目标卡。
   ★ 0A.3 两处收紧：
   ① **候选池排除想法（isSeed）** —— 同名的一条想法（"论文"本身可能就是一条种子）会被当成
      父级挂上去，于是待办的父节点成了一条想法：清单页看不到它，树也就地断掉（悬空引用）。
   ② **删掉"包含"这一档** —— `A> B` 只要 A 是某条目标标题的子串就会挂到那条上，
      "写论文" 挂到 "写毕业论文提纲" 底下，属于静默串味。精确 → 前缀两档够用了。 */
function findOrCreateGoal(title, zone){
  const t = String(title || '').trim();
  if (!t) return null;
  const live = S.items.filter(i => !i.done && !isSeed(i));
  const hit = live.find(i => i.title === t)
    || live.find(i => i.title.startsWith(t));
  if (hit) return hit;
  const g = {
    id: uid(), raw: t, title: t,
    date: null, dateEnd: null, monthOnly: false, time: null,
    zone: zone || 'long', tags: [], done: false, doneAt: null,
    createdAt: Date.now(), hw: null, repeat: null, parent: null, goal: true, pri: 0
  };
  S.items.unshift(g); return g;
}

/* ★ 阶段1 · 决策 3 的第二半：「早中晚吃药」→ 1 条父任务 + N 条带钟点的子任务。
   子任务**不带 date** —— 这样它跟着父任务走：循环（每天 / 每 N 天）排下一轮时，
   spawnNextCycle 里"无 date 的清单型子任务跟着复制"那条规则会把它们一起重生，
   与 0A 定下的语义一致（带 date 的子任务是独立、不随轮重置的阶段型）。
   这里是**纯**的：只按父条目造对象、不入库、不调桥 —— 纯 Node 回归可以直接断言形状。 */
function dayPartKids(parent, times){
  return (times || []).map(tm => ({
    id: uid(), raw: parent.raw, title: parent.title,
    date: null, dateEnd: null, monthOnly: false, time: tm,
    zone: parent.zone, tags: (parent.tags || []).slice(),
    done: false, doneAt: null, createdAt: Date.now(),
    hw: null, repeat: null, parent: parent.id, goal: false, pri: 0, timeMode: 'once'
  }));
}

/* ★ 2A：第二个参数是**预解析结果**（形状与 parseSmart 的返回值一致）。
   理解内核（AI 或本地级联）先算好，这里只负责落库 —— 不传就照旧自己 parseSmart。
   有这条口子才能让 AI 的产出走**同一条落库路径**（通知排期、标签库上限、
   父子挂靠、作业字段全都不用各写一套）。 */
function addItem(text, preset){
  const p = preset || parseSmart(text);
  if (!p.title) return null;
  const it = {
    id: uid(), raw: text.trim(), title: p.title,
    date: p.date, dateEnd: p.dateEnd, monthOnly: p.monthOnly, time: p.time,
    zone: p.zone, tags: p.tags, done: false, doneAt: null,
    createdAt: Date.now(), hw: null, repeat: p.repeat || null,
    parent: null, goal: !!p.goal, pri: p.pri || 0, timeMode: 'once'
  };
  /* ★ 4A：只有真的带新循环形态时才挂那两个字段（老条目逐字段与改动前一致） */
  applyRepeatFields(it, p);
  /* ★ v5.0：行尾带 ? 的条目**直接是一条种子**。跟编辑器里「分区选想法」是同一条规则，
     所以字段形状必须跟 newSeed() 一致 —— 否则两条路造出来的种子迟早漂开
     （一条有时间轴、一条没有；一条有 suggest、一条 undefined）。 */
  if (p.zone === 'idea'){
    it.kind = 'seed';
    it.zone = 'idea';
    /* ★ v5.0：sparks 从**空**开始。时间轴的第一步是"种子本身"（渲染时用 createdAt + title
       画成实心点），再往 sparks 里塞一句一模一样的，用户看到的就是"刚记下就自己续写了一遍"
       —— v3.6.0 的真 bug。续写才往里加东西。 */
    it.sparks = [];
    /* ★ 2B（用户 2026-10-08）：AI 判定"这件事真能拆成 ≥2 步"时才给子想法。
       1 步不算能拆开 —— 旧的那条"原文比标题长就自动当第一步"已经删掉（见 taskToSeed）。
       提示词里写死了"宁可少给，也不要硬把一句话拆成几步"。 */
    if (p.steps && p.steps.length >= 2){
      it.sparks = p.steps.slice(0, 6).map(x => ({ at: ymd(new Date()), text: String(x) }));
    }
    it.bornFrom = null; it.promoted = null; it.hw = null; it.repeat = null;
    /* ★ 4A：想法不带循环 —— 新形态那两个字段也要一起清，否则一条想法还挂着
       "每周三"的形状，日后再变回待办就会凭空带出一个循环。 */
    delete it.repeatKind; delete it.repeatDays; delete it.repeatDay;
    it.suggest = []; it.reviewedAt = null; it.aiUse = null;
  }
  // 祖先链逐级挂靠：'写论文> 第一周> 查文献' → 论文 ← 第一周 ← 查文献
  // ★ v5.0：种子不参与「复合目标」那套父子关系（它的 parent 是想法之间的层级，另一个人设）
  if (!isSeed(it) && p.path && p.path.length){
    let prev = null;
    for (const seg of p.path){
      const node = findOrCreateGoal(seg, prev ? prev.zone : 'long');
      if (!node) break;
      if (prev && node.id !== prev.id) node.parent = prev.id;
      if (node.goal !== true) node.goal = true;
      prev = node;
    }
    if (prev && prev.id !== it.id) it.parent = prev.id;
  }
  if (!isSeed(it) && /作业/.test(p.title)){
    it.hw = { course: guessCourse(p.title), detail:'', channel: guessChannel(text), naming: guessNaming(text), status:'todo', submittedAt:null };
    splitHw(it, p);
  }
  /* 正文里写的 #标签 也进标签库，但**要守同一个上限** —— addTag() 有 TAG_MAX 检查，
     这里原来没有，连续录入十几种新标签就能把库撑过 24，而管理弹窗还显示"30 / 24 个标签"。 */
  (p.tags || []).forEach(t => {
    if (S.tags.indexOf(t) < 0 && S.tags.length < TAG_MAX) S.tags.push(t);
  });
  syncTags();
  S.items.unshift(it);
  /* ★ 阶段1：「早中晚吃药」→ 在父条目**后面**按 08:00 / 12:00 / 19:00 的顺序插子任务。
     ⚠️ 顺序靠的是数组位置（S.items 的顺序就是渲染顺序），所以这里用 splice 插在父条目之后；
     对三条子任务逐个 unshift 会把钟点渲染成 19 / 12 / 08 的倒序。 */
  const dpKids = (p.dayParts && p.dayParts.length >= 2) ? dayPartKids(it, p.dayParts) : [];
  if (dpKids.length) S.items.splice(1, 0, ...dpKids);
  justAdded = { id: it.id, t: Date.now() };   // 渲染时给这一条挂 .just-added，播一次落位
  /* ★ 3A 决策 3：创建时更新焦点（只存内存 + sessionStorage，不进 S、不进备份）。
     用 typeof 守卫是因为纯 Node 回归会把 addItem 整段切进隔离环境跑，那里没有焦点层
     —— 与 notifyFire 那条"转发口"是同一个写法。 */
  if (typeof aiFocusSet === 'function') aiFocusSet(it.id);
  save();
  /* ★ 约定 7：新增也要过排期对账 —— 页面侧算时间只有 syncNotify 这一处。 */
  notifyFire(it);
  dpKids.forEach(k => notifyFire(k));
  return it;
}

/* ---------------- 渲染 ---------------- */
const view = document.getElementById('view');
/* 分栏顺序写死在 renderList 里（长期 → 短期 → 循环，考虑单独铺满一行），这里不再放一份 */

/* 入场动画只在「切视图」时播一次。

   .is-visible 会随之销毁，若照常播动画，每次回车都会把整页卡片重新淡入 + 去模糊一遍，
   条目上百时既卡又闪。 */
let ANIM = true;
/* 上一次真正渲染出来的视图 —— 用来判断"这次 refresh 是不是换页了"。
   换页才补录入界面的入场动画（见 CSS body.view-enter 那段说明）。 */
let renderedView = '';
let viewEnterT = 0;
function rv(){ return ANIM ? ' reveal-on-scroll' : ''; }
function rvd(ms){ return ANIM ? ` style="--delay:${ms}ms"` : ''; }
/* 长期区积压提醒：每次会话只问一次 */
let staleToastShown = false;
/* 刚录入的那一条：只让它播一次落位动画，别让整页重渲染时全列表一起播。
   用 id + 时间戳而不是一个"用完就清"的标记 —— 万一这条被筛掉了没渲染，
   标记也就自然过期，不会留到下一次刷新去污染别的条目。 */
let justAdded = { id: '', t: 0 };
/* ★ 2B：两段式上屏的第二段 —— AI 回来之后换掉了哪一条的标题，那条亮 0.5 秒。
   与 justAdded 同一个套路（记 id + 时间戳，渲染时按时间窗挂类）。 */
let aiSwapped = { id: '', t: 0 };

/* 筛选栏可以多选：选中的标签之间是「或」——挂着其中任意一个就显示出来。
   同时搜索框再做一次标题/原文的过滤。 */
function ordered(){
  const q = (S.q || '').trim().toLowerCase();
  /* ★ v3.50：**种子不进待办的任何视图**（清单 / 时间轴 / 统计）。
     kind:'seed' 的条目形状就不是待办 —— 它没有死线、不参与逾期与紧急度统计。
     想法页自己按 S.items 过滤，不走这里。 */
  return S.items
    .filter(i => !isSeed(i))
    .filter(i => !S.filterTags.length || S.filterTags.some(t => (i.tags || []).includes(t)))
    .filter(i => !q || (i.title || '').toLowerCase().includes(q) || (i.raw || '').toLowerCase().includes(q));
}
function chipDate(it){
  const dl = dateLabel(it);
  if (!dl){
    /* 边界（需求「边界与异常」）：只输入时刻、没选日期 → 时刻照存，列表显示 `14:00` */
    return it.time ? `<span class="chip date" data-fk="d:${esc(it.id)}">${esc(it.time)}</span>` : '';
  }
  let cls = 'chip date';
  /* ★ 5G：日期 chip 的「逾期 N 天」也算到**截止日** —— 与卡片染色 / 统计子页同一行 due 表达式。
     不改这里的话，区间条目会出现"卡片没染红、chip 上却写着逾期1天"的自相矛盾。 */
  const due = (it.dateEnd && (!it.date || daysFromToday(it.dateEnd) >= daysFromToday(it.date))) ? it.dateEnd : it.date;
  const df = daysFromToday(due);
  /* ★ 5H：`today` 这一档从"截止日就是今天"扩成**「进行中」** —— 截止日就是今天，
     **或**区间已经开始且还没到截止日。5G 把 due 换成截止日时只补了「逾期」那一档，
     "区间已开始、还没到截止日"这个状态根本不存在，于是 `10/8~10/11` 掉进默认色
     （用户原话："它不应该是绿色的吗？因为这正处于期限进行中，但它现在却是灰色的"）。
     单日条目逐字段不变：单日时 `it.date === due`，`started` 与 `df===0` 同时成立或
     同时不成立（`df<0` 时 first 走 late），所以这一档对单日完全是恒等变换。
     无起始日（只有 dateEnd 的脏数据）视为"已开始"—— 与 due 取 dateEnd 的口径一致。 */
  const started = !it.date || daysFromToday(it.date) <= 0;
  if (df < 0) cls += ' late'; else if (df === 0 || started) cls += ' today';
  const txt = it.done ? dl : (df < 0 ? dl + ' · 逾期' + (-df) + '天'
    : (df === 0 ? dl + ' · 今天' : (started ? dl + ' · 进行中' : dl)));
  /* data-fk：FLIP 身份键。分区和时间轴对同一天的表达不一样（时间轴"未定截止"那条不渲染日期），
     所以这个键只在两边都真的渲染出日期 chip 时才配得上 —— 配不上的自然不参与动画。 */
  return `<span class="${cls}" data-fk="d:${esc(it.id)}">${txt}</span>`;
}
/* 循环 chip 文案（需求 A7）：`每3天` / `每周一三五` / `每月1号`，区间任务再补一句区间内语义。
   ★ 4A：规则文字挪进 repRuleText —— 与编辑弹层的折叠行共用同一处真相源。 */
function repLabel(it){
  const core = repRuleText(it);
  if (!core) return '';
  return core +
    (it.dateEnd ? ' · ' + (it.timeMode === 'daily' ? '每天' : '做一次') : '');
}
/* 区内排序：重要度优先（紧急 > 重要 > 普通），再按日期先近后远，最后新加入的在前 */
function cmpItem(a, b){
  const pa = a.pri || 0, pb = b.pri || 0;
  if (pa !== pb) return pb - pa;
  /* 必须先把「两边同日期」这种情况排除掉再返回 -1/1：原来写成 `a.date && b.date ? (a<b?-1:1)`，
     日期相等时两个方向都返回 1，违反反对称性 —— sort 拿到不一致的比较函数，
     结果由引擎实现决定、不保证稳定，而且下面那条"新加入的在前"的兜底永远走不到。 */
  if (a.date && b.date && a.date !== b.date) return a.date < b.date ? -1 : 1;
  if (a.date && !b.date) return -1;
  if (!a.date && b.date) return 1;
  return b.createdAt - a.createdAt;
}

/* 紧急度 0~4，行首那颗点、时间轴上的节点都用它上色：
   0 灰＝没日期也不循环（还没到时候）   1 黄＝这周内   2 橙＝三天内或循环到期当天
   3 红＝逾期、或标了 !                 4 深红＝标了 !!
   人工标的优先：写 !! 你就说它最急，不该被「还早」的日期压下去。 */
const URG_TXT = ['不急', '这周内', '三天内', '逾期 / 重要', '紧急'];
function urgencyLevel(it){
  if (it.done) return 0;                        // 完成就没有紧急度可言，一律灰点收着
  const pri = it.pri || 0;
  if (pri >= 2) return 4;
  if (pri === 1) return 3;
  const df = it.date ? daysFromToday(it.date) : null;
  /* 循环任务看的是节奏不是死线：平时黄点惦记着，到期当天升橙，漏了一天算红。
     否则「每1天 喂寄居蟹」会天天挂在橙/红上，看两天就麻木了。 */
  if (it.repeat) return df === null ? 1 : (df < 0 ? 3 : (df === 0 ? 2 : 1));
  if (df === null) return 0;
  if (df < 0) return 3;
  if (df <= 3) return 2;
  if (df <= 7) return 1;
  return 0;
}

/* ★ v3.50 种子（想法）的渲染器。

       sleeping —— 超过 14 天没长过一步就变淡；8~14 天仍按 live 显示（不留空档）
       kidCount —— 它长出了几条子想法（驱动 ▾/▸ 三角）
       folded   —— 子想法是否收起（复用会话级 collapsed Set，与清单页复合目标同一套）
       depth    —— 缩进层数（1 = 根；≥5 起不再缩进，改在卡上显示层数小标）
       sugN     —— AI 建议了几条挂载关系（第 3 批才有数据，这里先渲染好）

  const sleepDays = seedSleepDays(it);

    + (pri ? ' pri' + pri : '')
    + (it.id === justAdded.id && Date.now() - justAdded.t < 1200 ? ' just-added' : '')
    + (it.id === aiSwapped.id && Date.now() - aiSwapped.t < 1600 ? ' ai-swapped' : '')
    /* ★ 3B：焦点落在想法上时卡片同样要有高亮（遥控器不只对着待办） */
    + (aiIsFocused(it.id) ? ' ai-focus' : '');

  const first = it.createdAt ? ymd(new Date(it.createdAt)) : '';
  /* ★ v5.1.2：日期段按设置里的年/月/日拼（见 dateText）；**三段全关就不渲染这一格** ——
     不是渲染一个空的 span，那样正文前面会白留一段间隙。 */
  const atSpan = v => { const t = dateText(v); return t ? `<span class="sp-at">${esc(t)}</span>` : ''; };
  const spine =
    `<div class="spine${(kidCount && !ideaUI.mergeMode) ? ' has-kids' : ''}">` +

        atSpan(first) + `<span class="sp-tx">${esc(it.title)}</span></div>` +
      /* ★ v5.0：每一步都带一个 `→`（**不是 ✓**）—— 点它就把这一句变成一条待办。
         设计稿的红线：**只有 →，没有勾选框，卡片上不显示「3/5 已完成」这类进度**，
         否则种子会退化成第二个清单（调研 01 §6 做法 9 明确这么说）。
         已立项的种子，每步再多一个 `↑`：把这一步补到那条待办里去（双向活链的写这一半）。 */
      sparks.map((s, i) =>
        `<div class="sp-step"><span class="sp-dot"></span>` +
        atSpan(s.at || '') +
        (s.by === 'ai' ? `<span class="sp-ai" title="AI 以「${esc(s.role || '')}」的身份问的">✦${esc(s.role || 'AI')}</span>` : '') +
        /* ★ 5I：这一步的**文字**是可点的编辑入口（role/tabindex + keydown 补键盘）。
           刻意**不挂 data-act** —— 长按手势的排除名单只认 `[data-act]`，
           挂上去这一行就再也长按不了（旧行为是长按整张卡出菜单）。 */
        `<span class="sp-tx" role="button" tabindex="0" data-sparkedit="${i}" title="点一下改这一步" aria-label="改这一步：${esc(s.text)}">${esc(s.text)}</span>` +
        (s.promotedTo ? `<span class="sp-done" title="这一步已经立项">↗</span>` : '') +
        `<button type="button" class="sp-go" data-act="sparkpromote" data-id="${esc(it.id)}" data-i="${i}" title="把这一句变成待办" aria-label="把这一句变成待办">→</button>` +
        (pushTask ? `<button type="button" class="sp-push" data-act="sparkpush" data-id="${esc(it.id)}" data-i="${i}" title="把这一句补到待办里" aria-label="把这一句补到待办里">↑</button>` : '') +
        `<button type="button" class="sp-x" data-act="sparkdel" data-id="${esc(it.id)}" data-i="${i}" title="删掉这一步" aria-label="删掉这一步">✕</button>` +
        `</div>`).join('') +
      (ideaUI.sparkOpen === it.id
        ? `<div class="sp-add"><input type="text" class="sp-in" id="sp_in" data-id="${esc(it.id)}" placeholder="现在多了什么信息？" aria-label="续写"><button type="button" class="sp-ok" data-act="sparkok" data-id="${esc(it.id)}">记下</button><button type="button" class="sp-cancel" data-act="sparkcancel" data-id="${esc(it.id)}" aria-label="收起">✕</button></div>`
        : '') +
      /* ★ v5.1.2（用户："关于下一级想法的展开和收起，这个标就不要放在左边了，
         把它放在左边灰色的指示线上吧"）：折角键从左边那一列搬进 .spine、绝对定位到竖线上，
         做成线上的一个小圆珠（见 CSS）。它不再占一列宽度，于是有子想法/没子想法的卡
         日期与蓝点都在同一个 x 上 —— 上一版"有子想法的卡正文右移 33px"的取舍也不用再做了。 */
      ((kidCount && !ideaUI.mergeMode)
        ? `<button type="button" class="fold${folded ? ' on' : ''}" data-act="fold" data-id="${esc(it.id)}" aria-expanded="${folded ? 'false' : 'true'}" title="${(folded ? '展开' : '收起') + '这 ' + kidCount + ' 条（直接长在它下面的，不含更深一层）'}">${folded ? '▸' : '▾'}</button>`
        : '') +
    `</div>`;
  /* ★ v5.0：不再有勾选框。用完了从长按菜单走「收起来」，卡片只是变暗。
     ★ v5.1.2（用户真机截图："这个蓝色的点，左边不还有那么多空间吗？你把它往左移一些呀"）：
     以前没有折角键/勾选键时这里补一个等宽空位（.lead-blank），好让同级卡片标题对齐 ——
     但想法卡默认既没有勾选框、多数也没有子想法，于是每张卡左边都白留 22px + 11px 间隔，
     日期和那个蓝点被推到离边框 45px 外。现在**没有可放的东西就整列不渲染**：
     左边留给正文。折角键搬去线上之后，.lead 只剩"多选勾选键"这一种用途。 */
  const lead = ideaUI.mergeMode
    ? `<div class="lead"><button type="button" class="pick${ideaUI.mergeSel.has(it.id) ? ' on' : ''}" data-act="pick" data-id="${esc(it.id)}" role="checkbox" aria-checked="${ideaUI.mergeSel.has(it.id) ? 'true' : 'false'}" title="选中以合并">✓</button></div>`
    : '';
  return `<div class="${cls}" data-id="${esc(it.id)}" data-fk="i:${esc(it.id)}" data-u="0">
    ${lead}
    <div class="body">
      ${spine}
      <div class="meta">
        ${pri ? `<span class="chip prichip p${pri}">${pri === 2 ? '紧急' : '重要'}</span>` : ''}
        ${sparks.length ? `<span class="chip">${sparks.length} 个子想法</span>` : ''}
        ${kidCount ? `<span class="chip kidchip" title="从这里还长出了 ${kidCount} 条">↳ ${kidCount}</span>` : ''}
        ${sugN ? `<span class="chip suggestchip" data-act="suggestopen" data-id="${esc(it.id)}" role="button" tabindex="0" title="AI 觉得它可能该挂在别的想法下面">✦ ${sugN}</span>` : ''}
        ${sleeping ? `<span class="chip sleepchip" title="最后动过是 ${sleepDays} 天前">${sleepDays} 天前</span>` : ''}
        ${depth >= 5 ? `<span class="chip depthchip" title="缩进最多 4 层，这已经是第 ${depth} 层">第 ${depth} 层</span>` : ''}
        ${promoted ? `<span class="chip promoted" data-act="gototask" data-id="${esc(it.id)}" title="跳到对应待办" role="button" tabindex="0">已立项</span>` : ''}
        ${src ? `<span class="chip srcchip" title="合并自这些想法">来自 ${esc(src)}</span>` : ''}
        ${tags}
      </div>
      <!-- ★ v5.0：卡片上那 5 枚小按钮搬进**长按菜单**了（见 openSeedSheet），卡片只剩内容。
           ★ 第 4 波（用户："每张卡片上字体到卡片上边缘、与到卡片下边缘的距离不相等"）：
           原来这里留了一行极淡的"长按卡片：续写 / 生长 / …"做可发现性 —— 但它默认隐藏时
           **仍然占 18px 高**，卡片下半身因此比上半身厚一截。整行删掉：长按的发现性由
           长按时浮出的 .seed-hud（方向提示）与「?」手势说明承担，那两处本来就是"长按才出现"。 -->
    </div>
  </div>`;
}

/* ★ 7B：卡片上那枚「哪一栏」的 chip。点它换一栏 —— 换成功就是一次**教学信号**
   （用户 2026-10-11 定的第二个教学信号："改了 AI 猜的分区"）。
   为什么必须给入口：不给的话用户没有任何办法教它"这类内容归这栏"，
   行为学习就成了黑箱。 */
function zoneChipHTML(it){
  if (!it || isSeed(it)) return '';          // 想法不参与分区，不给这枚 chip
  const name = zoneNameOf(it.zone);
  const cls = it.zone ? 'zchip' : 'zchip none';
  return `<button type="button" class="${cls}" data-zpick="${esc(it.id)}" title="点一下换一栏（我学）"
     aria-label="现在在${esc(name)}，点一下换一栏">${esc(name)}</button>`;
}
function itemHTML(it, kidsHTML, goalInfo, extraHTML, noDel){
  if (isSeed(it)) return seedHTML(it);
  /* 标签名和 id 都必须转义：标签名来自用户输入（重命名时 normTagList 只去 # 和空白），
     id 来自备份 json（外部数据）。不转义的话，名字里带一个英文引号就会把属性截断 ——
     实测标签名设为 a"b 时 data-tag 读回来是 "a"，列表 DOM 直接坏掉，而且很难看出原因。
     注意 tagPillHTML() 一直是转义的，这里没跟上，才是不一致的那一处。 */
  const tags = (it.tags || []).map(t => `<span class="chip" data-tag="${esc(t)}" data-id="${esc(it.id)}" data-fk="g:${esc(it.id)}:${esc(t)}">${esc(t)}</span>`).join('');
  // overdue 只用来把标题染红；紧急度不再靠这些类，统一由行首那颗 udot 表达
  // stale 给长期区放了超 30 天的条目挂一个「放了N天」chip
  /* ★ 5G：逾期看**截止日** —— 区间条目看 dateEnd，单日看 date 自己（用户实测：
     「10月9号到10月12号」在 10/10 被标成逾期，因为原来只看起始日）。
     ⚠️ 下面这行 `const due = …` 在 statPageHits('overdue') / chipDate / renderTimelineBody
     里**逐字符相同**（唯一真相源）—— 统计卡的数字与卡片红标题必须同一个谓词，改一处要改全部；
     _5g-regress 的 [2] 有源码级断言钉住"这几处一模一样、且旧的只看 date 的写法一处不剩"。
     dateEnd < date 的脏数据（老备份可能有）：取两者**较晚**的那个，不会误报逾期。 */
  const due = (it.dateEnd && (!it.date || daysFromToday(it.dateEnd) >= daysFromToday(it.date))) ? it.dateEnd : it.date;
  const overdue = !it.done && due && daysFromToday(due) < 0;
  const staleDays = (!it.done && !it.date && it.zone === zoneLongKey() && it.createdAt)
    ? Math.floor((Date.now() - it.createdAt) / 86400000) : 0;
  const stale = staleDays > 30;
  const pri = it.pri || 0;
  const cls = 'item' + (it.done ? ' done' : '') + (overdue ? ' overdue' : '') + (stale ? ' stale' : '')
    + (pri ? ' pri' + pri : '') + (goalInfo ? ' goal' : '')
    + (it.id === justAdded.id && Date.now() - justAdded.t < 1200 ? ' just-added' : '')
    + (it.id === aiSwapped.id && Date.now() - aiSwapped.t < 1600 ? ' ai-swapped' : '')
    /* ★ 3B：焦点条指向的那一条，卡片左侧亮一道实色细高亮（真元素，CSS 见 .focus-bar）。
       同一个 id 走 sessionStorage 的焦点，与顶部条同源 —— 两处不会各说各话。 */
    + (aiIsFocused(it.id) ? ' ai-focus' : '');
  const lvl = urgencyLevel(it);
  /* ★ v3.36（用户："分区和时间轴页面里都有那个点…这些点也作为一个固定元素，
     让它们在视图切换时跟随那个文字，到自己对应的位置，不要直接消失和出现"）：
     行首那颗紧急度点现在带 FLIP 身份键 `u:<id>`。分区与时间轴都是**同一个 itemHTML**
     渲染出来的，同一颗点在两边都拿同一个键 → 切视图时它跟着自己那行文字搬过去，
     而不是"这边消失、那边出现"。 */
  return `<div class="${cls}" data-id="${esc(it.id)}" data-fk="i:${esc(it.id)}" data-u="${lvl}">
    <div class="lead">
      <span class="udot u${lvl}" data-fk="u:${esc(it.id)}" title="紧急度：${URG_TXT[lvl]}"></span>
      <button class="tick" data-act="tick" title="完成">✓</button>
    </div>
    <div class="body">
      <div class="t" data-act="edit" data-fk="t:${esc(it.id)}">${esc(it.title)}</div>
      <div class="meta">
        ${goalInfo ? `<span class="chip goalchip" data-act="fold" data-id="${esc(it.id)}" aria-expanded="${goalInfo.folded ? 'false' : 'true'}" title="${goalInfo.folded ? '展开' : '收起'}这 ${goalInfo.total} 条子任务">${goalInfo.folded ? '▸' : '▾'} ${goalInfo.done}/${goalInfo.total}</span>` : ''}
        ${pri ? `<span class="chip prichip p${pri}">${pri === 2 ? '紧急' : '重要'}</span>` : ''}
        ${chipDate(it)}
        ${it.repeat ? `<span class="chip rep">${repLabel(it)}</span>` : ''}
        ${it.hw ? '<span class="chip hwchip">作业</span>' : ''}
        ${stale ? `<span class="chip old">放了${staleDays}天</span>` : ''}
        ${tags}
        ${zoneChipHTML(it)}
      </div>
      ${extraHTML || ''}
    </div>
    <div class="acts">
      <button class="mini" data-act="edit" title="编辑">✎</button>
      ${noDel ? '' : '<button class="mini" data-act="del" title="删除">✕</button>'}
    </div>
    ${kidsHTML || ''}
  </div>`;
}

function renderList(){
  const isTL = S.listMode === 'timeline';

  /* 顶上那块大标题**恒定**为「今天要做什么」（用户本轮要求）：
     切「分区 / 时间轴」时不再把大字换成「时间轴」—— 一换就会让人以为换了个页面，
     而实际上只是同一批待办换了一种排法。视图差异改由下面那句说明文字交代。 */
  const introNote = isTL
    ? `这一屏是<b>时间轴</b>：所有写了日期的未完成任务，按截止日从近到远上下排。<br>
       点越红越急：灰＝还早，黄＝这周内，橙＝三天内，红＝逾期，深红＝标了 <b class="mono">!!</b>。`
    : `这一屏是<b>分区</b>：栏目由你自己定（默认是长期 / 短期 / 循环，能加、能改名、能删）。时间与循环以后只是条目上的标记，<b>不再决定它进哪一栏</b>。<br>
       每张卡右下角那枚小字是它现在在哪一栏 —— 点一下就能换；挪过一次，同一类内容下次会直接被猜到这里。`;

  let h = `<div class="section-intro${rv()}">
        <p class="section-kicker">Today</p>
        <h2>今天要做什么</h2>
        <p class="intro-note">${introNote}</p>
      </div>`;

  /* v3.36（用户："把时间轴和分类的切换 UI 放到抽屉之外，同时把它们变为纯图案的 UI 界面，
     不要再用文字了"）：独立成一行、居中、纯图标，长在标题正下方 —— 抽屉收起来也看得见。
     语义交给 title + aria-label（图标没有文字，读屏与长按提示全靠它）；
     data-listmode / .on / aria-pressed 全部保持不变，点击逻辑（el.dataset.listmode）不用改。 */
  /* ★ 3.5.4（用户逐条指定）：标题下面改成**一行三格** ——
       左：粘贴导入（外框高度与右边那组图标开关一致）
       中：筛选（位置不变，但**下边缘**跟右边那组对齐 → 行用 align-items:end）
       右：分区⇄时间轴 图标开关（放到统计页"条状/方块"开关的位置，也就是右上）
     `1fr auto 1fr` 的三列网格：左右两格各占一份，中间那格天然居中，
     所以"筛选居中"和"右边贴右"能同时成立，左边也不会把中间挤歪。 */
  const toolsOpen = document.body.classList.contains('tools-open');
  h += `<div class="list-top${rv()}"${rvd(40)}>
    <button class="btn ghost import-btn glass-chip" id="importBtn">粘贴导入</button>
    <button class="filter-bar" id="filterFab" type="button" aria-expanded="${toolsOpen ? 'true' : 'false'}"
        aria-label="展开或收起搜索与筛选">筛选<svg class="fb-chev" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 9.5l6 6 6-6"/></svg></button>
    <span class="seg glass-chip" role="group" aria-label="清单展示方式">
      <button class="segbtn ico-seg${isTL ? '' : ' on'}" data-listmode="zone"
              title="分区：长期 / 短期 / 循环" aria-label="分区视图" aria-pressed="${!isTL}">
        <svg class="seg-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="3.2" y="4.6" width="5.2" height="14.8" rx="1.8"/>
          <rect x="9.4" y="4.6" width="5.2" height="9.4" rx="1.8"/>
          <rect x="15.6" y="4.6" width="5.2" height="12.2" rx="1.8"/>
        </svg>
      </button>
      <button class="segbtn ico-seg${isTL ? ' on' : ''}" data-listmode="timeline"
              title="时间轴：按截止日从上到下排" aria-label="时间轴视图" aria-pressed="${isTL}">
        <svg class="seg-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4.4 3.4v17.2"/>
          <circle cx="4.4" cy="7.2" r="1.7"/>
          <circle cx="4.4" cy="12" r="1.7"/>
          <circle cx="4.4" cy="16.8" r="1.7"/>
          <path d="M9.8 7.2h10.2M9.8 12h10.2M9.8 16.8h10.2"/>
        </svg>
      </button>
    </span>
  </div>`;

  /* 抽屉（点「筛选」展开）：只剩搜索框 + 标签条 —— 粘贴导入已经搬到上面那一行的左边，
     这里不再挤一个按钮（它当初被压到搜索框上，就是因为 `.ghost` 这个类名撞了 FLIP 影子层）。 */
  /* v3.36：抽屉关着的时候**不给** .toolbar 挂 reveal-on-scroll。
     它的收起态靠 max-height/opacity 过渡（见 CSS），而入场动画会把 opacity 先拉到 1、
     跑完再落回 0 —— 那就成了用户明令禁止的"一帧出现、一帧消失"。
     抽屉开着时才挂，展开动作本身由 CSS 那条过渡负责，不需要入场动画。 */
  h += `<div class="toolbar${toolsOpen ? rv() : ''}"${toolsOpen ? rvd(60) : ''}>
    <div class="tb-wrap">
      <div class="tb-row search-row">
        <input class="search" id="searchBox" type="text" aria-label="搜索标题关键词" placeholder="搜索标题关键词…" value="${esc(S.q || '')}">
      </div>
      <div class="tb-row tag-row">
        <!-- tabindex=0：标签一多这条就横向滚，键盘用户得能聚焦到它才滚得动（方向键） -->
        <div class="pillstrip" id="filters" tabindex="0" role="group" aria-label="按标签筛选"></div>
        ${tagActsHTML}
      </div>
    </div>
  </div>`;

  if (isTL){
    h += renderTimelineBody();
  } else {
    h += renderZoneBody();
    /* 长期区积压提醒：每次会话只问一次；备份提醒更重要，它要弹时这里让位 */
    const backupStale = !S.lastBackup || Date.now() - S.lastBackup >= 7 * 86400000;
    const staleCount = S.items.filter(i => !i.done && !i.date && i.zone === zoneLongKey() &&
      i.createdAt && (Date.now() - i.createdAt) > 30 * 86400000).length;
    if (staleCount && !staleToastShown && !backupStale){
      staleToastShown = true;
      setTimeout(() => toast('长期区有 ' + staleCount + ' 条放了超过 30 天，看看要不要处理掉', null, null, 8000), 800);
    }
  }

  view.innerHTML = h;
}

/* 分区展示主体（只返回内容片段，不写 #view）。逻辑与原先一致，只是从 renderList 里抽出来，
   让「时间轴」也能复用同一个工具栏 + 同一套搜索/筛选。 */
function renderZoneBody(){
  let bh = '<div class="board">';

  /* ---- 复合目标：树形渲染 ----
     vis = 搜索/标签过滤后的可见集（子任务可见时，祖先链强制可见）；
     kids = 父id → 可见且未完成的子任务；根 = 无父 / 父不存在 / 父已完成 */
  const byId = new Map(S.items.map(i => [i.id, i]));
  const vis = new Set(ordered().map(i => i.id));
  for (const i of ordered()){
    let cur = i, guard = 0;
    /* ★ 0A.5：这条祖先链以前没有 guard —— parent 成环（A→B→A）时它会一直转，
       整个清单页卡死。上限 64 与文件其它几处（seedAncestorUsed / 树状图 / 想法页）一致。 */
    while (cur.parent && byId.has(cur.parent) && guard++ < PARENT_GUARD){
      const p = byId.get(cur.parent);
      /* ★ 0B.1：父已完成时**停止上溯**。这些条目已经跟着父一起被收进"已完成区"
         （由下面的 rootList 判定），不该再把祖先补进可见集 —— 补了会渲染出一张
         已完成父卡的孤立壳子（它的子任务在 kids 里、却没人来画）。 */
      if (p.done) break;
      vis.add(p.id);
      cur = p;
    }
  }
  /* ★ 0B.4：kids 现在**也收已完成的子任务**。原来 `if (i.done) continue;` 让子任务
     一勾就从父卡下面消失（用户嘴里的"完成就删了"）—— 数据其实还在，只是不画。
     现在勾完仍留在父卡下，只是划线变灰（.item.done 那套现成样式），还能再点一下取消勾选。
     与根条目一样，父任务已完成时不再往下挂（子任务跟着父一起收进已完成区，见 0B.1）。 */
  const kids = new Map();
  for (const i of ordered()){
    if (!i.parent || !byId.has(i.parent)) continue;
    const p = byId.get(i.parent);
    if (p.done) continue;
    if (!kids.has(i.parent)) kids.set(i.parent, []);
    kids.get(i.parent).push(i);
  }
  kids.forEach(arr => arr.sort(cmpItem));
  /* 每个节点都要数一遍自己**全部**子任务（含已完成、含被过滤掉的），用来显示 ▾ 3/5 那个角标。
     原来这行是 `S.items.filter(x => x.parent === it.id)`，而它在 renderTree 里 ——
     一次渲染里整个数组被扫「节点数」遍，是 O(n²)。这里进函数前建一次索引降到 O(n)。
     注意它和上面的 kids 语义不同：kids 只收「可见且未完成」，这里收所有，
     所以不能合并成一张表。 */
  const byParent = new Map();
  for (const i of S.items){
    if (!i.parent) continue;
    if (!byParent.has(i.parent)) byParent.set(i.parent, []);
    byParent.get(i.parent).push(i);
  }
  /* ★ 0A.5：深度上限 5 层。到顶之后**不再往下嵌套**，而是把更深的后代铺在同一格里
     （同想法页"第 5 层起 .flat"的做法：能看见，但不无限缩进）。
     为什么是"铺平"而不是"停止递归"：停下会让第 6 层以下的条目从页面上凭空消失 ——
     用户会以为数据丢了，而它其实还在库里（这是最坏的一种 bug 观感）。
     铺平不需要新 CSS：更深的后代直接放进**同一格** `.goal-kids` 里，
     缩进自然停在第 5 层那一级台阶上。
     另外这一层深度判断同时是**环路的兜底**：嵌套最多 5 次，parent 成环也走不穿。 */
  const TREE_MAX_DEPTH = 5;
  function renderTree(it, depth){
    /* 子任务**始终**渲染进 DOM，折叠只加一个 display:none。
       为什么不能沿用「折叠就不渲染」：高度过渡必须"先渲染再塌陷" ——
       展开时若等结构建好再补动画，会先闪一下完整高度；收起时若结构已经不在，
       就无高度可量，只能硬切。留在 DOM 里的代价只是折叠的子树多占一点内存。 */
    depth = depth || 1;
    const children = kids.get(it.id) || [];
    const allKids = byParent.get(it.id) || [];
    const folded = collapsed.has(it.id);
    /* ★ 0B.3：角标口径统一由「有没有子任务」推导，不再看 `it.goal`
       （`goal` 只留给 findOrCreateGoal 复用已有目标卡那条路，不再参与显示）。
       真的没有子任务 → info 为 null → 不显示角标。 */
    const info = allKids.length
      ? { total: allKids.length, done: allKids.filter(x => x.done).length, folded }
      : null;
    const inner = depth >= TREE_MAX_DEPTH
      ? flatDescendants(children)
      : children.map(c => renderTree(c, depth + 1)).join('');
    const kidsHTML = children.length
      ? `<div class="goal-kids${folded ? ' folded' : ''}" data-kids="${esc(it.id)}">` + inner + `</div>`
      : '';
    return itemHTML(it, kidsHTML, info);
  }
  /* 铺平：把这批节点和它们的后代全部画成**同级**卡片（不再嵌套）。
     `seen` 既防同一节点被画两遍，也保证环路下一定终止（每个 id 最多出栈一次）——
     所以这里不需要再写一个数字 guard。 */
  function flatDescendants(list){
    const out = [], seen = new Set(), stack = list.slice();
    while (stack.length){
      const c = stack.shift();
      if (!c || seen.has(c.id)) continue;
      seen.add(c.id);
      const ck = byParent.get(c.id) || [];
      out.push(itemHTML(c, '', ck.length
        ? { total: ck.length, done: ck.filter(x => x.done).length, folded: collapsed.has(c.id) }
        : null));
      /* 铺平的节点仍尊重用户自己的折叠态：收起的就不往下铺了（否则那个 ▾ 会像失灵） */
      if (!collapsed.has(c.id)) (kids.get(c.id) || []).forEach(k => stack.push(k));
    }
    return out.join('');
  }
  /* 根列表从 vis 取而不是 ordered —— 搜索/标签过滤命中子任务时，祖先目标是补进 vis 的；
     循环任务不混进 zone，它自己一栏 */
  /* ★ 0B.1：根判定不再有 `|| p.done`。
     原来父任务一打勾，它没做完的子任务就**升格成根条目**跑进分区列表（体验上像散架）。
     现在父已完成 = 整棵子树跟着收进已完成区，不升格。
     祖先链上任意一级已完成都算"在已完成区里"：父卡自己不再渲染，它的子任务也就没有
     任何地方能画 —— 让它们落到分区列表顶层会是更坏的结果（看着像凭空多出来的条目）。 */
  const underDone = (startId) => ancestorIds(startId).some(pid => {
    const x = byId.get(pid);
    return !!x && !!x.done;
  });
  /* 这一屏真的会被画出来的子任务（父 id → 子任务）。用来挡"同一条画两遍"：
     子任务画在父卡下面，就绝不能再当根画一次。 */
  const inKids = new Set();
  kids.forEach(arr => arr.forEach(it => inKids.add(it.id)));
  const rootList = k => S.items.filter(i => {
    if (i.done || i.zone !== k || !vis.has(i.id) || i.repeat) return false;
    if (inKids.has(i.id)) return false;          // 已经画在某个父卡里了
    /* 根 = 无父 / 父不存在（悬空）/ 父链上有任意一级已完成。
       ★ 0B.1：最后那一档**不是**"让它升格成根"，而是把"父已完成的子任务"收进
       已完成区 —— 它上面已经没有父卡能画它了（父卡不渲染），把它当根画出来
       就是用户看到的"一勾父任务，子任务全散架跑进分区列表"。
       现在保留 underDone 这一档只是为了不让数据里的子树在页面上凭空消失：
       子任务上浮到分区列表里跟父卡在同一处（同一栏），位置连续、不散架。
       父**还在**（未完成）时，子任务就画在父卡下面，这里被 inKids 挡掉。 */
    return !i.parent || !byId.has(i.parent) || underDone(i.id);
  }).sort(cmpItem);

  const repList = ordered()
    .filter(i => !i.done && i.repeat && vis.has(i.id) && !(i.parent && byId.get(i.parent) && !byId.get(i.parent).done))
    .sort(cmpItem);

  /* ★ 7B：分栏改成**按用户的分区表**（S.zones 的顺序），不再写死长期 / 短期 / 循环。
     要点：
       · 每个分区的条目 = rootList(该分区的 k) —— 父 / 子 / 已完成 / 搜索过滤那套一个字没动，
         只是"归哪一栏"的判据从写死的值换成 k；
       · 含 repeat 的条目仍走 repList，落在 **z_repeat 那一栏**（与 5.x 的 `i.repeat` 过滤同一条规则：
         它不进别的分区栏，只在那一条重复任务栏里出现）；
       · **未分组固定排最后**：列 k 是空串、没有 data-zfold（不可折叠、不可删、不可改名），
         而且**空时不渲染**（别让空栏占地方）。
      ⚠️ 这一段只读 S（S.zones / S.foldedZones），不引用任何新增全局函数 ——
      0B / 0E 的纯 Node 回归脚本把 renderZoneBody 整段切出来喂桩跑，
      引用一个没桩的全局会直接 ReferenceError，把那一批本来绿的断言一起带走。 */
  const bucketOf = {};
  for (const z of S.zones) bucketOf[z.k] = rootList(z.k);
  const repListFor = [];
  for (const it of repList){
    if (S.zones.some(z => z.k === 'z_repeat')) repListFor.push(it);
  }
  const ungrouped = rootList('');

  /* ★ 7B：兜底扫描（v3.38 那条"一栏都没收走就补进长期"，0B 修过一次重复渲染）。
     分区改成用户自定义之后它的落点变了：**补进「未分组」**（而不是塞进某一栏） ——
     这样"认不出的 zone 值"与"真的没分组"落在同一处，用户看得见、点得着、挪得走。
     判据三条与 0B 一致：已进某一栏的（listed）、正画在父卡里的（inKids）、父已完成的
     （underDone）都不再补，否则同一条会画两遍。 */
  {
    const listed = new Set();
    Object.keys(bucketOf).forEach(k => bucketOf[k].forEach(it => listed.add(it.id)));
    repListFor.forEach(it => listed.add(it.id));
    const placed = new Set(ungrouped.map(it => it.id));
    const orphan = ordered().filter(i => !i.done && vis.has(i.id) &&
      !listed.has(i.id) && !placed.has(i.id) && !inKids.has(i.id) && !underDone(i.id));
    if (orphan.length) orphan.forEach(it => ungrouped.push(it));
    ungrouped.sort(cmpItem);
  }

  /* 三栏顺序＝「要管的程度」从松到紧：长期（最没期限）→ 短期（有死线）→ 循环（节奏固定）。
     「考虑」不算待办，只在这儿暂存想法，铺满整行收在最后，不挤进这三栏。 */
  /* ★ 0E（用户原话："静态页面在功能定位上就是'还没完成的事'，那为什么要加'已完成'？"）：
     0B 在这里挂过一整块可折叠的「已完成」收纳区 —— 那个位置本身就是错位的，清单页只管
     "还没做的"。现在**整块撤掉**（折叠头、列表、把子任务补进 kids 的那段、S.doneOpen
     一起删），只留**一行入口**去统计页的「今日完成」子页：数据和渲染都在那边，
     一份不多、一份不少，也不再需要"把已完成子任务补进 kids"那种两套渲染的补丁。
     N 与统计页「今日完成」卡同一个口径（排除想法 + doneAt 落在今天 + **根级**，见下面那段）。
     ⚠️ 这里**不调用** statPageHits，而是直接用 statDoneItems 拼同一个谓词：0B 的纯 Node
     回归脚本是把 renderZoneBody 整段切出来喂桩跑的，引用一个新增的全局函数会让那份脚本
     直接 ReferenceError 崩掉、把它本来绿的断言一起带走。两处口径一致由 _0e-regress.mjs
     的**运行时等式断言**钉住（同时渲染入口行与统计卡，比 N 必须相等）。
     位置与原来那块一样：压在三个分区**脚下**（`.board` 的最后一个整行 item）——
     0B 那条理由仍然成立："今天做完的东西不该占着第一屏"，这一屏要回答的是"还剩什么没做"。 */
  const todayYmd = ymd(today0());
  const doneTodayAll = statDoneItems().filter(i => i.doneAt && ymd(new Date(i.doneAt)) === todayYmd);
  /* ★ 0G：N 的口径是**根级**（= 明细页看得见的卡片数）。父任务完成时，被它一起勾掉的子任务
     也带今天的 doneAt，但它们画在父卡里、不是独立的卡 —— 全算进去就会出现
     「入口写着 3 条、点进去只有 1 张父卡」。
     判据与 statTreeOf（明细页把命中集合折成"根 + 挂在根下面的子任务"的那一步）同源：
     **在命中集合里没有命中祖先**的才是一条。ancestorIds 本来就带 PARENT_GUARD，脏数据成环
     也能转出来。
     ⚠️ 这里**不能改调** statPageHits / statRootHits：0B 的纯 Node 回归把 renderZoneBody
     整段切出来喂桩跑，引用一个没桩的全局会直接 ReferenceError，把它一批本来绿的断言一起
     带走。两处口径相等由 _0e-regress.mjs 的运行时等式断言钉住
     （卡上数字 = 入口 N = 子页「共 N 条」）。 */
  const doneTodayIds = new Set(doneTodayAll.map(i => i.id));
  const doneTodayN = doneTodayAll.filter(i => !ancestorIds(i.id).some(a => doneTodayIds.has(a))).length;

  /* ★ 7B：最终列 = 用户分区表的顺序（长期/短期/循环是默认的三个，名字可改、顺序可调、可删）
     + 「未分组」（它不参与 S.zones，固定排最后，空时不进这个数组 = 不渲染）。
     data-z 用的仍是分区的主键 k；未分组用空串（CSS 只按 --zc 上色，不依赖具体值）。 */
  const cols = [];
  for (const z of S.zones){
    const isRep = z.k === 'z_repeat';
    cols.push({
      k: z.k, label: String(z.name), color: z.color,
      cls: isRep ? ' repeat-zone' : '',
      /* 「循环」那一栏的文案与 5.x 一致（就是原来那个默认分区，只是现在可删可改名）。 */
      empty: isRep ? '还没有循环任务。写「每2天 喂寄居蟹」，打勾后自动排下一次。' : '空',
      list: isRep ? repListFor : (bucketOf[z.k] || []),
      fixed: false
    });
  }
  if (ungrouped.length){
    cols.push({ k: '', label: '未分组', color: '#8a8f98', cls: ' ungrouped-zone',
      empty: '空', list: ungrouped, fixed: true });
  }

  /* ★ 7B：每栏多一枚「⋯」（改名 / 上移 / 下移 / 删除）——
     它是整条 header 热区里的一个按钮，所以必须 stopPropagation，
     否则点它会顺手把这一栏折叠掉（见 #view 委托里 data-zmenu 那一段）。 */
  const zmenuBtn = c => c.fixed ? ''
    : `<button type="button" class="zmenu" data-zmenu="${c.k}" aria-label="${esc(c.label)}：改名、排序、删除" title="改名 / 排序 / 删除">⋯</button>`;

  cols.forEach((c, zi) => {
    /* ★ 0B：分区列表**不收已完成的根条目** —— 它们沉到下面那条「已完成」里。
       不排除的话，一个做完了的父任务会继续占着分区列表（数据上它是根），
       与「收进已完成区」的说法自相矛盾；它的子任务则跟着它在已完成区里展开。 */
    const live = c.list.filter(x => !x.done);
    if (c.fixed && !live.length) return;          // 「未分组」空时不渲染
    const fd = !c.fixed && S.foldedZones.includes(c.k);
    /* ⚠️ 7B 实测踩到的坑：`--zc`（本栏主色）与 `--delay`（入场错峰）**必须守在同一个
       style 属性里**。原来写成 `style="--zc:…"` + `${rvd(...)}`（后者自带一个 style="…"），
       同一元素上出现两个 style 属性 —— HTML 只认第一个，`--delay` 被浏览器整个丢掉，
       表现就是"三栏一起冒出来，没有从上到下的错峰"（而入口那行仍带延迟，看不出问题）。
       现在合成一个：把 `--zc` 塞进那条样式串里（rvd/rv 都是转发口，纯 Node 回归里
       被桩掉了，所以这里**不许直接读 ANIM 变量** —— 0B 的隔离环境没有声明它）。 */
    const zSty = '--zc:' + c.color + rvd(100 + zi * 80).replace(/^ style="/, ';').replace(/"$/, '');
    bh += `<section class="glass zone${c.cls || ''}${fd ? ' folded' : ''}${rv()}" data-z="${c.k}" style="${zSty}">
      <header${c.fixed ? '' : ` data-zfold="${c.k}" role="button" tabindex="0" aria-expanded="${fd ? 'false' : 'true'}"`}>
        <span class="dot"></span><h3>${esc(c.label)}</h3><span class="n mono">${live.length}</span>
        <i class="z-chev" aria-hidden="true"></i>${zmenuBtn(c)}
      </header>
      <div class="zone-body">${live.length ? live.map(x => renderTree(x)).join('') : `<div class="empty">${c.empty}</div>`}</div>
    </section>`;
  });

  /* ★ 0E：0B 那块「已完成」收纳区就长在这里，现在整块撤掉，换成**一行入口**
     （见上面那段说明与 doneTodayN）。清单页只有"还没做的"—— 做完的东西回统计页看。
     它是 .board 的最后一个整行 item（grid-column:1/-1），位置就是原来那块收纳区的位置。 */
  if (doneTodayN){
    /* ★ 0G：① 去掉 .glass（不再是个"框"，见 CSS 那段说明）；② 入场延迟排到**三栏之后** ——
       它原来写 40ms，比「长期」(100ms) 还早，于是看着像跟长期一起冒出来（用户原话：
       "它是跟'长期'一块儿进入的，就导致看着有点快"）。从上到下的顺序 = 100 + 分区数×80，
       按分区数现算而不是写死 340（以后加减分区不会漂）。 */
    bh += `<button class="zone-wide done-entry${rv()}" data-statentry="1"${rvd(100 + cols.length * 80)}
      aria-label="今天已完成 ${doneTodayN} 条，点开看明细">
      今天已完成 <b class="de-n mono">${doneTodayN}</b> 条
      <span class="de-chev" aria-hidden="true">›</span>
    </button>`;
  }

  /* ★ 7B：「+ 新建分区」—— 压在分区名单的脚下（与「今天已完成」那一行同区）。
     只要名字，颜色循环取色（不让用户选色）。点它开一个只有一个输入框的弹层。
     固定排在分栏之后、.board 之内（它是这个网格的一个整行 item）。 */
  bh += `<button class="zone-wide zone-add${rv()}" data-zoneadd="1"${rvd(100 + cols.length * 80 + 40)}
    aria-label="新建分区">
    <span class="za-plus" aria-hidden="true">+</span> 新建分区
  </button>`;

  /* 考虑区：这里放的是「还没决定要不要做」的事，不是待办 —— 不占三栏之一，
     靠 grid-column:1/-1 铺满整行落在所有栏目脚下，绿点跟上面三栏的蓝点分开。
     必须写在 .board 里面：它是这个网格的一个 item，行间距（gap）才管得到它。
     以前这段渲染在 .board 外面（`</div>` 提前把看板关掉了），后果是
     grid-column 空转、而且它紧贴着看板一个像素都不隔 —— 看着像跟「循环」粘成一张卡。 */
  /* ★ v5.0：「考虑」区整块删除。行尾 ? 现在直接长成一条种子、进想法页。
     老数据（zone==='consider'）由上面那段兜底扫描收进「长期」，不会消失；
     想法页顶部另有一次性的「搬进想法」提示，迁不迁由用户决定。 */

  bh += '</div>';   // 关掉 .board
  return bh;
}

/* 作业条目在时间轴里的补充块：课程 / 渠道 / 命名 / 交于 + 三个状态按钮。
   ★ v3.36（用户："这些文字除了大小、布局之外，它们的样式要统一"）：时间轴原来给每条
   自画一张 .hwcard 卡片（另一套标题、另一套日期 chip、另一套配色），和分区那行根本不像
   同一个应用；逾期在分区里标红、在时间轴里不标红，也是这么来的 —— 因为两边是两份代码。
   现在时间轴的**主体**复用分区的 itemHTML（点/勾/标题/标签全同源），作业特有的信息
   作为一行补充块挂在正文下面。所以待办本身只有一个渲染器，样式不可能再漂。 */
function hwStatusHTML(it){
  if (!it.hw) return '';
  const hw = it.hw;
  const st = [['todo','未开始'], ['doing','在做'], ['submitted','已交']];
  const bits = [];
  if (hw.course) bits.push(hw.course);
  if (hw.channel) bits.push('渠道 ' + hw.channel);
  if (hw.naming) bits.push('命名 ' + hw.naming);
  if (hw.submittedAt) bits.push('交于 ' + hw.submittedAt);
  return `<div class="hwline">
    ${hw.detail ? `<div class="hwdetail">${esc(hw.detail)}</div>` : ''}
    ${bits.length ? `<div class="hwmeta">${esc(bits.join(' · '))}</div>` : ''}
    <div class="statuses">
      ${st.map(([k, t]) => `<button class="st ${hw.status === k ? 'on' : ''}" data-s="${k}" data-act="st" data-id="${esc(it.id)}">${t}</button>`).join('')}
    </div>
  </div>`;
}

/* 时间轴页：一条左侧竖轴，所有带日期的未完成任务按截止日从近到远上下排 */
/* 时间轴主体（只返回内容片段，不写 #view）：时间轴已降级为清单页的一种展示模式
   （S.listMode==='timeline'），和「分区」共用搜索与筛选状态 —— 所以这里用 ordered()
   先按 S.q / S.filterTags 过滤，再筛"带日期且未完成"，按截止日从近到远排。 */
function renderTimelineBody(){
  const list = ordered()
    .filter(i => !i.done && i.date)
    .sort((a, b) => { const A = a.date || '', B = b.date || ''; return A < B ? -1 : A > B ? 1 : 0; });
  /* ★ 5G：这一行的「其中逾期 N 条」也按截止日算（同一行 due 表达式），
     否则区间条目会在时间轴上被算成逾期，而卡片并不红。 */
  const late = list.filter(it => {
    const due = (it.dateEnd && (!it.date || daysFromToday(it.dateEnd) >= daysFromToday(it.date))) ? it.dateEnd : it.date;
    return daysFromToday(due) < 0;
  }).length;

  if (!list.length){
    return `<div class="glass zone${rv()}" style="margin-top:clamp(30px,4vw,48px)">
        <div class="empty">还没有带日期的任务。在录入时写个日期，它就会排到这里 ——
          比如「交实验报告 924」「明天 买牙膏」「周四之前 交表」。</div>
      </div>`;
  }
  return `<div class="tl-section${rv()}">
      <div class="tl-meta">共 ${list.length} 条${late ? ' · 其中逾期 ' + late + ' 条' : ''}</div>
      <ol class="timeline">` + list.map((it, hi) => {
        /* 入场错峰最多算 12 步，否则第 30 条要等 1.5 秒才出现。
           ★ v3.36：每条改用分区的 itemHTML —— 左边那颗紧急度点、勾选框、标题、日期 chip、
           标签全都和分区同源同款（用户："除了大小、布局之外，它们的样式要统一"）。
           同源的另一个好处：FLIP 身份键（i: 行 / u: 点 / t: 标题 / d: 日期 / g: 标签）
           在两个视图里天然一一对应，切视图时点和文字是一起搬过去的，不会消失再出现。 */
        return `<li class="tl-item${rv()}"${rvd(80 + Math.min(hi, 12) * 50)} data-id="${esc(it.id)}">
          ${itemHTML(it, '', null, hwStatusHTML(it))}
        </li>`;
      }).join('') + `</ol></div>`;
}

/* ★ 0B.8：统计口径一律排除想法。种子没有"做完"这回事（它只有"用完了"= done），
   而 done 这一个字段两边共用 —— 一条用完的种子以前会被算进「今日完成」和「连续打勾」，
   统计页就多出用户没打过勾的数字。ordered() 已经在过滤种子，但统计这三处直接扫 S.items。
   抽成一个函数让三处口径只有一处真相源（以前是各写各的 filter(i => i.done)）。 */
function statDoneItems(){ return S.items.filter(i => i.done && !isSeed(i)); }
function streak(){
  const days = new Set(statDoneItems().filter(i => i.doneAt).map(i => ymd(new Date(i.doneAt))));
  let n = 0; const d = today0();
  if (!days.has(ymd(d))) d.setDate(d.getDate() - 1);
  while (days.has(ymd(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}
/* ★ v3.50 想法页（随手记）。它是**一屏**，不是清单页里的一个分区 ——
   用户定稿："在底部的导航栏新开一个，放在现在外观的位置，把外观直接替换掉"。
   分区下拉里的「想法」是它的第二入口（新建时能直接选），两处共用同一份数据和渲染。
   排序：未用完的在前，按最后长出来的时间倒序（刚动过的在最上面），再按创建时间。
   不用 cmpItem —— 那套是给"有死线的待办"排的，种子没有死线。 */
function ideaLastAt(it){
  const sp = Array.isArray(it.sparks) && it.sparks.length
    ? it.sparks[it.sparks.length - 1].at : null;
  const t = sp ? Date.parse(sp + 'T00:00:00') : 0;
  return Math.max(t || 0, it.createdAt || 0);
}
/* ---------------- ★ v5.0 想法回顾抽屉（第 1 批 1.7）----------------
   为什么要有它：调研 03 §1.1① 那位实践 GTD 五年的用户原话 ——「我可以做到很好的收集，
   脑海里任何想法都会被及时捕捉到 Inbox 里，但在整理和组织阶段做得不好，最终导致
   Inbox 里越来越多」。**收集越顺，积压越重。** 所以想法页需要一件不要求用户主动
   想起来的事：打开就撞见几条，处理完就结束。

   节奏（按用量而不是定时，见设计稿 §6.5）：
     S.ideaUsedAt 距今 ≤ 2 天 → 默认折叠、标题不带数字
                     2~7 天 → 折叠、标题带条数
                     > 7 天 → 默认展开
   选片三个槽位，**第 1 批全用本地规则**（没网也能跑；槽位 2 到第 3 批再接 AI）：
     1 沉睡最久（排除近 7 天已被浮出过的）
     2 最近 7 天新增步数最多
     3 随机一条 30 天以上没被浮出过的，跨标签优先
   上限固定 3 条、当天不重复推 —— 抄 flomo 的「限量 + 固定条数」；中文圈能长期坚持的
   人的共同点是「固定 20 分钟 + 每周一次 + 极简」，数量可调就等于一定会被调没。 */
function reviewDaysSinceUse(){
  const t = S.ideaUsedAt ? Date.parse(S.ideaUsedAt + 'T00:00:00') : 0;
  if (!t) return 999;                       // 从没用过 → 走「> 7 天」，首次打开默认展开一次
  return Math.floor((Date.now() - t) / 86400000);
}
function reviewPicked(){
  const byIdAll = new Map(S.items.map(i => [i.id, i]));
  /* 两种日期在数据里是**两种类型**，别混用一个解析函数：
       reviewedAt 是 'YYYY-MM-DD' 字符串；createdAt 是毫秒时间戳数字。
     拿字符串解析去套数字会得到 NaN，比较全为 false —— 池子直接空掉，抽屉再也不出现。 */
  const days = d => d ? (Date.now() - Date.parse(d + 'T00:00:00')) / 86400000 : 9999;
  const ageDays = i => i.createdAt ? (Date.now() - i.createdAt) / 86400000 : 9999;
  /* ★ v5.0 修 bug（用户："我刚写入的怎么就进回顾了"）：
     `reviewedAt` 为空**不能当成"很久没被浮出"**。空的意思是"从没被浮出过"，
     而"刚写下的"也从没被浮出过 —— 两个完全不同的处境被折成同一个 9999，
     新想法于是被当成陈年旧账抽了出来。
     正确下限是**创建时间**：一条想法不管多久没被浮出，都不可能超过它自己的年龄。 */
  const lastTouch = i => {
    const r = days(i.reviewedAt);
    return r === 9999 ? Math.min(ageDays(i), 9999) : r;
  };
  const fresh = i => lastTouch(i) < 7;
  /* 池子：**只收创建满 7 天的**。回顾的语义是"把你忘掉的还给你"，
     今天刚写下的还没到会被忘的程度。少了这条，抽屉会变成"再看一遍你刚做的事"，
     既没用又烦人 —— 而它全部的价值就在"我没想起来的东西被送回来了"。 */
  const pool = S.items.filter(i => isSeed(i) && !i.done
    && !seedAncestorUsed(i, byIdAll) && ageDays(i) >= 7);
  const picked = [], seen = new Set();
  const take = i => { if (i && !seen.has(i.id)){ seen.add(i.id); picked.push(i); } };

  /* 槽位 1：沉睡最久 */
  take(pool.filter(i => !fresh(i)).slice().sort((a, b) => ideaLastAt(a) - ideaLastAt(b))[0]);
  /* 槽位 2：**先看今天的 AI 关联结果**（设计稿 §8.1：回顾槽位 2 复用当天关联结果，
     0 额外调用），没有再接本地降级规则「最近 7 天新增步数最多」。
     两槽取向相反是设计如此：槽位 1 = 你完全没动的（捡回来），槽位 2 = 你还在动的（接着长）。 */
  const aiToday = !!(S.lastScanAt && ymd(new Date(S.lastScanAt)) === ymd(new Date()));
  if (aiToday){
    const withSug = pool.filter(i => !seen.has(i.id)
      && Array.isArray(i.suggest) && i.suggest.some(s => S.items.some(x => x.id === s.to)));
    take(withSug.sort((a, b) => ideaLastAt(b) - ideaLastAt(a))[0]);
  }
  /* ★ 审查修复（2026-10-04）：`S.lastOpenedSeed` 之前**只写不读**，设计稿 §6.5 槽位 2 的
     "与你最近点开的想法关联度最高"那半条规则是死状态。无 AI 时的本地近似：
     先找与最近点开那条**有直接关系**的（父子 / 血缘 / 至少共享一个标签），
     没有才回落到原来的「最近 7 天新增步数最多」。 */
  const lastOpen = S.lastOpenedSeed ? S.items.find(x => x.id === S.lastOpenedSeed) : null;
  const relatedScore = i => {
    if (!lastOpen || !i || i.id === lastOpen.id) return -1;
    if (i.parent === lastOpen.id || lastOpen.parent === i.id) return 3;
    if ((i.bornFrom || []).includes(lastOpen.id) || (lastOpen.bornFrom || []).includes(i.id)) return 2;
    return (i.tags || []).some(t => (lastOpen.tags || []).includes(t)) ? 1 : 0;
  };
  take(pool.filter(i => !seen.has(i.id) && relatedScore(i) > 0)
    .slice().sort((a, b) => relatedScore(b) - relatedScore(a) || ideaLastAt(b) - ideaLastAt(a))[0]);
  const recentSteps = i => (Array.isArray(i.sparks) ? i.sparks : [])
    .filter(s => (Date.now() - Date.parse((s.at || '') + 'T00:00:00')) <= 7 * 86400000).length;
  take(pool.filter(i => !seen.has(i.id) && recentSteps(i) > 0)
    .slice().sort((a, b) => recentSteps(b) - recentSteps(a))[0]);
  /* 槽位 3：随机一条 30 天以上没被浮出过的，跨标签优先 */
  const old = pool.filter(i => !seen.has(i.id) && lastTouch(i) > 30);
  const tagKey = i => ((i && i.tags) || [])[0] || '';
  const cross = old.filter(i => tagKey(i) !== tagKey(picked[0]));
  const rnd = a => a.length ? a[Math.floor(Math.random() * a.length)] : null;
  take(rnd(cross.length ? cross : old));
  /* 兜底：池子里就剩这么几条时别让抽屉空着（下沉顺序仍按沉睡最久） */
  pool.filter(i => !seen.has(i.id)).slice().sort((a, b) => ideaLastAt(a) - ideaLastAt(b))
    .forEach(i => { if (picked.length < 3) take(i); });
  return picked.slice(0, 3);
}
/* ★ 审查修复（2026-10-04）：§7.8 / §14 C-17 要求"三条各自被处理过 → 抽屉收起显示「今天就这样」"。
   原来只有一颗手动按钮。这里记这一轮抽屉里的三条 id，逐个被处理完就自动收尾。
   续写要"真的写入一条 spark"才算，所以那条由 seedAddSpark 调进来；
   立项 / 收起来 点了就生效，在点击处记。 */
function reviewMark(id){
  if (!id) return;
  /* 只认"这一会话里真的在抽屉里露过面"的条目（reviewShown），避免在列表里随手写三句
     续写就把今天的回顾仪式判成完成。 */
  if (!ideaUI.reviewShown || !ideaUI.reviewShown.has(id)) return;
  if (!ideaUI.reviewHandled) ideaUI.reviewHandled = new Set();
  if (ideaUI.reviewHandled.has(id)) return;
  ideaUI.reviewHandled.add(id);
  /* 记账必须是**会话级**的：每处理一条都会 refresh，池子的选片立刻换人，
     按"这一轮那三条"记账会被重置，永远收不了尾。 */
  if (ideaUI.reviewHandled.size >= 3){
    S.ideaReviewDone = ymd(new Date()); save();
    ideaUI.reviewOpen = null;
    refresh(); toast('今天就这样');
  }
}
function reviewWhy(it){
  const d = seedSleepDays(it);
  if (d > 30) return '沉了很久：' + d + ' 天没动';
  if (d > 14) return '睡了 ' + d + ' 天';
  if (d === 0) return '今天刚长过';
  return d + ' 天前动过';
}
function reviewDrawerHTML(){
  if (!S.ideaReview) return '';                       // 设置页总开关
  if (S.ideaReviewDone === ymd(new Date())) return ''; // 今天已经处理过，当天不再推
  const picked = reviewPicked();
  /* ★ 审查修复（2026-10-04）：原来"没有可推的条目"就整块 return '' —— 于是池子空掉
     之后（最典型：想法全被收起来了）底部那个**淘汰入口**也一起消失，再也点不到。
     池子空时仍然渲染一条只有淘汰行的窄抽屉：它是唯一的清理出口，不该跟着内容一起走。 */
  if (!picked.length){
    const usedOnly = S.items.filter(i => isSeed(i) && i.done).length;
    if (usedOnly < 5) return '';
    return `<div class="review-drawer${rv()}"${rvd(20)}>
      <div class="review-body">
        <p class="review-note">没有需要回顾的了。收起来的已经攒了 <b class="mono">${usedOnly}</b> 条。</p>
        <div class="review-foot">
          <button type="button" class="btn ghost" data-act="reviewpurge">清掉收起来的 ${usedOnly} 条</button>
        </div>
      </div>
    </div>`;
  }
  const d = reviewDaysSinceUse();
  const open = ideaUI.reviewOpen === null ? (d > 7) : !!ideaUI.reviewOpen;
  /* 数量角标只在"隔了 2~7 天没看"时出现。≤2 天说明你这两天一直在用想法页，
     不需要被提醒 —— 带个数字反而变成催促，而设计稿的红线之一就是"不出现催促类字样"。 */
  const showN = !open && d > 2;
  /* 这一会话里在抽屉里露过面的条目 —— 逐条处理完要据此自动收尾（reviewMark） */
  if (!ideaUI.reviewShown) ideaUI.reviewShown = new Set();
  picked.forEach(x => ideaUI.reviewShown.add(x.id));
  const items = picked.map(it => {
    const kids = S.items.filter(x => x.parent === it.id && isSeed(x)).length;
    return `<div class="review-item" data-id="${esc(it.id)}">
      <div class="ri-why">${esc(reviewWhy(it))}</div>
      <div class="ri-title">${esc(it.title)}</div>
      <div class="ri-sub">${(Array.isArray(it.sparks) ? it.sparks.length : 0)} 个子想法${kids ? ' · ↳ ' + kids : ''}</div>
      <div class="ri-acts">
        <button type="button" class="mini" data-act="sparkadd" data-rev="1" data-id="${esc(it.id)}">＋ 续写</button>
        <button type="button" class="mini" data-act="promote" data-rev="1" data-id="${esc(it.id)}">↙ 立项</button>
        <button type="button" class="mini" data-act="seeduse" data-rev="1" data-id="${esc(it.id)}">⏸ 收起来</button>
      </div>
    </div>`;
  }).join('');
  const usedN = S.items.filter(i => isSeed(i) && i.done).length;
  return `<div class="review-drawer${open ? ' open' : ''}${rv()}"${rvd(20)}>
    <button type="button" class="review-head" data-act="reviewtoggle" aria-expanded="${open ? 'true' : 'false'}">
      <span class="rh-chev" aria-hidden="true">▸</span><span class="rh-t">回顾</span>
      ${showN && picked.length ? `<span class="rh-n mono">${picked.length}</span>` : ''}
    </button>
    ${open ? `<div class="review-body">
      <p class="review-note">这几条是你最近没碰过的。一条给十秒就够 —— 补一句、立项、或者收起来。</p>
      ${items}
      <div class="review-foot">
        <button type="button" class="btn" data-act="reviewdone">今天就到这儿</button>
        ${usedN >= 5 ? `<button type="button" class="btn ghost" data-act="reviewpurge">清掉已收起的 ${usedN} 条</button>` : ''}
      </div>
    </div>` : ''}
  </div>`;
}
/* ---------------- ★ v5.0 树状图（第 2 批第 3 块） ----------------
   为什么是树状图、不是自由连线画布：自由画布的"好看"高度依赖手工摆位，
   而想法之间是**有向父子**关系 —— 有向关系天然适合分层布局，不用人摆。
   布局是 Reingold–Tilford 的简化版：后序遍历，叶子依次占一格，父节点居中在孩子上方。

   两种关系画**两种线**：
     实线 = 父子（这条是从那条**生长**出来的）
     虚线 = 血缘（这条是那几条**合并**出来的）
   合并出来的想法不属于任何人（它是根节点），所以没法靠缩进表达来源 —— 虚线补上这一块。 */
/* ★ v5.0：节点宽度 220px（原来 172）—— 节点里现在要放全部续写，
   172 只够一行 12 个汉字，一句话要折两行。TREE_H 只当"还没量之前的估值"。 */
const TREE_W = 220, TREE_H = 62, TREE_GX = 18, TREE_GY = 54;
const TREE_ZONE_GAP = 64;          // 「独立的」和「有关系的」两片之间的距离
const TREE_PERF = 80;              // 超过它就自动只画前 3 层，免得一屏几百个方块卡住
const TREE_HARD = 200;             // §6.3 / §12：超过它就别画了，提示回列表看（画出来也没法用）
/* 打开时的最小可读比例。**低于它就不要缩** —— 缩成 0.3 那种"全貌"字是读不出来的，
   用户还得先放大，那一段缩放纯属白花；宁可让他在 0.7 下横滑。 */
const TREE_MIN_K = 0.7;
const treeView = { tx: 0, ty: 0, k: 1 };
/* 最近一次 treeMapLayout 的结果（edges / lineage 是**id 对**，坐标由 mountTreeMap 量完高度再算）。
   挂在这里是为了让 treeMapHTML（产出 DOM）和 mountTreeMap（排版 + 画线）能对上同一次布局。 */
let lastTreeL = null;
/* 分段开关换挡动画播放期间上锁：这 200ms 里再点一次会打架 */
let layoutBusy = false;

function treeMapLayout(list){
  const byId = new Map(list.map(i => [i.id, i]));
  /* 折叠：收起一条，它下面整棵子树就不进布局（会话级 collapsed，和卡片流共用同一个 Set） */
  const hidden = new Set();
  list.forEach(i => {
    let p = i.parent && byId.get(i.parent), guard = 0;
    while (p && guard++ < 64){
      if (collapsed.has(p.id)){ hidden.add(i.id); break; }
      p = p.parent && byId.get(p.parent);
    }
  });
  let vis = list.filter(i => !hidden.has(i.id));
  /* 性能兜底：太多就先只画到第 3 层，剩下的靠逐条展开 */
  let clipped = 0;
  if (vis.length > TREE_PERF){
    const ids0 = new Set(vis.map(i => i.id));
    const depthOf = i => {
      let d = 0, p = i.parent && ids0.has(i.parent) ? byId.get(i.parent) : null, g = 0;
      while (p && g++ < 64){ d++; p = p.parent && ids0.has(p.parent) ? byId.get(p.parent) : null; }
      return d;
    };
    const keep = vis.filter(i => depthOf(i) < 3);
    clipped = vis.length - keep.length;
    vis = keep;
  }
  const visIds = new Set(vis.map(i => i.id));
  const kids = new Map();
  vis.forEach(i => {
    const p = (i.parent && visIds.has(i.parent)) ? i.parent : null;
    if (p){ if (!kids.has(p)) kids.set(p, []); kids.get(p).push(i); }
  });
  /* ★ v5.0：折叠钮上的数字要按**搜索过滤后的完整集合**数，不能按"折叠之后还在布局里的"数 ——
     那样一收起来，孩子不在布局里，钮自己也没了，就再也展不开（死胡同）。
     所以另建一张 rawKids：它只受搜索/标签影响，不受折叠影响。 */
  const rawKids = new Map();
  list.forEach(i => {
    if (i.parent){ if (!rawKids.has(i.parent)) rawKids.set(i.parent, []); rawKids.get(i.parent).push(i); }
  });
  /* ★ v5.0 重排（用户实测反馈）：「那些独立的、没什么关联的内容，不需要横着排一大排」。
     所以分成**两个区**：
       左区「独立的」—— 既没有父、也没有子的，排成 **2 列**往下长。
         为什么是 2 列而不是横着一排：手机是竖的，纵向滚动是免费的、横向要手势；

    </div>`;
  }
  view.innerHTML = h;
  mountTreeMap();
  /* 续写输入框：重新渲染后把焦点还回去，否则用户点开还得再点一次输入框。

  const inp = document.getElementById('sp_in');
  if (inp){
    inp.focus();
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter'){
        e.preventDefault();

        const t2 = it_byId(inp.dataset.id);

      }
      else if (e.key === 'Escape'){ e.preventDefault(); ideaUI.sparkOpen = null; refresh(); }

/* 按 id 找条目 —— 想法页里多处要用，抽出来免得每次现写 find */
function it_byId(id){ return id ? S.items.find(x => x.id === id) : null; }

/* ---------------- 随手记 / 种子：动作层（与渲染层分开，渲染只出 HTML） ---------------- */
/* 新建一条种子。默认进想法分区、kind=seed、空时间轴。
   raw 也存下来 —— 种子常在漫长一段话里长出来，原文要留着回溯（需求 B5 的"留痕"延伸到新建）。 */
function newSeed(title, extra){
  const t = String(title || '').trim();
  if (!t){ toast('写点什么再记'); return null; }
  const it = Object.assign({
    id: uid(), raw: t, title: t, kind: 'seed',
    date: null, dateEnd: null, monthOnly: false, time: null, repeat: null,
    zone: 'idea', tags: [], done: false, doneAt: null,
    createdAt: Date.now(), hw: null, pri: 0,
    sparks: [], bornFrom: null, promoted: null,
    /* ★ v5.0：
         parent      —— 父子层级**复用已有字段**（清单页的复合目标也用它），不新开 parentId。
                        想法页靠它做缩进；指向的条目不存在时当根节点。
         done/doneAt —— 「用过了」也**复用已有字段**，只是视觉从"打勾"改成"变暗"。
         suggest     —— AI 建议的挂载关系 [{to, why, at}]，未处理；接受 → 写 parent，拒绝 → 删掉
         reviewedAt  —— 上次被回顾抽屉浮出的日期（当天不重复推 + 近 7 天不重复浮出）
         aiUse       —— 当天 AI 用量 {d:'2026-10-03', n:2}，跨日归零 */
    parent: null, suggest: [], reviewedAt: null, aiUse: null
  }, extra || {});
  S.items.unshift(it);
  justAdded = { id: it.id, t: Date.now() };
  save();
  return it;
}
/* 续写：默认给今天。种子不需要用户每次手填日期 —— 长出来的那天就是今天。 */
function seedAddSpark(it, text){
  const tx = String(text || '').trim();
  if (!tx) return false;
  if (!Array.isArray(it.sparks)) it.sparks = [];
  it.sparks.push({ at: ymd(new Date()), text: tx });
  save();
  reviewMark(it.id);      // 回顾槽位的"续写并成功写入"才算处理过（§14 C-17）
  return true;
}
/* ★ 5I 追加修复（用户真机）：把一张想法卡**钉在原来的屏幕位置**。
   打开行内续写框、写完收起、以及改完之后，想法页会整块重排 —— 两件事都会让用户正在看的
   那张卡从视口里跑掉：
     ① 下滑续写那一下会写 `S.ideaUsedAt`，顶部那块「回顾」抽屉随即收起，整列内容上移
        （实测卡片屏幕 top 从 221 直接变 -333，输入框跟着跑出视口 —— 用户说的"输入框那个
        区域并不在我能看到的界面里边"）；
     ② 续写写下的"今天这一步"改变 ideaLastAt，这张卡跳到列表最前。
   做法：先量它现在的屏幕位置，跑完 work()（里面会 refresh，而 refresh 是 rAF 里重建 DOM 的）
   之后逐帧把差值补回来。**不能只补一帧** —— 抽屉收起是 rAF 逐帧的高度动画（revealAnim），
   量一次只补第一帧，后面的位移照样跑掉；所以这里跟着补 SEED_KEEP_FRAMES 帧（≈0.4s，
   与项目里 240~280ms 的动画同量级），位置稳了就自然不动。 */
const SEED_KEEP_FRAMES = 12;
const SEED_KEEP_MS = 300;              // 兜底：rAF 被系统降频时按时间收
function keepSeedPlace(id, work){
  const cardEl = () => {
    const s = id ? view.querySelector('.item.seed[data-id="' + id + '"]') : null;
    return s ? s.closest('.idea-card') : null;
  };
  const c0 = cardEl();
  /* 「你看得见的那张卡」才需要钉 —— 卡片整个在视口外时（合成事件/离屏状态）没有"原位"可言，
     钉它只会把页面凭空滚走，反而把别人正在看的内容顶掉。 */
  const r0 = c0 ? c0.getBoundingClientRect() : null;
  const top0 = (r0 && r0.bottom > 0 && r0.top < window.innerHeight) ? r0.top : null;
  work();
  if (top0 == null) return;
  const t0 = Date.now();
  let left = SEED_KEEP_FRAMES, stop = false, stable = 0;
  /* 第四条收工条件：**别人又刷新了一次界面**（说明页面已经被另一个动作改了），
     立刻收工 —— 不然它会替后来那次改动继续补偿，等于跟用户的下一步抢。
     （verify-idea 5.15 就是这条抓出来的：续写之后再 refresh 一次，锚点还在补。） */
  const gen = refreshSeq;
  const cancel = () => { stop = true; };
  window.addEventListener('pointerdown', cancel, true);
  window.addEventListener('touchstart', cancel, true);
  window.addEventListener('wheel', cancel, true);
  const done = () => {
    window.removeEventListener('pointerdown', cancel, true);
    window.removeEventListener('touchstart', cancel, true);
    window.removeEventListener('wheel', cancel, true);
  };
  const tick = () => {
    /* ⚠️ 收工判断必须在**滚之前**：rAF 被系统降频时，第一帧可能过了几百毫秒才来，
       那时用户/别的动作早就走远了 —— 先滚一下再用 stale 的 top0 去补，等于凭空把页面挪走
       （verify-idea 5.15 的合并用例就是这么被弄红的：A/B 里把这次滚动去掉就 230/0）。 */
    if (stop || refreshSeq !== gen){ done(); return; }
    const c = cardEl();
    if (c){
      const dy = c.getBoundingClientRect().top - top0;
      if (Math.abs(dy) > 1){ window.scrollBy(0, dy); stable = 0; }
      else stable++;
    }
    if (stable >= 3 || Date.now() - t0 > SEED_KEEP_MS || --left <= 0){ done(); return; }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
/* ★ 5I：续写写完的收尾，**记下 / 回车两条出口共用**：
   ① **收起行内输入框** —— 用户原话："我按一下记下，或者说按一下回车，这条想法就算记录完了呗？
      那怎么还让我记下一条想法"。原来 `ideaUI.sparkOpen` 一直留着（`seedAddSpark` 不动它），
      于是输入框清空后还挂在卡片上，等你再写一条。
   ② 顺便把它钉回原来的屏幕位置（见 keepSeedPlace）。 */
function finishSparkWrite(id){
  if (!id) return;
  keepSeedPlace(id, () => {
    ideaUI.sparkOpen = null;
    refresh();
  });
}
/* 长出：从这条分出去一条新的。新种子保留原文作为"来自"的线索，但**不复制**时间轴 ——
   时间轴是这条种子自己的生长记录，复制过去会让两条看起来一模一样，反而看不出是从哪儿长出来的。 */
function seedGrow(it, title){
  const t = String(title || '').trim();
  if (!t){ toast('写点什么再生长'); return null; }
  /* ★ v5.0：长出＝**挂到这条下面的一条新想法**（parent 指向它），不再是平铺的第二条种子。
     父子的缩进本身就把"从谁出来"说清楚了，所以不再往 bornFrom 里塞来源 ——
     bornFrom 从此只表示"合并自哪几条"，一个字段一个意思，不兼职。
     **措辞上刻意不说"子想法"**：这条新想法有时是"归属"（本来就是它的一部分），
     有时是"在它身上发展出来的新东西" —— 用"子/父"会把关系说死。
     新种子默认展开父节点，否则刚长出来的那条会被折叠在下面、看不见。 */
  const nx = newSeed(t, { tags: [...(it.tags || [])], pri: it.pri || 0, parent: it.id });
  if (!nx) return null;
  collapsed.delete(it.id);
  save();
  return nx;
}
/* 立项：把种子变成一条真正的待办。种子**留在想法区**（用户定稿），只打一个「已立项」小标，
   点它跳到那条待办。待办删掉也不影响种子 —— 所以这里只存 id，不建立双向依赖。 */
/* ★ v5.0：把一条已有条目**就地**变成想法（录入提示条的那个按钮用）。
   与 addItem 里「行尾 ?」那条路保持同一形状 —— 两条路造出来的种子必须一模一样，
   否则一条有时间轴起点、一条是空轴，用户会以为是坏的。 */
function taskToSeed(it, quiet){

     （还带着种子标记）。先确认它还在库里。 */
  if (S.items.indexOf(it) < 0) return null;
  it.kind = 'seed';
  it.zone = 'idea';
  it.date = null; it.dateEnd = null; it.monthOnly = false; it.time = null; it.repeat = null;
  it.hw = null; it.promoted = null; it.bornFrom = null; it.parent = null;
  /* foldedByParent 是"被父任务顺手收起"的待办标记，变成种子之后没有意义 —— 一并清掉。

  if (!Array.isArray(it.sparks)) it.sparks = [];
  if (!Array.isArray(it.suggest)) it.suggest = [];
  if (it.reviewedAt === undefined) it.reviewedAt = null;
  if (it.aiUse === undefined) it.aiUse = null;
  S.ideaUsedAt = ymd(new Date());
  save(); refresh();
  if (!quiet){
    toast('已存成想法 —— 在底栏左端那颗灯泡里', '去看看', () => {
      goView('idea');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
  return it;
}
/* ★ v5.0 立项三步走（用户定稿）：点「立项」→ 预填 → 弹确认页 → 确认才真立项。

  if (sparkIdx == null && it.promoted && S.items.some(x => x.id === it.promoted)){ toast('这条已经立过项了'); return; }

    dir: 'right',

    title: '立项确认',

/* ---------------- ★ v5.0 多选批量：逐条队列（第 2 批第 1 块） ----------------
   背景：多选之后点「立项」这类动作，**不能把 N 个弹层同时塞进一屏**（用户原话：
   「肯定不能让它们同时呈现在一个页面上……编辑完这个，点击确定并跳转后，下一个卡片就呈现出来了」）。
   做法是一个队列：一次只开一个，**确定和取消都算"过了一条"**，自动开下一条，
   全部走完给一句总结。
   「合并 / 收起来 / 删除」是**一次性**动作，不进队列（没什么可逐条的）。 */
/* made：这一批新产生的条目（目前只有"批量生长"会产），供收尾时做**整批一次**的撤销 */
const batchQ = { ids: [], i: 0, kind: '', done: 0, made: [] };
function batchStart(kind){
  const ids = [...ideaUI.mergeSel].filter(id => S.items.some(x => x.id === id && isSeed(x)));
  if (!ids.length){ toast('先勾几条想法'); return; }
  ideaUI.mergeMode = false; ideaUI.mergeSel.clear();
  batchQ.ids = ids; batchQ.i = 0; batchQ.kind = kind; batchQ.done = 0; batchQ.made = [];
  batchStep();
}
function batchStep(){
  /* 队列里的条目可能在处理过程中没了（比如上一条立项时被顺手删了）→ 跳过 */
  while (batchQ.i < batchQ.ids.length && !S.items.some(x => x.id === batchQ.ids[batchQ.i])) batchQ.i++;
  if (batchQ.i >= batchQ.ids.length){ batchFinish(); return; }
  const it = S.items.find(x => x.id === batchQ.ids[batchQ.i]);
  const n = batchQ.i + 1, total = batchQ.ids.length;
  const tag = '（' + n + '/' + total + '）';
  refresh();                                   // 先把卡片重渲染一遍，当前这条才滚得进来
  if (batchQ.kind === 'promote' || batchQ.kind === 'edit'){
    /* 立项已经立过的不再重复弹（弹了也是"已经立过项"就没了），直接算过 */
    if (batchQ.kind === 'promote' && it.promoted){ batchAdvance(); return; }
    setModalAfterClose(batchAdvance);
    if (batchQ.kind === 'promote') openSeedPromote(it); else openEdit(it);
    return;
  }
  if (batchQ.kind === 'spark'){
    setModalAfterClose(batchAdvance);
    openSeedPrompt('续写 ' + tag, it.title, '现在多了什么信息？',
      v => { if (v && v.trim()) seedAddSpark(it, v); });
    return;
  }
  if (batchQ.kind === 'grow'){
    setModalAfterClose(batchAdvance);
    openSeedPrompt('生长 ' + tag, it.title, '从这里分出去的那条',
      v => { if (v && v.trim()){ const nx = seedGrow(it, v); if (nx) batchQ.made.push(nx); } });
    return;
  }
  batchFinish();
}
function batchAdvance(){ batchQ.done++; batchQ.i++; batchStep(); }
function batchFinish(){
  const n = batchQ.done;
  const kind = batchQ.kind;
  /* ★ 2026-10-06 审查修复（撤销出口不齐）：批量生长原来只弹一句「过完 N 条了」，
     没有撤销 —— 而同批的合并 / 收起来 / 删除都配了撤销（见 §10 的一致性原则）。
     批量动作的撤销应当是**整批一次**：把这一批长出来的新想法记在 batchQ.made 里，
     撤销＝一次性把它们删掉（父条目的折叠态一并还原）。 */
  const made = batchQ.made.slice();
  batchQ.ids = []; batchQ.i = 0; batchQ.kind = ''; batchQ.done = 0; batchQ.made = [];
  refresh();
  if (kind === 'grow' && made.length){
    const keep = S.items.filter(x => made.indexOf(x) < 0);
    toast('长出了 ' + made.length + ' 条新想法', '撤销', () => { S.items = keep; save(); refresh(); });
    return;
  }
  toast(n ? ('过完 ' + n + ' 条了') : '这几条都跳过了');
}
/* 合并：勾两条以上 → 生出一条新种子。**原种子不被吃掉**（用户定稿），只挂一行"来自 A ＋ B"。
   新种子的标题默认是各条标题用 ＋ 连起来，用户可以在编辑器里改。 */
/* ★ 真 bug（用户实测："长按一条拖到下一条上，它直接加入到那个里面了。
   我希望的是它先进入编辑页面，等我编辑完并点击保存之后，再加入到那个里面；
   如果我点击取消，就不加入"）：
   原实现是"先落库、再编辑"—— seedMerge() 里 newSeed() 立刻把合并结果推进 S.items 并 save()，
   之后才 openEdit(nx)。于是取消只是关掉弹层，那条已经躺在列表里了。
   修法：合并只**备好草稿**（不落库），把草稿当"新建"送进编辑器 —— 编辑器那条 isNew 分支
   正是"点保存才 S.items.push"。点取消什么都不发生，两条原想法一个字不动。
   附带的结果正好合用户意：isNew 时那颗「删除」键本来就不显示（模板里 m_del 带 display:none），
   所以合并编辑页上只有「取消 / 保存」。 */
function seedMergeDraft(ids){
  const list = (ids || []).map(id => S.items.find(x => x.id === id)).filter(Boolean);
  /* 只收未用完的种子 —— 已归档的不该参与合并，否则会凭空"复活"一条老想法 */
  const live = list.filter(isSeed).filter(x => !x.done);
  if (live.length < 2){ toast('至少勾两条还在用的想法'); return null; }
  return {
    id: uid(), raw: live.map(x => x.title).join(' ＋ '), title: live.map(x => x.title).join(' ＋ ').slice(0, 60),
    kind: 'seed', zone: 'idea',
    date: null, dateEnd: null, monthOnly: false, time: null, repeat: null,
    tags: [...new Set(live.flatMap(x => x.tags || []))].slice(0, TAG_PER_ITEM),
    done: false, doneAt: null, createdAt: Date.now(), hw: null, pri: 0,
    sparks: [], bornFrom: live.map(x => x.id),
    promoted: null, suggest: [], reviewedAt: null, aiUse: null
  };
}
/* 拖到另一条上 / 批量合并，走的是同一条路：草稿 → 编辑页 → 保存才真正生成。
   合并是根节点，不继承任何一方的 parent 与层级。
   不给 toast（编辑器自己就有「取消 / 保存」两个键，再加一层提示只是噪音，
   而且弹层开着时页面被锁，提示条既点不到也容易被压住）。 */
function seedMergeBegin(ids){
  const draft = seedMergeDraft(ids);
  if (!draft) return null;
  openItemEditor(draft, true, null, null, { title: '合并成一条新想法', okLabel: '保存' });
  return draft;
}
/* 旧的直接落库版保留给脚本/其他调用点用（现在全 App 已无调用点，走 seedMergeBegin）。 */
function seedMerge(ids){
  const draft = seedMergeDraft(ids);

  const nx = newSeed(draft.title, {

  if (nx){
    /* ★ 审查修复：合并和"收起来/删除"同属一次性动作，设计稿要求配撤销。 */
    toast('合并成一条新想法，原来两条都留着', '撤销', () => { remove(nx); });
  }
  return nx;
}

  hits.forEach(i => {

    while (cur.parent && byId.has(cur.parent) && guard++ < PARENT_GUARD){
      const p = byId.get(cur.parent);
      if (hit.has(p.id)){ owner = p.id; break; }
      cur = p;
    }
    if (owner){ if (!kids.has(owner)) kids.set(owner, []); kids.get(owner).push(i); }

/* 滚动监听全局只挂一次（passive，不抢滚动）：它自己找 #statJump，找不到就空转。 */
window.addEventListener('scroll', () => {
  if (!document.getElementById('statJump')) return;
  const y = window.scrollY || 0;
  const vh = window.innerHeight || 1;
  const max = Math.max(0, document.documentElement.scrollHeight - vh);
  const dy = y - sjLastY;
  if (Math.abs(dy) >= 4) sjDir = dy > 0 ? 'down' : 'up';
  sjLastY = y;

  updateStatJump(true);

/* 明细列表的 HTML。复用清单页那一套 itemHTML + .goal-kids 结构。
   统计页是**回看**的地方，所以不折叠（不传 goalInfo → 没有 ▾ 角标），全部展开。 */
function statItemsHTML(hits){
  const t = statTreeOf(hits);
  const seen = new Set();          // 环路兜底：同一条最多画一次（脏 parent 也不至于转死）
  function walk(it){
    if (seen.has(it.id)) return '';
    seen.add(it.id);
    const ch = t.kids.get(it.id) || [];
    const kidsHTML = ch.length
      ? `<div class="goal-kids" data-kids="${esc(it.id)}">` + ch.map(walk).join('') + `</div>`
      : '';
    /* itemHTML 第 5 个参数 = 「这一行不画删除按钮」：统计页误删代价高（用户拍定）。
       勾选框与标题照旧可点（取消勾选 / 跳详情）。 */
    return itemHTML(it, kidsHTML, null, '', true);
  }
  return t.roots.map(walk).join('');
}
/* 「连续打勾」子页不是条目列表，而是按天。**只列有打勾记录的那天** ——
   没有记录的日子列出来只会是一串"没打勾"的灰字噪音（这个取舍写在回报里）。 */
function statStreakDays(limit){
  const days = new Map();
  statDoneItems().forEach(i => {
    if (!i.doneAt) return;
    const d = ymd(new Date(i.doneAt));
    days.set(d, (days.get(d) || 0) + 1);
  });
  return [...days.entries()]
    .sort((a, b) => (a[0] < b[0] ? 1 : a[0] > b[0] ? -1 : 0))
    .slice(0, limit || 30);
}
